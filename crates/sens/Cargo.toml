[package]
name = "sens"
version = "0.42.3"
edition = "2021"
license-file = "../../LICENSE"
description = "Independent sens core · Незалежне ядро sens · Unabhängiger sens-Kern"

[lib]
path = "src/lib.rs"

[[test]]
name = "build_projection_transfer"
path = "build_support/projection_transfer.rs"

# This is a manually invoked comparison against the isolated Rust reference
# codec, not a production example or default Cargo test target.
[[example]]
name = "zig_f3c_matched_bench"
test = false
required-features = ["rust-f3-reference"]

[features]
default = []
benchmark-ast-visits = []
# Історичний Rust T5-кодек не вмикається типово. Його можна явно ввімкнути
# лише для порівняльних/міграційних тестів; робочий фізичний шлях — Zig/T5M.
rust-t5-reference = []
rust-f3-reference = ["rust-t5-reference"]

# Rust T5-reference consumers are opt-in; default targets use only Zig/T5M.

[[example]]
name = "bench_direct_t5m"
path = "examples/bench_direct_t5m.rs"
required-features = ["rust-t5-reference"]

[[example]]
name = "frame3_f3_bench"
path = "examples/frame3_f3_bench.rs"
required-features = ["rust-f3-reference"]

[[example]]
name = "frame3_frame_demo"
path = "examples/frame3_frame_demo.rs"
required-features = ["rust-t5-reference"]

[[example]]
name = "frame3_one_byte_research"
path = "examples/frame3_one_byte_research.rs"
required-features = ["rust-t5-reference"]

[[example]]
name = "frame3_real_files_bench"
path = "examples/frame3_real_files_bench.rs"
required-features = ["rust-t5-reference"]

[[example]]
name = "frame3_v2_bench"
path = "examples/frame3_v2_bench.rs"
required-features = ["rust-t5-reference"]

[[example]]
name = "frame3_v2_paired_bench"
path = "examples/frame3_v2_paired_bench.rs"
required-features = ["rust-t5-reference"]

[[example]]
name = "frame3_v3_bench"
path = "examples/frame3_v3_bench.rs"
required-features = ["rust-t5-reference"]

[[example]]
name = "physical_sens_d5_hot_bench"
path = "examples/physical_sens_d5_hot_bench.rs"
required-features = ["rust-t5-reference"]

[[example]]
name = "physical_sens_hot_bench"
path = "examples/physical_sens_hot_bench.rs"
required-features = ["rust-t5-reference"]

[[example]]
name = "physical_t5_phase_probe"
path = "examples/physical_t5_phase_probe.rs"
required-features = ["rust-t5-reference"]

[[example]]
name = "two_codec_small_programs"
path = "examples/two_codec_small_programs.rs"
required-features = ["rust-t5-reference"]

[[example]]
name = "zig_t5_matched_bench"
path = "examples/zig_t5_matched_bench.rs"
required-features = ["rust-t5-reference"]

[dev-dependencies]
# Ці залежності використовують лише тести; вони не входять до робочого
# середовища бібліотеки та не розширюють її доступ до операційної системи.
sens-host = { path = "../sens-host" }
# Фізичний шлях Zig/T5M перевіряється в тестах sens-cli, без циклу залежностей.
serde_json = "1"

[[example]]
name = "dot_bench"
path = "examples/dot_bench.rs"
test = false
