[package]
name = "sens"
version = "0.41.0"
edition = "2021"
license-file = "../../LICENSE"
description = "Independent sens core · Незалежне ядро sens · Unabhängiger sens-Kern"

[lib]
path = "src/lib.rs"

[dependencies]
# Machine transport/artifact records already derive serde; restore the
# manifest edges recorded in Cargo.lock. Serde provides no OS capabilities.
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
# Tests may opt into the explicit host capability crate, while the shipped
# sens library uses serde for data-only records, without direct
# filesystem/network/process access.
# Тести можуть явно підключати host-capability crate, тоді як сама бібліотека
# sens лишається без runtime-залежностей і прямого доступу до ОС.
sens-host = { path = "../sens-host" }
