[package]
name = "sens"
version = "0.42.1"
edition = "2021"
license-file = "../../LICENSE"
description = "Independent sens core · Незалежне ядро sens · Unabhängiger sens-Kern"

[lib]
path = "src/lib.rs"

[[test]]
name = "build_projection_transfer"
path = "build_support/projection_transfer.rs"

# This is a manually invoked comparison against the isolated Rust reference
# codec, not a production example or default Cargo test target.
[[example]]
name = "zig_f3c_matched_bench"
test = false
required-features = ["rust-f3-reference"]

[features]
default = []
benchmark-ast-visits = []
# Історичний Rust T5-кодек не вмикається типово. Його можна явно ввімкнути
# лише для порівняльних/міграційних тестів; робочий фізичний шлях — Zig/T5M.
rust-t5-reference = []
rust-f3-reference = ["rust-t5-reference"]

# Rust T5-reference consumers are opt-in; default targets use only Zig/T5M.

