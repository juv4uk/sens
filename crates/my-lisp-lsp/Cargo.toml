[package]
name = "my-lisp-lsp"
version = "0.41.0"
edition = "2021"
license-file = "../../LICENSE"
description = "Language Server Protocol adapter for my-lisp · LSP-adapter dlia my-lisp"

[[bin]]
name = "my-lisp-lsp"
path = "src/main.rs"

[dependencies]
# The only dependency: the canonical my-lisp core. The parser, Expr spans
# and LanguageError are reused unchanged — the LSP never re-parses .my.
my-lisp = { path = "../my-lisp" }
