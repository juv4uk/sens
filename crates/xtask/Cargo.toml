[package]
name = "xtask"
version = "0.1.0"
edition = "2021"
license-file = "../../LICENSE"
description = "Project verification/policy tool · Інструмент верифікації/політик проєкту · Verifizierungs-/Richtlinien-Werkzeug"
publish = false

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
sens = { path = "../sens", default-features = false }
sens-cli = { path = "../sens-cli", features = ["zig-transport"] }

[dev-dependencies]
