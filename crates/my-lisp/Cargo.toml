[package]
name = "my-lisp"
version = "0.41.0"
edition = "2021"
license-file = "../../LICENSE"
description = "Independent my-lisp core · Незалежне ядро my-lisp · Unabhängiger my-lisp-Kern"

[lib]
path = "src/lib.rs"

[dependencies]

[dev-dependencies]
# Tests may opt into the explicit host capability crate, while the shipped
# my-lisp library itself keeps an empty runtime dependency set and no direct
# filesystem/network/process access.
# Тести можуть явно підключати host-capability crate, тоді як сама бібліотека
# my-lisp лишається без runtime-залежностей і прямого доступу до ОС.
my-lisp-host = { path = "../my-lisp-host" }
