[package]
name = "sens-cli"
version = "0.42.1"
edition = "2021"
license-file = "../../LICENSE"

[[bin]]
name = "sens"
path = "src/main.rs"

[[bin]]
name = "guard-reference"
path = "src/bin/guard-reference.rs"

[[bin]]
name = "guard-reference-schema-check"
path = "src/bin/guard-reference-schema-check.rs"

[[bin]]
name = "wsm-fs-record-producer"
path = "src/bin/wsm-fs-record-producer.rs"

[[bin]]
name = "wsm-fs-record-consumer"
path = "src/bin/wsm-fs-record-consumer.rs"

[[bin]]
name = "cml-export"
path = "src/bin/cml-export.rs"

[[bin]]
name = "sens-to-sens"
path = "src/bin/sens-to-sens.rs"

[[bin]]
name = "sens-trit"
path = "src/bin/sens-trit.rs"

[[bin]]
name = "lisp-source-guard"
path = "src/bin/lisp-source-guard.rs"

[[bin]]
name = "lisp-data-schema-guard"
path = "src/bin/lisp-data-schema-guard.rs"

[features]
# Owner decision 2026-10-14: Zig is the DEFAULT physical transport codec.
# T5M is the default physical .sens WIRE FORMAT; legacy T5 is explicit.
# F3C remains an explicit tiny .senc route.
# The SENS reader/evaluator alone owns semantics and execution admission.
default = ["zig-transport"]
zig-transport = ["wsm-guard-core/zig-source"]
# Opt-in instrumentation for benchmarks of physical binary SENS programs.
benchmark-ast-visits = ["sens/benchmark-ast-visits"]
# Without this default, physical CLI commands fail closed; there is no Rust fallback.

[dependencies]
sens = { path = "../sens", default-features = false }
sens-host = { path = "../sens-host" }
sens-lsp = { path = "../sens-lsp" }
wsm-common-lisp-kernel = { path = "../wsm-common-lisp-kernel" }
wsm-prolog-kernel = { path = "../wsm-prolog-kernel" }
wsm-clips-kernel = { path = "../wsm-clips-kernel", features = ["native-clips"] }
wsm-datalog-kernel = { path = "../wsm-datalog-kernel" }
wsm-guard-core = { path = "../wsm-guard-core", default-features = false }
rustyline = { version = "14.0.0", features = ["with-file-history"] }
ratatui = { version = "0.30.2", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# Keep integration tests on the production Zig/T5M path. Rust T5 is retired.
sens = { path = "../sens", default-features = false }
