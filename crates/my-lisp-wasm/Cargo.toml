[package]
name = "my-lisp-wasm"
version = "0.40.0"
edition = "2021"
license-file = "../../LICENSE"
description = "WebAssembly bindings for the my-lisp engine · WASM-прив'язки до рушія my-lisp · WebAssembly-Bindungen für die my-lisp-Engine"

[lib]
crate-type = ["cdylib"]

[dependencies]
my-lisp = { path = "../my-lisp" }
my-lisp-literate = { path = "../my-lisp-literate" }
my-lisp-lsp = { path = "../my-lisp-lsp" }
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"

[dev-dependencies]
wasm-bindgen-test = "0.3"


# Release profile (opt-level = "z", lto = true) is defined at the workspace root.
# Профіль release визначено в корені workspace.
# Release-Profil ist im Workspace-Root definiert.
