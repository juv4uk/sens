<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1022" />
    <meta name="description" content="my-lisp CLI in the browser — no install needed · my-lisp CLI у браузері — без встановлення · my-lisp-CLI im Browser — keine Installation nötig" />
    <title>my-lisp-cli (Web)</title>
    <style>
      :root {
        color-scheme: dark;
      }
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #0b1022;
        color: #d7f5e6;
        font-family: "Cascadia Code", "Fira Code", Consolas, "Courier New", monospace;
      }
      #shell {
        display: flex;
        flex-direction: column;
        height: 100%;
        max-width: 900px;
        margin: 0 auto;
        padding: 0 12px;
        box-sizing: border-box;
      }
      header {
        padding: 16px 4px 8px;
        border-bottom: 1px solid #1f2a44;
      }
      header h1 {
        margin: 0 0 4px;
        font-size: 1.1rem;
        color: #ff9d5c;
      }
      header p {
        margin: 2px 0;
        font-size: 0.82rem;
        color: #7fd8c9;
      }
      #log {
        flex: 1;
        overflow-y: auto;
        padding: 10px 4px;
        white-space: pre-wrap;
        word-break: break-word;
        font-size: 0.92rem;
        line-height: 1.45;
      }
      .line-input { color: #7fd8c9; }
      .line-value { color: #d7f5e6; }
      .line-error { color: #ff6b6b; }
      .line-system { color: #6c7a9c; }
      #input-row {
        display: flex;
        align-items: center;
        border-top: 1px solid #1f2a44;
        padding: 10px 4px 16px;
        gap: 8px;
      }
      #prompt {
        color: #ff9d5c;
        white-space: nowrap;
      }
      #input {
        flex: 1;
        background: transparent;
        border: none;
        outline: none;
        color: #d7f5e6;
        font: inherit;
        font-size: 0.95rem;
      }
      #input:disabled { color: #4a5578; }
    </style>
  </head>
  <body>
    <div id="shell">
      <header>
        <h1>my-lisp-cli · Web</h1>
        <p>A small language that grows itself, running in your browser — no install needed.</p>
        <p>Маленька мова, що вирощує себе, прямо в браузері — без встановлення.</p>
        <p>Eine kleine Sprache, die sich selbst wachsen lässt — im Browser, ohne Installation.</p>
      </header>
      <div id="log"></div>
      <div id="input-row">
        <span id="prompt">my-lisp&gt;</span>
        <input id="input" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" disabled placeholder="Loading my-lisp WASM…" />
      </div>
    </div>

    <!-- WASM loader shim: registers window.loadMyLispWasm. Same convention as public/index.html
         so scripts/make-portable-web.mjs can embed the WASM binary into a standalone HTML file. -->
    <script src="./wasm-loader.js"></script>
    <script>
      // The WASM `evaluate()` call keeps a persistent session: crates/my-lisp-wasm
      // holds a thread_local Session across calls and preloads lib/core.my.fasl on
      // first use (see crates/my-lisp-wasm/src/lib.rs), so the standard library is
      // available from the first line and definitions survive between lines. Each
      // submitted line is therefore evaluated exactly once, directly into that
      // session — no committed-buffer replay is needed or wanted.
      // WASM-виклик `evaluate()` тримає сталу сесію: crates/my-lisp-wasm зберігає
      // thread_local Session між викликами та підвантажує lib/core.my.fasl при
      // першому використанні (див. crates/my-lisp-wasm/src/lib.rs), тож стандартна
      // бібліотека доступна з першого рядка, а визначення живуть між рядками.
      // Кожен введений рядок обчислюється рівно один раз, просто в цю сесію —
      // переобчислення всього буфера не потрібне й не бажане.
      const history = [];
      let historyIndex = -1;
      let currentSurface = "sens";
      const promptEl = document.getElementById("prompt");

      function updatePrompt() {
        promptEl.textContent = `my-lisp[${currentSurface}]>`;
      }

      function handleMetaCommand(line, wasmModule) {
        const parts = line.split(/\s+/);
        const command = parts[0];
        if (command === ":допомога" || command === ":help") {
          printLine("Поверхні: :мова sens | ук | укр | en | sa", "line-system");
          printLine("Технічний alias: :surface sens | ук | укр | en | sa", "line-system");
          return true;
        }
        if (command !== ":мова" && command !== ":surface") return false;
        if (parts.length === 1) {
          printLine(`Поточна поверхня: ${currentSurface}`, "line-system");
          return true;
        }
        if (parts.length !== 2) {
          printLine("Поверхня приймає рівно одне ім'я.", "line-error");
          return true;
        }
        try {
          currentSurface = wasmModule.set_surface(parts[1]);
          updatePrompt();
          printLine(`Поверхня: ${currentSurface}`, "line-system");
        } catch (error) {
          printLine("Помилка перемикання поверхні: " + String(error), "line-error");
        }
        return true;
      }

      async function main() {
        let wasmModule;
        try {
          wasmModule = await window.loadMyLispWasm();
        } catch (error) {
          printLine("Error: could not load the my-lisp WASM module: " + error, "line-error");
          return;
        }

        currentSurface = wasmModule.current_surface();
        updatePrompt();
        printLine("sens Web — default binary SENS; executable function heads are exact Function8.", "line-system");
        printLine("Людські назви лише явно: :мова ук | укр | en | sa · допомога: :допомога · Ctrl-L очищає екран.", "line-system");
        printLine("", "line-system");

        inputEl.disabled = false;
        inputEl.placeholder = "(00001100 2 3)";
        inputEl.focus();

        inputEl.addEventListener("keydown", (event) => {
          if (event.key === "Enter") {
            event.preventDefault();
            void submit(wasmModule);
          } else if (event.key === "ArrowUp") {
            event.preventDefault();
            if (history.length === 0) return;
            historyIndex = Math.max(0, (historyIndex === -1 ? history.length : historyIndex) - 1);
            inputEl.value = history[historyIndex] ?? "";
          } else if (event.key === "ArrowDown") {
            event.preventDefault();
            if (historyIndex === -1) return;
            historyIndex += 1;
            if (historyIndex >= history.length) {
              historyIndex = -1;
              inputEl.value = "";
            } else {
              inputEl.value = history[historyIndex];
            }
          } else if (event.key === "l" && event.ctrlKey) {
            event.preventDefault();
            logEl.innerHTML = "";
          }
        });
      }

      async function submit(wasmModule) {
        const line = inputEl.value.trim();
        if (!line) return;
        inputEl.value = "";
        history.push(line);
        historyIndex = -1;
        printLine(`my-lisp[${currentSurface}]> ${line}`, "line-input");

        if (handleMetaCommand(line, wasmModule)) return;

        try {
          const evaluation = wasmModule.evaluate(line, "my-lisp");
          for (const out of evaluation.output || []) {
            printLine(out, "line-value");
          }
          printLine(evaluation.value, "line-value");
          // The WASM session persists definitions itself, so a failed line needs
          // no JS-side bookkeeping to stay out of a replayed history.
        } catch (error) {
          const message = error && error.message ? error.message : String(error);
          printLine(currentSurface === "ук" ? message : "Error: " + message, "line-error");
        }
      }

      // The WASM session is persistent, so `evaluate()` sees only the line the
      // user just typed — no committed-buffer prefix. A `LanguageError`'s span
      // (byte offsets in its Display text: "... at / позиція / Stelle START..END")
      // is therefore already relative to that line and needs no relocation.
      // WASM-сесія стала, тож `evaluate()` бачить лише щойно введений рядок —
      // без префікса закомічених рядків. Отже `span` `LanguageError` (байтові
      // зсуви в його Display-тексті: "... at / позиція / Stelle START..END") вже
      // відносний до цього рядка, і переносити його не потрібно.

      main();
    </script>
  </body>
</html>
