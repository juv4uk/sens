<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07111f"/>
      <stop offset="55%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#17113b"/>
    </linearGradient>

    <linearGradient id="lispGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="48%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>

    <radialGradient id="coreGlow">
      <stop offset="0%" stop-color="#93c5fd" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#3b82f6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>

    <filter id="neon" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>

    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.055"/>
    </pattern>
  </defs>

  <!-- фон -->
  <rect width="1200" height="420" rx="18" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="418" rx="18" fill="none" stroke="#334155" stroke-width="2" opacity="0.7"/>
  <rect width="1200" height="420" rx="18" fill="url(#grid)"/>

  <!-- м'яке ядро -->
  <ellipse cx="600" cy="200" rx="390" ry="175" fill="url(#coreGlow)">
    <animate attributeName="opacity" values="0.55;0.85;0.55" dur="5s" repeatCount="indefinite"/>
  </ellipse>

  <!-- великі Lisp-дужки -->
  <text x="105" y="278" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="250" font-weight="200" fill="#22d3ee" opacity="0.17">(</text>
  <text x="1000" y="278" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="250" font-weight="200" fill="#a78bfa" opacity="0.17">)</text>

  <text x="125" y="278" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="250" font-weight="200" fill="url(#lispGlow)" opacity="0.58" filter="url(#neon)">
    (
    <animate attributeName="opacity" values="0.28;0.68;0.28" dur="4.6s" repeatCount="indefinite"/>
  </text>
  <text x="980" y="278" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="250" font-weight="200" fill="url(#lispGlow)" opacity="0.58" filter="url(#neon)">
    )
    <animate attributeName="opacity" values="0.68;0.28;0.68" dur="4.6s" repeatCount="indefinite"/>
  </text>

  <!-- орбіта S-виразу -->
  <ellipse cx="600" cy="205" rx="430" ry="133" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.16"
           stroke-dasharray="5 12">
    <animateTransform attributeName="transform" attributeType="XML"
                      type="rotate" from="0 600 205" to="360 600 205"
                      dur="26s" repeatCount="indefinite"/>
  </ellipse>

  <ellipse cx="600" cy="205" rx="365" ry="106" fill="none" stroke="#818cf8" stroke-width="2" opacity="0.12"
           stroke-dasharray="2 16">
    <animateTransform attributeName="transform" attributeType="XML"
                      type="rotate" from="360 600 205" to="0 600 205"
                      dur="19s" repeatCount="indefinite"/>
  </ellipse>

  <!-- рухомі атоми -->
  <g fill="#67e8f9" filter="url(#neon)">
    <circle r="5">
      <animateMotion dur="8s" repeatCount="indefinite"
        path="M170,205 C260,70 940,70 1030,205 C940,340 260,340 170,205"/>
    </circle>
    <circle r="4" fill="#c4b5fd">
      <animateMotion dur="11s" repeatCount="indefinite"
        path="M1030,205 C940,340 260,340 170,205 C260,70 940,70 1030,205"/>
    </circle>
  </g>

  <!-- Lisp-дерево зверху -->
  <g stroke="#38bdf8" stroke-width="2" fill="none" opacity="0.42">
    <path d="M600 66 V95 M600 95 L520 128 M600 95 L680 128"/>
    <path d="M520 128 L468 157 M520 128 L548 157"/>
    <path d="M680 128 L652 157 M680 128 L732 157"/>
  </g>
  <g fill="#0f172a" stroke="#67e8f9" stroke-width="2">
    <circle cx="600" cy="58" r="13"/>
    <circle cx="520" cy="132" r="10"/>
    <circle cx="680" cy="132" r="10"/>
    <circle cx="468" cy="161" r="8"/>
    <circle cx="548" cy="161" r="8"/>
    <circle cx="652" cy="161" r="8"/>
    <circle cx="732" cy="161" r="8"/>
  </g>

  <!-- пульс канон() -->
  <g transform="translate(600,58)">
    <circle r="26" fill="#38bdf8" opacity="0.08">
      <animate attributeName="r" values="18;34;18" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.12;0.02;0.12" dur="3s" repeatCount="indefinite"/>
    </circle>
    <text x="0" y="5" text-anchor="middle"
          font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="12" font-weight="700" fill="#e0f2fe">()</text>
  </g>

  <!-- головний титул -->
  <text x="600" y="248" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-size="112" font-weight="900" letter-spacing="16"
        fill="url(#lispGlow)" filter="url(#neon)">
    WSM
    <animate attributeName="opacity" values="0.88;1;0.88" dur="3.8s" repeatCount="indefinite"/>
  </text>

  <!-- підпис -->
  <text x="600" y="292" text-anchor="middle"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="16" font-weight="600" letter-spacing="4"
        fill="#cbd5e1">
    ( МОВА • СЕМАНТИКА • МАШИНА )
  </text>

  <text x="600" y="322" text-anchor="middle"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="13" letter-spacing="2.4" fill="#67e8f9" opacity="0.9">
    () → Lisp → eval → machine
  </text>

  <!-- pills -->
  <g transform="translate(292, 350)">
    <rect x="0" y="0" width="160" height="34" rx="8" fill="#111827" stroke="#334155"/>
    <text x="80" y="22" text-anchor="middle" font-family="monospace" font-size="12" fill="#e2e8f0">◌ canon() + 7</text>

    <rect x="176" y="0" width="170" height="34" rx="8" fill="#111827" stroke="#334155"/>
    <text x="261" y="22" text-anchor="middle" font-family="monospace" font-size="12" fill="#67e8f9">? УКРАЇНСЬКА API</text>

    <rect x="362" y="0" width="150" height="34" rx="8" fill="#111827" stroke="#334155"/>
    <text x="437" y="22" text-anchor="middle" font-family="monospace" font-size="12" fill="#c4b5fd">λ META-EVAL</text>

    <rect x="528" y="0" width="158" height="34" rx="8" fill="#111827" stroke="#22c55e"/>
    <circle cx="545" cy="17" r="5" fill="#22c55e">
      <animate attributeName="opacity" values="1;0.25;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="610" y="22" text-anchor="middle" font-family="monospace" font-size="12" fill="#4ade80">WASM READY</text>
  </g>

  <!-- дрібні Lisp-символи -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
     font-size="18" fill="#94a3b8" opacity="0.28">
    <text x="48" y="72">'()</text>
    <text x="1095" y="74">λ</text>
    <text x="62" y="365">car · cdr · cons</text>
    <text x="970" y="365">quote · atom? · cond</text>
  </g>
</svg>
