name: Packed bits efficiency benchmark

on:
  pull_request:
    paths:
      - "crates/sens/src/packed_bits.rs"
      - "crates/sens/examples/pack_efficiency_bench.rs"
      - "crates/sens/examples/boundary_index_bench.rs"
      - "benchmarks/pack-efficiency/**"
      - "benchmarks/boundary-index/**"
      - ".github/workflows/pack-efficiency.yml"
  workflow_dispatch:

concurrency:
  group: pack-efficiency-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pack-efficiency:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: pack-efficiency

      - name: Install Valgrind
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind
          valgrind --version
          rustc --version

      - name: Build benchmark
        run: cargo build --release -p sens --example pack_efficiency_bench

      - name: Measure density and CPU cost
        run: |
          rm -rf /tmp/pack-efficiency
          python3 benchmarks/pack-efficiency/run.py \
            --binary target/release/examples/pack_efficiency_bench \
            --out /tmp/pack-efficiency \
            --count 65536 \
            --scan-repeats 4 \
            --reps 3

      - name: Publish report
        if: always()
        run: |
          if test -f /tmp/pack-efficiency/report.md; then
            cat /tmp/pack-efficiency/report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pack-efficiency
          path: /tmp/pack-efficiency


  random-scale:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: pack-efficiency-random

      - name: Install Valgrind
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind
          valgrind --version
          rustc --version

      - name: Build benchmark
        run: cargo build --release -p sens --example pack_efficiency_bench

      - name: Measure random access across bounded scale ladder
        run: |
          rm -rf /tmp/pack-random
          python3 benchmarks/pack-efficiency/random_scale.py \
            --binary target/release/examples/pack_efficiency_bench \
            --out /tmp/pack-random/ladder \
            --sizes 8,64,1024,65536 \
            --cases w1,d1234,w8 \
            --accesses 4096 \
            --scan-repeats 1 \
            --reps 1

      - name: Measure one-million-word mixed control
        run: |
          python3 benchmarks/pack-efficiency/random_scale.py \
            --binary target/release/examples/pack_efficiency_bench \
            --out /tmp/pack-random/million \
            --sizes 1000000 \
            --cases d1234 \
            --accesses 4096 \
            --scan-repeats 1 \
            --reps 1

      - name: Publish random-access reports
        if: always()
        run: |
          {
            if test -f /tmp/pack-random/ladder/random-report.md; then
              cat /tmp/pack-random/ladder/random-report.md
            fi
            echo
            if test -f /tmp/pack-random/million/random-report.md; then
              cat /tmp/pack-random/million/random-report.md
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pack-efficiency-random-scale
          path: /tmp/pack-random


  boundary-index:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: boundary-index-bench

      - name: Install Valgrind
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind
          valgrind --version
          rustc --version

      - name: Build boundary-index benchmark
        run: cargo build --release -p sens --example boundary_index_bench

      - name: Prove cp2 rejects widths above D4
        run: |
          if target/release/examples/boundary_index_bench mixed18 cp2-8 query 64 64 1; then
            echo "cp2 unexpectedly accepted a width >4 corpus" >&2
            exit 1
          fi

      - name: Run mixed D1-D4 checkpoint tournament
        run: |
          rm -rf /tmp/boundary-index
          python3 benchmarks/boundary-index/run.py \
            --binary target/release/examples/boundary_index_bench \
            --out /tmp/boundary-index/mixed \
            --cases d1234 \
            --sizes 64,65536,1000000 \
            --ks 8,16,32,64,256 \
            --queries 4096 \
            --query-repeats 1 \
            --reps 1

      - name: Run fixed-width no-index controls
        run: |
          python3 benchmarks/boundary-index/run.py \
            --binary target/release/examples/boundary_index_bench \
            --out /tmp/boundary-index/fixed \
            --cases w1,w3,w8 \
            --sizes 65536 \
            --candidates formula,u32,cache2 \
            --queries 4096 \
            --query-repeats 1 \
            --reps 1

      - name: Publish boundary-index reports
        if: always()
        run: |
          {
            echo "## Mixed boundary-index tournament"
            if test -f /tmp/boundary-index/mixed/report.md; then
              cat /tmp/boundary-index/mixed/report.md
            fi
            echo
            echo "## Fixed-width controls"
            if test -f /tmp/boundary-index/fixed/report.md; then
              cat /tmp/boundary-index/fixed/report.md
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: boundary-index-tournament
          path: /tmp/boundary-index
