name: SID8 quoted Core1 and D3 boundary source proofs

on:
  push:
    branches: [main]
    paths:
      - scripts/check-core1-compiler-sid-resolver.lisp
      - scripts/check-core4-predicate-answer-boundary.lisp
      - lib/core1-compiler-sid-resolver.lisp
      - tests/test_sid8_core1_resolver_core4_d3_source.py
      - .github/workflows/audit-sid8-quoted-core1-d3.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-source-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify pinned Core1 source and D3 two-field witnesses
        run: python3 -m unittest discover -s tests -p test_sid8_core1_resolver_core4_d3_source.py -v
