name: Binary-only authority ratchet

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  binary-only-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Мови дозволені; семантика SENS лише у SENS
        run: echo 'LANGUAGES=ALL_ALLOWED language_laws=NOT_EXECUTED_BY_THIS_STEP'

      - name: Binary-only authority ratchet
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
          elif [[ -n "${{ github.event.before }}" && "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]]; then
            base="${{ github.event.before }}"
          else
            base="$(git rev-parse HEAD^)"
          fi
          echo 'PYTHON_VALIDATOR=ALLOWED_BY_OWNER_20261028 validator_not_run=NOT_VERIFIED'

      - uses: dtolnay/rust-toolchain@stable
      - name: Execute real binary T5 programs
        run: cargo test --locked -p sens --features rust-t5-reference --test physical_t5m_execution

      - name: Diff hygiene
        run: git diff --check
