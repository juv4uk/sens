name: domain-bitness-laws

# Тест бітності доменів двійковим сенсом. Семантику визначає сам SENS:
# scripts/check-domain-bitness-laws.lisp читає таблиці мовою (read-file/read-all)
# і перевіряє закон «домен Dn має рівно 2^n рядків» — ширина = ідентичність.
# Раннер збирає чинний sens-cli (бінарна назва my-lisp) і запускає SENS закон.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bitness:
    name: D1..D10 = 2^n rows, in binary SENS
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Статичний ratchet: заборонити десяткові мости ідентичності
        run: |
          python3 scripts/check-domain-ladder-identity.py --self-test
          python3 scripts/check-domain-ladder-identity.py --check
      - name: Build my-lisp
        run: cargo build --release -p sens-cli --bin my-lisp
      - name: Run domain bitness laws
        shell: bash
        run: |
          set -euo pipefail
          out="$(./target/release/my-lisp scripts/check-domain-bitness-laws.lisp)"
          printf '%s\n' "$out"
          printf '%s\n' "$out" | grep -q 'DOMAIN-BITNESS-LAWS: PASS'
