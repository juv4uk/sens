name: Zig T5 parity — стан драбини (manual)
# Приймання #5767: Zig T5 byte-exact на РЕАЛЬНОМУ корпусі .sens + негативні фікстури.
# Ручний; не чіпає .sens-дефолт, не виконує програму.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Встановити Zig 0.16.0 (як у ci.yml)
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --silent --show-error \
            https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz \
            --output "$RUNNER_TEMP/zig-0.16.0.tar.xz"
          echo '70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00  '"$RUNNER_TEMP/zig-0.16.0.tar.xz" | sha256sum --check --status
          tar -xJf "$RUNNER_TEMP/zig-0.16.0.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/zig-x86_64-linux-0.16.0" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/zig-x86_64-linux-0.16.0/zig" version
      - name: Фундамент — одиничні тести T5, T5M і T5M3
        run: |
          set -euo pipefail
          zig test research/zig-codecs/t5/t5.zig
          zig test research/zig-codecs/t5m.zig
          zig test research/zig-codecs/t5m3.zig
      - name: Зібрати інструмент стану драбини (ReleaseFast)
        run: zig build-exe -O ReleaseFast -lc research/zig-codecs/parity_t5.zig -femit-bin="$RUNNER_TEMP/parity_t5"
      - name: Стан драбини T5 на реальному корпусі — кожна розбіжність = можливість-розв'язати-цікаву-задачу
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/parity" && cd "$RUNNER_TEMP/parity"
          python3 "$GITHUB_WORKSPACE/research/zig-codecs/tools/parity_corpus.py" \
            --root "$GITHUB_WORKSPACE" --accept parity_accept.txt --reject parity_reject.txt \
            --neg-dir "$RUNNER_TEMP/parity/neg"
          echo "=== ACCEPT (реальний корпус) ==="; head -3 parity_accept.txt; echo "..."
          echo "=== REJECT (негативи) ==="; cat parity_reject.txt
          "$RUNNER_TEMP/parity_t5" 2>&1 | tee parity.log
          grep -Fq 'PARITY_SUMMARY failures=0' parity.log
      - name: Зберегти свідчення
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zig-t5-parity-${{ github.sha }}
          path: ${{ runner.temp }}/parity/parity.log
          if-no-files-found: warn
