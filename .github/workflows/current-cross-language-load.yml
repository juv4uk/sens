name: Current exact-domain load comparison

on:
  pull_request:
    paths:
      - "benchmarks/cross-language/current_load_formats.py"
      - "benchmarks/cross-language/current_sens.py"
      - "benchmarks/cross-language/current_sens_phases.py"
      - "benchmarks/cross-language/cpython_driver.py"
      - "benchmarks/cross-language/cpython_pyc_driver.py"
      - "crates/sens/examples/current_exact_domain_phase_bench.rs"
      - ".github/workflows/current-cross-language-load.yml"
  workflow_dispatch:

concurrency:
  group: current-cross-language-load-${{ github.ref }}
  cancel-in-progress: true

jobs:
  current-load:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install Cachegrind
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind
          python3 --version
          valgrind --version

      - name: Build current exact-domain phase runner
        run: cargo build -p sens --release --example current_exact_domain_phase_bench

      - name: Compare current SENS with CPython source and pyc load
        run: |
          rm -rf /tmp/current-load-comparison
          python3 benchmarks/cross-language/current_load_formats.py \
            --sens-runner target/release/examples/current_exact_domain_phase_bench \
            --python python3 \
            --reps 3 \
            --out /tmp/current-load-comparison
          cat /tmp/current-load-comparison/current-load-report.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: current-exact-load-comparison
          path: /tmp/current-load-comparison
