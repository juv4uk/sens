name: D10 finite binary arc consistency #4991 — research only
on:
  pull_request:
    paths:
      - 'scripts/research_d10_finite_arc_consistency.py'
      - 'tests/test_d10_finite_arc_consistency.py'
      - 'tests/oracles/d10_finite_arc_consistency.pl'
      - '.github/workflows/d10-finite-arc-consistency.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/research_d10_finite_arc_consistency.py'
      - 'tests/test_d10_finite_arc_consistency.py'
      - 'tests/oracles/d10_finite_arc_consistency.pl'
permissions:
  contents: read
jobs:
  source-witness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Install independent SWI-Prolog CLP(FD) runtime
        run: sudo apt-get update -qq && sudo apt-get install -y swi-prolog-nox
      - name: Exhaustive queue/round proofs + real SWI CLPFD oracle
        run: python3 -m unittest discover -s tests -p 'test_d10_finite_arc_consistency.py' -v
      - name: Preserve D10 as unratified research with NO .sens edits
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('knowledge/d10-v1-semantic-inventory.json').read_text())
          assert x['accounting']['ratified_d10_residents'] == 0
          assert 'FINITE-BINARY-ARC-CONSISTENCY-FIXPOINT' not in {r['semantic_name'] for r in x['rows']}
          print('D10 ARC-CONSISTENCY = research HOLD; selected+0; ratified+0; no coordinates')
          PY
