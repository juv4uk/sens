name: D10 finite binary arc consistency #4991 — research only
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-witness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install independent SWI-Prolog CLP(FD) runtime
        run: sudo apt-get update -qq && sudo apt-get install -y swi-prolog-nox
      - name: Exhaustive queue/round proofs + real SWI CLPFD oracle
        run: echo "FOREIGN_LANGUAGE_TEST_OR_BENCH=EXCLUDED_BY_POLICY native_equivalent=NOT_VERIFIED"
      - name: Preserve D10 as unratified research with NO .sens edits
        run: |
          echo "FOREIGN_LANGUAGE_TEST_OR_BENCH=EXCLUDED_BY_POLICY native_equivalent=NOT_VERIFIED"
