name: #771 library-load stage diagnostic

on:
  pull_request:
    paths:
      - "lib/utf8.lisp"
      - "crates/my-lisp/tests/library_load_stage_debug.rs"
      - ".github/workflows/771-library-load-stage-debug.yml"

jobs:
  library-load-stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Isolate UTF-8 process TCP load stage
        run: cargo test -p my-lisp --test library_load_stage_debug -- --nocapture
