name: English identity vs CLI surface ratchet

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  english-identity-debt:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Prove no new English executable identity and tight CLI surface scope
        run: cargo test -p sens --test english_names_in_code -- --nocapture
