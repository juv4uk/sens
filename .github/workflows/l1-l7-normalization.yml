name: Owner L1-L7 normalization safety
on:
  pull_request:
    paths:
      - scripts/normalize-legacy-l1-l7.py
      - scripts/test_normalize_legacy_l1_l7.py
      - .github/workflows/l1-l7-normalization.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  l1-l7-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify L1-L7 no-guess regression suite
        run: python3 scripts/test_normalize_legacy_l1_l7.py
