# Manual diagnostic only. All active bit-pack measurements are emitted by Rust.
name: Byte-pack efficiency — native Rust

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: byte-pack-bench-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.99.0
      - name: Build the Rust packing mechanism
        shell: bash
        run: cargo build --locked --release -p sens --example byte_pack_bench
      - name: Verify exact round-trip before adaptive timing
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/byte-pack"
          mkdir -p "$out"
          binary="$PWD/target/release/examples/byte_pack_bench"
          for workload in d1 d3 w7 w8 w9 mixed; do
            "$binary" series "$workload" 1024 9 >> "$out/raw.tsv"
          done
          test "$(grep -c '^PACK_BENCH_PREFLIGHT[[:space:]]' "$out/raw.tsv")" -eq 6
          test "$(grep -c '^PACK_BENCH_SAMPLE[[:space:]]' "$out/raw.tsv")" -eq 162
          test "$(grep -c '^PACK_BENCH_SUMMARY[[:space:]]' "$out/raw.tsv")" -eq 18
          cat "$out/raw.tsv"
      - name: Preserve measured Rust samples
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node 24
        with:
          name: byte-pack-rust-${{ github.sha }}
          path: ${{ runner.temp }}/byte-pack/raw.tsv
          if-no-files-found: warn
          retention-days: 21
