name: Canonical Ukrainian–T5–view bounded triplet

on:
  pull_request:
    paths:
      - "scripts/verify_uk_t5_triplet.py"
      - "tests/test_verify_uk_t5_triplet.py"
      - ".github/workflows/verify-uk-t5-triplet.yml"
      - ".github/workflows/release-preflight.yml"
      - ".github/workflows/release.yml"
      - "docs/uk-t5-triplet-bounded.uk.md"
      - "tests/fixtures/migration-d1-cond-cohort/**"
      - "tests/fixtures/migration-pair-cohort-main/**"
      - "tests/fixtures/migration-d4-selector-cohort/**"
      - "lib/domains/d1.lisp"
      - "lib/domains/d3.lisp"
      - "lib/domains/d4.lisp"
      - "scripts/migrate-three-pass.py"
      - "scripts/sens_t5_codec.py"
  push:
    branches: [main]
    paths:
      - "scripts/verify_uk_t5_triplet.py"
      - "tests/test_verify_uk_t5_triplet.py"
      - ".github/workflows/verify-uk-t5-triplet.yml"
      - ".github/workflows/release-preflight.yml"
      - ".github/workflows/release.yml"
      - "docs/uk-t5-triplet-bounded.uk.md"
      - "tests/fixtures/migration-d1-cond-cohort/**"
      - "tests/fixtures/migration-pair-cohort-main/**"
      - "tests/fixtures/migration-d4-selector-cohort/**"
      - "lib/domains/d1.lisp"
      - "lib/domains/d3.lisp"
      - "lib/domains/d4.lisp"
      - "scripts/migrate-three-pass.py"
      - "scripts/sens_t5_codec.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bounded-uk-triple-source-parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Current Ukrainian canonical-source and malicious triple negatives
        run: python3 -m unittest discover -s tests -p 'test_verify_uk_t5_triplet.py' -v
      - name: Read-only exact real existing triple, emit source/physical/view SHA
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_uk_t5_triplet.py \
            --lisp tests/fixtures/migration-d1-cond-cohort/branch.lisp \
            --sens tests/fixtures/migration-d1-cond-cohort/branch.sens \
            --view tests/fixtures/migration-d1-cond-cohort/branch \
            > "$RUNNER_TEMP/uk-triple-bounded.json"
          python3 - "$RUNNER_TEMP/uk-triple-bounded.json" <<'PY'
          import json, os, sys
          from pathlib import Path
          result=json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert result["schema"]=="sens-uk-t5-view-bounded-proof/v1"
          assert result["physical_bytes"]==12
          assert result["canonical_uk_roundtrip"] and result["canonical_view_roundtrip"]
          assert result["physical_T5_roundtrip"]
          assert not result["runtime_oracle_admitted_by_this_audit"]
          assert result["old_originals_migrated_by_this_audit"]==0
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a",encoding="utf-8") as out:
              out.write("## Ukrainian/T5/ASCII triple — bounded D1/D3 source proof\n\n")
              for k in ("source_sha256","physical_sha256","view_sha256",
                        "typed_word_sha256"):
                  out.write(f"- {k}: \x60{result[k]}\x60\n")
              out.write("- Scope: D1 literals, D3 CAR/COND/QUOTE(EMPTY)/CONS, D4 CAAR(CONS), D2 — not all D1–D9\n")
              out.write("- Independent current-Rust oracle remains a separate stage\n")
              out.write("- Release admission: **NOT PROVEN**; original migration count: **0**\n")
          PY
      - name: Read-only verify exact Ukrainian D3 CONS and D4 CAAR witnesses
        shell: bash
        run: |
          set -euo pipefail
          for spec in \
            "tests/fixtures/migration-pair-cohort-main/pair-cons" \
            "tests/fixtures/migration-d4-selector-cohort/caar"; do
            python3 scripts/verify_uk_t5_triplet.py \
              --lisp "$spec.lisp" --sens "$spec.sens" --view "$spec" \
              > "$RUNNER_TEMP/$(basename "$spec")-uk-proof.json"
            python3 - "$RUNNER_TEMP/$(basename "$spec")-uk-proof.json" <<'PY'
          import json,sys
          from pathlib import Path
          row=json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert row["canonical_uk_roundtrip"] and row["canonical_view_roundtrip"]
          assert row["physical_T5_roundtrip"]
          assert not row["runtime_oracle_admitted_by_this_audit"]
          assert row["old_originals_migrated_by_this_audit"] == 0
          assert all(len(row[key])==64 for key in ("source_sha256","physical_sha256","view_sha256","typed_word_sha256"))
          print(row["source"], "UK↔T5↔VIEW exact PASS (bounded only)")
          PY
          done
      - name: Independent Rust current T5 execution of all three canaries
        shell: bash
        run: |
          set -euo pipefail
          cargo test -q -p sens --test migration_d1_cond_cohort -- --nocapture
          cargo test -q -p sens --test migration_pair_car_cdr_cons_main -- --nocapture
          cargo test -q -p sens --test migration_d4_selector_cohort -- --nocapture
      - name: Prove verification produced no writes
        shell: bash
        run: |
          test -z "$(git status --porcelain --untracked-files=all)" || {
            git status --short
            exit 1
          }
