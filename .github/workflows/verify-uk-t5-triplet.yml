name: Українська T5M-трійка й окремі історичні T5-свідки

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bounded-uk-triple-source-parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/install-zig
      - name: Two-file pre-codec migration regression
        run: |
          python3 -m unittest discover -s tests -p 'test_stage_two_projections.py' -v
          python3 -m unittest discover -s tests -p 'test_migrated_two_projections.py' -v
          python3 -m unittest discover -s tests -p 'test_migrated_historical_two_projections.py' -v
      - name: Атомарний T5M-експорт без перезапису
        run: python3 -m unittest discover -s tests -p 'test_publish_verified_uk_triplets.py' -v
      - name: Порівняти програми історичного T5 і нового T5M, а не байти різних кодеків
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/uk-triplet-export"
          python3 scripts/publish_verified_uk_triplets.py \
            tests/fixtures/migration-d1-cond-cohort/branch.lisp \
            tests/fixtures/migration-d4-selector-cohort/caar.lisp \
            --mirror "$RUNNER_TEMP/uk-triplet-export" \
            --report "$RUNNER_TEMP/uk-triplet-export-report.json" --write
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          from scripts.sens_t5_t5m_codec import decode_bytes, decode_t5m_bytes, encode_t5m_projection

          mirror = Path(os.environ["RUNNER_TEMP"]) / "uk-triplet-export"
          paths = (
              Path("tests/fixtures/migration-d1-cond-cohort/branch.lisp"),
              Path("tests/fixtures/migration-d4-selector-cohort/caar.lisp"),
          )
          report = json.loads((Path(os.environ["RUNNER_TEMP"]) / "uk-triplet-export-report.json").read_text())
          assert report["schema"] == "sens-uk-t5m-three-projection-atomic-preview/v2"
          assert report["summary"]["triplets_written"] == len(paths)
          for path in paths:
              old_sens = path.with_suffix(".sens")
              fresh_lisp = mirror / path
              fresh_sens = fresh_lisp.with_suffix(".sens")
              old_words = decode_bytes(old_sens.read_bytes())
              new_words = decode_t5m_bytes(fresh_sens.read_bytes())
              assert old_words == new_words, f"програма змінилася: {path}"
              assert fresh_sens.read_bytes() == encode_t5m_projection(" ".join(new_words))
              assert fresh_lisp.read_bytes() == path.read_bytes()
              expected_view = (" ".join(new_words) + "\n").encode("ascii")
              assert fresh_lisp.with_suffix("").read_bytes() == expected_view
              assert path.with_suffix("").read_bytes() == expected_view
          assert all(row["physical_codec"] == "t5m" for row in report["files"])
          assert all(row["physical_authority"] == "zig-attested-t5m" for row in report["files"])
          assert all(len(row["zig_binary_sha256"]) == 64 for row in report["files"])
          assert report["summary"]["original_executables_oracle_certified"] == 0
          PY
      - name: Current Ukrainian canonical-source and malicious triple negatives
        run: python3 -m unittest discover -s tests -p 'test_verify_uk_t5_t5m_triplet.py' -v
      - name: Read-only exact real existing triple, emit source/physical/view SHA
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_uk_t5_t5m_triplet.py \
            --lisp tests/fixtures/migration-d1-cond-cohort/branch.lisp \
            --sens tests/fixtures/migration-d1-cond-cohort/branch.sens \
            --view tests/fixtures/migration-d1-cond-cohort/branch \
            --codec t5 \
            > "$RUNNER_TEMP/uk-triple-bounded.json"
          python3 - "$RUNNER_TEMP/uk-triple-bounded.json" <<'PY'
          import json, os, sys
          from pathlib import Path
          result=json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert result["schema"]=="sens-uk-t5-view-bounded-proof/v1"
          assert result["physical_bytes"]==12
          assert result["canonical_uk_roundtrip"] and result["canonical_view_roundtrip"]
          assert result["physical_T5_roundtrip"]
          assert not result["runtime_oracle_admitted_by_this_audit"]
          assert result["old_originals_migrated_by_this_audit"]==0
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a",encoding="utf-8") as out:
              out.write("## Ukrainian/T5/ASCII triple — bounded D1/D3 source proof\n\n")
              for k in ("source_sha256","physical_sha256","view_sha256",
                        "typed_word_sha256"):
                  out.write(f"- {k}: \x60{result[k]}\x60\n")
              out.write("- Scope: D1 literals, bounded D3 call syntax/atomic QUOTE/EMPTY, D2; not all D1–D9 or semantic release proof\n")
              out.write("- Independent current-Rust oracle remains a separate stage\n")
              out.write("- Release admission: **NOT PROVEN**; original migration count: **0**\n")
          PY
      - name: Read-only current D3 CONS Ukrainian T5/view triple
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_uk_t5_t5m_triplet.py \
            --lisp tests/fixtures/migration-pair-cohort-main/pair-cons.lisp \
            --sens tests/fixtures/migration-pair-cohort-main/pair-cons.sens \
            --view tests/fixtures/migration-pair-cohort-main/pair-cons \
            --codec t5 \
            > "$RUNNER_TEMP/uk-d3-cons-triple.json"
          python3 - "$RUNNER_TEMP/uk-d3-cons-triple.json" <<'PY'
          import json, sys
          from pathlib import Path
          record=json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert record["physical_bytes"] == 10, record
          assert record["canonical_uk_roundtrip"] and record["canonical_view_roundtrip"], record
          assert not record["runtime_oracle_admitted_by_this_audit"], record
          assert record["old_originals_migrated_by_this_audit"] == 0, record
          PY
      - name: Current Rust interpreter independently executes committed T5
        run: cargo test -q -p sens --test migration_d1_cond_cohort -- --nocapture
      - name: Independently run current Rust D3 CAR CDR CONS oracle
        run: cargo test -q -p sens --test migration_pair_car_cdr_cons_main -- --nocapture
      - name: Read-only verified Ukrainian D4 CAAR source / T5 / ASCII view
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_uk_t5_t5m_triplet.py \
            --lisp tests/fixtures/migration-d4-selector-cohort/caar.lisp \
            --sens tests/fixtures/migration-d4-selector-cohort/caar.sens \
            --view tests/fixtures/migration-d4-selector-cohort/caar \
            --codec t5 \
            > "$RUNNER_TEMP/d4-caar-uk-proof.json"
          python3 - "$RUNNER_TEMP/d4-caar-uk-proof.json" <<'PY'
          import json,sys
          from pathlib import Path
          rec=json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert rec["physical_bytes"] == 20
          assert rec["canonical_uk_roundtrip"] and rec["canonical_view_roundtrip"]
          assert rec["physical_T5_roundtrip"] is True
          assert rec["runtime_oracle_admitted_by_this_audit"] is False
          assert rec["old_originals_migrated_by_this_audit"] == 0
          print("Proven source/T5/view; independent D4 evaluator is next step")
          PY
      - name: Independently execute current Rust D4 CAAR T5
        run: cargo test -q -p sens --test migration_d4_selector_cohort -- --nocapture

      - name: Prove verification produced no writes
        shell: bash
        run: |
          test -z "$(git status --porcelain --untracked-files=all)" || {
            git status --short
            exit 1
          }
