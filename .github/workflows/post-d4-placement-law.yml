name: Post-D4 placement law research

on:
  pull_request:
    paths:
      - "scripts/research-2236-post-d4-placement-law.py"
      - "docs/research/2236-post-d4-placement-law.md"
      - ".github/workflows/post-d4-placement-law.yml"
  push:
    branches:
      - main
    paths:
      - "scripts/research-2236-post-d4-placement-law.py"
      - "docs/research/2236-post-d4-placement-law.md"
      - ".github/workflows/post-d4-placement-law.yml"

jobs:
  post-d4-placement-law:
    name: Post-D4 parent + delta witness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run placement-law witness
        run: python3 scripts/research-2236-post-d4-placement-law.py
      - name: Publish summary
        if: always()
        run: |
          {
            echo "## Post-D4 placement-law research"
            echo
            echo "- history selects candidate order"
            echo "- D1-D4 derivability is tested before allocation"
            echo "- local parent + one observable delta may earn one extra bit"
            echo "- LABEL counterfactual: derived => no address; one-delta closure refinement => 00101 candidate"
            echo "- research-only: no new non-selector D5 identity is ratified"
          } >> "$GITHUB_STEP_SUMMARY"
