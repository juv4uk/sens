# T5M-кодек: асемблер проти Python-еталону. Ручний запуск.
name: SENS T5M performance (asm vs Python)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  t5m-reference:
    name: T5M pack/unpack — асемблер проти Python
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Виміряти T5M pack/unpack (asm проти Python)
        run: |
          python3 benchmarks/sens-performance/t5m_reference.py \
            --out "$RUNNER_TEMP/sens-t5m-performance" \
            --sizes 128,2048 --samples 9 --loops 3
      - name: Зберегти виміри й середовище
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sens-t5m-reference-${{ github.sha }}
          path: ${{ runner.temp }}/sens-t5m-performance/
          if-no-files-found: warn
          retention-days: 14
