name: Island ownership gate

on:
  pull_request:
    paths:
      - "knowledge/island-ownership-gate-v1.json"
      - "knowledge/d9-v1-semantic-inventory.json"
      - "knowledge/d9-ratified.json"
      - "knowledge/d10-v1-semantic-inventory.json"
      - "knowledge/d10-fill-v1-state.json"
      - "contracts/semantic-ownership-audit-733.lisp"
      - "contracts/island-compat-contract.lisp"
      - "scripts/check-island-ownership-gate.py"
      - ".github/workflows/island-ownership-gate.yml"
  push:
    branches: [main]
    paths:
      - "knowledge/island-ownership-gate-v1.json"
      - "knowledge/d10-v1-semantic-inventory.json"
      - "knowledge/d10-fill-v1-state.json"
      - "scripts/check-island-ownership-gate.py"
      - ".github/workflows/island-ownership-gate.yml"
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Verify island ownership gate
        run: python3 scripts/check-island-ownership-gate.py
