name: SENS two-codec explicit tiny F3 CLI, T5 remains default
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  explicit-cli:
    name: F3 opt-in CLI, exact T5 reader parity, fail closed
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Original F3 is bounded, decoded and executed through T5 core
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p sens frame3_small::tests -- --nocapture
          cargo test --locked -p sens-cli --bin sens-trit original_tiny_f3 -- --nocapture
      - name: Build real binary and verify exact T5/F3 program bytes and output
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --release -p sens-cli --bin sens-trit
          python3 - "$RUNNER_TEMP" <<'PY'
          from pathlib import Path
          import sys
          root=Path(sys.argv[1])
          (root/"small.senc").write_bytes(bytes.fromhex("f34060"))
          (root/"wrong-marker.senc").write_bytes(bytes.fromhex("f44060"))
          (root/"truncated.senc").write_bytes(bytes([0xf3]))
          (root/"empty-structure.senc").write_bytes(bytes.fromhex("f300"))
          (root/"oversize.senc").write_bytes(bytes([0xf3])*16)
          PY
          bin=target/release/sens-trit
          canonical=tests/fixtures/migration-quote-cohort-main/quote-legacy.sens
          cp "$canonical" "$RUNNER_TEMP/from-t5.sens"
          "$bin" encode-f3 "$RUNNER_TEMP/from-t5.sens"
          cmp "$RUNNER_TEMP/from-t5.senc" "$RUNNER_TEMP/small.senc"
          # Refuse duplicate writes and never damage source.
          if "$bin" encode-f3 "$RUNNER_TEMP/from-t5.sens" > /dev/null 2>&1; then
            echo "encode-f3 overwrote existing output" >&2
            exit 1
          fi
          cmp "$canonical" "$RUNNER_TEMP/from-t5.sens"
          "$bin" open-f3 "$RUNNER_TEMP/small.senc" | tee "$RUNNER_TEMP/f3-human.txt"
          printf '10 001 00 000 01\n' | cmp - "$RUNNER_TEMP/f3-human.txt"
          "$bin" decode-f3 "$RUNNER_TEMP/small.senc" > "$RUNNER_TEMP/f3-words.txt"
          "$bin" decode "$canonical" > "$RUNNER_TEMP/t5-words.txt"
          cmp "$RUNNER_TEMP/f3-words.txt" "$RUNNER_TEMP/t5-words.txt"
          "$bin" eval-f3 "$RUNNER_TEMP/small.senc" > "$RUNNER_TEMP/f3-eval.txt"
          "$bin" eval "$canonical" > "$RUNNER_TEMP/t5-eval.txt"
          cmp "$RUNNER_TEMP/f3-eval.txt" "$RUNNER_TEMP/t5-eval.txt"
          "$bin" open "$canonical" > "$RUNNER_TEMP/t5-open.txt"
          cmp "$RUNNER_TEMP/t5-open.txt" "$RUNNER_TEMP/f3-human.txt"
      - name: All 9 real tiny F3 staged files match canonical T5 CLI parsing and execution
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --release -p sens --example two_codec_small_programs
          python3 scripts/prepare-two-codec-migration.py \
            --stage "$RUNNER_TEMP/full-tiny-stage" \
            > "$RUNNER_TEMP/full-tiny-manifest.json"
          python3 scripts/prepare-two-codec-migration.py \
            --verify-stage "$RUNNER_TEMP/full-tiny-stage" \
            > "$RUNNER_TEMP/full-tiny-audit.json"
          python3 - "$RUNNER_TEMP/full-tiny-stage" "$RUNNER_TEMP/full-tiny-manifest.json" <<'PY'
          import json, subprocess, sys
          from pathlib import Path
          stage = Path(sys.argv[1])
          manifest = json.loads(Path(sys.argv[2]).read_text())
          binary = Path("target/release/sens-trit").resolve()
          f3 = 0
          for row in manifest["files"]:
              source = Path(row["source"]).resolve()
              if row["codec"] != "F3":
                  if row["codec"] != "T5":
                      raise SystemExit("unknown codec")
                  continue
              f3 += 1
              framed = stage / row["staged_file"]
              for old_cmd, new_cmd in [
                  ("open", "open-f3"),
                  ("decode", "decode-f3"),
                  ("eval", "eval-f3"),
              ]:
                  base = subprocess.run([binary, old_cmd, source],
                      text=True, capture_output=True, check=False)
                  trial = subprocess.run([binary, new_cmd, framed],
                      text=True, capture_output=True, check=False)
                  if (base.returncode, base.stdout) != (trial.returncode, trial.stdout):
                      raise SystemExit(
                          f"wrong SENS semantics: {source} {new_cmd}: "
                          f"T5={base.returncode}/{base.stdout!r} "
                          f"F3={trial.returncode}/{trial.stdout!r}"
                      )
              # The physical .senc hash comes from the independent stage manifest.
              # SHA is checked BEFORE F3 decode/evaluation, not after.
              trusted = row["staged_sha256"]
              checked = subprocess.run(
                  [binary, "eval-f3-sha256", framed, trusted],
                  text=True, capture_output=True, check=False)
              oracle = subprocess.run(
                  [binary, "eval", source],
                  text=True, capture_output=True, check=False)
              if (checked.returncode, checked.stdout) != (oracle.returncode, oracle.stdout):
                  raise SystemExit(f"F3 hash verified eval differs: {framed}")
              wrong = subprocess.run(
                  [binary, "eval-f3-sha256", framed, "0"*64],
                  text=True, capture_output=True, check=False)
              if wrong.returncode == 0:
                  raise SystemExit(f"F3 accepted untrusted physical carrier: {framed}")
          if f3 < 9:
              raise SystemExit(f"tiny real F3 coverage dropped to {f3}")
          print(f"TWO_CODEC_ALL_TINY_CLI_PARITY_PASS f3={f3} total={manifest['source_files']}")
          PY
      - name: SHA-256 integrity gate runs BEFORE decoding or executing tiny F3
        shell: bash
        run: |
          set -euo pipefail
          bin=target/release/sens-trit
          trusted=19b495e17cd0522c1af4863704b92751df5e5769ee0bfe3c9844aedbc0a57406
          actual=$(sha256sum "$RUNNER_TEMP/small.senc" | cut -d' ' -f1)
          test "$actual" = "$trusted"
          "$bin" verify-f3-sha256 "$RUNNER_TEMP/small.senc" "$trusted" \
            | tee "$RUNNER_TEMP/f3-verified.txt"
          grep -q 'F3_SHA256_VERIFIED canonical_t5_bytes=4' "$RUNNER_TEMP/f3-verified.txt"
          "$bin" eval-f3-sha256 "$RUNNER_TEMP/small.senc" "$trusted" \
            > "$RUNNER_TEMP/f3-checked-eval.txt"
          cmp "$RUNNER_TEMP/f3-checked-eval.txt" "$RUNNER_TEMP/t5-eval.txt"
          cp "$RUNNER_TEMP/small.senc" "$RUNNER_TEMP/mutated.senc"
          python3 - "$RUNNER_TEMP/mutated.senc" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1]); content=bytearray(p.read_bytes())
          content[-1]^=1
          p.write_bytes(content)
          PY
          if "$bin" verify-f3-sha256 "$RUNNER_TEMP/mutated.senc" "$trusted" >/dev/null 2>&1; then
            echo "F3 physical corruption ignored by trusted hash" >&2
            exit 1
          fi
          if "$bin" eval-f3-sha256 "$RUNNER_TEMP/mutated.senc" "$trusted" >/dev/null 2>&1; then
            echo "F3 corrupt carrier executed despite mismatched trusted hash" >&2
            exit 1
          fi
          if "$bin" eval-f3-sha256 "$RUNNER_TEMP/small.senc" bad >/dev/null 2>&1; then exit 1; fi
          if "$bin" eval-f3-sha256 "$RUNNER_TEMP/small.senc" "$(printf '0%.0s' {1..64})" >/dev/null 2>&1; then exit 1; fi
          if "$bin" verify-f3-sha256 tests/fixtures/migration-quote-cohort-main/quote-legacy.sens "$trusted" >/dev/null 2>&1; then exit 1; fi
          echo F3_SHA256_FAIL_CLOSED_PASS
      - name: The wrong extension and malformed frame MUST fail with no fallback
        shell: bash
        run: |
          set -euo pipefail
          bin=target/release/sens-trit
          canon=tests/fixtures/migration-quote-cohort-main/quote-legacy.sens
          if "$bin" open "$RUNNER_TEMP/small.senc" >/dev/null 2>&1; then exit 1; fi
          if "$bin" "$RUNNER_TEMP/small.senc" >/dev/null 2>&1; then exit 1; fi
          if "$bin" open-f3 "$canon" >/dev/null 2>&1; then exit 1; fi
          if "$bin" open-f3 "$RUNNER_TEMP/wrong-marker.senc" >/dev/null 2>&1; then exit 1; fi
          if "$bin" eval-f3 "$RUNNER_TEMP/truncated.senc" >/dev/null 2>&1; then exit 1; fi
          if "$bin" eval-f3 "$RUNNER_TEMP/empty-structure.senc" >/dev/null 2>&1; then exit 1; fi
          if "$bin" open-f3 "$RUNNER_TEMP/oversize.senc" >/dev/null 2>&1; then exit 1; fi
          if "$bin" encode-f3 tests/fixtures/core1-domain-canary/second.sens >/dev/null 2>&1; then exit 1; fi
          echo TWO_CODEC_EXPLICIT_CLI_PASS
      - name: Preserve exact physical proof and program outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sens-f3-opt-in-cli-${{ github.sha }}
          path: |
            ${{ runner.temp }}/small.senc
            ${{ runner.temp }}/f3-human.txt
            ${{ runner.temp }}/f3-words.txt
            ${{ runner.temp }}/t5-words.txt
            ${{ runner.temp }}/f3-eval.txt
            ${{ runner.temp }}/f3-verified.txt
            ${{ runner.temp }}/f3-checked-eval.txt
            ${{ runner.temp }}/t5-eval.txt
          if-no-files-found: error
          retention-days: 30
