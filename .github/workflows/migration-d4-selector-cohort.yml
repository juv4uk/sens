name: Migration D4 CAAR physical T5 cohort

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-d4-caar:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Actual historical three-pass conversion and physical byte law
        run: python3 -m unittest discover -s tests -p test_migration_d4_selector_cohort.py -v
      - name: Current exact D4 selector Rust oracle and negative controls
        run: cargo test -p sens --features rust-t5-reference --test migration_d4_selector_cohort -- --nocapture
