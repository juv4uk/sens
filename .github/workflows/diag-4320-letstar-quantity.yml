name: 4320 LET-star quantity probe

on:
  push:
    branches: [diag/4320-letstar-quantity-1007]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Compare LET-star compatibility and quantity witness
        shell: bash
        run: |
          set +e
          cargo test -p sens --test let_code_parity_1678 -- --nocapture
          let_status=$?
          cargo run --quiet -p sens-cli --bin sens -- tests/fixtures/exact-quantity-arithmetic-witness.lisp
          quantity_status=$?
          set -e
          echo "LET_STAR_STATUS=$let_status"
          echo "QUANTITY_STATUS=$quantity_status"
          test "$let_status" -eq 0
          test "$quantity_status" -eq 0
