name: "D8 ANY/ALL polarity — excluded by Rust/Zig/SENS language policy"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy-exclusion:
    name: Foreign-language test/benchmark excluded (NOT_VERIFIED)
    runs-on: ubuntu-latest
    steps:
      - name: Report exclusion without implying a passing test
        run: |
          echo "FOREIGN_LANGUAGE_TEST_BENCH=EXCLUDED_BY_POLICY"
          echo "NATIVE_EQUIVALENT=NOT_VERIFIED"
          echo "NO_PASS_CLAIM=MADE"
