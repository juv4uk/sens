name: D8 ANY-ALL predicate polarity research

on:
  pull_request:
    paths:
      - "benchmarks/d8-any-all-polarity/**"
      - "docs/research/3663-d8-any-all-polarity.md"
      - "docs/research/3663-d8-any-all-polarity.uk.md"
      - "knowledge/d6-ratified.json"
      - ".github/workflows/d8-any-all-polarity.yml"
  push:
    branches:
      - main
    paths:
      - "benchmarks/d8-any-all-polarity/**"
      - "docs/research/3663-d8-any-all-polarity.md"
      - "docs/research/3663-d8-any-all-polarity.uk.md"
      - "knowledge/d6-ratified.json"
      - ".github/workflows/d8-any-all-polarity.yml"
  workflow_dispatch:

jobs:
  product-witness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Run exhaustive ANY-ALL polarity witness
        run: |
          rm -rf /tmp/d8-any-all-polarity
          python3 benchmarks/d8-any-all-polarity/run.py \
            --out /tmp/d8-any-all-polarity

      - name: Verify deterministic replay
        run: |
          rm -rf /tmp/d8-any-all-polarity-2
          python3 benchmarks/d8-any-all-polarity/run.py \
            --out /tmp/d8-any-all-polarity-2
          cmp /tmp/d8-any-all-polarity/witness.json \
              /tmp/d8-any-all-polarity-2/witness.json

      - name: Publish report
        if: always()
        run: |
          test ! -f /tmp/d8-any-all-polarity/report.md || \
            cat /tmp/d8-any-all-polarity/report.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d8-any-all-polarity
          path: /tmp/d8-any-all-polarity/
          retention-days: 14
