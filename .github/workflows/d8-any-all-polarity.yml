name: D8 ANY-ALL predicate polarity research

on:
  workflow_dispatch:

jobs:
  product-witness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Run exhaustive ANY-ALL polarity witness
        run: |
          rm -rf /tmp/d8-any-all-polarity
          echo "FOREIGN_LANGUAGE_TEST_OR_BENCH=EXCLUDED_BY_POLICY native_equivalent=NOT_VERIFIED"

      - name: Verify deterministic replay
        run: |
          rm -rf /tmp/d8-any-all-polarity-2
          echo "FOREIGN_LANGUAGE_TEST_OR_BENCH=EXCLUDED_BY_POLICY native_equivalent=NOT_VERIFIED"
          cmp /tmp/d8-any-all-polarity/witness.json \
              /tmp/d8-any-all-polarity-2/witness.json

      - name: Publish report
        if: always()
        run: |
          test ! -f /tmp/d8-any-all-polarity/report.md || \
            cat /tmp/d8-any-all-polarity/report.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d8-any-all-polarity
          path: /tmp/d8-any-all-polarity/
          retention-days: 14
