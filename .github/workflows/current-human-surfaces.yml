name: Current human surfaces

on:
  pull_request:
    paths:
      - "crates/sens/src/human_surface.rs"
      - "crates/sens/src/eval/lower.rs"
      - "crates/sens/src/lib.rs"
      - ".github/workflows/current-human-surfaces.yml"
  push:
    branches: [main]
    paths:
      - "crates/sens/src/human_surface.rs"
      - "crates/sens/src/eval/lower.rs"
      - "crates/sens/src/lib.rs"
      - ".github/workflows/current-human-surfaces.yml"
  workflow_dispatch:

jobs:
  d3-surface-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Run current D3 surface parity tests
        run: cargo test -p sens --lib human_surface -- --nocapture
