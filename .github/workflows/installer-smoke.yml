name: Installer smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installer:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Заглушки ізолюють мережу й пакетні менеджери; це не встановлення островів.
      - name: Перевірити сценарії інсталятора
        run: |
          bash -n packaging/install.sh
          python3 -m unittest discover -s packaging/tests -v
