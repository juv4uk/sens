name: Installer smoke

on:
  pull_request:
    paths:
      - 'packaging/install.sh'
      - 'packaging/tests/**'
      - 'crates/sens-cli/Cargo.toml'
      - '.github/workflows/installer-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'packaging/install.sh'
      - 'packaging/tests/**'
      - 'crates/sens-cli/Cargo.toml'
      - '.github/workflows/installer-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installer:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      # Заглушки ізолюють мережу й пакетні менеджери; це не встановлення островів.
      - name: Перевірити сценарії інсталятора
        run: |
          bash -n packaging/install.sh
          python3 -m unittest discover -s packaging/tests -v
