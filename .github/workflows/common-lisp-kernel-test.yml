name: Common Lisp Kernel Test

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'crates/wsm-common-lisp-kernel/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/common-lisp-kernel-test.yml'

jobs:
  common-lisp-kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install SBCL
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends sbcl
          sbcl --version

      - name: Test process adapter and real semantic witnesses
        env:
          WSM_COMMON_LISP_INTEGRATION: "1"
        run: cargo test -p wsm-common-lisp-kernel -- --nocapture

      - name: Clippy Common Lisp kernel
        run: cargo clippy -p wsm-common-lisp-kernel --all-targets -- -D warnings
