name: TEMP native-first migration generator

permissions:
  contents: write

on:
  pull_request:
    paths:
      - "lib/machine/dispatch/native-first.lisp"
      - ".github/workflows/temp-native-first-migrate.yml"
  workflow_dispatch:

jobs:
  generate:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'release/4242-native-first-migrate'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build canonical migration tool
        run: cargo build --release -p sens-cli --bin sens-to-sens
      - name: Rewrite and prove native-first source
        run: |
          cp lib/machine/dispatch/native-first.lisp /tmp/native-first.before.lisp
          target/release/sens-to-sens lib/machine/dispatch/native-first.lisp | tee /tmp/migrate.txt
          target/release/sens-to-sens --check lib/machine/dispatch/native-first.lisp | tee /tmp/check.txt
          grep -F "lib/machine/dispatch/native-first.lisp: convertible=0" /tmp/check.txt
          grep -F "named-calls=0" /tmp/check.txt
          grep -F "blocked-host=0" /tmp/check.txt
          git diff -- lib/machine/dispatch/native-first.lisp > /tmp/native-first.diff
          test -s /tmp/native-first.diff
          cp lib/machine/dispatch/native-first.lisp /tmp/native-first.after.lisp
      - name: Commit generated source
        run: |
          if git diff --quiet -- lib/machine/dispatch/native-first.lisp; then
            echo "native-first already clean"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/machine/dispatch/native-first.lisp
          git commit -m "wip(4242): commit parser-aware native-first migration"
          git push origin HEAD:release/4242-native-first-migrate
      - name: Migration run marker
        run: echo "native-first migration generator uses the exact PR head branch"
      - name: Commit generated rewrite to temporary branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'release/4242-native-first-migrate'
        run: |
          cp /tmp/native-first.after.lisp lib/machine/dispatch/native-first.lisp
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/machine/dispatch/native-first.lisp
          if git diff --cached --quiet; then
            echo "generated source already committed"
          else
            git commit -m "fix(4242): commit generated native-first exact-SENS rewrite"
            git push origin HEAD:release/4242-native-first-migrate
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: native-first-sens-migration
          path: |
            /tmp/native-first.before.lisp
            /tmp/native-first.after.lisp
            /tmp/native-first.diff
            /tmp/migrate.txt
            /tmp/check.txt
          retention-days: 3
