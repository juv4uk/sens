# One-shot cancellation requested by the repository owner.
# Triggered only by adding/updating THIS file in the named commit on main.
# This workflow is not a permanent push-time cancellation policy.
name: "One-shot cancel active GitHub Actions"
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/stop-active-actions-once.yml"
  workflow_dispatch:
    inputs:
      confirm:
        description: "Enter CANCEL to cancel all current queued and in-progress runs"
        required: true
        type: string

permissions:
  actions: write
  contents: read

jobs:
  stop-current-queue:
    name: "Cancel in-progress and queued runs (once)"
    if: "${{ (github.event_name == 'workflow_dispatch' && inputs.confirm == 'CANCEL') || (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'ops(actions): one-shot')) }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Cancel current runs except the cancellation job itself
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SELF_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          ids="$(mktemp)"
          unique="$(mktemp)"
          trap 'rm -f "$ids" "$unique"' EXIT
          # Freeze a one-time snapshot. Do not run an hourly/push-time monitor.
          for state in queued in_progress waiting pending requested; do
            gh api --paginate --jq '.workflow_runs[].id' \
              "/repos/$GH_REPO/actions/runs?status=$state&per_page=100" >> "$ids"
          done
          sort -un "$ids" > "$unique"
          selected="$(wc -l < "$unique")"
          echo "ACTION_CANCEL_SNAPSHOT selected=$selected self=$SELF_RUN_ID"
          cancelled=0
          unavailable=0
          while IFS= read -r id; do
            [[ "$id" =~ ^[0-9]+$ ]] || continue
            if [[ "$id" == "$SELF_RUN_ID" ]]; then
              echo "ACTION_CANCEL_SKIP_SELF id=$id"
              continue
            fi
            if gh api --silent --method POST \
                "/repos/$GH_REPO/actions/runs/$id/cancel"; then
              echo "ACTION_CANCEL_REQUESTED id=$id"
              cancelled=$((cancelled + 1))
            else
              # A run may have completed between snapshot and cancellation.
              echo "ACTION_CANCEL_UNCONFIRMED id=$id" >&2
              unavailable=$((unavailable + 1))
            fi
          done < "$unique"
          echo "ACTION_CANCEL_SUMMARY selected=$selected requested=$cancelled unconfirmed=$unavailable"
          # GitHub sometimes continues a run even after successful /cancel.
          # One bounded follow-up pass force-cancels any runs still active.
          sleep 5
          : > "$ids"
          for state in queued in_progress waiting pending requested; do
            gh api --paginate --jq '.workflow_runs[].id' \
              "/repos/$GH_REPO/actions/runs?status=$state&per_page=100" >> "$ids"
          done
          sort -un "$ids" > "$unique"
          forced=0
          still_unconfirmed=0
          while IFS= read -r id; do
            [[ "$id" =~ ^[0-9]+$ ]] || continue
            [[ "$id" != "$SELF_RUN_ID" ]] || continue
            if gh api --silent --method POST \
                "/repos/$GH_REPO/actions/runs/$id/force-cancel"; then
              echo "ACTION_FORCE_CANCEL_REQUESTED id=$id"
              forced=$((forced + 1))
            else
              echo "ACTION_FORCE_CANCEL_UNCONFIRMED id=$id" >&2
              still_unconfirmed=$((still_unconfirmed + 1))
            fi
          done < "$unique"
          echo "ACTION_FORCE_CANCEL_SUMMARY requested=$forced unconfirmed=$still_unconfirmed"
          # Do not claim all runs stopped just because GitHub accepted requests.
          if (( unavailable != 0 )); then
            echo "::warning::Some runs were already terminal or their cancellation was refused"
          fi
