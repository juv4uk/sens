name: "Repair #5408 — authentic Core4 FASL replay"
on:
  push:
    branches:
      - fix/5408-fasl-replay-20261011-gpt6
    paths:
      - .github/workflows/repair-5408-core4-fasl-replay.yml
permissions:
  contents: write
jobs:
  fasl:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Generate exact-domain binary from branch source
        run: cargo run --locked --release -p sens-cli --bin gen-fasl -- lib/core4.lisp lib/core4.lisp.fasl
      - name: Prove binary source SHA and exact AST parity
        run: cargo test --locked -p sens --test core_fasl_freshness -- --nocapture
      - name: Commit the tested FASL to this branch, never main
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "fix/5408-fasl-replay-20261011-gpt6"
          git diff --check
          git add -- lib/core4.lisp.fasl
          if git diff --cached --quiet; then
            echo "Authentic FASL is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "виправлення(Core4): справжній FASL із поточного точного джерела"
          git push origin HEAD:refs/heads/fix/5408-fasl-replay-20261011-gpt6
