name: Bilingual Documentation Check

on:
  push:
    paths:
      - "**/*.md"
      - "scripts/check-bilingual-docs"
  pull_request:
    paths:
      - "**/*.md"
      - "scripts/check-bilingual-docs"

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 50

      - name: Determine changed markdown files
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.base_ref }}" --depth=50
            base="origin/${{ github.base_ref }}"
          else
            base="${{ github.event.before }}"
            if [ -z "$base" ] || ! git cat-file -e "$base" 2>/dev/null; then
              base="HEAD~1"
            fi
          fi
          files=$(git diff --name-only "$base" HEAD -- '*.md' || true)
          {
            echo "files<<BILINGUAL_EOF"
            echo "$files"
            echo "BILINGUAL_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Check Ukrainian-first order for changed docs
        if: steps.changed.outputs.files != ''
        env:
          CHANGED_FILES: ${{ steps.changed.outputs.files }}
        run: |
          chmod +x scripts/check-bilingual-docs
          # CHANGED_FILES is newline-separated when multiple files changed.
          # Splicing the raw step-output expression directly into this
          # script (the old form) made the 2nd+ filenames run as their own
          # shell commands instead of extra arguments -- confirmed live
          # 2026-09-08 (run 34225535414): a real 3-file commit failed with
          # "Permission denied" because bash tried to execute the second
          # markdown file as a program. Passing the value through env and
          # splitting with xargs handles any number of files safely.
          printf '%s\n' "$CHANGED_FILES" | xargs -d '\n' -r ./scripts/check-bilingual-docs
