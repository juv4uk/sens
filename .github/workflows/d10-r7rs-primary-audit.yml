name: D10 R7RS primary manual bounded history audit
on:
  workflow_dispatch:
jobs:
  historical-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Historical source and negative guards
        run: python3 scripts/check_d10_r7rs_primary_slice.py --self-test
      - name: Working tree remains unchanged
        run: git diff --exit-code
