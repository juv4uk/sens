name: Червоний має говорити — 24 год і UNINFORMATIVE-OUTPUT

# Директива 2026-10-13: заборонено НЕІНФОРМАТИВНИЙ КЛАС, а не тести.
# Тут дозволена ручна діагностика; один автоматичний workflow лишається ci.yml.
# Самовільного запуску GitHub Actions немає.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  informative-red-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Повнота звіту та мутації відсутніх полів
        run: python3 scripts/ci_failure_contract.py self-test
      - name: Аудит 24 год, власників і завершення карантину
        run: python3 scripts/ci_failure_contract.py audit
      - name: Причини червоних і автономність рою за сім діб
        run: python3 scripts/red_cause_router.py audit
