name: Червоний має говорити — 24 год і UNINFORMATIVE-OUTPUT

on:
  push:
    branches: [main]
    paths:
      - 'scripts/ci_failure_contract.py'
      - 'knowledge/red-test-quarantine.json'
      - '.github/workflows/red-diagnostic-contract.yml'
  pull_request:
    paths:
      - 'scripts/ci_failure_contract.py'
      - 'knowledge/red-test-quarantine.json'
      - '.github/workflows/red-diagnostic-contract.yml'
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  informative-red-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Повнота звіту та мутації відсутніх полів
        run: python3 scripts/ci_failure_contract.py self-test
      - name: Аудит 24 год, власників і завершення карантину
        run: python3 scripts/ci_failure_contract.py audit
