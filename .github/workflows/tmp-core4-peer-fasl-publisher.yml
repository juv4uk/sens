name: TEMP Core4 source-matched FASL publisher

on:
  push:
    branches:
      - fix/core4-peer-materialize-no-letstar-20261010

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify exact Core4 source blob
        run: |
          set -euo pipefail
          actual="$(git hash-object lib/core4.lisp)"
          test "$actual" = "14c6e96ffbcb22267fe3b9da94fd1e3c72ade6c0"
          echo "CORE4_SOURCE_BLOB=$actual"
      - name: Generate physical binary FASL from exact source
        run: cargo run --locked --release -p sens-cli --bin gen-fasl -- lib/core4.lisp lib/core4.lisp.fasl
      - name: Run unchanged FASL freshness gate
        run: cargo test --locked -p sens --test core_fasl_freshness -- --nocapture
      - name: Commit only the generated FASL to this repair branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/core4.lisp.fasl
          if git diff --cached --quiet; then
            echo "FASL already fresh; no commit needed"
            exit 0
          fi
          git commit -m "fix(fasl): regenerate snapshot for peer-bootstrap source"
          git push origin "HEAD:${GITHUB_REF_NAME}"
