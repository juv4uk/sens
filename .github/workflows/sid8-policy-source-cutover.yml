name: SID8 policy source domain cutover
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify current D3 D4 sources and negative historical witnesses
        run: python3 -m unittest discover -s tests -p test_sid8_policy_source_cutover.py -v
