name: SID8 policy source domain cutover
on:
  push:
    branches: [main]
    paths:
      - "knowledge/foreign-tools-census.lisp"
      - "knowledge/language-policy.lisp"
      - "knowledge/swarm-legacy-deprecation.lisp"
      - "knowledge/swarm-no-live-callers-audit.lisp"
      - "knowledge/file-authority-policy.lisp"
      - "knowledge/guard-runtime-policy.lisp"
      - "lib/machine/lowering/semantic-effects.lisp"
      - "examples/ukrainian-greeting.lisp"
      - "tests/test_sid8_policy_source_cutover.py"
      - "scripts/check_d3_legacy_logic.py"
      - ".github/workflows/sid8-policy-source-cutover.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify current D3 D4 sources and negative historical witnesses
        run: python3 -m unittest discover -s tests -p test_sid8_policy_source_cutover.py -v
