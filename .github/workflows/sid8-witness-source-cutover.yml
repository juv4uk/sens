name: SID8 witness Lisp source cutover

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  immutable-blob-vs-domain-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Audit 28 executable witness sources and 2741 SID8 head-only replacements
        run: python3 -m unittest discover -s tests -p 'test_sid8_witness_*.py' -v
