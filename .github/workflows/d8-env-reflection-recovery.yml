name: D8 ENV reflection recovery

on:
  workflow_dispatch:

jobs:
  env-reflection-witness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Show Rust toolchain
        run: rustc --version && cargo --version
      - name: Run focused ENV recovery witness
        run: cargo test -p sens --test d8_env_reflection_recovery
