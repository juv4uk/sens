# rerun-after-successor-map
name: 4320 native-first exact migration once

on:
  push:
    branches:
      - replay/4225-3364-4263-atomic-current-main-1007
    paths:
      - ".github/workflows/4320-native-first-migrate-once.yml"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: replay/4225-3364-4263-atomic-current-main-1007
      - uses: dtolnay/rust-toolchain@stable
      - name: Generate exact-domain native-first with canonical migrator
        run: |
          cargo run --quiet -p sens-cli --bin sens-to-sens -- --exact-domain lib/machine/dispatch/native-first.lisp
      - name: Prove migration is idempotent and exact
        run: |
          set +e
          out="$(cargo run --quiet -p sens-cli --bin sens-to-sens -- --check --exact-domain lib/machine/dispatch/native-first.lisp 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$out"
          test "$status" -eq 0
          printf '%s\n' "$out" | grep -F "convertible=0"
          printf '%s\n' "$out" | grep -F "blocked-exact=0"
      - name: Commit generated source
        run: |
          git diff --check
          if git diff --quiet -- lib/machine/dispatch/native-first.lisp; then
            echo "native-first already exact; no commit needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/machine/dispatch/native-first.lisp
          git commit -m "fix(4320): generate complete exact-domain native-first source"
          git push origin HEAD:replay/4225-3364-4263-atomic-current-main-1007
