name: D7 non-varga geometry research

on:
  pull_request:
    paths:
      - "knowledge/d3-d8-stable-residents.json"
      - "knowledge/d7-full-map.json"
      - "benchmarks/d7-nonvarga-geometry/**"
      - ".github/workflows/d7-nonvarga-geometry.yml"
  workflow_dispatch:

jobs:
  nonvarga:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Run non-varga factor witness
        run: |
          rm -rf /tmp/d7-nonvarga
          python3 benchmarks/d7-nonvarga-geometry/run.py --out /tmp/d7-nonvarga
      - name: Publish report
        if: always()
        run: |
          test ! -f /tmp/d7-nonvarga/report.md || cat /tmp/d7-nonvarga/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d7-nonvarga-geometry
          path: /tmp/d7-nonvarga/
          retention-days: 14
