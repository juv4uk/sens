name: CLIPS kernel

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "crates/wsm-clips-kernel/**"
      - "crates/wsm-kernel-c-abi/**"
      - ".github/workflows/clips-kernel-test.yml"
      - "Cargo.toml"
      - "Cargo.lock"
  push:
    branches: [main]
    paths:
      - "crates/wsm-clips-kernel/**"
      - "crates/wsm-kernel-c-abi/**"
      - ".github/workflows/clips-kernel-test.yml"
      - "Cargo.toml"
      - "Cargo.lock"

jobs:
  default-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Prove default build does not require CLIPS
        run: cargo test -p wsm-clips-kernel --no-default-features --lib
      - name: Type-check runtime loader without installed CLIPS
        run: cargo check -p wsm-clips-kernel --features native-clips

  native-clips-642:
    # Preserve the repository-defined CLIPS 6.4.2 witness on a hosted runner.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Build pinned CLIPS 6.4.2 with Guix
        run: |
          sudo apt-get update
          sudo apt-get install -y guix
          CLIPS_OUT="$(guix time-machine -C channels.scm -- build -f packaging/guix/clips.scm | tail -1)"
          test -f "$CLIPS_OUT/lib/libclips.so"
          echo "WSM_CLIPS_LIBRARY=$CLIPS_OUT/lib/libclips.so" >> "$GITHUB_ENV"

      - name: Show native CLIPS library
        run: ls -l "$WSM_CLIPS_LIBRARY" && readlink -f "$WSM_CLIPS_LIBRARY"
      - name: Run real CLIPS agenda and retract witnesses
        run: cargo test -p wsm-clips-kernel --features native-clips --test c_abi_semantic_witness -- --nocapture
      - name: Clippy CLIPS adapter
        run: cargo clippy -p wsm-clips-kernel --all-targets --features native-clips -- -D warnings
