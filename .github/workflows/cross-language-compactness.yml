name: cross-language-compactness

# Круте порівняння «інші мови проти нашої» в межах шару «запис змісту»:
# розмір джерела C/JS/Python/Rust і SENS-проєкції (байти). Фізичний .sens
# не публікуємо без незалежного оракула — тут лише вимірювані розміри.
# Політика власника: рівно один АВТОМАТИЧНИЙ workflow (ci.yml); цей — ручний.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compactness:
    name: Other languages vs SENS — content-encoding size
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Measure cross-language content-encoding size
        run: |
          set -euo pipefail
          out="$(python3 benchmarks/cross-language/compactness/run.py)"
          printf '%s\n' "$out"
          printf '%s\n' "$out" | grep -q 'VERDICT: compactness measured'
      - name: Notice — honest scope
        run: echo "::notice title=cross-language-compactness::source-size comparison (content layer); .sens physical size awaits the independent oracle"
