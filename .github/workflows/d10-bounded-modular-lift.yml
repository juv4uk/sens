name: D10 bounded modular lift source and Chez oracle
on:
  pull_request:
    paths:
      - 'knowledge/d10-unique-bounded-modular-lift-20261009.json'
      - 'scripts/check_d10_unique_bounded_modular_lift.py'
      - 'tests/test_d10_unique_bounded_modular_lift.py'
      - 'tests/oracles/d10_unique_bounded_modular_lift_chez.ss'
      - 'docs/research/d10-bounded-modular-lift-20261009.uk.md'
      - '.github/workflows/d10-bounded-modular-lift.yml'
  workflow_dispatch:
jobs:
  source-provenance-and-exact-oracles:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Verify research-only provenance and nine anti-forgery cases
        run: python3 scripts/check_d10_unique_bounded_modular_lift.py
      - name: Verify interval arithmetic against independent exhaustive enumeration
        run: python3 -m unittest discover -s tests -p 'test_d10_unique_bounded_modular_lift.py' -v
      - name: Install real R6RS Chez Scheme
        run: sudo apt-get update -qq && sudo apt-get install -y chezscheme
      - name: Run sixteen independent Chez donor observations
        run: python3 scripts/check_d10_unique_bounded_modular_lift.py --real-chez --scheme scheme
