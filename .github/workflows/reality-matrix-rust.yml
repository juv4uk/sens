name: Reality Matrix Rust smoke

on:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  rust-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run D3 Rust reality smoke — EXCLUDED (NOT_VERIFIED)
        if: false
        shell: bash
        run: echo "FOREIGN_LANGUAGE_TEST_BENCH=EXCLUDED_BY_POLICY native_equivalent=NOT_VERIFIED"
      - name: Check machine-readable output — EXCLUDED (NOT_VERIFIED)
        if: false
        shell: bash
        run: echo "FOREIGN_LANGUAGE_TEST_BENCH=EXCLUDED_BY_POLICY native_equivalent=NOT_VERIFIED"
      - name: Upload smoke evidence
        uses: actions/upload-artifact@v4
        with:
          name: reality-matrix-rust-smoke
          path: |
            ${{ runner.temp }}/reality-rust/comparison.json
            ${{ runner.temp }}/reality-rust/environment.json
            ${{ runner.temp }}/reality-rust/raw/runs.tsv
            ${{ runner.temp }}/reality-rust/report.md
