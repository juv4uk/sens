name: SENS exact spaced-view T5 gate

on:
  pull_request:
    paths:
      - 'scripts/sens_spaced_view.py'
      - 'scripts/sens_t5_codec.py'
      - 'tests/test_sens_spaced_view.py'
      - 'tests/test_t5_triplet_crosscheck.py'
      - 'scripts/verify_uk_t5_triplet.py'
      - 'scripts/report_t5_triplet_inventory.py'
      - 'tests/fixtures/migration-d1-cond-cohort/**'
      - '.github/workflows/sens-spaced-view.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/sens_spaced_view.py'
      - 'scripts/sens_t5_codec.py'
      - 'tests/test_sens_spaced_view.py'
      - 'tests/test_t5_triplet_crosscheck.py'
      - 'scripts/verify_uk_t5_triplet.py'
      - 'scripts/report_t5_triplet_inventory.py'
      - 'tests/fixtures/migration-d1-cond-cohort/**'
      - '.github/workflows/sens-spaced-view.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  read-only-view-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Build independent current Rust D2 physical T5 reader
        run: cargo build -q -p sens-cli --bin sens-trit
      - name: Prove same exact typed words from real Rust reader and committed extensionless view
        run: |
          set -euo pipefail
          target/debug/sens-trit open tests/fixtures/migration-d1-cond-cohort/branch.sens             > "$RUNNER_TEMP/branch-rust-d2-view"
          cmp -s "$RUNNER_TEMP/branch-rust-d2-view" tests/fixtures/migration-d1-cond-cohort/branch
          python3 - "$RUNNER_TEMP/branch-rust-d2-view" <<'PY'
          import pathlib, re, sys
          view = pathlib.Path(sys.argv[1]).read_bytes()
          assert re.fullmatch(rb"[01]{1,9}(?: [01]{1,9})*\n", view), "noncanonical 0/1 words"
          assert len(view[:-1].split(b" ")) == 19, "lost domain word boundary"
          print("RUST_D2_OPEN=PASS; EXACT_EXTENSIONLESS_VIEW=PASS")
          PY
      - name: Stage generated view only in external scratch and prove identity
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/verified-views"
          python3 scripts/sens_spaced_view.py --root .             --sens tests/fixtures/migration-d1-cond-cohort/branch.sens             --stage "$RUNNER_TEMP/verified-views"             > "$RUNNER_TEMP/sens-view-stage-ledger.json"
          cmp -s "$RUNNER_TEMP/verified-views/tests/fixtures/migration-d1-cond-cohort/branch"             tests/fixtures/migration-d1-cond-cohort/branch
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Independently execute actual Ukrainian D1 COND canary in current Rust SENS
        run: cargo test -q -p sens --test migration_d1_cond_cohort -- --nocapture
      - name: Verify strict view codec and fail-closed negative cases
        run: python3 -m unittest discover -s tests -p 'test_sens_spaced_view.py' -v
      - name: Prove three independent triplet checkers agree on SHA and semantic boundaries
        run: python3 -m unittest discover -s tests -p 'test_t5_triplet_crosscheck.py' -v
      - name: Verify committed fixture is exact T5 view, without release claims
        run: |
          python3 scripts/sens_spaced_view.py \
            --root . \
            --sens tests/fixtures/migration-d1-cond-cohort/branch.sens \
            --verify > "$RUNNER_TEMP/sens-view-ledger.json"
          python3 - "$RUNNER_TEMP/sens-view-ledger.json" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as stream:
              receipt = json.load(stream)
          assert receipt["status"] == "VERIFY"
          assert receipt["words"] == 19
          assert receipt["physical_bytes"] == 12
          assert receipt["semantic_oracle"] == "NOT_VERIFIED_BY_VIEW_TOOL"
          assert receipt["release_admitted"] is False
          assert all(len(receipt[key]) == 64 for key in (
              "source_sha256", "sens_sha256", "view_sha256", "typed_word_sha256"
          ))
          print(json.dumps(receipt, ensure_ascii=False, indent=2))
          PY
      - uses: actions/upload-artifact@v6
        with:
          name: sens-spaced-view-ledger
          path: ${{ runner.temp }}/sens-view-ledger.json
          retention-days: 14
