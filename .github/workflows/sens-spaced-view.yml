name: Strict same-stem SENS spaced 0-1 view

on:
  pull_request:
    paths:
      - "scripts/sens_spaced_view.py"
      - "scripts/sens_t5_codec.py"
      - "tests/test_sens_spaced_view.py"
      - "tests/fixtures/migration-d1-cond-cohort/branch"
      - "tests/fixtures/migration-d1-cond-cohort/branch.lisp"
      - "tests/fixtures/migration-d1-cond-cohort/branch.sens"
      - ".github/workflows/sens-spaced-view.yml"
  push:
    branches: [main]
    paths:
      - "scripts/sens_spaced_view.py"
      - "scripts/sens_t5_codec.py"
      - "tests/test_sens_spaced_view.py"
      - "tests/fixtures/migration-d1-cond-cohort/branch"
      - "tests/fixtures/migration-d1-cond-cohort/branch.sens"
      - "tests/fixtures/migration-d1-cond-cohort/branch.lisp"
      - ".github/workflows/sens-spaced-view.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-spaced-view:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Build real D2 reader
        run: cargo build -q -p sens-cli --bin sens-trit
      - name: Strict ASCII inverse, no-clobber and negative scenarios
        run: python3 -m unittest discover -s tests -p test_sens_spaced_view.py -v
      - name: Prove actual committed triple matches physical T5
        run: |
          set -euo pipefail
          python3 scripts/sens_spaced_view.py \
            --source tests/fixtures/migration-d1-cond-cohort/branch.sens \
            --reader target/debug/sens-trit --verify \
            --report "$RUNNER_TEMP/spaced-canary-verify.json"
          python3 scripts/sens_spaced_view.py \
            --source tests/fixtures/migration-d1-cond-cohort/branch.sens \
            --reader target/debug/sens-trit --stage \
            --out-root "$RUNNER_TEMP/t5-human-views" \
            --report "$RUNNER_TEMP/spaced-canary-stage.json"
          cmp -s "$RUNNER_TEMP/t5-human-views/tests/fixtures/migration-d1-cond-cohort/branch" \
            tests/fixtures/migration-d1-cond-cohort/branch
          python3 - "$RUNNER_TEMP/spaced-canary-stage.json" <<'PY'
          import json, sys
          from pathlib import Path
          j = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert j["status"] == "STAGED_VIEW_T5_ONLY" and j["files_written"] == 1, j
          assert j["t5_roundtrip"] == "PASS" and j["rust_d2_syntax"] == "PASS", j
          assert j["canonical_uk_surface"] == "NOT_VERIFIED", j
          assert j["semantic_oracle"] == "NOT_VERIFIED" and j["release_admitted"] is False, j
          print("physical->ASCII view reversible; uk semantics independently checked")
          PY
      - name: Independently execute Ukrainian D1 canary with current Rust SENS
        run: cargo test -q -p sens --test migration_d1_cond_cohort -- --nocapture
      - name: Source, T5 and tracked view stay unchanged
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Save typed widths and physical view digests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sens-triple-spaced-view-evidence
          path: |
            ${{ runner.temp }}/spaced-canary-verify.json
            ${{ runner.temp }}/spaced-canary-stage.json
          if-no-files-found: warn
