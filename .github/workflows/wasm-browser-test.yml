name: WASM Browser Test

on:
  workflow_dispatch:
jobs:
  browser-test:
    if: vars.HOSTED_RUNNERS == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install pinned Zig source transport
        uses: ./.github/actions/install-zig

      # The repository's local Guix/offline profile points Cargo at a generated
      # vendor/ tree which is intentionally not committed. Hosted runners are
      # clean checkouts, so this workflow must use crates.io explicitly.
      - name: Use online Cargo registry on hosted runner
        run: rm .cargo/config.toml

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0

      - name: Run WASM tests in headless Chrome
        run: wasm-pack test --headless --chrome crates/sens-wasm

      - name: Run WASM tests in headless Firefox
        run: wasm-pack test --headless --firefox crates/sens-wasm

      # Першопричина: усе вище тестує Rust-КРЕЙТ, а не ВІДВАНТАЖЕНУ сторінку.
      # Крейт сам зізнається, що не перетинає межу wasm-bindgen/JavaScript,
      # а жоден тест не доводив, що портативний REPL ВИКОНУЄ Сенс. Тож job
      # «WASM Browser Test» міг бути зеленим на REPL, який лише вантажиться.
      # Тепер збираємо справжній портативний HTML і вимагаємо виконання.
      - name: Set up Node
        uses: actions/setup-node@1d0ff469bff94528cc1f4574573e1b86c2c9dc7d # v4
        with:
          node-version: "20"

      - name: Build the shipped portable HTML
        shell: bash
        run: |
          set -euo pipefail
          wasm-pack build crates/sens-wasm --target web --out-dir ../../public/wasm --release
          node scripts/make-portable-web.mjs public/my-lisp-cli-web.html sens-cli-web.html
          test -s sens-cli-web.html

      - name: Install Playwright chromium
        run: npx --yes playwright@1.47.2 install --with-deps chromium

      - name: Assert the shipped REPL EXECUTES SENS
        run: node scripts/verify-web-repl-execution.mjs sens-cli-web.html
