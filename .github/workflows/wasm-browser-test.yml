name: WASM Browser Test

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'crates/my-lisp-wasm/**'
      - 'crates/my-lisp/src/**'
      - 'crates/my-lisp/Cargo.toml'
      - 'crates/my-lisp-literate/**'
      - 'crates/my-lisp-lsp/**'
      - 'lib/core.lisp'       # canonical (my-lisp#81)
      - 'lib/core.lisp.fasl'  # canonical compiled snapshot
      # legacy aliases kept for reference: lib/core.my, lib/core.my.fasl
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/wasm-browser-test.yml'

jobs:
  browser-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The repository's local Guix/offline profile points Cargo at a generated
      # vendor/ tree which is intentionally not committed. Hosted runners are
      # clean checkouts, so this workflow must use crates.io explicitly.
      - name: Use online Cargo registry on hosted runner
        run: rm .cargo/config.toml

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0

      - name: Run WASM tests in headless Chrome
        run: wasm-pack test --headless --chrome crates/my-lisp-wasm

      - name: Run WASM tests in headless Firefox
        run: wasm-pack test --headless --firefox crates/my-lisp-wasm
