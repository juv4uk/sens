name: WASM Browser Test

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'crates/sens-wasm/**'
      - 'crates/sens/src/**'
      - 'crates/sens/Cargo.toml'
      - 'crates/sens-literate/**'
      - 'crates/sens-lsp/**'
      - 'lib/core.lisp'       # single active SENS core (#2367)
      - 'lib/core.lisp.fasl'  # canonical compiled snapshot (#2367)
      # legacy aliases kept for reference: lib/core.my, lib/core.my.fasl
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/wasm-browser-test.yml'

jobs:
  browser-test:
    if: vars.HOSTED_RUNNERS == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The repository's local Guix/offline profile points Cargo at a generated
      # vendor/ tree which is intentionally not committed. Hosted runners are
      # clean checkouts, so this workflow must use crates.io explicitly.
      - name: Use online Cargo registry on hosted runner
        run: rm .cargo/config.toml

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0

      - name: Run WASM tests in headless Chrome
        run: wasm-pack test --headless --chrome crates/sens-wasm

      - name: Run WASM tests in headless Firefox
        run: wasm-pack test --headless --firefox crates/sens-wasm
