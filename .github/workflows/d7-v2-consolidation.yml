name: D7 v2 consolidation

on:
  pull_request:
    paths:
      - "knowledge/d7-v2-stable-residents.json"
      - "knowledge/d7-v2-evidence-ledger.json"
      - "knowledge/d7-full-map.json"
      - "benchmarks/d7-v2/**"
      - "scripts/check-d7-v2-consolidation.py"
      - ".github/workflows/d7-v2-consolidation.yml"
  workflow_dispatch:

jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check consolidated D7 evidence
        run: python3 scripts/check-d7-v2-consolidation.py
      - name: Replay varga product witness
        run: python3 benchmarks/d7-v2/varga.py --out /tmp/d7-varga
      - name: Replay convention/provenance firewall
        run: python3 benchmarks/d7-v2/residue.py --out /tmp/d7-residue
      - name: Replay non-varga factor witness
        run: python3 benchmarks/d7-v2/nonvarga.py --out /tmp/d7-nonvarga
      - name: Replay vowel product/affine witness
        run: python3 benchmarks/d7-v2/vowel.py --out /tmp/d7-vowel
