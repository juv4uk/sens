name: D7 v2 consolidation

on:
  workflow_dispatch:

jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check consolidated D7 evidence
        run: python3 scripts/check-d7-v2-consolidation.py
      - name: Replay varga product witness — EXCLUDED (NOT_VERIFIED)
        if: false
        shell: bash
        run: echo "FOREIGN_LANGUAGE_TEST_BENCH=EXCLUDED_BY_POLICY native_equivalent=NOT_VERIFIED"
      - name: Replay convention/provenance firewall — EXCLUDED (NOT_VERIFIED)
        if: false
        shell: bash
        run: echo "FOREIGN_LANGUAGE_TEST_BENCH=EXCLUDED_BY_POLICY native_equivalent=NOT_VERIFIED"
      - name: Replay non-varga factor witness — EXCLUDED (NOT_VERIFIED)
        if: false
        shell: bash
        run: echo "FOREIGN_LANGUAGE_TEST_BENCH=EXCLUDED_BY_POLICY native_equivalent=NOT_VERIFIED"
      - name: Replay vowel product/affine witness — EXCLUDED (NOT_VERIFIED)
        if: false
        shell: bash
        run: echo "FOREIGN_LANGUAGE_TEST_BENCH=EXCLUDED_BY_POLICY native_equivalent=NOT_VERIFIED"
      - name: Check exact Text7 W7 mechanism
        run: cargo test -p sens --test d7_w7_pack
