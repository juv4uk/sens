name: diag-4320-semantic-slice-split

on:
  push:
    branches:
      - diag/4320-semantic-slice-split

jobs:
  split:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: rust d1_canonical_source_value
        continue-on-error: true
        run: cargo test -p sens --test d1_canonical_source_value -- --nocapture
      - name: rust witness_authority
        continue-on-error: true
        run: cargo test -p sens --test witness_authority -- --nocapture
      - name: rust structural_observation_contract
        continue-on-error: true
