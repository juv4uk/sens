name: quote-cohort-physical-T5

on:
  push:
    branches: [migrate/4455-quote-three-pass-20261008]
    paths:
      - 'tests/fixtures/migration-quote-cohort/quote-legacy.lisp'
      - 'tests/test_migration_quote_cohort.py'
      - '.github/workflows/quote-cohort-physical-T5.yml'

permissions:
  contents: write

jobs:
  migrate-once:
    if: github.repository == 'juv4uk/sens' && github.ref == 'refs/heads/migrate/4455-quote-three-pass-20261008'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Produce physical byte file only if missing
        shell: bash
        run: |
          set -euo pipefail
          src=tests/fixtures/migration-quote-cohort/quote-legacy.lisp
          dst=tests/fixtures/migration-quote-cohort/quote-legacy.sens
          test -f "$src"
          test ! -e "$dst"
          python3 scripts/migrate-three-pass.py tests/fixtures/migration-quote-cohort \
            --out "$RUNNER_TEMP/sens-t5" \
            --foundation knowledge/d1-d7-foundation.json \
            --domain-surfaces crates/sens/src/domain_surface_registry_generated.rs \
            --semantic-generated crates/sens/src/semantic_registry_generated.rs \
            --semantic-registry crates/sens/src/semantic_registry.rs \
            --necessary-forms crates/sens/src/eval/necessary_forms_generated.rs \
            --historical-map contracts/core1-historical-sid-map.lisp \
            --text7 crates/sens/src/text7_projection_generated.rs \
            --report "$RUNNER_TEMP/migration-quote.json"
          python3 - "$RUNNER_TEMP/sens-t5/quote-legacy.sens" <<'PY'
          import pathlib, sys
          actual = pathlib.Path(sys.argv[1]).read_bytes()
          assert actual == bytes.fromhex("638906a1"), actual.hex()
          assert len(actual) == 4
          print("PHYSICAL_T5=PASS bytes=638906a1")
          PY
          cp --no-clobber "$RUNNER_TEMP/sens-t5/quote-legacy.sens" "$dst"
          git add -- "$dst"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'migrate(4455): publish exact physical T5 quote fixture'
          git push origin "HEAD:$GITHUB_REF"
