name: "Зшивання канонічних бітопотоків"

on:
  pull_request:
    paths:
      - "crates/sens/src/packed_bits.rs"
      - ".github/workflows/packed-stream-concatenation.yml"
  push:
    branches: [main]
    paths:
      - "crates/sens/src/packed_bits.rs"
      - ".github/workflows/packed-stream-concatenation.yml"

permissions:
  contents: read

jobs:
  packed-stream-concatenation:
    name: "Перевірити точне зшивання бітів D1–D10"
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: "Зібрати бібліотеку"
        run: cargo check --locked -p sens --lib
      - name: "Прогнати всі свідки пакувальника"
        run: cargo test --locked -p sens --lib packed_bits::tests:: -- --nocapture
