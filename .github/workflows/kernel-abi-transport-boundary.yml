name: Kernel ABI transport boundary

on:
  pull_request:
    paths:
      - "contracts/kernel-abi-transport-boundary.lisp"
      - "scripts/check-kernel-abi-transport-boundary.lisp"
      - "knowledge/repo-tooling-inventory.lisp"
      - "crates/wsm-kernel-c-abi/**"
      - "crates/wsm-common-lisp-kernel/**"
      - "crates/wsm-prolog-kernel/**"
      - "crates/wsm-clips-kernel/**"
      - "crates/wsm-datalog-kernel/**"
      - ".github/workflows/kernel-abi-transport-boundary.yml"
  push:
    branches: [main]
    paths:
      - "contracts/kernel-abi-transport-boundary.lisp"
      - "scripts/check-kernel-abi-transport-boundary.lisp"
      - "knowledge/repo-tooling-inventory.lisp"
      - "crates/wsm-kernel-c-abi/**"
      - "crates/wsm-common-lisp-kernel/**"
      - "crates/wsm-prolog-kernel/**"
      - "crates/wsm-clips-kernel/**"
      - "crates/wsm-datalog-kernel/**"
      - ".github/workflows/kernel-abi-transport-boundary.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  boundary:
    name: Kernel ABI remains transport-only
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build semantic oracle
        run: cargo build -p sens-cli --bin sens
      - name: Execute Lisp-owned kernel ABI policy
        shell: bash
        run: |
          set -euo pipefail
          got="$(./target/debug/sens scripts/check-kernel-abi-transport-boundary.lisp)"
          printf '%s\n' "$got"
          test "$got" = "(kernel-abi-transport-boundary-ok (kernels 4) (language-type CoreDomainIdentity) (abi-wrapper LegacyAbiSemanticId))"
      - name: Verify mechanical transport boundary in host sources
        shell: bash
        run: |
          set -euo pipefail

          abi_source="crates/wsm-kernel-c-abi/src/lib.rs"
          abi_manifest="crates/wsm-kernel-c-abi/Cargo.toml"
          grep -Fq 'pub semantic_id: u8,' "$abi_source"
          if grep -Eq 'Sens8|Sid8|sens::|use[[:space:]]+sens|semantic_registry|CanonicalIdentity' "$abi_source"; then
            echo "kernel C ABI acquired language-semantic coupling" >&2
            exit 1
          fi
          if grep -Eq '^[[:space:]]*sens[[:space:]]*=' "$abi_manifest"; then
            echo "kernel C ABI must not depend on sens" >&2
            exit 1
          fi

          while IFS='|' read -r source manifest; do
            grep -Fq 'pub struct LegacyAbiSemanticId(pub u8);' "$source"
            if grep -Eq 'Sens8|Sid8|CoreDomainIdentity|sens::|use[[:space:]]+sens|semantic_registry|CanonicalIdentity' "$source"; then
              echo "kernel ABI wrapper crossed into language authority: $source" >&2
              exit 1
            fi
            if grep -Eq '^[[:space:]]*sens[[:space:]]*=' "$manifest"; then
              echo "kernel crate must remain independent from sens: $manifest" >&2
              exit 1
            fi
          done <<'EOF'
          crates/wsm-common-lisp-kernel/src/lib.rs|crates/wsm-common-lisp-kernel/Cargo.toml
          crates/wsm-prolog-kernel/src/lib.rs|crates/wsm-prolog-kernel/Cargo.toml
          crates/wsm-clips-kernel/src/lib.rs|crates/wsm-clips-kernel/Cargo.toml
          crates/wsm-datalog-kernel/src/lib.rs|crates/wsm-datalog-kernel/Cargo.toml
          EOF
      - name: Diff hygiene
        run: git diff --check
