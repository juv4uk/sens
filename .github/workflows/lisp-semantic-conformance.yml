name: Current D1/D3 semantic conformance

# Чинні доменні D1/D3 тести замість старого Function8 корпусу.
on:
  pull_request:
    paths:
      - "tests/fixtures/semantic/*"
      - "crates/sens/tests/d3_empty_control.rs"
      - "crates/sens/tests/canon_d1_migration_cohort.rs"
      - "crates/sens/tests/semantic_authority.rs"
      - ".github/workflows/lisp-semantic-conformance.yml"
  push:
    branches: [main]
    paths:
      - "tests/fixtures/semantic/*"
      - "crates/sens/tests/d3_empty_control.rs"
      - "crates/sens/tests/canon_d1_migration_cohort.rs"
      - "crates/sens/tests/semantic_authority.rs"
      - ".github/workflows/lisp-semantic-conformance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lisp-semantic-conformance:
    name: Canonical exact-domain witnesses
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: lisp-semantic-conformance

      - name: PredicateBit and exact COND witness
        run: cargo test -p sens --test d3_empty_control -- --nocapture

      - name: Canonical D1/COND witness
        run: cargo test -p sens --test canon_d1_migration_cohort -- --nocapture

      - name: Diff hygiene
        run: git diff --check
