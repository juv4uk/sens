name: D10 STRIPS independent oracle
on:
  pull_request:
    paths:
      - 'scripts/check_d10_strips_goal_regression.py'
      - 'tests/test_d10_strips_goal_regression.py'
      - 'tests/oracles/d10_strips_goal_regression.pl'
      - 'knowledge/d10-symbolic-ai-strips-goal-regression-research-v1.json'
      - '.github/workflows/d10-strips-goal-regression.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/check_d10_strips_goal_regression.py'
      - 'tests/test_d10_strips_goal_regression.py'
      - '.github/workflows/d10-strips-goal-regression.yml'
permissions:
  contents: read
jobs:
  exact-world-oracle:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Python action-goal exhaustive world test
        run: python3 -m unittest discover -s tests -p 'test_d10_strips_goal_regression.py' -v
      - name: Cross-check all finite predecessor worlds
        run: python3 scripts/check_d10_strips_goal_regression.py --self-check
