name: Audit historical SID8 MAP cutover into D6

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-law-witness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify 12 actual single-list MAP sources and ratified D6 vs D8
        run: python3 -m unittest discover -s tests -p test_sid8_d6_map_source_cutover.py -v
