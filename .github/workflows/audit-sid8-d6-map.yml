name: Доменний контроль D6/D8 MAP — без восьмибітного ототожнення

on:
  pull_request:
    paths:
      - "lib/yantra.lisp"
      - "lib/linter.lisp"
      - "lib/core.lisp"
      - "lib/knowledge.lisp"
      - "knowledge/sens8-current-coverage-v1.json"
      - "knowledge/d1-d9-foundation.json"
      - "tests/test_domain_d6_map_source_cutover.py"
      - ".github/workflows/audit-sid8-d6-map.yml"
  push:
    branches: [main]
    paths:
      - "lib/yantra.lisp"
      - "lib/linter.lisp"
      - "lib/core.lisp"
      - "lib/knowledge.lisp"
      - "knowledge/sens8-current-coverage-v1.json"
      - "knowledge/d1-d9-foundation.json"
      - "tests/test_domain_d6_map_source_cutover.py"
      - ".github/workflows/audit-sid8-d6-map.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-law-witness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Перевірити координати, неоднозначність та чотири поточні джерела
        run: python3 -m unittest discover -s tests -p test_domain_d6_map_source_cutover.py -v
