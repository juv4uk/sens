name: Тест preflight — exact-domain process reader

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  process-reader-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: "TCP точковий свідок: 7 бітів і всі 2046 координат D1-D10"
        run: python3 -m unittest discover -s tests -p test_tcp_d1_fallback.py -v
      - name: TCP виконуваний двостановий D1 і відхилення Number 1
        run: cargo test --locked -p sens --features rust-t5-reference --test tcp_d1_fallback -- --nocapture
      - name: "Process strict D1: five real AST values and conditional short-circuit"
        run: cargo test --locked -p sens --test process_d1_direct -- --nocapture
      - name: Незалежний Rust-тест D4 NOT та D3 EQ без D24+
        run: cargo test --locked -p sens --test process_d1_reflection -- --nocapture
      - name: Позитивний і негативний exact-domain process reader preflight
        run: cargo test --locked -p sens --test current_binary_preflight -- --nocapture
