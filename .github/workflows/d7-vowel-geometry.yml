name: D7 vowel geometry research

on:
  pull_request:
    paths:
      - "knowledge/d3-d8-stable-residents.json"
      - "knowledge/d7-full-map.json"
      - "benchmarks/d7-vowel-geometry/**"
      - ".github/workflows/d7-vowel-geometry.yml"
  workflow_dispatch:

jobs:
  vowels:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Run vowel product witness
        run: |
          rm -rf /tmp/d7-vowel-geometry
          python3 benchmarks/d7-vowel-geometry/run.py --out /tmp/d7-vowel-geometry
      - name: Publish report
        if: always()
        run: |
          test ! -f /tmp/d7-vowel-geometry/report.md || cat /tmp/d7-vowel-geometry/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d7-vowel-geometry
          path: /tmp/d7-vowel-geometry/
          retention-days: 14
