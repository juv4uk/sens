name: D5 FEXPR MACRO residual law

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  classify:
    name: D5 FEXPR/MACRO residual classification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Replay merged donor evidence
        run: |
          python3 scripts/research-2522-fexpr-protocol-cube.py
          python3 benchmarks/d5-structural-discovery/special_call_factor.py --check
      - name: Check D5 pair classification
        run: python3 scripts/research-3025-d5-fexpr-macro-pair.py --check
