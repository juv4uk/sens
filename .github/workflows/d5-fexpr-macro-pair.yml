name: D5 FEXPR MACRO residual law

on:
  pull_request:
    paths:
      - "knowledge/d5-historical-full-map.json"
      - "benchmarks/d5-structural-discovery/special-call-factor.json"
      - "knowledge/d5-fexpr-macro-pair.json"
      - "scripts/research-3025-d5-fexpr-macro-pair.py"
      - ".github/workflows/d5-fexpr-macro-pair.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  classify:
    name: D5 FEXPR/MACRO residual classification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Replay merged donor evidence
        run: |
          python3 scripts/research-2522-fexpr-protocol-cube.py
          python3 benchmarks/d5-structural-discovery/special_call_factor.py --check
      - name: Check D5 pair classification
        run: python3 scripts/research-3025-d5-fexpr-macro-pair.py --check
