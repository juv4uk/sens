name: D8 INTEGERP-RATIONALP sign research

on:
  pull_request:
    paths:
      - "benchmarks/d8-integerp-rationalp-sign/**"
      - "knowledge/d6-ratified.json"
      - ".github/workflows/d8-integerp-rationalp-sign.yml"
  push:
    branches:
      - main
    paths:
      - "benchmarks/d8-integerp-rationalp-sign/**"
      - "knowledge/d6-ratified.json"
      - ".github/workflows/d8-integerp-rationalp-sign.yml"
  workflow_dispatch:

jobs:
  falsifier:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Run exact-Q sign-axis falsifier
        run: |
          rm -rf /tmp/d8-integerp-rationalp-sign
          python3 benchmarks/d8-integerp-rationalp-sign/run.py \
            --out /tmp/d8-integerp-rationalp-sign
      - name: Verify deterministic replay
        run: |
          rm -rf /tmp/d8-integerp-rationalp-sign-2
          python3 benchmarks/d8-integerp-rationalp-sign/run.py \
            --out /tmp/d8-integerp-rationalp-sign-2
          cmp /tmp/d8-integerp-rationalp-sign/witness.json \
              /tmp/d8-integerp-rationalp-sign-2/witness.json
      - name: Publish report
        if: always()
        run: |
          test ! -f /tmp/d8-integerp-rationalp-sign/report.md || \
            cat /tmp/d8-integerp-rationalp-sign/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: d8-integerp-rationalp-sign
          path: /tmp/d8-integerp-rationalp-sign/
          retention-days: 14
