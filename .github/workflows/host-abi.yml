name: Host ABI regression

on:
  pull_request:
    paths:
      - "crates/sens-host/src/native_exec.rs"
      - "crates/sens-host/tests/native_guest_abi.rs"
      - ".github/workflows/host-abi.yml"
  push:
    branches: [main]
    paths:
      - "crates/sens-host/src/native_exec.rs"
      - "crates/sens-host/tests/native_guest_abi.rs"
      - ".github/workflows/host-abi.yml"
  workflow_dispatch:

jobs:
  guest-abi-isolation:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: host-abi-${{ matrix.os }}
      - name: Guest ABI isolation witness
        run: cargo test -p sens-host --test native_guest_abi -- --nocapture
      - name: Existing native execution witnesses
        run: cargo test -p sens-host --test native_lisp_bytes --test native_cond_profile
      - name: Clippy host crate
        run: cargo clippy -p sens-host --all-targets -- -D warnings
