name: SENS physical bytes vs visible bits — performance

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sens-packed-bench-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  performance:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build release benchmark executable
        run: cargo build --locked --release -p sens --example packed_vs_visible_bench --example packed_vs_visible_runtime --example sens_cold_start_probe

      - name: Record hosted hardware and Rust toolchain
        run: |
          mkdir -p artifacts/performance
          echo "git_sha=${GITHUB_SHA}" > artifacts/performance/environment.txt
          rustc --version >> artifacts/performance/environment.txt
          uname -a >> artifacts/performance/environment.txt
          lscpu >> artifacts/performance/environment.txt
          echo "benchmark=paired-ingest-plus-evaluation; word-width-metadata=external" >> artifacts/performance/environment.txt

      - name: Measure current packed-vs-visible reader (not a unit-test proxy)
        run: |
          target/release/examples/packed_vs_visible_bench --samples 9 \
            | tee artifacts/performance/packed-vs-visible.jsonl

      - name: Benchmark real evaluation with warm and cold session
        run: |
          target/release/examples/packed_vs_visible_runtime --samples 9 \
            | tee artifacts/performance/packed-vs-visible-runtime.jsonl

      - name: Publish measured ratios, not imagined performance claims
        run: |
          echo "PYTHON_REPORTING=EXCLUDED_BY_POLICY native_equivalent=NOT_VERIFIED"
          cat artifacts/performance/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publish separate runtime (not just ingest) performance table
        run: |
          echo "PYTHON_REPORTING=EXCLUDED_BY_POLICY native_equivalent=NOT_VERIFIED"
          cat artifacts/performance/runtime-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: "Measure actual new-process, bare Session and Lisp-owned Core4 startup — EXCLUDED (NOT_VERIFIED)"
        shell: bash
        run: echo "PYTHON_TESTS_AND_BENCHMARKS=EXCLUDED_BY_LANGUAGE_POLICY native_equivalent=NOT_VERIFIED"

      - name: Measure controlled cached-vs-uncached full Core4 bootstrap
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked --release -p sens --lib \
            core4_bootstrap_cache_tests::benchmark_core4_cache_vs_fresh \
            -- --ignored --nocapture \
            | tee artifacts/performance/core4-cache-ab.log

      - name: Publish controlled cache A/B samples and CPU context
        run: |
          echo "PYTHON_REPORTING=EXCLUDED_BY_POLICY native_equivalent=NOT_VERIFIED"
          cat artifacts/performance/core4-cache-ab-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload full raw sample evidence and CPU provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sens-packed-vs-visible-${{ github.sha }}
          path: artifacts/performance/
          if-no-files-found: warn
          retention-days: 30
