name: SENS · D4 λ у наукових константах

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  binary-sens-self-verdict:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Сам SENS перевіряє лексичне зв'язування та мутант
        run: cargo test -p sens --test quantity_d4_transport -- --nocapture
