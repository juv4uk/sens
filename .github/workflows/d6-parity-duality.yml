name: D6 parity duality research

on:
  pull_request:
    paths:
      - "benchmarks/d6-parity-duality/**"
      - ".github/workflows/d6-parity-duality.yml"
  push:
    branches: [main]
    paths:
      - "benchmarks/d6-parity-duality/**"
      - ".github/workflows/d6-parity-duality.yml"
  workflow_dispatch:

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Run exact-integer parity witness against current D6 authority
        run: |
          set -euo pipefail
          rm -rf /tmp/d6-parity-duality
          python3 benchmarks/d6-parity-duality/run.py --out /tmp/d6-parity-duality

      - name: Publish report
        if: always()
        run: |
          if test -f /tmp/d6-parity-duality/report.md; then
            cat /tmp/d6-parity-duality/report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d6-parity-duality
          path: /tmp/d6-parity-duality/
          retention-days: 14
