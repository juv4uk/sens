name: D6 parity duality research

on:
  pull_request:
    paths:
      - "benchmarks/d6-parity-duality/**"
      - ".github/workflows/d6-parity-duality.yml"
  push:
    branches: [main]
    paths:
      - "benchmarks/d6-parity-duality/**"
      - ".github/workflows/d6-parity-duality.yml"
  workflow_dispatch:

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Materialize pinned stable-resident donor
        run: |
          git fetch --no-tags --depth=1 origin 86d49ef4477345082e60452800bae6c2d184390c
          git show 86d49ef4477345082e60452800bae6c2d184390c:knowledge/d3-d8-stable-residents.json \
            > /tmp/d3-d8-stable-residents.json
          git show 86d49ef4477345082e60452800bae6c2d184390c:scripts/check-3051-stable-resident-corpus.py \
            > /tmp/check-3051-stable-resident-corpus.py

      - name: Validate stable resident corpus
        run: |
          rm -rf /tmp/stable-resident-audit
          python3 /tmp/check-3051-stable-resident-corpus.py \
            --corpus /tmp/d3-d8-stable-residents.json \
            --out /tmp/stable-resident-audit

      - name: Run D6 parity duality witness
        run: |
          rm -rf /tmp/d6-parity-duality
          python3 benchmarks/d6-parity-duality/run.py \
            --corpus /tmp/d3-d8-stable-residents.json \
            --out /tmp/d6-parity-duality

      - name: Publish report
        if: always()
        run: |
          if test -f /tmp/d6-parity-duality/report.md; then
            cat /tmp/d6-parity-duality/report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: d6-parity-duality
          path: /tmp/d6-parity-duality/
          retention-days: 14
