name: D6 parity duality research

on:
  workflow_dispatch:

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Run exact-integer parity witness against current D6 authority
        run: |
          set -euo pipefail
          rm -rf /tmp/d6-parity-duality
          echo "FOREIGN_LANGUAGE_TEST_OR_BENCH=EXCLUDED_BY_POLICY native_equivalent=NOT_VERIFIED"

      - name: Publish report
        if: always()
        run: |
          if test -f /tmp/d6-parity-duality/report.md; then
            cat /tmp/d6-parity-duality/report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d6-parity-duality
          path: /tmp/d6-parity-duality/
          retention-days: 14
