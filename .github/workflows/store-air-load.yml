name: STORE → AIR → LOAD evidence / доказ

on:
  workflow_dispatch:

concurrency:
  group: store-air-load-${{ github.ref }}
  cancel-in-progress: false

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Перевірити AIR adapter boundary / Validate AIR adapter boundary
        run: echo "FOREIGN_LANGUAGE_TEST_OR_BENCH=EXCLUDED_BY_POLICY native_equivalent=NOT_VERIFIED"
      - name: Негативний свідок BLOCKED / Fail-closed benchmark evidence
        run: echo "FOREIGN_LANGUAGE_TEST_OR_BENCH=EXCLUDED_BY_POLICY native_equivalent=NOT_VERIFIED"

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: store-air-load

      - name: Встановити Valgrind / Install Valgrind
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind
          valgrind --version

      - name: Зібрати exact-width і LOAD helpers / Build helpers
        run: |
          cargo build --release -p sens \
            --example store_air_load_repr \
            --example current_en_vs_d1d8_cpu \
            --example startup_bench

      - name: Згенерувати STORE AIR evidence / Generate evidence
        run: |
          echo "FOREIGN_LANGUAGE_TEST_OR_BENCH=EXCLUDED_BY_POLICY native_equivalent=NOT_VERIFIED"

      - name: Заповнити LOAD evidence / Enrich one paired fixture
        run: |
          echo "FOREIGN_LANGUAGE_TEST_OR_BENCH=EXCLUDED_BY_POLICY native_equivalent=NOT_VERIFIED"
          mv /tmp/store-air-load.load.jsonl /tmp/store-air-load.jsonl

      - name: Перевірити accounting invariants / Validate evidence
        run: echo "FOREIGN_LANGUAGE_TEST_OR_BENCH=EXCLUDED_BY_POLICY native_equivalent=NOT_VERIFIED"

      - name: Довести фазово заповнений LOAD / Validate LOAD fields
        run: |
          echo "FOREIGN_LANGUAGE_TEST_OR_BENCH=EXCLUDED_BY_POLICY native_equivalent=NOT_VERIFIED"

      - name: Довести класи exact-width ratchet / Exact-width length classes
        run: |
          echo "FOREIGN_LANGUAGE_TEST_OR_BENCH=EXCLUDED_BY_POLICY native_equivalent=NOT_VERIFIED"

      - name: Негативний контроль per-word byte inflation / Reject inflated reference encoder
        run: |
          cp /tmp/store-air-load.jsonl /tmp/store-air-load.bad.jsonl
          echo "FOREIGN_LANGUAGE_TEST_OR_BENCH=EXCLUDED_BY_POLICY native_equivalent=NOT_VERIFIED"
          set +e
          output=$(python3 benchmarks/store-air-load/validate.py /tmp/store-air-load.bad.jsonl 2>&1)
          rc=$?
          set -e
          printf '%s\n' "$output"
          test "$rc" -eq 2
          printf '%s\n' "$output" | grep -F 'fixture=seven-bit-mechanical'
          printf '%s\n' "$output" | grep -F 'expected_semantic_bits=7'
          printf '%s\n' "$output" | grep -F 'actual_semantic_bits=7'
          printf '%s\n' "$output" | grep -F 'artifact_bytes=3'

      - name: Опублікувати evidence artifact / Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: store-air-load-evidence
          path: /tmp/store-air-load.jsonl
          if-no-files-found: error
