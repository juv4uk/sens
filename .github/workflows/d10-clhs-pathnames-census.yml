name: D10 CLHS Pathnames corpus check
on:
  pull_request:
    paths:
      - 'knowledge/d10-clhs-pathnames-census-20261009.json'
      - 'scripts/check_d10_clhs_pathnames_census.py'
      - '.github/workflows/d10-clhs-pathnames-census.yml'
  push:
    branches:
      - research/d10-clhs-pathnames-dictionary-20261009
  workflow_dispatch:
permissions:
  contents: read
jobs:
  corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify CLHS chapter 19 source census
        run: python3 scripts/check_d10_clhs_pathnames_census.py --self-test
      - name: Install SBCL runtime
        run: sudo apt-get install -y sbcl
      - name: Run real Common Lisp pathname witness
        run: sbcl --noinform --script tests/oracles/d10_clhs_pathnames_sections19.lisp
