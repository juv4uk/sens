name: D10 CLHS Pathnames corpus check
on:
  pull_request:
    paths:
      - 'knowledge/d10-clhs-pathnames-census-20261009.json'
      - 'scripts/check_d10_clhs_pathnames_census.py'
      - '.github/workflows/d10-clhs-pathnames-census.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify CLHS chapter 19 source census
        run: python3 scripts/check_d10_clhs_pathnames_census.py --self-test
