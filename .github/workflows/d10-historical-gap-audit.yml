name: D10 historical completeness gap audit
on:
  workflow_dispatch:
jobs:
  historical-gap-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Check source-pinned historical research without inventing residents
        run: python3 scripts/check_d10_historical_gap_audit.py --self-test
      - name: Ensure sources remain unchanged by checker
        run: git diff --exit-code
