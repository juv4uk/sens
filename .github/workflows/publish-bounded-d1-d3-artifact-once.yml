name: publish bounded D1-D3 artifact once

on:
  push:
    branches:
      - feat/3699-publish-bounded-d1-d3-artifact-20261005

permissions:
  contents: write
  actions: read

jobs:
  publish:
    if: ${{ !contains(github.event.head_commit.message, 'chore(3699): publish CI bounded D1-D3 artifact') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Download exact prior CI artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: juv4uk/sens
          run-id: 37283126046
          artifact-ids: 11333580679
          path: .tmp/bounded-artifact

      - name: Publish committed artifact and provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p benchmarks/execution-ladder-conformance/artifacts
          unzip -o .tmp/bounded-artifact/*.zip -d .tmp/bounded-unpacked
          test -f .tmp/bounded-unpacked/bounded-a.jsonl
          mv .tmp/bounded-unpacked/bounded-a.jsonl \
            benchmarks/execution-ladder-conformance/artifacts/bounded-d1-d3.jsonl

          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path

          artifact = Path("benchmarks/execution-ladder-conformance/artifacts/bounded-d1-d3.jsonl")
          rows = [json.loads(line) for line in artifact.read_text(encoding="utf-8").splitlines() if line.strip()]
          assert len(rows) == 56
          assert len({row["case_id"] for row in rows}) == 28
          assert sum(row["producer_layer"] == "L0" for row in rows) == 28
          assert sum(row["producer_layer"] == "L1" for row in rows) == 28
          assert all(row["legacy_identity_used"] is False for row in rows)
          assert all(row["upstream_sha"] == "951a62504e6eb20e42f7d8318d8a96d5ef6ccc55" for row in rows)
          expected_bound = {
              "grammar_profile": "d1-d3-structural-predicate-v1",
              "domain_set": [1, 2, 3],
              "max_ast_depth": 3,
              "max_nodes": 11,
              "argument_value_bound": 2,
          }
          assert all(row["exhaustive_bound"] == expected_bound for row in rows)
          sha256 = hashlib.sha256(artifact.read_bytes()).hexdigest()
          summary = {
              "schema": "sens-execution-conformance/v1",
              "contract": "11.6",
              "artifact": artifact.name,
              "artifact_sha256": sha256,
              "rows": 56,
              "case_ids": 28,
              "producer_layers": {"L0": 28, "L1": 28},
              "upstream_sha": "951a62504e6eb20e42f7d8318d8a96d5ef6ccc55",
              "source_workflow_run": 37283126046,
              "source_artifact_id": 11333580679,
              "exhaustive_bound": expected_bound,
              "legacy_identity_used_all_false": True,
          }
          Path("benchmarks/execution-ladder-conformance/artifacts/bounded-d1-d3.summary.json").write_text(
              json.dumps(summary, ensure_ascii=False, sort_keys=True, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

          rm -rf .tmp
          rm -f .github/workflows/publish-bounded-d1-d3-artifact-once.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add benchmarks/execution-ladder-conformance/artifacts/ .github/workflows/publish-bounded-d1-d3-artifact-once.yml
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "chore(3699): publish CI bounded D1-D3 artifact"
          git push
