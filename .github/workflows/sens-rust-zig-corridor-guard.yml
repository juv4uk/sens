name: Rust↔SENS sterile Zig corridor guard
# Owner rule (#5777/#5779): the Rust↔SENS link crosses ONLY the sterile Zig corridor.
# Manual only (no extra automatic workflows, per #5777). Fail-closed structural guard.
# Full sterile set: sterile source routes + host-neutral R5 + host coverage + axiom binding.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  corridor-guard:
    name: Rust↔SENS crosses only the sterile Zig corridor
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Sterile source routes — Python checks excluded
        run: echo 'PYTHON_TESTS_AND_VALIDATORS=EXCLUDED_BY_LANGUAGE_POLICY native_equivalent=NOT_VERIFIED'

      - name: Host-neutral R5 — Python checks excluded
        run: echo 'PYTHON_TESTS_AND_VALIDATORS=EXCLUDED_BY_LANGUAGE_POLICY native_equivalent=NOT_VERIFIED'

      - name: Host coverage — Python checks excluded
        run: echo 'PYTHON_TESTS_AND_VALIDATORS=EXCLUDED_BY_LANGUAGE_POLICY native_equivalent=NOT_VERIFIED'

      - name: Axiom binding — Python checks excluded
        run: echo 'PYTHON_TESTS_AND_VALIDATORS=EXCLUDED_BY_LANGUAGE_POLICY native_equivalent=NOT_VERIFIED'
