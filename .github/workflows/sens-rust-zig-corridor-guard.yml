name: Rust↔SENS sterile Zig corridor guard
# Owner rule (#5777/#5779): the Rust↔SENS link crosses ONLY the sterile Zig corridor.
# Manual only (no extra automatic workflows, per #5777). Fail-closed structural guard.
# Full sterile set: sterile source routes + host-neutral R5 + host coverage + axiom binding.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  corridor-guard:
    name: Rust↔SENS crosses only the sterile Zig corridor
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: ./.github/actions/install-zig
      - uses: dtolnay/rust-toolchain@1.99.0

      - name: T5M/F3C ingress-egress — нативні позитивний і негативний свідки
        shell: bash
        run: |
          set -euo pipefail
          test "$(zig version)" = "$(tr -d '\r\n' < .zig-version)"
          cargo test --locked -p sens-cli --bin sens-trit explicit_f3_codec_roundtrip_is_zig_owned -- --nocapture
          cargo test --locked --no-default-features -p sens-cli --bin sens-trit f3c_physical_ingress_and_egress_require_zig_even_for_valid_bytes -- --nocapture
          cargo test --locked -p sens-cli --test binary_t5m_zig_roundtrip -- --nocapture

      - name: Фізичний Zig ABI — нативні свідки
        shell: bash
        run: |
          set -euo pipefail
          zig test research/zig-codecs/tests.zig -O ReleaseSafe -lc
          zig test research/zig-codecs/transport_abi.zig -O ReleaseSafe -lc

      - name: Host coverage і axiom binding — без нативного оракула не PASS
        shell: bash
        run: |
          printf '%s\n' 'Немає нативного доказу повноти Rust↔SENS host coverage та axiom binding; ручний corridor guard залишається заблокованим.' >&2
          exit 1
