name: Rust↔SENS sterile Zig corridor guard
# Owner rule (#5777/#5779): the Rust↔SENS link crosses ONLY the sterile Zig corridor.
# Manual only (no extra automatic workflows, per #5777). Fail-closed structural guard.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  corridor-guard:
    name: Rust↔SENS crosses only the sterile Zig corridor
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Guard — Rust↔SENS only via the sterile Zig corridor
        run: python3 scripts/check_rust_sens_zig_corridor.py .

      - name: Negative controls — every invariant must fail closed
        run: python3 -m unittest discover -s tests -p test_check_rust_sens_zig_corridor.py -v
