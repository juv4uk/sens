name: D8 DO-WHILE product research

on:
  pull_request:
    paths:
      - "benchmarks/d8-do-while-product/**"
      - "docs/research/3770-d8-do-while-product.uk.md"
      - "knowledge/d6-ratified.json"
      - ".github/workflows/d8-do-while-product.yml"
  push:
    branches:
      - main
    paths:
      - "benchmarks/d8-do-while-product/**"
      - "knowledge/d6-ratified.json"
      - ".github/workflows/d8-do-while-product.yml"
  workflow_dispatch:

jobs:
  product-witness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Run exhaustive DO/WHILE product witness
        run: |
          rm -rf /tmp/d8-do-while-product
          python3 benchmarks/d8-do-while-product/run.py \
            --out /tmp/d8-do-while-product
      - name: Verify deterministic replay
        run: |
          rm -rf /tmp/d8-do-while-product-2
          python3 benchmarks/d8-do-while-product/run.py \
            --out /tmp/d8-do-while-product-2
          cmp /tmp/d8-do-while-product/witness.json \
              /tmp/d8-do-while-product-2/witness.json
      - name: Publish report
        if: always()
        run: |
          test ! -f /tmp/d8-do-while-product/report.md || \
            cat /tmp/d8-do-while-product/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: d8-do-while-product
          path: /tmp/d8-do-while-product/
          retention-days: 14
