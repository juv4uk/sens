    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run current macro substrate decomposition witness
        run: python3 scripts/research-2181-d5-transformer-boundary.py
      - name: Publish summary
        if: always()
        run: |
          {
            echo "## D5 transformer boundary"
            echo
            echo "- Existing D4 mechanisms: DEFINE/LAMBDA/form construction/EVAL"
