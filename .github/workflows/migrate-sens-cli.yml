name: migrate-sens-operational-cli

on:
  pull_request:
    paths:
      - "scripts/migrate-sens.py"
      - "scripts/migrate-approved-t5.py"
      - "scripts/migrate-three-pass.py"
      - "scripts/sens_t5_codec.py"
      - "tests/test_migrate_sens.py"
      - ".github/workflows/migrate-sens-cli.yml"
  push:
    branches: [main]
    paths:
      - "scripts/migrate-sens.py"
      - "scripts/migrate-approved-t5.py"
      - "scripts/migrate-three-pass.py"
      - "scripts/sens_t5_codec.py"
      - "tests/test_migrate_sens.py"
      - ".github/workflows/migrate-sens-cli.yml"

permissions:
  contents: read

jobs:
  operational-physical-t5:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Build actual Rust D2 SENS reader
        run: cargo build -q -p sens-cli --bin sens-trit
      - name: One source, SHA-pinned transaction, binary parity, dry-run and no-clobber
        env:
          SENS_TRIT_BIN: ${{ github.workspace }}/target/debug/sens-trit
        run: python3 -m unittest discover -s tests -p 'test_migrate_sens.py' -v
