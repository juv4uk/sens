name: program-bit-measure

on:
  pull_request:
    paths:
      - "crates/sens/src/source_packing.rs"
      - "crates/sens/src/lib.rs"
      - ".github/workflows/program-bit-measure.yml"
  push:
    branches: [main]
    paths:
      - "crates/sens/src/source_packing.rs"
      - "crates/sens/src/lib.rs"
      - ".github/workflows/program-bit-measure.yml"

jobs:
  source-bit-measure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Prove canonical source bit measure and dense packing parity
        run: cargo test -p sens source_packing::tests::
