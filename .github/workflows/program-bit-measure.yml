# Physical bit/transport checks use the Rust reader, Zig codec and native SENS CLI.
# No host-language stream simulator or JSON benchmark output is used.
name: Program bit and physical T5 measurement — Rust/Zig/SENS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-zig
      - uses: dtolnay/rust-toolchain@1.99.0
      - name: Run Rust-owned transport and packing tests
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p sens source_packing::tests:: -- --nocapture
          cargo test --locked -p sens ternary_transport::tests:: -- --nocapture
          cargo test --locked -p sens-cli --bin sens-trit eval_tests:: -- --nocapture
      - name: Run Zig codec and ABI tests in Zig
        shell: bash
        run: |
          set -euo pipefail
          zig test -lc research/zig-codecs/tests.zig
          zig test -lc zig_transport_root.zig
          zig test -O ReleaseFast -lc bench_t5m_test.zig
      - name: Exercise actual physical SENS files
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/program-bit"
          mkdir -p "$out"
          cargo build --locked --release -p sens-cli --bin sens --bin sens-trit
          trit="$PWD/target/release/sens-trit"
          printf '10 001 00 000 01\n' > "$out/sample.lisp"
          "$trit" encode "$out/sample.lisp"
          "$trit" verify "$out/sample.lisp"
          "$trit" open "$out/sample.sens" > "$out/opened.txt"
          cmp "$out/opened.txt" "$out/sample.lisp"
          test "$(wc -c < "$out/sample.sens")" -eq 4
          printf '\363' > "$out/corrupt.sens"
          if "$trit" eval "$out/corrupt.sens"; then
            echo "SENS_PHYSICAL_CORRUPT_INPUT_WAS_ACCEPTED" >&2
            exit 1
          fi
          printf '10 01\n' > "$out/short.lisp"
          "$trit" encode "$out/short.lisp"
          test "$(wc -c < "$out/short.sens")" -eq 1
          printf '\144' > "$out/short.expected"
          cmp "$out/short.sens" "$out/short.expected"
          "$trit" open "$out/short.sens" > "$out/short.opened"
          cmp "$out/short.opened" "$out/short.lisp"
          printf '\362' >> "$out/short.sens"
          if "$trit" open "$out/short.sens"; then
            echo "SENS_PHYSICAL_OBSOLETE_EOS_WAS_ACCEPTED" >&2
            exit 1
          fi
          printf '000\n' > "$out/atom.lisp"
          "$trit" encode "$out/atom.lisp"
          "$trit" open "$out/atom.sens" > "$out/atom.opened"
          cmp "$out/atom.opened" "$out/atom.lisp"
          echo "RUST_ZIG_SENS_PHYSICAL_T5=PASS"
      - name: Preserve plain-text mechanism evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: program-bit-native-${{ github.sha }}
          path: ${{ runner.temp }}/program-bit/
          if-no-files-found: warn
          retention-days: 21
