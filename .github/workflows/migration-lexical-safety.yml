name: Migration lexical binding and quoted-data safety

on:
  push:
    branches:
      - guard/migration-lexical-safety-20261008
    paths:
      - scripts/audit_lisp_migration_edits.py
      - tests/test_audit_lisp_migration_edits.py
      - .github/workflows/migration-lexical-safety.yml
  pull_request:
    paths:
      - scripts/audit_lisp_migration_edits.py
      - tests/test_audit_lisp_migration_edits.py
      - .github/workflows/migration-lexical-safety.yml
      - scripts/migrate-three-pass.py
      - lib/machine/layout/pair-x86-64.lisp
      - scripts/build-inventory.lisp
      - scripts/semantic-authority-guard.lisp
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lexical-diff-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Reject rewriting quoted data and locally bound functions
        run: python3 -m unittest discover -s tests -p test_audit_lisp_migration_edits.py -v
      - name: Do not claim current corpus migration by passing preflight
        run: |
          echo "Lexical safety only. Runtime parity and physical T5 admission remain independent."
