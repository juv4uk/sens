name: Core4 predicate answer scale — deferred research

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  historical-research:
    name: Deferred 15-state research archive
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Explain authority status
        run: |
          echo "15-state / graded predicate logic is deferred research under #1703/#1711."
          echo "This workflow is manual-only and must not block pull requests or main."
          echo "Active predicate law is exact one bit: 1 YES / 0 NO."
      - name: Record historical artifacts
        run: |
          sha256sum contracts/core4-predicate-answer-scale.lisp
          sha256sum contracts/core4-predicate-output-boundary.lisp
          sha256sum contracts/core4-eq-result-law.lisp
          sha256sum experiments/core4-logic15-algebra.lisp
      - name: Diff hygiene
        run: git diff --check
