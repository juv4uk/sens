name: X86 condition-code migration witness

on:
  pull_request:
    paths:
      - "lib/machine/encoding/x86-64.lisp"
      - "crates/sens/tests/x86_64_lisp_encoder.rs"
      - ".github/workflows/x86-condition-code-1635.yml"

jobs:
  parity-condition-codes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: x86-condition-code-1635
      - name: Parity condition-code witness
        run: cargo test -p sens --test x86_64_lisp_encoder parity_condition_wrappers_preserve_decimal_codes_10_and_11 -- --exact
