name: D10 spanda bounded-rational source law

on:
  pull_request:
    paths:
      - 'knowledge/d10-cross-hobby-bounded-rational-v1.json'
      - 'scripts/check_d10_bounded_rational.py'
      - 'docs/research/d10-bounded-rational-hobbies.uk.md'
      - '.github/workflows/d10-bounded-rational-hobbies.yml'
  push:
    branches:
      - research/d10-spanda-bounded-rational-exact-20261009
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-rational-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - name: Compile strict exact-rational proposal checker
        run: python3 -m py_compile scripts/check_d10_bounded_rational.py
      - name: Exhaustive rational oracle + standard library cross-check + negative tests
        run: python3 scripts/check_d10_bounded_rational.py --self-test
