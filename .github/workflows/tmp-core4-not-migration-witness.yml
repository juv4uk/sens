name: TEMP exact Core4 NOT migration witness

on:
  push:
    branches:
      - fix/core4-not-heads-current-main-20261010

permissions:
  contents: write

jobs:
  focused-witness:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify exact edited Core4 source blob
        run: |
          set -euo pipefail
          actual="$(git hash-object lib/core4.lisp)"
          test "$actual" = "d8e2f719faa6325cf9820bf6193848e5f14a0e52"
          echo "CORE4_SOURCE_BLOB=$actual"
      - name: Regenerate FASL and run unchanged freshness gate
        run: |
          set -euo pipefail
          cargo run --locked --release -p sens-cli --bin gen-fasl -- lib/core4.lisp lib/core4.lisp.fasl
          cargo test --locked -p sens --test core_fasl_freshness -- --nocapture
      - name: Run staged Core4 and native admission probes
        run: cargo test --locked -p sens-host --test native_lisp_bytes core4_probe_ -- --nocapture
      - name: Native CAR/CDR must match interpreter reference
        run: cargo test --locked -p sens-host --test native_lisp_bytes native_pair_car_cdr_match_the_interpreter_reference_witness -- --exact --nocapture
      - name: Invalid UD2 must still be rejected before host execution
        run: cargo test --locked -p sens-host --test native_lisp_bytes unadmitted_ud2_form_is_rejected_before_host_executor -- --exact --nocapture
      - name: Commit verified FASL only after all witnesses pass
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/core4.lisp.fasl
          if git diff --cached --quiet; then
            echo "FASL already matches exact Core4 source"
            exit 0
          fi
          git commit -m "fix(fasl): regenerate Core4 after NOT migration"
          git push origin "HEAD:${GITHUB_REF_NAME}"
