name: D5 remap matched null S2

on:
  pull_request:
    paths:
      - "benchmarks/d3-d8-remap-null/d5_s2.py"
      - "benchmarks/d3-d8-remap-solver/d5_s2.py"
      - "knowledge/d5-multilaw-atlas.json"
      - ".github/workflows/d5-remap-null-s2.yml"
  push:
    branches: [main]
    paths:
      - "benchmarks/d3-d8-remap-null/d5_s2.py"
      - "benchmarks/d3-d8-remap-solver/d5_s2.py"
      - "knowledge/d5-multilaw-atlas.json"
      - ".github/workflows/d5-remap-null-s2.yml"
  workflow_dispatch:

jobs:
  d5-null:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Materialize pinned stable-resident donor
        run: |
          git fetch --no-tags --depth=1 origin 86d49ef4477345082e60452800bae6c2d184390c
          git show 86d49ef4477345082e60452800bae6c2d184390c:knowledge/d3-d8-stable-residents.json \
            > /tmp/d3-d8-stable-residents.json

      - name: Validate D5 scorer donor
        run: |
          rm -rf /tmp/d5-remap-s2
          python3 benchmarks/d3-d8-remap-solver/d5_s2.py \
            --corpus /tmp/d3-d8-stable-residents.json \
            --out /tmp/d5-remap-s2

      - name: Run D5 matched null calibration
        run: |
          rm -rf /tmp/d5-remap-null-s2
          python3 benchmarks/d3-d8-remap-null/d5_s2.py \
            --corpus /tmp/d3-d8-stable-residents.json \
            --samples 4096 \
            --seed 30495 \
            --out /tmp/d5-remap-null-s2

      - name: Publish report
        if: always()
        run: |
          if test -f /tmp/d5-remap-null-s2/report.md; then
            cat /tmp/d5-remap-null-s2/report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d5-remap-null-s2
          path: /tmp/d5-remap-null-s2/
          retention-days: 14
