name: D9 geometry S2

on:
  pull_request:
    paths:
      - "knowledge/d9-v1-geometry-state.json"
      - "knowledge/d9-v1-semantic-inventory.json"
      - "scripts/check-d9-geometry-s2.py"
      - ".github/workflows/d9-geometry-s2.yml"
  push:
    branches: [main]
    paths:
      - "knowledge/d9-v1-geometry-state.json"
      - "knowledge/d9-v1-semantic-inventory.json"
      - "scripts/check-d9-geometry-s2.py"
      - ".github/workflows/d9-geometry-s2.yml"
  workflow_dispatch:

jobs:
  geometry-s2:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: GPU runner identity
        run: nvidia-smi || true
      - name: Verify complete semantic inventory
        run: python3 scripts/check-d9-final-semantic-fill-v1.py
      - name: Verify S2 geometry
        run: python3 scripts/check-d9-geometry-s2.py
