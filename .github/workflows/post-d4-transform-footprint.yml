name: Post-D4 transformation footprint

on:
  workflow_dispatch:
jobs:
  footprint:
    name: Phase-D rewrite footprint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run transformation-footprint audit
        run: python3 scripts/research-2472-transform-footprint.py
      - name: Run live protocol-boundary witnesses
        run: cargo test -p sens --test post_d4_transform_boundary -- --nocapture
      - name: Publish summary
        if: always()
        run: |
          {
            echo "## #2472 transformation footprint"
            echo
            echo "- GO: LOCAL-REGION-REWRITE"
            echo "- RETURN: CALLCHAIN-PROTOCOL-REWRITE"
            echo "- SETQ: OBSERVER-PROTOCOL-REWRITE"
            echo "- Research only: no DERIVED/NEW verdict and no address allocation."
          } >> "$GITHUB_STEP_SUMMARY"
