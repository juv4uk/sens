name: GitHub-hosted smoke

on:
  pull_request:
    paths:
      - .github/workflows/self-hosted-smoke.yml
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: GitHub-hosted runner evidence
        run: |
          uname -a
          nproc
          grep -m1 'model name' /proc/cpuinfo
          printf 'runner=%s os=%s arch=%s\n' "$RUNNER_NAME" "$RUNNER_OS" "$RUNNER_ARCH"
