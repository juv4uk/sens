name: GitHub-hosted smoke

on:
  pull_request:
    paths:
      - .github/workflows/self-hosted-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: GitHub-hosted runner evidence
        shell: bash
        run: |
          set -euo pipefail
          uname -a
          nproc
          grep -m1 'model name' /proc/cpuinfo
          printf 'runner=%s os=%s arch=%s environment=%s\n' "$RUNNER_NAME" "$RUNNER_OS" "$RUNNER_ARCH" "${RUNNER_ENVIRONMENT:-}"
          if [[ "${RUNNER_ENVIRONMENT:-}" != "github-hosted" ]]; then
            echo "::error::Expected GitHub-hosted runner, got ${RUNNER_ENVIRONMENT:-unset}"
            exit 1
          fi

      - name: Checkout witness
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse --is-inside-work-tree)" = "true"
          test -n "$(git rev-parse HEAD)"
          echo "GITHUB_HOSTED_SMOKE_GREEN repo=$GITHUB_REPOSITORY sha=$(git rev-parse --short HEAD)"
