name: Audit T5 file pairs

on:
  pull_request:
    paths:
      - "**/*.sens"
      - "**/*.lisp"
      - "tests/fixtures/**"
      - "lib/**"
      - "examples/**"
      - "scripts/sens_t5_codec.py"
      - "scripts/audit_t5_file_pairs.py"
      - "tests/test_audit_t5_file_pairs.py"
      - ".github/workflows/audit-t5-file-pairs.yml"
  push:
    branches: [main]
    paths:
      - "**/*.sens"
      - "tests/fixtures/**"
      - "lib/**"
      - "examples/**"
      - "scripts/audit_t5_file_pairs.py"
      - "tests/test_audit_t5_file_pairs.py"
      - ".github/workflows/audit-t5-file-pairs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  read-only-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Test T5 physical file-pair guard
        run: python3 -m unittest discover -s tests -p 'test_audit_t5_file_pairs.py' -v
      - name: Inspect tracked .sens file pairs
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/audit_t5_file_pairs.py . \
            --output "$RUNNER_TEMP/t5-pairs-report.json"
          python3 - "$RUNNER_TEMP/t5-pairs-report.json" <<'PY'
          import json,sys
          report=json.load(open(sys.argv[1],encoding="utf-8"))
          assert report["schema"]=="sens-t5-file-pair-audit/v1"
          assert report["summary"]["physical_blocked"]==0
          assert report["summary"]["spaced_view_blocked"]==0, "stale/tampered extensionless view"
          print("SPACED_VIEW_AUDIT:",{key:report["summary"][key] for key in (
              "spaced_view_pass","spaced_view_missing","spaced_view_blocked")})
          if report["status"]=="NO_FILES":
              print("NO_SENS_FILES: this is not proof of migration success")
          if report["summary"]["pending_oracle"]:
              print("PENDING_ORACLE:",report["summary"]["pending_oracle"],
                    "physical bytes checked; semantic admission NOT certified")
          PY
      - name: BLOCK new/modified physical T5 without same-stem verified spaced view
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/t5-pairs-report.json" <<'PY'
          import json,os,subprocess,sys
          from pathlib import Path
          sys.path.insert(0,"scripts")
          from audit_t5_file_pairs import require_changed_views
          report=json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if os.environ["EVENT_NAME"] == "workflow_dispatch":
              print("Manual audit: whole corpus plus scoped D1 trio, no commit-diff selection")
          else:
              base=os.environ.get("BASE_SHA","")
              head=os.environ.get("HEAD_SHA","")
              if (not base or set(base)=={"0"} or not head):
                  raise SystemExit("BLOCKED: missing trustworthy Git base/head for changed .sens gate")
              diff=subprocess.run(
                  ["git","diff","--name-only","--diff-filter=ACMR","-z",
                   base,head,"--",":(glob)**/*.sens"],
                  stdout=subprocess.PIPE,stderr=subprocess.PIPE,check=True,
              )
              changed=[os.fsdecode(p) for p in diff.stdout.split(b"\\0") if p]
              require_changed_views(report,changed)
              print(f"NEW_OR_MODIFIED_T5_TRIPLES_PASS: {len(changed)}")
          PY
      - name: Require full physical+view roundtrip for admitted Ukrainian D1 COND cohort
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/audit_t5_file_pairs.py tests/fixtures/migration-d1-cond-cohort \
            --include-untracked --require-spaced-view \
            --output "$RUNNER_TEMP/t5-admitted-triple-report.json"
          python3 - "$RUNNER_TEMP/t5-admitted-triple-report.json" <<'PY'
          import json,sys
          report=json.load(open(sys.argv[1],encoding="utf-8"))
          s=report["summary"]
          assert report["schema"]=="sens-t5-file-pair-audit/v1"
          assert s["sens_files"]==1 and s["physical_pass"]==1
          assert s["spaced_view_pass"]==1 and s["spaced_view_missing"]==0 and s["spaced_view_blocked"]==0
          assert s["pending_oracle"]==1 and s["admitted_executable_semantics"] is None
          assert report["status"]=="MECHANICAL_ONLY"
          print("ADMITTED_TRIPLE_PHYSICAL_VIEW_PASS; Ukrainian semantic oracle separate")
          PY
      - name: Keep audit evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: sens-t5-file-pairs-report
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/t5-pairs-report.json
            ${{ runner.temp }}/t5-admitted-triple-report.json
# No source modification, no git push, no automatic semantic admission.
