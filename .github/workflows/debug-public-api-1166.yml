name: Debug public API projection 1166

on:
  pull_request:
    paths:
      - "docs/generated/public-api-discovery.md"
      - ".github/workflows/debug-public-api-1166.yml"
      - "lib/**/*.lisp"
      - "contracts/core-profile-contract.lisp"
      - "scripts/public_api_inventory.py"

permissions:
  contents: read

jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Regenerate and print diff
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/public_api_inventory.py --write-report
          git diff -- docs/generated/public-api-discovery.md || true
