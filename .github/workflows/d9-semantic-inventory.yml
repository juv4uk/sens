name: D9 semantic inventory

on:
  pull_request:
    paths:
      - "knowledge/d9-v1-semantic-inventory.json"
      - "knowledge/d9-selector-seed.json"
      - "knowledge/d9-overflow-review-v1.json"
      - "knowledge/d9-fill-v1-state.json"
      - "scripts/check-d9-v1-semantic-inventory.py"
      - ".github/workflows/d9-semantic-inventory.yml"
  push:
    branches: [main]
    paths:
      - "knowledge/d9-v1-semantic-inventory.json"
      - "knowledge/d9-fill-v1-state.json"
      - "scripts/check-d9-v1-semantic-inventory.py"
      - ".github/workflows/d9-semantic-inventory.yml"
  workflow_dispatch:

jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: GPU runner identity
        run: nvidia-smi || true
      - name: Verify selector seed
        run: python3 scripts/check-d9-fill-v1-seed.py
      - name: Verify overflow review
        run: python3 scripts/check-d9-overflow-review-v1.py
      - name: Verify consolidated inventory
        run: python3 scripts/check-d9-v1-semantic-inventory.py
