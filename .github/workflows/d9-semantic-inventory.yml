name: D9 semantic inventory

on:
  workflow_dispatch:

jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: GPU runner identity
        run: nvidia-smi || true
      - name: Verify selector seed
        run: python3 scripts/check-d9-fill-v1-seed.py
      - name: Verify overflow review
        run: python3 scripts/check-d9-overflow-review-v1.py
      - name: Verify consolidated inventory
        run: python3 scripts/check-d9-v1-semantic-inventory.py
