name: D8 TAKE-DROP edge product research

on:
  workflow_dispatch:

jobs:
  product-witness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Run bounded D8 product witness
        run: |
          rm -rf /tmp/d8-take-drop-edge
          echo "FOREIGN_LANGUAGE_TEST_OR_BENCH=EXCLUDED_BY_POLICY native_equivalent=NOT_VERIFIED"

      - name: Verify deterministic replay
        run: |
          rm -rf /tmp/d8-take-drop-edge-2
          echo "FOREIGN_LANGUAGE_TEST_OR_BENCH=EXCLUDED_BY_POLICY native_equivalent=NOT_VERIFIED"
          cmp /tmp/d8-take-drop-edge/witness.json \
              /tmp/d8-take-drop-edge-2/witness.json

      - name: Publish report
        if: always()
        run: |
          test ! -f /tmp/d8-take-drop-edge/report.md || \
            cat /tmp/d8-take-drop-edge/report.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d8-take-drop-edge
          path: /tmp/d8-take-drop-edge/
          retention-days: 14
