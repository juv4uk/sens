name: Hosted CI

# Owner freeze 2026-10-11: Core-only required-check surface.
# Prior hosted CI is archived, not deleted.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  critical:
    name: portable critical gates
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Compile canonical SENS Core
        run: cargo check --locked -p sens --lib
      - name: Carry-safe D24/D48 numeric and Value evaluator (Core-only Rust)
        run: |
          cargo test --locked -p sens --lib binary_number::tests
          cargo test --locked -p sens --lib qualified_numeric_domain_value_tests
          cargo test --locked -p sens --lib binary_framing::tests
          cargo test --locked -p sens --lib outer_envelope::tests::unratified_outer_n_path
          cargo test --locked -p sens --test binary_number_live
          cargo test --locked -p sens --test numeric_domain_math_stress
          cargo test --locked -p sens --test numeric_composition_frames
          cargo test --locked -p sens --test physical_d2_d7_binding
      - name: Ratified numeric D24/D48/... peer domains (Core-only)
        run: |
          python3 scripts/check-numeric-domain-ratification.py --self-test
          python3 scripts/check-numeric-domain-ratification.py
      - name: Verify Core domain and ownership boundaries
        run: cargo test --locked -p sens --test domain_ladder --test domain_ladder_only_kernel --test domain_ast_value_identity


  sid8-projection-audit:
    name: SID8/SENS8 to ratified-domain dry-run audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Regression tests (no source writes)
        run: python3 -m unittest discover -s tests -p test_sid8_to_ladder.py -v
      - name: Audit all Lisp sources (no physical SENS publication)
        shell: bash
        run: |
          set +e
          python3 scripts/sens8-to-ladder.py . \
            --root . --source-era auto \
            --report "$RUNNER_TEMP/sid8-domain-audit.json" \
            > "$RUNNER_TEMP/sid8-domain-console.log" 2>&1
          status=$?
          set -e
          tail -n 15 "$RUNNER_TEMP/sid8-domain-console.log"
          if [[ "$status" != 0 && "$status" != 2 ]]; then
            echo "Unexpected SID8 scan status: $status" >&2
            exit "$status"
          fi
          python3 - "$RUNNER_TEMP/sid8-domain-audit.json" <<'PY'
          import json, pathlib, sys
          report = json.loads(pathlib.Path(sys.argv[1]).read_text())
          s = report["summary"]
          rows = report["files"]
          assert s["total"] > 0, "empty repository scan"
          assert len(rows) == s["total"], "incomplete audit"
          assert s["eligible"] + s["blocked"] == s["total"], "invalid accounting"
          assert s["blocked"] == sum(x["status"] == "blocked" for x in rows)
          assert report["mode"] == "audit-only-not-physical-sens"
          assert report["eligible_single_word_mappings"] >= 1
          print("SID8 AUDIT", s)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sid8-domain-dry-run-${{ github.sha }}
          path: |
            ${{ runner.temp }}/sid8-domain-audit.json
            ${{ runner.temp }}/sid8-domain-console.log
          if-no-files-found: warn
          retention-days: 7


  sid8-legacy-projection:
    name: Execute SID8 legacy to domain projection (isolated preview)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Execute conversion script on entire Lisp tree
        shell: bash
        run: |
          set +e
          python3 scripts/sens8-to-ladder.py . \
            --root . --source-era legacy --write \
            --out "$RUNNER_TEMP/sid8-legacy-domain-views" \
            --report "$RUNNER_TEMP/sid8-legacy-projection.json" \
            > "$RUNNER_TEMP/sid8-legacy-projection.log" 2>&1
          result=$?
          set -e
          tail -n 12 "$RUNNER_TEMP/sid8-legacy-projection.log"
          if [[ "$result" != 0 && "$result" != 2 ]]; then
            echo "Unexpected SID8 execution status: $result" >&2
            exit "$result"
          fi
          python3 - "$RUNNER_TEMP/sid8-legacy-projection.json" <<'PY'
          import collections, json, pathlib, sys
          r = json.loads(pathlib.Path(sys.argv[1]).read_text())
          s = r["summary"]
          assert r["source_era"] == "legacy"
          assert r["mode"] == "audit-only-not-physical-sens"
          assert s["total"] > 0 and s["eligible"] + s["blocked"] == s["total"]
          assert s["converted_heads"] == sum(x.get("counts", {}).get("replaced", 0) for x in r["files"])
          by_status = dict(collections.Counter(x["status"] for x in r["files"]))
          reasons = collections.Counter(
              b["reason"].split(":", 1)[0]
              for x in r["files"] for b in x.get("blockers", []))
          print("SID8_LEGACY_EXECUTION_SUMMARY", json.dumps(
              {"summary": s, "status": by_status, "blockers": reasons.most_common(12)},
              ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sid8-legacy-projection-${{ github.sha }}
          path: |
            ${{ runner.temp }}/sid8-legacy-projection.json
            ${{ runner.temp }}/sid8-legacy-projection.log
            ${{ runner.temp }}/sid8-legacy-domain-views/
          if-no-files-found: warn
          retention-days: 7
