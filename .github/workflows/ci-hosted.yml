# Виведено з карантину 14.10.2026 за ПРАВИЛОМ 24 ГОДИН (AGENTS.md; docs/ci-red-cause-policy.uk.md):
# RED не ховаємо за if:false — workflow лишається ВИДИМИМ, а RED старший за 24 год ескалюється
# (Q_TRIAGE_24H у #5741). Жоден gate не вимикаємо на підставі кольору.
name: Hosted CI

# Owner freeze 2026-10-11: Core-only required-check surface.
# Prior hosted CI is archived, not deleted.
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  critical:
    name: portable critical gates
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Встановити Zig 0.16.0 (дефолтний транспортний кодек; потрібен sens-cli/build.rs)
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --silent --show-error \
            https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz \
            --output "$RUNNER_TEMP/zig-0.16.0.tar.xz"
          echo '70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00  '"$RUNNER_TEMP/zig-0.16.0.tar.xz" | sha256sum --check --status
          tar -xJf "$RUNNER_TEMP/zig-0.16.0.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/zig-x86_64-linux-0.16.0" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/zig-x86_64-linux-0.16.0/zig" version
      - uses: dtolnay/rust-toolchain@1.99.0
      - name: Compile canonical SENS Core
        run: cargo check --locked -p sens --lib
      - name: Carry-safe D24/D48 numeric and Value evaluator (Core-only Rust)
        run: |

          cargo test --locked -p sens --lib binary_framing::tests
          cargo test --locked -p sens --lib outer_envelope::tests::unratified_outer_n_path
          cargo test --locked -p sens-cli --test physical_d2_d7_binding
      - name: Core4 FASL exact-domain reader and wrong-reader rejection
        run: |
          RUST_MIN_STACK=33554432 cargo test --locked -p sens --lib core4_bootstrap_cache_tests::valid_fasl_path_selects_core4_and_evaluates_current_core
          RUST_MIN_STACK=33554432 cargo test --locked -p sens --lib core4_bootstrap_cache_tests::same_hash_ordinary_reader_fasl_cannot_reinterpret_d3_heads_as_numbers
      - name: Ratified numeric D24/D48/... peer domains (Core-only)
        run: |
          python3 scripts/check-numeric-domain-ratification.py --self-test
          python3 scripts/check-numeric-domain-ratification.py
      - name: Core4 D24+ direct-operand migration debt (inventory, not runtime pass)
        run: |
          python3 scripts/check-core4-d24-migration.py --self-test
          python3 scripts/check-core4-d24-migration.py --check
      - name: Canonical domain ladder — Rust Python C Lisp negative controls
        run: |
          python3 scripts/check-domain-ladder-identity.py --self-test
          python3 scripts/check-domain-ladder-identity.py --check
      - name: Verify Core domain and ownership boundaries
        run: |
          python3 scripts/check-domain-surfaces-d1-d4.py
          python3 scripts/check-d9-definition-bindings.py
          cargo test --locked -p sens --test domain_ladder --test domain_ladder_only_kernel --test domain_ast_value_identity
      - name: Verify migrated user demo sources run through canonical Core
        run: cargo test --locked -p sens --test exact_domain_migrated_demos
      - name: World D3 exact-D1 migration witnesses
        if: always()
        run: cargo test --locked -p sens --test reasoning_world_d3_migration
      - name: Forward exact-width macro cutover witness
        if: always()
        run: cargo test --locked -p sens --test forward_exact_macro_migration -- --nocapture

      - name: Forward/knowledge D3+D9 migration witnesses
        if: always()
        run: |
          cargo test --locked -p sens --test reasoning_forward_knowledge_d3_migration
          cargo test --locked -p sens --test knowledge_exact_macro_migration
      - name: Result-status semantic law — binary SENS self-verdict
        if: always()
        run: cargo test --locked -p sens --test sens_semantic_witnesses result_status_exact_d1_binary_self_verdict -- --exact --nocapture
      - name: Legacy core D6 MAP reader execution
        if: always()
        run: cargo test --locked -p sens --test legacy_core_d6_map_reader
      - name: World D3 complete CLI binary compilation
        if: always()
        run: cargo check --locked -p sens-cli --bins
      - name: Classic Lisp REPL case presentation
        if: always()
        run: |
          cargo test --locked -p sens --lib d1_human_projection_keeps_machine_bits_separate_from_words -- --nocapture
          cargo test --locked -p sens-cli classic_repl_reply_ -- --nocapture
      - name: Macro bootstrap D3/D4 migration witness
        if: always()
        run: cargo test --locked -p sens --test macro_derivation migrated_macro_bootstrap_is_d3_d4_only_and_executes_generated_define_lambda -- --exact --nocapture
      - name: D8 exact writer admission witnesses
        if: always()
        run: cargo test --locked -p sens --test d8_writer_admission
      - name: D9 Lisp-derived AVL facade witnesses
        if: always()
        run: cargo test --locked -p sens --test d9_map_lisp_facade
      - name: Filesystem macro and alist path-bound witnesses
        if: always()
        run: cargo test --locked -p sens --test fs_bridge_diagnostics
      - name: World D3 content-store integration
        if: always()
        run: |
          cargo test --locked -p sens --test content_store
          cargo test --locked -p sens --test content_store_authority
      - name: Mechanical D3 source-shape scanner (non-semantic)
        if: always()
        run: python3 -m unittest discover -s tests -p 'test_d3_legacy_logic_guard.py' -v
      - name: Migrated time-source exact D3 runtime witnesses
        if: always()
        run: |
          cargo test --locked -p sens --lib mixed_source::tests
          cargo test --locked -p sens --test timezone_raw
          cargo test --locked -p sens --test timezone_ownership
          cargo test --locked -p sens --test time_host_surface
      - name: Mechanical stale-D3 migration lint (non-semantic, fail closed)
        if: always()
        run: python3 scripts/check_d3_legacy_logic.py --strict

      # Exercise release packaging rejection gates on every main push, without
      # requiring a release tag or touching GitHub Releases.
      - name: Release asset verifier and preflight path negative controls (no tag)
        if: always()
        run: |
          python3 -m unittest discover -s tests -p 'test_verify_release_assets.py' -v
          python3 -m unittest discover -s packaging/tests -p 'test_release_preflight_scope.py' -v

      # Validate release proof ingestion independently of release tags.
      # A forged .sens reference or symlink must never become admissible.
      - name: Physical T5 admission-ledger positive and negative witnesses (no tag)
        if: always()
        run: python3 -m unittest discover -s tests -p 'test_check_release_admission_ledger.py' -v

      # A local workflow YAML and trigger-scope test do not prove GitHub has
      # registered the independent workflow. Check the real Actions API on
      # main pushes (fork PR tokens cannot be trusted for repository-level API).
      - name: Independent release preflight registration negative controls
        if: always()
        run: python3 -m unittest discover -s tests -p test_verify_release_workflow_registration.py -v

      - name: GitHub API independent Release Preflight registration (fail closed)
        if: always() && github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/verify_release_workflow_registration.py "$GITHUB_REPOSITORY"

      - name: Release publication and pre-tag gate structural regressions
        if: always()
        run: python3 -m unittest discover -s packaging/tests -p 'test_release_publication_gate.py' -v
