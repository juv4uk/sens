name: migration-eq-cond-rust-oracle

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migration-eq-cond-rust:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Run historical EQ/COND T5 transport-only checks
        run: cargo test -q -p sens --features rust-t5-reference --test migration_eq_cond_main
