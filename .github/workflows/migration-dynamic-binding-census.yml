name: migration-dynamic-binding-census

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pinned-dynamic-binding-blockers:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Verify strict-artifact split and real migrator fail-closed
        run: python3 -m unittest discover -s tests -p 'test_migration_dynamic_binding_census.py' -v
