name: Current exact-domain Lua load comparison

on:
  pull_request:
    paths:
      - "benchmarks/cross-language/current_lua_load.py"
      - "benchmarks/cross-language/lua_phase_driver.lua"
      - "benchmarks/cross-language/current_sens.py"
      - "benchmarks/cross-language/current_sens_phases.py"
      - "crates/sens/examples/current_exact_domain_phase_bench.rs"
      - ".github/workflows/current-lua-load.yml"
  workflow_dispatch:

concurrency:
  group: current-lua-load-${{ github.ref }}
  cancel-in-progress: true

jobs:
  current-lua-load:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install Lua and Cachegrind
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4 valgrind
          lua5.4 -v
          luac5.4 -v
          valgrind --version

      - name: Build current exact-domain phase runner
        run: cargo build -p sens --release --example current_exact_domain_phase_bench

      - name: Compare current SENS with Lua source and bytecode load
        run: |
          rm -rf /tmp/current-lua-load
          python3 benchmarks/cross-language/current_lua_load.py \
            --sens-runner target/release/examples/current_exact_domain_phase_bench \
            --lua lua5.4 \
            --luac luac5.4 \
            --reps 3 \
            --out /tmp/current-lua-load
          cat /tmp/current-lua-load/lua-load-report.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: current-exact-lua-load
          path: /tmp/current-lua-load
