name: Zig ladder tools (manual)
# Нова реальність: драбина доменів -> точні слова -> T5/F3C через САМ Zig-кодек.
# Ручний прогін; не чіпає .sens-дефолт і не виконує програму.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ladder:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: "Гейт: константи домену походять із ратифікованого контракту"
        run: python3 scripts/generate-numeric-domain-constants.py --check
      - name: Встановити Zig 0.16.0 (як у ci.yml)
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --silent --show-error \
            https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz \
            --output "$RUNNER_TEMP/zig-0.16.0.tar.xz"
          echo '70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00  '"$RUNNER_TEMP/zig-0.16.0.tar.xz" | sha256sum --check --status
          tar -xJf "$RUNNER_TEMP/zig-0.16.0.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/zig-x86_64-linux-0.16.0" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/zig-x86_64-linux-0.16.0/zig" version
      - name: Одиничні тести Zig-кодеків (передумова)
        run: |
          set -euo pipefail
          zig test research/zig-codecs/t5/t5.zig
          zig test research/zig-codecs/t5m.zig
          zig test research/zig-codecs/t5m3.zig
          zig test research/zig-codecs/tests.zig
          zig test research/zig-codecs/d2_ladder_game.zig
      - name: Порівняти T5M T33 та D12 на точних спільних fixtures
        shell: bash
        run: |
          set -euo pipefail
          zig test -lc research/zig-codecs/codec_compare_bench.zig
          zig build-exe -lc -O ReleaseFast research/zig-codecs/codec_compare_bench.zig -femit-bin="$RUNNER_TEMP/codec_compare"
          {
            git rev-parse HEAD
            zig version
            uname -a
            lscpu
            sha256sum research/zig-codecs/codec_compare_bench.zig research/zig-codecs/t5m.zig research/zig-codecs/t33_experiment.zig research/zig-codecs/d12_dense_experiment.zig "$RUNNER_TEMP/codec_compare"
            "$RUNNER_TEMP/codec_compare"
          } 2>&1 | tee "$RUNNER_TEMP/codec_compare.log"
      - name: Зібрати ladder_tool (ReleaseFast)
        run: zig build-exe -O ReleaseFast -lc research/zig-codecs/ladder_tool.zig -femit-bin="$RUNNER_TEMP/ladder_tool"
      - name: Драбина -> точні слова -> T5/F3C (round-trip + бенч)
        shell: bash
        run: |
          set -euo pipefail
          python3 research/zig-codecs/tools/ladder_program.py \
            research/zig-codecs/tools/caar.ladder \
            --lines research/zig-codecs/tools/caar.lines --view "$RUNNER_TEMP/caar.view"
          echo "===== wire (телеграфний запис) ====="; cat "$RUNNER_TEMP/caar.view"
          echo "===== ladder_tool ====="
          ( cd research/zig-codecs/tools && "$RUNNER_TEMP/ladder_tool" ) 2>&1 | tee "$RUNNER_TEMP/ladder.log"
          grep -Fq 'T5 roundtrip=EXACT' "$RUNNER_TEMP/ladder.log"
          grep -Fq 'op=encode ns_per_op=' "$RUNNER_TEMP/ladder.log"
          grep -Fq 'op=decode ns_per_op=' "$RUNNER_TEMP/ladder.log"
      - name: Зберегти сирі виводи
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zig-ladder-tools-${{ github.sha }}
          path: |
            ${{ runner.temp }}/ladder.log
            ${{ runner.temp }}/codec_compare.log
          if-no-files-found: warn
