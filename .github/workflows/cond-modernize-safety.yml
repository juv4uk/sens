name: COND modernizer safety

on:
  pull_request:
    paths:
      - 'scripts/cond-modernize.py'
      - 'scripts/test_cond_modernize.py'
      - '.github/workflows/cond-modernize-safety.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/cond-modernize.py'
      - 'scripts/test_cond_modernize.py'
      - '.github/workflows/cond-modernize-safety.yml'
  workflow_dispatch:

jobs:
  safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Test polarity, source preservation and fail-closed staging
        run: python3 scripts/test_cond_modernize.py
      - name: Audit active library parse completeness (read-only)
        shell: bash
        run: |
          set +e
          python3 scripts/cond-modernize.py --scan lib --json > "$RUNNER_TEMP/cond-report.json"
          code=$?
          set -e
          python3 - "$RUNNER_TEMP/cond-report.json" <<'PY'
          import json, sys
          d=json.load(open(sys.argv[1], encoding="utf-8"))
          print("Inventory findings:", len(d["findings"]))
          print("Parse failures:", len(d["errors"]))
          for error in d["errors"][:40]:
              print("BLOCKED:", error)
          PY
          exit "$code"
