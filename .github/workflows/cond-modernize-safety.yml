name: COND modernizer safety

on:
  workflow_dispatch:

jobs:
  safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Test polarity, source preservation and fail-closed staging — EXCLUDED (NOT_VERIFIED)
        if: false
        shell: bash
        run: echo "FOREIGN_LANGUAGE_TEST_BENCH=EXCLUDED_BY_POLICY native_equivalent=NOT_VERIFIED"
      - name: Audit active library parse completeness (read-only)
        shell: bash
        run: |
          set +e
          python3 scripts/cond-modernize.py --scan lib --json > "$RUNNER_TEMP/cond-report.json"
          code=$?
          set -e
          python3 - "$RUNNER_TEMP/cond-report.json" <<'PY'
          import json, sys
          d=json.load(open(sys.argv[1], encoding="utf-8"))
          print("Inventory findings:", len(d["findings"]))
          print("Parse failures:", len(d["errors"]))
          from collections import Counter
          print("Migration categories:", dict(Counter(x["status"] for x in d["findings"])))
          for item in d["findings"][:40]:
              print("COND-MIGRATION", item["path"], "line", item["line"], item["status"], item["reason"])
          for error in d["errors"][:40]:
              print("BLOCKED:", error)
          PY
          exit "$code"
