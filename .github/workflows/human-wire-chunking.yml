name: Human-wire D1-D5 chunking research

on:
  workflow_dispatch:

jobs:
  chunking:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Build D1-D5 chunking matrix — EXCLUDED (NOT_VERIFIED)
        if: false
        shell: bash
        run: echo "FOREIGN_LANGUAGE_TEST_BENCH=EXCLUDED_BY_POLICY native_equivalent=NOT_VERIFIED"
      - name: Publish report
        if: always()
        run: |
          if test -f /tmp/human-wire-chunking/report.md; then
            cat /tmp/human-wire-chunking/report.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: human-wire-d1-d5-chunking
          path: /tmp/human-wire-chunking/
          retention-days: 14
