# Поточні українські проєкції перевіряємо окремо від нативного SENS runtime.
name: Драбина доменів — точна ширина та механіка

on:
  workflow_dispatch:
jobs:
  exact-width-ladder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Статичний аудит української UTF-8 проєкції без SID8
        run: echo "FOREIGN_LANGUAGE_TEST_OR_BENCH=EXCLUDED_BY_POLICY native_equivalent=NOT_VERIFIED"
      - uses: dtolnay/rust-toolchain@stable
      - name: Перевірити побітове пакування D1–D10 без вирівнювання
        run: >-
          cargo test --locked -p sens --lib packed_bits::tests:: -- --nocapture
      - name: Перевірити точну ширину доменів і механічні цикли W7
        run: cargo test --locked -p sens --test domain_ladder --test d7_w7_pack --test d2_text7_frame_role_boundary --test text7_canonical_wire --test current_binary_preflight
      - name: Перевірити пряме читання упакованих байтів D2 без текстового джерела
        run: cargo test --locked -p sens --lib canonical_reader::tests::packed_
      - name: Виконати фізичний .sens із типізованих двійкових слів
        run: cargo test --locked -p sens --features rust-t5-reference --test physical_t5m_execution
      - name: Перевірити, що заповнення D3–D10 походить лише з ратифікованих карт
        run: echo "FOREIGN_LANGUAGE_TEST_OR_BENCH=EXCLUDED_BY_POLICY native_equivalent=NOT_VERIFIED"
      - name: Перевірити фізичне заповнення D8/D9 без допуску до семантичного виконання
        run: >-
          cargo test --locked -p sens --lib domain_ladder::tests:: -- --nocapture
      - name: Перевірити всі 128 чинних 7-бітних координат даних D7
        run: echo "FOREIGN_LANGUAGE_TEST_OR_BENCH=EXCLUDED_BY_POLICY native_equivalent=NOT_VERIFIED"
      - name: Перевірити відповідність таблиць D7 ратифікованим координатам
        run: echo "FOREIGN_LANGUAGE_TEST_OR_BENCH=EXCLUDED_BY_POLICY native_equivalent=NOT_VERIFIED"
      - name: Перевірити весь Rust runtime після змін драбини доменів
        run: cargo test --locked -p sens --lib
      - name: Перевірити фізичний native pair execution і fail-closed barrier
        run: cargo test --locked -p sens-host --test native_lisp_bytes
      - name: Перевірити, що ролі SoundCell і LocalOrdinal у D7 не перетворюються на Number
        run: echo "FOREIGN_LANGUAGE_TEST_OR_BENCH=EXCLUDED_BY_POLICY native_equivalent=NOT_VERIFIED"

  utf8-d1-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Незалежний Rust-свідок D1 для 16 UTF-8 граничних випадків
        run: cargo test --locked -p sens --test utf8 utf8_helper_returns_exact_d1_predicate_on_boundaries -- --exact --nocapture
