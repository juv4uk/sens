name: Драбина доменів — точна ширина та механіка

on:
  pull_request:
    paths:
      - "crates/sens/src/bits.rs"
      - "crates/sens/src/bit9.rs"
      - "crates/sens/src/source_words.rs"
      - "crates/sens/src/canonical_reader.rs"
      - "crates/sens/src/ternary_transport.rs"
      - "crates/sens/src/binary_execution.rs"
      - "crates/sens/tests/physical_t5_execution.rs"
      - "crates/sens/src/mixed_source.rs"
      - "crates/sens/src/domain_words.rs"
      - "crates/sens/src/domain_identity.rs"
      - "crates/sens/src/domain_ladder.rs"
      - "crates/sens/src/domain_owner_generated.rs"
      - "scripts/generate-domain-owner-registry.py"
      - "knowledge/d8-ratified.json"
      - "knowledge/d9-ratified.json"
      - "crates/sens/src/text7.rs"
      - "crates/sens/src/text7_projection.rs"
      - "knowledge/d7-ratified.json"
      - "contracts/d7-ratification.lisp"
      - "lib/domains/d7.lisp"
      - "scripts/check-d7-current-authority.py"
      - "scripts/check-domain-tables.py"
      - "benchmarks/d7-ratification-conformance/**"
      - "crates/sens/tests/domain_ladder.rs"
      - "crates/sens/tests/current_binary_preflight.rs"
      - "crates/sens/tests/d7_w7_pack.rs"
      - "crates/sens/tests/d2_text7_frame_role_boundary.rs"
      - "crates/sens/tests/text7_canonical_wire.rs"
      - ".github/workflows/domain-ladder.yml"
  push:
    branches: [main]
    paths:
      - "crates/sens/src/bits.rs"
      - "crates/sens/src/bit9.rs"
      - "crates/sens/src/source_words.rs"
      - "crates/sens/src/canonical_reader.rs"
      - "crates/sens/src/ternary_transport.rs"
      - "crates/sens/src/binary_execution.rs"
      - "crates/sens/tests/physical_t5_execution.rs"
      - "crates/sens/src/mixed_source.rs"
      - "crates/sens/src/domain_words.rs"
      - "crates/sens/src/domain_identity.rs"
      - "crates/sens/src/domain_ladder.rs"
      - "crates/sens/src/domain_owner_generated.rs"
      - "scripts/generate-domain-owner-registry.py"
      - "knowledge/d8-ratified.json"
      - "knowledge/d9-ratified.json"
      - "crates/sens/src/text7.rs"
      - "crates/sens/src/text7_projection.rs"
      - "knowledge/d7-ratified.json"
      - "contracts/d7-ratification.lisp"
      - "lib/domains/d7.lisp"
      - "scripts/check-d7-current-authority.py"
      - "scripts/check-domain-tables.py"
      - "benchmarks/d7-ratification-conformance/**"
      - "crates/sens/tests/domain_ladder.rs"
      - "crates/sens/tests/current_binary_preflight.rs"
      - "crates/sens/tests/d7_w7_pack.rs"
      - "crates/sens/tests/d2_text7_frame_role_boundary.rs"
      - "crates/sens/tests/text7_canonical_wire.rs"
      - ".github/workflows/domain-ladder.yml"

jobs:
  exact-width-ladder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Перевірити драбину D1–D10 та механічні цикли W7
        run: cargo test --locked -p sens --test domain_ladder --test d7_w7_pack --test d2_text7_frame_role_boundary --test text7_canonical_wire --test current_binary_preflight
      - name: Перевірити пряме читання упакованих байтів D2 без текстового джерела
        run: cargo test --locked -p sens --lib canonical_reader::tests::packed_
      - name: Виконати фізичний .sens із типізованих двійкових слів
        run: cargo test --locked -p sens --test physical_t5_execution
      - name: Перевірити, що заповнення D3–D10 походить лише з ратифікованих карт
        run: python3 scripts/generate-domain-owner-registry.py --check
      - name: Перевірити фізичне заповнення D8/D9 без допуску до семантичного виконання
        run: >-
          cargo test --locked -p sens --lib domain_ladder::tests:: -- --nocapture
      - name: Перевірити ратифіковані координати D7 та дві зарезервовані комірки
        run: python3 scripts/check-d7-current-authority.py
      - name: Перевірити відповідність таблиць D7 ратифікованим координатам
        run: python3 scripts/check-domain-tables.py
      - name: Перевірити, що ролі SoundCell і LocalOrdinal у D7 не перетворюються на Number
        run: python3 benchmarks/d7-ratification-conformance/validate.py
