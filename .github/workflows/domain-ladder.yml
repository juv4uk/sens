name: Domain ladder exact-width verification

on:
  pull_request:
    paths:
      - ".github/workflows/domain-ladder.yml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/domain-ladder.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-width-ladder:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Check exact-width D1-D9 ladder and W7 mechanical round trips
        run: cargo test --locked -p sens --test domain_ladder --test d7_w7_pack --test d2_text7_frame_role_boundary --test text7_canonical_wire --test current_binary_preflight
      - name: Test direct packed-byte D2 reader without text source
        run: cargo test --locked -p sens --lib canonical_reader::tests::packed_
      - name: Physical .sens execution from typed binary words
        run: cargo test --locked -p sens --test physical_t5_execution
      - name: Generated D3-D9 occupancy comes only from owner-ratified maps
        run: python3 scripts/generate-domain-owner-registry.py --check
      - name: Check physical D8/D9 occupancy without executable semantic admission
        run: cargo test --locked -p sens --lib domain_ladder::tests:: -- --nocapture
