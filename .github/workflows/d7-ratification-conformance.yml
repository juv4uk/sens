name: D7 v2 owner-boundary conformance

on:
  pull_request:
    paths:
      - "knowledge/d7-keyboard-v2-ratified.json"
      - "lib/domains/d7.lisp"
      - "scripts/check-d7-keyboard-v2-table.py"
      - "scripts/check-d7-runtime-projection.py"
      - "crates/sens/src/d7_keyboard.rs"
      - "crates/sens/src/d7_display_registry_generated.rs"
      - "crates/sens/src/semantic_registry.rs"
      - "crates/sens/src/text7_projection.rs"
      - "crates/sens/tests/d7_runtime_presentation.rs"
      - "crates/sens/tests/d7_keyboard_t5.rs"
      - ".github/workflows/d7-ratification-conformance.yml"
  push:
    branches: [main]
    paths:
      - "knowledge/d7-keyboard-v2-ratified.json"
      - "lib/domains/d7.lisp"
      - "scripts/check-d7-runtime-projection.py"
      - "crates/sens/src/d7_display_registry_generated.rs"
      - "crates/sens/src/semantic_registry.rs"
      - "crates/sens/tests/d7_runtime_presentation.rs"
      - ".github/workflows/d7-ratification-conformance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  d7-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Prove only the current ratified D7 v2 owner map is used
        run: |
          python3 scripts/check-d7-keyboard-v2-table.py
          python3 scripts/check-d7-runtime-projection.py
      - name: Prove exact W7 vs D2 and prevent callable aliases
        run: cargo test --locked -p sens --test d7_runtime_presentation --test d7_keyboard_t5 --test d7_w7_pack --test canonical_w7_frame_invariance
