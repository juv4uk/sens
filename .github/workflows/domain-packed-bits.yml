name: Точне щільне пакування D1–D10

on:
  push:
    branches: [main]
    paths:
      - "crates/sens/src/packed_bits.rs"
      - "crates/sens/src/source_packing.rs"
      - "crates/sens/src/domain_ladder.rs"
      - ".github/workflows/domain-packed-bits.yml"
  pull_request:
    paths:
      - "crates/sens/src/packed_bits.rs"
      - "crates/sens/src/source_packing.rs"
      - "crates/sens/src/domain_ladder.rs"
      - ".github/workflows/domain-packed-bits.yml"
  workflow_dispatch:

jobs:
  exact-domain-bitstream:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Перевірити точні біти D1–D10 без прихованого вирівнювання
        run: >-
          cargo test --locked -p sens --lib packed_bits::tests:: -- --nocapture
      - name: Перевірити точнодоменне джерельне пакування та декодування
        run: >-
          cargo test --locked -p sens --lib source_packing::tests:: -- --nocapture
      - name: Перевірити всі 2046 координат і 18434 однобітові мутації
        run: >-
          cargo test --locked -p sens --lib domain_ladder::tests:: -- --nocapture
