name: Island lowering 1048

on:
  pull_request:
    paths:
      - "lib/island-lowering.lisp"
      - "lib/mechanism-selector.lisp"
      - "tests/fixtures/island-lowering-1048-witness.lisp"
      - ".github/workflows/island-lowering-1048.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lowering:
    name: Lisp-owned arguments-only island lowering
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build CLI
        run: cargo build -p sens-cli --bin my-lisp
      - name: Execute lowering witness
        shell: bash
        run: |
          set -euo pipefail
          got="$(./target/debug/sens tests/fixtures/island-lowering-1048-witness.lisp)"
          printf '%s\n' "$got"
          test "$got" = "(island-lowering-1048 (status pass) (executable-payloads 4) (clips admitted-direct-sid8))"
      - name: Diff hygiene
        run: git diff --check
