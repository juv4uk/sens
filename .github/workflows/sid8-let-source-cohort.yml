name: SID8 parallel LET to D4 LAMBDA source proof
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fail-closed-identity-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify 43 Lisp-owned LAMBDA lowerings and one held LET with exact Git blob replay
        run: python3 -m unittest discover -s tests -p test_sid8_let_source_cohort.py -v
