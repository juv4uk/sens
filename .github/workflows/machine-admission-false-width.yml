name: Точна ширина невиконуваного x86 admission datum

on:
  pull_request:
    paths:
      - "lib/machine/admission/x86-64.lisp"
      - "crates/sens/tests/machine_admission_false_width.rs"
      - ".github/workflows/machine-admission-false-width.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  admission-false-width:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: "1"
      RUST_TEST_THREADS: "1"
      RUST_MIN_STACK: "33554432"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: D3 ATOM + D1 біт та недоторкане D8
        run: cargo test --locked -p sens --test machine_admission_false_width -- --nocapture
