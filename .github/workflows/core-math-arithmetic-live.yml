name: Core-Math exact-Q arithmetic live

on:
  pull_request:
    paths:
      - "crates/sens/src/eval/arithmetic.rs"
      - "crates/sens/src/value.rs"
      - "crates/sens/tests/core_math_arithmetic_live.rs"
      - "docs/research/2713-core-math-arithmetic-live.md"
      - ".github/workflows/core-math-arithmetic-live.yml"
  push:
    branches: [main]
    paths:
      - "crates/sens/src/eval/arithmetic.rs"
      - "crates/sens/src/value.rs"
      - "crates/sens/tests/core_math_arithmetic_live.rs"
      - "docs/research/2713-core-math-arithmetic-live.md"
      - ".github/workflows/core-math-arithmetic-live.yml"

permissions:
  contents: read

jobs:
  exact-q-live:
    name: Three-basis exact-Q execution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Focused formatting
        run: rustfmt --edition 2021 --check crates/sens/tests/core_math_arithmetic_live.rs
      - name: Execute typed exact-Q bridge witness
        run: cargo test -p sens --test core_math_arithmetic_live -- --nocapture
      - name: Publish summary
        if: always()
        run: |
          {
            echo "## Core-Math exact-Q live"
            echo
            echo "- bridge basis rows: ADD, MUL, RECIP only"
            echo "- NEG/SUB/DIV generated by composition"
            echo "- exact rational SENS execution"
            echo "- recip(0) classified mathematically undefined"
            echo "- no D5/D6 arithmetic residency"
            echo "- no textual operator dispatch in witness source"
          } >> "$GITHUB_STEP_SUMMARY"
