name: Core-Math equivalence research

on:
  pull_request:
    paths:
      - "benchmarks/core-math-equivalence/**"
      - ".github/workflows/core-math-equivalence.yml"
      - "benchmarks/core-math-generated-identity/**"
      - "docs/research/2433-core-math-neutral-v1.json"
      - "docs/research/2433-core-math-generation-certificates.json"
      - "scripts/research-2433-core-math-neutral-growth.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  equivalence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Re-check neutral growth donor
        run: python3 scripts/research-2433-core-math-neutral-growth.py --check

      - name: Re-check generated identity parent
        run: |
          rm -rf /tmp/core-math-generated-identity
          python3 benchmarks/core-math-generated-identity/run.py \
            --out /tmp/core-math-generated-identity

      - name: Run equivalence fragments
        run: |
          rm -rf /tmp/core-math-equivalence
          python3 benchmarks/core-math-equivalence/run.py \
            --out /tmp/core-math-equivalence

      - name: Publish report
        if: always()
        run: |
          if test -f /tmp/core-math-equivalence/report.md; then
            cat /tmp/core-math-equivalence/report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-math-equivalence
          path: /tmp/core-math-equivalence/
          retention-days: 14
