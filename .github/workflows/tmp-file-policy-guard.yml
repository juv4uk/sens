name: TEMP verify canonical SENS file policy guard

on:
  push:
    branches:
      - fix/file-guard-policy-consolidation-20261010
    paths:
      - ".github/workflows/tmp-file-policy-guard.yml"
      - ".github/workflows/important-file-guard.yml"
      - "tools/check_source_policy.py"
      - "tools/foreign-census.tsv"
      - "knowledge/file-authority-policy.lisp"
      - "knowledge/foreign-tools-census.lisp"

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Verify file policy in standard and optimized Python
        run: |
          set -euo pipefail
          python3 tools/check_source_policy.py --self-test
          python3 -O tools/check_source_policy.py --self-test
          python3 -O tools/check_source_policy.py
