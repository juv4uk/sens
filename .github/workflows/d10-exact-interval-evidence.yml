name: D10 exact rational interval witness

on:
  pull_request:
    paths:
      - 'knowledge/d10-cross-hobby-interval-constraint-20261009.json'
      - 'scripts/check_d10_interval_conflict.py'
      - 'docs/research/d10-exact-interval-evidence.uk.md'
      - '.github/workflows/d10-exact-interval-evidence.yml'
  push:
    branches:
      - research/d10-exact-rational-interval-conflict-20261009
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-interval-constraint-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Compile the independent exact-rational witness
        run: python3 -m py_compile scripts/check_d10_interval_conflict.py
      - name: Check source corpus, exhaustive oracle and mutation controls
        run: python3 scripts/check_d10_interval_conflict.py --self-test
