name: lisp-paren-balance

# Static syntax guard: every .lisp file under lib/ must be paren-balanced.
# Catches the #4375 class of defect (a projection form committed with an
# unclosed list) at push time, instead of via a late, unnamed `exit code 1`
# inside a large gate step. Hosted runner: no CUDA/hardware needed.

on:
  push:
    paths:
      - "lib/**/*.lisp"
      - "scripts/check-lisp-paren-balance.py"
      - ".github/workflows/lisp-paren-balance.yml"
  pull_request:
    paths:
      - "lib/**/*.lisp"
      - "scripts/check-lisp-paren-balance.py"
      - ".github/workflows/lisp-paren-balance.yml"
  workflow_dispatch:

jobs:
  guard:
    name: Lisp paren balance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Перевірити Lisp та незмінність Git HEAD блобів
        run: python3 scripts/check-lisp-paren-balance.py --paths lib --verify-git-head
      - name: Негативні свідки обрубків і відсутніх файлів
        shell: bash
        run: |
          set -euo pipefail
          for rel in \
            lib/machine/encoding/x86-64.lisp \
            lib/machine/admission/x86-64.lisp \
            lib/machine/lowering/semantic-x86-64.lisp; do
            temp="$(mktemp -d)"
            mkdir -p "$temp/$(dirname "$rel")"
            for marker in 'SEE_LOCAL_FIX_B4j' '; see next'; do
              printf '%s\n' "$marker" > "$temp/$rel"
              if python3 scripts/check-lisp-paren-balance.py --root "$temp" --paths "$rel"; then
                echo "FAIL: accepted truncated placeholder $rel"
                exit 1
              fi
            done
            rm -rf "$temp"
          done
          temp="$(mktemp -d)"
          mkdir -p "$temp/lib"
          if python3 scripts/check-lisp-paren-balance.py --root "$temp" --paths lib; then
            echo 'FAIL: missing machine sources accepted'
            exit 1
          fi
          rm -rf "$temp"
