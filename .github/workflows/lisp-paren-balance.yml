name: lisp-paren-balance

# Структурний аудит джерел Lisp і незмінності критичних машинних файлів.
# Це перевірка читання файлів на Rust, НЕ мовний семантичний оракул.
# Один ручний легкий workflow; важкий Cargo workspace не запускаємо.

on:
  workflow_dispatch:

jobs:
  source-guard:
    name: Rust — дужки, машинні джерела та негативні випадки
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Зібрати незалежний Rust-аудитор без залежностей Cargo
        run: |
          rustc --edition=2021 crates/sens-cli/src/bin/lisp-source-guard.rs -o "$RUNNER_TEMP/lisp-source-guard"
          rustc --edition=2021 --test crates/sens-cli/src/bin/lisp-source-guard.rs -o "$RUNNER_TEMP/lisp-source-guard-tests"
      - name: Негативні структурні свідки Rust
        run: "$RUNNER_TEMP/lisp-source-guard-tests"
      - name: Дужки та цілісність машинних Lisp-джерел
        run: "$RUNNER_TEMP/lisp-source-guard --root . --paths lib"
