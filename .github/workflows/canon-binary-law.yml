name: Canon laws executed by binary SENS

on:
  push:
    branches: [main]
    paths:
      - 'lib/canon.lisp'
      - 'lib/core1.lisp'
      - 'lib/core1-arity.bits'
      - 'lib/core1-arity.sens'
      - 'tests/fixtures/core1-arity-semantic.bits'
      - 'tests/fixtures/core1-arity-semantic.sens'
      - 'lib/core1-admission.bits'
      - 'lib/core1-admission.sens'
      - 'tests/fixtures/core1-admission-semantic.bits'
      - 'tests/fixtures/core1-admission-semantic.sens'
      - 'lib/core1-selectors.bits'
      - 'lib/core1-selectors.sens'
      - 'tests/fixtures/core1-selectors-semantic.bits'
      - 'tests/semantic/core1-admitted-selectors.bits'
      - 'tests/fixtures/core1-selectors-semantic.sens'
      - 'lib/machine/block.lisp'
      - 'lib/machine/block.bits'
      - 'lib/machine/block.sens'
      - 'tests/fixtures/machine-block-semantic.bits'
      - 'tests/fixtures/machine-block-semantic.sens'
      - 'tests/fixtures/canon-ladder-logic.bits'
      - 'tests/fixtures/canon-ladder-logic.sens'
      - '.github/workflows/canon-binary-law.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  binary-sens-canon-law:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@1.99.0
      - name: Build transport and interpreter mechanisms
        run: cargo build --locked -p sens-cli --bin sens --bin sens-trit
      - name: Execute self-verdict in exact-width binary SENS (no Python or Rust semantic asserts)
        shell: bash
        run: |
          set -euo pipefail
          source='tests/fixtures/canon-ladder-logic.sens'
          target/debug/sens-trit open "$source" > "$RUNNER_TEMP/canon-projection.bits"
          cmp tests/fixtures/canon-ladder-logic.bits "$RUNNER_TEMP/canon-projection.bits"
          target/debug/sens "$source" > "$RUNNER_TEMP/canon-sens.out"
          target/debug/sens-trit eval "$source" > "$RUNNER_TEMP/canon-trit.out"
          cmp "$RUNNER_TEMP/canon-sens.out" "$RUNNER_TEMP/canon-trit.out"
          printf '1\n' | cmp - "$RUNNER_TEMP/canon-sens.out"

      - name: Execute machine-block laws and D7 binder admission in exact SENS
        shell: bash
        run: |
          set -euo pipefail
          # Physical source and witness are separate; no host semantic assertions.
          target/debug/sens-trit open lib/machine/block.sens > "$RUNNER_TEMP/machine-block-source.bits"
          cmp lib/machine/block.bits "$RUNNER_TEMP/machine-block-source.bits"
          source='tests/fixtures/machine-block-semantic.sens'
          target/debug/sens-trit open "$source" > "$RUNNER_TEMP/machine-block-witness.bits"
          cmp tests/fixtures/machine-block-semantic.bits "$RUNNER_TEMP/machine-block-witness.bits"
          target/debug/sens "$source" > "$RUNNER_TEMP/machine-block-sens.out"
          target/debug/sens-trit eval "$source" > "$RUNNER_TEMP/machine-block-trit.out"
          cmp "$RUNNER_TEMP/machine-block-sens.out" "$RUNNER_TEMP/machine-block-trit.out"
          printf '1\n' | cmp - "$RUNNER_TEMP/machine-block-sens.out"

      - name: SENS owns Core1 selector semantics and D1 verdict
        shell: bash
        run: |
          set -euo pipefail
          target/debug/sens-trit open lib/core1-selectors.sens > "$RUNNER_TEMP/core1-source.bits"
          cmp lib/core1-selectors.bits "$RUNNER_TEMP/core1-source.bits"
          program='tests/fixtures/core1-selectors-semantic.sens'
          target/debug/sens-trit open "$program" > "$RUNNER_TEMP/core1-witness.bits"
          cmp tests/fixtures/core1-selectors-semantic.bits "$RUNNER_TEMP/core1-witness.bits"
          target/debug/sens "$program" > "$RUNNER_TEMP/core1-sens.out"
          target/debug/sens-trit eval "$program" > "$RUNNER_TEMP/core1-trit.out"
          cmp "$RUNNER_TEMP/core1-sens.out" "$RUNNER_TEMP/core1-trit.out"
          printf '1\n' | cmp - "$RUNNER_TEMP/core1-sens.out"


      - name: SENS checks Core1 D4/D5 cutover and one-bit mutant
        shell: bash
        run: |
          set -euo pipefail
          # SENS semantic verdict is entirely in the binary program. Host moves bytes.
          cp tests/semantic/core1-admitted-selectors.bits "$RUNNER_TEMP/core1-admitted-selectors.lisp"
          target/debug/sens-trit encode "$RUNNER_TEMP/core1-admitted-selectors.lisp"
          target/debug/sens-trit open "$RUNNER_TEMP/core1-admitted-selectors.sens" > "$RUNNER_TEMP/core1-admitted-open.bits"
          cmp tests/semantic/core1-admitted-selectors.bits "$RUNNER_TEMP/core1-admitted-open.bits"
          target/debug/sens "$RUNNER_TEMP/core1-admitted-selectors.sens" > "$RUNNER_TEMP/core1-admitted-sens.out"
          target/debug/sens-trit eval "$RUNNER_TEMP/core1-admitted-selectors.sens" > "$RUNNER_TEMP/core1-admitted-trit.out"
          cmp "$RUNNER_TEMP/core1-admitted-sens.out" "$RUNNER_TEMP/core1-admitted-trit.out"
          printf '1\n' | cmp - "$RUNNER_TEMP/core1-admitted-sens.out"

      - name: Core1 admitted function coordinates judged by physical SENS
        shell: bash
        run: |
          set -euo pipefail
          target/debug/sens-trit open lib/core1-admission.sens > "$RUNNER_TEMP/core1-admission-source.bits"
          cmp lib/core1-admission.bits "$RUNNER_TEMP/core1-admission-source.bits"
          program='tests/fixtures/core1-admission-semantic.sens'
          target/debug/sens-trit open "$program" > "$RUNNER_TEMP/core1-admission-witness.bits"
          cmp tests/fixtures/core1-admission-semantic.bits "$RUNNER_TEMP/core1-admission-witness.bits"
          target/debug/sens "$program" > "$RUNNER_TEMP/core1-admission-sens.out"
          target/debug/sens-trit eval "$program" > "$RUNNER_TEMP/core1-admission-trit.out"
          cmp "$RUNNER_TEMP/core1-admission-sens.out" "$RUNNER_TEMP/core1-admission-trit.out"
          printf '1\n' | cmp - "$RUNNER_TEMP/core1-admission-sens.out"

      - name: Core1 exact arity laws are judged by binary SENS
        shell: bash
        run: |
          set -euo pipefail
          target/debug/sens-trit open lib/core1-arity.sens > "$RUNNER_TEMP/core1-arity-source.bits"
          cmp lib/core1-arity.bits "$RUNNER_TEMP/core1-arity-source.bits"
          program='tests/fixtures/core1-arity-semantic.sens'
          target/debug/sens-trit open "$program" > "$RUNNER_TEMP/core1-arity-witness.bits"
          cmp tests/fixtures/core1-arity-semantic.bits "$RUNNER_TEMP/core1-arity-witness.bits"
          target/debug/sens "$program" > "$RUNNER_TEMP/core1-arity-sens.out"
          target/debug/sens-trit eval "$program" > "$RUNNER_TEMP/core1-arity-trit.out"
          cmp "$RUNNER_TEMP/core1-arity-sens.out" "$RUNNER_TEMP/core1-arity-trit.out"
          printf '1\n' | cmp - "$RUNNER_TEMP/core1-arity-sens.out"
