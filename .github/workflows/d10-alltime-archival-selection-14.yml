name: D10 alltime archive 14 historical source proofs
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-fourteen-archival-laws:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify 11 exact source Git blobs and 14 research-only admissions
        run: |
          set -euo pipefail
          python3 scripts/check_d10_alltime_archived_14_selection.py --self-test
          python3 -O scripts/check_d10_alltime_archived_14_selection.py --self-test
      - name: Verify original D10 historical append-only proof and pending ledger
        run: |
          set -euo pipefail
          python3 scripts/check_d10_selection_transition_history.py --self-test
          true
