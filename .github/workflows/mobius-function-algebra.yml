name: Möbius function algebra research

on:
  pull_request:
    paths:
      - "scripts/research-2290-mobius-function-algebra.py"
      - ".github/workflows/mobius-function-algebra.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-q-mobius:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify projective matrix/function composition algebra
        run: python3 scripts/research-2290-mobius-function-algebra.py
