name: D7 v2 text data projection and physical T5

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  projection:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - name: Check current D7 v2 JSON and generated Rust W7 surfaces
        run: |
          python3 scripts/check-d7-keyboard-v2-table.py
          python3 scripts/check-d7-runtime-projection.py
      - name: Test Ukrainian keyboard data and exact T5
        run: |
          python3 -m unittest discover -s tests -p 'test_d7_symbol_codec.py' -v
          python3 -m unittest discover -s tests -p 'test_d7_t5_keyboard.py' -v
      - uses: dtolnay/rust-toolchain@stable
      - name: Current D7 Rust / Text7 / D2 boundaries
        run: cargo test --locked -p sens --features rust-t5-reference --test d7_keyboard_t5 --test text7_canonical_wire
