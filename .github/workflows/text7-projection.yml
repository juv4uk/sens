name: Text7 UPC-7 projection

on:
  pull_request:
    paths:
      - contracts/text7-upc7.lock
      - scripts/generate-text7-projection.py
      - crates/sens/src/text7.rs
      - crates/sens/src/text7_projection.rs
      - crates/sens/src/text7_projection_generated.rs
      - .github/workflows/text7-projection.yml
  push:
    branches: [main]
    paths:
      - contracts/text7-upc7.lock
      - scripts/generate-text7-projection.py
      - crates/sens/src/text7.rs
      - crates/sens/src/text7_projection.rs
      - crates/sens/src/text7_projection_generated.rs
      - .github/workflows/text7-projection.yml

jobs:
  projection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Read pinned upstream
        id: pin
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import re
          from pathlib import Path

          text = Path("contracts/text7-upc7.lock").read_text(encoding="utf-8")
          for name in ("repository", "revision"):
              match = re.search(r"\(" + name + r'\s+"([^"]+)"\)', text)
              if not match:
                  raise SystemExit(f"missing {name} in Text7 lock")
              print(f"{name}={match.group(1)}")
          PY

      - name: Checkout pinned UPC-7 authority
        uses: actions/checkout@v5
        with:
          repository: ${{ steps.pin.outputs.repository }}
          ref: ${{ steps.pin.outputs.revision }}
          path: .upstream/shiva-sutras

      - name: Check generated Text7 projection
        run: >-
          python3 scripts/generate-text7-projection.py
          --upstream-root .upstream/shiva-sutras
          --check

      - uses: dtolnay/rust-toolchain@stable

      - name: Check Text7 projection tests
        run: cargo test -p sens text7 -- --nocapture
