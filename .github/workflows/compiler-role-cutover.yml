name: Compiler role authority cutover

on:
  # Переведено на pull_request: workflow УЖЕ читає PR-дані
  # (github.event.pull_request.*), але тригер не стріляв.
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: compiler-role-cutover-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  cutover:
    # Compiler-role cutover is CPU-only; use the public-repo hosted runner.
    # Actual CUDA lanes remain on GPU-labelled workflows.
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: "1"
      RUST_TEST_THREADS: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/install-zig
      - name: Default SENS core has no runtime dependencies
        run: |
          tree="$(cargo tree -p sens --no-default-features -e normal --prefix none)"
          lines="$(printf '%s\n' "$tree" | wc -l)"
          test "$lines" -eq 1 || {
            echo "default sens core acquired runtime dependencies" >&2
            printf '%s\n' "$tree" >&2
            exit 1
          }
          cargo check -p sens --lib --no-default-features
      - name: D1-D10 mechanical coordinate carrier remains buildable
        run: cargo test -p sens --lib domain_ladder::tests
      - name: D4 bootstrap projection must match ratified authority
        run: python3 scripts/generate-d4-bootstrap-compiler-structure.py --check
      - name: Production path must not import Rust role oracle
        run: |
          if grep -nE '^[[:space:]]*compiler_execution_role[,;(]' crates/sens/tests/compiler_role_cutover.rs; then
            echo "production cutover still depends on Rust role oracle" >&2
            exit 1
          fi
      - run: >-
          cargo test -p sens
          --test compiler_role_cutover
          --test compiler_l1_l5_role
          --test compiler_domain_shape
          --test compiler_nucleus_sens
          --test compiler_nucleus_diff
          --test compiler_selfhost_role_closure
      - name: Canonical compiler-evidence decoder roundtrip
        run: |
          cargo test -p sens --lib \
            compiler_bootstrap::tests::compiler_evidence_round_trips_exact_value_and_width \
            -- --nocapture
          cargo test -p sens --lib \
            compiler_bootstrap::tests::compiler_evidence_decoder_fails_closed_on_malformed_bytes \
            -- --nocapture

      - name: Verified whole-program compiler artifact seam
        run: |
          cargo test -p sens --lib \
            compiler_language::tests::whole_program_artifact_verifier_binds_requests_to_current_sens_authority \
            -- --nocapture
          cargo test -p sens --lib \
            compiler_language::tests::whole_program_artifact_verifier_rejects_tampering_and_target_smuggling \
            -- --nocapture

      - name: Compiler semantic export CLI
        run: cargo test -p xtask --test compiler_export_cli -- --nocapture

      - name: Three-projection publisher transaction and fail-closed guards
        run: python3 -m unittest discover -s tests -p 'test_publish_verified_uk_triplets.py'

      - name: Physical T5M triplet through the public compiler CLI
        run: cargo test -p xtask --test compiler_triplet_cli -- --nocapture

      - name: Canonical SW1 and physical T5M triplet -> SENS compiler -> artifact
        run: cargo test -p xtask compiler_compile::tests -- --nocapture
      - name: Whole-nucleus lowering coverage when present
        run: |
          if test -f crates/sens/tests/compiler_selfhost_lowering_coverage.rs; then
            cargo test -p sens --test compiler_selfhost_lowering_coverage -- --nocapture
          fi

      - name: Selfhost program-data wire
        run: cargo test -p sens --test compiler_program_data -- --nocapture

      - name: SENS recursive program compiler traversal
        run: |
          cargo test -p sens --lib \
            compiler_language::tests::sens_program_traversal_is_role_aware_and_quote_shields_domain_data \
            -- --nocapture
          cargo test -p sens --lib \
            compiler_language::tests::same_payload_wrong_domain_with_wrong_shape_fails_closed \
            -- --nocapture
          cargo test -p sens --lib \
            compiler_language::tests::malformed_exact_d3_cond_clause_fails_closed_before_request_emission \
            -- --nocapture
          cargo test -p sens --lib \
            compiler_language::tests::direct_d8_domain_call_fails_closed_in_sens_program_traversal \
            -- --nocapture

      - name: SENS whole-program compilation artifact
        run: |
          cargo test -p sens --lib \
            compiler_language::tests::whole_program_artifact_wraps_real_wire_traversal_inside_sens \
            -- --nocapture
          cargo test -p sens --lib \
            compiler_language::tests::rejected_program_returns_sens_owned_error_artifact \
            -- --nocapture
          cargo test -p sens --lib \
            compiler_language::tests::whole_program_artifact_rejects_non_digest_transport_metadata \
            -- --nocapture

      - name: Stale projection is bootstrap failure, not semantic diff
        run: >-
          cargo test -p sens --lib
          compiler_language::tests::stale_law_authority_is_a_bootstrap_failure_before_role_execution
          -- --nocapture
