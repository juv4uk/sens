name: D5 semantic lower bound

on:
  pull_request:
    paths:
      - "crates/sens/src/eval/mod.rs"
      - "crates/sens/src/eval/closures.rs"
      - "crates/sens/tests/macro_derivation.rs"
      - "scripts/research-2193-d5-lower-bound.py"
      - "docs/research/2193-d5-lower-bound*.md"
      - ".github/workflows/d5-semantic-lower-bound.yml"
  push:
    branches:
      - main
    paths:
      - "crates/sens/src/eval/mod.rs"
      - "crates/sens/src/eval/closures.rs"
      - "crates/sens/tests/macro_derivation.rs"
      - "scripts/research-2193-d5-lower-bound.py"
      - "docs/research/2193-d5-lower-bound*.md"
      - ".github/workflows/d5-semantic-lower-bound.yml"

jobs:
  d5-lower-bound:
    name: D5 ordinary-vs-transformer lower bound
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run semantic lower-bound witness
        run: python3 scripts/research-2193-d5-lower-bound.py
      - name: Publish summary
        if: always()
        run: |
          {
            echo "## D5 semantic lower bound"
            echo
            echo "- Same call syntax must support eager ordinary closures and raw-form transformers."
            echo "- No one-mode policy satisfies both."
            echo "- At least one observable call-mode/stage discriminator is required."
            echo "- Research-only: representation/address is not ratified."
          } >> "$GITHUB_STEP_SUMMARY"
