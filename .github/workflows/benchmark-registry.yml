name: Benchmark registry — metadata and discovery only

# This workflow validates discovery metadata and coverage.
# Measurements belong only to the native Rust/Zig/SENS performance workflow.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  registry:
    name: Registry schema, source-backed exemptions, and current index
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 pinned
        with:
          persist-credentials: false
      - name: Python registry tests and validators excluded (NOT_VERIFIED)
        run: echo "PYTHON_TESTS=EXCLUDED_BY_LANGUAGE_POLICY PYTHON_VALIDATORS=EXCLUDED native_equivalent=NOT_VERIFIED"
