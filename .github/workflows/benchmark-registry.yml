name: Benchmark registry

on:
  push:
    branches: [main]
    paths:
      - "benchmarks/**"
      - "scripts/benchmark_registry.py"
      - "scripts/benchmark_sweep.py"
      - ".github/workflows/benchmark-registry.yml"
  pull_request:
    paths:
      - "benchmarks/**"
      - "scripts/benchmark_registry.py"
      - ".github/workflows/benchmark-registry.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  registry:
    name: benchmark discovery registry
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate manifests and generated index
        run: python3 scripts/benchmark_registry.py --check

      - name: Verify and measure bounded T21/T22/T33 research candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 benchmarks/byte-pack/носій22.py --verify
          python3 benchmarks/byte-pack/носій22.py --bench --ntrits 4620 --reps 15 --out "$RUNNER_TEMP/t22-results.json"
          test -s "$RUNNER_TEMP/t22-results.json"

      - name: Publish raw T22 timing evidence
        uses: actions/upload-artifact@v4
        with:
          name: t22-carrier-benchmark-${{ github.sha }}
          path: ${{ runner.temp }}/t22-results.json
          if-no-files-found: error

      - name: Decide whether Rust wire-vs-JSON evidence is relevant
        id: rust_wire_json
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          run_bench=false
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            run_bench=true
          elif [[ -n "$BASE_SHA" && -n "$HEAD_SHA" ]] && git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep -Eq '^(benchmarks/rust-json-vs-sens-wire/|crates/sens/examples/transport_decode_bench\.rs$|crates/sens/Cargo\.toml$|Cargo\.lock$|benchmarks/agent-messages/run\.py$)'; then
            run_bench=true
          fi
          echo "run=$run_bench" >> "$GITHUB_OUTPUT"

      - name: Install stable Rust for decode-only comparison
        if: steps.rust_wire_json.outputs.run == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Install Cachegrind
        if: steps.rust_wire_json.outputs.run == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind
          rustc --version
          valgrind --version

      - name: Benchmark Rust serde_json against SENS wire
        if: steps.rust_wire_json.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          bash benchmarks/rust-json-vs-sens-wire/run.sh "$RUNNER_TEMP/rust-json-vs-sens-wire"
          cat "$RUNNER_TEMP/rust-json-vs-sens-wire/summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish raw Rust wire-vs-JSON evidence
        if: always() && steps.rust_wire_json.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: rust-json-vs-sens-wire-${{ github.sha }}
          path: ${{ runner.temp }}/rust-json-vs-sens-wire/
          if-no-files-found: warn
          retention-days: 14

      - name: Reject newly created unmanifested stands
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/benchmark_registry.py --check-new "$BASE_SHA" "$HEAD_SHA"

sweep:
    name: "Усі стенди, частина ${{ matrix.shard }}"
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Облік стендів і точного коміту
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/benchmark_registry.py --check
          git rev-parse HEAD
          python3 --version
          rustc --version
      - name: Інструменти для інструкційного профілю
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y valgrind
          valgrind --version
      - name: Виконати частину всіх bench.json
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          python3 scripts/benchmark_sweep.py \
            --shard "$SHARD" --shards 8 --timeout 180 \
            --out "$RUNNER_TEMP/benchmark-sweep-$SHARD"
      - name: Зберегти сирі результати, навіть коли стенд червоний
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-sweep-${{ github.run_id }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/benchmark-sweep-${{ matrix.shard }}/
          retention-days: 21
          if-no-files-found: error

  audit:
    name: Підсумувати кожен стенд та виявити відсутні докази
    needs: [sweep]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Зібрати всі часткові артефакти
        uses: actions/download-artifact@v4
        with:
          pattern: benchmark-sweep-${{ github.run_id }}-*
          path: ${{ runner.temp }}/benchmark-sweep-collected
          merge-multiple: true
      - name: Перевірити повноту реєстру й результати без приховування відмов
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/benchmark_sweep.py --summarize "$RUNNER_TEMP/benchmark-sweep-collected" \
            | tee "$RUNNER_TEMP/benchmark-sweep-summary.txt"
          cat "$RUNNER_TEMP/benchmark-sweep-summary.txt" >> "$GITHUB_STEP_SUMMARY"
      - name: Зберегти аудит повноти
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-sweep-summary-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/benchmark-sweep-collected/summary.json
            ${{ runner.temp }}/benchmark-sweep-summary.txt
          retention-days: 21
          if-no-files-found: warn
