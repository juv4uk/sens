name: Benchmark registry

on:
  push:
    branches: [main]
    paths:
      - "benchmarks/**"
      - "scripts/benchmark_registry.py"
      - "scripts/benchmark_sweep.py"
      - ".github/workflows/benchmark-registry.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
  pull_request:
    paths:
      - "benchmarks/**"
      - "scripts/benchmark_registry.py"
      - "scripts/benchmark_sweep.py"
      - ".github/workflows/benchmark-registry.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  registry:
    name: benchmark discovery registry
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate manifests and generated index
        run: python3 scripts/benchmark_registry.py --check

      - name: Verify and measure bounded T21/T22/T33 research candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 benchmarks/byte-pack/носій22.py --verify
          python3 benchmarks/byte-pack/носій22.py --bench --ntrits 4620 --reps 15 --out "$RUNNER_TEMP/t22-results.json"
          test -s "$RUNNER_TEMP/t22-results.json"

      - name: Publish raw T22 timing evidence
        uses: actions/upload-artifact@v4
        with:
          name: t22-carrier-benchmark-${{ github.sha }}
          path: ${{ runner.temp }}/t22-results.json
          if-no-files-found: error

      - name: Decide whether Rust wire-vs-JSON evidence is relevant
        id: rust_wire_json
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          run_bench=false
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            run_bench=true
          elif [[ -n "$BASE_SHA" && -n "$HEAD_SHA" ]] && git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep -Eq '^(benchmarks/rust-json-vs-sens-wire/|crates/sens/examples/transport_decode_bench\.rs$|crates/sens/Cargo\.toml$|Cargo\.lock$|benchmarks/agent-messages/run\.py$)'; then
            run_bench=true
          fi
          echo "run=$run_bench" >> "$GITHUB_OUTPUT"

      - name: Install stable Rust for decode-only comparison
        if: steps.rust_wire_json.outputs.run == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Install Cachegrind
        if: steps.rust_wire_json.outputs.run == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind
          rustc --version
          valgrind --version

      - name: Benchmark Rust serde_json against SENS wire
        if: steps.rust_wire_json.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          bash benchmarks/rust-json-vs-sens-wire/run.sh "$RUNNER_TEMP/rust-json-vs-sens-wire"
          cat "$RUNNER_TEMP/rust-json-vs-sens-wire/summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish raw Rust wire-vs-JSON evidence
        if: always() && steps.rust_wire_json.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: rust-json-vs-sens-wire-${{ github.sha }}
          path: ${{ runner.temp }}/rust-json-vs-sens-wire/
          if-no-files-found: warn
          retention-days: 14

      - name: Reject newly created unmanifested stands
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/benchmark_registry.py --check-new "$BASE_SHA" "$HEAD_SHA"

  discover-sweep:
    name: Discover all registered benchmark stands
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
      - name: Build matrix from authoritative bench.json manifests
        id: build
        shell: bash
        run: |
          set -euo pipefail
          matrix="$(python3 scripts/benchmark_sweep.py --list-json)"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "Discovered $(python3 -c 'import json,sys; print(len(json.load(sys.stdin)["include"]))' <<< "$matrix") registered benchmark stands."

  run-sweep:
    name: "Reproduce ${{ matrix.stand }}"
    needs: discover-sweep
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.discover-sweep.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5
      - name: Install Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Cachegrind for the Rust wire-vs-JSON benchmark
        if: matrix.stand == 'rust-json-vs-sens-wire' || matrix.stand == 'unbounded-width'
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind
          rustc --version
          valgrind --version

      - name: Run the manifest's exact reproduction command
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/benchmark_sweep.py --stand "${{ matrix.stand }}" --timeout-seconds 2700

      - name: Publish logs and machine-readable result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-sweep-${{ matrix.stand }}-${{ github.sha }}
          path: benchmark-sweep-results/${{ matrix.stand }}/
          if-no-files-found: warn
          retention-days: 30
