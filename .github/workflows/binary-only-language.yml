name: Binary-only SENS execution

on:
  push:
    branches: [main]
    paths:
      - "tests/fixtures/canonical-binary-smoke.lisp"
      - "crates/sens/tests/binary_only_language.rs"
      - "crates/sens/tests/sens_semantic_witnesses.rs"
      - "tests/semantic/meta-eval-mutual-d4-law.bits"
      - "tests/semantic/yantra-d4-bind-law.bits"
      - "tests/semantic/yantra-d4-bind-mutant.bits"
      - "lib/yantra.lisp"
      - "tests/semantic/x86-encoder-let-d4-law.bits"
      - "tests/semantic/x86-encoder-let-d4-mutant.bits"
      - "lib/machine/encoding/x86-64.lisp"
      - "lib/meta-eval-mutual.lisp"
      - "crates/sens/src/canonical_reader.rs"
      - "crates/sens/src/domain_identity.rs"
      - "crates/sens/src/eval/**"
      - "crates/sens/src/source_words.rs"
      - "crates/sens/src/ternary_transport.rs"
      - ".github/workflows/binary-only-language.yml"
  pull_request:
    paths:
      - "tests/fixtures/canonical-binary-smoke.lisp"
      - "crates/sens/tests/binary_only_language.rs"
      - "crates/sens/tests/sens_semantic_witnesses.rs"
      - "tests/semantic/meta-eval-mutual-d4-law.bits"
      - "tests/semantic/yantra-d4-bind-law.bits"
      - "tests/semantic/yantra-d4-bind-mutant.bits"
      - "lib/yantra.lisp"
      - "tests/semantic/x86-encoder-let-d4-law.bits"
      - "tests/semantic/x86-encoder-let-d4-mutant.bits"
      - "lib/machine/encoding/x86-64.lisp"
      - "lib/meta-eval-mutual.lisp"
      - "crates/sens/src/canonical_reader.rs"
      - "crates/sens/src/domain_identity.rs"
      - "crates/sens/src/eval/**"
      - "crates/sens/src/source_words.rs"
      - "crates/sens/src/ternary_transport.rs"
      - ".github/workflows/binary-only-language.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-binary-program:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Execute code written only in bits
        run: cargo test --locked -p sens --test binary_only_language -- --nocapture
      - name: Двійковий SENS перевіряє прямий D4 LAMBDA та вкладені зв’язування
        run: cargo test --locked -p sens --test sens_semantic_witnesses meta_eval_mutual_d4_exact_sens_self_verdict -- --nocapture
      - name: Бінарний SENS перевіряє x86 LAMBDA та однобітний мутант
        run: cargo test --locked -p sens --test sens_semantic_witnesses x86_encoding_let_to_exact_d4_binary_sens_verdict -- --nocapture
      - name: Двійковий SENS доводить зв’язування Yantra D4 і відхиляє однобітний мутант
        run: cargo test --locked -p sens --test sens_semantic_witnesses yantra_d4_binary_self_verdict_and_one_bit_negative -- --nocapture
