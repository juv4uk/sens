name: Independent root-domain automorphism

on:
  pull_request:
    paths:
      - "benchmarks/root-domain-automorphism/**"
      - "benchmarks/post-d4-root-min-closeout/**"
      - "benchmarks/d5-structural-discovery/factor-graph.json"
      - ".github/workflows/root-domain-automorphism.yml"
  push:
    branches: [main]
    paths:
      - "benchmarks/root-domain-automorphism/**"
      - ".github/workflows/root-domain-automorphism.yml"
  workflow_dispatch:

jobs:
  automorphism:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Run root-domain automorphism falsifier
        run: |
          rm -rf /tmp/root-domain-automorphism
          python3 benchmarks/root-domain-automorphism/run.py --out /tmp/root-domain-automorphism
      - name: Publish report
        if: always()
        run: |
          if test -f /tmp/root-domain-automorphism/report.md; then
            cat /tmp/root-domain-automorphism/report.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: root-domain-automorphism
          path: /tmp/root-domain-automorphism/
          retention-days: 14
