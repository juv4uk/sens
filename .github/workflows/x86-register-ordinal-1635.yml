name: X86 register ordinal migration witness

on:
  pull_request:
    paths:
      - "lib/machine/encoding/x86-64.lisp"
      - "crates/sens/tests/x86_64_lisp_encoder.rs"
      - ".github/workflows/x86-register-ordinal-1635.yml"

jobs:
  register-ordinals:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: x86-register-ordinal-1635
      - name: Exact register ordinal witness
        run: cargo test -p sens --test x86_64_lisp_encoder register_ordinals_10_and_11_preserve_decimal_values -- --exact
