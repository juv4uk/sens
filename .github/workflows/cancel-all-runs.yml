name: Скасувати всі попередні прогони

# Власник: «запусти коміт пуш який відмінить всі попередні актіон».
#
# Пуш у main запускає цей воркфлоу, і він скасовує ВСІ активні прогони
# (in_progress / queued / pending), крім себе.
#
# Навіщо: при темпі ~670 комітів на добу черга актіонів стає шумом —
# 5 прогонів на одну правку, жоден не доказ. Один пуш очищає дошку.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: cancel-all-runs
  cancel-in-progress: true

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Скасувати всі активні прогони, крім цього
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SELF: ${{ github.run_id }}
        run: |
          set -uo pipefail
          ids="$(gh run list --repo "$REPO" --limit 300 \
                 --json databaseId,status \
                 --jq '.[] | select(.status=="in_progress" or .status=="queued" or .status=="pending" or .status=="waiting" or .status=="requested") | .databaseId')"
          total=0; done_n=0; fail_n=0
          for id in $ids; do
            if [ "$id" = "$SELF" ]; then continue; fi
            total=$((total+1))
            if gh run cancel "$id" --repo "$REPO" >/dev/null 2>&1; then
              done_n=$((done_n+1))
            else
              fail_n=$((fail_n+1))
            fi
          done
          echo "CANCEL_ALL_RUNS cancelled=$done_n failed=$fail_n candidates=$total self=$SELF"
