name: Physical binary SENS CLI smoke

# An immutable result per push SHA. Never cancel an older physical-binary
# witness just because other agents advance main.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  physical-binary-cli:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable

      - name: Build exact binary execution and transport tools
        run: cargo build --locked -p sens-cli --bin sens --bin sens-trit

      - name: Physical source words and pure execution agree across both entrypoints
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sens-binary"
          for file in \
            tests/fixtures/migration-quote-cohort-main/quote-legacy.sens \
            tests/fixtures/migration-multiform-cohort-main/two-forms.sens; do
            stem="${file##*/}"
            target/debug/sens "$file" > "$RUNNER_TEMP/sens-binary/${stem}.sens-exec"
            target/debug/sens-trit eval "$file" > "$RUNNER_TEMP/sens-binary/${stem}.trit-exec"
            cmp "$RUNNER_TEMP/sens-binary/${stem}.sens-exec" \
                "$RUNNER_TEMP/sens-binary/${stem}.trit-exec"
            target/debug/sens-trit open "$file" > "$RUNNER_TEMP/sens-binary/${stem}.words"
            python3 - "$file" "$RUNNER_TEMP/sens-binary/${stem}.words" <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, "scripts")
          from sens_t5_codec import decode_bytes
          original = Path(sys.argv[1]).read_bytes()
          visible = Path(sys.argv[2]).read_text(encoding="ascii")
          assert visible == " ".join(decode_bytes(original)) + chr(10)
          assert set(visible) <= {"0", "1", " ", chr(10)}
          print("PHYSICAL=T5, TEXT=PROJECTION, PURE_EXEC=PARITY")
          PY
          done

      - name: Corrupted transport and D2 grammar fail closed before execution
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sens-binary"
          python3 - "$RUNNER_TEMP/sens-binary" <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, "scripts")
          from sens_t5_codec import encode_projection
          root = Path(sys.argv[1])
          (root / "illegal-base3.sens").write_bytes(bytes([243]))
          (root / "stray-close.sens").write_bytes(encode_projection("01"))
          PY
          for invalid in illegal-base3 stray-close; do
            file="$RUNNER_TEMP/sens-binary/${invalid}.sens"
            if target/debug/sens "$file" \
                > "$RUNNER_TEMP/sens-binary/${invalid}.stdout" \
                2> "$RUNNER_TEMP/sens-binary/${invalid}.stderr"; then
              echo "ERROR: invalid physical binary program executed: $invalid" >&2
              exit 1
            fi
            test ! -s "$RUNNER_TEMP/sens-binary/${invalid}.stdout"
            grep -q 'physical T5/D2 rejected' "$RUNNER_TEMP/sens-binary/${invalid}.stderr"
          done

      - name: Immutable per-commit transport and execution evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sens-binary"
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/sens-binary/commit.sha"
          sha256sum \
            crates/sens-cli/src/main.rs \
            crates/sens-cli/src/bin/sens-trit.rs \
            crates/sens/src/canonical_reader.rs \
            tests/fixtures/migration-quote-cohort-main/quote-legacy.sens \
            tests/fixtures/migration-multiform-cohort-main/two-forms.sens \
            > "$RUNNER_TEMP/sens-binary/sources.sha256"
          find "$RUNNER_TEMP/sens-binary" -maxdepth 1 -name '*.words' -o -name '*.sens-exec' -o -name '*.trit-exec' \
            | sort | xargs -r sha256sum > "$RUNNER_TEMP/sens-binary/observations.sha256"

      - name: Keep the evidence on red as well as green
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: physical-binary-sens-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sens-binary/
          if-no-files-found: warn
