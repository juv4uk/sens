name: Physical binary SENS CLI smoke

# An immutable result per push SHA. Never cancel an older physical-binary
# witness just because other agents advance main.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  physical-binary-cli:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable

      - name: Build exact binary execution and transport tools
        run: cargo build --locked -p sens-cli --bin sens --bin sens-trit

      - name: Physical source words and pure execution agree across both entrypoints
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sens-binary"
          for file in \
            tests/fixtures/migration-quote-cohort-main/quote-legacy.sens \
            tests/fixtures/migration-multiform-cohort-main/two-forms.sens; do
            stem="${file##*/}"
            target/debug/sens "$file" > "$RUNNER_TEMP/sens-binary/${stem}.sens-exec"
            target/debug/sens-trit eval "$file" > "$RUNNER_TEMP/sens-binary/${stem}.trit-exec"
            cmp "$RUNNER_TEMP/sens-binary/${stem}.sens-exec" \
                "$RUNNER_TEMP/sens-binary/${stem}.trit-exec"
            target/debug/sens-trit open "$file" > "$RUNNER_TEMP/sens-binary/${stem}.words"
            python3 - "$file" "$RUNNER_TEMP/sens-binary/${stem}.words" <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, "scripts")
          from sens_t5_codec import decode_bytes
          original = Path(sys.argv[1]).read_bytes()
          visible = Path(sys.argv[2]).read_text(encoding="ascii")
          assert visible == " ".join(decode_bytes(original)) + chr(10)
          assert set(visible) <= {"0", "1", " ", chr(10)}
          print("PHYSICAL=T5, TEXT=PROJECTION, PURE_EXEC=PARITY")
          PY
          done

      - name: Execute pure-binary D3 primitives through both CLI entrypoints
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sens-binary"
          python3 - "$RUNNER_TEMP/sens-binary/d3-primitives.sens" <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, "scripts")
          from sens_t5_codec import encode_projection

          source_path = Path("examples/binary/d3-primitives-program.bits")
          source = " ".join(source_path.read_text(encoding="ascii").split())
          assert source and set(source) <= {"0", "1", " "}
          Path(sys.argv[1]).write_bytes(encode_projection(source))
          PY
          target/debug/sens "$RUNNER_TEMP/sens-binary/d3-primitives.sens" \
            > "$RUNNER_TEMP/sens-binary/d3-primitives.sens-exec"
          target/debug/sens-trit eval "$RUNNER_TEMP/sens-binary/d3-primitives.sens" \
            > "$RUNNER_TEMP/sens-binary/d3-primitives.trit-exec"
          cmp "$RUNNER_TEMP/sens-binary/d3-primitives.sens-exec" \
              "$RUNNER_TEMP/sens-binary/d3-primitives.trit-exec"
          target/debug/sens-trit open "$RUNNER_TEMP/sens-binary/d3-primitives.sens" \
            > "$RUNNER_TEMP/sens-binary/d3-primitives.words"
          python3 - "$RUNNER_TEMP/sens-binary/d3-primitives.words" <<'PY'
          import sys
          from pathlib import Path

          source = " ".join(Path("examples/binary/d3-primitives-program.bits").read_text(encoding="ascii").split())
          visible = Path(sys.argv[1]).read_text(encoding="ascii")
          assert visible == source + chr(10), "T5 physical bytes changed exact-width D3 words"
          assert set(visible) <= {"0", "1", " ", chr(10)}
          print("PHYSICAL=T5, D3_PRIMITIVES=PURE_EXEC_PARITY")
          PY

      - name: Execute D5 LABEL recursion from D7 bit names
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sens-binary"
          python3 - "$RUNNER_TEMP/sens-binary/d5-label-recursion.sens" <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, "scripts")
          from sens_t5_codec import encode_projection

          source_path = Path("examples/binary/d5-label-recursion.bits")
          source = " ".join(source_path.read_text(encoding="ascii").split())
          assert source and set(source) <= {"0", "1", " "}
          Path(sys.argv[1]).write_bytes(encode_projection(source))
          PY
          target/debug/sens "$RUNNER_TEMP/sens-binary/d5-label-recursion.sens" \
            > "$RUNNER_TEMP/sens-binary/d5-label-recursion.sens-exec"
          target/debug/sens-trit eval "$RUNNER_TEMP/sens-binary/d5-label-recursion.sens" \
            > "$RUNNER_TEMP/sens-binary/d5-label-recursion.trit-exec"
          cmp "$RUNNER_TEMP/sens-binary/d5-label-recursion.sens-exec" \
              "$RUNNER_TEMP/sens-binary/d5-label-recursion.trit-exec"
          test -s "$RUNNER_TEMP/sens-binary/d5-label-recursion.sens-exec"
          target/debug/sens-trit open "$RUNNER_TEMP/sens-binary/d5-label-recursion.sens" \
            > "$RUNNER_TEMP/sens-binary/d5-label-recursion.words"
          python3 - "$RUNNER_TEMP/sens-binary/d5-label-recursion.words" <<'PY'
          import sys
          from pathlib import Path

          source = " ".join(Path("examples/binary/d5-label-recursion.bits").read_text(encoding="ascii").split())
          visible = Path(sys.argv[1]).read_text(encoding="ascii")
          assert visible == source + chr(10), "physical T5 changed D5/D7 source words"
          assert set(visible) <= {"0", "1", " ", chr(10)}
          print("PHYSICAL=T5, D5_LABEL=D7_RECURSION, PURE_EXEC=PARITY")
          PY

      - name: Corrupted transport and D2 grammar fail closed before execution
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sens-binary"
          python3 - "$RUNNER_TEMP/sens-binary" <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, "scripts")
          from sens_t5_codec import encode_projection
          root = Path(sys.argv[1])
          (root / "illegal-base3.sens").write_bytes(bytes([243]))
          (root / "stray-close.sens").write_bytes(encode_projection("01"))
          PY
          for invalid in illegal-base3 stray-close; do
            file="$RUNNER_TEMP/sens-binary/${invalid}.sens"
            if target/debug/sens "$file" \
                > "$RUNNER_TEMP/sens-binary/${invalid}.stdout" \
                2> "$RUNNER_TEMP/sens-binary/${invalid}.stderr"; then
              echo "ERROR: invalid physical binary program executed: $invalid" >&2
              exit 1
            fi
            test ! -s "$RUNNER_TEMP/sens-binary/${invalid}.stdout"
            case "$invalid" in
              illegal-base3)
                grep -q 'physical T5 transport rejected' "$RUNNER_TEMP/sens-binary/${invalid}.stderr"
                ;;
              stray-close)
                grep -q 'exact packed binary reader rejected' "$RUNNER_TEMP/sens-binary/${invalid}.stderr"
                ;;
              *)
                echo "ERROR: unclassified negative fixture: $invalid" >&2
                exit 1
                ;;
            esac
          done

      - name: Human Lisp text can never impersonate physical .sens
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sens-binary"
          printf '%s\n' '(quote ())' > "$RUNNER_TEMP/sens-binary/human-lisp.sens"
          if target/debug/sens "$RUNNER_TEMP/sens-binary/human-lisp.sens" \
              > "$RUNNER_TEMP/sens-binary/human-lisp.stdout" \
              2> "$RUNNER_TEMP/sens-binary/human-lisp.stderr"; then
            echo "ERROR: executable textual Lisp passed as packed binary T5" >&2
            exit 1
          fi
          test ! -s "$RUNNER_TEMP/sens-binary/human-lisp.stdout"
          grep -Eq 'physical T5|exact binary reader|current SENS execution' \
            "$RUNNER_TEMP/sens-binary/human-lisp.stderr"
          if target/debug/sens --core=4 tests/fixtures/migration-quote-cohort-main/quote-legacy.sens \
              > "$RUNNER_TEMP/sens-binary/forbidden-core4.stdout" \
              2> "$RUNNER_TEMP/sens-binary/forbidden-core4.stderr"; then
            echo "ERROR: physical T5 silently inherited Core4" >&2
            exit 1
          fi
          test ! -s "$RUNNER_TEMP/sens-binary/forbidden-core4.stdout"

      - name: Immutable per-commit transport and execution evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sens-binary"
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/sens-binary/commit.sha"
          sha256sum \
            crates/sens-cli/src/main.rs \
            crates/sens-cli/src/bin/sens-trit.rs \
            crates/sens/src/canonical_reader.rs \
            tests/fixtures/migration-quote-cohort-main/quote-legacy.sens \
            tests/fixtures/migration-multiform-cohort-main/two-forms.sens \
            examples/binary/d3-primitives-program.bits \
            examples/binary/d3-cond-program.bits \
            examples/binary/d5-label-recursion.bits \
            > "$RUNNER_TEMP/sens-binary/sources.sha256"
          find "$RUNNER_TEMP/sens-binary" -maxdepth 1 -name '*.words' -o -name '*.sens-exec' -o -name '*.trit-exec' \
            | sort | xargs -r sha256sum > "$RUNNER_TEMP/sens-binary/observations.sha256"

      - name: Keep the evidence on red as well as green
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: physical-binary-sens-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sens-binary/
          if-no-files-found: warn
