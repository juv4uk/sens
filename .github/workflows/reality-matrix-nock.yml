name: Reality Matrix Nock artifact smoke

on:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  nock-artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Nock artifact witness
        run: |
          echo "FOREIGN_LANGUAGE_TEST_OR_BENCH=EXCLUDED_BY_POLICY native_equivalent=NOT_VERIFIED"

      - name: Revalidate machine-readable output
        run: |
          echo "FOREIGN_LANGUAGE_TEST_OR_BENCH=EXCLUDED_BY_POLICY native_equivalent=NOT_VERIFIED"
          test -s "$RUNNER_TEMP/reality-nock/raw/artifact.tsv"
          test -s "$RUNNER_TEMP/reality-nock/report.md"

      - name: Upload artifact evidence
        uses: actions/upload-artifact@v4
        with:
          name: reality-matrix-nock-artifact
          path: |
            ${{ runner.temp }}/reality-nock/comparison.json
            ${{ runner.temp }}/reality-nock/environment.json
            ${{ runner.temp }}/reality-nock/raw/artifact.tsv
            ${{ runner.temp }}/reality-nock/report.md
