name: Reality Matrix Nock artifact smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "benchmarks/cross-language/reality-matrix/**"
      - "benchmarks/current-en-vs-d1d8/**"
      - "benchmarks/store-air-load/**"
      - "crates/sens/**"
      - "language-contract.lisp"
      - ".github/workflows/reality-matrix-nock.yml"

permissions:
  contents: read

jobs:
  nock-artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Nock artifact witness
        run: |
          python3 benchmarks/cross-language/reality-matrix/nock/run.py             --out-dir "$RUNNER_TEMP/reality-nock"

      - name: Revalidate machine-readable output
        run: |
          python3 benchmarks/cross-language/reality-matrix/validate.py             "$RUNNER_TEMP/reality-nock/comparison.json"
          test -s "$RUNNER_TEMP/reality-nock/raw/artifact.tsv"
          test -s "$RUNNER_TEMP/reality-nock/report.md"

      - name: Upload artifact evidence
        uses: actions/upload-artifact@v4
        with:
          name: reality-matrix-nock-artifact
          path: |
            ${{ runner.temp }}/reality-nock/comparison.json
            ${{ runner.temp }}/reality-nock/environment.json
            ${{ runner.temp }}/reality-nock/raw/artifact.tsv
            ${{ runner.temp }}/reality-nock/report.md
