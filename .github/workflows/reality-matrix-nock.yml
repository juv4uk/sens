name: Reality Matrix Nock artifact smoke

on:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  nock-artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Nock artifact witness — EXCLUDED (NOT_VERIFIED)
        if: false
        shell: bash
        run: echo "FOREIGN_LANGUAGE_TEST_BENCH=EXCLUDED_BY_POLICY native_equivalent=NOT_VERIFIED"
      - name: Revalidate machine-readable output — EXCLUDED (NOT_VERIFIED)
        if: false
        shell: bash
        run: echo "FOREIGN_LANGUAGE_TEST_BENCH=EXCLUDED_BY_POLICY native_equivalent=NOT_VERIFIED"
      - name: Upload artifact evidence
        uses: actions/upload-artifact@v4
        with:
          name: reality-matrix-nock-artifact
          path: |
            ${{ runner.temp }}/reality-nock/comparison.json
            ${{ runner.temp }}/reality-nock/environment.json
            ${{ runner.temp }}/reality-nock/raw/artifact.tsv
            ${{ runner.temp }}/reality-nock/report.md
