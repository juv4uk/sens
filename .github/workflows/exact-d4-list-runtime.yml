name: exact-d4-list-runtime

on:
  pull_request:
    paths:
      - "crates/sens/src/eval/canon.rs"
      - ".github/workflows/exact-d4-list-runtime.yml"
  push:
    branches: [main]
    paths:
      - "crates/sens/src/eval/canon.rs"
      - ".github/workflows/exact-d4-list-runtime.yml"

permissions:
  contents: read

jobs:
  ratified-list:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Exact-width D4 LIST mechanism and negative cross-domain tests
        run: cargo test -p sens --lib exact_d4_list_constructs_proper_values_without_cross_width_fallback -- --nocapture
      - name: Previously-admitted exact D3/D4 root contracts
        run: cargo test -p sens --lib canonical_d3_primitive_route_is_role_aware_not_numeric_projection -- --nocapture
