name: "Міграція ядра — точний D3 без жорсткого SID8"

on:
  push:
    branches: [main]
    paths:
      - "crates/sens/src/semantic_registry.rs"
      - "crates/sens/src/eval/lower.rs"
      - "crates/sens/src/eval/mod.rs"
      - ".github/workflows/core-d3-lowering-cutover.yml"
  pull_request:
    paths:
      - "crates/sens/src/semantic_registry.rs"
      - "crates/sens/src/eval/lower.rs"
      - "crates/sens/src/eval/mod.rs"
      - ".github/workflows/core-d3-lowering-cutover.yml"

permissions:
  contents: read

jobs:
  exact-d3-legacy-bridge:
    name: "D3: ратифіковані QUOTE/COND замість плоского W8"
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: "Дозволяти тільки доведені D3 проєкції"
        run: cargo test --locked -p sens --lib exact_d3_compatibility_migration_tests -- --nocapture
      - name: "Точковий тест: D3/D4 колізія назв і збереження всіх 238 проєкцій"
        run: cargo test --locked -p sens --lib domain_source_projection_anti_collision_tests -- --nocapture
      - name: "Точний D3 у компіляторному знижувачі"
        run: cargo test --locked -p sens --lib domain_ladder_lowering_migration_tests -- --nocapture
      - name: "Точні D1–D9 AST без повернення до історичного W8"
        run: cargo test --locked -p sens --lib exact_lowering_isolation_tests -- --nocapture
      - name: "Збереження D3 QUOTE у поточному evaluator"
        run: cargo test --locked -p sens --lib exact_domain_program_tests -- --nocapture
      - name: "Перевірити відсутність змін джерел після тестів"
        shell: bash
        run: |
          test -z "$(git status --porcelain --untracked-files=all)" || {
            git status --short
            exit 1
          }
