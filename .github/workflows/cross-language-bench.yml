name: Cross-language benchmark (SENS vs CPython)

on:
  pull_request:
    paths:
      - "benchmarks/cross-language/**"
      - "benchmarks/sens-surface/run.py"
      - "crates/sens/examples/ci_bench.rs"
      - ".github/workflows/cross-language-bench.yml"
  workflow_dispatch:

jobs:
  cpython:
    runs-on: [self-hosted, guix]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: cross-language-bench

      - name: Build SENS benchmark binary
        run: cargo build --release -p sens --example ci_bench

      - name: Correctness and measurements in pinned Guix environment
        run: |
          rm -rf /tmp/sens-cross-language
          guix time-machine -C channels.scm -- shell \
            -m manifest.scm \
            -m benchmarks/cross-language/manifest.scm -- \
            python3 benchmarks/cross-language/run.py \
              --sens-bench target/release/examples/ci_bench \
              --reps 3 \
              --out /tmp/sens-cross-language

      - name: Publish report in job summary
        if: always()
        run: |
          if test -f /tmp/sens-cross-language/report.md; then
            cat /tmp/sens-cross-language/report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sens-vs-cpython-benchmark
          path: /tmp/sens-cross-language
