name: D5 fill watch

on:
  pull_request:
    paths:
      - "scripts/research-2724-d5-fill-watch.py"
      - "benchmarks/d5-closure-map/run.py"
      - "knowledge/d5-historical-full-map.json"
      - "knowledge/d5-d6-semantic-ledger.json"
      - "knowledge/repo-tooling-inventory.lisp"
      - ".github/workflows/d5-fill-watch.yml"
  push:
    branches:
      - main
    paths:
      - "scripts/research-2724-d5-fill-watch.py"
      - "benchmarks/d5-closure-map/run.py"
      - "knowledge/d5-historical-full-map.json"
      - "knowledge/d5-d6-semantic-ledger.json"
      - "knowledge/repo-tooling-inventory.lisp"
      - ".github/workflows/d5-fill-watch.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  watch:
    name: D5 OD-005 owner-map remap watch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Run D5 owner-map watchdog
        run: |
          python3 scripts/research-2724-d5-fill-watch.py --out d5-fill-watch-out
          cat d5-fill-watch-out/d5-fill-watch.json

      - name: Publish summary
        if: always()
        run: |
          {
            echo "## D5 owner-map watch"
            echo
            echo "OD-005 current occupancy is 32/32 with UNKNOWN=0."
            echo
            echo "Eight selector residents remain generator-backed; twenty-four are owner-historical placements."
            echo
            echo "The watch now detects unauthorized coordinate/name/parent remaps rather than searching for free occupants."
            echo
            echo "Semantic derivability remains a separate #2765 axis."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload watch result
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: d5-fill-watch
          path: d5-fill-watch-out/
