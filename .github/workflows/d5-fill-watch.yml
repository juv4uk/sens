name: D5 fill watch pre-OD005 snapshot

on:
  pull_request:
    paths:
      - "scripts/research-2724-d5-fill-watch.py"
      - "benchmarks/d5-closure-map/run.py"
      - "benchmarks/d5-sens-derivation-closeout/factor-eligibility.json"
      - "benchmarks/post-d4-root-min-closeout/run.py"
      - "docs/research/2344-post-d4-historical-ledger.json"
      - "benchmarks/post-d4-semantic-placement/placement.json"
      - "knowledge/repo-tooling-inventory.lisp"
      - ".github/workflows/d5-fill-watch.yml"
  push:
    branches:
      - main
    paths:
      - "scripts/research-2724-d5-fill-watch.py"
      - "benchmarks/d5-closure-map/run.py"
      - "benchmarks/d5-sens-derivation-closeout/factor-eligibility.json"
      - "benchmarks/post-d4-root-min-closeout/run.py"
      - "docs/research/2344-post-d4-historical-ledger.json"
      - "benchmarks/post-d4-semantic-placement/placement.json"
      - "knowledge/repo-tooling-inventory.lisp"
      - ".github/workflows/d5-fill-watch.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  watch:
    name: D5 semantic-family fill watch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Run D5 fill watchdog
        run: |
          python3 scripts/research-2724-d5-fill-watch.py --out d5-fill-watch-out
          cat d5-fill-watch-out/d5-fill-watch.json

      - name: Publish summary
        if: always()
        run: |
          {
            echo "## D5 fill watch"
            echo
            echo "The guard watches semantic evidence, not free coordinates."
            echo
            echo "HISTORICAL-PRE-OD005 snapshot: 8 generated selector residents / 24 protected UNKNOWN / 0 manual / 0 new candidates."
            echo "Current D5 occupancy authority is OD-005/#2750 full 32/32; this workflow must not veto it."
            echo
            echo "Any future D5-eligible YES or historical row without semantic placement turns this lane into REVIEW-REQUIRED."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload watch result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d5-fill-watch
          path: d5-fill-watch-out/
