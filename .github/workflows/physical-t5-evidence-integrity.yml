name: Physical T5 evidence integrity (excluded)

on:
  workflow_dispatch:

permissions:
  contents: read

# Owner policy: executable tests and benchmarks use only Rust, Zig, SENS,
# Guile, C, or Assembler. The former CPython transport benchmark is not
# evidence of native SENS execution and is deliberately quarantined.
jobs:
  excluded:
    if: false
    runs-on: ubuntu-24.04
    steps:
      - name: Excluded Python test and benchmark path — not a pass
        run: echo "PYTHON_TEST_BENCHMARKS=EXCLUDED native_equivalent=NOT_VERIFIED"
