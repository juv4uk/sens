name: LISP 1.5 Appendix A archival provenance guard
on:
  pull_request:
    paths:
      - 'knowledge/lisp15-appendix-a-provenance-v1.json'
      - 'knowledge/d1-d9-foundation.json'
      - 'knowledge/d8-ratified.json'
      - 'knowledge/d10-v1-semantic-inventory.json'
      - 'scripts/check-lisp15-appendix-provenance.py'
      - '.github/workflows/lisp15-appendix-provenance.yml'
  workflow_dispatch:
jobs:
  archival-provenance-only:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - name: Verify 30 families, current dedup and fail-closed negative controls
        run: python3 scripts/check-lisp15-appendix-provenance.py --self-test
      - name: Guard current D1-D9/D8/D10 authority from accidental edits
        run: git diff --exit-code -- knowledge/d1-d9-foundation.json knowledge/d8-ratified.json knowledge/d10-v1-semantic-inventory.json lib/domains/d8.lisp
