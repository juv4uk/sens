name: D10 recovery v1

on:
  pull_request:
    paths:
      - "knowledge/d10-recovery-v1.json"
      - "knowledge/d10-v1-semantic-inventory.json"
      - "knowledge/d10-fill-v1-state.json"
      - "knowledge/d9-ratified.json"
      - "knowledge/d1-d9-foundation.json"
      - "scripts/check-d10-recovery-v1.py"
      - "scripts/check-d10-v1-semantic-inventory.py"
      - "scripts/check-d10-fill-v1-seed.py"
      - ".github/workflows/d10-recovery-v1.yml"
  push:
    branches: [main]
    paths:
      - "knowledge/d10-recovery-v1.json"
      - "knowledge/d10-v1-semantic-inventory.json"
      - "knowledge/d10-fill-v1-state.json"
      - "scripts/check-d10-recovery-v1.py"
      - "scripts/check-d10-v1-semantic-inventory.py"
      - ".github/workflows/d10-recovery-v1.yml"
  workflow_dispatch:

jobs:
  recovery:
    runs-on: [self-hosted, Linux, X64, gpu, gtx-1050-ti, cuda-12.6]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: GPU runner identity
        run: nvidia-smi || true
      - name: Verify selector seed is preserved
        run: python3 scripts/check-d10-fill-v1-seed.py
      - name: Verify global D10 semantic inventory
        run: python3 scripts/check-d10-v1-semantic-inventory.py
      - name: Verify first D10 recovery tranche
        run: python3 scripts/check-d10-recovery-v1.py
