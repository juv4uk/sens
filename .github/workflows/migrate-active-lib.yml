name: Міграція активних lib-файлів (точні домени)

# Runs the CANONICAL converter (sens-to-sens) over the active authored lib —
# the same tool the completion gate uses — and uploads the rewritten files.
# It does NOT commit; it only produces the migration for review.

on:
  workflow_dispatch:
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/install-zig
      - uses: dtolnay/rust-toolchain@stable

      - name: Build canonical converter
        run: cargo build -p sens-cli --bin sens-to-sens

      # Invoke via `bash` so the script does not need the executable bit
      # (the GitHub contents API commits files as 100644).
      - name: Перевірити наявні заміни (звіт, без допуску)
        id: scan
        continue-on-error: true
        run: bash scripts/migrate-active-lib-exact.sh --check

      - name: Перенести код і перевірити споживачів один раз
        id: apply
        continue-on-error: true
        run: bash scripts/migrate-active-lib-exact.sh --apply

      - name: Collect changed files
        run: |
          git add -A
          git --no-pager diff --cached --stat
          git --no-pager diff --cached --name-only > /tmp/changed.txt
          cat /tmp/changed.txt
          if [ -s /tmp/changed.txt ]; then
            tar czf migrated-active-lib.tgz -T /tmp/changed.txt
          else
            echo "no changes" > migrated-active-lib.tgz
          fi

      - name: Зберегти результати міграції навіть при помилці
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migrated-active-lib
          path: migrated-active-lib.tgz
          if-no-files-found: error

      - name: Не приховувати несправну міграцію
        if: always()
        shell: bash
        env:
          APPLY_OUTCOME: ${{ steps.apply.outcome }}
        run: |
          if [ "$APPLY_OUTCOME" != success ]; then
            echo "::error::MIGRATION_INCOMPLETE: виправити причину; файли доступні в артефакті"
            exit 1
          fi
          echo "SOURCE_MIGRATION_OK; фізична T5M та семантична оберненість = UNVERIFIED"
