name: Semantic fact ledger research

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Independent semantic fact accounting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Validate ledger and emit summary
        run: |
          python3 scripts/research-2304-semantic-fact-ledger.py \
            --summary-json semantic-fact-summary.json
          cat semantic-fact-summary.json

      - name: Publish summary
        run: |
          {
            echo "## Independent semantic fact accounting"
            echo
            echo "~~~text"
            python3 scripts/research-2304-semantic-fact-ledger.py
            echo "~~~"
            echo
            echo "- UNKNOWN is visible as an upper-bound contribution, never silently zero."
            echo "- Root vs derived is a model role, not a fact kind."
            echo "- Proof/certificate facts are reported separately from semantic facts."
            echo "- Research only: no production allocation."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload raw summary
        uses: actions/upload-artifact@v4
        with:
          name: semantic-fact-ledger-summary
          path: semantic-fact-summary.json
