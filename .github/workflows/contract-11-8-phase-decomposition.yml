name: Contract 11.8 current SENS phase decomposition

on:
  pull_request:
    paths:
      - 'benchmarks/current-en-vs-d1d8/phase_replay.py'
      - 'benchmarks/current-en-vs-d1d8/fixtures/d3-smoke.json'
      - 'crates/sens/examples/current_en_vs_d1d8_cpu.rs'
      - 'crates/sens/examples/startup_bench.rs'
      - 'language-contract.lisp'
      - 'lib/core4.lisp'
      - 'lib/core4.lisp.fasl'
      - '.github/workflows/contract-11-8-phase-decomposition.yml'
  push:
    branches: [main]
    paths:
      - 'benchmarks/current-en-vs-d1d8/phase_replay.py'
      - 'benchmarks/current-en-vs-d1d8/fixtures/d3-smoke.json'
      - 'crates/sens/examples/current_en_vs_d1d8_cpu.rs'
      - 'crates/sens/examples/startup_bench.rs'
      - 'language-contract.lisp'
      - 'lib/core4.lisp'
      - 'lib/core4.lisp.fasl'
      - '.github/workflows/contract-11-8-phase-decomposition.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contract-11-8-phase-decomposition-${{ github.sha }}
  cancel-in-progress: true

jobs:
  phases:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: contract-11-8-phase-decomposition

      - name: Install Valgrind
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind
          valgrind --version

      - name: Build current helpers
        run: |
          cargo build --release -p sens \
            --example current_en_vs_d1d8_cpu \
            --example startup_bench

      - name: Replay current admitted phases
        run: |
          set -euo pipefail
          python3 benchmarks/current-en-vs-d1d8/phase_replay.py \
            --helper target/release/examples/current_en_vs_d1d8_cpu \
            --startup-helper target/release/examples/startup_bench \
            --manifest benchmarks/current-en-vs-d1d8/fixtures/d3-smoke.json \
            --fasl lib/core4.lisp.fasl \
            --reps 3 \
            --out /tmp/contract-11-8-phase-decomposition.json \
            | tee /tmp/contract-11-8-phase-summary.txt
          cat /tmp/contract-11-8-phase-summary.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Verify generation and parity guards
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          def require(condition, label):
              # `assert` зникає під python -O; свідчення повинно відмовляти завжди.
              if not condition:
                  raise SystemExit(f"Доказ фаз 11.8 відхилено: {label}")

          p = Path('/tmp/contract-11-8-phase-decomposition.json')
          require(p.is_file(), 'відсутній JSON-результат після відтворення')
          d = json.loads(p.read_text())
          require(d['contract_version'] == '11.8', 'версія контракту')
          require(d['semantic_generation'] == 'contract-11-8-exact-d1-d9', 'семантичне покоління')
          require(d['current_foundation'] == 'D1-D9', 'чинний фундамент')
          require(d['measured_current_cases'] == ['d3-quote-empty', 'd3-car-empty'], 'вимірювані випадки')
          require(d['reps'] == 3, 'кількість повторів')
          require(len(d['rows']) == 4, 'кількість свідків')
          for index, row in enumerate(d['rows']):
              require(row['oracle']['legacy_identity_used'] is False, f'рядок {index}: застаріла тотожність')
              require(len(row['oracle']['semantic_identity_digest']) == 64, f'рядок {index}: хеш семантичної тотожності')
              require(row['measurement']['derived']['repeated_slope_i_refs_per_eval'] >= 0, f'рядок {index}: нахил вимірювання')
              require(all(len(samples) == 3 for samples in row['measurement']['raw_i_ref_samples'].values()), f'рядок {index}: первинні вибірки')
              require(all(len(samples) == 3 for samples in row['measurement']['repeated_i_ref_samples'].values()), f'рядок {index}: повторні вибірки')
          require(d['core_bootstrap']['raw_i_refs']['core'] > 0, 'витрати завантаження ядра')
          require(all(len(samples) == 3 for samples in d['core_bootstrap']['raw_i_ref_samples'].values()), 'вибірки завантаження ядра')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: contract-11-8-phase-decomposition
          path: /tmp/contract-11-8-phase-decomposition.json
          if-no-files-found: error
          retention-days: 90
