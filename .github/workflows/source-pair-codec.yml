name: Source pair codec

on:
  pull_request:
    paths:
      - "scripts/domain_word_carrier.py"
      - "scripts/sens_source_pair_codec.py"
      - "scripts/sens-uk-encode.py"
      - "scripts/sens-uk-decode.py"
      - "scripts/migrate-to-sens-codes.py"
      - "tests/test_ukrainian_packed_source_codec.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codec:
    name: packed Ukrainian source codec
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Codec regression
        run: python3 -m unittest tests/test_ukrainian_packed_source_codec.py -v
      - name: Encoder syntax
        run: python3 -m py_compile scripts/domain_word_carrier.py scripts/sens_source_pair_codec.py scripts/sens-uk-encode.py scripts/sens-uk-decode.py
