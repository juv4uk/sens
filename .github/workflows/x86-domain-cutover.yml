name: Точнодоменна міграція x86 D4 і D1

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  x86-exact-domain-cutover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: "1"
      RUST_TEST_THREADS: "1"
      RUST_MIN_STACK: "33554432"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/install-zig
      - uses: dtolnay/rust-toolchain@stable
      - name: 28 D4 LAMBDA та точний D1 операндів
        run: cargo test --locked -p sens --test x86_domain_cutover -- --nocapture

      - name: Двійковий SENS сам перевіряє D1 і мутацію
        run: |
          cargo run --quiet --locked -p sens-cli --bin sens-trit -- encode tests/semantic/x86-lowering-d1-law.bits
          cargo run --quiet --locked -p sens-cli --bin sens-trit -- eval tests/semantic/x86-lowering-d1-law.sens
          cargo run --quiet --locked -p sens-cli --bin sens-trit -- encode tests/semantic/x86-lowering-d1-mutant.bits
          ! cargo run --quiet --locked -p sens-cli --bin sens-trit -- eval tests/semantic/x86-lowering-d1-mutant.sens
