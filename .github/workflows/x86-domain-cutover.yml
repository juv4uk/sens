name: Точнодоменна міграція x86 D4 і D1

on:
  pull_request:
    paths:
      - "lib/machine/atoms/x86-64.lisp"
      - "lib/machine/operands/x86-64.lisp"
      - "crates/sens/tests/x86_domain_cutover.rs"
      - ".github/workflows/x86-domain-cutover.yml"
  push:
    branches: [main]
    paths:
      - "lib/machine/atoms/x86-64.lisp"
      - "lib/machine/operands/x86-64.lisp"
      - "crates/sens/tests/x86_domain_cutover.rs"
      - ".github/workflows/x86-domain-cutover.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  x86-exact-domain-cutover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: "1"
      RUST_TEST_THREADS: "1"
      RUST_MIN_STACK: "33554432"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: 28 D4 LAMBDA та точний D1 операндів
        run: cargo test --locked -p sens --test x86_domain_cutover -- --nocapture
