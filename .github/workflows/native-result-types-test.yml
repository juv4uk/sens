name: Native result domains

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "crates/wsm-native-result-types/**"
      - "crates/wsm-common-lisp-kernel/**"
      - "crates/wsm-prolog-kernel/**"
      - "crates/wsm-clips-kernel/**"
      - "crates/wsm-datalog-kernel/**"
      - ".github/workflows/native-result-types-test.yml"
      - "Cargo.toml"
      - "Cargo.lock"
  push:
    branches: [main]
    paths:
      - "crates/wsm-native-result-types/**"
      - "crates/wsm-common-lisp-kernel/**"
      - "crates/wsm-prolog-kernel/**"
      - "crates/wsm-clips-kernel/**"
      - "crates/wsm-datalog-kernel/**"
      - ".github/workflows/native-result-types-test.yml"
      - "Cargo.toml"
      - "Cargo.lock"

jobs:
  default-artifact:
    runs-on: [self-hosted, guix]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test storage artifact without external runtimes
        run: cargo test -p wsm-native-result-types --no-default-features --lib

  four-real-kernels:
    # SBCL, SWI-Prolog and CLIPS 6.4.2 come from the shared Guix profile of the
    # self-hosted runner (CLIPS via packaging/guix/clips.scm).
    runs-on: [self-hosted, guix]
    env:
      WSM_CLIPS_LIBRARY: /var/guix/profiles/shared/guix-profile/lib/libclips.so
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Show producer runtime versions
        run: |
          sbcl --version
          swipl --version
          readlink -f "$WSM_CLIPS_LIBRARY"
      - name: Preserve four real producer-native domains side by side
        run: cargo test -p wsm-native-result-types --features native-clips --test four_real_kernels -- --nocapture
      - name: LIFE-1 Prolog to Datalog bridge stays alive
        run: cargo test -p wsm-native-result-types --features native-clips --test prolog_datalog_bridge -- --nocapture
      - name: Clippy result-domain artifact
        run: cargo clippy -p wsm-native-result-types --all-targets --features native-clips -- -D warnings
