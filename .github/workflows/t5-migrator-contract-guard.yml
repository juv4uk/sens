name: t5-migrator-contract-guard

on:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  physical-t5-release-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Canonical physical T5 migrator contract (non-text .sens, no-clobber)
        run: python3 -m unittest tests/test_t5m_migrator_contract_guard.py -v