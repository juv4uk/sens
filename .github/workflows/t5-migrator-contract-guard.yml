name: t5-migrator-contract-guard

on:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  physical-t5-release-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Canonical physical T5 migrator contract (non-text .sens, no-clobber) — EXCLUDED (NOT_VERIFIED)
        if: false
        shell: bash
        run: echo "FOREIGN_LANGUAGE_TEST_BENCH=EXCLUDED_BY_POLICY native_equivalent=NOT_VERIFIED"