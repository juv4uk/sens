name: Дослід енергії · паритет і виміри

# Навіщо: агентський sandbox не має компіляторів, тому C/Rust/SENS там не
# перевірити. Раннери GitHub мають gcc і rustc — тут паритет і виміри
# стають справжніми, а не «Python проти Python-еталона».
#
# Запуск: вручну або на push, що змінює корпус/інструменти досліду.

on:
  workflow_dispatch:
  push:
    paths:
      - 'benchmarks/language-energy-study/**'
      - 'benchmarks/measurement-triad/**'
      - '.github/workflows/energy-study.yml'

permissions:
  contents: read

jobs:
  parity-and-measure:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Інструменти
        run: |
          gcc --version | head -1
          python3 --version
          node --version

      - name: Паритет-машина (самоперевірка)
        run: python3 benchmarks/language-energy-study/parity_check.py --selftest

      - name: Зібрати C-реалізації
        run: |
          mkdir -p /tmp/bin
          gcc -O2 -o /tmp/bin/t09 benchmarks/language-energy-study/corpus/c/t09_bitcount.c
          gcc -O2 -o /tmp/bin/t01 benchmarks/language-energy-study/corpus/c/t01_fib.c

      - name: Паритет C проти Python-еталона
        run: |
          python3 benchmarks/language-energy-study/parity_check.py \
            --task T09-bit-operations --run "/tmp/bin/t09"
          python3 benchmarks/language-energy-study/parity_check.py \
            --task T01-symbolic-recursion --run "/tmp/bin/t01"

      - name: Симуляційні тести статистики
        run: python3 benchmarks/measurement-triad/test_verdict_simulation.py

      - name: Чи відтворюється таблиця з сирих даних
        run: python3 benchmarks/language-energy-study/report_table.py --markdown | tail -5

      - name: Чи є RAPL на раннері
        run: |
          if [ -r /sys/class/powercap/intel-rapl:0/energy_uj ]; then
            echo "RAPL_AVAILABLE=yes"; head -1 /sys/class/powercap/intel-rapl:0/energy_uj
          else
            echo "RAPL_AVAILABLE=no — енергія лишається ENERGY_NOT_MEASURED"
          fi

  build-sens:
    # Власник: «мене цікавить щоб ви почати вимірювати нашу мову».
    # VERIFY + MEASURE mint → exact parity → fail-closed wall pairs.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Встановити Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Перевірити Zig ДО збірки
        run: |
          zig version
          echo "ZIG_AVAILABLE=yes"

      - name: Зібрати SENS
        run: |
          cargo --version
          cargo build --release -p sens-cli --bin sens

      - name: Що вміє бінарник
        run: |
          ./target/release/sens --version
          echo "--- SENS збирається на раннері: передумова вимірювання мови виконана ---"

      - name: Закарбувати T01 VERIFY + MEASURE
        run: |
          mkdir -p /tmp/sens-out
          ./target/release/sens --t5m-mint \
            benchmarks/language-energy-study/corpus/sens/t01_fib.lisp \
            /tmp/sens-out/t01_fib.sens
          # Ім'я, яке очікує run_study language=sens:
          ./target/release/sens --t5m-mint \
            benchmarks/language-energy-study/corpus/sens/t01_fib_measure.lisp \
            /tmp/sens-out/t01_measure.sens
          ls -l /tmp/sens-out/

      - name: Паритет SENS T01 VERIFY (n=12)
        run: |
          python3 benchmarks/language-energy-study/parity_check.py \
            --task T01-symbolic-recursion \
            --run "$PWD/target/release/sens /tmp/sens-out/t01_fib.sens"

      - name: Паритет SENS T01 MEASURE (n=24 → 46368)
        run: |
          out=$(./target/release/sens /tmp/sens-out/t01_measure.sens \
            | tr -d '\r' \
            | sed 's/^sens\[укр\]>[[:blank:]]*//' \
            | grep -E '^[0-9]+$' \
            | tail -1)
          expected=$(cd benchmarks/language-energy-study && python3 -c 'from parity_check import ref_T01; print(ref_T01(24))')
          echo "sens_out=$out expected=$expected"
          test -n "$out"
          test "$out" = "$expected"
          echo "SENS_T01_MEASURE_PARITY_OK"

      - name: Парні дані python vs SENS (MEASURE, fail-closed)
        run: |
          export SENS_BIN="$PWD/target/release/sens"
          python3 benchmarks/language-energy-study/run_study.py \
            --tasks T01-symbolic-recursion --measure \
            --languages sens \
            --processes 4 --per-process 2 \
            --out "raw-sens-T01.json"
          python3 -c "import json;d=json.load(open('raw-sens-T01.json'));t=d['tasks']['T01-symbolic-recursion'];assert t['parity']['passed'], t;print('pairs',len(t['pairs']));print('sample_ns',t['pairs'][0]['baseline_ns'],t['pairs'][0]['candidate_ns'])"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: raw-sens
          path: raw-sens-*.json
          if-no-files-found: warn

      - name: Статус енергії на раннері
        run: |
          if [ -r /sys/class/powercap/intel-rapl:0/energy_uj ]; then
            echo "RAPL_AVAILABLE=yes"
          else
            echo "ENERGY_NOT_MEASURED — no RAPL package counter on this runner"
          fi
