# Legacy name retained while replacing destructive publisher.
name: publish-binary-master

on:
  pull_request:
    paths:
      - "scripts/migrate-three-pass.py"
      - "scripts/sens_t5_codec.py"
      - "tests/test_three_pass_migration.py"
      - "tests/test_sens_t5_codec.py"
      - ".github/workflows/publish-binary-master.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  t5-migration-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Test strict T5 and three-pass migration
        run: |
          set -euo pipefail
          python3 -m unittest tests/test_three_pass_migration.py tests/test_sens_t5_codec.py
      - name: Preview new same-name .sens binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sens-migration-out"
          python3 scripts/migrate-three-pass.py . \
            --out "$RUNNER_TEMP/sens-migration-out" \
            --foundation knowledge/d1-d7-foundation.json \
            --domain-surfaces crates/sens/src/domain_surface_registry_generated.rs \
            --semantic-generated crates/sens/src/semantic_registry_generated.rs \
            --semantic-registry crates/sens/src/semantic_registry.rs \
            --necessary-forms crates/sens/src/eval/necessary_forms_generated.rs \
            --historical-map contracts/core1-historical-sid-map.lisp \
            --text7 crates/sens/src/text7_projection_generated.rs \
            --report "$RUNNER_TEMP/sens-migration-report.json" || test "$?" -eq 2
      - name: Verify physical T5 artifacts and report
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=scripts python3 - "$RUNNER_TEMP/sens-migration-out" "$RUNNER_TEMP/sens-migration-report.json" <<'PY'
          import hashlib, json, sys
          from pathlib import Path
          from sens_t5_codec import decode_bytes, typed_sha256
          root=Path(sys.argv[1])
          report=json.loads(Path(sys.argv[2]).read_text(encoding='utf-8'))
          assert report['schema']=='sens-three-pass-t5-migration/v3'
          assert report['file_format']['file_eof']=='physical byte length; no terminal 22'
          physical=[p for p in root.rglob('*') if p.is_file()]
          success={str(x['output']):x for x in report['files'] if x['status']=='written'}
          assert len(success)==len(physical)
          for file in physical:
              rel=str(file.relative_to(root))
              assert file.suffix=='.sens' and rel in success, rel
              data=file.read_bytes()
              words=decode_bytes(data)
              row=success[rel]
              assert hashlib.sha256(data).hexdigest()==row['physical_sha256'], rel
              assert typed_sha256(words)==row['typed_word_sha256'], rel
              assert sum(map(len, words))==row['semantic_bits'], rel
          print('T5_BINARY_VERIFIED',len(physical),'BLOCKED',report['summary']['files_blocked'])
          from collections import Counter
          counts=Counter((x.get('reason','')[:95]) for x in report['files'] if x['status']=='blocked')
          print('BLOCKED_REASONS_TOP',counts.most_common(15))
          for x in [x for x in report['files'] if x['status']=='blocked'][:12]:
              print('BLOCKED_EXAMPLE',x['path'],str(x.get('reason',''))[:120])
          if len(physical) == 0:
              print('WARNING: no admitted .lisp -> .sens files yet; never publish the old master output')

          PY
      - name: Cross-check three-pass T5 bytes with Rust sens-trit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/t5-canary-src" "$RUNNER_TEMP/t5-canary-target" "$RUNNER_TEMP/t5-rust"
          printf '()\n' > "$RUNNER_TEMP/t5-canary-src/empty.lisp"
          python3 scripts/migrate-three-pass.py "$RUNNER_TEMP/t5-canary-src" \
            --out "$RUNNER_TEMP/t5-canary-target" \
            --foundation knowledge/d1-d7-foundation.json \
            --domain-surfaces crates/sens/src/domain_surface_registry_generated.rs \
            --semantic-generated crates/sens/src/semantic_registry_generated.rs \
            --semantic-registry crates/sens/src/semantic_registry.rs \
            --necessary-forms crates/sens/src/eval/necessary_forms_generated.rs \
            --historical-map contracts/core1-historical-sid-map.lisp \
            --text7 crates/sens/src/text7_projection_generated.rs \
            --report "$RUNNER_TEMP/t5-canary-report.json"
          test -f "$RUNNER_TEMP/t5-canary-target/empty.sens"
          printf '000\n' > "$RUNNER_TEMP/t5-rust/empty.lisp"
          cargo run -q -p sens-cli --bin sens-trit -- encode "$RUNNER_TEMP/t5-rust/empty.lisp"
          cmp "$RUNNER_TEMP/t5-canary-target/empty.sens" "$RUNNER_TEMP/t5-rust/empty.sens"
          cargo run -q -p sens-cli --bin sens-trit -- open "$RUNNER_TEMP/t5-canary-target/empty.sens" > "$RUNNER_TEMP/t5-canary-open.txt"
          printf '000\n' > "$RUNNER_TEMP/t5-canary-expected.txt"
          cmp "$RUNNER_TEMP/t5-canary-open.txt" "$RUNNER_TEMP/t5-canary-expected.txt"
      - name: Upload binary migration preview and blocker report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sens-t5-migration-preview
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/sens-migration-out/
            ${{ runner.temp }}/sens-migration-report.json

# Forbidden: git rm all; git push master; extensionless generated sources.
