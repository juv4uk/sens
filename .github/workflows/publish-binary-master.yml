name: publish-binary-master

on:
  push:
    branches:
      - codex/sens-code-migration-tools
    paths:
      - "crates/sens/examples/binary_master_export.rs"
      - "scripts/export-binary-master.sh"
      - "scripts/migrate-to-sens-codes.py"
      - "scripts/audit-sens-name-debt.py"
      - "scripts/migrate-sens-ecosystem.py"
      - "tests/test_sens_code_migration.py"
      - "knowledge/d1-d7-foundation.json"
      - ".github/workflows/publish-binary-master.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: [self-hosted, Linux, X64, gpu, gtx-1050-ti, cuda-12.6]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Prove comments do not affect binary output
        shell: bash
        run: |
          rm -rf /tmp/comment-a /tmp/comment-b /tmp/comment-out-a /tmp/comment-out-b
          mkdir -p /tmp/comment-a /tmp/comment-b
          cat > /tmp/comment-a/sample.lisp <<'EOF'
          ; line comment must disappear
          (car ; inline comment must disappear
            (cons 'cat 'dog))
          #| block comment must disappear |#
          EOF
          cat > /tmp/comment-b/sample.lisp <<'EOF'
          (car (cons 'cat 'dog))
          EOF
          bash scripts/export-binary-master.sh /tmp/comment-a /tmp/comment-out-a
          bash scripts/export-binary-master.sh /tmp/comment-b /tmp/comment-out-b
          cmp /tmp/comment-out-a/sample.lisp.wire.bits /tmp/comment-out-b/sample.lisp.wire.bits

      - name: Export parse-lower-wire binary files
        shell: bash
        run: |
          bash scripts/export-binary-master.sh . /tmp/sens-binary-out

      - name: Validate binary-only output
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, sys
          root = Path("/tmp/sens-binary-out")
          files = [p for p in root.rglob("*") if p.is_file()]
          bad = []
          for p in files:
              text = p.read_text(encoding="ascii")
              if not text.strip() or not re.fullmatch(r"[01\s]+", text):
                  bad.append(str(p.relative_to(root)))
          print(f"validated_binary_files={len(files)}")
          if bad:
              print("REFUSE non-binary output:")
              print("\n".join(bad))
              sys.exit(1)
          if not files:
              print("REFUSE empty export")
              sys.exit(1)
          PY

      - name: Publish binary-only tree to master
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin master
          rm -rf /tmp/sens-master
          git worktree prune
          git worktree add -f --detach /tmp/sens-master origin/master

          cd /tmp/sens-master
          git rm -r --ignore-unmatch . >/dev/null 2>&1 || true
          cp -a /tmp/sens-binary-out/. .

          python3 - <<'PY'
          from pathlib import Path
          import re, sys
          files = []
          bad = []
          for p in Path(".").rglob("*"):
              if not p.is_file() or ".git" in p.parts:
                  continue
              files.append(p)
              try:
                  text = p.read_text(encoding="ascii")
              except UnicodeDecodeError:
                  bad.append(str(p))
                  continue
              if not text.strip() or not re.fullmatch(r"[01\s]+", text):
                  bad.append(str(p))
          print(f"validated_master_files={len(files)}")
          if bad:
              print("REFUSE non-binary files in master candidate:")
              print("\n".join(bad))
              sys.exit(1)
          if not files:
              print("REFUSE empty master candidate")
              sys.exit(1)
          PY

          git add -A
          if git diff --cached --quiet; then
            echo "No binary output changed master."
            exit 0
          fi

          git config user.name "sens-binary-publisher"
          git config user.email "sens-binary-publisher@users.noreply.github.com"
          git commit -m "master: publish parser-lowered SENS wire as binary-only files"
          git push origin HEAD:master
