name: Canonical D2 W7 frame invariance

on:
  pull_request:
    paths:
      - 'crates/sens/src/canonical_reader.rs'
      - 'crates/sens/src/text7.rs'
      - 'crates/sens/tests/canonical_w7_frame_invariance.rs'
      - '.github/workflows/canonical-w7-frame-invariance.yml'
  push:
    branches: [main]
    paths:
      - 'crates/sens/src/canonical_reader.rs'
      - 'crates/sens/src/text7.rs'
      - 'crates/sens/tests/canonical_w7_frame_invariance.rs'
      - '.github/workflows/canonical-w7-frame-invariance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  d2-w7-no-silent-symbol-reinterpretation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Збереження D2/W7 і вичерпний аудит бітності
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p sens --locked --test canonical_w7_frame_invariance -- --nocapture
          cargo test --locked -p sens --lib canonical_reader::tests:: -- --nocapture
      - name: Точне W7 D7-v2 — усі 128 координат
        run: cargo test --locked -p sens --lib text7::tests::d7_v2_ascii_128_exact_coordinates_without_sid8_widening -- --exact
      - name: Фізичні golden-байти та відхилення пошкодженого заповнення
        run: cargo test --locked -p sens --lib text7::tests::d7_v2_ascii_lisp_identifier_golden_and_bad_padding_fail_closed -- --exact
      - name: Відхилення UTF-8 без вибраної клавіатурної проєкції
        run: cargo test --locked -p sens --lib text7::tests::d7_v2_unicode_requires_explicit_non_ascii_keyboard_projection -- --exact
      - name: Зворотна сумісність решти Text7
        run: cargo test --locked -p sens --lib text7::tests:: -- --nocapture
      - name: Explain what the guard proves
        run: |
          echo "D2 list and dotted-pair semantics unchanged; no unratified Text7 binder/source frame admitted."
          echo "Still requires #3910 owner-approved position-aware role, Local(depth,index), and original old/current oracle parity."
