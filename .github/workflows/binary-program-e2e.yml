name: Binary executable T5 end-to-end

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-binary-executable:
    name: physical T5 to D2 D3 D4 D7 runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@1.99.0
      - name: Check D7 ratified source coordinates
        run: python3 scripts/check-d7-current-authority.py
      - name: Execute physical-binary-only program and fail-closed negatives
        run: cargo test --locked -p sens --features rust-t5-reference --test binary_program_e2e --test text7_contextual_binding -- --nocapture
