name: Драбина доменів — власна бітність D1–D10

on:
  pull_request:
    branches: [main]
    paths:
      - "crates/sens/src/domain_ladder.rs"
      - ".github/workflows/domain-ladder-stream-cutover.yml"
  push:
    branches: [main]
    paths:
      - "crates/sens/src/domain_ladder.rs"
      - ".github/workflows/domain-ladder-stream-cutover.yml"

jobs:
  exact-d1-d10-widths:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Компіляція драбини
        run: cargo check --locked -p sens --lib
      - name: Точна ширина D1–D10 та негативні тести
        run: cargo test --locked -p sens --lib domain_ladder::tests::
      - name: Незалежний доказ щільного пакування
        run: cargo test --locked -p sens --lib packed_bits::tests::
