name: Rebuild Core4 FASL on GitHub-hosted Ubuntu

on:
  push:
    branches:
      - fix/core4-fasl-github-hosted-20261009
    paths:
      - .github/workflows/core4-fasl-github-hosted-repair.yml
      - lib/core4.lisp
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: core4-fasl-rebuild-${{ github.ref }}
  cancel-in-progress: false

jobs:
  regenerate:
    # Bot commits must not launch another regeneration cycle.
    if: github.actor != 'github-actions[bot]' && github.ref == 'refs/heads/fix/core4-fasl-github-hosted-20261009'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/core4-fasl-github-hosted-20261009
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Regenerate FASL from exact committed source
        run: |
          set -euo pipefail
          cargo run --quiet -p sens-cli --bin gen-fasl -- lib/core4.lisp lib/core4.lisp.fasl
      - name: Prove committed FASL binds to exact source bytes
        run: cargo test -p sens --test core_fasl_freshness -- --nocapture
      - name: Commit verified binary to repair branch only
        shell: bash
        run: |
          set -euo pipefail
          git add -- lib/core4.lisp.fasl
          if git diff --cached --quiet; then
            echo "FASL is already fresh"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(ci): regenerate exact Core4 FASL on GitHub Ubuntu'
          git push origin HEAD:refs/heads/fix/core4-fasl-github-hosted-20261009
