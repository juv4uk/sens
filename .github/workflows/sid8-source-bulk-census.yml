name: SID8 source-only bulk census

on:
  push:
    branches: [main]
    paths:
      - scripts/migrate-sid8-source-batch.py
      - tests/test_migrate_sid8_source_batch.py
      - .github/workflows/sid8-source-bulk-census.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-existing-lisp:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Regression tests for old-to-domain words and D3 semantic blockers
        run: python3 -m unittest discover -s tests -p test_migrate_sid8_source_batch.py -v
      - name: Inspect all live original Lisp files without changing any file
        run: |
          python3 scripts/migrate-sid8-source-batch.py --report "$RUNNER_TEMP/sid8-source-batch-report.json"
          python3 - "$RUNNER_TEMP/sid8-source-batch-report.json" <<'PY'
          import json
          import sys
          x = json.load(open(sys.argv[1]))
          print(json.dumps(x["summary"], ensure_ascii=False))
          for row in x["files"]:
              if row["status"] == "admitted":
                  print("ADMITTED-SOURCE", row["path"], row["potential_heads"])
              elif row["status"] == "blocked":
                  print("BLOCKED-SOURCE", row["path"], row["reasons"][:3])
          assert x["summary"]["scanned"] >= 20
          assert x["summary"]["write"] is False
          PY
      - name: Upload source-only ready/blocker inventory
        uses: actions/upload-artifact@v4
        with:
          name: sid8-source-bulk-census
          retention-days: 7
          if-no-files-found: error
          path: ${{ runner.temp }}/sid8-source-batch-report.json
