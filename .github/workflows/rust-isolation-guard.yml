name: Rust isolation guard (RED until isolation is done)

# Owner rule (2026-10-15): Rust has the bits ISOLATED from the whole project and
# must reach out ONLY to Zig (the sterile corridor). This workflow runs the
# fail-closed guard scripts/check_rust_isolated_only_zig.py.
#
# It is RED on purpose. Red is red -- it is NOT to be greenwashed. It turns green
# only when Rust stops include_str!/fs::read-ing project sources (lib/,
# language-contract, contracts/, knowledge/) and reaches them only via the Zig
# corridor. The guard's own negative controls stay green regardless.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  rust-isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The honest signal: RED while Rust is not isolated (see the guard's I1-I3).
      - name: Rust isolation guard (expected RED until isolation is done)
        run: python3 scripts/check_rust_isolated_only_zig.py

      # The guard's controls must stay green: the rule itself is sound.
      - name: Guard controls
        if: always()
        run: python3 -m unittest discover -s tests -p test_check_rust_isolated_only_zig.py
