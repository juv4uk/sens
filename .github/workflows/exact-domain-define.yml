name: exact-domain-define

on:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Exact-domain DEFINE acceptance
        run: cargo test -p sens --test exact_domain_define_current_main -- --nocapture
