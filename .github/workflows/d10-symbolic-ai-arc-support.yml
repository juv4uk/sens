name: D10 symbolic AI CLP support witnesses

on:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  genuine-clp-donor:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Mathematical 32768 finite-relationship cases and research-only status — EXCLUDED (NOT_VERIFIED)
        if: false
        shell: bash
        run: echo "FOREIGN_LANGUAGE_TEST_BENCH=EXCLUDED_BY_POLICY native_equivalent=NOT_VERIFIED"
      - name: Install real SWI-Prolog CLP(FD)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq swi-prolog-nox
          swipl --version
      - name: Generate deterministic independent language oracle cases — EXCLUDED (NOT_VERIFIED)
        if: false
        shell: bash
        run: echo "FOREIGN_LANGUAGE_TEST_BENCH=EXCLUDED_BY_POLICY native_equivalent=NOT_VERIFIED"
      - name: Run real tuples_in/2 and labeling/2 donor
        run: |
          swipl -q -s tests/oracles/d10_clpfd_arc_support.pl -- /tmp/d10-arc-cases.json /tmp/d10-arc-observed.json
      - name: Verify exact Python vs Prolog outcomes on the same 768 cases — EXCLUDED (NOT_VERIFIED)
        if: false
        shell: bash
        run: echo "FOREIGN_LANGUAGE_TEST_BENCH=EXCLUDED_BY_POLICY native_equivalent=NOT_VERIFIED"