name: migration pair physical T5 oracle

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-pair-oracle:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify Ukrainian pair-cons source, canonical T5 view and no-clobber
        run: python3 -m unittest discover -s tests -p test_migration_pair_cons_uk_triplet.py -v
      - name: Exact CAR/CDR/CONS packed T5 decode plus real evaluator parity
        run: cargo test -p sens --features rust-t5-reference --test migration_pair_car_cdr_cons_main -- --nocapture
