name: contest-promote

# Просування переможців конкурсу в рантайм: активним стає найменший T5M на
# задачу, старші варіанти переїжджають у superseded/ (поза glob рантайму).
# Просування змінює main і не має самовільно запускати другого
# автоматичного writer: лише центральний ci.yml має push-тригер.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: contest-promote-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Ручний dispatch може вибрати гілку/тег; writer до main виконується
  # тільки з HEAD main. Інакше rebase переніс би чужу історію у main.
  promote:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, pinned
      - uses: ./.github/actions/install-zig
      - uses: dtolnay/rust-toolchain@1.99.0

      - name: Build SENS binaries with benchmark metrics
        run: cargo build --locked -p sens-cli --bin sens --bin sens-trit --features benchmark-ast-visits

      - name: Promote winners and exclude superseded
        run: bash benchmarks/contest-uk/promote.sh

      - name: Commit promoted runtime set
        run: |
          set -euo pipefail
          git config user.name "sens-contest-bot"
          git config user.email "sens-contest-bot@users.noreply.github.com"
          git add -A benchmarks/contest-uk
          if git diff --cached --quiet; then
            echo "CONTEST_PROMOTE_NOCHANGE"
            exit 0
          fi
          git commit -m "конкурс: просунути переможців у рантайм, виключити старі варіанти (superseded/)"
          git pull --rebase origin main
          git push origin HEAD:main
