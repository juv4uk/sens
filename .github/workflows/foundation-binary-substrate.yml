name: Foundation binary substrate shadow

on:
  pull_request:
    paths:
      - "scripts/research-2106-binary-substrate.py"
      - "docs/research/2106-binary-substrate*.md"
      - ".github/workflows/foundation-binary-substrate.yml"
  push:
    branches: [main]
    paths:
      - "scripts/research-2106-binary-substrate.py"
      - "docs/research/2106-binary-substrate*.md"
      - ".github/workflows/foundation-binary-substrate.yml"
  workflow_dispatch:

jobs:
  witness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Run Foundation-1 witness
        run: python3 scripts/research-2106-binary-substrate.py
      - name: Перевірити відмову Python -O
        run: |
          set -euo pipefail
          for mode in -O -OO; do
            if python3 "$mode" scripts/research-2106-binary-substrate.py > /tmp/foundation-opt.log 2>&1; then
              echo 'Оптимізований Python хибно пройшов Foundation-1' >&2
              exit 1
            fi
            grep -q 'FOUNDATION-1: BLOCKED' /tmp/foundation-opt.log
            ! grep -q 'PASS' /tmp/foundation-opt.log
          done
          for level in 1 2; do
            if PYTHONOPTIMIZE="$level" python3 scripts/research-2106-binary-substrate.py > /tmp/foundation-opt.log 2>&1; then
              echo 'PYTHONOPTIMIZE хибно пройшов Foundation-1' >&2
              exit 1
            fi
            grep -q 'FOUNDATION-1: BLOCKED' /tmp/foundation-opt.log
            ! grep -q 'PASS' /tmp/foundation-opt.log
          done
      - name: Publish summary
        run: |
          {
            echo '## Foundation−1 binary substrate'
            echo
            echo 'Research-only. No production/contract authority transfer.'
            echo
            echo '```text'
            python3 scripts/research-2106-binary-substrate.py
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"