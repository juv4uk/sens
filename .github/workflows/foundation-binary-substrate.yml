name: Foundation binary substrate shadow

on:
  pull_request:
    paths:
      - "scripts/research-2106-binary-substrate.py"
      - "docs/research/2106-binary-substrate*.md"
      - ".github/workflows/foundation-binary-substrate.yml"
  push:
    branches: [main]
    paths:
      - "scripts/research-2106-binary-substrate.py"
      - "docs/research/2106-binary-substrate*.md"
      - ".github/workflows/foundation-binary-substrate.yml"
  workflow_dispatch:

jobs:
  witness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Run Foundation-1 witness
        run: python3 scripts/research-2106-binary-substrate.py
      - name: Publish summary
        run: |
          {
            echo '## Foundation−1 binary substrate'
            echo
            echo 'Research-only. No production/contract authority transfer.'
            echo
            echo '```text'
            python3 scripts/research-2106-binary-substrate.py
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"