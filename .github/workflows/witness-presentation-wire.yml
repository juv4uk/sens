name: Witness presentation vs numeric wire

on:
  pull_request:
    paths:
      - "tests/fixtures/witness-runner.lisp"
      - "crates/sens/tests/witness_authority.rs"
      - ".github/workflows/witness-presentation-wire.yml"
  workflow_dispatch:

jobs:
  witness-projection:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: witness-presentation-wire

      - name: Meta corpus uses human witness projection
        run: cargo test -p sens --test witness_authority same_committed_corpus_drives_meta_eval_for_rows_admitted_to_that_backend -- --nocapture

      - name: Meta structure rows use the same projection
        run: cargo test -p sens --test witness_authority structure_core_stays_stable_across_native_and_meta_eval -- --nocapture

      - name: Human rational presentation stays unchanged
        run: cargo test -p sens exact_rationals_keep_the_existing_human_representation

      - name: Canonical numeric wire stays tagged binary
        run: cargo test -p sens --test numeric_wire
