name: D5 historical semantic typing guard

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typing:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Validate historical occupancy vs semantic residency
        run: |
          rm -rf /tmp/d5-row-typing
          echo "FOREIGN_LANGUAGE_TEST_OR_BENCH=EXCLUDED_BY_POLICY native_equivalent=NOT_VERIFIED"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d5-row-typing
          path: /tmp/d5-row-typing/
          retention-days: 14
