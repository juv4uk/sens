name: Deep Meta-Eval Nightly

on:
  schedule:
    # 00:17 UTC = deep-night window in Ukraine (02:17/03:17 local by season).
    - cron: '17 0 * * *'
  workflow_dispatch:
    inputs:
      extended_b5:
        description: 'Also run the manual 5k/10k B5 falsification profiles'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deep-meta-nightly
  cancel-in-progress: false

jobs:
  deep-meta-advice-taker:
    name: full Advice Taker through debug meta-evaluator
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: deep-meta-nightly
      - name: Run full native/meta Advice Taker outcome-class witness in debug
        run: cargo test -p sens --test meta_eval_advice_taker advice_taker_native_and_meta_preserve_expected_outcome_classes -- --ignored --nocapture

  b5-advice-diagnostic:
    name: Advice Taker B5 100/500/1000 diagnostic
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: deep-b5-diagnostic
      - name: Run comparable debug performance profile
        run: cargo test -p sens --test reason_advice_scale advice_taker_profile_100_500_1000_distractors -- --ignored --nocapture

  extended-b5:
    name: optional 5k/10k Advice Taker falsification profiles
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.extended_b5 }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: deep-b5-ci-meta
      - name: Run 5k/10k full-scan profile
        run: cargo test --profile ci-meta -p sens --test reason_scale reason_scale_profile_extended_5000_10000 -- --ignored --nocapture
      - name: Run 5k/10k Advice Taker profile
        run: cargo test --profile ci-meta -p sens --test reason_advice_scale advice_taker_profile_5000_10000_distractors -- --ignored --nocapture
