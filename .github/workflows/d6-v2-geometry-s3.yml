name: D6 v2 geometry S3

on:
  pull_request:
    paths:
      - "knowledge/d6-v2-law-first-ledger.json"
      - "knowledge/d6-v2-binary-law-families.json"
      - "scripts/research-d6-v2-geometry-s3.py"
      - ".github/workflows/d6-v2-geometry-s3.yml"
  workflow_dispatch:

jobs:
  derive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Derive D6 residue geometry
        run: python3 scripts/research-d6-v2-geometry-s3.py
