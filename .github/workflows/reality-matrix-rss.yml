name: Reality Matrix RSS owner

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rss-self-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify GNU time
        run: /usr/bin/time --version

      - name: Falsify cumulative-child RSS contamination — EXCLUDED (NOT_VERIFIED)
        if: false
        shell: bash
        run: echo "FOREIGN_LANGUAGE_TEST_BENCH=EXCLUDED_BY_POLICY native_equivalent=NOT_VERIFIED"