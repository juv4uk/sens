name: D10 hobby clock radio exact math laws
on:
  workflow_dispatch:
jobs:
  clock-radio-laws:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify monotonic 630->634 research selection and exact source models
        run: python3 scripts/check_d10_hobby_clock_radio_selection.py --self-test
      - name: Verify all prior D10 transitions
        run: python3 scripts/check_d10_selection_transition_history.py --self-test
      - name: Ensure no test mutates checked-in source
        run: git diff --exit-code
