name: Verify core FASL freshness baseline

on:
  pull_request:
    paths:
      - ".github/workflows/verify-core-fasl-freshness-baseline.yml"
      - "lib/core.lisp"
      - "lib/core.lisp.fasl"
      - "crates/my-lisp/tests/core_fasl_freshness.rs"

jobs:
  core-fasl-freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Reproduce committed core FASL freshness invariant
        run: cargo test -p my-lisp --test core_fasl_freshness
