name: Verify core FASL freshness baseline

on:
  workflow_dispatch:
jobs:
  core-fasl-freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Reproduce committed core FASL freshness invariant
        run: cargo test -p sens --test core_fasl_freshness
