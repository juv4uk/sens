name: SENS — короткий локальний GPU smoke

on:
  workflow_dispatch:
    inputs:
      release_probe:
        description: "Прогнати релізні нативні перевірки (translation_boundary, core4_migration_point, коннектор леджера)"
        type: boolean
        default: false

permissions: {}

jobs:
  cml-gpu-smoke:
    name: CML worker · GTX 1050 Ti
    runs-on: [self-hosted, Linux, X64, gpu, gtx-1050-ti]
    timeout-minutes: 3
    steps:
      - name: Підтвердити локальний runner і CML worker
        shell: bash
        run: |
          set -euo pipefail
          test "${RUNNER_ENVIRONMENT:-}" = self-hosted
          test "${RUNNER_NAME:-}" = wsm-i5-6400
          worker=/home/agents/.local/bin/cml-gpu-worker
          test -x "$worker"
          printf 'runner=%s environment=%s sha=%s PATH=%s worker=%s\n' "$RUNNER_NAME" "$RUNNER_ENVIRONMENT" "$GITHUB_SHA" "$PATH" "$worker"

      - name: Перевірити відповідь спільного CML GPU worker
        shell: bash
        run: |
          set -euo pipefail
          export CML_GPU_WORKER_SOCKET=/run/cml-gpu-worker/worker.sock
          worker=/home/agents/.local/bin/cml-gpu-worker
          timeout_bin=/usr/bin/timeout
          test -x "$timeout_bin"
          ping="$("$timeout_bin" 5s "$worker" ping)"
          test "$ping" = pong
          probe="$("$timeout_bin" 10s "$worker" probe)"
          printf 'worker_ping=%s\nworker_probe=%s\n' "$ping" "$probe"
          [[ "$probe" == *"status=ready"* ]]
          [[ "$probe" == *"device_name=NVIDIA GeForce GTX 1050 Ti"* ]]
          [[ "$probe" == *"live_device=NVIDIA GeForce GTX 1050 Ti"* ]]
          actual="$("$timeout_bin" 15s "$worker" add-i32 5 1 2 3)"
          expected='6 7 8'
          printf 'operation=add-i32 expected=%s actual=%s\n' "$expected" "$actual"
          test "$actual" = "$expected"
          # Перевірити справжнє GPU-виконання на різних точних i32-входах.
          # Ці механічні smoke-вектори не ратифікують семантику SENS.
          actual="$("$timeout_bin" 15s "$worker" add-i32 2 0 1 5)"
          expected='2 3 7'
          printf 'operation=add-i32 input=0,1,5 expected=%s actual=%s\n' "$expected" "$actual"
          test "$actual" = "$expected"
          actual="$("$timeout_bin" 15s "$worker" add-i32 5 -3 0 3)"
          expected='2 5 8'
          printf 'operation=add-i32 input=-3,0,3 expected=%s actual=%s\n' "$expected" "$actual"
          test "$actual" = "$expected"
          printf 'CML_GPU_WORKER_SMOKE_PASS physical_device=GTX_1050_Ti vectors=3 semantic_authority=SENS_ONLY\n' >> "$GITHUB_STEP_SUMMARY"

  # Релізні нативні перевірки на локальній машині (там є cargo/zig).
  # Окремий job, щоб не чіпати GPU-smoke і його таймаут.
  release-probe:
    if: ${{ inputs.release_probe }}
    name: Релізні нативні перевірки · GTX 1050 Ti
    runs-on: [self-hosted, Linux, X64, gpu, gtx-1050-ti]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: translation_boundary (блокер релізу)
        shell: bash
        run: |
          set -uo pipefail
          echo '::error::translation_boundary Rust-тест видалено (власник не дозволяв); SENS-версія не створена — гейт лишається ЧЕРВОНИМ'; exit 1
          rc=${PIPESTATUS[0]}
          echo "TRANSLATION_BOUNDARY_RC=$rc"
          exit 0
      - name: core4_migration_point (F6-фікс d8ced25e)
        shell: bash
        run: |
          set -uo pipefail
          cargo test --locked -p sens --test core4_migration_point 2>&1 | tail -40
          echo "CORE4_POINT_RC=${PIPESTATUS[0]}"
          exit 0
      - name: Коннектор леджера релізу (нативний)
        shell: bash
        run: |
          set -uo pipefail
          python3 scripts/connect-release-admission-native.py 2>&1 | tail -25
          echo "LEDGER_CONNECTOR_RC=${PIPESTATUS[0]}"
          exit 0
