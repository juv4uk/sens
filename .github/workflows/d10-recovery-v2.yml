name: D10 recovery v2

on:
  workflow_dispatch:

jobs:
  recovery-v2:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Preserve recovery v1
        run: python3 scripts/check-d10-recovery-v1.py
      - name: Verify recovery v2
        run: python3 scripts/check-d10-recovery-v2.py
      - name: Verify D10 seed
        run: python3 scripts/check-d10-fill-v1-seed.py
