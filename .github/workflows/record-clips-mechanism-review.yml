name: Record CLIPS mechanism authority review

on:
  pull_request:
    paths:
      - ".github/workflows/record-clips-mechanism-review.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
      - name: Bind explicit review to exact CLIPS adapter bytes
        shell: bash
        run: |
          set -euo pipefail
          path="crates/wsm-clips-kernel/src/lib.rs"
          digest="$(sha256sum "$path" | awk '{print $1}')"
          row="(review \"$path\" \"$digest\" issue-992 clips-result-observation-mechanism)"
          if grep -F -q "$row" tests/semantic-authority-reviews.lisp; then
            echo "exact review already present"
            exit 0
          fi
          printf '\n; #992 CLIPS native result observation: reviewed mechanism-only adapter.\n%s\n' "$row" >> tests/semantic-authority-reviews.lisp
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/semantic-authority-reviews.lisp
          git commit -m "test(#992): review exact CLIPS observation adapter"
          git push origin HEAD:${{ github.head_ref }}
