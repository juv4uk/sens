name: Подання SENS — точні домени без підміни W8

on:
  push:
    branches: [main]
    paths:
      - "crates/sens/src/presentation.rs"
      - "crates/sens/src/semantic_registry.rs"
      - "crates/sens/tests/presentation_exact_domain_cutover.rs"
      - "crates/sens/tests/runtime_peer_operators.rs"
      - "crates/sens/tests/d7_runtime_presentation.rs"
      - ".github/workflows/presentation-domain-cutover.yml"
  pull_request:
    paths:
      - "crates/sens/src/presentation.rs"
      - "crates/sens/src/semantic_registry.rs"
      - "crates/sens/tests/presentation_exact_domain_cutover.rs"
      - "crates/sens/tests/runtime_peer_operators.rs"
      - "crates/sens/tests/d7_runtime_presentation.rs"
      - ".github/workflows/presentation-domain-cutover.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-presentation:
    name: Перевірити D3 D7 D8 D9 та історичний W8
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Встановити закріплений Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.0"
      - name: Незалежні позитивні та негативні тести точних доменів
        run: |
          cargo test --locked -p sens --test presentation_exact_domain_cutover
          cargo test --locked -p sens --test d7_runtime_presentation
          cargo test --locked -p sens --test runtime_peer_operators
