        timeout-minutes: 4
        shell: bash
        run: CARGO_BUILD_JOBS=2 CARGO_INCREMENTAL=0 timeout 180s cargo test --locked -p sens --test probabilistic_decision_jev_like declared_agreement_with_different_distributions_is_disputed -- --exact --nocapture

      - name: "System One — Noul: відхилити поріг поза доменом"
