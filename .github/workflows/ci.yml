            --executor-report-file "$RUNNER_TEMP/sens-native-evidence.jsonl" \
            -- target/debug/sens "$program"
      - name: KNOWLEDGE-CONS — D3:111 відмінний від D4:1110 і D8:00000100
        id: knowledge-cons-width
        shell: bash
        run: |
          set -euo pipefail
          # Source policy is mechanical only. SENS executes and decides the law.
          grep -Fq '(1110 (001 111)' lib/knowledge.lisp
          source=tests/semantic/knowledge-cons-exact-width-law.lisp
          program=tests/semantic/knowledge-cons-exact-width-law.sens
          target/debug/sens-trit encode "$source"
