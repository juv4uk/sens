      - name: "E1 / T5 / F3C — реальна фізична вартість 16 точних двійкових програм"
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$RUNNER_TEMP/zig-x86_64-linux-0.16.0:$PATH"
          echo 'test_id=e1-t5-f3c-size-corpus layer=transport authority=SENS benchmark=PHYSICAL_SIZE_ONLY'
          # Чинний універсальний фізичний E1-свідок має бути виконаний
          # точно один раз. Ніякого загального cargo test --lib замість звірки.
          cargo test --locked -p sens --lib \
            universal_frame3::tests::e1_t5_f3c_exact_physical_size_matrix \
            -- --exact --nocapture | tee "$RUNNER_TEMP/e1-carrier-size.log"
          grep -Fxq 'test universal_frame3::tests::e1_t5_f3c_exact_physical_size_matrix ... ok' "$RUNNER_TEMP/e1-carrier-size.log"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import os
          import re

          base = Path(os.environ["RUNNER_TEMP"])
          lines = (base / "e1-carrier-size.log").read_text().splitlines()
          records = []
          pattern = re.compile(
              r"^E1_SIZE_RECORD case=(\w+) words=(\d+) exact_bits=(\d+) "
              r"e1_bytes=(\d+) t5_bytes=(\d+|NA) f3c_bytes=(\d+|NA)$"
          )
          for line in lines:
              match = pattern.fullmatch(line)
              if match:
                  name, count, bits, e1, t5, f3c = match.groups()
                  records.append({
                      "case": name, "words": int(count), "exact_bits": int(bits),
                      "e1_bytes": int(e1),
                      "t5_bytes": None if t5 == "NA" else int(t5),
                      "f3c_bytes": None if f3c == "NA" else int(f3c),
                  })
          summaries = [line for line in lines if line.startswith("E1_SIZE_SUMMARY ")]
          if len(records) != 16 or len({r["case"] for r in records}) != 16 or len(summaries) != 1:
              raise SystemExit(
                  f"E1_SIZE_UNINFORMATIVE_OUTPUT records={len(records)} "
                  f"unique={len({r['case'] for r in records})} summaries={len(summaries)}"
              )
          summary = dict(token.split("=", 1) for token in summaries[0].split()[1:])
          comparable = [r for r in records if r["t5_bytes"] is not None]
          assert int(summary["cases"]) == 16
          assert int(summary["t5_representable"]) == len(comparable)
          assert int(summary["f3c_eligible"]) == sum(r["f3c_bytes"] is not None for r in records)
          assert int(summary["sum_e1_bytes"]) == sum(r["e1_bytes"] for r in records)
          assert int(summary["sum_t5_comparable_bytes"]) == sum(r["t5_bytes"] for r in comparable)
          assert int(summary["e1_smaller"]) == sum(r["e1_bytes"] < r["t5_bytes"] for r in comparable)
          assert int(summary["t5_smaller"]) == sum(r["e1_bytes"] > r["t5_bytes"] for r in comparable)
          assert int(summary["equal"]) == sum(r["e1_bytes"] == r["t5_bytes"] for r in comparable)
          assert summary["speed"] == "NOT_MEASURED"
          assert summary["semantic_authority"] == "SENS"
          # The 16 E1 byte-parity fixtures do not include an F3C-eligible
          # program; measure one separately *known* executable tiny F3C case.
          # Never pad NA entries with zero bytes or add it to the 16-case sum.
          tiny_pattern = re.compile(
              r"^E1_F3C_TINY_REFERENCE case=admitted_quote words=(\d+) "
              r"exact_bits=(\d+) e1_bytes=(\d+) t5_bytes=4 f3c_bytes=3 "
              r"semantic_authority=SENS$"
          )
          tiny = [m for line in lines if (m := tiny_pattern.fullmatch(line))]
          if len(tiny) != 1:
              raise SystemExit(f"E1_TINY_F3C_REFERENCE_UNINFORMATIVE matches={len(tiny)}")
          tiny_record = {
              "case": "admitted_quote",
              "words": int(tiny[0].group(1)),
              "exact_bits": int(tiny[0].group(2)),
              "e1_bytes": int(tiny[0].group(3)),
              "t5_bytes": 4,
              "f3c_bytes": 3,
              "provenance": "universal_frame3::tests::e1_t5_f3c_exact_physical_size_matrix",
          }
          assert tiny_record["words"] >= 1 and tiny_record["exact_bits"] >= 1
          assert tiny_record["e1_bytes"] >= 8
          corpus = Path("research/zig-codecs/transport/fixtures/e1-v1.bits")
          evidence = {
              "schema": "sens-e1-carrier-size/v1",
              "git_sha": os.environ["GITHUB_SHA"],
              "corpus_sha256": hashlib.sha256(corpus.read_bytes()).hexdigest(),
              "measurement": "physical_bytes_only_not_latency",
              "semantic_authority": "SENS",
              "e1_default": False,
              "summary": summary,
              "records": records,
              "tiny_f3c_reference": tiny_record,
          }
          (base / "e1-carrier-size.json").write_text(
              json.dumps(evidence, ensure_ascii=False, indent=2) + "\n"
          )
          print(
              f"E1_CARRIER_SIZE_PASS cases={len(records)} "
              f"t5_comparable={len(comparable)} "
              f"f3c_eligible={summary['f3c_eligible']} "
              f"tiny_f3c_bytes=3 tiny_t5_bytes=4 "
              f"tiny_e1_bytes={tiny_record['e1_bytes']} "
              f"corpus_sha256={evidence['corpus_sha256']} speed=NOT_MEASURED"
          )
          PY
      - name: "E1 CLI → лише SENS: позитивний D1, однобітний мутант і CRC"
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$RUNNER_TEMP/zig-x86_64-linux-0.16.0:$PATH"
          cargo test --locked -p sens-cli --bin sens-trit \
            e1_cli_mechanism_tests::explicit_e1_cli_uses_exact_native_sens_semantic_verdict \
            -- --exact --nocapture | tee "$RUNNER_TEMP/sens-e1-cli-unit.log"
          grep -Fxq 'test e1_cli_mechanism_tests::explicit_e1_cli_uses_exact_native_sens_semantic_verdict ... ok' "$RUNNER_TEMP/sens-e1-cli-unit.log"
          # Two narrow Zig-physical W7 data tests; SENS alone owns D7 glyphs.
          cargo test --locked -p sens-cli --bin sens-trit \
            d7_zig_cli_boundary_tests:: -- --nocapture | tee "$RUNNER_TEMP/sens-d7-zig-boundary.log"
          grep -Fq 'test d7_zig_cli_boundary_tests::keyboard_w7_is_sens_owned_zig_carries_exact_bytes_and_rejects_non_d7 ... ok' "$RUNNER_TEMP/sens-d7-zig-boundary.log"
          grep -Fq 'test d7_zig_cli_boundary_tests::d7_default_cli_routes_do_not_decode_or_encode_t5_in_rust ... ok' "$RUNNER_TEMP/sens-d7-zig-boundary.log"
          bin=target/debug/sens-trit
          "$bin" backend
          test -x "$bin"
          for test_case in positive mutant; do
            if [[ "$test_case" == positive ]]; then
              fixture=tests/fixtures/semantic/exact-d3-logic-selftest.sens
            else
              fixture=tests/fixtures/semantic/exact-d3-logic-mutant.sens
            fi
            cp "$fixture" "$RUNNER_TEMP/e1-$test_case.sens"
            "$bin" encode-e1 "$RUNNER_TEMP/e1-$test_case.sens"
            test -s "$RUNNER_TEMP/e1-$test_case.e1"
            "$bin" eval "$RUNNER_TEMP/e1-$test_case.sens" > "$RUNNER_TEMP/e1-$test_case-t5.verdict"
            "$bin" eval-e1 "$RUNNER_TEMP/e1-$test_case.e1" > "$RUNNER_TEMP/e1-$test_case-e1.verdict"
            cmp "$RUNNER_TEMP/e1-$test_case-t5.verdict" "$RUNNER_TEMP/e1-$test_case-e1.verdict" || {
              echo "::error::E1_CLI_SENS_VERDICT_MISMATCH case=$test_case"; exit 1;
            }
            echo "E1_NATIVE_SENS_CLI_PASS case=$test_case"
            sha256sum "$fixture" "$RUNNER_TEMP/e1-$test_case.e1"
          done
          if cmp -s "$RUNNER_TEMP/e1-positive-e1.verdict" "$RUNNER_TEMP/e1-mutant-e1.verdict"; then
            echo "::error::E1_CLI_D1_MUTANT_DID_NOT_CHANGE_SENS_RESULT"; exit 1
          fi
          cp "$RUNNER_TEMP/e1-positive.e1" "$RUNNER_TEMP/e1-corrupt.e1"
          python3 - "$RUNNER_TEMP/e1-corrupt.e1" <<'PY'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          data = bytearray(p.read_bytes())
          data[-1] ^= 1  # Physical CRC mutant only, never semantic truth.
          p.write_bytes(data)
          PY
          if "$bin" eval-e1 "$RUNNER_TEMP/e1-corrupt.e1" > "$RUNNER_TEMP/e1-corrupt.out" 2> "$RUNNER_TEMP/e1-corrupt.err"; then
            echo "::error::E1_CLI_FAIL_OPEN_CORRUPTED_CRC"; exit 1
          fi
          grep -Fq 'Zig E1 physical decode rejected: code=-1' "$RUNNER_TEMP/e1-corrupt.err" || {
            echo "::error::E1_CLI_REJECTION_UNINFORMATIVE"; exit 1;
          }
          echo 'E1_NATIVE_SENS_CLI_VERDICTS_PASS: positive/mutant differ, T5 matches E1, CRC fails closed'
          echo 'test_id=e1-native-sens-corpus-eight-laws-and-three-negatives layer=eval authority=binary-SENS'
          bash -n scripts/test-e1-native-sens-corpus.sh
          SENS_TRIT_BIN="$PWD/target/debug/sens-trit" \
            bash scripts/test-e1-native-sens-corpus.sh | tee "$RUNNER_TEMP/sens-e1-native-corpus.log"
