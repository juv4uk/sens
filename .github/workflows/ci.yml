name: SENS — один точковий автоматичний двійковий закон

# Рівно один автоматичний job; лише SENS визначає семантичний результат.
# Один центральний workflow: positive law + fail-closed guards.
# Branch pushes always receive one SENS witness; new branch/merge is allowed.
# No paths filter: docs, implementation, migration, and workflow changes all trigger.
on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Each commit gets its own slot; GitHub otherwise replaces older PENDING runs.
  group: sens-one-focussed-${{ github.repository }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  binary-sens-law:
    name: Часові D1 предикати — один фізичний SENS-свідок і чинні негативні контроли
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          # HEAD^ is required by the fail-closed D3 source-delta guard.
          fetch-depth: 2
      - name: Синтаксис усіх YAML-файлів репозиторію
        id: yaml-syntax
        shell: ruby {0}
        run: |
          require "yaml"

          paths = Dir.glob("**/*.{yml,yaml}", File::FNM_DOTMATCH)
                     .select { |path| File.file?(path) && !path.split("/").include?(".git") }
                     .sort
          failures = []

          paths.each do |path|
            begin
              YAML.parse_stream(File.read(path))
            rescue Psych::Exception => error
              detail = error.message.lines.first.to_s.strip
              failures << [path, detail]
            end
          end

          puts "YAML_SYNTAX_AUDIT checked=#{paths.length} failed=#{failures.length}"
          failures.each do |path, detail|
            puts "YAML_SYNTAX_FAILURE path=#{path} detail=#{detail}"
            warn "::error file=#{path}::#{detail.gsub("%", "%25").gsub("\r", "%0D").gsub("\n", "%0A")}"
          end
          exit(failures.empty? ? 0 : 1)
      - name: Не допустити жодного іншого автоматичного workflow
        id: budget
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci_one_focused_workflow.py
          python3 scripts/ci_executor_invariant.py
          python3 scripts/ci_failure_contract.py self-test
          python3 scripts/check-domain-ladder-identity.py --self-test --check
          # Instrumental migration proof, not an alternate semantic oracle.
          # Failures retain fixture, command and actual output via RED contract.
          report="$RUNNER_TEMP/sens-focal-red.jsonl"
          : > "$report"
          python3 scripts/ci_failure_contract.py run \
            --test-id exact-domain-migrator-d3-d4 \
            --layer encode \
            --fixture tests/test_migrate_exact_domain.py \
            --report-file "$report" \
            -- python3 -m unittest discover -s tests -p test_migrate_exact_domain.py -v
      - uses: dtolnay/rust-toolchain@1.99.0
      - name: FULL_CARGO_WORKSPACE — одноразовий повний прогін на точному SHA
        if: contains(github.event.head_commit.message, '[full-cargo-once]') || github.event_name == 'workflow_dispatch'
        id: full-cargo
        shell: bash
        run: |
          set -euo pipefail
          echo "FULL_CARGO_ONCE commit=$GITHUB_SHA command=cargo test --workspace --all-targets --locked"
          python3 scripts/ci_failure_contract.py run \
            --test-id full-cargo-workspace-all-targets \
            --layer transport \
            --fixture lib/compiler-nucleus.lisp \
            --report-file "$RUNNER_TEMP/sens-full-cargo-red.jsonl" \
            -- cargo test --workspace --all-targets --locked
      - name: D1 source census — direct predicate bits, no wrapper constructors
        id: source-census
        shell: bash
        run: |
          set -euo pipefail
          code="$(sed '/^[[:space:]]*;/d' lib/time.lisp)"
          true_count="$(printf '%s\n' "$code" | grep -oF '#d1:1' | wc -l | tr -d ' ')"
          false_count="$(printf '%s\n' "$code" | grep -oF '#d1:0' | wc -l | tr -d ' ')"
          legacy_true=0
          legacy_false=0
          if printf '%s\n' "$code" | grep -Fq '(010 (001 ()))'; then legacy_true=1; fi
          if printf '%s\n' "$code" | grep -Fq '(101 (001 (0)) (001 (1)))'; then legacy_false=1; fi
          sha256sum lib/time.lisp
          printf 'TIME_D1_SOURCE_BITS true=%s false=%s legacy_true=%s legacy_false=%s\n' "$true_count" "$false_count" "$legacy_true" "$legacy_false"
          test "$true_count" -eq 20
          test "$false_count" -eq 4
          test "$legacy_true" -eq 0
          test "$legacy_false" -eq 0
      - name: Зібрати тільки механізм виконання SENS
        id: build
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/sens-focal-red.jsonl"
          : > "$report"
          : > "$RUNNER_TEMP/sens-native-evidence.jsonl"
          python3 scripts/ci_failure_contract.py run \
            --test-id one-sens-transport-build \
            --layer transport \
            --fixture tests/semantic/time-d1-predicate-law.sens \
            --report-file "$report" \
            -- cargo build --locked -p sens-cli --bin sens --bin sens-trit
      # Manual, deeper suite has independent witnesses, never an automatic green claim.
      - name: SENS_NATIVE_T5_CORPUS — 8 власних D1-законів, 3 негативних свідки
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/test-current-semantic-slice.sh --native-binary-only
      - name: D1–D10 — вичерпна перевірка бітового пакування (без нової семантики)
        id: packed
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/sens-focal-red.jsonl"
          python3 scripts/ci_failure_contract.py run \
            --test-id packed-bits-d1-d10 \
            --layer transport \
            --fixture tests/semantic/time-d1-predicate-law.sens \
            --report-file "$report" \
            -- cargo test --locked -p sens --lib packed_bits::tests:: -- --nocapture
          # Mechanical compiler schema gate: SENS owns language meaning;
          # Rust merely rejects ambiguous duplicate transport fields.
          python3 scripts/ci_failure_contract.py run \
            --test-id compiler-artifact-seven-bit-slot-guard \
            --layer transport \
            --fixture crates/sens/src/compiler_language.rs \
            --report-file "$report" \
            -- cargo test --locked -p sens --lib compiler_language::tests::whole_program_artifact_verifier_rejects_duplicate_fields_before_execution -- --exact --nocapture
          cargo test --locked -p sens --lib quote_of_canonical_d3_empty_coordinate_is_structural_nil -- --nocapture
          cargo test --locked -p sens --lib quote_preserves_nonempty_d3_domain_identity -- --nocapture
      - name: Презентація зберігає точну ширину D3/D4
        shell: bash
        run: |
          set -euo pipefail
          echo "test_id=presentation-exact-domain-width semantic_authority=domain-ladder"
          sha256sum crates/sens/src/presentation.rs
          cargo test --locked -p sens --lib presentation::tests::equal_payload_d3_d4_identities_remain_visibly_distinct -- --exact --nocapture
      - name: Рамка-3 — Rust-тест точного 5-байтового B/C/S/W механізму (не SENS-оракул)
        id: frame3-bcsw
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/sens-focal-red.jsonl"
          echo "test_id=frame3-bcsw-five-bytes layer=transport executor=rust-integration—not-native-cli semantic_authority=none"
          sha256sum crates/sens/src/frame3_micro_v5_lambda_app.rs
          python3 scripts/ci_failure_contract.py run \
            --test-id frame3-bcsw-five-bytes \
            --layer transport \
            --fixture crates/sens/src/frame3_micro_v5_lambda_app.rs \
            --report-file "$report" \
            -- cargo test --locked -p sens --lib frame3_micro_v5_lambda_app::tests::five_byte_bcsw_exact_sens_reduction -- --exact --nocapture
      - name: Єдиний фізичний SENS-закон — D1:0 пропускає, D1:1 вибирає
        id: law
        shell: bash
        run: |
          set -euo pipefail
          program=tests/semantic/time-d1-predicate-law.sens
          report="$RUNNER_TEMP/sens-focal-red.jsonl"
          printf '1\n' > "$RUNNER_TEMP/expected-d1"
          echo "test_id=sens-time-d1-predicate-law layer=eval semantic_authority=binary-SENS"
          sha256sum "$program"
          python3 scripts/ci_failure_contract.py run \
            --test-id sens-time-d1-predicate-law \
            --layer eval \
            --fixture "$program" \
            --expected-file "$RUNNER_TEMP/expected-d1" \
            --report-file "$report" \
            --executor-report-file "$RUNNER_TEMP/sens-native-evidence.jsonl" \
            -- target/debug/sens "$program"
      - name: Негативний контроль — безпосередній процес SENS відкидає non-callable
        id: mutant
        shell: bash
        run: |
          set -euo pipefail
          mutant=tests/semantic/domain-logic-2040/mutant.sens
          report="$RUNNER_TEMP/sens-focal-red.jsonl"
          echo "test_id=sens-domain-logic-2040-mutant layer=eval executor=target/debug/sens"
          sha256sum "$mutant"
          python3 scripts/ci_failure_contract.py run \
            --test-id sens-domain-logic-2040-mutant \
            --layer eval \
            --fixture "$mutant" \
            --expect-error-substring "not callable" \
            --report-file "$report" \
            --executor-report-file "$RUNNER_TEMP/sens-native-evidence.jsonl" \
            -- target/debug/sens "$mutant"
      - name: Двійковий закон арності знань — рівно D3/D4 і точний D1:YES
        id: knowledge
        shell: bash
        run: |
          set -euo pipefail
          program=tests/semantic/knowledge-exact-arity-structure.sens
          report="$RUNNER_TEMP/sens-focal-red.jsonl"
          printf '1\n' > "$RUNNER_TEMP/expected-knowledge-d1"
          echo "test_id=knowledge-exact-arity-structure layer=eval semantic_authority=binary-SENS"
          sha256sum "$program"
          python3 scripts/ci_failure_contract.py run \
            --test-id knowledge-exact-arity-structure \
            --layer eval \
            --fixture "$program" \
            --expected-file "$RUNNER_TEMP/expected-knowledge-d1" \
            --report-file "$report" \
            --executor-report-file "$RUNNER_TEMP/sens-native-evidence.jsonl" \
            -- target/debug/sens "$program"
      - name: Core1 — дев'ять селекторних законів перевіряє двійковий SENS і D1-мутант
        id: core1-selectors
        shell: bash
        run: |
          set -euo pipefail
          base=tests/fixtures/core1-selectors-semantic
          report="$RUNNER_TEMP/sens-focal-red.jsonl"
          echo "test_id=core1-selector-9-laws layer=eval semantic_authority=binary-SENS"
          sha256sum lib/core1.lisp "$base.bits" "$base.sens" "$base-mutant.bits" "$base-mutant.sens"
          # Лише механічний транспорт: збіг усіх точних бітових слів із T5.
          target/debug/sens-trit open "$base.sens" > "$RUNNER_TEMP/core1-positive.bits"
          target/debug/sens-trit open "$base-mutant.sens" > "$RUNNER_TEMP/core1-mutant.bits"
          cmp "$base.bits" "$RUNNER_TEMP/core1-positive.bits"
          cmp "$base-mutant.bits" "$RUNNER_TEMP/core1-mutant.bits"
          mapfile -t original < <(tr '[:space:]' '\n' < "$base.bits" | sed '/^$/d')
          mapfile -t mutated < <(tr '[:space:]' '\n' < "$base-mutant.bits" | sed '/^$/d')
          test "${#original[@]}" -eq "${#mutated[@]}"
          changes=0
          for ((i=0; i<${#original[@]}; i++)); do
            if [[ "${original[i]}" != "${mutated[i]}" ]]; then
              [[ "${original[i]}" == 0 && "${mutated[i]}" == 1 ]] || { echo "::error::CORE1_MUTANT_WIDTH_OR_BIT_VIOLATION word=$i"; exit 1; }
              changes=$((changes + 1))
            fi
          done
          test "$changes" -eq 1 || { echo "::error::CORE1_MUTANT_NOT_ONE_BIT changed_words=$changes"; exit 1; }
          printf '1\n' > "$RUNNER_TEMP/core1-expected-yes"
          printf '0\n' > "$RUNNER_TEMP/core1-expected-no"
          python3 scripts/ci_failure_contract.py run \
            --test-id core1-selector-9-laws \
            --layer eval \
            --fixture "$base.sens" \
            --expected-file "$RUNNER_TEMP/core1-expected-yes" \
            --report-file "$report" \
            --executor-report-file "$RUNNER_TEMP/sens-native-evidence.jsonl" \
            -- target/debug/sens "$base.sens"
          python3 scripts/ci_failure_contract.py run \
            --test-id core1-selector-1bit-falsifier \
            --layer eval \
            --fixture "$base-mutant.sens" \
            --expected-file "$RUNNER_TEMP/core1-expected-no" \
            --report-file "$report" \
            --executor-report-file "$RUNNER_TEMP/sens-native-evidence.jsonl" \
            -- target/debug/sens "$base-mutant.sens"
      - name: CI-клей Python — механічні межі кодування QUOTE/D7 та SLP1 (не semantic oracle)
        id: quoted-d7
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/sens-focal-red.jsonl"
          for fixture in test_sens_quoted_datum_law.py test_slp1_d7_v2_quote_boundary.py; do
            echo "test_id=$fixture layer=encode executor=CI_GLUE_NO_SEMANTICS"
            python3 scripts/ci_failure_contract.py run \
              --test-id "$fixture" \
              --layer encode \
              --fixture "tests/$fixture" \
              --report-file "$report" \
              -- python3 -m unittest discover -s tests -p "$fixture" -v
          done
      - name: Мігратор — немає позитивного дозволу без точної identity, навіть з Python -O
        id: migrator-optimized
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/sens-focal-red.jsonl"
          python3 scripts/ci_failure_contract.py run \
            --test-id migrate-resolver-failclosed-optimized \
            --layer encode \
            --fixture scripts/migrate-to-sens-codes.py \
            --report-file "$report" \
            -- python3 -O tests/test_migrate_resolver_failclosed.py
      - name: TCP — Rust інтеграційний тест з викликом SENS-бібліотеки (не окремий native CLI oracle)
        id: tcp-migration
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/sens-focal-red.jsonl"
          echo "test_id=tcp-binary-d4-law layer=transport executor=rust-integration—not-native-cli"
          sha256sum tests/fixtures/semantic/tcp-exact-selftest.bits lib/tcp.lisp
          python3 scripts/ci_failure_contract.py run \
            --test-id tcp-binary-d4-law \
            --layer transport \
            --fixture tests/fixtures/semantic/tcp-exact-selftest.bits \
            --report-file "$report" \
            -- cargo test --locked -p sens --test tcp_d1_fallback -- --nocapture
      - name: Вбудовані перевірки реальності — інформативні гейти, що відповідають чинному main
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/run-reality-checks.py
      - name: Червоний має говорити — валідність діагностики
        if: always()
        shell: bash
        env:
          BUDGET_OUTCOME: ${{ steps.budget.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          PACKED_OUTCOME: ${{ steps.packed.outcome }}
          SOURCE_OUTCOME: ${{ steps.source-census.outcome }}
          LAW_OUTCOME: ${{ steps.law.outcome }}
          MUTANT_OUTCOME: ${{ steps.mutant.outcome }}
          KNOWLEDGE_OUTCOME: ${{ steps.knowledge.outcome }}
          CORE1_OUTCOME: ${{ steps.core1-selectors.outcome }}
          QUOTED_OUTCOME: ${{ steps.quoted-d7.outcome }}
          TCP_OUTCOME: ${{ steps.tcp-migration.outcome }}
          FRAME3_OUTCOME: ${{ steps.frame3-bcsw.outcome }}
          MIGRATOR_OUTCOME: ${{ steps.migrator-optimized.outcome }}
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/sens-focal-red.jsonl"
          # Ratchet first: even a green Python runner cannot impersonate SENS.
          # The scanner validates three receipts against the actual executable,
          # physical fixture hashes, binary package version and exact commands.
          native_rc=0
          python3 scripts/ci_failure_contract.py scan-executors \
            --report-file "$RUNNER_TEMP/sens-native-evidence.jsonl" \
            --require sens-time-d1-predicate-law \
            --require sens-domain-logic-2040-mutant \
            --require knowledge-exact-arity-structure \
            --require core1-selector-9-laws \
            --require core1-selector-1bit-falsifier || native_rc=$?
          diagnostic_rc=0
          if [[ "$BUDGET_OUTCOME" == success && "$BUILD_OUTCOME" == success && "$PACKED_OUTCOME" == success && "$SOURCE_OUTCOME" == success && "$LAW_OUTCOME" == success && "$MUTANT_OUTCOME" == success && "$KNOWLEDGE_OUTCOME" == success && "$CORE1_OUTCOME" == success && "$QUOTED_OUTCOME" == success && "$MIGRATOR_OUTCOME" == success && "$TCP_OUTCOME" == success && "$FRAME3_OUTCOME" == success ]]; then
            python3 scripts/ci_failure_contract.py scan --report-file "$report" --allow-empty || diagnostic_rc=$?
          else
            python3 scripts/ci_failure_contract.py scan --report-file "$report" || diagnostic_rc=$?
          fi
          if [[ "$native_rc" -ne 0 || "$diagnostic_rc" -ne 0 ]]; then
            echo "::error::UNINFORMATIVE-EXECUTOR or UNINFORMATIVE-OUTPUT; blocking CI"
            exit 1
          fi
