      - name: D1–D10 — вичерпна перевірка бітового пакування (без нової семантики)
        id: packed
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/sens-focal-red.jsonl"
          python3 scripts/ci_failure_contract.py run \
            --test-id packed-bits-d1-d10 \
            --layer transport \
            --fixture crates/sens/src/packed_bits.rs \
            --report-file "$report" \
            -- cargo test --locked -p sens --lib packed_bits::tests:: -- --nocapture
          # Mechanical compiler schema gate: SENS owns language meaning;
          # Rust merely rejects ambiguous duplicate transport fields.
          python3 scripts/ci_failure_contract.py run \
            --test-id compiler-artifact-seven-bit-slot-guard \
            --layer transport \
            --fixture crates/sens/src/compiler_language.rs \
            --report-file "$report" \
            -- cargo test --locked -p sens --lib compiler_language::tests::whole_program_artifact_verifier_rejects_duplicate_fields_before_execution -- --exact --nocapture
          cargo test --locked -p sens --lib quote_of_canonical_d3_empty_coordinate_is_structural_nil -- --nocapture
          cargo test --locked -p sens --lib quote_preserves_nonempty_d3_domain_identity -- --nocapture

      - name: UNGUARDING ratchet — жоден guard не може бути муляжем
        # A guard that cannot fail is itself a failure. A placeholder/stub gate, or a
        # guard whose negative controls do not pass, fails here -- so a dummy gate
        # never reaches main.
        shell: bash
        run: python3 scripts/check_guards_are_real.py .

      - name: RELEASE GO-GATE — виконуваний підрахунок GO/NO-GO (коридор + аксіоми)
        # The release is GO only when every gate passes on ONE SHA (#4196). This step
        # prints the GO count and names the red gates -- report-only, never greenwashed.
        shell: bash
        run: |
          set +e
          python3 scripts/release_go_gate.py . --json "$RUNNER_TEMP/release-go-gate.json"
          echo "release-go-gate exit=$?"
          exit 0

      - name: MATH — парний бенчмарк точної раціональної арифметики SENS↔Rust
        # One workload, one law (canonical gcd-reduced Q, add/mul/recip) on the Rust
        # reference and on the SENS binary; unavailable side = UNVERIFIED, no fake number.
        shell: bash
        run: |
          set -euo pipefail
          # The crate is its own workspace (benchmarks/core-math-demand-rust/Cargo.toml
          # has [workspace]); -p from the root cannot see it. Build by manifest path.
          cargo build --manifest-path benchmarks/core-math-demand-rust/Cargo.toml --release
          python3 scripts/bench_math_sens_vs_rust.py . --iters 200000 --reps 7 \
            --json "$RUNNER_TEMP/math-bench.json"

      - name: Червоний має говорити — валідність діагностики
        if: always()
        shell: bash
        env:
          PRIOR_JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/sens-focal-red.jsonl"
          # Підсумок НАЯВНИХ попередніх кроків, не старих видалених id.
          # На зеленому job порожній журнал допустимий, але на RED
          # вимагаємо інформативний failure contract — нічого не приховуємо.
          diagnostic_rc=0
          if [[ "$PRIOR_JOB_STATUS" == success ]]; then
            python3 scripts/ci_failure_contract.py scan --report-file "$report" --allow-empty || diagnostic_rc=$?
          else
            python3 scripts/ci_failure_contract.py scan --report-file "$report" --validate-only || diagnostic_rc=$?
          fi
          if [[ "$diagnostic_rc" -ne 0 ]]; then
