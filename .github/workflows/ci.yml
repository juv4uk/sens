name: SENS — один точковий двійковий закон

# Єдиний автоматичний workflow. Лише зміни, пов'язані з законом або CI.
# Жодного Rust/Python-оракула: SENS сам обчислює D1:1 або D1:0.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'scripts/ci_one_focused_workflow.py'
      - 'scripts/ci_failure_contract.py'
      - 'tests/semantic/ci-d3-eq-self-verdict.sens'
      - 'lib/domains/d3.lisp'
      - 'crates/sens/src/eval/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sens-one-focused-main
  cancel-in-progress: true

jobs:
  binary-sens-law:
    name: D3 EQ — точний D1-самовердикт
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Перевірити, що автоматичний workflow лише один
        run: python3 scripts/ci_one_focused_workflow.py
      - uses: dtolnay/rust-toolchain@1.99.0
      - name: Скласти тільки фізичний виконавець SENS
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/sens-one-red.jsonl"
          : > "$report"
          python3 scripts/ci_failure_contract.py run \
            --test-id one-sens-transport-build \
            --layer transport \
            --fixture tests/semantic/ci-d3-eq-self-verdict.sens \
            --report-file "$report" \
            -- cargo build --locked -p sens-cli --bin sens
      - name: Єдиний точковий семантичний закон виконує фізичний SENS
        shell: bash
        run: |
          set -euo pipefail
          fixture=tests/semantic/ci-d3-eq-self-verdict.sens
          report="$RUNNER_TEMP/sens-one-red.jsonl"
          printf '1\n' > "$RUNNER_TEMP/expected-d1"
          echo "test_id=ci-d3-eq-self-verdict layer=eval domain_widths=D1:1,D2:2,D3:3"
          echo "program_path=$fixture"
          sha256sum "$fixture"
          python3 scripts/ci_failure_contract.py run \
            --test-id ci-d3-eq-self-verdict \
            --layer eval \
            --fixture "$fixture" \
            --expected-file "$RUNNER_TEMP/expected-d1" \
            --report-file "$report" \
            -- target/debug/sens "$fixture"
      - name: Червоний має говорити — заборонити неінформативну відмову
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci_failure_contract.py scan \
            --report-file "$RUNNER_TEMP/sens-one-red.jsonl" --allow-empty
