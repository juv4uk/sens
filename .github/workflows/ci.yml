      - name: "System One — Пакет: незалежні питання без вигаданої спільної узгодженості"
        if: ${{ !cancelled() && steps.changed-t5m-lisp.outputs.system_one_tests == 'true' }}
        timeout-minutes: 4
        shell: bash
        run: CARGO_BUILD_JOBS=2 CARGO_INCREMENTAL=0 timeout 180s cargo test --locked -p sens --test probabilistic_decision_jev_like independent_questions_do_not_invent_joint_consistency -- --exact --nocapture

      - name: "System One — Пакет: суперечність різних розподілів"
