          cargo test --locked -p sens --test yantra yantra_json_string_classifier_yields_d1_condition_from_structured_witness -- --exact --nocapture
          # Ніяких голих так/ні: окремо перевіряємо D1 істину, хибу й D3 NIL.
          cargo test --locked -p sens --test yantra yantra_json_d1_boolean_values_are_distinct -- --exact --nocapture
          # Живий математичний D24+ приклад: не достатньо самої DEFINE.
          cargo test --locked -p sens-cli --test cli t5m_file_mode_executes_real_ukrainian_binary_trees_d24_program -- --exact --nocapture
          # Чинний benchmarks/arithmetic.lisp: D24+ результат і негативний нечисловий аргумент.
          cargo test --locked -p sens-cli --test arithmetic_benchmark_cli -- --nocapture
          # Окремий бенчмарк-крейт має власний застарілий Cargo.lock;
          # тільки допоміжний parity-тест дозволяє offline-оновлення lock.
          # Релізні Cargo-команди лишаються --locked.
          cargo test --offline --manifest-path benchmarks/cross-language/sens-vs-python/runner/Cargo.toml \
            --test sens_parity numeric_base_cases_are_executed_by_sens_not_d3_eq -- --exact --nocapture
