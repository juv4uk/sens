      - name: Core min-max — один біт D1 міняє семантичний вердикт
        id: core-sentinel-mutant
        shell: bash
        run: |
          set -euo pipefail
          law=tests/semantic/core-sentinel-null-law.bits
          mutant=tests/semantic/core-sentinel-null-mutant.bits
          awk '
            NR==FNR {n=split($0,bits," "); for(i=1;i<=n;i++) baseline[i]=bits[i]; next}
            {m=split($0,bits," "); if(m!=n) exit 2
             for(i=1;i<=n;i++) if(bits[i]!=baseline[i]) {
               if(length(bits[i])!=1 || length(baseline[i])!=1) exit 3
               if(bits[i]!="0" || baseline[i]!="1") exit 4
               changed++
             }
             if(changed!=1) exit 5
            }
            END {if(changed!=1) exit 6}
          ' "$law" "$mutant"
          echo 'CI_GLUE_NO_SEMANTICS one D1 bit mutation verified'
          program=tests/semantic/core-sentinel-null-mutant.sens
          printf '0\n' > "$RUNNER_TEMP/core-sentinel-mutant-expected"
          sha256sum "$program" "$mutant"
          echo "test_id=core-sentinel-null-mutant layer=eval semantic_authority=binary-SENS"
          python3 scripts/ci_failure_contract.py run \
            --test-id core-sentinel-null-mutant \
            --layer eval \
            --fixture "$program" \
