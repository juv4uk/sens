      - name: Reason-index — 2 SENS-owned D4/D5 selector witnesses
        id: reason-selectors
        # Keep following native SENS witnesses running; the final fail-closed
        # scanner still blocks CI via steps.reason-selectors.outcome on failure.
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/sens-focal-red.jsonl"
          law=tests/semantic/reason-index-width-selectors-law.sens
          mutant=tests/semantic/reason-index-width-selectors-mutant.sens
          printf '1\n' > "$RUNNER_TEMP/reason-selectors-law.expected"
          # Exact D4 one-bit mutation: CADR 1001 -> CAAR 1000.
          # Current mutant reaches a noncallable D1:0 identity; native SENS
          # must reject it rather than return the unmutated D1:YES verdict.
          sha256sum "$law" "$mutant"
          for kind in law mutant; do
            source="tests/semantic/reason-index-width-selectors-${kind}.bits"
            physical="tests/semantic/reason-index-width-selectors-${kind}.sens"
            tr -s '[:space:]' '\n' < "$source" | sed '/^$/d' > "$RUNNER_TEMP/reason-${kind}-source.words"
            target/debug/sens-trit open "$physical" | tr -s '[:space:]' '\n' | sed '/^$/d' > "$RUNNER_TEMP/reason-${kind}-physical.words"
            cmp "$RUNNER_TEMP/reason-${kind}-source.words" "$RUNNER_TEMP/reason-${kind}-physical.words"
          done
          mapfile -t original < "$RUNNER_TEMP/reason-law-source.words"
          mapfile -t changed < "$RUNNER_TEMP/reason-mutant-source.words"
          test "${#original[@]}" -eq "${#changed[@]}"
          flips=0
          for ((i=0; i<${#original[@]}; i++)); do
            if [[ "${original[i]}" != "${changed[i]}" ]]; then
              [[ "${original[i]}" == 1001 && "${changed[i]}" == 1000 ]] || {
                echo "::error::REASON_SELECTOR_MUTANT_NOT_EXACT_D4_CADR_CAAR word=$i"; exit 1;
              }
              flips=$((flips + 1))
            fi
          done
          test "$flips" -eq 1 || { echo "::error::REASON_SELECTOR_MUTANT_NOT_ONE_BIT flips=$flips"; exit 1; }
          echo "REASON_SELECTOR_ONE_BIT_PASS D4:1001->D4:1000 native_T5_words_verified=1"
          python3 scripts/ci_failure_contract.py run \
            --test-id sens-reason-index-width-selectors-law \
            --layer eval \
            --fixture "$law" \
            --expected-file "$RUNNER_TEMP/reason-selectors-law.expected" \
            --report-file "$report" \
            --executor-report-file "$RUNNER_TEMP/sens-native-evidence.jsonl" \
            -- target/debug/sens "$law"
          python3 scripts/ci_failure_contract.py run \
            --test-id sens-reason-index-width-selectors-mutant \
            --layer eval \
            --fixture "$mutant" \
            --expect-error-substring "not callable" \
            --report-file "$report" \
            --executor-report-file "$RUNNER_TEMP/sens-native-evidence.jsonl" \
            -- target/debug/sens "$mutant"
          # This fallthrough is executed, not a dead-branch proxy.
          # This current one-bit D1:0 -> D1:1 mutation selects the forbidden
          # native D1:0 call-head branch. SENS must reject it, not return NIL.
          if grep -Fq '(010 ())' lib/reason.lisp; then
            echo '::error::REGRESSION: synthetic D3 ATOM(()) fallback in reason.lisp'
            exit 1
          fi
          grep -Fq '#d1:1' lib/reason.lisp
          for kind in law mutant; do
            source="tests/semantic/reason-direct-fallback-d1-${kind}.bits"
            physical="tests/semantic/reason-direct-fallback-d1-${kind}.sens"
            tr -s '[:space:]' '\n' < "$source" | sed '/^$/d' > "$RUNNER_TEMP/reason-d1-${kind}-source.words"
            target/debug/sens-trit open "$physical" | tr -s '[:space:]' '\n' | sed '/^$/d' > "$RUNNER_TEMP/reason-d1-${kind}-physical.words"
            cmp "$RUNNER_TEMP/reason-d1-${kind}-source.words" "$RUNNER_TEMP/reason-d1-${kind}-physical.words"
          done
          original=( $(cat "$RUNNER_TEMP/reason-d1-law-source.words") )
          changed=( $(cat "$RUNNER_TEMP/reason-d1-mutant-source.words") )
          test "${#original[@]}" -eq "${#changed[@]}"
          flips=0
          for ((i=0; i<${#original[@]}; i++)); do
            if [[ "${original[i]}" != "${changed[i]}" ]]; then
              [[ "$i" -eq 18 && "${original[i]}" == 0 && "${changed[i]}" == 1 ]] || { echo "::error::REASON_D1_MUTANT_NOT_CANONICAL index=$i"; exit 1; }
              flips=$((flips + 1))
            fi
          done
          test "$flips" -eq 1
          printf '1\n' > "$RUNNER_TEMP/reason-d1.expected"
          python3 scripts/ci_failure_contract.py run \
            --test-id reason-direct-fallback-d1-law \
            --layer eval \
            --fixture tests/semantic/reason-direct-fallback-d1-law.sens \
            --expected-file "$RUNNER_TEMP/reason-d1.expected" \
            --report-file "$report" \
            --executor-report-file "$RUNNER_TEMP/sens-native-evidence.jsonl" \
            -- target/debug/sens tests/semantic/reason-direct-fallback-d1-law.sens
          python3 scripts/ci_failure_contract.py run \
            --test-id reason-direct-fallback-d1-mutant \
            --layer eval \
            --fixture tests/semantic/reason-direct-fallback-d1-mutant.sens \
            --expect-error-substring "not callable" \
            --report-file "$report" \
            --executor-report-file "$RUNNER_TEMP/sens-native-evidence.jsonl" \
            -- target/debug/sens tests/semantic/reason-direct-fallback-d1-mutant.sens
