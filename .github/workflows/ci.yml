name: SENS — один точковий автоматичний двійковий закон

# Рівно один автоматичний job; лише SENS визначає семантичний результат.
# Один центральний workflow: positive law + fail-closed guards.
# Every branch push and pull_request receives one central SENS witness; no extra automatic workflows.
# No paths filter: docs, implementation, migration, and workflow changes all trigger.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Each commit gets its own slot; GitHub otherwise replaces older PENDING runs.
  group: sens-one-focussed-${{ github.repository }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  binary-sens-law:
    name: Часові D1 предикати — один фізичний SENS-свідок і чинні негативні контроли
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          # HEAD^ is required by the fail-closed D3 source-delta guard.
          fetch-depth: 2
      - name: Встановити Zig 0.16.0 для типового транспортного кодека
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --silent --show-error \
            https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz \
            --output "$RUNNER_TEMP/zig-0.16.0.tar.xz"
          echo '70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00  '"$RUNNER_TEMP/zig-0.16.0.tar.xz" | sha256sum --check --status
          tar -xJf "$RUNNER_TEMP/zig-0.16.0.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/zig-x86_64-linux-0.16.0" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/zig-x86_64-linux-0.16.0/zig" version
      - name: Zig — чистота фізичного референсу та точні транспортні тести
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci_zig_purity.py --self-test
          python3 scripts/ci_zig_purity.py --report "$RUNNER_TEMP/sens-zig-purity.json"
          zig test research/zig-codecs/tests.zig -lc
          zig test research/zig-codecs/transport/e1_writer.zig
      - name: Синтаксис усіх YAML-файлів репозиторію
        id: yaml-syntax
        shell: ruby {0}
        run: |
          require "yaml"

          paths = Dir.glob("**/*.{yml,yaml}", File::FNM_DOTMATCH)
                     .select { |path| File.file?(path) && !path.split("/").include?(".git") }
                     .sort
          failures = []

          paths.each do |path|
            begin
              YAML.parse_stream(File.read(path))
            rescue Psych::Exception => error
              detail = error.message.lines.first.to_s.strip
              failures << [path, detail]
            end
          end

          puts "YAML_SYNTAX_AUDIT checked=#{paths.length} failed=#{failures.length}"
          failures.each do |path, detail|
            puts "YAML_SYNTAX_FAILURE path=#{path} detail=#{detail}"
            warn "::error file=#{path}::#{detail.gsub("%", "%25").gsub("\r", "%0D").gsub("\n", "%0A")}"
          end
          exit(failures.empty? ? 0 : 1)
      - name: Міграція — нуль адміністративних HOLD, усі файли доступні для роботи
        shell: bash
        run: |
          set -euo pipefail
          # CI_GLUE_NO_SEMANTICS: test migration eligibility/provenance only.
          # A semantic PASS requires independent native physical SENS elsewhere.
          bash -n scripts/migrate-active-lib-exact.sh
          python3 tests/test_domain_ladder_source_batch.py BatchSourceTests.test_macro_and_machine_sources_are_assessed_not_name_blocked BatchSourceTests.test_forward_assert_fact_quotes_exact_d3_cons
          python3 tests/test_migrate_sens.py \
            OperationalMigrationTests.test_reviewed_paths_can_be_pinned_for_migration_repair \
            OperationalMigrationTests.test_missing_review_ledger_does_not_freeze_unrelated_work \
            OperationalMigrationTests.test_historical_snapshot_can_be_inspected_without_path_hold \
            OperationalMigrationTests.test_mixed_manifest_no_old_classification_veto \
            OperationalMigrationTests.test_stale_classifier_does_not_veto_genuine_sha_pins
          python3 tests/test_plan_t5_agent_work.py -v
      - name: Не допустити жодного іншого автоматичного workflow
        id: budget
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci_one_focused_workflow.py
          python3 scripts/ci_executor_invariant.py
          python3 scripts/ci_failure_contract.py self-test
          python3 scripts/check-domain-ladder-identity.py --self-test --check
          # Instrumental migration proof, not an alternate semantic oracle.
          # Failures retain fixture, command and actual output via RED contract.
          report="$RUNNER_TEMP/sens-focal-red.jsonl"
          : > "$report"
          python3 scripts/ci_failure_contract.py run \
            --test-id exact-domain-migrator-d3-d4 \
            --layer encode \
            --fixture tests/test_migrate_exact_domain.py \
            --report-file "$report" \
            -- python3 -m unittest discover -s tests -p test_migrate_exact_domain.py -v
      - uses: dtolnay/rust-toolchain@1.99.0
      - name: Мігратор exact-domain — Rust перевіряє лише механічний W8 firewall
        shell: bash
        run: |
          set -euo pipefail
          echo "test_id=sens-to-sens-no-w8-as-domain layer=encode executor=rust-mechanical semantic_authority=ratified-domain-index"
          cargo test --locked -p sens-cli --bin sens-to-sens -- --nocapture
      - name: CLIPS defrule — адресна перевірка роботи SENS через Rust-транспорт
        if: contains(github.event.head_commit.message, '[clips-defrule-once]')
        shell: bash
        run: |
          set -euo pipefail
          echo "test_id=clips-defrule-d4-split layer=transport executor=rust-integration-not-native-T5 semantic_authority=SENS"
          sha256sum lib/clips-import.lisp crates/sens/tests/clips_import.rs
          cargo test --locked -p sens --test clips_import clips_defrule_ -- --nocapture
          cargo test --locked -p sens --test clips_import clips_deftemplate_applies_inside_defrule_conditions_and_conclusions -- --exact --nocapture
      - name: ФС — відхилення невідомих та обірваних подій журналу, без D24
        if: contains(github.event.head_commit.message, '[fs-journal-once]')
        shell: bash
        run: |
          set -euo pipefail
          # CI_GLUE_NO_SEMANTICS: цей Cargo runner лише виконує чинні
          # SENS-функції через pinned reader. Не називати це native .sens PASS.
          # Окрема повна фікстура з fs-write залишається активною в Cargo,
          # але її D6 ADD1(revision=unqualified) є TRANSITIONAL D24 blocker.
          sha256sum lib/lisp-fs.lisp crates/sens/tests/content_store.rs
          python3 scripts/ci_failure_contract.py run \
            --test-id fs-journal-reject-invalid-events-integration \
            --layer transport \
            --fixture crates/sens/tests/content_store.rs \
            --report-file "$RUNNER_TEMP/sens-fs-journal-red.jsonl" \
            -- cargo test --locked -p sens --test content_store \
                 lisp_fs_journal_replay_rejects_ -- --nocapture
      - name: UTF-8 — 2 структурні SENS D1 вердикти й однобітний негативний контроль
        if: contains(github.event.head_commit.message, '[utf8-d1-once]')
        shell: bash
        run: |
          set -euo pipefail
          echo "test_id=utf8-direct-d1-self-verdict layer=transport semantic_authority=SENS executor=rust-transport"
          sha256sum lib/utf8.lisp tests/semantic/utf8-direct-d1-law.lisp crates/sens/tests/utf8.rs
          python3 scripts/ci_failure_contract.py run \
            --test-id utf8-direct-d1-self-verdict \
            --layer transport \
            --fixture tests/semantic/utf8-direct-d1-law.lisp \
            --report-file "$RUNNER_TEMP/sens-utf8-direct-d1-red.jsonl" \
            -- cargo test --locked -p sens --test utf8 \
                 utf8_direct_d1_self_verdict_and_one_bit_mutant -- --exact --nocapture
      - name: Meta Canon — exact D1 non-atom and one-bit mutant
        if: contains(github.event.head_commit.message, '[canon-meta-once]')
        shell: bash
        run: |
          set -euo pipefail
          echo "test_id=meta-canon-nonatom layer=transport semantic_authority=SENS executor=rust-transport"
          sha256sum lib/meta-eval.lisp crates/sens/tests/canon_immutability_meta.rs tests/semantic/meta-canon-nonatom-d1-law.lisp
          python3 scripts/ci_failure_contract.py run \
            --test-id meta-canon-nonatom \
            --layer transport \
            --fixture tests/semantic/meta-canon-nonatom-d1-law.lisp \
            --report-file "$RUNNER_TEMP/sens-meta-canon-nonatom-red.jsonl" \
            -- cargo test --locked -p sens --test canon_immutability_meta \
                 meta_canon_nonatom_is_sens_owned -- --exact --nocapture
      - name: World LCA — SENS self-verdict and one-bit falsifier
        shell: bash
        run: |
          set -euo pipefail
          echo "test_id=world-ancestor-sens-self-verdicts semantic_authority=SENS"
          sha256sum lib/world.lisp crates/sens/tests/world_ancestor_sens.rs tests/semantic/world-exact-arity-witness.lisp tests/semantic/world-ancestor-d1-law.lisp tests/semantic/world-ancestor-d1-mutant.lisp
          cargo test --locked -p sens --test world_ancestor_sens -- --nocapture
      - name: Compiler N0 — SENS D1 proper-list law і однобітний mutant
        if: contains(github.event.head_commit.message, '[compiler-list-once]')
        shell: bash
        run: |
          set -euo pipefail
          echo "test_id=compiler-program-list-sens-fail-closed layer=transport semantic_authority=SENS"
          sha256sum lib/compiler-nucleus.lisp crates/sens/tests/compiler_nucleus_sens.rs tests/semantic/compiler-program-list-d1-law.lisp tests/semantic/compiler-program-list-d1-mutant.lisp
          cargo test --locked -p sens --test compiler_nucleus_sens compiler_program_list_fail_closed_is_sens_owned -- --exact --nocapture
      - name: D1 source census — direct predicate bits, no wrapper constructors
        id: source-census
        shell: bash
        run: |
          set -euo pipefail
          code="$(sed '/^[[:space:]]*;/d' lib/time.lisp)"
          true_count="$(printf '%s\n' "$code" | grep -oF '#d1:1' | wc -l | tr -d ' ')"
          false_count="$(printf '%s\n' "$code" | grep -oF '#d1:0' | wc -l | tr -d ' ')"
          legacy_true=0
          legacy_false=0
          if printf '%s\n' "$code" | grep -Fq '(010 (001 ()))'; then legacy_true=1; fi
          if printf '%s\n' "$code" | grep -Fq '(101 (001 (0)) (001 (1)))'; then legacy_false=1; fi
          sha256sum lib/time.lisp
          printf 'TIME_D1_SOURCE_BITS true=%s false=%s legacy_true=%s legacy_false=%s\n' "$true_count" "$false_count" "$legacy_true" "$legacy_false"
          test "$true_count" -eq 20
          test "$false_count" -eq 4
          test "$legacy_true" -eq 0
          test "$legacy_false" -eq 0
      - name: Зібрати тільки механізм виконання SENS
        id: build
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/sens-focal-red.jsonl"
          : > "$report"
          : > "$RUNNER_TEMP/sens-native-evidence.jsonl"
          python3 scripts/ci_failure_contract.py run \
            --test-id one-sens-transport-build \
            --layer transport \
            --fixture tests/semantic/time-d1-predicate-law.sens \
            --report-file "$report" \
            -- cargo build --locked -p sens-cli --bin sens --bin sens-trit
      - name: "E1 / T5 / F3C — реальна фізична вартість 16 точних двійкових програм"
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$RUNNER_TEMP/zig-x86_64-linux-0.16.0:$PATH"
          echo 'test_id=e1-t5-f3c-size-corpus layer=transport authority=SENS benchmark=PHYSICAL_SIZE_ONLY'
          cargo test --locked -p sens --lib \
            universal_frame3::tests::e1_t5_f3c_exact_physical_size_matrix \
            -- --exact --nocapture | tee "$RUNNER_TEMP/e1-carrier-size.log"
          grep -Fxq 'test universal_frame3::tests::e1_t5_f3c_exact_physical_size_matrix ... ok' "$RUNNER_TEMP/e1-carrier-size.log"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import os
          import re

          base = Path(os.environ["RUNNER_TEMP"])
          lines = (base / "e1-carrier-size.log").read_text().splitlines()
          records = []
          pattern = re.compile(
              r"^E1_SIZE_RECORD case=(\w+) words=(\d+) exact_bits=(\d+) "
              r"e1_bytes=(\d+) t5_bytes=(\d+|NA) f3c_bytes=(\d+|NA)$"
          )
          for line in lines:
              match = pattern.fullmatch(line)
              if match:
                  name, count, bits, e1, t5, f3c = match.groups()
                  records.append({
                      "case": name, "words": int(count), "exact_bits": int(bits),
                      "e1_bytes": int(e1),
                      "t5_bytes": None if t5 == "NA" else int(t5),
                      "f3c_bytes": None if f3c == "NA" else int(f3c),
                  })
          summaries = [line for line in lines if line.startswith("E1_SIZE_SUMMARY ")]
          if len(records) != 16 or len({r["case"] for r in records}) != 16 or len(summaries) != 1:
              raise SystemExit(
                  f"E1_SIZE_UNINFORMATIVE_OUTPUT records={len(records)} "
                  f"unique={len({r['case'] for r in records})} summaries={len(summaries)}"
              )
          summary = dict(token.split("=", 1) for token in summaries[0].split()[1:])
          comparable = [r for r in records if r["t5_bytes"] is not None]
          assert int(summary["cases"]) == 16
          assert int(summary["t5_representable"]) == len(comparable)
          assert int(summary["f3c_eligible"]) == sum(r["f3c_bytes"] is not None for r in records)
          assert int(summary["sum_e1_bytes"]) == sum(r["e1_bytes"] for r in records)
          assert int(summary["sum_t5_comparable_bytes"]) == sum(r["t5_bytes"] for r in comparable)
          assert int(summary["e1_smaller"]) == sum(r["e1_bytes"] < r["t5_bytes"] for r in comparable)
          assert int(summary["t5_smaller"]) == sum(r["e1_bytes"] > r["t5_bytes"] for r in comparable)
          assert int(summary["equal"]) == sum(r["e1_bytes"] == r["t5_bytes"] for r in comparable)
          assert summary["speed"] == "NOT_MEASURED"
          assert summary["semantic_authority"] == "SENS"
          # The 16 E1 byte-parity fixtures do not include an F3C-eligible
          # program; measure one separately *known* executable tiny F3C case.
          # Never pad NA entries with zero bytes or add it to the 16-case sum.
          tiny_pattern = re.compile(
              r"^E1_F3C_TINY_REFERENCE case=admitted_quote words=(\d+) "
              r"exact_bits=(\d+) e1_bytes=(\d+) t5_bytes=4 f3c_bytes=3 "
              r"semantic_authority=SENS$"
          )
          tiny = [m for line in lines if (m := tiny_pattern.fullmatch(line))]
          if len(tiny) != 1:
              raise SystemExit(f"E1_TINY_F3C_REFERENCE_UNINFORMATIVE matches={len(tiny)}")
          tiny_record = {
              "case": "admitted_quote",
              "words": int(tiny[0].group(1)),
              "exact_bits": int(tiny[0].group(2)),
              "e1_bytes": int(tiny[0].group(3)),
              "t5_bytes": 4,
              "f3c_bytes": 3,
              "provenance": "frame3_small::tests::produce_tiny_f3_only_when_full_file_is_smaller",
          }
          assert tiny_record["words"] >= 1 and tiny_record["exact_bits"] >= 1
          assert tiny_record["e1_bytes"] >= 8
          corpus = Path("research/zig-codecs/transport/fixtures/e1-v1.bits")
          evidence = {
              "schema": "sens-e1-carrier-size/v1",
              "git_sha": os.environ["GITHUB_SHA"],
              "corpus_sha256": hashlib.sha256(corpus.read_bytes()).hexdigest(),
              "measurement": "physical_bytes_only_not_latency",
              "semantic_authority": "SENS",
              "e1_default": False,
              "summary": summary,
              "records": records,
              "tiny_f3c_reference": tiny_record,
          }
          (base / "e1-carrier-size.json").write_text(
              json.dumps(evidence, ensure_ascii=False, indent=2) + "\n"
          )
          print(
              f"E1_CARRIER_SIZE_PASS cases={len(records)} "
              f"t5_comparable={len(comparable)} "
              f"f3c_eligible={summary['f3c_eligible']} "
              f"tiny_f3c_bytes=3 tiny_t5_bytes=4 "
              f"tiny_e1_bytes={tiny_record['e1_bytes']} "
              f"corpus_sha256={evidence['corpus_sha256']} speed=NOT_MEASURED"
          )
          PY
      - name: "E1 CLI → лише SENS: позитивний D1, однобітний мутант і CRC"
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$RUNNER_TEMP/zig-x86_64-linux-0.16.0:$PATH"
          cargo test --locked -p sens-cli --bin sens-trit \
            e1_cli_mechanism_tests::explicit_e1_cli_uses_exact_native_sens_semantic_verdict \
            -- --exact --nocapture | tee "$RUNNER_TEMP/sens-e1-cli-unit.log"
          grep -Fxq 'test e1_cli_mechanism_tests::explicit_e1_cli_uses_exact_native_sens_semantic_verdict ... ok' "$RUNNER_TEMP/sens-e1-cli-unit.log"
          bin=target/debug/sens-trit
          "$bin" backend
          test -x "$bin"
          for test_case in positive mutant; do
            if [[ "$test_case" == positive ]]; then
              fixture=tests/fixtures/semantic/exact-d3-logic-selftest.sens
            else
              fixture=tests/fixtures/semantic/exact-d3-logic-mutant.sens
            fi
            cp "$fixture" "$RUNNER_TEMP/e1-$test_case.sens"
            "$bin" encode-e1 "$RUNNER_TEMP/e1-$test_case.sens"
            test -s "$RUNNER_TEMP/e1-$test_case.e1"
            "$bin" eval "$RUNNER_TEMP/e1-$test_case.sens" > "$RUNNER_TEMP/e1-$test_case-t5.verdict"
            "$bin" eval-e1 "$RUNNER_TEMP/e1-$test_case.e1" > "$RUNNER_TEMP/e1-$test_case-e1.verdict"
            cmp "$RUNNER_TEMP/e1-$test_case-t5.verdict" "$RUNNER_TEMP/e1-$test_case-e1.verdict" || {
              echo "::error::E1_CLI_SENS_VERDICT_MISMATCH case=$test_case"; exit 1;
            }
            echo "E1_NATIVE_SENS_CLI_PASS case=$test_case"
            sha256sum "$fixture" "$RUNNER_TEMP/e1-$test_case.e1"
          done
          if cmp -s "$RUNNER_TEMP/e1-positive-e1.verdict" "$RUNNER_TEMP/e1-mutant-e1.verdict"; then
            echo "::error::E1_CLI_D1_MUTANT_DID_NOT_CHANGE_SENS_RESULT"; exit 1
          fi
          cp "$RUNNER_TEMP/e1-positive.e1" "$RUNNER_TEMP/e1-corrupt.e1"
          python3 - "$RUNNER_TEMP/e1-corrupt.e1" <<'PY'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          data = bytearray(p.read_bytes())
          data[-1] ^= 1  # Physical CRC mutant only, never semantic truth.
          p.write_bytes(data)
          PY
          if "$bin" eval-e1 "$RUNNER_TEMP/e1-corrupt.e1" > "$RUNNER_TEMP/e1-corrupt.out" 2> "$RUNNER_TEMP/e1-corrupt.err"; then
            echo "::error::E1_CLI_FAIL_OPEN_CORRUPTED_CRC"; exit 1
          fi
          grep -q 'Integrity' "$RUNNER_TEMP/e1-corrupt.err" || {
            echo "::error::E1_CLI_REJECTION_UNINFORMATIVE"; exit 1;
          }
          echo 'E1_NATIVE_SENS_CLI_VERDICTS_PASS: positive/mutant differ, T5 matches E1, CRC fails closed'

      - name: Фізичний T5-оракул — справжній sens-trit читає фізичний SENS (не Python-істина)
        id: t5-oracle
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/sens-focal-red.jsonl"
          sha256sum target/debug/sens-trit tests/test_approved_t5_transaction.py
          SENS_TRIT_BIN="$PWD/target/debug/sens-trit" \
          python3 scripts/ci_failure_contract.py run \
            --test-id approved-t5-physical-oracle \
            --layer encode \
            --fixture tests/test_approved_t5_transaction.py \
            --report-file "$report" \
            -- python3 -m unittest discover -s tests -p test_approved_t5_transaction.py -v
      # Manual, deeper suite has independent witnesses, never an automatic green claim.
      - name: SENS_NATIVE_T5_CORPUS — 8 власних D1-законів, 3 негативних свідки
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[sens-native-run]'))
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/test-current-semantic-slice.sh --native-binary-only
      - name: Core migration — native SENS D4-vs-D8 exact-width law
        id: core-width-law
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/sens-focal-red.jsonl"
          program="tests/semantic/native-t5/core-d4-vs-d8-width-law.sens"
          projection="tests/semantic/native-t5/core-d4-vs-d8-width-law.bits"
          # Python transports bits only. Native SENS decides EQ, COND and D1.
          PYTHONPATH=scripts python3 - "$projection" "$program" <<'PY'
          from pathlib import Path
          import sys
          from sens_t5_codec import decode_bytes, parse_words
          if decode_bytes(Path(sys.argv[2]).read_bytes()) != parse_words(Path(sys.argv[1]).read_text(encoding="utf-8")):
              raise SystemExit("CORE_D4_D8_T5_TRANSPORT_MISMATCH")
          PY
          printf '1\n' > "$RUNNER_TEMP/core-d4-vs-d8.expected"
          sha256sum "$projection" "$program" target/debug/sens lib/core.lisp
          python3 scripts/ci_failure_contract.py run \
            --test-id core-d4-vs-d8-width-law \
            --layer eval \
            --fixture "$program" \
            --expected-file "$RUNNER_TEMP/core-d4-vs-d8.expected" \
            --report-file "$report" \
            --executor-report-file "$RUNNER_TEMP/sens-native-evidence.jsonl" \
            -- target/debug/sens "$program"
      - name: GUARD_ONCE — точний D3:001 проти історичного W8 QUOTE (Rust лише механізм)
        if: contains(github.event.head_commit.message, '[guard-once]')
        id: guard-once
        shell: bash
        run: |
          set -euo pipefail
          echo "test_id=guard-evidence-status-d3-width layer=parse mechanical_only=true semantic_pass=false"
          sha256sum knowledge/guard-reference.lisp crates/sens-lsp/src/guard_knowledge.rs
          cargo test --locked -p sens-lsp guard_evidence_status_uses_exact_d3_data_without_w8_alias -- --nocapture
          cargo test --locked -p sens-lsp guard_topics_preserves_three_exact_d3_quotes_and_rejects_w8_mutants -- --nocapture
