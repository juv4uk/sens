      - name: "D5–D10 — точкові самосвідки SENS (Canon і PAIP)"
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/sens-focal-red.jsonl"
          record_red() {
            local id="$1" fixture="$2" expected_value="$3" actual_value="$4" stderr_tail="${5:-}" reproduce="${6:-target/debug/sens $2}"
            python3 scripts/ci_failure_contract.py record-diff \
              --test-id "$id" --layer eval --fixture "$fixture" \
              --expected "$expected_value" --actual "$actual_value" \
              --reproduce "$reproduce" \
              --report-file "$report" --stderr-tail "$stderr_tail"
