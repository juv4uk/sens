      - name: Двійковий закон арності знань — рівно D3/D4 і точний D1:YES
        id: knowledge
        shell: bash
        run: |
          set -euo pipefail
          # Source form is checked mechanically. Actual semantics: native SENS.
          code="$(sed '/^[[:space:]]*;/d' lib/knowledge.lisp)"
          if printf '%s\n' "$code" | grep -Fq '(010 (001 (0)))'; then
            echo '::error::KNOWLEDGE_LEGACY_D1_FALSE'
            exit 1
          fi
          if printf '%s\n' "$code" | grep -Fq '(010 ())'; then
            echo '::error::KNOWLEDGE_LEGACY_D1_TRUE'
            exit 1
          fi
          grep -Fq '((0101 value) #d1:1)' lib/knowledge.lisp
          grep -Fq '((010 value) #d1:0)' lib/knowledge.lisp
          grep -Fq '((010 journal) #d1:0)' lib/knowledge.lisp
          if sed '/^[[:space:]]*;/d' lib/knowledge.lisp | grep -Fq '(010 (001 ()))'; then
            echo '::error::KNOWLEDGE_MACRO_LEGACY_D1_TRUE'
            exit 1
          fi
          grep -Fq '(1110 #d1:1' lib/knowledge.lisp
          program=tests/semantic/knowledge-exact-arity-structure.sens
          report="$RUNNER_TEMP/sens-focal-red.jsonl"
          printf '1\n' > "$RUNNER_TEMP/expected-knowledge-d1"
          echo "test_id=knowledge-exact-arity-structure layer=eval semantic_authority=binary-SENS"
          sha256sum "$program"
          python3 scripts/ci_failure_contract.py run \
            --test-id knowledge-exact-arity-structure \
            --layer eval \
            --fixture "$program" \
            --expected-file "$RUNNER_TEMP/expected-knowledge-d1" \
