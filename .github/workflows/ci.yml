          cargo test --locked -p sens --test understand_exact_empty -- --nocapture
          # Незалежний обмежений runtime-свідок D3/D6 до інтерпретації рівнів.
          cargo test --locked -p sens --test island_lowering_ukr_runtime -- --nocapture
          # Чинний SENS CLI: не підміняємо обчислення друком ефектів.
          cargo test --locked -p sens-cli --test cli український_лінтер_повертає_точні_результати_без_незвязаних_d1 -- --exact --nocapture
          cargo test --locked -p sens-cli --test cli український_скрипт_відбирає_саме_запитаний_рівень -- --exact --nocapture
          # Реальне SENS виконання українських D1/D3 правил:
