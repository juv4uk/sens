      - name: Rust→project dependency ledger (Zig-only burndown)
        # Rust must reach lib/contract/contracts/knowledge ONLY via the sterile Zig
        # corridor. This writes the burndown ledger and fails if a NEW direct
        # dependency appeared -- the set may only shrink.
        shell: bash
        run: |
          set -euo pipefail
