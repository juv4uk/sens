          CARGO_BUILD_JOBS=2 CARGO_INCREMENTAL=0 timeout 180s cargo test --locked -p sens --test clips_import clips_text_data_uses_current_sens_d7_d8_d9_without_legacy_string_literals -- --exact --nocapture

