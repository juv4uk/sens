name: SENS — один точковий автоматичний двійковий закон

# Рівно один автоматичний job; лише SENS визначає семантичний результат.
# Один центральний workflow: positive law + fail-closed guards.
# Every branch push and pull_request receives one central SENS witness; no extra automatic workflows.
# No paths filter: docs, implementation, migration, and workflow changes all trigger.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Warnings are errors: any rustc warning in our own crates fails the build/test.
# (cargo passes --cap-lints allow to dependencies, so this targets our code.)
env:
  RUSTFLAGS: "-D warnings"
  RUSTDOCFLAGS: "-D warnings"

concurrency:
  # Each commit gets its own slot; GitHub otherwise replaces older PENDING runs.
  group: sens-one-focussed-${{ github.repository }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  binary-sens-law:
    name: Часові D1 предикати — один фізичний SENS-свідок і чинні негативні контроли
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: "GUARD — warnings are fatal (RUSTFLAGS must keep -D warnings)"
        shell: bash
        run: |
          set -euo pipefail
          # Permanent: no commit may silently drop the fatal-warnings policy.
          case "${RUSTFLAGS:-}" in
            *"-D warnings"*) echo "RUSTFLAGS ok: $RUSTFLAGS" ;;
            *) echo "::error::RUSTFLAGS must contain '-D warnings' (warnings are fatal by owner policy)"; exit 1 ;;
          esac
          case "${RUSTDOCFLAGS:-}" in
            *"-D warnings"*) echo "RUSTDOCFLAGS ok: $RUSTDOCFLAGS" ;;
            *) echo "::error::RUSTDOCFLAGS must contain '-D warnings'"; exit 1 ;;
          esac
      - name: "SENS-DEFINITIONS — визначені функції: баланс, дублі, ратифіковані імена"
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check-sens-definitions.py
      - name: Встановити Zig 0.16.0 для типового транспортного кодека
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --silent --show-error \
            https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz \
            --output "$RUNNER_TEMP/zig-0.16.0.tar.xz"
          echo '70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00  '"$RUNNER_TEMP/zig-0.16.0.tar.xz" | sha256sum --check --status
          tar -xJf "$RUNNER_TEMP/zig-0.16.0.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/zig-x86_64-linux-0.16.0" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/zig-x86_64-linux-0.16.0/zig" version
      - uses: dtolnay/rust-toolchain@1.99.0

      - name: RUST↔ZIG — зібрати sens-host і sens-cli з точними пінами
        id: sens-host-build
        shell: bash
        run: |
          set -euo pipefail
          # Pass the already SHA-verified Zig binary explicitly to Cargo build.rs.
          # The sens-host crate by itself depends only on sens, so it does NOT
          # exercise the Rust -> Zig static archive link.
          export ZIG="$RUNNER_TEMP/zig-x86_64-linux-0.16.0/zig"
          test -x "$ZIG"
          test "$(cat .zig-version)" = "$("$ZIG" version)"
          rustc --version | grep -F 'rustc 1.99.0 '
          cargo tree --locked -p sens-cli >/dev/null
          cargo build --locked -p sens-host
          # This default Zig-enabled crate invokes build.rs, builds the Zig
          # physical ABI archive and links it into both executable Rust hosts.
          cargo build --locked -p sens-cli --features zig-transport --bin sens --bin sens-trit
          shopt -s nullglob
          archives=(target/debug/build/sens-cli-*/out/libsens_zig_transport.a)
          if (( ${#archives[@]} == 0 )); then
            echo '::error::RUST_ZIG_BUILD_NO_ARCHIVE expected a real Zig static library' >&2
            exit 1
          fi
          for archive in "${archives[@]}"; do
            test -s "$archive"
            sha256sum "$archive"
          done

      - name: D3–D6 — 28 незалежних фізичних SENS-законів через Zig/T5
        id: sens-d3-d6-t5-laws
        shell: bash
        run: |
          set -euo pipefail
          # .bits is a visible exact-word witness, not executable textual Lisp.
          # Runtime .lisp below is only a temporary input to the existing Zig T5 encoder.
          # Canonical .sens executes in SENS without implicit Core4 or Rust fallback.
          source="tests/semantic/d3-d6-28-native.bits"
          physical_dir="$RUNNER_TEMP/sens-d3-d6-28"
          mkdir -p "$physical_dir"
          mapfile -t laws < "$source"
          labels=(d3-car d3-cdr d3-atom-positive d3-atom-negative d3-eq-positive d3-eq-negative d4-caar d4-cadr d4-cdar d4-cddr d4-not-d1-no d4-null-empty d4-null-nonempty d5-cdaar d5-cdadr d5-cddar d5-cdddr d5-caaar d5-caadr d5-cadar d5-caddr d5-onebit-selector-order d6-acons-key d6-acons-value d6-acons-negative-swap d6-compose d6-flip d6-flip-negative)
          if (( ${#laws[@]} != 28 || ${#labels[@]} != 28 )); then
            echo "::error::SENS_D3_D6_CENSUS expected=28 actual=${#laws[@]} labels=${#labels[@]}"
            exit 1
          fi
          expected="$physical_dir/expected-d1"
          printf '1\n' > "$expected"
          for i in "${!laws[@]}"; do
            number=$((i+1))
            test_id="sens-d3-d6-$(printf '%02d' "$number")-${labels[$i]}"
            case_source="$physical_dir/$(printf '%02d' "$number").lisp"
            printf '%s\n' "${laws[$i]}" > "$case_source"
            # SENS exact D2 admission before Zig v2 T5 output. No Python packer.
            target/debug/sens-trit encode "$case_source"
            physical="${case_source%.lisp}.sens"
            actual_words="$(target/debug/sens-trit open "$physical")"
            if [[ "$actual_words" != "${laws[$i]}" ]]; then
              echo "::error::SENS_D3_D6_T5_PARITY id=$test_id layer=transport first_mismatch=visible_exact_words"
              sha256sum "$case_source" "$physical"
              exit 1
            fi
            sha256sum "$case_source" "$physical"
            python3 scripts/ci_failure_contract.py run \
              --test-id "$test_id" \
              --layer eval \
              --fixture "$physical" \
              --expected-file "$expected" \
              --executor-report-file "$RUNNER_TEMP/sens-native-evidence.jsonl" \
              --report-file "$RUNNER_TEMP/sens-focal-red.jsonl" \
              -- target/debug/sens "$physical"
          done
          # Existing one-bit D5 positive→mutant is a separate genuine fail-closed executor law.
          cp tests/semantic/d3-d5-direct-selector-mutant.lisp "$physical_dir/mutant.lisp"
          target/debug/sens-trit encode "$physical_dir/mutant.lisp"
          python3 scripts/ci_failure_contract.py run \
            --test-id sens-d3-d6-d5-onebit-noncallable \
            --layer eval \
            --fixture "$physical_dir/mutant.sens" \
            --expect-error-substring "domain identity is not callable under its ratified law: D1" \
            --executor-report-file "$RUNNER_TEMP/sens-native-evidence.jsonl" \
            --report-file "$RUNNER_TEMP/sens-focal-red.jsonl" \
            -- target/debug/sens "$physical_dir/mutant.sens"
          echo "SENS_D3_D6_NATIVE_28_PASS physical=zig-t5 laws=28 negative=1 semantic_authority=SENS"
          # Чотири ратифіковані D5 ідентичності: українська SENS-проєкція.
          d5_projection="tests/semantic/d5-uk-projection-laws.lisp"
          sha256sum "$d5_projection" lib/core4.lisp target/debug/sens
          if ! d5_observed="$(target/debug/sens "$d5_projection" 2>&1)"; then
            printf '%s\n' "$d5_observed" >&2
            echo "::error::D5_UK_NATIVE_RED layer=eval fixture=$d5_projection expected=(1,1,1,1,1,1,1,1) actual=execution-error" >&2
            exit 1
          fi
          printf '%s\n' "$d5_observed"
          d5_actual="${d5_observed##*$'\n'}"
          if [[ "$d5_actual" != "(1 1 1 1 1 1 1 1)" ]]; then
            echo "::error::D5_UK_LAW_DIFF layer=eval fixture=$d5_projection expected=(1,1,1,1,1,1,1,1) actual=$d5_actual" >&2
            exit 1
          fi
          echo "D5_UK_NATIVE_PASS functions=5 laws=8 authority=SENS"

      # Manual, deeper suite has independent witnesses, never an automatic green claim.

      - name: D1–D10 — вичерпна перевірка бітового пакування (без нової семантики)
        id: packed
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/sens-focal-red.jsonl"
          python3 scripts/ci_failure_contract.py run \
            --test-id packed-bits-d1-d10 \
            --layer transport \
            --fixture crates/sens/src/packed_bits.rs \
            --report-file "$report" \
            -- cargo test --locked -p sens --lib packed_bits::tests:: -- --nocapture
          # Mechanical compiler schema gate: SENS owns language meaning;
          # Rust merely rejects ambiguous duplicate transport fields.
          python3 scripts/ci_failure_contract.py run \
            --test-id compiler-artifact-seven-bit-slot-guard \
            --layer transport \
            --fixture crates/sens/src/compiler_language.rs \
            --report-file "$report" \
            -- cargo test --locked -p sens --lib compiler_language::tests::whole_program_artifact_verifier_rejects_duplicate_fields_before_execution -- --exact --nocapture
          cargo test --locked -p sens --lib quote_of_canonical_d3_empty_coordinate_is_structural_nil -- --nocapture
          cargo test --locked -p sens --lib quote_preserves_nonempty_d3_domain_identity -- --nocapture

      - name: UNGUARDING ratchet — жоден guard не може бути муляжем
        # A guard that cannot fail is itself a failure. A placeholder/stub gate, or a
        # guard whose negative controls do not pass, fails here -- so a dummy gate
        # never reaches main.
        shell: bash
        run: python3 scripts/check_guards_are_real.py .

      - name: RELEASE GO-GATE — виконуваний підрахунок GO/NO-GO (коридор + аксіоми)
        # The release is GO only when every gate passes on ONE SHA (#4196). This step
        # prints the GO count and names the red gates -- report-only, never greenwashed.
        shell: bash
        run: |
          set +e
          python3 scripts/release_go_gate.py . --json "$RUNNER_TEMP/release-go-gate.json"
          echo "release-go-gate exit=$?"
          exit 0

      - name: MATH — парний бенчмарк точної раціональної арифметики SENS↔Rust
        # One workload, one law (canonical gcd-reduced Q, add/mul/recip) on the Rust
        # reference and on the SENS binary; unavailable side = UNVERIFIED, no fake number.
        shell: bash
        run: |
          set -euo pipefail
          # The crate is its own workspace (benchmarks/core-math-demand-rust/Cargo.toml
          # has [workspace]); -p from the root cannot see it. Build by manifest path.
          cargo build --manifest-path benchmarks/core-math-demand-rust/Cargo.toml --release
          python3 scripts/bench_math_sens_vs_rust.py . --iters 200000 --reps 7 \
            --json "$RUNNER_TEMP/math-bench.json"

      - name: Червоний має говорити — валідність діагностики
        if: always()
        shell: bash
        env:
          BUDGET_OUTCOME: ${{ steps.budget.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          PACKED_OUTCOME: ${{ steps.packed.outcome }}
          SOURCE_OUTCOME: ${{ steps.source-census.outcome }}
          LAW_OUTCOME: ${{ steps.law.outcome }}
          MUTANT_OUTCOME: ${{ steps.mutant.outcome }}
          REASON_OUTCOME: ${{ steps.reason-selectors.outcome }}
          UNIFY_OUTCOME: ${{ steps.unify-observe-d1.outcome }}
          CORE2_OUTCOME: ${{ steps.core2.outcome }}
          CORE_WIDTH_OUTCOME: ${{ steps.core-width-law.outcome }}
          KNOWLEDGE_OUTCOME: ${{ steps.knowledge.outcome }}
          LINTER_OUTCOME: ${{ steps.linter-law.outcome }}
          LINTER_MUTANT_OUTCOME: ${{ steps.linter-mutant.outcome }}
          CORE_SENTINEL_OUTCOME: ${{ steps.core-sentinel.outcome }}
          CORE_SENTINEL_MUTANT_OUTCOME: ${{ steps.core-sentinel-mutant.outcome }}
          CORE1_OUTCOME: ${{ steps.core1-selectors.outcome }}
          QUOTED_OUTCOME: ${{ steps.quoted-d7.outcome }}
          TCP_OUTCOME: ${{ steps.tcp-migration.outcome }}
          META_FC_OUTCOME: ${{ steps.meta-fc-d1.outcome }}
          SID8_BROAD_OUTCOME: ${{ steps.sid8-broad-source.outcome }}
          T5_ORACLE_OUTCOME: ${{ steps.t5-oracle.outcome }}
          FRAME3_OUTCOME: ${{ steps.frame3-bcsw.outcome }}
          MIGRATOR_OUTCOME: ${{ steps.migrator-optimized.outcome }}
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/sens-focal-red.jsonl"
          # Власник 2026-10-14: обмеження UNINFORMATIVE-EXECUTOR знято —
          # мова ще не зріла вимагати нативної SENS-паритетності з Rust/Python.
          # Діагностика нижче лишається; нативні квитанції більше не вимагаються.
          diagnostic_rc=0
          if [[ "$BUDGET_OUTCOME" == success && "$BUILD_OUTCOME" == success && "$PACKED_OUTCOME" == success && "$SOURCE_OUTCOME" == success && "$LAW_OUTCOME" == success && "$MUTANT_OUTCOME" == success && "$REASON_OUTCOME" == success && "$UNIFY_OUTCOME" == success && "$CORE2_OUTCOME" == success && "$CORE_WIDTH_OUTCOME" == success && "$KNOWLEDGE_OUTCOME" == success && "$LINTER_OUTCOME" == success && "$LINTER_MUTANT_OUTCOME" == success && "$CORE_SENTINEL_OUTCOME" == success && "$CORE_SENTINEL_MUTANT_OUTCOME" == success && "$CORE1_OUTCOME" == success && "$QUOTED_OUTCOME" == success && "$MIGRATOR_OUTCOME" == success && "$TCP_OUTCOME" == success && "$META_FC_OUTCOME" == success && "$SID8_BROAD_OUTCOME" == success && "$T5_ORACLE_OUTCOME" == success && "$FRAME3_OUTCOME" == success ]]; then
            python3 scripts/ci_failure_contract.py scan --report-file "$report" --allow-empty || diagnostic_rc=$?
          else
            python3 scripts/ci_failure_contract.py scan --report-file "$report" || diagnostic_rc=$?
          fi
          if [[ "$diagnostic_rc" -ne 0 ]]; then
            echo "::error::UNINFORMATIVE-EXECUTOR or UNINFORMATIVE-OUTPUT; blocking CI"
            exit 1
          fi

      - name: RUST-ZIG-ONLY — заборона прямих Rust → Lisp/SENS/FASL залежностей
        # TEMPORARILY DISABLED per owner request 2026-10-16 during Rust↔Lisp migration.
        # Restore if: always() when the linkage check is ready again.
        if: ${{ false }}
        shell: bash
        run: |
          set -uo pipefail
          # This is a separate mechanical authority boundary, not a SENS semantic verdict.
          unit_rc=0
          python3 -m unittest tests.test_rust_lisp_sens_edges -v || unit_rc=$?
          edge_rc=0
          python3 scripts/rust_lisp_sens_edges.py || edge_rc=$?
          production_unit_rc=0
          python3 -m unittest discover -s tests -p test_check_rust_isolated_only_zig.py -v || production_unit_rc=$?
          production_rc=0
          python3 scripts/check_rust_isolated_only_zig.py || production_rc=$?
          if [[ "$unit_rc" -ne 0 || "$edge_rc" -ne 0 || "$production_unit_rc" -ne 0 || "$production_rc" -ne 0 ]]; then
            echo "::error::RUST_ZIG_ONLY_RED direct Rust project-source embeds remain"
            exit 1
          fi
          echo "RUST_ZIG_ONLY_OK zero direct Rust project-source embeds"
