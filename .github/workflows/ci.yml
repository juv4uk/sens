            echo "::error::D10_PARTITION_IMPROPER_LIST_ACCEPTED id=d10-paip-partition-if-improper-list expected=proper-list-refusal actual=accepted" >&2
            record_red "d10-paip-partition-if-improper-list" "$d10_partition_bad_list" "car expects a non-empty list" "accepted"
