name: SENS — перевірки поверхні Lisp

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# На кожен коміт запускається один workflow; нові push скасовують застарілі
# push-запуски тієї самої гілки, щоб вони не займали чергу раннерів.
concurrency:
  group: sens-lisp-surface-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  lisp-surface:
    name: Українська проєкція та заборона сирих літералів
    # Pull-request code stays on an ephemeral hosted runner; trusted pushes and
    # manual dispatch use the owner's self-hosted Linux x64 runners.
    # Only trusted main pushes / main manual runs use local runners.
    # Pull requests and pushes to other refs stay on ephemeral hosted runners.
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && fromJSON('["self-hosted","Linux","X64"]') || 'ubuntu-24.04' }}
    # Обмеження часу захищає локальні ранери та чергу від завислих перевірок.
    timeout-minutes: 25
    steps:
      - name: Перевірити середовище вибраного раннера
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          GIT_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          printf 'RUNNER_ROUTING event=%s ref=%s environment=%s os=%s arch=%s name=%s\n' "$EVENT_NAME" "$GIT_REF" "${RUNNER_ENVIRONMENT:-unset}" "${RUNNER_OS:-unset}" "${RUNNER_ARCH:-unset}" "${RUNNER_NAME:-unset}"
          if [[ "$GIT_REF" == 'refs/heads/main' && ( "$EVENT_NAME" == 'push' || "$EVENT_NAME" == 'workflow_dispatch' ) ]]; then
            expected='self-hosted'
          else
            expected='github-hosted'
          fi
          if [[ "${RUNNER_ENVIRONMENT:-}" != "$expected" ]]; then
            echo "::error::SENS expected $expected runner for event $EVENT_NAME ref $GIT_REF"
            exit 1
          fi

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, pinned
        with:
          persist-credentials: false

      - uses: ./.github/actions/install-zig

      - name: Заборона закодованих літералів у Lisp
        shell: bash
        env:
          PUSH_BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          python3 -m unittest tests/test_no_encoded_source_literals.py -v
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base_sha="$PR_BASE"
          else
            base_sha="$PUSH_BEFORE"
          fi
          if [[ -z "$base_sha" || "$base_sha" =~ ^0+$ ]]; then
            # A shallow checkout (depth 1) has no HEAD^; deepen just enough.
            git fetch --no-tags --deepen=2 origin >/dev/null 2>&1 || true
            base_sha="$(git rev-parse HEAD^)"
          fi
          timeout 30s git fetch --no-tags --depth=1 origin "$base_sha"
          python3 scripts/check_no_encoded_source_literals.py --base "$base_sha"

      - name: Клавіатурні символи у проєкціях ук, укр і sym (D1–D11)
        if: ${{ always() }} # самостійна перевірка, навіть коли попередній guard червоний
        run: python3 -m unittest tests/test_ukrainian_domain_projection_rules.py -v
      - name: Безпечність dry-run і незмінність доменних колонок
        if: ${{ always() }}
        run: python3 -m unittest tests/test_ukrainian_domain_projection_migration.py -v

      - name: D11 селекторні кандидати — точна бітність, похідність і негативні контролі
        if: ${{ always() }}
        run: |
          set -euo pipefail
          python3 -m unittest tests/test_migration_nonprogram_domain_tables.py -v
          python3 -m unittest tests/test_d11_selector_seed.py -v
          python3 scripts/check_d11_selector_seed.py
          python3 scripts/audit_ukrainian_domain_projections.py

      - name: SENS-визначення — баланс дужок і дублікати
        if: ${{ always() }}
        run: python3 scripts/check-sens-definitions.py

      - name: Семантичний реєстр і аліаси — канонічність
        if: ${{ always() }}
        run: |
          set -euo pipefail
          python3 scripts/check_semantic_registry.py
          python3 scripts/check_alias_identity.py

      - name: D1–D10 — пакетний пошук кандидатів без нового реєстру
        if: ${{ always() }}
        run: |
          set -euo pipefail
          python3 -m unittest tests/test_discover_domain_function_candidates.py -v
          python3 scripts/discover_domain_function_candidates.py --domain D6 --limit 16 --format tsv --no-research-scan --candidates-only --evidence-first

      - name: Код запускається — entry-points, читач і кодек на реальних файлах
        if: ${{ always() }}
        # Саме цей етап зависав у 20 одночасних виконаннях 19.10.2026.
        # TIMEOUT означає несправність виконання тестів, не HOLD/FREEZE джерел.
        timeout-minutes: 12
        run: |
          set -euo pipefail
          python3 -m unittest tests/test_capability_axis_ukr_projection.py -v
          python3 -m unittest tests/test_ukr_optin_sources.py -v
          python3 -m unittest tests/test_ukr_guard_projection.py -v
          python3 -m unittest tests/test_ukr_result_status_projection.py -v
          python3 -m unittest tests/test_ukr_quantity_projection.py -v
          python3 -m unittest tests/test_fs_ukr_projection.py -v
          python3 -m unittest tests/test_ukr_persistent_map_projection.py -v
          python3 -m unittest tests/test_ukr_mechanism_selector_projection.py -v
          python3 -m unittest tests/test_ukr_canon_d4_projection.py -v
          python3 -m unittest tests.test_domain_ladder_source_batch.BatchSourceTests.test_guard_reference_uses_ukrainian_heads_without_filename_hold -v
          cargo test --locked -p sens --test guard
          python3 -m unittest tests/test_ukr_macro_bridge_unify_effects.py -v
          python3 -m unittest tests/test_ukr_machine_projection_parity.py -v
          python3 -m unittest tests/test_native_first_exact_d1_cutover.py -v
          python3 -m unittest tests/test_native_first_execute_d1_cutover.py -v
          python3 -m unittest tests/test_ukr_native_first_dispatch_projection.py -v
          python3 -m unittest tests/test_ukr_registry_read_benchmark.py -v
          python3 -m unittest tests/test_ukr_core3_profile_projection.py -v
          python3 -m unittest tests/test_ukr_mechanism_checkers_projection.py -v
          python3 -m unittest tests/test_ukr_semantic_authority_guard_projection.py -v
          python3 -m unittest tests/test_ukr_program_symbol_table_projection.py tests.test_d3_legacy_logic_guard.LegacyD3GuardTests.test_fpga_program_symbol_table_exact_d1_migration -v
          python3 -m unittest tests/test_ukr_core1_bootstrap_projection.py -v
          python3 -m unittest tests/test_core_ukr_primary_projection.py -v
          python3 -m unittest tests/test_code_runs.py -v
          python3 -m unittest tests/test_translation_ukr_primary_projection.py -v
          python3 -m unittest tests.test_forward_macro_d4_2046.ForwardD10UkrCallsiteProjectionTests -v
          python3 -m unittest tests/test_migration_publish_pair.py -v
          python3 -m unittest tests/test_migrate_one_to_sens.py -v

      - name: УКР-ПРОЄКЦІЯ — аудит поступової міграції .lisp (без глобального стопу)
        if: ${{ always() }}
        run: |
          set -euo pipefail
          python3 -m unittest tests/test_ukr_projection_progress_report.py -v
          # Прогрес поступової міграції — інформативна метрика, не глобальний стоп.
          # Компактне ук та повне укр — різні peer spellings; їхня рівність
          # не є вимогою semantic identity чи міграційним критерієм.
          python3 scripts/report_ukr_projection_progress.py
          # Аудит повністю виводить live та archive знахідки, але історична
          # міграційна заборгованість не є глобальним стопом для незалежних змін.
          # Локальний --require-full залишається доступним і має fail-closed тести.
          # Лексичний звіт не замінює фізичний SENS-eval та не стверджує callability.
          python3 -m unittest tests/test_ukr_callsite_migration.py -v
          python3 -m unittest tests/test_ukr_narrate_peers.py -v
          python3 -m unittest tests/test_ukr_lib_peers.py -v
          python3 -m unittest tests/test_persistent_map_ukr_primary_projection.py -v
          python3 -m unittest tests/test_content_store_ukr_primary_projection.py -v
          python3 -m unittest tests/test_persistent_vector_ukr_primary_projection.py -v
          python3 scripts/test-content-store-d1-bitness.py
          # Борг active Latin call heads лишається видимим у звіті й JSON.
          # --require-full залишається локальною опцією, а не глобальним CI-гейтом.
          python3 scripts/check_ukr_callsite_migration.py --json "$RUNNER_TEMP/ukr-callsite-migration.json" --limit 25



      - name: "ONE-SHOT — фізичні T5M-пари поточних lib-програм для прямої інтеграції"
        if: ${{ always() && github.event_name == 'push' && startsWith(github.event.head_commit.message, 'MIGRATE-LIB-TRIPLETS:') }}
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/sens-lib-triplets"
          report="$RUNNER_TEMP/sens-lib-triplets.report.json"
          mkdir -p "$output"
          set +e
          python3 scripts/migrate-three-pass.py lib --out "$output" --report "$report" --codec t5m --source-surface укр
          migrate_rc=$?
          set -e
          if [[ ! -s "$report" ]]; then
            echo "::error::SENS_LIB_TRIPLET_EXPORT_NO_REPORT rc=$migrate_rc" >&2
            exit 1
          fi
          cp "$report" "$output/MIGRATION-REPORT.json"
          printf '%s\n' "$GITHUB_SHA" > "$output/EXPORT-HEAD"
          python3 - "$report" <<'PY'
          import json, sys
          report = json.load(open(sys.argv[1], encoding="utf-8"))
          summary = report.get("summary", {})
          print(
              "SENS_LIB_TRIPLET_EXPORT "
              f"sha={__import__('os').environ.get('GITHUB_SHA')} "
              f"seen={summary.get('files_seen')} "
              f"written={summary.get('files_written')} "
              f"blocked={summary.get('files_blocked')} "
              f"semantic_admitted={report.get('semantic_admitted')}"
          )
          PY
          if [[ "$migrate_rc" -gt 2 ]]; then
            echo "::error::SENS_LIB_TRIPLET_EXPORT rc=$migrate_rc" >&2
            exit "$migrate_rc"
          fi

      - name: "ONE-SHOT — artifact фізичних пар для точкового перенесення в main"
        if: ${{ always() && github.event_name == 'push' && startsWith(github.event.head_commit.message, 'MIGRATE-LIB-TRIPLETS:') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4, pinned
        with:
          name: sens-lib-triplets-${{ github.sha }}
          path: ${{ runner.temp }}/sens-lib-triplets/
          if-no-files-found: error
          retention-days: 1
