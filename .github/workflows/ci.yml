      - name: Core1 — дев'ять селекторних законів перевіряє двійковий SENS і D1-мутант
        id: core1-selectors
        shell: bash
        run: |
          set -euo pipefail
          base=tests/fixtures/core1-selectors-semantic
          report="$RUNNER_TEMP/sens-focal-red.jsonl"
          echo "test_id=core1-selector-9-laws layer=eval semantic_authority=binary-SENS"
          sha256sum lib/core1.lisp "$base.bits" "$base.sens" "$base-mutant.bits" "$base-mutant.sens"
          # Лише механічний транспорт: збіг усіх точних бітових слів із T5.
          target/debug/sens-trit open "$base.sens" > "$RUNNER_TEMP/core1-positive.bits"
          target/debug/sens-trit open "$base-mutant.sens" > "$RUNNER_TEMP/core1-mutant.bits"
          cmp "$base.bits" "$RUNNER_TEMP/core1-positive.bits"
          cmp "$base-mutant.bits" "$RUNNER_TEMP/core1-mutant.bits"
          mapfile -t original < <(tr '[:space:]' '\n' < "$base.bits" | sed '/^$/d')
          mapfile -t mutated < <(tr '[:space:]' '\n' < "$base-mutant.bits" | sed '/^$/d')
          test "${#original[@]}" -eq "${#mutated[@]}"
          changes=0
          for ((i=0; i<${#original[@]}; i++)); do
            if [[ "${original[i]}" != "${mutated[i]}" ]]; then
              [[ "${original[i]}" == 0 && "${mutated[i]}" == 1 ]] || { echo "::error::CORE1_MUTANT_WIDTH_OR_BIT_VIOLATION word=$i"; exit 1; }
              changes=$((changes + 1))
            fi
          done
          test "$changes" -eq 1 || { echo "::error::CORE1_MUTANT_NOT_ONE_BIT changed_words=$changes"; exit 1; }
          printf '1\n' > "$RUNNER_TEMP/core1-expected-yes"
          printf '0\n' > "$RUNNER_TEMP/core1-expected-no"
          python3 scripts/ci_failure_contract.py run \
            --test-id core1-selector-9-laws \
            --layer eval \
            --fixture "$base.sens" \
            --expected-file "$RUNNER_TEMP/core1-expected-yes" \
