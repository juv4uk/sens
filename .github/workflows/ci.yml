      - name: GUARD_ONCE — точний D3:001 проти історичного W8 QUOTE (Rust лише механізм)
        # Independent proof must run even if an unrelated earlier step is red.
        # The failing step remains red; do not override its conclusion.
        if: ${{ !cancelled() && contains(github.event.head_commit.message, '[guard-once]') }}
        id: guard-once
        shell: bash
        run: |
          set -euo pipefail
          echo "test_id=guard-evidence-status-d3-width layer=parse mechanical_only=true semantic_pass=false"
          sha256sum knowledge/guard-reference.lisp crates/sens-lsp/src/guard_knowledge.rs
          cargo test --locked -p sens-lsp --lib guard_knowledge::tests:: -- --nocapture

      - name: GUARD_NATIVE_ONCE — двогілковий D3 COND/EQ з D1-самовердиктом і однобітним мутантом
        # Native binary SENS is the only authority; shell validates transport and verdicts.
        if: ${{ !cancelled() && contains(github.event.head_commit.message, '[guard-once]') }}
        id: guard-native-once
        shell: bash
        run: |
          set -euo pipefail
          dir=tests/semantic/native-t5
          law="$dir/guard-cond-eq-branch-law"
          mutant="$dir/guard-cond-eq-branch-mutant"
          echo "test_id=guard-cond-eq-branch layer=eval executor=NATIVE_SENS_ORACLE semantic_authority=SENS"
          sha256sum "$law.bits" "$law.sens" "$mutant.bits" "$mutant.sens" target/debug/sens target/debug/sens-trit
          for name in "$law" "$mutant"; do
            target/debug/sens-trit open "$name.sens" > "$RUNNER_TEMP/$(basename "$name").actual.bits"
            if ! cmp "$name.bits" "$RUNNER_TEMP/$(basename "$name").actual.bits"; then
              echo "REGRESSION id=guard-cond-eq-transport layer=transport fixture=$name.sens expected=bits-file actual=roundtrip-mismatch reproduce=target/debug/sens-trit\ open\ $name.sens" >&2
              exit 1
            fi
          done
          read -ra original < "$law.bits"
          read -ra changed < "$mutant.bits"
          test "${#original[@]}" -eq "${#changed[@]}"
          differences=0
          for ((i=0; i<${#original[@]}; i++)); do
            test "${#original[i]}" -eq "${#changed[i]}"
            for ((j=0; j<${#original[i]}; j++)); do
              if [[ "${original[i]:j:1}" != "${changed[i]:j:1}" ]]; then
                differences=$((differences + 1))
              fi
            done
          done
          if [[ "$differences" -ne 1 ]]; then
            echo "REGRESSION id=guard-cond-eq-one-bit layer=transport expected=1 actual=$differences fixture=$mutant.bits reproduce=cmp\ $law.bits\ $mutant.bits" >&2
            exit 1
          fi
          for entry in "$law:1" "$mutant:0"; do
            name="${entry%:*}"
            expected="${entry##*:}"
            if ! actual="$(target/debug/sens "$name.sens")"; then
              echo "REGRESSION id=guard-cond-eq-branch layer=eval fixture=$name.sens expected=D1:$expected actual=execution-error reproduce=target/debug/sens\ $name.sens" >&2
              exit 1
            fi
            if [[ "$actual" != "$expected" ]]; then
              echo "REGRESSION id=guard-cond-eq-branch layer=eval fixture=$name.sens expected=D1:$expected actual=$actual reproduce=target/debug/sens\ $name.sens" >&2
              exit 1
            fi
            if ! peer="$(target/debug/sens-trit eval "$name.sens")" || [[ "$peer" != "$actual" ]]; then
              echo "REGRESSION id=guard-cond-eq-peer layer=eval fixture=$name.sens expected=D1:$actual actual=${peer:-error} reproduce=target/debug/sens-trit\ eval\ $name.sens" >&2
              exit 1
            fi
            echo "PASS test_id=guard-cond-eq-branch layer=eval authority=NATIVE_SENS verdict=D1:$actual fixture=$name.sens"
          done
          # A single flipped quoted D1 datum turns true EQ into false EQ;
          # SENS must not execute CAR(nil) until the second clause is selected.
          lazy="$dir/guard-cond-lazy-car-law"
          lazy_mutant="$dir/guard-cond-lazy-car-mutant"
          echo "test_id=guard-cond-lazy-car layer=eval executor=NATIVE_SENS_ORACLE semantic_authority=SENS"
          sha256sum "$lazy.bits" "$lazy.sens" "$lazy_mutant.bits" "$lazy_mutant.sens"
          for name in "$lazy" "$lazy_mutant"; do
            projection="$RUNNER_TEMP/$(basename "$name").actual.bits"
            target/debug/sens-trit open "$name.sens" > "$projection"
            if ! cmp "$name.bits" "$projection"; then
              echo "REGRESSION id=guard-cond-lazy-car-transport layer=transport fixture=$name.sens expected=bits-file actual=roundtrip-mismatch reproduce=target/debug/sens-trit\ open\ $name.sens" >&2
              exit 1
            fi
          done
          read -ra original < "$lazy.bits"
          read -ra changed < "$lazy_mutant.bits"
          if [[ "${#original[@]}" -ne "${#changed[@]}" ]]; then
            echo "REGRESSION id=guard-cond-lazy-car-width layer=transport expected=equal-word-count actual=unequal fixture=$lazy_mutant.bits" >&2
            exit 1
          fi
          differences=0
          for ((i=0; i<${#original[@]}; i++)); do
            if [[ "${#original[i]}" -ne "${#changed[i]}" ]]; then
              echo "REGRESSION id=guard-cond-lazy-car-width layer=transport expected=equal-bit-width actual=mismatch word=$i" >&2
              exit 1
            fi
            for ((j=0; j<${#original[i]}; j++)); do
              if [[ "${original[i]:j:1}" != "${changed[i]:j:1}" ]]; then
                differences=$((differences + 1))
              fi
            done
          done
          if [[ "$differences" -ne 1 ]]; then
            echo "REGRESSION id=guard-cond-lazy-car-one-bit layer=transport expected=1 actual=$differences fixture=$lazy_mutant.bits" >&2
            exit 1
          fi
          if ! result="$(target/debug/sens "$lazy.sens")" || [[ "$result" != "1" ]]; then
            echo "REGRESSION id=guard-cond-lazy-car-positive layer=eval fixture=$lazy.sens expected=D1:1 actual=${result:-execution-error} reproduce=target/debug/sens\ $lazy.sens" >&2
            exit 1
          fi
          if ! peer="$(target/debug/sens-trit eval "$lazy.sens")" || [[ "$peer" != "$result" ]]; then
            echo "REGRESSION id=guard-cond-lazy-car-peer layer=eval fixture=$lazy.sens expected=D1:1 actual=${peer:-execution-error}" >&2
            exit 1
          fi
          echo "PASS test_id=guard-cond-lazy-car-positive layer=eval authority=NATIVE_SENS verdict=D1:1"
          if target/debug/sens "$lazy_mutant.sens" > "$RUNNER_TEMP/guard-lazy-car.stdout" 2> "$RUNNER_TEMP/guard-lazy-car.stderr"; then
            echo "REGRESSION id=guard-cond-lazy-car-mutant layer=eval fixture=$lazy_mutant.sens expected=CAR-nonpair actual=accepted reproduce=target/debug/sens\ $lazy_mutant.sens" >&2
            exit 1
          fi
          if ! grep -Fq 'car expects a non-empty list' "$RUNNER_TEMP/guard-lazy-car.stderr"; then
            echo "UNINFORMATIVE-NEGATIVE id=guard-cond-lazy-car-mutant layer=eval fixture=$lazy_mutant.sens expected=CAR-nonpair actual=unrelated-error reproduce=target/debug/sens\ $lazy_mutant.sens" >&2
            cat "$RUNNER_TEMP/guard-lazy-car.stderr" >&2
            exit 1
          fi
          if target/debug/sens-trit eval "$lazy_mutant.sens" > "$RUNNER_TEMP/guard-lazy-car-peer.stdout" 2> "$RUNNER_TEMP/guard-lazy-car-peer.stderr"; then
            echo "REGRESSION id=guard-cond-lazy-car-mutant-peer layer=eval fixture=$lazy_mutant.sens expected=rejection actual=accepted" >&2
            exit 1
          fi
          if ! grep -Fq 'car expects a non-empty list' "$RUNNER_TEMP/guard-lazy-car-peer.stderr"; then
            echo "UNINFORMATIVE-NEGATIVE id=guard-cond-lazy-car-mutant-peer layer=eval fixture=$lazy_mutant.sens expected=CAR-nonpair actual=unrelated-error" >&2
            cat "$RUNNER_TEMP/guard-lazy-car-peer.stderr" >&2
            exit 1
          fi
          echo "PASS test_id=guard-cond-lazy-car-mutant layer=eval authority=NATIVE_SENS verdict=CAR-nonpair bit_mutations=1"

