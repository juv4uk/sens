name: SENS — легкий контроль проєкції Lisp

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Єдиний автоматичний workflow. Жодних важких збірок, remint, матриць,
# бенчмарків чи встановлення інтерпретаторів. Важке: ci-heavy.yml (ручний запуск).
# Структурні перевірки НЕ доводять семантику SENS і не допускають реліз.
permissions:
  contents: read

jobs:
  lisp-guards:
    name: Легкий контроль кодів і українських проєкцій
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, pinned
        with:
          persist-credentials: false

      - name: Один автоматичний CI — тільки поточний main
        run: python3 scripts/ci_one_focused_workflow.py

      - name: Структура визначень Lisp та SENS
        run: python3 scripts/check-sens-definitions.py

      - name: Заборонити старі сирі коди і перевірити проєкції D1–D11
        run: |
          set -euo pipefail
          python3 -m unittest \
            tests/test_no_encoded_source_literals.py \
            tests/test_ukrainian_domain_projection_rules.py \
            tests/test_sid8_broad_source_cutover.py -v

  lisp-surface:
    name: Підсумковий гейт перевірок SENS
    if: ${{ always() }}
    needs: [lisp-guards]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Не видавати структурний PASS за перевірену семантику
        env:
          GUARDS_RESULT: ${{ needs.lisp-guards.result }}
        run: |
          set -euo pipefail
          if [[ "$GUARDS_RESULT" != success ]]; then
            echo "::error::SENS LIGHT CHECKS FAIL: guards=$GUARDS_RESULT"
            exit 1
          fi
          echo "SENS LIGHT CHECKS PASS; runtime=NOT_TESTED; release=NOT_CERTIFIED"
