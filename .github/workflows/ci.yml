name: SENS — один точковий автоматичний двійковий закон

# Рівно один автоматичний job; лише SENS визначає семантичний результат.
# Один центральний workflow: positive law + fail-closed guards.
# Every branch push and pull_request receives one central SENS witness; no extra automatic workflows.
# No paths filter: docs, implementation, migration, and workflow changes all trigger.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Warnings are errors: any rustc warning in our own crates fails the build/test.
# (cargo passes --cap-lints allow to dependencies, so this targets our code.)
env:
  RUSTFLAGS: "-D warnings"
  RUSTDOCFLAGS: "-D warnings"

concurrency:
  # Each commit gets its own slot; GitHub otherwise replaces older PENDING runs.
  group: sens-one-focussed-${{ github.repository }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  binary-sens-law:
    name: Часові D1 предикати — один фізичний SENS-свідок і чинні негативні контроли
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, pinned
        with:
          persist-credentials: false
      - name: "GUARD — warnings are fatal (RUSTFLAGS must keep -D warnings)"
        shell: bash
        run: |
          set -euo pipefail
          # Permanent: no commit may silently drop the fatal-warnings policy.
          case "${RUSTFLAGS:-}" in
            *"-D warnings"*) echo "RUSTFLAGS ok: $RUSTFLAGS" ;;
            *) echo "::error::RUSTFLAGS must contain '-D warnings' (warnings are fatal by owner policy)"; exit 1 ;;
          esac
          case "${RUSTDOCFLAGS:-}" in
            *"-D warnings"*) echo "RUSTDOCFLAGS ok: $RUSTDOCFLAGS" ;;
            *) echo "::error::RUSTDOCFLAGS must contain '-D warnings'"; exit 1 ;;
          esac
      - name: "SENS-DEFINITIONS — визначені функції: баланс, дублі, ратифіковані імена"
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check-sens-definitions.py
      - name: Встановити Zig 0.16.0 для типового транспортного кодека
        shell: bash
        run: |
          set -euo pipefail
          archive_name="zig-x86_64-linux-0.16.0.tar.xz"
          archive_path="$RUNNER_TEMP/zig-0.16.0.tar.xz"
          expected_sha256="70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00"

          # Zig documents that ziglang.org has no uptime/speed guarantee for CI.
          # Rotate its published community mirrors; a pinned SHA-256 is mandatory
          # before extraction, so a mirror can never replace the toolchain identity.
          community_mirrors=(
            'https://pkg.hexops.org/zig'
            'https://zigmirror.hryx.net/zig'
            'https://zig.linus.dev/zig'
            'https://zig.squirl.dev'
          )
          mapfile -t zig_sources < <(printf '%s\n' "${community_mirrors[@]}" | shuf)
          zig_sources+=('https://ziglang.org/download/0.16.0')
          fetched=false
          for source in "${zig_sources[@]}"; do
            rm -f "$archive_path"
            if ! curl --fail --location --silent --show-error \
              --connect-timeout 10 --max-time 60 \
              "${source}/${archive_name}?source=sens-github-actions" \
              --output "$archive_path"; then
              echo "::warning::ZIG_0_16_0_DOWNLOAD_FAILED source=$source; trying next source" >&2
              continue
            fi
            if ! printf '%s  %s\n' "$expected_sha256" "$archive_path" | sha256sum --check --status; then
              echo "::warning::ZIG_0_16_0_HASH_MISMATCH source=$source; trying next source" >&2
              continue
            fi
            echo "Verified Zig 0.16.0 archive from $source"
            fetched=true
            break
          done
          if [[ "$fetched" != true ]]; then
            echo "::error::ZIG_0_16_0_UNAVAILABLE all community mirrors and official origin failed download/integrity checks" >&2
            exit 1
          fi
          tar -xJf "$RUNNER_TEMP/zig-0.16.0.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/zig-x86_64-linux-0.16.0" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/zig-x86_64-linux-0.16.0/zig" version
      - uses: dtolnay/rust-toolchain@1.99.0

      - name: RUST↔ZIG — зібрати sens-host і sens-cli з точними пінами
        id: sens-host-build
        shell: bash
        run: |
          set -euo pipefail
          # Pass the already SHA-verified Zig binary explicitly to Cargo build.rs.
          # The sens-host crate by itself depends only on sens, so it does NOT
          # exercise the Rust -> Zig static archive link.
          export ZIG="$RUNNER_TEMP/zig-x86_64-linux-0.16.0/zig"
          test -x "$ZIG"
          test "$(cat .zig-version)" = "$("$ZIG" version)"
          rustc --version | grep -F 'rustc 1.99.0 '
          cargo tree --locked -p sens-cli >/dev/null
          cargo build --locked -p sens-host
          # This default Zig-enabled crate invokes build.rs, builds the Zig
          # physical ABI archive and links it into both executable Rust hosts.
          cargo build --locked -p sens-cli --features zig-transport --bin sens --bin sens-trit
          shopt -s nullglob
          archives=(target/debug/build/sens-cli-*/out/libsens_zig_transport.a)
          if (( ${#archives[@]} == 0 )); then
            echo '::error::RUST_ZIG_BUILD_NO_ARCHIVE expected a real Zig static library' >&2
            exit 1
          fi
          for archive in "${archives[@]}"; do
            test -s "$archive"
            sha256sum "$archive"
          done

      - name: "D8 COPY-SEQ/MAPQN — 8 нативних законів і негатив типу"
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/sens-focal-red.jsonl"
          fixture="tests/semantic/d8-copyseq-mapqn-laws.lisp"
          negative="tests/semantic/d8-copyseq-nonlist-negative.lisp"
          sha256sum "$fixture" "$negative" lib/core4.lisp target/debug/sens
          mapfile -t programs < "$fixture"
          count=0
          for program in "${programs[@]}"; do
            if [[ -z "$program" || "$program" == ';'* ]]; then continue; fi
            ((count += 1))
            file="$RUNNER_TEMP/d8-copyqn-$(printf '%02d' "$count").lisp"
            printf '%s\n' "$program" > "$file"
            sha256sum "$file"
            if ! observed="$(target/debug/sens "$file" 2>&1)"; then
              echo "::error::D8_COPYQN_EXEC_RED law=$count layer=eval fixture=$file expected=1 actual=execution-error" >&2
              printf '%s\n' "$observed" >&2
              python3 scripts/ci_failure_contract.py record-diff --test-id "d8-copyqn-$count" --layer eval --fixture "$fixture" --expected "1" --actual "execution-error" --reproduce "target/debug/sens $file generated-from=$fixture" --report-file "$report" --stderr-tail "$observed"
              exit 1
            fi
            actual="$(tail -n 1 <<< "$observed")"
            if [[ "$actual" != "1" ]]; then
              echo "::error::D8_COPYQN_LAW_DIFF law=$count layer=eval fixture=$file expected=1 actual=$actual" >&2
              python3 scripts/ci_failure_contract.py record-diff --test-id "d8-copyqn-$count" --layer eval --fixture "$fixture" --expected "1" --actual "$actual" --reproduce "target/debug/sens $file generated-from=$fixture" --report-file "$report" --stderr-tail "$observed"
              exit 1
            fi
            echo "D8_COPYQN_LAW_PASS law=$count"
          done
          if [[ "$count" != 8 ]]; then
            echo "::error::D8_COPYQN_CENSUS expected=8 actual=$count" >&2
            python3 scripts/ci_failure_contract.py record-diff --test-id "d8-copyqn-census" --layer eval --fixture "$fixture" --expected "8 programs" --actual "$count programs" --reproduce "sed -n '1,16p' $fixture" --report-file "$report"
            exit 1
          fi
          if rejected="$(target/debug/sens "$negative" 2>&1)"; then
            echo "::error::D8_COPYQN_INVALID_ATOM_ACCEPTED layer=eval fixture=$negative expected=CAR-atom-rejection actual=accepted" >&2
            python3 scripts/ci_failure_contract.py record-diff --test-id "d8-copyqn-invalid-atom" --layer eval --fixture "$negative" --expected "CAR-atom-rejection" --actual "accepted" --reproduce "target/debug/sens $negative" --report-file "$report"
            exit 1
          fi
          if ! grep -Eqi 'car|atom|pair|пара|атом' <<< "$rejected"; then
            echo "::error::D8_COPYQN_UNRELATED_NEGATIVE layer=eval fixture=$negative expected=CAR-atom-rejection actual=$rejected" >&2
            python3 scripts/ci_failure_contract.py record-diff --test-id "d8-copyqn-invalid-atom" --layer eval --fixture "$negative" --expected "CAR-atom-rejection" --actual "$rejected" --reproduce "target/debug/sens $negative" --report-file "$report" --stderr-tail "$rejected"
            exit 1
          fi
          echo "D8_COPYQN_NATIVE_PASS laws=8 negative=1 direct_D8_callability=unclaimed"

      - name: "D8 ELT/MAP/ONEP — 10 SENS законів і числовий негатив"
        shell: bash
        run: |
          set -euo pipefail
          fixture="tests/semantic/d8-elt-map-onep-laws.lisp"
          negative="tests/semantic/d8-onep-nonnumeric-negative.lisp"
          sha256sum "$fixture" "$negative" lib/core4.lisp target/debug/sens
          mapfile -t laws < "$fixture"
          count=0
          for law in "${laws[@]}"; do
            if [[ -z "$law" || "$law" == ';'* ]]; then continue; fi
            ((count += 1))
            case_file="$RUNNER_TEMP/d8-elt-map-onep-$(printf '%02d' "$count").lisp"
            printf '%s\n' "$law" > "$case_file"
            sha256sum "$case_file"
            if ! observed="$(target/debug/sens "$case_file" 2>&1)"; then
              echo "::error::D8_ELTMAPONEP_EXEC_RED id=law-$count layer=eval fixture=$case_file expected=D1:1 actual=execution-error command='target/debug/sens $case_file'" >&2
              printf '%s\n' "$observed" >&2
              exit 1
            fi
            actual="$(tail -n 1 <<< "$observed")"
            if [[ "$actual" != "1" ]]; then
              echo "::error::D8_ELTMAPONEP_LAW_DIFF id=law-$count layer=eval fixture=$case_file expected=1 actual=$actual first_mismatch=D1 command='target/debug/sens $case_file'" >&2
              exit 1
            fi
            echo "D8_ELTMAPONEP_LAW_PASS id=law-$count"
          done
          if [[ "$count" -ne 10 ]]; then
            echo "::error::D8_ELTMAPONEP_CENSUS expected=10 actual=$count" >&2
            exit 1
          fi
          if rejected="$(target/debug/sens "$negative" 2>&1)"; then
            echo "::error::D8_ONEP_INVALID_ACCEPTED fixture=$negative expected=D24-type-refusal actual=accepted" >&2
            exit 1
          fi
          if ! grep -Eqi 'D24|numeric|number|comparison' <<< "$rejected"; then
            echo "::error::D8_ONEP_UNRELATED_NEGATIVE fixture=$negative expected=D24-type-refusal actual=$rejected" >&2
            exit 1
          fi
          echo "D8_ELTMAPONEP_NATIVE_PASS identities=D8:00000101,D8:11000101,D8:11111011 laws=10 negative=1"

      - name: T5M-SENS-CODEC — наш кодек виконується мовою, час власним mono-ns
        id: sens-t5m-codec
        shell: bash
        run: |
          set -euo pipefail
          # Наш T5M-кодек (т5м-у-байти / т5м-з-байтів) виконує САМА мова,
          # не Python і не Rust. Таймінг — власним mono-ns усередині SENS.
          mkdir -p "$RUNNER_TEMP/t5m-sens"
          # 1) закони розміру + round-trip: .lisp -> .sens -> sens
          cp tests/semantic/t5m-bench-sens.lisp "$RUNNER_TEMP/t5m-sens/bench.lisp"
          target/debug/sens-trit encode "$RUNNER_TEMP/t5m-sens/bench.lisp"
          bench_sens="$RUNNER_TEMP/t5m-sens/bench.sens"
          test -s "$bench_sens"
          bench_out="$(target/debug/sens "$bench_sens" 2>&1)" || {
            echo "::error::T5M_SENS_CODEC size-laws failed: $bench_out"; exit 1; }
          echo "T5M_SENS_CODEC_SIZES ok=$bench_out"
          # 2) свідок round-trip 6 законів + 1 фальсифікатор
          cp tests/semantic/t5m-sens-witness.lisp "$RUNNER_TEMP/t5m-sens/witness.lisp"
          target/debug/sens-trit encode "$RUNNER_TEMP/t5m-sens/witness.lisp"
          witness_sens="$RUNNER_TEMP/t5m-sens/witness.sens"
          witness_out="$(target/debug/sens "$witness_sens" 2>&1)" || {
            echo "::error::T5M_SENS_CODEC witness failed: $witness_out"; exit 1; }
          echo "T5M_SENS_CODEC_WITNESS ok=$witness_out"
          # 3) таймінг ВЛАСНИМ mono-ns: мова міряє себе
          cp tests/semantic/t5m-bench-time.lisp "$RUNNER_TEMP/t5m-sens/time.lisp"
          target/debug/sens-trit encode "$RUNNER_TEMP/t5m-sens/time.lisp"
          time_sens="$RUNNER_TEMP/t5m-sens/time.sens"
          time_out="$(target/debug/sens "$time_sens" 2>&1)" || {
            echo "::error::T5M_SENS_CODEC mono-ns timing failed: $time_out"; exit 1; }
          echo "T5M_SENS_CODEC_MONONS bytes_and_ticks=$time_out"
          echo "T5M_SENS_CODEC_PASS authority=SENS clock=mono-ns no_python=1 no_rust_codec=1"

      - name: D3–D6 — 28 незалежних фізичних SENS-законів через Zig/T5
        id: sens-d3-d6-t5-laws
        shell: bash
        run: |
          set -euo pipefail
          # .bits is a visible exact-word witness, not executable textual Lisp.
          # Runtime .lisp below is only a temporary input to the existing Zig T5 encoder.
          # Canonical .sens executes in SENS without implicit Core4 or Rust fallback.
          source="tests/semantic/d3-d6-28-native.bits"
          physical_dir="$RUNNER_TEMP/sens-d3-d6-28"
          mkdir -p "$physical_dir"
          mapfile -t laws < "$source"
          labels=(d3-car d3-cdr d3-atom-positive d3-atom-negative d3-eq-positive d3-eq-negative d4-caar d4-cadr d4-cdar d4-cddr d4-not-d1-no d4-null-empty d4-null-nonempty d5-cdaar d5-cdadr d5-cddar d5-cdddr d5-caaar d5-caadr d5-cadar d5-caddr d5-onebit-selector-order d6-acons-key d6-acons-value d6-acons-negative-swap d6-compose d6-flip d6-flip-negative)
          if (( ${#laws[@]} != 28 || ${#labels[@]} != 28 )); then
            echo "::error::SENS_D3_D6_CENSUS expected=28 actual=${#laws[@]} labels=${#labels[@]}"
            exit 1
          fi
          expected="$physical_dir/expected-d1"
          printf '1\n' > "$expected"
          for i in "${!laws[@]}"; do
            number=$((i+1))
            test_id="sens-d3-d6-$(printf '%02d' "$number")-${labels[$i]}"
            case_source="$physical_dir/$(printf '%02d' "$number").lisp"
            printf '%s\n' "${laws[$i]}" > "$case_source"
            # SENS exact D2 admission before Zig v2 T5 output. No Python packer.
            target/debug/sens-trit encode "$case_source"
            physical="${case_source%.lisp}.sens"
            actual_words="$(target/debug/sens-trit open "$physical")"
            if [[ "$actual_words" != "${laws[$i]}" ]]; then
              echo "::error::SENS_D3_D6_T5_PARITY id=$test_id layer=transport first_mismatch=visible_exact_words"
              sha256sum "$case_source" "$physical"
              exit 1
            fi
            sha256sum "$case_source" "$physical"
            python3 scripts/ci_failure_contract.py run \
              --test-id "$test_id" \
              --layer eval \
              --fixture "$physical" \
              --expected-file "$expected" \
              --executor-report-file "$RUNNER_TEMP/sens-native-evidence.jsonl" \
              --report-file "$RUNNER_TEMP/sens-focal-red.jsonl" \
              -- target/debug/sens "$physical"
          done
          # Existing one-bit D5 positive→mutant is a separate genuine fail-closed executor law.
          cp tests/semantic/d3-d5-direct-selector-mutant.lisp "$physical_dir/mutant.lisp"
          target/debug/sens-trit encode "$physical_dir/mutant.lisp"
          python3 scripts/ci_failure_contract.py run \
            --test-id sens-d3-d6-d5-onebit-noncallable \
            --layer eval \
            --fixture "$physical_dir/mutant.sens" \
            --expect-error-substring "domain identity is not callable under its ratified law: D1" \
            --executor-report-file "$RUNNER_TEMP/sens-native-evidence.jsonl" \
            --report-file "$RUNNER_TEMP/sens-focal-red.jsonl" \
            -- target/debug/sens "$physical_dir/mutant.sens"
          echo "SENS_D3_D6_NATIVE_28_PASS physical=zig-t5 laws=28 negative=1 semantic_authority=SENS"
          # D4:0001 EVAL — exact binary-word source -> physical .sens -> SENS executor.
          # The input fixture is raw exact-width words, not ordinary symbolic Lisp.
          d4_eval_dir="$RUNNER_TEMP/d4-eval"
          mkdir -p "$d4_eval_dir"
          cp tests/semantic/d4-eval-value-call-laws.bits "$d4_eval_dir/value-call.lisp"
          cp tests/semantic/d4-eval-invalid-arity.bits "$d4_eval_dir/invalid-arity.lisp"
          target/debug/sens-trit encode "$d4_eval_dir/value-call.lisp"
          target/debug/sens-trit encode "$d4_eval_dir/invalid-arity.lisp"
          d4_eval_positive="$d4_eval_dir/value-call.sens"
          d4_eval_negative="$d4_eval_dir/invalid-arity.sens"
          expected_d1="$d4_eval_dir/expected-d1"
          printf '1\n' > "$expected_d1"
          d4_words="$(target/debug/sens-trit open "$d4_eval_positive")"
          if [[ "$d4_words" != "$(cat tests/semantic/d4-eval-value-call-laws.bits)" ]]; then
            echo "::error::D4_EVAL_T5_WORD_PARITY layer=transport expected=exact-bits actual=decoded-words" >&2
            exit 1
          fi
          sha256sum tests/semantic/d4-eval-value-call-laws.bits tests/semantic/d4-eval-invalid-arity.bits "$d4_eval_positive" "$d4_eval_negative" lib/core4.lisp target/debug/sens
          python3 scripts/ci_failure_contract.py run \
            --test-id sens-d4-eval-value-call \
            --layer eval \
            --fixture "$d4_eval_positive" \
            --expected-file "$expected_d1" \
            --executor-report-file "$RUNNER_TEMP/sens-native-evidence.jsonl" \
            --report-file "$RUNNER_TEMP/sens-focal-red.jsonl" \
            -- target/debug/sens "$d4_eval_positive"
          python3 scripts/ci_failure_contract.py run \
            --test-id sens-d4-eval-invalid-arity \
            --layer eval \
            --fixture "$d4_eval_negative" \
            --expect-error-substring "D4:0001: expected /" \
            --executor-report-file "$RUNNER_TEMP/sens-native-evidence.jsonl" \
            --report-file "$RUNNER_TEMP/sens-focal-red.jsonl" \
            -- target/debug/sens "$d4_eval_negative"
          echo "D4_EVAL_PHYSICAL_NATIVE_PASS identity=D4:0001 positive=1 negative=1 executor=target/debug/sens"
          cargo test --locked -p sens --lib exact_d4_eval_runs_represented_code_and_keeps_width_qualified_identity -- --nocapture
          echo "D4_EVAL_MECHANISM_UNIT_PASS identity=D4:0001 executor=Rust-unit semantic_authority=SENS"
          # Чотири ратифіковані D5 ідентичності: українська SENS-проєкція.
          d5_projection="tests/semantic/d5-uk-projection-laws.lisp"
          sha256sum "$d5_projection" lib/core4.lisp target/debug/sens
          if ! d5_observed="$(target/debug/sens "$d5_projection" 2>&1)"; then
            printf '%s\n' "$d5_observed" >&2
            echo "::error::D5_UK_NATIVE_RED layer=eval fixture=$d5_projection expected=(1,1,1,1,1,1,1,1) actual=execution-error" >&2
            exit 1
          fi
          printf '%s\n' "$d5_observed"
          d5_actual="${d5_observed##*$'\n'}"
          if [[ "$d5_actual" != "(1 1 1 1 1 1 1 1)" ]]; then
            echo "::error::D5_UK_LAW_DIFF layer=eval fixture=$d5_projection expected=(1,1,1,1,1,1,1,1) actual=$d5_actual" >&2
            exit 1
          fi
          echo "D5_UK_NATIVE_PASS functions=5 laws=8 authority=SENS"
          # D6:010011 ABS / модуль — nine native SENS laws, exact D24+ operands.
          d6_abs_fixture="tests/semantic/d6-abs-laws.lisp"
          d6_abs_bad="tests/semantic/d6-abs-reject-nonnumeric.lisp"
          sha256sum "$d6_abs_fixture" "$d6_abs_bad" lib/core4.lisp target/debug/sens
          if ! d6_abs_observed="$(target/debug/sens "$d6_abs_fixture" 2>&1)"; then
            printf '%s\n' "$d6_abs_observed" >&2
            echo "::error::D6_ABS_EXEC_RED layer=eval fixture=$d6_abs_fixture expected=9-D1-YES actual=execution-error" >&2
            exit 1
          fi
          printf '%s\n' "$d6_abs_observed"
          d6_abs_actual="$(printf '%s\n' "$d6_abs_observed" | tail -n1)"
          if [[ "$d6_abs_actual" != "(1 1 1 1 1 1 1 1 1)" ]]; then
            echo "::error::D6_ABS_LAW_DIFF layer=eval fixture=$d6_abs_fixture expected=(1 1 1 1 1 1 1 1 1) actual=$d6_abs_actual" >&2
            exit 1
          fi
          if d6_abs_bad_output="$(target/debug/sens "$d6_abs_bad" 2>&1)"; then
            echo "::error::D6_ABS_ACCEPTED_NONNUMERIC layer=eval fixture=$d6_abs_bad expected=D24-type-refusal actual=accepted" >&2
            exit 1
          fi
          printf '%s\n' "$d6_abs_bad_output"
          if ! grep -Eq 'D24\+|numeric|number|comparison' <<< "$d6_abs_bad_output"; then
            echo "::error::D6_ABS_UNRELATED_NEGATIVE layer=eval fixture=$d6_abs_bad expected=numeric-domain-diagnostic actual=other-error" >&2
            exit 1
          fi
          echo "D6_ABS_NATIVE_PASS identity=D6:010011 positive=9 negative=1 exact_numeric_domain=D24+"
          # D6:001110 / D6:001111 — SENS D24+ arithmetic plus one-bit output mutants.
          d6_math_law="tests/semantic/d6-add1-sub1-laws.lisp"
          d6_math_mutant="tests/semantic/d6-add1-sub1-mutant.lisp"
          sha256sum "$d6_math_law" "$d6_math_mutant" lib/core4.lisp target/debug/sens
          if ! d6_math_output="$(target/debug/sens "$d6_math_law" 2>&1)"; then
            echo "::error::D6_ADD_SUB_EXEC_RED layer=eval fixture=$d6_math_law expected=(1 1 1 1) actual=execution-error" >&2
            printf '%s\n' "$d6_math_output" >&2
            exit 1
          fi
          d6_math_actual="$(printf '%s\n' "$d6_math_output" | tail -n1)"
          if [[ "$d6_math_actual" != "(1 1 1 1)" ]]; then
            echo "::error::D6_ADD_SUB_LAW_DIFF layer=eval fixture=$d6_math_law expected=(1 1 1 1) actual=$d6_math_actual" >&2
            exit 1
          fi
          if ! d6_mutant_output="$(target/debug/sens "$d6_math_mutant" 2>&1)"; then
            echo "::error::D6_ADD_SUB_MUTANT_EXEC_RED layer=eval fixture=$d6_math_mutant expected=(0 0) actual=execution-error" >&2
            printf '%s\n' "$d6_mutant_output" >&2
            exit 1
          fi
          d6_mutant_actual="$(printf '%s\n' "$d6_mutant_output" | tail -n1)"
          if [[ "$d6_mutant_actual" != "(0 0)" ]]; then
            echo "::error::D6_ADD_SUB_MUTANT_ACCEPTED layer=eval fixture=$d6_math_mutant expected=(0 0) actual=$d6_mutant_actual" >&2
            exit 1
          fi
