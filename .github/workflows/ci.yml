name: SENS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sens-and-mechanisms:
    name: Rust/Zig механізми та SENS REPL
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: ./.github/actions/install-zig
      - name: Перевірити компіляцію workspace
        run: cargo check --locked --workspace
      - name: Зібрати REPL SENS
        run: cargo build --locked -p sens-cli --bin sens
      - name: Перевірити двійкові свідки функцій Ліспа 1.5
        run: cargo test --locked -p sens-cli --bin sens-trit d7_zig_cli_boundary_tests
      # Вимірювання власної мови. ЦІЛЬ із реєстру: D6 додати-1 (001110).
      # Обсяг обмежений: три повтори, один фіксований бенчмарк.
      # Однакова функціональна одиниця для трьох мов: T01 наївна рекурсія
      # Фібоначчі, n=12, очікуваний результат 144. Тут SENS можна ставити
      # поруч із C і JavaScript — задача та сама.
      - name: Виміряти T01 (fib 12) у C, JavaScript і SENS
        shell: bash
        run: |
          set -euo pipefail
          CORP="benchmarks/language-energy-study/corpus"
          BIN="$PWD/target/debug/sens"
          OUT="$RUNNER_TEMP/t01-triad"
          mkdir -p "$OUT"
          export TASK_ID="T01-symbolic-recursion" TASK_N=12
          test -x "$BIN"
          command -v node >/dev/null
          test -x /usr/bin/time
          command -v timeout >/dev/null
          cc -std=c11 -O2 -o "$OUT/t01_c" "$CORP/c/t01_fib.c"
          "$BIN" --t5m-mint "$CORP/sens/t01_fib.lisp" "$OUT/t01.sens"
          test -s "$OUT/t01.sens"
          printf '144\n' > "$OUT/expected.stdout"
          {
            printf 'source_sha\t%s\n' "$(git rev-parse HEAD)"
            printf 'machine\t%s\n' "$(uname -srmo)"
            printf 'cpu\t%s\n' "$(awk -F: '/^model name/{gsub(/^[ \t]+/,"",$2); print $2; exit}' /proc/cpuinfo)"
            printf 'sens_version\t%s\n' "$("$BIN" --version)"
            printf 'node_version\t%s\n' "$(node --version)"
            printf 'compiler\t%s\n' "$(cc --version | head -1)"
            printf 'source_c\t%s\n' "$CORP/c/t01_fib.c"
            printf 'source_js\t%s\n' "$CORP/javascript/t01_fib.mjs"
            printf 'source_sens\t%s\n' "$CORP/sens/t01_fib.lisp"
            printf 'functional_unit\tT01 naive fib(12), stdout 144\n'
            printf 'phase\tcold process incl. startup; C optimized, SENS debug; build excluded\n'
            printf 'energy\tENERGY_NOT_MEASURED\n'
            printf 'admission\tEXPLORATORY; single shared runner session, no ranking\n'
          } > "$OUT/environment.tsv"
          printf 'round\tlanguage\twall_seconds\tpeak_rss_kib\tchild_exit\tstdout\n' > "$OUT/samples.tsv"
          measure() {
            local round="$1" language="$2"
            shift 2
            local prefix="$OUT/$round-$language" wall rss exit_code trailing
            if ! timeout 30s /usr/bin/time -f '%e %M %x' -o "$prefix.time" \
                 "$@" > "$prefix.stdout" 2> "$prefix.stderr"; then
              echo "BLOCKED child_failure round=$round language=$language" >&2
              cat "$prefix.stderr" >&2
              return 1
            fi
            if ! cmp -s "$OUT/expected.stdout" "$prefix.stdout"; then
              echo "BLOCKED wrong_output round=$round language=$language" >&2
              cat "$prefix.stdout" >&2
              return 1
            fi
            if ! read -r wall rss exit_code trailing < "$prefix.time"; then
              echo "BLOCKED missing_time round=$round language=$language" >&2
              return 1
            fi
            if [[ ! "$wall" =~ ^[0-9]+([.][0-9]+)?$ || ! "$rss" =~ ^[0-9]+$ || "$rss" == 0 ||
                  "$exit_code" != 0 || -n "$trailing" ]]; then
              echo "BLOCKED invalid_time round=$round language=$language" >&2
              return 1
            fi
            printf '%s\t%s\t%s\t%s\t%s\t144\n' "$round" "$language" "$wall" "$rss" "$exit_code" \
              >> "$OUT/samples.tsv"
          }
          for round in 1 2 3; do
            case "$round" in
              1) order=(C JS SENS) ;;
              2) order=(JS SENS C) ;;
              3) order=(SENS C JS) ;;
            esac
            for language in "${order[@]}"; do
              case "$language" in
                C) measure "$round" C "$OUT/t01_c" ;;
                JS) measure "$round" JS node "$CORP/javascript/t01_fib.mjs" ;;
                SENS) measure "$round" SENS "$BIN" "$OUT/t01.sens" ;;
              esac
            done
          done
          cat "$OUT/environment.tsv"
          cat "$OUT/samples.tsv"
          echo "T01_TRIAD_EXPLORATORY_OUTPUT_VERIFIED; ENERGY_NOT_MEASURED"

      - name: Зберегти сирі T01 проби навіть при RED
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t01-triad-${{ github.run_id }}
          path: ${{ runner.temp }}/t01-triad/
          if-no-files-found: warn
          retention-days: 3
      - name: Виміряти SENS — час і піковий RSS (D6 додати-1)
        shell: bash
        run: |
          set -uo pipefail
          BIN="$PWD/target/debug/sens"
          BENCH="benchmarks/sphere-contest/сенс-семантика.lisp"
          [ -x "$BIN" ] || { echo "SENS_BINARY_NOT_BUILT"; exit 1; }
          for round in 1 2 3; do
            echo "--- повтор $round ---"
            /usr/bin/time -v "$BIN" "$BENCH" 2>&1 | grep -E "PHYSICAL|Maximum resident|Elapsed|SENS_|так|ні" | head -8
          done
      - name: Перевірити Zig транспортні механізми
        run: zig test -lc research/zig-codecs/tests.zig
      - name: Перевірити мовні закони тільки виконанням SENS REPL
        run: bash scripts/prove-repl-semantic-corpus.sh "$PWD/target/debug/sens"
      - name: Перевірити D8/D10 огляд середовища через SENS REPL
        run: bash scripts/prove-repl-environment.sh "$PWD/target/debug/sens"

  research-tools:
    name: Інструменти досліду · синтетичні перевірки
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Перевірити Python-інструменти досліду
        run: |
          python3 --version
          python3 -m unittest discover -s benchmarks/language-energy-study -p 'test_*.py' -v
          python3 -m unittest discover -s docs/research/energy-study -p 'test_*.py' -v
          python3 -m py_compile benchmarks/measurement-triad/verdict.py
      # Вимірювання на реальному раннері — лише ручний запуск.
      # Тут є /usr/bin/time, cc і rustc, яких немає в пісочниці агента.
      # Обсяг обмежений: 8192 копії, три повтори, один корпус.
      - name: Вимірювання пілоту на раннері (ручний запуск)
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -uo pipefail
          cd benchmarks/language-energy-study
          head -c 65536 /dev/urandom > "$RUNNER_TEMP/corpus.bin"
          cc -O2 -o "$RUNNER_TEMP/copy_c" copy.c
          if command -v rustc >/dev/null 2>&1; then
            rustc -O -o "$RUNNER_TEMP/copy_rs" copy.rs && echo "RUST_AVAILABLE"
          else
            echo "RUST_NOT_AVAILABLE"
          fi
          echo "=== очікуване (незалежно) ==="
          python3 -c 'import sys;d=open(sys.argv[1],"rb").read();n=int(sys.argv[2]);print(f"PHYSICAL_COPY\tbytes={len(d)}\tcopies={n}\tobserved={sum(d[i % len(d)] for i in range(n))}")' "$RUNNER_TEMP/corpus.bin" 8192
          echo "=== пік групи (cgroup v2, N4) ==="
          if [ -r /sys/fs/cgroup/memory.peak ]; then
            cat /sys/fs/cgroup/memory.peak || true
          else
            echo "CGROUP_PEAK_NOT_AVAILABLE"
          fi
          for round in 1 2 3; do
            echo "=== повтор $round ==="
            /usr/bin/time -v "$RUNNER_TEMP/copy_c" "$RUNNER_TEMP/corpus.bin" 8192 2>&1 | grep -E "PHYSICAL_COPY|Maximum resident"
            /usr/bin/time -v python3 copy.py "$RUNNER_TEMP/corpus.bin" 8192 2>&1 | grep -E "PHYSICAL_COPY|Maximum resident"
            if [ -x "$RUNNER_TEMP/copy_rs" ]; then
              /usr/bin/time -v "$RUNNER_TEMP/copy_rs" "$RUNNER_TEMP/corpus.bin" 8192 2>&1 | grep -E "PHYSICAL_COPY|Maximum resident"
            fi
          done

  cross-platform-parity:
    name: Відтворення parity на другій платформі (ручний запуск)
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Parity на ${{ matrix.os }}
        shell: bash
        run: |
          set -uo pipefail
          cd benchmarks/language-energy-study
          head -c 65536 /dev/urandom > "$RUNNER_TEMP/corpus.bin"
          cc -O2 -o "$RUNNER_TEMP/copy_c" copy.c
          echo "PLATFORM=${{ matrix.os }}"
          "$RUNNER_TEMP/copy_c" "$RUNNER_TEMP/corpus.bin" 8192
          python3 copy.py "$RUNNER_TEMP/corpus.bin" 8192
          python3 -c 'import sys;d=open(sys.argv[1],"rb").read();n=int(sys.argv[2]);print(f"PHYSICAL_COPY\tbytes={len(d)}\tcopies={n}\tobserved={sum(d[i % len(d)] for i in range(n))}")' "$RUNNER_TEMP/corpus.bin" 8192
