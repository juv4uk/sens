name: CI — основні перевірки SENS

# OWNER 2026-10-13: ONE automatic workflow per main commit.
# All other topic workflows are manual; a single scoped check is chosen here.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sens-one-focused-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Перевірка ядра та доменного контракту
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 2
      - name: Один причинно пов'язаний точковий тест
        env:
          SENS_CI_BEFORE: ${{ github.event.before }}
        run: python3 scripts/ci_one_focused_workflow.py --execute
