name: SENS — єдиний автоматичний двійковий свідок
# Лише один job для вже перевіреної фізичної SENS-програми й негативного мутанта.
# Зовнішній Python тільки пакує докази, не визначає значення EQ/COND.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ci.yml'
      - 'scripts/ci_one_focused_workflow.py'
      - 'crates/sens/src/eval/**'
      - 'crates/sens/src/domain_ladder.rs'
      - 'crates/sens/src/domain_identity.rs'
      - 'lib/domains/**'
      - 'tests/semantic/domain-logic-2040/**'
permissions:
  contents: read
concurrency:
  group: sens-one-automatic-${{ github.ref }}
  cancel-in-progress: false
jobs:
  binary-self-verdict:
    name: SENS сам перевіряє свої закони та мутант
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@1.99.0
      - name: Рівно один автоматичний точковий SENS-свідок
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci_one_focused_workflow.py --execute
