name: "SENS — трійка .lisp → .sens → без розширення"

# Одна умова: створено або змінено .lisp — перекарбувати фізичний носій.
# Нічого більше цей workflow не робить.
on:
  push:
    branches: [main]
    paths:
      - "**.lisp"
  workflow_dispatch:

concurrency:
  group: lisp-triplet-mint
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  mint:
    name: Перекарбувати трійку
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Пінований Zig
        uses: ./.github/actions/install-zig

      - name: Тулчейн Rust
        uses: dtolnay/rust-toolchain@1.99.0

      - name: Зібрати карбувальник
        run: cargo build --locked -p sens-cli --bin sens --bin sens-trit

      - name: Перекарбувати змінені .lisp
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            changed="$(git ls-files '*.lisp')"
          else
            changed="$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" -- '*.lisp')"
          fi
          if [ -z "$changed" ]; then
            echo "TRIPLET_NO_LISP_CHANGED"
            exit 0
          fi
          while IFS= read -r f; do
            [ -f "$f" ] || continue
            echo "TRIPLET_MINT source=$f"
            binding_args=()
            profile_args=()
            case "$f" in
              tests/semantic/d9-d10-defined-functions-law.lisp)
                binding_args=(--binding-source lib/world.lisp)
                profile_args=(--core4-runtime)
                ;;
            esac
            bash scripts/refresh-verified-t5m-pair.sh "$f" \
              target/debug/sens target/debug/sens-trit \
              "${binding_args[@]}" "${profile_args[@]}"
          done <<< "$changed"

      - name: Закомітити трійки
        shell: bash
        run: |
          set -euo pipefail
          git config user.name  "sens-triplet"
          git config user.email "sens-triplet@users.noreply.github.com"
          # Комітимо лише те, що породило карбування: .sens і файл без
          # розширення. Самі .lisp не чіпаємо — вони джерело, не продукт.
          git add -A -- ':!*.lisp'
          if git diff --cached --quiet; then
            echo "TRIPLET_NOTHING_TO_COMMIT"
            exit 0
          fi
          git commit -m "трійка: перекарбовано .sens і файл без розширення після зміни .lisp"
          git push
