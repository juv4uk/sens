name: "SENS — швидкий CI та ручні цільові перевірки"

on:
  # 01:43 UTC = 03:43 Kyiv (winter) / 04:43 Kyiv (summer).
  # schedule only operates after this workflow lands on the default branch.
  schedule:
    - cron: '43 1 * * *'
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      suite:
        description: "Який набір виконати вручну"
        required: true
        type: choice
        default: quick
        options:
          - quick
          - runner-smoke
          - platform-repl-bench
          - language-energy-pilot
          - native
          - laws
          - remint
          - release-preflight
      candidate_sha:
        description: "Точний SHA опублікованої фізичної пари для release-preflight"
        required: false
        type: string
        default: ""
      files:
        description: "Точні .lisp шляхи для suite=remint, по одному на рядок"
        required: false
        type: string
        default: ""

# Навмисно немає concurrency/cancel-in-progress: кожен push зберігає свій CI.
permissions:
  contents: read

jobs:
  sens:
    name: Охоронець · Rust · Zig · SENS
    if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.suite == 'quick') }}
    runs-on: ubuntu-24.04
    # Піднято з 8: компіляція `sens` (крок нижче) не вкладалась у 8 хвилин,
    # а без неї PR міг злитись зі зламаною бібліотекою.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.99.0
      # sens/build.rs вимагає пінований Zig: без нього cargo check падає
      # на "binary bootstrap requires pinned Zig".
      - uses: ./.github/actions/install-zig
      # Компіляційний гейт для crates/sens/src/. Без нього PR зливали зміни,
      # які ламали збірку: саме так стались E0603 і E0308 (виклик функції
      # з непридатного модуля) — обидва виявились аж у preflight, не в PR.
      - name: Компіляція бібліотеки sens
        shell: bash
        run: cargo check --locked -p sens --lib
      # Конкурс бенчмарків за сферами: SENS — семантика, Zig — корідор,
      # Rust — механізм. ЦІЛЬ із реєстру: D6 додати-1 (001110).
      - name: Конкурс бенчмарків за сферами
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked -p sens-cli --bin sens
          export PATH="$PWD/target/debug:$PATH"
          export ZIG="$(command -v zig)"
          bash benchmarks/sphere-contest/запуск.sh
      - name: Мовний SENS REPL · позитивні закони та негативні мутанти
        shell: bash
        run: bash scripts/prove-repl-semantic-corpus.sh "$PWD/target/debug/sens"
      - name: D8/D10 огляд середовища через інтерактивний SENS REPL
        shell: bash
        run: bash scripts/prove-repl-environment.sh "$PWD/target/debug/sens"
      # rust-isolated — єдиний доказ ізоляції Rust↔SENS. Досі він жив лише
      # в списку GATES файлу release_go_gate.py і не викликався жодним
      # workflow: тобто не перевірявся ніде, крім ручного прогону.
      - name: Ізоляція Rust↔SENS лише через Zig
        shell: bash
        run: bash scripts/check_rust_isolated_only_zig.sh
      - name: Перевірити формат diff і синтаксис оболонки
        shell: bash
        run: |
          set -euo pipefail
          git diff --check HEAD^ HEAD
          bash -n scripts/check-sens-only-semantic-tests.sh
          bash -n scripts/check-language-policy-archive.sh
          bash -n scripts/ci-rust-mechanism-checks.sh
          bash -n scripts/execute_changed_lisp_t5m.sh
          bash -n scripts/prove-lisp-semantic-t5m.sh
          bash -n scripts/prove-repl-semantic-corpus.sh
          bash -n scripts/check-sens-rust-zig-only-tests.sh
          bash scripts/check-sens-rust-zig-only-tests.sh
      - name: Перевірити межу власності мовних тестів
        shell: bash
        env:
          SENS_EVENT_NAME: ${{ github.event_name }}
          SENS_PR_BODY: ${{ github.event.pull_request.body }}
          SENS_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          SENS_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/check-sens-only-semantic-tests.sh
      - name: Перевірити реєстр ARCHIVE та сторонні runners
        shell: bash
        run: bash scripts/check-language-policy-archive.sh
      - name: Публічний підсумок коридору / архіву
        shell: bash
        run: |
          set -euo pipefail
          count="$(grep -cE '\|[[:space:]]*ARCHIVE[[:space:]]*\|?$' docs/language-policy-archive.md || true)"
          echo "ARCHIVE (поза мовним коридором): ${count} артефактів — docs/language-policy-archive.md"
          echo "ARCHIVE (поза мовним коридором): ${count} артефактів — docs/language-policy-archive.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Статус
        run: echo "QUICK_CI_STATUS=ok heavy_native_laws_remint_release=MANUAL_TARGETED"


  # Обмежений тест стандартних безкоштовних GitHub-hosted runners.
  # Ніякої семантичної влади: ці jobs перевіряють host, exact-head та компіляцію.
  free-runner-linux-x64:
    name: Runner smoke · Ubuntu x64 · Rust/Zig host
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.suite == 'runner-smoke' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: ./.github/actions/install-zig
      - name: Exact PR head і host compilation
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$RUNNER_OS" = Linux
          test "$RUNNER_ARCH" = X64
          zig version
          cargo check --locked -p sens-cli --features zig-transport
          echo "Ubuntu x64: host build complete at $EXPECTED_SHA; not SENS semantic verification"

  free-runner-linux-arm64:
    name: Runner smoke · Ubuntu ARM64 · source portability
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.suite == 'runner-smoke' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Exact PR head і ARM64 джерела
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$RUNNER_OS" = Linux
          test "$RUNNER_ARCH" = ARM64
          test -s lib/repl-core.lisp
          test -s lib/meta-eval.lisp
          bash -n scripts/prove-repl-semantic-corpus.sh
          bash -n scripts/prove-meta-eval-graph-d1.sh
          echo "Ubuntu ARM64: source and shell portability only; Zig installer unsupported"

  free-runner-windows-x64:
    name: Windows x64 · SENS CLI native build · Zig transport
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.suite == 'runner-smoke' }}
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: ./.github/actions/install-zig
      - name: Exact PR head і Windows native SENS збірка
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $actual = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $actual -ne $env:EXPECTED_SHA) { throw 'Wrong checkout SHA' }
          if ($env:RUNNER_OS -ne 'Windows' -or $env:RUNNER_ARCH -ne 'X64') { throw 'Wrong runner architecture' }
          foreach ($path in @('AGENTS.md', 'lib/repl-core.lisp', 'lib/meta-eval.lisp', 'Cargo.toml')) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "Missing file: $path" }
          }
          & zig version
          if ($LASTEXITCODE -ne 0) { throw 'Pinned Zig unavailable on Windows' }
          & cargo build --locked -p sens-cli --bin sens --features zig-transport
          if ($LASTEXITCODE -ne 0) { throw "Windows cargo build failed with code $LASTEXITCODE" }
          $binary = 'target/debug/sens.exe'
          if (-not (Test-Path -LiteralPath $binary -PathType Leaf) -or (Get-Item -LiteralPath $binary).Length -le 0) {
            throw 'Windows SENS binary not produced'
          }
          Write-Host "Windows SENS CLI built from $actual with Zig transport; no semantic proof"
      - name: Зберегти Windows sens.exe як CI artifact (не реліз)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sens-windows-x64-${{ github.event.pull_request.head.sha || github.sha }}
          path: target/debug/sens.exe
          if-no-files-found: error
          retention-days: 3


  # Nightly only on default branch; manual before release via suite=platform-repl-bench.
  # Temporary PR activation strictly for this short-lived rollout branch.
  # Every result is exact-head and real native SENS: Rust mechanism, Zig transport.
  cross-platform-repl-bench:
    name: SENS REPL + benchmarks · ${{ matrix.label }}
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.suite == 'platform-repl-bench') || (github.event_name == 'pull_request' && github.head_ref == 'agent/free-hosted-runners-20261028') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - os: ubuntu-24.04
            label: linux-x64
            binary: target/release/sens
            arch: X64
          - os: windows-2025
            label: windows-x64
            binary: target/release/sens.exe
            arch: X64
          - os: macos-15-intel
            label: macos-intel
            binary: target/release/sens
            arch: X64
          - os: macos-15
            label: macos-arm64
            binary: target/release/sens
            arch: ARM64
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: ./.github/actions/install-zig
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          key: nightly-repl-${{ matrix.label }}
      - name: Exact-head і SENS CLI release build з Zig
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EXPECTED_ARCH: ${{ matrix.arch }}
          CARGO_BUILD_JOBS: "2"
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$RUNNER_ARCH" = "$EXPECTED_ARCH"
          test "$RUNNER_NAME" != ""
          zig version
          cargo build --locked --release -p sens-cli --bin sens --features zig-transport
          test -x "${{ matrix.binary }}"
      - name: RAPL Rust механізм · арифметика wrap і domain (не семантика SENS)
        if: matrix.label == 'linux-x64'
        shell: bash
        run: |
          set -euo pipefail
          rustc --edition=2021 --test benchmarks/mechanism/rapl-energy-bench.rs -o "$RUNNER_TEMP/rapl-mechanism-tests"
          "$RUNNER_TEMP/rapl-mechanism-tests"
      - name: Нативний SENS REPL · 32 позитивні/негативні свідки
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-metrics
          # GNU timeout does not exist on stock macOS; a strict job timeout
          # applies to ALL platforms. No language-law checks in the host.
          SENS_REPL_PORTABLE=1 bash scripts/prove-repl-semantic-corpus.sh "$PWD/${{ matrix.binary }}" | tee .ci-metrics/repl-corpus.log
      - name: SENS REPL bench · 11 cold/batch samples
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/ci-cross-platform-repl-benchmark.sh "$PWD/${{ matrix.binary }}" ".ci-metrics" | tee .ci-metrics/benchmark.log
      - name: Зберегти raw evidence (успіх або RED; це не реліз)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sens-repl-bench-${{ matrix.label }}-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: .ci-metrics/
          if-no-files-found: warn
          retention-days: 3


  # Manual scientific pilot; temporary exact-head PR trial on this rollout branch.
  # Python, C and Rust implement a matched physical copy; no SENS-language law.
  physical-language-study:
    name: Дослід · Python/C/Rust · час/енергія/пам'ять
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.suite == 'language-energy-pilot') || (github.event_name == 'pull_request' && github.head_ref == 'agent/free-hosted-runners-20261028') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.99.0
      - name: Exact-head і фізичні вимірювальні засоби
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          command -v python3 rustc cc
          test -x /usr/bin/time
          python3 --version
          rustc --version
          cc --version | head -1
          python3 -m unittest discover -s benchmarks/language-energy-study -p 'test_*.py' -v
      - name: 8 незалежних блоків · парні AB/BA · parity · Rust/Python/C
        shell: bash
        run: |
          set -euo pipefail
          python3 benchmarks/language-energy-study/study.py --blocks 8 --pairs 4 --copies 300000 --seed 20261028 --out .ci-physical-study
      - name: Сирі вимірювання і протокол (не release gate)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: physical-language-study-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: .ci-physical-study/
          if-no-files-found: warn
          retention-days: 7

  native:
    name: Ручний native Rust/Zig smoke
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.suite == 'native' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: ./.github/actions/install-zig
      - name: Перевірити native Rust-механізм без запуску чужих мовних тестів
        shell: bash
        run: cargo check --locked -p sens --lib
      - name: Build native SENS
        run: cargo build --locked -p sens-cli --bin sens --bin sens-trit --features benchmark-ast-visits
      - name: Rust mechanism checks
        run: bash scripts/ci-rust-mechanism-checks.sh
      - name: Zig codec and transport smoke
        shell: bash
        run: |
          set -euo pipefail
          scripts/ci-zig-purity --self-test
          zig test -lc research/zig-codecs/tests.zig
          zig test -lc zig_transport_root.zig

  laws:
    name: SENS/Zig/T5M закони — ручний набір або цільовий коміт
    # Точний маркер запускає доказ на тому самому SHA; решта push лишається легким.
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.suite == 'laws') || (github.event_name == 'push' && contains(github.event.head_commit.message, 'SENS_NATIVE_LAWS')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: ./.github/actions/install-zig
      - name: Build native SENS
        run: cargo build --locked -p sens-cli --bin sens --bin sens-trit --features benchmark-ast-visits
      # Legacy Rust semantic test targets were removed; never invoke them
      # or credit a deleted target with a successful native language proof.
      - name: SENS REPL · мовні закони, мутації та фізичний Zig/T5M
        shell: bash
        run: bash scripts/prove-repl-semantic-corpus.sh "$PWD/target/debug/sens"
      - name: MetaEval — SENS law, mutant і точна фізична T5M-пара
        shell: bash
        run: bash scripts/prove-meta-eval-graph-d1.sh "$PWD/target/debug/sens"
      - name: Execute SENS-native laws, mutants and benchmarks
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/prove-meta-eval-lexical-shadow-d1.sh "$PWD/target/debug/sens"
          bash scripts/prove-meta-eval-predicates-d1.sh "$PWD/target/debug/sens"
          bash scripts/prove-d4-selector-width.sh "$PWD/target/debug/sens"
          bash scripts/prove-твердження-m1.sh "$PWD/target/debug/sens"
          bash scripts/prove-бенчмарк-медіана.sh "$PWD/target/debug/sens"
          bash scripts/prove-бенчмарк-структура.sh "$PWD/target/debug/sens"
          bash scripts/prove-бенчмарк-умова.sh "$PWD/target/debug/sens"
          bash scripts/prove-ідентичність-тритів.sh "$PWD/target/debug/sens"
          bash scripts/prove-d3-атом-межа.sh "$PWD/target/debug/sens"
          bash scripts/prove-d3-як-є-щит.sh "$PWD/target/debug/sens"
          # Basic D1 is covered by the same interactive REPL semantic corpus.

  remint-source-scope:
    name: Виявити змінені джерела SENS
    if: ${{ github.event_name != 'schedule' && (github.event_name != 'workflow_dispatch' || inputs.suite != 'platform-repl-bench') }}
    runs-on: ubuntu-24.04
    outputs:
      has_sources: ${{ steps.scope.outputs.has_sources }}
      files: ${{ steps.scope.outputs.files }}
      has_release_gate_changes: ${{ steps.scope.outputs.has_release_gate_changes }}
      release_gate_files: ${{ steps.scope.outputs.release_gate_files }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        if: ${{ github.event_name == 'push' }}
        with:
          fetch-depth: 1

      - name: Обчислити точний перелік доданих і змінених джерел
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          files=()
          release_gate_files=()
          if [[ "${EVENT_NAME}" == "push" ]]; then
            if [[ "${PUSH_BEFORE}" =~ ^0+$ ]]; then
              paths="$(git -c core.quotePath=false diff-tree --root --no-commit-id --name-only -r "${PUSH_AFTER}")"
            else
              if ! git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
                git fetch --no-tags --depth=1 origin "${PUSH_BEFORE}"
              fi
              paths="$(git -c core.quotePath=false diff --no-ext-diff --name-only "${PUSH_BEFORE}" "${PUSH_AFTER}")"
            fi
            while IFS= read -r path; do
              [[ -n "${path}" ]] || continue
              if [[ "${path}" == *.lisp && -f "${path}" && ! -L "${path}" ]]; then
                files+=("${path}")
              fi
              case "${path}" in
                lib/*|crates/sens/*|crates/sens-cli/*|crates/sens-host/*|crates/sens-wasm/*|research/zig-codecs/*|zig_transport_root.zig|zig_bitpack_root.zig|domain_projection_assets.zig|wasm_source_assets.zig|Cargo.toml|Cargo.lock|crates/*/Cargo.toml|.github/workflows/ci.yml|.github/workflows/ci-heavy.yml|.github/workflows/release.yml|.github/workflows/release-preflight.yml|.github/workflows/release-publish.yml|tests/fixtures/wsm-fs-record-producer.lisp|benchmarks/contest-uk/*|scripts/refresh-verified-t5m-pair.sh)
                  release_gate_files+=("${path}")
                  ;;
              esac
            done <<< "${paths:-}"
          fi
          printf 'REMINT_SOURCE_SCOPE count=%s\n' "${#files[@]}"
          printf 'RELEASE_GATE_SCOPE count=%s\n' "${#release_gate_files[@]}"
          {
            echo 'files<<SENS_REMINT_FILES_END'
            printf '%s\n' "${files[@]}"
            echo 'SENS_REMINT_FILES_END'
          } >> "${GITHUB_OUTPUT}"
          if (("${#files[@]}" > 0)); then
            echo 'has_sources=true' >> "${GITHUB_OUTPUT}"
          else
            echo 'has_sources=false' >> "${GITHUB_OUTPUT}"
          fi
          {
            echo 'release_gate_files<<SENS_RELEASE_GATE_FILES_END'
            printf '%s\n' "${release_gate_files[@]}"
            echo 'SENS_RELEASE_GATE_FILES_END'
          } >> "${GITHUB_OUTPUT}"
          if (("${#release_gate_files[@]}" > 0)); then
            echo "has_release_gate_changes=true" >> "${GITHUB_OUTPUT}"
          else
            echo "has_release_gate_changes=false" >> "${GITHUB_OUTPUT}"
          fi

  remint-input-required:
    name: Remint потребує явний список файлів
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.suite == 'remint' && inputs.files == '' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Не запускати широкий remint без області
        run: |
          echo "::error title=REMINT_SCOPE_REQUIRED::Вкажіть точні .lisp файли в полі files; автоматичний широкий remint вимкнений у короткому CI."
          exit 1

  remint:
    name: Канонічний SENS/Zig/T5M remint точних файлів
    needs: remint-source-scope
    # Перелік змін визначається через git diff, а не через крихкі поля події push.
    if: ${{ always() && ((github.event_name == 'workflow_dispatch' && inputs.suite == 'remint' && inputs.files != '') || (github.event_name == 'push' && (needs['remint-source-scope'].outputs.has_sources == 'true' || contains(github.event.head_commit.message, 'SENS_REMINT_META_EVAL_GRAPH_D1') || contains(github.event.head_commit.message, 'SENS_REMINT_COMPILER_NUCLEUS') || contains(github.event.head_commit.message, 'SENS_REMINT_CORE4_D5') || contains(github.event.head_commit.message, 'SENS_REMINT_F6_KEY_CANON') || contains(github.event.head_commit.message, 'F6_PRODUCER_REMINT') || contains(github.event.head_commit.modified, 'scripts/refresh-verified-t5m-pair.sh') || contains(github.event.head_commit.message, 'SENS_REMINT_RELEASE_REASONING_F6') || contains(github.event.head_commit.message, 'SENS_REMINT_CORE4_P_R_SELECTOR') || contains(github.event.head_commit.message, 'SENS_REMINT_TRANSLATION_BOUNDARY') || contains(github.event.head_commit.message, 'SENS_PAIR_REGEN')))) }}
    uses: ./.github/workflows/remint-drifted-pairs.yml
    with:
      files: |
        ${{ inputs.files }}
        ${{ needs['remint-source-scope'].outputs.files }}
        ${{ github.event_name == 'push' && (contains(github.event.head_commit.message, 'SENS_REMINT_META_EVAL_GRAPH_D1') || contains(github.event.head_commit.modified, 'tests/semantic/meta-eval-graph-d1-law.lisp')) && 'tests/semantic/meta-eval-graph-d1-law.lisp' || '' }}
        ${{ github.event_name == 'push' && (contains(github.event.head_commit.message, 'SENS_REMINT_META_EVAL_GRAPH_D1') || contains(github.event.head_commit.modified, 'tests/semantic/meta-eval-graph-d1-mutant.lisp')) && 'tests/semantic/meta-eval-graph-d1-mutant.lisp' || '' }}
        ${{ github.event_name == 'push' && (contains(github.event.head_commit.message, 'SENS_REMINT_COMPILER_NUCLEUS')) && 'lib/compiler-nucleus.lisp' || '' }}
        ${{ github.event_name == 'push' && contains(github.event.head_commit.message, 'SENS_REMINT_CORE4_D5') && 'lib/core4.lisp' || '' }}
        ${{ github.event_name == 'push' && contains(github.event.head_commit.message, 'SENS_REMINT_CORE4_P_R_SELECTOR') && 'lib/core4.lisp' || '' }}
        ${{ github.event_name == 'push' && contains(github.event.head_commit.message, 'SENS_REMINT_F6_KEY_CANON') && 'lib/lisp-fs.lisp' || '' }}
        ${{ github.event_name == 'push' && (contains(github.event.head_commit.message, 'F6_PRODUCER_REMINT') || contains(github.event.head_commit.modified, 'scripts/refresh-verified-t5m-pair.sh')) && 'tests/fixtures/wsm-fs-record-producer.lisp' || '' }}
        ${{ github.event_name == 'push' && contains(github.event.head_commit.message, 'SENS_REMINT_RELEASE_REASONING_F6') && 'lib/core4.lisp' || '' }}
        ${{ github.event_name == 'push' && contains(github.event.head_commit.message, 'SENS_REMINT_RELEASE_REASONING_F6') && 'lib/forward.lisp' || '' }}
        ${{ github.event_name == 'push' && contains(github.event.head_commit.message, 'SENS_REMINT_RELEASE_REASONING_F6') && 'lib/knowledge.lisp' || '' }}
        ${{ github.event_name == 'push' && contains(github.event.head_commit.message, 'SENS_REMINT_RELEASE_REASONING_F6') && 'lib/world.lisp' || '' }}
        ${{ github.event_name == 'push' && contains(github.event.head_commit.message, 'SENS_REMINT_RELEASE_REASONING_F6') && 'lib/reason.lisp' || '' }}
        ${{ github.event_name == 'push' && contains(github.event.head_commit.message, 'SENS_REMINT_RELEASE_REASONING_F6') && 'lib/translation.lisp' || '' }}
        ${{ github.event_name == 'push' && contains(github.event.head_commit.message, 'SENS_REMINT_RELEASE_REASONING_F6') && 'lib/lisp-fs.lisp' || '' }}
        ${{ github.event_name == 'push' && contains(github.event.head_commit.message, 'SENS_REMINT_RELEASE_REASONING_F6') && 'tests/fixtures/wsm-fs-record-producer.lisp' || '' }}
        ${{ github.event_name == 'push' && contains(github.event.head_commit.message, 'SENS_REMINT_TRANSLATION_BOUNDARY') && 'lib/core4.lisp' || '' }}
        ${{ github.event_name == 'push' && contains(github.event.head_commit.message, 'SENS_REMINT_TRANSLATION_BOUNDARY') && 'lib/translation.lisp' || '' }}
        ${{ github.event_name == 'push' && (contains(github.event.head_commit.message, 'SENS_REMINT_TRANSLATION_BOUNDARY') || contains(github.event.head_commit.message, 'SENS_PAIR_REGEN')) && 'tests/fixtures/wsm-fs-record-producer.lisp' || '' }}
    permissions:
      contents: write

  release-preflight:
    name: Exact-SHA release preflight — ручний або позначений коміт
    needs: [remint-source-scope, remint]
    # Повний preflight запускається вручну або за явним маркером; звичайний push лишається швидким.
    if: ${{ always() && ((github.event_name == 'pull_request' && startsWith(github.event.pull_request.title, 'SENS_RELEASE_PREFLIGHT:')) || (github.event_name == 'workflow_dispatch' && inputs.suite == 'release-preflight') || (github.event_name == 'push' && (needs['remint-source-scope'].outputs.has_release_gate_changes == 'true' || contains(needs['remint-source-scope'].outputs.release_gate_files, 'crates/sens-cli/src/bin/wsm-fs-record-producer.rs') || contains(needs['remint-source-scope'].outputs.release_gate_files, 'crates/sens-cli/src/bin/wsm-fs-record-consumer.rs') || contains(needs['remint-source-scope'].outputs.release_gate_files, 'crates/sens/src/eval/special_forms/core.rs') || contains(github.event.head_commit.message, 'SENS_RELEASE_PREFLIGHT') || contains(github.event.head_commit.message, 'SENS_REMINT_RELEASE_REASONING_F6') || contains(github.event.head_commit.message, '#6183') || contains(toJSON(github.event.commits), 'lib/lisp-fs.sens') || contains(toJSON(github.event.commits), 'lib/translation.sens') || contains(toJSON(github.event.commits), 'lib/core4.sens') || contains(toJSON(github.event.commits), 'lib/knowledge.sens') || contains(toJSON(github.event.commits), 'lib/world.sens') || contains(toJSON(github.event.commits), 'lib/reason.sens') || contains(toJSON(github.event.commits), 'lib/forward.sens') || contains(toJSON(github.event.commits), 'lib/compiler-nucleus.sens') || contains(needs['remint-source-scope'].outputs.files, 'lib/') || startsWith(github.event.head_commit.message, 'ремонт пар:') || startsWith(github.event.head_commit.message, 'Translation boundary:') || startsWith(github.event.head_commit.message, 'Переклад:') || startsWith(github.event.head_commit.message, 'SENS:') || startsWith(github.event.head_commit.message, 'Tests:') || startsWith(github.event.head_commit.message, 'CI:') || startsWith(github.event.head_commit.message, 'GPU smoke:') || startsWith(github.event.head_commit.message, 'Release:') || startsWith(github.event.head_commit.message, 'Реліз:') || startsWith(github.event.head_commit.message, 'Мова:') || startsWith(github.event.head_commit.message, 'release:') || contains(github.event.head_commit.modified, '.github/workflows/ci.yml') || contains(toJSON(github.event.commits), '.github/workflows/ci.yml') || contains(github.event.head_commit.modified, '.github/workflows/ci-heavy.yml') || contains(github.event.head_commit.modified, '.github/workflows/release.yml') || contains(github.event.head_commit.modified, '.github/workflows/release-preflight.yml') || contains(github.event.head_commit.modified, '.github/workflows/release-publish.yml') || contains(github.event.head_commit.modified, 'RELEASE-EVIDENCE.md') || contains(join(github.event.head_commit.modified, ','), 'lib/') || contains(join(github.event.head_commit.modified, ','), 'Cargo.toml') || contains(join(github.event.head_commit.modified, ','), 'Cargo.lock') || contains(github.event.head_commit.modified, 'Cargo.toml') || contains(github.event.head_commit.modified, 'Cargo.lock') || contains(github.event.head_commit.modified, 'crates/sens/Cargo.toml') || contains(github.event.head_commit.modified, 'crates/sens-cli/Cargo.toml') || contains(github.event.head_commit.modified, 'crates/sens/tests/translation_boundary.rs') || contains(github.event.head_commit.modified, 'crates/sens/src/mixed_source.rs') || contains(github.event.head_commit.modified, 'crates/sens/src/compiler_language.rs') || contains(github.event.head_commit.modified, 'crates/sens/src/eval/lower.rs') || contains(github.event.head_commit.modified, 'crates/sens/src/parser.rs') || contains(github.event.head_commit.modified, 'crates/sens/src/source_projection.rs') || contains(github.event.head_commit.modified, 'crates/sens/src/semantic_registry.rs') || contains(github.event.head_commit.modified, 'crates/sens-cli/src/bin/sens-trit.rs') || contains(github.event.head_commit.modified, 'crates/sens-cli/src/zig_transport.rs') || contains(github.event.head_commit.modified, 'crates/sens-cli/tests/binary_t5m_zig_roundtrip.rs') || contains(github.event.head_commit.modified, 'crates/sens-cli/tests/physical_t5m_execution.rs') || contains(github.event.head_commit.modified, 'crates/sens-host/src/lib.rs')))) }}
    uses: ./.github/workflows/release-preflight.yml
    with:
      full: true
      ref: ${{ (github.event_name == 'workflow_dispatch' && inputs.candidate_sha) || (github.event_name == 'pull_request' && github.event.pull_request.head.sha) || needs.remint.outputs.published_sha || github.sha }}
    permissions:
      contents: read
