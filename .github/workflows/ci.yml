name: SENS — один точковий автоматичний двійковий закон

# Рівно один автоматичний job; лише SENS визначає семантичний результат.
# Один центральний workflow: positive law + fail-closed guards.
# Branch pushes always receive one SENS witness; new branch/merge is allowed.
# No paths filter: docs, implementation, migration, and workflow changes all trigger.
on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sens-one-focussed-${{ github.ref }}
  cancel-in-progress: false

jobs:
  binary-sens-law:
    name: Часові D1 предикати — один фізичний SENS-свідок і чинні негативні контроли
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Синтаксис усіх YAML-файлів репозиторію
        id: yaml-syntax
        shell: ruby {0}
        run: |
          require "yaml"

          paths = Dir.glob("**/*.{yml,yaml}", File::FNM_DOTMATCH)
                     .select { |path| File.file?(path) && !path.split("/").include?(".git") }
                     .sort
          failures = []

          paths.each do |path|
            begin
              YAML.parse_stream(File.read(path))
            rescue Psych::Exception => error
              detail = error.message.lines.first.to_s.strip
              failures << [path, detail]
            end
          end

          puts "YAML_SYNTAX_AUDIT checked=#{paths.length} failed=#{failures.length}"
          failures.each do |path, detail|
            puts "YAML_SYNTAX_FAILURE path=#{path} detail=#{detail}"
            warn "::error file=#{path}::#{detail.gsub("%", "%25").gsub("\r", "%0D").gsub("\n", "%0A")}"
          end
          exit(failures.empty? ? 0 : 1)
      - name: Не допустити жодного іншого автоматичного workflow
        id: budget
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci_one_focused_workflow.py
          python3 scripts/check-domain-ladder-identity.py --self-test --check
          # Instrumental migration proof, not an alternate semantic oracle.
          python3 -m unittest discover -s tests -p test_migrate_exact_domain.py -v
      - uses: dtolnay/rust-toolchain@1.99.0
      - name: Одноразовий ПОВНИЙ cargo test — весь workspace і всі targets
        id: full-workspace-cargo
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[full-cargo-once]') }}
        timeout-minutes: 75
        shell: bash
        env:
          CARGO_BUILD_JOBS: '2'
          RUST_TEST_THREADS: '2'
        run: |
          set -euo pipefail
          echo "FULL_CARGO_ONCE commit=$GITHUB_SHA command=cargo test --workspace --all-targets --locked"
          echo "run_id=$GITHUB_RUN_ID run_attempt=$GITHUB_RUN_ATTEMPT"
          # Exactly one unfiltered Cargo test invocation.
          cargo test --workspace --all-targets --locked
      - name: D1 source census — direct predicate bits, no wrapper constructors
        id: source-census
        shell: bash
        run: |
          set -euo pipefail
          code="$(sed '/^[[:space:]]*;/d' lib/time.lisp)"
          true_count="$(printf '%s\n' "$code" | grep -oF '#d1:1' | wc -l | tr -d ' ')"
          false_count="$(printf '%s\n' "$code" | grep -oF '#d1:0' | wc -l | tr -d ' ')"
          legacy_true=0
          legacy_false=0
          if printf '%s\n' "$code" | grep -Fq '(010 (001 ()))'; then legacy_true=1; fi
          if printf '%s\n' "$code" | grep -Fq '(101 (001 (0)) (001 (1)))'; then legacy_false=1; fi
          sha256sum lib/time.lisp
          printf 'TIME_D1_SOURCE_BITS true=%s false=%s legacy_true=%s legacy_false=%s\n' "$true_count" "$false_count" "$legacy_true" "$legacy_false"
          test "$true_count" -eq 20
          test "$false_count" -eq 4
          test "$legacy_true" -eq 0
          test "$legacy_false" -eq 0
      - name: Зібрати тільки механізм виконання SENS
        id: build
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/sens-focal-red.jsonl"
          : > "$report"
          python3 scripts/ci_failure_contract.py run \
            --test-id one-sens-transport-build \
            --layer transport \
            --fixture tests/semantic/time-d1-predicate-law.sens \
            --report-file "$report" \
            -- cargo build --locked -p sens-cli --bin sens
      - name: D1–D10 — вичерпна перевірка бітового пакування (без нової семантики)
        id: packed
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/sens-focal-red.jsonl"
          python3 scripts/ci_failure_contract.py run \
            --test-id packed-bits-d1-d10 \
            --layer transport \
            --fixture tests/semantic/time-d1-predicate-law.sens \
            --report-file "$report" \
            -- cargo test --locked -p sens --lib packed_bits::tests:: -- --nocapture
          # Mechanical compiler schema gate: SENS owns language meaning;
          # Rust merely rejects ambiguous duplicate transport fields.
          python3 scripts/ci_failure_contract.py run \
            --test-id compiler-artifact-seven-bit-slot-guard \
            --layer transport \
            --fixture crates/sens/src/compiler_language.rs \
            --report-file "$report" \
            -- cargo test --locked -p sens --lib compiler_language::tests::whole_program_artifact_verifier_rejects_duplicate_fields_before_execution -- --exact --nocapture
      - name: Єдиний фізичний SENS-закон — D1:0 пропускає, D1:1 вибирає
        id: law
        shell: bash
        run: |
          set -euo pipefail
          program=tests/semantic/time-d1-predicate-law.sens
          report="$RUNNER_TEMP/sens-focal-red.jsonl"
          printf '1\n' > "$RUNNER_TEMP/expected-d1"
          echo "test_id=sens-time-d1-predicate-law layer=eval semantic_authority=binary-SENS"
          sha256sum "$program"
          python3 scripts/ci_failure_contract.py run \
            --test-id sens-time-d1-predicate-law \
            --layer eval \
            --fixture "$program" \
            --expected-file "$RUNNER_TEMP/expected-d1" \
            --report-file "$report" \
            -- target/debug/sens "$program"
      - name: Негативний контроль — виключно SENS non-callable, не помилка парсера
        id: mutant
        shell: bash
        run: |
          set -euo pipefail
          mutant=tests/semantic/domain-logic-2040/mutant.sens
          report="$RUNNER_TEMP/sens-focal-red.jsonl"
          echo "test_id=sens-domain-logic-2040-mutant layer=eval expected=SENS-non-callable"
          sha256sum "$mutant"
          python3 scripts/ci_failure_contract.py run \
            --test-id sens-domain-logic-2040-mutant \
            --layer eval \
            --fixture "$mutant" \
            --report-file "$report" \
            -- bash -c '
              set +e
              target/debug/sens tests/semantic/domain-logic-2040/mutant.sens > "$RUNNER_TEMP/mutant.stdout" 2> "$RUNNER_TEMP/mutant.stderr"
              code=$?
              if [ "$code" -eq 0 ]; then
                echo "Mutant unexpectedly accepted by SENS" >&2
                cat "$RUNNER_TEMP/mutant.stdout" >&2
                exit 1
              fi
              if ! grep -qi "not callable" "$RUNNER_TEMP/mutant.stderr"; then
                echo "Mutant rejected for an unrelated reason: not a proven SENS non-callable branch" >&2
                cat "$RUNNER_TEMP/mutant.stderr" >&2
                exit 1
              fi
              echo "SENS_MUTANT_REJECTED_BY_NONCALLABLE rc=$code"
              exit 0
            '
      - name: Двійковий закон арності знань — рівно D3/D4 і точний D1:YES
        id: knowledge
        shell: bash
        run: |
          set -euo pipefail
          program=tests/semantic/knowledge-exact-arity-structure.sens
          report="$RUNNER_TEMP/sens-focal-red.jsonl"
          printf '1\n' > "$RUNNER_TEMP/expected-knowledge-d1"
          echo "test_id=knowledge-exact-arity-structure layer=eval semantic_authority=binary-SENS"
          sha256sum "$program"
          python3 scripts/ci_failure_contract.py run \
            --test-id knowledge-exact-arity-structure \
            --layer eval \
            --fixture "$program" \
            --expected-file "$RUNNER_TEMP/expected-knowledge-d1" \
            --report-file "$report" \
            -- target/debug/sens "$program"
      - name: Точний QUOTE/D7 та негативний SLP1 — міграційні межі
        id: quoted-d7
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/sens-focal-red.jsonl"
          for fixture in test_sens_quoted_datum_law.py test_slp1_d7_v2_quote_boundary.py; do
            echo "test_id=$fixture layer=encode semantic_authority=binary-SENS"
            python3 scripts/ci_failure_contract.py run \
              --test-id "$fixture" \
              --layer encode \
              --fixture "tests/$fixture" \
              --report-file "$report" \
              -- python3 -m unittest discover -s tests -p "$fixture" -v
          done
      - name: Мігратор — немає позитивного дозволу без точної identity, навіть з Python -O
        id: migrator-optimized
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/sens-focal-red.jsonl"
          python3 scripts/ci_failure_contract.py run \
            --test-id migrate-resolver-failclosed-optimized \
            --layer encode \
            --fixture scripts/migrate-to-sens-codes.py \
            --report-file "$report" \
            -- python3 -O tests/test_migrate_resolver_failclosed.py
      - name: Червоний має говорити — валідність діагностики
        if: always()
        shell: bash
        env:
          BUDGET_OUTCOME: ${{ steps.budget.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          PACKED_OUTCOME: ${{ steps.packed.outcome }}
          SOURCE_OUTCOME: ${{ steps.source-census.outcome }}
          LAW_OUTCOME: ${{ steps.law.outcome }}
          MUTANT_OUTCOME: ${{ steps.mutant.outcome }}
          KNOWLEDGE_OUTCOME: ${{ steps.knowledge.outcome }}
          QUOTED_OUTCOME: ${{ steps.quoted-d7.outcome }}
          MIGRATOR_OUTCOME: ${{ steps.migrator-optimized.outcome }}
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/sens-focal-red.jsonl"
          if [[ "$BUDGET_OUTCOME" == success && "$BUILD_OUTCOME" == success && "$PACKED_OUTCOME" == success && "$SOURCE_OUTCOME" == success && "$LAW_OUTCOME" == success && "$MUTANT_OUTCOME" == success && "$KNOWLEDGE_OUTCOME" == success && "$QUOTED_OUTCOME" == success && "$MIGRATOR_OUTCOME" == success ]]; then
            python3 scripts/ci_failure_contract.py scan --report-file "$report" --allow-empty
          else
            # Невдалий/пропущений етап без звіту ніколи не перетворюємо в PASS.
            python3 scripts/ci_failure_contract.py scan --report-file "$report"
          fi
