lib/list-run-length-unary-general[.]lisp|lib/list-split-first-occurrence-general[.]lisp|lib/list-first-divergence-suffix-general[.]lisp|lib/list-zip-with-tails-general[.]lisp|lib/list-interpose-general[.]lisp|lib/list-unzip-pairs-general[.]lisp|lib/list-common-prefix-general[.]lisp|crates/sens/tests/d11_clojure_juxt[.]rs|crates/sens/tests/d11_legacy43_lower_laws[.]rs|lib/d11-form-presence[.]lisp|crates/sens/tests/d11_legacy_form_presence[.]rs|[.]github/workflows/ci[.]yml)$' "$changed_all"; then
            echo 'd11_srfi1_tests=true' >> "$GITHUB_OUTPUT"
          fi
          # Метаобчислювач перевіряється живим SENS після зміни бібліотеки чи свідка.
          if grep -Eq '^(lib/meta-eval\.lisp|lib/meta-eval-mutual\.lisp|crates/sens/tests/meta_eval_closure_parity\.rs|lib/meta-eval-first-class[.]lisp|crates/sens/tests/meta_fc_predicate_witness[.]rs|crates/sens/tests/d11_first_class_eval_laws[.]rs|crates/sens/tests/d11_meta_(compare|arity|cond_migration|last_define|group_error|sixth)\.rs|crates/sens/tests/core_postcore_ukr\.rs|scripts/prove-meta-eval-predicates-d1\.sh|tests/semantic/meta-eval-predicates-d1-(law|mutant)\.lisp|scripts/prove-meta-eval-graph-d1\.sh|tests/semantic/meta-eval-graph-d1-(law|mutant)\.lisp|scripts/prove-meta-eval-lexical-shadow-d1\.sh|tests/semantic/meta-eval-lexical-shadow-d1-(law|mutant|mutants)\.lisp|tests/semantic/meta-fc-predicates-d1-(law|mutant)[.]lisp|[.]github/workflows/ci[.]yml)$' "$changed_all"; then
            echo 'meta_eval_d1_tests=true' >> "$GITHUB_OUTPUT"
          fi
          if grep -Eq '^(benchmarks/parser\.lisp|benchmarks/cross-language/sens-vs-python/sens/(ackermann|fib)\.(setup|call)\.lisp|crates/sens/src/source_projection\.rs|crates/sens/tests/ukr_unpaired_benchmark_runtime\.rs|\.github/workflows/ci\.yml)$' "$changed_all"; then
            echo 'parser_benchmark_tests=true' >> "$GITHUB_OUTPUT"
          fi
          # Зміна чинної Lisp-семантики має запускати SENS, не лише source audit.
          if grep -Eq '^(lib/translation\.lisp|lib/world\.lisp|lib/knowledge\.lisp|lib/core\.lisp|crates/sens/tests/translation_boundary\.rs|tests/test_code_runs\.py|lib/domains/d9[.]lisp|crates/sens/src/d9_definition_bindings_generated[.]rs|crates/sens/tests/d9_binary_surface_native[.]rs|tests/semantic/d9-four-uk-projections-laws[.]lisp|\.github/workflows/ci\.yml)$' "$changed_all"; then
            echo 'translation_tests=true' >> "$GITHUB_OUTPUT"
          fi
          if grep -Eq '^(crates/sens-cli/src/(main|repl)\.rs|crates/sens-cli/src/bin/sens-trit\.rs|crates/sens-cli/tests/(cli|physical_core4_sequence_cli|physical_bare_session_cli)\.rs|scripts/execute_changed_lisp_t5m\.sh|scripts/refresh-verified-t5m-pair\.sh|scripts/refresh-executed-t5m-pair\.sh|benchmarks/contest-uk/(run-native\.sh|judge\.sh|[^/]+\.(lisp|sens))|\.github/workflows/ci\.yml)$' "$changed_all"; then
            echo 't5m_cli_tests=true' >> "$GITHUB_OUTPUT"
          fi
          # D11: тільки зміни селекторів, SENS-реалізації або їхніх тестів.
          if grep -Eq '^(tests/fixtures/d11-selector-law-witness[.]lisp|crates/sens-cli/tests/physical_core4_sequence_cli[.]rs|crates/sens/tests/d11_selector_512_live[.]rs|crates/sens/tests/persistent_vector[.]rs|lib/persistent-vector[.]lisp|knowledge/d11-selector-seed[.]json|[.]github/workflows/ci[.]yml)$' "$changed_all"; then
            echo 'd11_runtime_tests=true' >> "$GITHUB_OUTPUT"
            echo 'needs_zig=true' >> "$GITHUB_OUTPUT"
          fi
          # SENS: адресний контроль одноразового та повного розіменування.
          if grep -Eq '^(crates/sens/tests/d11_unify_once[.]rs|lib/unify[.]lisp|[.]github/workflows/ci[.]yml)$' "$changed_all"; then
            echo 'd11_unify_once_tests=true' >> "$GITHUB_OUTPUT"
          fi
          # D11: три закони внутрішнього світу — справжнє виконання SENS.
          if grep -Eq '^(crates/sens/tests/world_ancestor_sens[.]rs|lib/world[.]lisp|[.]github/workflows/ci[.]yml)$' "$changed_all"; then
            echo 'd11_world_law_tests=true' >> "$GITHUB_OUTPUT"
          fi
          # Три бібліотечні закони D2, виконання у SENS.
          if grep -Eq '^(crates/sens/tests/codec_in_sens[.]rs|lib/codec-d2[.]lisp|[.]github/workflows/ci[.]yml)$' "$changed_all"; then
            echo 'd11_codec_law_tests=true' >> "$GITHUB_OUTPUT"
          fi
          # Три функції D11 SI виконуються бібліотечними законами, не host-oracle.
          if grep -Eq '^(crates/sens/tests/scientific_constants[.]rs|lib/si[.]lisp|[.]github/workflows/ci[.]yml)$' "$changed_all"; then
            echo 'd11_si_law_tests=true' >> "$GITHUB_OUTPUT"
          fi
          # Лише змінені T5M інструменти одержують адресний Zig-свідок.
          if grep -Eq '^(scripts/migrate-three-pass\.py|scripts/migration_publish_pair\.py|tests/test_migrate_one_to_sens\.py|\.github/workflows/ci\.yml)$' "$changed_all"; then
            echo 'migration_refresh_tests=true' >> "$GITHUB_OUTPUT"
            echo 'needs_zig=true' >> "$GITHUB_OUTPUT"
          fi
          # Адресний SENS/Zig runtime для непарного Lisp-бенчмарка.
          if grep -Eq '^(benchmarks/closures\.lisp|crates/sens-cli/src/repl\.rs|crates/sens-cli/tests/closures_benchmark_cli\.rs|\.github/workflows/ci\.yml)$' "$changed_all"; then
            echo 'closure_runtime_tests=true' >> "$GITHUB_OUTPUT"
          fi
          # Пролог → Даталог: реальний SENS D1/D4 після зміни Lisp чи тесту.
          if grep -Eq '^(lib/bridge/prolog-to-datalog\.lisp|crates/sens/tests/prolog_bridge_current_d4\.rs|\.github/workflows/ci\.yml)$' "$changed_all"; then
            echo 'prolog_bridge_tests=true' >> "$GITHUB_OUTPUT"
            echo 'needs_zig=true' >> "$GITHUB_OUTPUT"
          fi
          # Адресний Narrate/Understand — тільки справжнє SENS-виконання.
          if grep -Eq '^(lib/(narrate|understand|result-status)\.lisp|crates/sens/tests/(narrate_outcomes|understand_exact_empty|result_status)\.rs)$' "$changed_all"; then
            echo 'narrate_runtime_tests=true' >> "$GITHUB_OUTPUT"
          fi

          # CLIPS — лише змінений виконуваний імпортер або його справжній SENS-тест.
          if grep -Eq '^(lib/clips-import\.lisp|crates/sens/tests/clips_import\.rs|\.github/workflows/ci\.yml)$' "$changed_all"; then
            echo 'clips_runtime_tests=true' >> "$GITHUB_OUTPUT"
          fi

          # Справжнє SENS-виконання змінюваного Core4/JSON, не Python-макет.
          if grep -Eq '^(lib/core4\.lisp|lib/yantra\.lisp|crates/sens/tests/core4_migration_point\.rs|crates/sens/tests/yantra\.rs|\.github/workflows/ci\.yml)$' "$changed_all"; then
            echo 'yantra_runtime_tests=true' >> "$GITHUB_OUTPUT"
          fi

          # Машинний admission має запускати pinned Zig та SENS.
          if grep -Eq '^(lib/machine/admission/x86-64\.lisp|crates/sens/tests/machine_admission_false_width\.rs|crates/sens/tests/machine_admission_adversarial\.rs)$' "$changed_all"; then
            echo 'needs_zig=true' >> "$GITHUB_OUTPUT"
          fi
          # Чинна українська UTF-8 програма запускає справжній SENS D1, не Python/JSON oracle.
          if grep -Eq '^(lib/utf8\.lisp|crates/sens/tests/utf8\.rs|\.github/workflows/ci\.yml)$' "$changed_all"; then
            echo 'utf8_runtime_tests=true' >> "$GITHUB_OUTPUT"
            echo 'needs_zig=true' >> "$GITHUB_OUTPUT"
          fi
          # Кожен адресний Rust-свідок нижче проходить build.rs, який
          # перевіряє pinned Zig навіть тоді, коли сам тест не змінювався.
          if grep -Eq '^(lib/core\.lisp|lib/core1\.lisp|lib/knowledge\.lisp|lib/forward\.lisp|lib/unify\.lisp|lib/machine/operands/x86-64\.lisp|lib/machine/capability-axis\.lisp|lib/machine/lowering/semantic-x86-64\.lisp|crates/sens/tests/machine_exact_domain_cpu\.rs|crates/sens/tests/machine_capability_axis\.rs|tests/test_capability_axis_ukr_projection\.py|crates/sens-cli/tests/core1_array_bounds_cli\.rs|crates/sens/tests/knowledge_journal_d3_ukr\.rs|crates/sens/tests/reasoning_forward_knowledge_d3_migration\.rs|crates/sens/tests/machine_typed_operands\.rs|crates/sens/tests/machine_exact_d5_order\.rs|lib/machine/encoding/coverage-generator\.lisp|lib/quantity\.lisp|crates/sens/tests/quantity_length_d24_current\.rs|crates/sens/tests/quantity_d1_direct_cutover\.rs|tests/test_ukr_quantity_projection\.py|crates/sens/src/domain_numeric\.rs|crates/sens/src/binary_number\.rs|crates/sens/src/machine_math\.rs|crates/sens/src/machine_math_skylake\.S|\.github/workflows/ci\.yml)$' "$changed_all"; then
            echo 'needs_zig=true' >> "$GITHUB_OUTPUT"
          fi

          # Фізичне оновлення D2 запускає парний Zig/SENS незалежно від інших RED.
          if grep -Eq '^(lib/codec-d2(\.lisp|\.sens)?|crates/sens/tests/codec_in_sens\.rs|tests/test_code_runs\.py|\.github/workflows/ci\.yml)$' "$changed_all"; then
            echo 'codec_d2_tests=true' >> "$GITHUB_OUTPUT"
            echo 'needs_zig=true' >> "$GITHUB_OUTPUT"
          fi

          # System One: адресний SENS-тест при зміні контракту чи регресійного свідка.
          if grep -Eq '^(research/probabilistic-decision-system-one-20261022[.]lisp|research/probabilistic-decision-auto-choice-20261021[.]lisp|experiments/probabilistic-decision-jev-like[.]lisp|crates/sens/tests/probabilistic_decision_jev_like[.]rs|[.]github/workflows/ci[.]yml)$' "$changed_all"; then
            echo 'system_one_tests=true' >> "$GITHUB_OUTPUT"
            echo 'needs_zig=true' >> "$GITHUB_OUTPUT"
          fi

          # Учитель/учень/калібрування/метрики/challenge: тільки за зміни їхніх файлів.
          if grep -Eq '^(research/system-one-(teacher-observe|compact-student|evaluate|calibrate|compare|transformer-student|support-seed|support-challenge|teacher-student-plan)-20261022([.]py|[.]jsonl|[.]md)|tests/test_system_one_research_pipeline[.]py|[.]github/workflows/ci[.]yml)$' "$changed_all"; then
            echo 'system_one_research_tests=true' >> "$GITHUB_OUTPUT"
          fi

          # Обов'язковий повнофайловий AST/T5M smoke використовує live Zig codec.
          echo 'needs_zig=true' >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/install-zig
        if: ${{ steps.changed-t5m-lisp.outputs.has_files == 'true' || steps.changed-t5m-lisp.outputs.translation_tests == 'true' || steps.changed-t5m-lisp.outputs.t5m_cli_tests == 'true' || steps.changed-t5m-lisp.outputs.needs_zig == 'true' || steps.changed-t5m-lisp.outputs.yantra_runtime_tests == 'true' || steps.changed-t5m-lisp.outputs.closure_runtime_tests == 'true' || steps.changed-t5m-lisp.outputs.clips_runtime_tests == 'true' || steps.changed-t5m-lisp.outputs.narrate_runtime_tests == 'true' || steps.changed-t5m-lisp.outputs.core1_tests == 'true' || steps.changed-t5m-lisp.outputs.knowledge_tests == 'true' || steps.changed-t5m-lisp.outputs.reason_tests == 'true' || steps.changed-t5m-lisp.outputs.meta_eval_d1_tests == 'true' || steps.changed-t5m-lisp.outputs.parser_benchmark_tests == 'true' || (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Reason:')) || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (startsWith(github.event.head_commit.message, 'BENCH-T5M:') || startsWith(github.event.head_commit.message, 'Знання:') || startsWith(github.event.head_commit.message, 'SI:') || startsWith(github.event.head_commit.message, 'MIGRATE-LIB-TRIPLETS:') || startsWith(github.event.head_commit.message, 'LISP-TIER:'))) }}

      - name: "System One research — один адресний тест учителя, учня та метрик"
        if: ${{ always() && steps.changed-t5m-lisp.outputs.system_one_research_tests == 'true' }}
        shell: bash
        run: python3 -m unittest tests/test_system_one_research_pipeline.py -v

      - name: Д1/Core1 — справжнє виконання масивів при зміні залежностей
        if: ${{ always() && steps.changed-t5m-lisp.outputs.core1_tests == 'true' && !startsWith(github.event.head_commit.message, 'LISP-TIER:') }}
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p sens-cli --test core1_array_bounds_cli -- --nocapture
          # Змінений lib/core.lisp: точна D1 семантика порожніх макросів,
          # через справжній виконавець SENS (не Python/source-matcher).
          cargo test --locked -p sens --test core_postcore_ukr core_zero_arity_and_or_return_real_d1_bits -- --exact --nocapture
          # Лише аудит сучасного українського джерела й точних слів; це НЕ SENS-eval.
          # Фактичне SENS-виконання лишається в Rust CLI-свідках вище.
          python3 -m unittest tests.test_core1_third_domain_canary tests.test_core1_fourth_domain_canary -v

      - name: "Український Lisp-парсер — D5 результат і негативний SENS-свідок"
        if: ${{ !cancelled() && steps.changed-t5m-lisp.outputs.parser_benchmark_tests == 'true' }}
        timeout-minutes: 5
        shell: bash
        run: cargo test --locked -p sens --lib український_парсер_виконує_точний_дріб_та_відхиляє_ділення_на_нуль -- --nocapture

      - name: "Prolog/Datalog — реальний SENS D1/D4 свідок"
        if: ${{ !cancelled() && steps.changed-t5m-lisp.outputs.prolog_bridge_tests == 'true' }}
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p sens --test prolog_bridge_current_d4 -- --list | grep -Fqx 'd4_bridge_d1_field_shape_rejects_truncated_extra_and_dotted_rows: test'
          CARGO_BUILD_JOBS=2 CARGO_INCREMENTAL=0 timeout 180s cargo test --locked -p sens --test prolog_bridge_current_d4 -- --nocapture

      - name: "SENS REPL — реальне виконання обернених українських D4-викликів"
        if: ${{ always() && steps.changed-t5m-lisp.outputs.repl_runtime_tests == 'true' }}
        timeout-minutes: 6
        shell: bash
        run: |
          set -euo pipefail
          CARGO_BUILD_JOBS=2 CARGO_INCREMENTAL=0 timeout 180s cargo test --locked -p sens --test repl_core_malformed_tails -- --nocapture

      - name: "SENS Narrate/Understand — виконання чинних Lisp-предикатів D1/D3"
        if: ${{ !cancelled() && steps.changed-t5m-lisp.outputs.narrate_runtime_tests == 'true' }}
        timeout-minutes: 7
        shell: bash
        run: |
          set -euo pipefail
          CARGO_BUILD_JOBS=2 CARGO_INCREMENTAL=0 timeout 180s cargo test --locked -p sens --test narrate_outcomes --test understand_exact_empty -- --nocapture
          # Справжній D1 для символу/NIL/пари/D24 замість каталожного D9.
          CARGO_BUILD_JOBS=2 CARGO_INCREMENTAL=0 timeout 180s cargo test --locked -p sens --test result_status український_символ_результату_виконується_через_d1_а_не_недопущений_d9 -- --exact --nocapture

      - name: "Process — чинне SENS D4 виконання та двопольовий D1"
        if: ${{ !cancelled() && steps.changed-t5m-lisp.outputs.process_runtime_tests == 'true' }}
        timeout-minutes: 7
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest tests.test_process_d1_direct tests.test_process_d1_predicate_cutover -v
          CARGO_BUILD_JOBS=2 CARGO_INCREMENTAL=0 timeout 180s cargo test --locked -p sens --test process_d1_direct --test process_d1_reflection -- --nocapture

      - name: "LIFE-1 — живі позитивні й негативні SENS D1 свідки"
        if: ${{ !cancelled() && steps.changed-t5m-lisp.outputs.life_runtime_tests == 'true' }}
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          CARGO_BUILD_JOBS=2 CARGO_INCREMENTAL=0 timeout 180s cargo test --locked -p sens --test life_1_scheduler -- --nocapture

      - name: "Канон — живі позитивні та негативні D1 закони SENS"
        if: ${{ !cancelled() && steps.changed-t5m-lisp.outputs.canon_runtime_tests == 'true' }}
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          CARGO_BUILD_JOBS=2 CARGO_INCREMENTAL=0 timeout 180s cargo test --locked -p sens --test canon_d1_migration_cohort -- --nocapture

      - name: "D3 COND — фізичний T5M свідок позитивів та негативів"
        if: ${{ !cancelled() && steps.changed-t5m-lisp.outputs.physical_d3_runtime_tests == 'true' }}
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          CARGO_BUILD_JOBS=2 CARGO_INCREMENTAL=0 timeout 180s cargo test --locked -p sens --test physical_t5m_execution -- --nocapture
      - name: "SENS FUNCTIONS — справжні D1 позитивний і негативні входи"
        if: ${{ !cancelled() && steps.changed-t5m-lisp.outputs.functions_md_d1_tests == 'true' }}
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
