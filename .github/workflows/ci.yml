      - name: "Д11 / Scheme + Clojure — нативні закони списків і стану"
        if: ${{ !cancelled() && steps.changed-t5m-lisp.outputs.d11_srfi1_tests == 'true' }}
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          CARGO_BUILD_JOBS=2 CARGO_INCREMENTAL=0 cargo test --locked -p sens --test d11_srfi1_span_break --test d11_srfi1_unfold --test d11_clojure_partition_by --test d11_historical_scan_fold --test d11_clojure_group_by --test d11_agent_adjacent_runs --test d11_srfi1_filter_map --test d11_clojure_juxt --test d11_existing_list_prefix_suffix_cuts --test d11_existing_list_reversible --test d11_existing_list_structural --test d11_existing_list_algebra --test d11_existing_tree_laws --test d11_existing_combinatorics --test d11_existing_atom_combinatorics --test d11_existing_patterns_and_suffixes --test d11_existing_sequence_laws --test d11_existing_deep_list_laws --test d11_existing_inverse_splits_and_suffixes --test d11_interlisp_safe_analysis --test d11_legacy43_lower_laws --test d11_legacy_form_presence -- --nocapture

          # Чотири нові українські Lisp-композиції: відтворити exact фізичні
          # T5M байти тільки поточним SENS reader + Zig writer; жодного
          # Python/JSON, жодного висновку про повний release з цього кроку.
          CARGO_BUILD_JOBS=2 CARGO_INCREMENTAL=0 cargo build --locked -p sens-cli --bin sens --bin sens-trit
          temp_d11="$(mktemp -d)"
          trap 'rm -rf -- "$temp_d11"' EXIT
          for source in \
            lib/d11-srfi1-span-break.lisp \
            lib/d11-clojure-partition-by.lisp \
            lib/d11-srfi1-unfold.lisp \
            lib/d11-clojure-group-by.lisp; do
            physical="${source%.lisp}.sens"
            bitview="${source%.lisp}"
            test -s "$physical" || { echo "D11_T5M_MISSING layer=physical input=$source expected=nonempty actual=missing" >&2; exit 1; }
            test -s "$bitview" || { echo "D11_VIEW_MISSING layer=view input=$source expected=nonempty actual=missing" >&2; exit 1; }
            target/debug/sens --t5m-mint "$source" "$temp_d11/program.sens" || {
              echo "D11_T5M_MINT_RED layer=lowering input=$source expected=SENS_ZIG_MINT actual=failure" >&2
              exit 1
            }
            if ! cmp -s "$temp_d11/program.sens" "$physical"; then
              echo "D11_T5M_BYTES_DRIFT layer=physical input=$source expected=$physical actual=$temp_d11/program.sens" >&2
              sha256sum "$physical" "$temp_d11/program.sens" >&2
              exit 1
            fi
            if ! target/debug/sens-trit view "$physical" | cmp -s - "$bitview"; then
              echo "D11_T5M_VIEW_DRIFT layer=projection input=$source expected=$bitview actual=ZigT5M_view" >&2
              exit 1
            fi
            target/debug/sens-trit verify-view "$physical" > /dev/null || {
              echo "D11_T5M_VIEW_ROUNDTRIP_RED layer=inverse input=$source expected=byte_exact actual=failure" >&2
              exit 1
            }
            echo "D11_T5M_EXACT_PASS source=$source"
          done

      - name: "Reason: SENS перевіряє індекс і лексичне застосування функцій"
