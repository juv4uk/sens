          projection="tests/semantic/native-t5/core-d4-vs-d8-width-law.bits"
          # Python transports bits only. Native SENS decides EQ, COND and D1.
          PYTHONPATH=scripts python3 - "$projection" "$program" <<'PY'
          from pathlib import Path
          import sys
          from sens_t5_codec import decode_bytes, parse_words
          if decode_bytes(Path(sys.argv[2]).read_bytes()) != parse_words(Path(sys.argv[1]).read_text(encoding="utf-8")):
              raise SystemExit("CORE_D4_D8_T5_TRANSPORT_MISMATCH")
          PY
          printf '1\n' > "$RUNNER_TEMP/core-d4-vs-d8.expected"
