name: "SENS — швидкий CI та ручні цільові перевірки"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      suite:
        description: "Який набір виконати вручну"
        required: true
        type: choice
        default: quick
        options:
          - quick
          - native
          - laws
          - remint
          - release-preflight
      files:
        description: "Точні .lisp шляхи для suite=remint, по одному на рядок"
        required: false
        type: string
        default: ""

# Навмисно немає concurrency/cancel-in-progress: кожен push зберігає свій CI.
permissions:
  contents: read

jobs:
  sens:
    name: Охоронець · Rust · Zig · SENS
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.suite == 'quick' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Перевірити формат diff і синтаксис оболонки
        shell: bash
        run: |
          set -euo pipefail
          git diff --check HEAD^ HEAD
          bash -n scripts/check-sens-only-semantic-tests.sh
          bash -n scripts/check-language-policy-archive.sh
          bash -n scripts/test-language-policy-archive-gate.sh
          bash -n scripts/ci-rust-mechanism-checks.sh
          bash -n scripts/execute_changed_lisp_t5m.sh
          bash -n scripts/prove-lisp-semantic-t5m.sh
          bash -n scripts/check-sens-rust-zig-only-tests.sh
          bash scripts/check-sens-rust-zig-only-tests.sh
      - name: Перевірити межу власності мовних тестів
        shell: bash
        env:
          SENS_EVENT_NAME: ${{ github.event_name }}
          SENS_PR_BODY: ${{ github.event.pull_request.body }}
          SENS_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          SENS_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/check-sens-only-semantic-tests.sh
      - name: Перевірити реєстр ARCHIVE та сторонні runners
        shell: bash
        run: bash scripts/check-language-policy-archive.sh
      - name: Публічний підсумок коридору / архіву
        shell: bash
        run: |
          set -euo pipefail
          count="$(grep -cE '\|[[:space:]]*ARCHIVE[[:space:]]*\|?$' docs/language-policy-archive.md || true)"
          echo "ARCHIVE (поза мовним коридором): ${count} артефактів — docs/language-policy-archive.md"
          echo "ARCHIVE (поза мовним коридором): ${count} артефактів — docs/language-policy-archive.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Самоперевірка мовного гейту (позитивний та негативний свідки)
        shell: bash
        run: bash scripts/test-language-policy-archive-gate.sh
      - name: Статус
        run: echo "QUICK_CI_STATUS=ok heavy_native_laws_remint_release=MANUAL_TARGETED"

  native:
    name: Ручний native Rust/Zig smoke
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.suite == 'native' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: ./.github/actions/install-zig
      - name: Build native SENS
        run: cargo build --locked -p sens-cli --bin sens --bin sens-trit --features benchmark-ast-visits
      - name: Rust mechanism checks
        run: bash scripts/ci-rust-mechanism-checks.sh
      - name: Zig codec and transport smoke
        shell: bash
        run: |
          set -euo pipefail
          scripts/ci-zig-purity --self-test
          zig test -lc research/zig-codecs/tests.zig
          zig test -lc zig_transport_root.zig

  laws:
    name: SENS/Zig/T5M закони — ручний набір або цільовий коміт
    # Точний маркер запускає доказ на тому самому SHA; решта push лишається легким.
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.suite == 'laws') || (github.event_name == 'push' && contains(github.event.head_commit.message, 'SENS_NATIVE_LAWS')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: ./.github/actions/install-zig
      - name: Build native SENS
        run: cargo build --locked -p sens-cli --bin sens --bin sens-trit --features benchmark-ast-visits
      - name: F6 physical WRITE→READ producer/consumer
        run: cargo test --locked -p sens-cli --test wsm_fs_f6_pipeline -- --nocapture
      - name: Точковий SENS REPL — некоректний стан повертає мовну відмову
        run: cargo test --locked -p sens --test repl_core_malformed_tails repl_step_rejects_atomic_state_as_sens_data -- --nocapture
      - name: MetaEval — SENS law, mutant і точна фізична T5M-пара
        shell: bash
        run: bash scripts/prove-meta-eval-graph-d1.sh "$PWD/target/debug/sens"
      - name: Execute SENS-native laws, mutants and benchmarks
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/prove-meta-eval-lexical-shadow-d1.sh "$PWD/target/debug/sens"
          bash scripts/prove-meta-eval-predicates-d1.sh "$PWD/target/debug/sens"
          bash scripts/prove-d4-selector-width.sh "$PWD/target/debug/sens"
          bash scripts/prove-твердження-m1.sh "$PWD/target/debug/sens"
          bash scripts/prove-бенчмарк-медіана.sh "$PWD/target/debug/sens"
          bash scripts/prove-бенчмарк-структура.sh "$PWD/target/debug/sens"
          bash scripts/prove-бенчмарк-умова.sh "$PWD/target/debug/sens"
          bash scripts/prove-ідентичність-тритів.sh "$PWD/target/debug/sens"
          bash scripts/prove-d3-атом-межа.sh "$PWD/target/debug/sens"
          bash scripts/prove-d3-як-є-щит.sh "$PWD/target/debug/sens"
          bash scripts/prove-lisp-language-laws.sh "$PWD/target/debug/sens"

  remint-input-required:
    name: Remint потребує явний список файлів
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.suite == 'remint' && inputs.files == '' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Не запускати широкий remint без області
        run: |
          echo "::error title=REMINT_SCOPE_REQUIRED::Вкажіть точні .lisp файли в полі files; автоматичний широкий remint вимкнений у короткому CI."
          exit 1

  remint:
    name: Канонічний SENS/Zig/T5M remint точних файлів
        # Push history is diffed by the reusable workflow, so mint only active Lisp sources changed in this push (including multi-commit pushes), not the source backlog.
    # SENS_REMINT_META_EVAL_GRAPH_D1 is a closed two-source remint scope; never scan backlog.
    # A specific source-push marker repairs only the two MetaEval graph pairs.
    # Manual remint remains scoped to the exact explicit files supplied.
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.suite == 'remint' && inputs.files != '') || (github.event_name == 'push' && (contains(github.event.head_commit.message, 'SENS_REMINT_META_EVAL_GRAPH_D1') || contains(github.event.head_commit.message, 'SENS_REMINT_COMPILER_NUCLEUS') || contains(github.event.head_commit.message, 'SENS_REMINT_CORE4_D5') || contains(github.event.head_commit.message, 'SENS_REMINT_F6_KEY_CANON') || contains(github.event.head_commit.message, 'SENS_REMINT_RELEASE_REASONING_F6') || contains(github.event.head_commit.message, 'SENS_REMINT_CORE4_P_R_SELECTOR') || contains(github.event.head_commit.message, 'SENS_REMINT_TRANSLATION_BOUNDARY') || contains(github.event.head_commit.modified, 'lib/compiler-nucleus.lisp') || contains(github.event.head_commit.modified, 'tests/semantic/meta-eval-graph-d1-law.lisp') || contains(github.event.head_commit.modified, 'tests/semantic/meta-eval-graph-d1-mutant.lisp') || contains(join(github.event.commits.*.modified, ','), '.lisp') || contains(join(github.event.commits.*.added, ','), '.lisp') || contains(toJSON(github.event.commits.*.modified), '.lisp') || contains(toJSON(github.event.commits.*.added), '.lisp'))) }}
    uses: ./.github/workflows/remint-drifted-pairs.yml
    with:
      files: |
        ${{ inputs.files }}
        ${{ github.event_name == 'push' && (contains(github.event.head_commit.message, 'SENS_REMINT_META_EVAL_GRAPH_D1') || contains(github.event.head_commit.modified, 'tests/semantic/meta-eval-graph-d1-law.lisp')) && 'tests/semantic/meta-eval-graph-d1-law.lisp' || '' }}
        ${{ github.event_name == 'push' && (contains(github.event.head_commit.message, 'SENS_REMINT_META_EVAL_GRAPH_D1') || contains(github.event.head_commit.modified, 'tests/semantic/meta-eval-graph-d1-mutant.lisp')) && 'tests/semantic/meta-eval-graph-d1-mutant.lisp' || '' }}
        ${{ github.event_name == 'push' && (contains(github.event.head_commit.message, 'SENS_REMINT_COMPILER_NUCLEUS') || contains(github.event.head_commit.modified, 'lib/compiler-nucleus.lisp')) && 'lib/compiler-nucleus.lisp' || '' }}
        ${{ github.event_name == 'push' && contains(github.event.head_commit.message, 'SENS_REMINT_CORE4_D5') && 'lib/core4.lisp' || '' }}
        ${{ github.event_name == 'push' && contains(github.event.head_commit.message, 'SENS_REMINT_CORE4_P_R_SELECTOR') && 'lib/core4.lisp' || '' }}
        ${{ github.event_name == 'push' && contains(github.event.head_commit.message, 'SENS_REMINT_F6_KEY_CANON') && 'lib/lisp-fs.lisp' || '' }}
        ${{ github.event_name == 'push' && contains(github.event.head_commit.message, 'SENS_REMINT_RELEASE_REASONING_F6') && 'lib/core4.lisp' || '' }}
        ${{ github.event_name == 'push' && contains(github.event.head_commit.message, 'SENS_REMINT_RELEASE_REASONING_F6') && 'lib/knowledge.lisp' || '' }}
        ${{ github.event_name == 'push' && contains(github.event.head_commit.message, 'SENS_REMINT_RELEASE_REASONING_F6') && 'lib/world.lisp' || '' }}
        ${{ github.event_name == 'push' && contains(github.event.head_commit.message, 'SENS_REMINT_RELEASE_REASONING_F6') && 'lib/reason.lisp' || '' }}
        ${{ github.event_name == 'push' && contains(github.event.head_commit.message, 'SENS_REMINT_RELEASE_REASONING_F6') && 'lib/translation.lisp' || '' }}
        ${{ github.event_name == 'push' && contains(github.event.head_commit.message, 'SENS_REMINT_RELEASE_REASONING_F6') && 'lib/lisp-fs.lisp' || '' }}
        ${{ github.event_name == 'push' && contains(github.event.head_commit.message, 'SENS_REMINT_RELEASE_REASONING_F6') && 'tests/fixtures/wsm-fs-record-producer.lisp' || '' }}
        ${{ github.event_name == 'push' && contains(github.event.head_commit.message, 'SENS_REMINT_TRANSLATION_BOUNDARY') && 'lib/translation.lisp' || '' }}
    permissions:
      contents: write

  release-preflight:
    name: Exact-SHA release preflight — ручний або позначений коміт
    # Повний preflight запускається вручну або за явним маркером; звичайний push лишається швидким.
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.suite == 'release-preflight') || (github.event_name == 'push' && (contains(github.event.head_commit.message, 'SENS_RELEASE_PREFLIGHT') || startsWith(github.event.head_commit.message, 'Translation boundary:') || startsWith(github.event.head_commit.message, 'Переклад:') || startsWith(github.event.head_commit.message, 'SENS:') || startsWith(github.event.head_commit.message, 'Tests:') || startsWith(github.event.head_commit.message, 'CI:') || startsWith(github.event.head_commit.message, 'GPU smoke:') || startsWith(github.event.head_commit.message, 'Release:') || startsWith(github.event.head_commit.message, 'Реліз:') || startsWith(github.event.head_commit.message, 'Мова:') || startsWith(github.event.head_commit.message, 'release:') || contains(github.event.head_commit.modified, '.github/workflows/ci.yml') || contains(github.event.head_commit.modified, '.github/workflows/ci-heavy.yml') || contains(github.event.head_commit.modified, '.github/workflows/release.yml') || contains(github.event.head_commit.modified, '.github/workflows/release-preflight.yml') || contains(github.event.head_commit.modified, '.github/workflows/release-publish.yml') || contains(github.event.head_commit.modified, 'RELEASE-EVIDENCE.md') || contains(join(github.event.head_commit.modified, ','), 'Cargo.toml') || contains(join(github.event.head_commit.modified, ','), 'Cargo.lock') || contains(github.event.head_commit.modified, 'Cargo.toml') || contains(github.event.head_commit.modified, 'Cargo.lock') || contains(github.event.head_commit.modified, 'crates/sens/Cargo.toml') || contains(github.event.head_commit.modified, 'crates/sens-cli/Cargo.toml') || contains(github.event.head_commit.modified, 'lib/persistent-map.lisp') || contains(github.event.head_commit.modified, 'lib/translation.lisp') || contains(github.event.head_commit.modified, 'lib/knowledge.lisp') || contains(github.event.head_commit.modified, 'lib/world.lisp') || contains(github.event.head_commit.modified, 'lib/reason.lisp') || contains(github.event.head_commit.modified, 'lib/core.lisp') || contains(github.event.head_commit.modified, 'lib/core4.lisp') || contains(github.event.head_commit.modified, 'lib/compiler-nucleus.lisp') || contains(github.event.head_commit.modified, 'lib/compiler-nucleus.sens') || contains(github.event.head_commit.modified, 'crates/sens/tests/translation_boundary.rs') || contains(github.event.head_commit.modified, 'crates/sens/src/mixed_source.rs') || contains(github.event.head_commit.modified, 'crates/sens/src/compiler_language.rs') || contains(github.event.head_commit.modified, 'crates/sens/src/eval/lower.rs') || contains(github.event.head_commit.modified, 'crates/sens/src/parser.rs') || contains(github.event.head_commit.modified, 'crates/sens/src/source_projection.rs') || contains(github.event.head_commit.modified, 'crates/sens/src/semantic_registry.rs') || contains(github.event.head_commit.modified, 'crates/sens-cli/src/bin/sens-trit.rs') || contains(github.event.head_commit.modified, 'crates/sens-cli/src/zig_transport.rs') || contains(github.event.head_commit.modified, 'crates/sens-cli/tests/binary_t5m_zig_roundtrip.rs') || contains(github.event.head_commit.modified, 'crates/sens-cli/tests/physical_t5m_execution.rs') || contains(github.event.head_commit.modified, 'crates/sens-host/src/lib.rs'))) }}
    uses: ./.github/workflows/release-preflight.yml
    with:
      full: true
    permissions:
      contents: read
