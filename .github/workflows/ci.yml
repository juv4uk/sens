          cargo test --locked -p sens --test epistemic_exact_ref_equality -- --nocapture
          # Живі українські D4 замикання перед D9, потім справжній SENS D1.
          cargo test --locked -p sens --test ukr_string_surface_aliases_runtime -- --nocapture
          cargo test --locked -p sens --test ukr_unpaired_benchmark_runtime -- --nocapture
          cargo test --locked -p sens --test result_status -- --nocapture

      - name: "LISP-TIER — адресний SENS читач непарного parser.lisp"
        if: ${{ !cancelled() && steps.changed-t5m-lisp.outputs.parser_benchmark_tests == 'true' }}
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          # Окремий D7/D24+ runtime-свідок навіть після RED іншого тесту.
          # Не видавати успішний source eval за фізичну оберненість .sens.
          cargo test --locked -p sens --test ukr_unpaired_benchmark_runtime український_читач_виконує_цитовані_дані_й_точний_d24_дріб -- --exact --nocapture
          cargo test --locked -p sens --test ukr_unpaired_benchmark_runtime незалежне_виконання_аккермана_та_фібоначчі_у_sens -- --exact --nocapture

      # Лише адресний Zig/T5M-експорт після змін у виконуваних Lisp.
      - name: "LISP-TIER — діагностувати дві актуальні фізичні пари"
        if: ${{ always() && github.event_name == 'push' && startsWith(github.event.head_commit.message, 'LISP-TIER:') }}
        timeout-minutes: 7
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/sens-live-pairs"
          mkdir -p "$output"
          for name in epistemic result-status; do
            # Визначення модуля вже живуть у reason/knowledge Lisp.
            # Їхній D9 resident НЕ означає вбудований викличний механізм.
            bindings=()
            if [[ "$name" == "result-status" ]]; then
              bindings=(--binding-source lib/reason.lisp --binding-source lib/knowledge.lisp)
            fi
            dest="$output/$name"
            mkdir -p "$dest"
            set +e
            python3 scripts/migrate-three-pass.py "lib/$name.lisp" \
              --out "$dest" --report "$dest/MIGRATION-REPORT.json" \
              --codec t5m --source-surface укр "${bindings[@]}"
            code=$?
            set -e
            if [[ ! -s "$dest/MIGRATION-REPORT.json" ]]; then
              echo "::error::SENS_PAIR_NO_REPORT source=$name rc=$code"
              exit 1
            fi
            python3 - "$dest/MIGRATION-REPORT.json" "$name" <<'PY'
          import json, sys
          report = json.load(open(sys.argv[1], encoding="utf-8"))
          print("SENS_PAIR_DIAG " + sys.argv[2] +
                " summary=" + json.dumps(report["summary"], ensure_ascii=False) +
                " reasons=" + json.dumps(
                    [row.get("reason") for row in report["files"]
                     if row.get("status") == "blocked"], ensure_ascii=False))
          PY
            if ((code > 2)); then
              echo "::error::SENS_PAIR_INTERNAL_FAILURE source=$name rc=$code"
              exit "$code"
            fi
          done

      - name: "LISP-TIER — зберегти T5M і звіти цих двох програм"
        if: ${{ always() && github.event_name == 'push' && startsWith(github.event.head_commit.message, 'LISP-TIER:') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 pinned
        with:
          name: sens-live-pairs-${{ github.sha }}
          path: ${{ runner.temp }}/sens-live-pairs/
          if-no-files-found: warn
          retention-days: 1

      - name: "Rust для System One після стороннього збою попереднього кроку"
        if: ${{ failure() && !cancelled() && steps.changed-t5m-lisp.outputs.system_one_tests == 'true' }}
        uses: dtolnay/rust-toolchain@1.99.0

      - uses: dtolnay/rust-toolchain@1.99.0
        if: ${{ steps.changed-t5m-lisp.outputs.system_one_tests == 'true' || steps.changed-t5m-lisp.outputs.utf8_runtime_tests == 'true' || steps.changed-t5m-lisp.outputs.prolog_bridge_tests == 'true' || steps.changed-t5m-lisp.outputs.codec_d2_tests == 'true' || steps.changed-t5m-lisp.outputs.guard_runtime_tests == 'true' || steps.changed-t5m-lisp.outputs.has_files == 'true' || steps.changed-t5m-lisp.outputs.translation_tests == 'true' || steps.changed-t5m-lisp.outputs.t5m_cli_tests == 'true' || steps.changed-t5m-lisp.outputs.yantra_runtime_tests == 'true' || steps.changed-t5m-lisp.outputs.closure_runtime_tests == 'true' || steps.changed-t5m-lisp.outputs.clips_runtime_tests == 'true' || steps.changed-t5m-lisp.outputs.narrate_runtime_tests == 'true' || (github.event_name == 'push' && (startsWith(github.event.head_commit.message, 'BENCH-T5M:') || startsWith(github.event.head_commit.message, 'LISP-TIER:'))) }}

      - name: "System One — Choice: впевненість і походження"
