      - name: Лінтер — негативний двійковий T5, D3 EQ відкидає пару
        id: linter-mutant
        shell: bash
        run: |
          set -euo pipefail
          fixture=tests/semantic/linter-domain-cutover-mutant.sens
          sha256sum "$fixture" tests/semantic/linter-domain-cutover-mutant.bits
          echo "test_id=linter-domain-cutover-mutant layer=eval semantic_authority=binary-SENS"
          python3 scripts/ci_failure_contract.py run \
