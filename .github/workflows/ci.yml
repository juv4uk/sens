          # D9 justified/vec/arglist: independent SENS witness for each of eight laws.
          d9_law_file="tests/semantic/d9-justified-vec-arglist-independent.lisp"
          d9_law_index=0
          while IFS= read -r d9_law || [[ -n "$d9_law" ]]; do
            [[ -z "$d9_law" || "$d9_law" == ";"* ]] && continue
            ((d9_law_index += 1))
            d9_single="$RUNNER_TEMP/d9-justified-$(printf "%02d" "$d9_law_index").lisp"
            printf "%s\n" "$d9_law" > "$d9_single"
            sha256sum "$d9_single"
            # Hash-bound failure provenance stays in the tracked source, not RUNNER_TEMP.
            d9_reproduce="grep -v '^;' $d9_law_file | sed '/^$/d' | sed -n '${d9_law_index}p' > /tmp/d9-justified-repro.lisp && target/debug/sens /tmp/d9-justified-repro.lisp"
            if ! d9_actual="$(target/debug/sens "$d9_single" 2>&1)"; then
              echo "::error::D9_JUSTIFIED_CASE_EXEC_RED id=d9-justified-case-$d9_law_index layer=eval fixture=$d9_single expected=D1:1 actual=execution-error reproduce=target/debug/sens" >&2
              printf "%s\n" "$d9_actual" >&2
              record_red "d9-justified-case-$d9_law_index" "$d9_law_file" "D1:1" "execution-error" "$d9_actual" "$d9_reproduce"
              exit 1
            fi
            d9_value="$(printf "%s\n" "$d9_actual" | tail -n 1)"
            if [[ "$d9_value" != "1" ]]; then
              echo "::error::D9_JUSTIFIED_CASE_LAW_DIFF id=d9-justified-case-$d9_law_index layer=eval fixture=$d9_single expected=D1:1 actual=$d9_value" >&2
              record_red "d9-justified-case-$d9_law_index" "$d9_law_file" "D1:1" "$d9_value" "$d9_actual" "$d9_reproduce"
              exit 1
            fi
            echo "D9_JUSTIFIED_CASE_PASS law=$d9_law_index"
          done < "$d9_law_file"
          if [[ "$d9_law_index" -ne 8 ]]; then
            echo "::error::D9_JUSTIFIED_CASE_CENSUS expected=8 actual=$d9_law_index" >&2
            exit 1
          fi
          # D9 TMS selectors: native SENS, positive fact/support/map and empty negative.
          d9_tms="tests/semantic/d9-tms-fact-support-map-laws.lisp"
          d9_tms_negative="tests/semantic/d9-tms-fact-empty-negative.lisp"
          sha256sum "$d9_tms" "$d9_tms_negative" lib/core4.lisp target/debug/sens
          if ! d9_tms_out="$(target/debug/sens "$d9_tms" 2>&1)"; then
            printf "%s\n" "$d9_tms_out" >&2
            echo "::error::D9_TMS_SELECT_EXEC_RED id=d9-tms-selectors layer=eval fixture=$d9_tms expected=eight-D1-YES actual=execution-error reproduce=target/debug/sens" >&2
            record_red "d9-tms-selectors" "$d9_tms" "(1 1 1 1 1 1 1 1)" "execution-error" "$d9_tms_out"
            exit 1
          fi
          d9_tms_actual="$(printf "%s\n" "$d9_tms_out" | tail -n 1)"
          if [[ "$d9_tms_actual" != "(1 1 1 1 1 1 1 1)" ]]; then
            echo "::error::D9_TMS_SELECT_LAW_DIFF id=d9-tms-selectors layer=eval fixture=$d9_tms expected=(1 1 1 1 1 1 1 1) actual=$d9_tms_actual" >&2
            record_red "d9-tms-selectors" "$d9_tms" "(1 1 1 1 1 1 1 1)" "$d9_tms_actual"
            exit 1
          fi
          if d9_tms_bad="$(target/debug/sens "$d9_tms_negative" 2>&1)"; then
            echo "::error::D9_TMS_EMPTY_ACCEPTED id=d9-tms-empty layer=eval fixture=$d9_tms_negative expected=D3-CAR-refusal actual=accepted" >&2
            record_red "d9-tms-empty" "$d9_tms_negative" "CAR refusal" "accepted"
            exit 1
          fi
          if [[ "$d9_tms_bad" != *"car expects a non-empty list"* ]]; then
