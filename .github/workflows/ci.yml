      - name: Core min-max — нативний D4 NULL закон порожнього результату
        id: core-sentinel
        shell: bash
        run: |
          set -euo pipefail
          program=tests/semantic/core-sentinel-null-law.sens
          printf '1\n' > "$RUNNER_TEMP/core-sentinel-expected"
          sha256sum lib/core.lisp lib/core4.lisp "$program" tests/semantic/core-sentinel-null-law.bits
          echo "test_id=core-sentinel-null-law layer=eval semantic_authority=binary-SENS"
          python3 scripts/ci_failure_contract.py run \
