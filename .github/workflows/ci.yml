          legacy_true=0
          legacy_false=0
          if printf '%s\n' "$code" | grep -Fq '(010 (001 ()))'; then legacy_true=1; fi
          if printf '%s\n' "$code" | grep -Fq '(101 (001 (0)) (001 (1)))'; then legacy_false=1; fi
          sha256sum lib/time.lisp
          printf 'TIME_D1_SOURCE_BITS true=%s false=%s legacy_true=%s legacy_false=%s\n' "$true_count" "$false_count" "$legacy_true" "$legacy_false"
          test "$true_count" -eq 20
          test "$false_count" -eq 4
          test "$legacy_true" -eq 0
          test "$legacy_false" -eq 0
