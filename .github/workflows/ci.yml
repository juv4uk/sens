name: "SENS — короткий CI: охоронець, Rust, Zig, SENS"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Повні дослідження/бенчмарки: ручний ci-heavy.yml.
# Відновлення фізичних пар: ручний запуск або цільовий reusable job у цьому CI.
# Червоний результат не приховуємо; PASS коридору не є допуском релізу.
permissions:
  contents: read

# Do not configure Actions concurrency here: every push/commit must retain
# its own CI run. New pushes must never cancel running or pending push checks.

jobs:
  sens:
    name: Охоронець · Rust · Zig · SENS
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, pinned
        with:
          persist-credentials: false
          # Для порівняння змінених Lisp-файлів потрібен батьківський SHA.
          # Без цього fetch окремого попереднього SHA вичерпував 60 с.
          fetch-depth: 2

      - name: Один автоматичний CI — тільки поточний main
        run: |
          set -euo pipefail
          python3 scripts/ci_one_focused_workflow.py
          python3 scripts/check_ci_bash_blocks.py
          # Catch shell-quoting regressions before builds/native SENS laws (e.g. apostrophes in Ukrainian identifiers).
          bash -n scripts/prove-lisp-semantic-t5m.sh
          bash -n scripts/ci-select-changed-t5m-lisp.sh
          bash -n scripts/ci-rust-mechanism-checks.sh
          # Негативний контроль повноти обліку файлів — один швидкий Bash-тест.
          bash tests/test-count-executable-lisp-git-inventory.sh
          python3 tests/test_single_data_schema.py
          # The Nirbhaya helper must mint from current sources, never restore archived T5M blobs.
          python3 -m unittest tests.test_mint_nirbhaya_law_pairs -v
          # Concurrent remint recovery must not widen an explicit source manifest.
          python3 -m unittest tests.test_remint_explicit_manifest_scope -v

      - name: Чинний SENS захист — host debt та незмінність мови
        shell: bash
        run: |
          set -euo pipefail
          # Єдиний автоматичний CI виконує ці вже наявні охоронці.
          # Семантика лишається у SENS; Bash/Python перевіряють лише межу.
          bash scripts/ensure-host-debt0.sh
          python3 -m unittest \
            tests.test_language_stays_in_sens.LanguageStaysInSens.test_frozen_host_debt_only_shrinks \
            tests.test_language_stays_in_sens.LanguageStaysInSens.test_no_new_host_file_carries_sens_semantics \
            -v

      - name: Rust CLI — рання перевірка синтаксису REPL
        shell: bash
        run: |
          set -euo pipefail
          if ! rustfmt --edition 2021 --emit stdout crates/sens-cli/src/repl.rs > /dev/null; then
            echo "::error file=crates/sens-cli/src/repl.rs,title=RUST_REPL_SYNTAX::REGRESSION id=rust-repl-syntax layer=rust-cli expected=parsable actual=syntax-error"
            exit 1
          fi

      - name: Заборона нових сирих кодів у змінених Lisp-файлах
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          base="$BEFORE_SHA"
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            base="$PR_BASE_SHA"
          fi
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            # Для ручного запуску або першого push потрібен попередній коміт.
            git fetch --no-tags --deepen=2 origin main
            base="$(git rev-parse HEAD^)"
          fi
          if ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            timeout 60s git fetch --no-tags --depth=1 origin "$base"
          fi
          python3 scripts/check_no_encoded_source_literals.py --base "$base"

      - name: "Перевірки структури — джерела доменів D1–24+ — без Python-тестів"
        run: |
          set -euo pipefail
          # Fail-closed: потрібен реальний охоронець драбини.
          for required in scripts/guard-domain-function-reuse.py; do
            if [[ ! -s "$required" ]]; then
              echo "::error file=$required,title=ARCHITECTURE-GUARD-MISSING::REGRESSION layer=ci-structure expected=nonempty-guard actual=empty-or-missing"
              exit 1
            fi
          done
          # Структура DEFINE та SENS має бути перевірена в тому самому кроці.
          python3 scripts/check-sens-definitions.py
          # Core4: кожний фізичний блок має містити ЦІЛІ SENS-форми;
          # зібране джерело має бути байт-у-байт ідентичним Core4.
          # Механічний Python не обчислює закони SENS.
          python3 scripts/split-core4.py --check
          # Поверхні звіряються з джерелами D1–24+; тут не фіксуємо межу драбини.
          python3 scripts/check-domain-ladder-identity.py --check
          python3 scripts/check-numeric-domain-ratification.py --self-test
          python3 scripts/check_d10_owner_whole_domain_ratification.py --self-test --coverage-tsv "$RUNNER_TEMP/d10-execution-coverage.tsv"
          python3 scripts/check_d11_selector_seed.py --json

      - name: Знайти змінені Lisp-програми, а не історичні таблиці
        id: changed-t5m-lisp
        if: ${{ always() }}
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: bash scripts/ci-select-changed-t5m-lisp.sh
      - uses: dtolnay/rust-toolchain@1.99.0
        if: ${{ always() }}

      - name: Власність тестів — Rust охоронець фізичних Lisp-законів
        if: ${{ always() && steps.changed-t5m-lisp.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          rustc --edition=2021 -O scripts/guard-native-test-ownership.rs -o "$RUNNER_TEMP/sens-native-law-guard"
          "$RUNNER_TEMP/sens-native-law-guard" --self-test
          "$RUNNER_TEMP/sens-native-law-guard" \
            --base "$(cat "$RUNNER_TEMP/native-semantic-base.sha")" \
            --head "$GITHUB_SHA"

      - name: Звірити повторне використання функцій D1–D11
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          # Guard/tool-only edits must exercise the real scanner even without Lisp changes.
          bash scripts/install-hooks.sh
          python3 -m unittest tests/test_domain_function_reuse_rule.py -v
          manifest="$RUNNER_TEMP/changed-t5m-lisp.txt"
          if [[ -s "$manifest" ]]; then
            # Guard має перевіряти НОВІ DEFINE, а не повторно оголошувати
            # старий Core4 дублем після будь-якої зміни коментаря чи джерела.
            base="$BEFORE_SHA"
            if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
              base="$(git rev-parse "$GITHUB_SHA^1")"
            fi
            if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
              base="$(git rev-parse HEAD^)"
            fi
            if ! git cat-file -e "$base^{commit}" 2>/dev/null; then
              timeout 60s git fetch --no-tags --depth=1 origin "$base"
            fi
            git cat-file -e "$base^{commit}"
            python3 scripts/guard-domain-function-reuse.py --paths-from "$manifest" --base "$base"
          else
            echo "немає змінених .lisp-програм — охоронець не має що перевіряти"
          fi


      - uses: ./.github/actions/install-zig
        if: ${{ always() }}

      - name: Zig bitpacker — build real WASM target without Rust fallback
        if: ${{ always() }}
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          rustup target add wasm32-unknown-unknown
          if cargo build --locked -p sens-wasm --target wasm32-unknown-unknown; then
            echo "SENS_ZIG_BITPACK_WASM_PASS target=wasm32-unknown-unknown"
          else
            status=$?
            echo "::error::SENS_ZIG_BITPACK_WASM_FAILED status=$status command=cargo build --locked -p sens-wasm --target wasm32-unknown-unknown"
            exit "$status"
          fi

      - name: Rust — механізм без мовного оракула
        if: ${{ always() }}
        timeout-minutes: 15
        shell: bash
        run: bash scripts/ci-rust-mechanism-checks.sh
      - name: Zig — точний кодек, ABI, пошкоджені кадри
        if: ${{ always() }}
        shell: bash
        run: |
          set -uo pipefail
          failed=0
          scripts/ci-zig-purity --self-test || failed=1
          scripts/ci-zig-purity || failed=1
          zig test -lc research/zig-codecs/tests.zig || failed=1
          zig test -lc zig_transport_root.zig || failed=1
          zig test -O ReleaseFast -lc bench_t5m_test.zig || failed=1
          if (( failed != 0 )); then
            echo "::error title=ZIG_TRANSPORT_REGRESSION::id=zig-codec-abi layer=Zig expected=all-tests-pass actual=one-or-more-failures repro=zig-test sha=$GITHUB_SHA"
          fi
          exit "$failed"

      - name: Один транспортний бенчмарк — Zig T5M
        if: ${{ always() }}
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          zig run -O ReleaseFast -lc bench_t5m.zig
          echo "MEASURED layer=Zig/T5M sha=$GITHUB_SHA semantics=NOT_TESTED"

      - name: Зібрати нативний SENS і Zig/T5M лише один раз
        id: native-build
        if: ${{ always() }}
        shell: bash
        timeout-minutes: 12
        run: |
          set -euo pipefail
          export CARGO_BUILD_JOBS=2 CARGO_INCREMENTAL=0
          cargo build --locked -p sens-cli --bin sens --bin sens-trit --features benchmark-ast-visits
          test -x "$PWD/target/debug/sens"
          test -x "$PWD/target/debug/sens-trit"

      # Core4 is executed from lib/core4.sens (Zig-restored at build),
      # not from the textual file changed in Git. Detect stale bootstrap
      # BEFORE calling old bytecode a successful implementation of a new law.
      - name: Core4 — точна фізична пара SENS/Zig T5M
        if: ${{ always() && steps.native-build.outcome == 'success' }}
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          physical_dir="$RUNNER_TEMP/changed-t5m-pairs/core4-parity"
          mkdir -p "$physical_dir"
          # Only real SENS emits words; pinned Zig packages the binary.
          timeout 180s "$PWD/target/debug/sens" --t5m-mint-pair        lib/core4.lisp "$physical_dir/core4.sens"
          timeout 45s "$PWD/target/debug/sens-trit" verify-view             "$physical_dir/core4.sens" >"$physical_dir/core4-verified.txt"
          # SHA of the exact source checkout; never apply this artifact to a
          # different main tree even if its filename still matches.
          git rev-parse --verify HEAD > "$physical_dir/source-commit.sha"
          sha256sum lib/core4.lisp > "$physical_dir/source-core4.sha256"
          sha256sum lib/core4.lisp lib/core4.sens \
            "$physical_dir/core4.sens" > "$physical_dir/sha256.txt"
          if ! cmp -s lib/core4.sens "$physical_dir/core4.sens"; then
            echo "::error file=lib/core4.sens,title=SENS_CORE4_PHYSICAL_DRIFT::REGRESSION layer=bootstrap expected=exact-current-SENS-source actual=outdated-physical bytes=Zig/T5M release=NO-GO" >&2
            exit 1
          fi
          echo "SENS_CORE4_PHYSICAL_PARITY_PASS source=lib/core4.lisp physical=lib/core4.sens codec=Zig/T5M"

      - name: PUSH Lisp → кодек Zig/T5M → виконання SENS
        id: t5m_changed_execute
        if: ${{ always() && steps.native-build.outcome == 'success' }}
        shell: bash
        timeout-minutes: 15
        run: |
          set -euo pipefail
          manifest="$RUNNER_TEMP/changed-t5m-lisp.txt"
          if [[ ! -s "$manifest" ]]; then
            # Без змін Lisp порожній список програм — NOT_APPLICABLE, а не успіх мовного доказу.
            # Помилковий відбір або порожній список після Lisp-змін залишаються RED.
            if [[ "${{ steps.changed-t5m-lisp.outcome }}" != "success" ]]; then
              echo "::error file=.github/workflows/ci.yml,title=SENS Lisp push::REGRESSION layer=selection expected=successful-manifest-selection actual=failed"
              exit 1
            fi
            if [[ "${{ steps.changed-t5m-lisp.outputs.has_lisp }}" == "true" ]]; then
              echo "::error file=.github/workflows/ci.yml,title=SENS Lisp push::REGRESSION layer=selection expected=executable-Lisp-witness actual=empty-manifest"
              exit 1
            fi
            echo "::notice file=.github/workflows/ci.yml,title=SENS Lisp push::NOT_APPLICABLE changed_lisp=false physical_execution=NOT_TESTED"
            exit 0
          fi
          export CARGO_BUILD_JOBS=2 CARGO_INCREMENTAL=0
          binary="$PWD/target/debug/sens"
          SENS_NATIVE_T5M=1 SENS_T5M_OPEN="$PWD/target/debug/sens-trit" \
            bash scripts/execute_changed_lisp_t5m.sh \
              "$binary" "$manifest" \
              "$RUNNER_TEMP/changed-t5m-pairs"
          echo "::notice file=.github/workflows/ci.yml,title=SENS Lisp→Zig/T5M→SENS::PASS physical_codec=Zig/T5M execution=SENS release=NOT_CERTIFIED"


      # Export the changed-file mint before the long all-laws sweep so that
      # exact D11 generator bytes survive even when the later suite times out.
      - name: Export canonical D11 SENS/Zig T5M pair regeneration evidence
        if: ${{ always() && contains(github.event.head_commit.message, 'SENS_PAIR_REGEN') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sens-d11-pair-regen-${{ github.sha }}
          path: ${{ runner.temp }}/changed-t5m-pairs/**
          if-no-files-found: warn
          retention-days: 1
          compression-level: 0

      - name: Lisp → Zig/T5M → SENS — позитивні та негативні закони
        if: ${{ always() && steps.native-build.outcome == 'success' }}
        timeout-minutes: 35
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/prove-lisp-semantic-t5m.sh \
            "$PWD/target/debug/sens" "$PWD/target/debug/sens-trit" \
            "$RUNNER_TEMP/sens-language-laws"
          bash scripts/prove-lisp-language-laws.sh "$PWD/target/debug/sens"

      # Narrow, one-run evidence export: capture outputs minted by the actual
      # SENS CLI + Zig/T5M route when explicitly requested for pair regeneration.
      - name: Export canonical SENS/Zig T5M pair regeneration evidence
        if: ${{ always() && contains(github.event.head_commit.message, 'SENS_PAIR_REGEN') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sens-pair-regen-${{ github.sha }}
          # Artifact contains only the physical Core4 minted by this exact
          # commit, plus its SHA receipts and Zig verify-view output.
          path: ${{ runner.temp }}/changed-t5m-pairs/core4-parity/**
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  # Перевіряємо реальний diff у Git, а не покладаємося на форму push payload.
  # Цей легкий крок не збирає Rust/Zig і не запускає мовний oracle.
  detect-remint:
    name: Визначити, чи потрібне фізичне SENS/Zig перемайнення
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    outputs:
      needed: ${{ steps.scope.outputs.needed }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, pinned
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Перевірити точний push diff
        id: scope
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          # Явний маркер залишається аварійним/ручним шляхом відновлення.
          if [[ "${HEAD_MESSAGE:-}" == *SENS_PAIR_REGEN* ]]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
            echo "REMINT_SCOPE source=explicit-marker"
            exit 0
          fi
          if [[ -z "${BEFORE_SHA:-}" || "$BEFORE_SHA" =~ ^0+$ ]]; then
            changed="$(git diff-tree --no-commit-id --name-only -r "$HEAD_SHA")"
          else
            if ! git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
              timeout 60s git fetch --no-tags --depth=1 origin "$BEFORE_SHA"
            fi
            changed="$(git diff --name-only "$BEFORE_SHA" "$HEAD_SHA")"
          fi
          if printf '%s\n' "$changed" | grep -Fxq -e 'lib/core4.lisp' -e 'lib/lisp-fs.lisp' -e 'tests/fixtures/wsm-fs-record-producer.lisp' -e '.github/workflows/ci.yml' -e '.github/workflows/remint-drifted-pairs.yml'; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
            echo "REMINT_SCOPE changed-target=yes"
            exit 0
          fi
          # Recover an interrupted/cancelled remint on a later unrelated push:
          # a newer Lisp source than its committed physical T5M pair is still
          # pending work even when the current push only changed tooling.
          for source in lib/core4.lisp lib/lisp-fs.lisp tests/fixtures/wsm-fs-record-producer.lisp; do
            pair="${source%.lisp}.sens"
            [[ -f "$source" && ! -L "$source" ]] || continue
            if [[ ! -s "$pair" || -L "$pair" ]]; then
              echo "needed=true" >> "$GITHUB_OUTPUT"
              echo "REMINT_SCOPE missing-physical-pair source=$source"
              exit 0
            fi
            source_commit="$(git log -1 --format=%H -- "$source")"
            pair_commit="$(git log -1 --format=%H -- "$pair")"
            if [[ -n "$source_commit" && -n "$pair_commit" ]] &&
               ! git merge-base --is-ancestor "$source_commit" "$pair_commit"; then
              echo "needed=true" >> "$GITHUB_OUTPUT"
              echo "REMINT_SCOPE source-newer-than-pair source=$source pair=$pair"
              exit 0
            fi
          done
          echo "needed=false" >> "$GITHUB_OUTPUT"
          echo "REMINT_SCOPE changed-target=no pending-drift=no"

  # Єдина автоматична CI-подія залишається у ci.yml; тільки точний diff
  # або явний маркер запускає дорогий canonical SENS→Zig/T5M remint.
  remint-targeted:
    name: Канонічно відновити фізичні F6/Core4 пари
    needs: detect-remint
    if: ${{ github.event_name == 'push' && needs.detect-remint.outputs.needed == 'true' }}
    uses: ./.github/workflows/remint-drifted-pairs.yml
    with:
      files: |
        lib/core4.lisp
        lib/lisp-fs.lisp
        tests/fixtures/wsm-fs-record-producer.lisp
    permissions:
      contents: write
