name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pr-focused:
    name: focused PR verification
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: pr-focused

      - name: Classify changed paths
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git -c core.quotePath=false diff --name-only "$BASE_SHA" "$HEAD_SHA" > /tmp/changed.txt
          git -c core.quotePath=false diff --numstat "$BASE_SHA" "$HEAD_SHA" > /tmp/changed-numstat.txt
          cat /tmp/changed.txt
          surface=false; core=false; semantic=false; host=false; cli=false; xtask=false; meta=false; rust=false; workspace=false; workflow=false
          while IFS= read -r path; do
            case "$path" in Cargo.toml|Cargo.lock|.cargo/*) workspace=true ;; esac
            case "$path" in .github/workflows/*) workflow=true ;; esac
            case "$path" in *.rs|Cargo.toml|Cargo.lock|crates/*/Cargo.toml) rust=true ;; esac
            case "$path" in lib/surface/*|lib/generated/meta-semantic-registry.lisp|docs/ukrainian-api.md|docs/generated/public-api-discovery.md|scripts/public_api_inventory.py|scripts/generate-meta-semantic-registry.lisp|scripts/generate-ukrainian-api.py|scripts/перевірити-український-профіль.lisp|machine-lowering-boundary.lisp|repo.lisp|crates/sens/tests/macro_derivation.rs|crates/sens/tests/ukrainian_api_docs.rs|crates/sens/tests/uk_surface_equivalence.rs|crates/sens/tests/public_api_inventory_contract.rs|crates/sens/tests/machine_lowering_boundary.rs) surface=true ;; esac
            case "$path" in crates/sens/src/*|crates/sens/tests/*|lib/*.lisp|lib/*/*.lisp) case "$path" in lib/surface/*|lib/generated/*) ;; *) core=true ;; esac ;; esac
            case "$path" in crates/sens/src/value.rs|crates/sens/src/eval/*|crates/sens/src/semantic_registry.rs|crates/sens/src/semantic_registry_generated.rs|crates/sens/src/function_signatures_generated.rs|lib/surface/function-signatures.lisp|scripts/generate-rust-function-signatures.lisp|scripts/generate-rust-evaluator-dispatch.lisp|scripts/generate-rust-semantic-registry.lisp|crates/sens/tests/witness_authority.rs|lib/canon.lisp|lib/core.lisp|lib/core4.lisp|lib/meta-eval.lisp|lib/process.lisp|contracts/*.lisp|tests/fixtures/conformance.lisp|tests/fixtures/*-witness.lisp|my-lisp-constitution.lisp) semantic=true ;; esac
            if bash scripts/is-current-semantic-fixture.sh "$path"; then semantic=true; fi
            case "$path" in crates/sens-host/src/*|crates/sens-host/tests/*) host=true ;; esac
            case "$path" in crates/sens-cli/src/*|crates/sens-cli/tests/*) cli=true ;; esac
            case "$path" in crates/xtask/src/*|crates/xtask/tests/*) xtask=true ;; esac
            case "$path" in lib/meta-eval.lisp|lib/reason.lisp|lib/forward.lisp|lib/knowledge.lisp|crates/sens/tests/meta_eval_*|crates/sens/tests/reason_*|crates/sens/tests/reasoning_*) meta=true ;; esac
          done < /tmp/changed.txt
          { echo "surface=$surface"; echo "core=$core"; echo "semantic=$semantic"; echo "host=$host"; echo "cli=$cli"; echo "xtask=$xtask"; echo "meta=$meta"; echo "rust=$rust"; echo "workspace=$workspace"; echo "workflow=$workflow"; } | tee -a "$GITHUB_OUTPUT"

      - name: Numeric source inventory observation
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/numeric_source_inventory.py --self-test
          python3 scripts/numeric_source_inventory.py
          python3 scripts/numeric_source_inventory.py \
            --check-baseline tests/data/numeric-source-inventory-baseline.json
          python3 scripts/numeric_source_inventory.py \
            --check-active-routes tests/data/numeral-active-lib-routes.json
          python3 scripts/numeric_source_inventory.py --json > /tmp/numeric-source-inventory.json

      - name: Active SENS coverage report + ratchet
        run: cargo test -p sens --test non_sens_code_inventory active_sens_coverage -- --nocapture

      - name: Exact let/let* code parity
        run: cargo test -p sens --test let_code_parity_1678 -- --nocapture

      - name: Binary-trees N=10 reference fixture
        run: python3 benchmarks/cross-language/binary_trees_reference.py --check-fixture

      - name: Semantic fixture path classifier self-test
        run: bash scripts/test-ci-semantic-path-classifier.sh

      - name: Rust one-way valve self-test
        shell: bash
        run: bash scripts/test-rust-one-way-valve.sh

      - name: Rust one-way subtraction valve
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: bash scripts/rust-one-way-valve.sh "$BASE_SHA" "$HEAD_SHA"

      - name: Exact-width paradigm one-way self-test
        shell: bash
        run: bash scripts/test-domain-paradigm-one-way-guard.sh

      - name: Exact-width paradigm legacy-dependency ratchet
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: bash scripts/domain-paradigm-one-way-guard.sh "$BASE_SHA" "$HEAD_SHA"

      - name: SID exact-binary identity guard
        if: steps.changes.outputs.rust == 'true'
        shell: bash
        run: bash scripts/sid-binary-identity-guard.sh

      - name: Single SID runtime value guard
        if: steps.changes.outputs.rust == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n --include='*.rs' 'Value::SemanticRef\|SemanticRef(Sid8)\|SemanticRef(u8)' crates; then
            echo "ERROR: SID identity across Rust crates must use only Value::Sid(Sid8)" >&2
            exit 1
          fi

      - name: Debug post-core definition data shape for #771
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p sens --test postcore_build_definitions_debug -- --nocapture

      - name: Asymmetric semantic firewall (host -> Lisp)
        shell: bash
        run: |
          set -euo pipefail
          cargo run --release -p sens-cli --bin gen-fasl -- lib/core4.lisp lib/core4.lisp.fasl
          cargo build -p sens-cli --bin sens
          : > tests/semantic-authority-changes.lisp
          while IFS= read -r path; do
            case "$path" in
              *.lisp|*.wsm|*.my|*.sens|*.лісп|*.всм|*.мій|*.сенс)
                ;;
              *)
                continue
                ;;
            esac
            case "$path" in
              tests/fixtures/semantic-authority-guard/*)
                continue
                ;;
            esac
            # A deletion has no remaining source text that can introduce
            # host -> language authority. Do not require a tombstone file.
            [[ -e "$path" ]] || continue
            digest="$(sha256sum "$path" | awk '{print $1}')"
            printf '(changed "%s" "%s")\n' "$path" "$digest" >> tests/semantic-authority-changes.lisp
          done < /tmp/changed.txt
          ./target/debug/sens scripts/semantic-authority-guard.lisp > tests/semantic-authority-verdict.lisp
          cat tests/semantic-authority-verdict.lisp
          ./target/debug/sens scripts/semantic-authority-guard-enforce.lisp

      - name: Upload regenerated core FASL for #771
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: core-fasl-771
          path: lib/core4.lisp.fasl
          if-no-files-found: error
          retention-days: 1

      - name: Export regenerated core FASL for #771
        shell: bash
        run: |
          set -euo pipefail
          test -s lib/core4.lisp.fasl
          git diff --check
        

      - name: Lisp-owned repo tooling inventory
        shell: bash
        run: |
          set -euo pipefail
          ./target/debug/sens scripts/check-repo-tooling-inventory.lisp

      - name: Canon function-table mechanism provenance
        shell: bash
        run: |
          set -euo pipefail
          ./target/debug/sens scripts/check-function-table-mechanisms.lisp > tests/function-table-mechanisms-verdict.lisp
          cat tests/function-table-mechanisms-verdict.lisp
          ./target/debug/sens scripts/enforce-function-table-mechanisms.lisp

      - name: Profile-scoped SENS host admission
        run: cargo test -p sens --test profile_mechanism_projection_1422 -- --nocapture

      - name: Canon-subordinate island math evidence
        shell: bash
        run: |
          set -euo pipefail
          ./target/debug/sens scripts/check-island-math-evidence.lisp > tests/island-math-evidence-verdict.lisp
          cat tests/island-math-evidence-verdict.lisp
          ./target/debug/sens scripts/enforce-island-math-evidence.lisp

      - name: Lisp-owned machine non-interference guard
        shell: bash
        run: |
          set -euo pipefail
          cargo build -p sens-cli --bin sens

          # #150: the admitted authority graph is one-way.
          ./target/debug/sens scripts/machine-authority-guard.lisp

          cp tests/machine-authority-edges.lisp /tmp/machine-authority-edges.lisp
          cp tests/fixtures/machine-authority/reverse-edge.lisp tests/machine-authority-edges.lisp
          if ./target/debug/sens scripts/machine-authority-guard.lisp > /tmp/machine-reverse-edge.log 2>&1; then
            echo "ERROR: #150 reverse machine->semantic authority edge was accepted"
            exit 1
          fi
          grep -q 'machine-authority-boundary-violation' /tmp/machine-reverse-edge.log
          cp /tmp/machine-authority-edges.lisp tests/machine-authority-edges.lisp

          # #211: a native result may not become its own semantic authority
          # or the only semantic answer key.
          cp lib/machine/capability-provenance.lisp /tmp/machine-capability-provenance.lisp
          cp tests/fixtures/machine-authority/hybrid-capability.lisp lib/machine/capability-provenance.lisp
          if ./target/debug/sens scripts/machine-authority-guard.lisp > /tmp/machine-hybrid.log 2>&1; then
            echo "ERROR: #211 machine/native semantic answer key was accepted"
            exit 1
          fi
          grep -q 'machine-semantic-hybrid-violation' /tmp/machine-hybrid.log
          cp /tmp/machine-capability-provenance.lisp lib/machine/capability-provenance.lisp

          # Same Lisp addition, two admitted register realizations.
          representation_status="$(./target/debug/sens tests/fixtures/machine-representation-independence-witness.lisp)"
          if [[ "$representation_status" != "(machine-representation-independence-witness (status pass))" ]]; then
            printf 'machine representation-independence witness failed: %s\n' "$representation_status" >&2
            exit 1
          fi

          # Meaning must remain executable when the whole target-specific
          # machine layer is physically absent from the checkout.
          restore_machine_layer() {
            if [[ -d /tmp/sens-machine-211 ]]; then
              mv /tmp/sens-machine-211 lib/machine
            fi
          }
          trap restore_machine_layer EXIT
          rm -rf /tmp/sens-machine-211
          mv lib/machine /tmp/sens-machine-211
          replaceability_status="$(./target/debug/sens tests/fixtures/machine-replaceability-witness.lisp)"
          restore_machine_layer
          trap - EXIT
          if [[ "$replaceability_status" != "(machine-replaceability-witness (status pass))" ]]; then
            printf 'machine replaceability witness failed: %s\n' "$replaceability_status" >&2
            exit 1
          fi

      - name: Diff hygiene
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git diff --check "$BASE_SHA" "$HEAD_SHA"

      - name: Set up Ruby for workflow YAML validation
        if: steps.changes.outputs.workflow == 'true'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Validate workflow YAML syntax
        if: steps.changes.outputs.workflow == 'true'
        run: ruby -e 'require "psych"; Dir[".github/workflows/*.yml"].sort.each { |f| Psych.parse_file(f); puts f }'

      - name: Check generated function signatures projection
        if: steps.changes.outputs.semantic == 'true' && steps.changes.outputs.workspace != 'true'
        run: ./target/debug/sens scripts/generate-rust-function-signatures.lisp --check

      - name: Exercise future main fast critical gate
        if: steps.changes.outputs.workflow == 'true'
        run: |
          ./target/debug/sens scripts/generate-meta-semantic-registry.lisp --check
          python3 scripts/public_api_inventory.py --check
          bash scripts/test-current-semantic-slice.sh
          cargo test -p sens --test machine_lowering_boundary --test machine_admission_adversarial --test machine_type_discipline --test machine_noninterference_contract --test machine_atoms --test machine_minimal_profile --test uk_surface_equivalence --test public_api_inventory_contract --test english_names_in_code
          cargo test -p sens-host --test native_lisp_bytes --test native_cond_profile
          cargo test -p sens-cli --test cli
          cargo test -p xtask --test license_policy
          cargo run --quiet -p sens-cli --bin sens -- scripts/verify-repo.lisp

      - name: Exercise future main fast clippy
        if: steps.changes.outputs.workflow == 'true'
        run: cargo clippy -p sens -p sens-host -p sens-cli -p xtask --all-targets -- -D warnings

      - name: Workspace dependency-graph fallback
        if: steps.changes.outputs.workspace == 'true'
        run: |
          cargo test --workspace
          cargo build --workspace

      - name: Check generated semantic registry
        if: (steps.changes.outputs.surface == 'true' || steps.changes.outputs.semantic == 'true') && steps.changes.outputs.workspace != 'true'
        run: |
          ./target/debug/sens scripts/generate-meta-semantic-registry.lisp --check
          ./target/debug/sens scripts/generate-rust-semantic-registry.lisp --check
          ./target/debug/sens scripts/generate-rust-evaluator-dispatch.lisp --check
          ./target/debug/sens scripts/generate-rust-profile-mechanism-routes.lisp --check
          ./target/debug/sens scripts/generate-rust-function-signatures.lisp --check
          ./target/debug/sens scripts/generate-functions-md.lisp --check

      - name: Check public API discovery projection
        if: steps.changes.outputs.surface == 'true' && steps.changes.outputs.workspace != 'true'
        run: python3 scripts/public_api_inventory.py --check

      - name: Focused surface contracts
        if: steps.changes.outputs.surface == 'true' && steps.changes.outputs.workspace != 'true'
        shell: bash
        run: |
          set -euo pipefail
          tests=(macro_derivation ukrainian_api_docs uk_surface_equivalence public_api_inventory_contract machine_noninterference_contract)
          if [[ -f crates/sens/tests/machine_lowering_boundary.rs ]]; then tests+=(machine_lowering_boundary); fi
          args=(); for test_name in "${tests[@]}"; do args+=(--test "$test_name"); done
          cargo test -p sens "${args[@]}"

      - name: Current Lisp-owned semantic slice
        if: steps.changes.outputs.semantic == 'true' && steps.changes.outputs.workspace != 'true'
        run: bash scripts/test-current-semantic-slice.sh

      - name: Core language package tests
        if: steps.changes.outputs.core == 'true' && steps.changes.outputs.surface != 'true' && steps.changes.outputs.semantic != 'true' && steps.changes.outputs.workspace != 'true'
        run: cargo test -p sens

      - name: Native host vertical witness
        if: steps.changes.outputs.host == 'true' && steps.changes.outputs.workspace != 'true'
        run: cargo test -p sens-host --test native_lisp_bytes --test native_cond_profile

      - name: CLI black-box tests
        if: (steps.changes.outputs.cli == 'true' || steps.changes.outputs.surface == 'true') && steps.changes.outputs.workspace != 'true'
        run: cargo test -p sens-cli --test cli

      - name: xtask policy tests
        if: (steps.changes.outputs.xtask == 'true' || steps.changes.outputs.surface == 'true') && steps.changes.outputs.workspace != 'true'
        run: |
          cargo test -p xtask --test external_oracle_cli
          cargo test -p xtask --test xed_import_cli
          cargo test -p xtask --test encoder_coverage_cli
          cargo test -p xtask --test license_policy
          cargo run --quiet -p sens-cli --bin sens -- scripts/verify-repo.lisp
          cargo run -p xtask -- import-xed-evidence --check
          cargo run -p xtask -- generate-encoder-coverage --check

      - name: Focused Advice Taker witness
        if: steps.changes.outputs.meta == 'true' && steps.changes.outputs.workspace != 'true'
        run: cargo test --profile ci-meta -p sens --test meta_eval_advice_taker advice_taker_native_and_meta_preserve_expected_outcome_classes -- --ignored --nocapture

      - name: Clippy changed Rust surfaces
        if: steps.changes.outputs.rust == 'true' && steps.changes.outputs.workspace != 'true'
        run: cargo clippy -p sens -p sens-host -p sens-cli -p xtask --all-targets -- -D warnings

  island-math-adversarial:
    name: island math adversarial matrix
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: island-math-adversarial
      - name: Build Lisp checker runtime
        run: cargo build -p sens-cli --bin sens
      - name: Canon-subordinate island math adversarial matrix
        shell: bash
        run: |
          set -euo pipefail
          cp lib/island-math-evidence.lisp /tmp/island-math-evidence.lisp
          restore_evidence() { cp /tmp/island-math-evidence.lisp lib/island-math-evidence.lisp; }
          trap restore_evidence EXIT

          cp tests/fixtures/island-math-evidence/unadmitted-route.lisp lib/island-math-evidence.lisp
          ./target/debug/sens scripts/check-island-math-evidence.lisp > /tmp/island-math-unadmitted.lisp
          grep -q 'executor-route-not-admitted-by-canon-projection' /tmp/island-math-unadmitted.lisp

          cp tests/fixtures/island-math-evidence/unsupported-executor.lisp lib/island-math-evidence.lisp
          ./target/debug/sens scripts/check-island-math-evidence.lisp > /tmp/island-math-executor.lisp
          grep -q 'unsupported-executor' /tmp/island-math-executor.lisp

          cp tests/fixtures/island-math-evidence/duplicate-route.lisp lib/island-math-evidence.lisp
          ./target/debug/sens scripts/check-island-math-evidence.lisp > /tmp/island-math-duplicate.lisp
          grep -q 'duplicate-executor-evidence' /tmp/island-math-duplicate.lisp

          cp tests/fixtures/island-math-evidence/semantic-field-leak.lisp lib/island-math-evidence.lisp
          ./target/debug/sens scripts/check-island-math-evidence.lisp > /tmp/island-math-semantic-leak.lisp
          grep -q 'semantic-field-forbidden' /tmp/island-math-semantic-leak.lisp

          restore_evidence
          trap - EXIT

  windows-native-exec-witness:
    name: Windows native-exec ABI witness
    if: vars.HOSTED_RUNNERS == 'true'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-native-exec-witness
      - name: Windows guest-ABI witness (sysv64 vs win64)
        run: cargo test -p sens-host --test windows_native_exec_abi
      - name: Native CPU vertical witnesses on Windows
        run: cargo test -p sens-host --test native_lisp_bytes --test native_cond_profile
      - name: Clippy sens-host on Windows
        run: cargo clippy -p sens-host --all-targets -- -D warnings

  main-fast-critical:
    name: main fast critical gate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: main-fast-critical
      - name: Generated authority projections
        run: |
          cargo build -p sens-cli --bin sens
          ./target/debug/sens scripts/generate-meta-semantic-registry.lisp --check
          python3 scripts/public_api_inventory.py --check
          cargo run -p xtask -- import-xed-evidence --check
          cargo run -p xtask -- generate-encoder-coverage --check
      - name: Machine non-interference guard
        shell: bash
        run: |
          set -euo pipefail
          cargo build -p sens-cli --bin sens
          ./target/debug/sens scripts/machine-authority-guard.lisp

          representation_status="$(./target/debug/sens tests/fixtures/machine-representation-independence-witness.lisp)"
          if [[ "$representation_status" != "(machine-representation-independence-witness (status pass))" ]]; then
            printf 'machine representation-independence witness failed: %s\n' "$representation_status" >&2
            exit 1
          fi

          restore_machine_layer() {
            if [[ -d /tmp/sens-machine-211 ]]; then
              mv /tmp/sens-machine-211 lib/machine
            fi
          }
          trap restore_machine_layer EXIT
          rm -rf /tmp/sens-machine-211
          mv lib/machine /tmp/sens-machine-211
          replaceability_status="$(./target/debug/sens tests/fixtures/machine-replaceability-witness.lisp)"
          restore_machine_layer
          trap - EXIT
          if [[ "$replaceability_status" != "(machine-replaceability-witness (status pass))" ]]; then
            printf 'machine replaceability witness failed: %s\n' "$replaceability_status" >&2
            exit 1
          fi
      - name: Current Lisp-owned semantic witnesses
        run: bash scripts/test-current-semantic-slice.sh
      - name: Critical machine and surface witnesses
        run: cargo test -p sens --test machine_lowering_boundary --test machine_admission_adversarial --test machine_type_discipline --test machine_noninterference_contract --test machine_atoms --test machine_minimal_profile --test uk_surface_equivalence --test public_api_inventory_contract --test english_names_in_code
      - name: Native CPU vertical witnesses
        run: cargo test -p sens-host --test native_lisp_bytes --test native_cond_profile
      - name: CLI smoke
        run: cargo test -p sens-cli --test cli
      - name: Governance and policy checks
        run: |
          cargo test -p xtask --test license_policy
          cargo run --quiet -p sens-cli --bin sens -- scripts/verify-repo.lisp

  main-fast-clippy:
    name: main fast clippy
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: main-fast-clippy
      - run: cargo clippy -p sens -p sens-host -p sens-cli -p xtask --all-targets -- -D warnings
