name: SENS — один точковий та інформативний тест

# ВЛАСНИК: один автоматичний CI лише для змін з визначеним SENS-свідком.
# Без масових тестів, Python/Rust truth-таблиць чи зайвого runner fan-out.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sens-single-focused-${{ github.ref }}
  cancel-in-progress: true

jobs:
  one-sens-proof:
    name: Один двійковий SENS-свідок або точкова перевірка CI
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 2
      - uses: dtolnay/rust-toolchain@1.99.0
      - name: Одна причинно пов'язана перевірка — SENS сам визначає семантику
        env:
          SENS_CI_BEFORE: ${{ github.event.before }}
        run: python3 scripts/ci_one_focused_workflow.py --execute
