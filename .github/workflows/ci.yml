            --test-id sid8-broad-source-cutover \
            --layer encode \
            --fixture tests/test_sid8_broad_source_cutover.py \
            --report-file "$report" \
            -- python3 -m unittest discover -s tests -p test_sid8_broad_source_cutover.py -v
      - name: Мігратор — немає позитивного дозволу без точної identity, навіть з Python -O
        id: migrator-optimized
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/sens-focal-red.jsonl"
          python3 scripts/ci_failure_contract.py run \
            --test-id migrate-resolver-failclosed-optimized \
            --layer encode \
            --fixture scripts/migrate-to-sens-codes.py \
            --report-file "$report" \
            -- python3 -O tests/test_migrate_resolver_failclosed.py
      - name: TCP — Rust інтеграційний тест з викликом SENS-бібліотеки (не окремий native CLI oracle)
        id: tcp-migration
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/sens-focal-red.jsonl"
          echo "test_id=tcp-binary-d4-law layer=transport executor=rust-integration—not-native-cli"
          sha256sum tests/fixtures/semantic/tcp-exact-selftest.bits lib/tcp.lisp
          python3 scripts/ci_failure_contract.py run \
            --test-id tcp-binary-d4-law \
            --layer transport \
            --fixture tests/fixtures/semantic/tcp-exact-selftest.bits \
            --report-file "$report" \
            -- cargo test --locked -p sens --test tcp_d1_fallback -- --nocapture
      - name: META-FC — двійковий D1 self-verdict та однобітний мутант (Rust лише транспорт)
        id: meta-fc-d1
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/sens-focal-red.jsonl"
          echo "test_id=meta-fc-predicates-d1 layer=transport executor=CI_GLUE_NO_SEMANTICS; SENS owns truth"
          sha256sum lib/meta-eval-first-class.lisp tests/semantic/meta-fc-predicates-d1-{law,mutant}.lisp
          python3 scripts/ci_failure_contract.py run \
            --test-id meta-fc-predicates-d1 \
            --layer transport \
            --fixture tests/semantic/meta-fc-predicates-d1-law.lisp \
            --report-file "$report" \
            -- cargo test --locked -p sens --test meta_fc_predicate_witness -- --nocapture
      - name: UNIFY observer — SENS D1/D3/D4/D5/D8 fail-closed law and one-bit mutant
        id: unify-observe-d1
        shell: bash
        run: |
          set -euo pipefail
          # Structure-only guards: meaning and verdict remain binary SENS.
          grep -Fq '(0011 уніфікація-спостереження-стан' lib/unify-observe.lisp
          if grep -Eq '\((001000|101010000)([[:space:]]|\()' lib/unify-observe.lisp; then
            echo 'REGRESSION: historical D6/D9 executable head in unify-observe' >&2
            exit 1
          fi
          report="$RUNNER_TEMP/sens-focal-red.jsonl"
          evidence="$RUNNER_TEMP/sens-native-evidence.jsonl"
          printf '1\n' > "$RUNNER_TEMP/expected-unify-d1"
          for program in tests/semantic/unify-observe-d1-fallback-{law,mutant}.sens; do
            sha256sum "$program"
          done
          python3 scripts/ci_failure_contract.py run \
            --test-id unify-observe-d1-law \
            --layer eval \
            --fixture tests/semantic/unify-observe-d1-fallback-law.sens \
            --expected-file "$RUNNER_TEMP/expected-unify-d1" \
            --report-file "$report" \
            --executor-report-file "$evidence" \
            -- target/debug/sens tests/semantic/unify-observe-d1-fallback-law.sens
          python3 scripts/ci_failure_contract.py run \
            --test-id unify-observe-d1-mutant \
            --layer eval \
            --fixture tests/semantic/unify-observe-d1-fallback-mutant.sens \
            --expect-error-substring "not callable" \
            --report-file "$report" \
            --executor-report-file "$evidence" \
            -- target/debug/sens tests/semantic/unify-observe-d1-fallback-mutant.sens
      - name: Вбудовані перевірки реальності — інформативні гейти, що відповідають чинному main
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/run-reality-checks.py
      - name: Zig ↔ Rust T5 — обов'язковий парний бенчмарк байтового паритету
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$RUNNER_TEMP/zig-x86_64-linux-0.16.0:$PATH"
          python3 research/zig-codecs/t5/run_paired_bench.py \
            --zig-pin 0.16.0 --pairs 3 --out-dir "$RUNNER_TEMP/zig-rust-t5-results"
          cat "$RUNNER_TEMP/zig-rust-t5-results/STATUS"
          cat "$RUNNER_TEMP/zig-rust-t5-results/summary.md"
      - name: Zig ↔ Rust F3C — обов'язковий парний бенчмарк .senc
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$RUNNER_TEMP/zig-x86_64-linux-0.16.0:$PATH"
          python3 research/zig-codecs/f3c/run_paired_bench.py \
            --zig-pin 0.16.0 --pairs 3 --out-dir "$RUNNER_TEMP/zig-rust-f3c-results"
          cat "$RUNNER_TEMP/zig-rust-f3c-results/STATUS"
          cat "$RUNNER_TEMP/zig-rust-f3c-results/summary.md"

      - name: Обов'язковий evidence gate T5/F3C — SHA, парні samples, status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          sha = os.environ["GITHUB_SHA"]
          cases = (
              ("T5", "zig-rust-t5-results",
               "TRANSPORT_PARITY_VERIFIED; TIMING_EXPLORATORY; SEMANTICS_NOT_TESTED", 240),
              ("F3C", "zig-rust-f3c-results",
               "F3C_TRANSPORT_PARITY_VERIFIED; TIMING_EXPLORATORY; SEMANTICS_NOT_TESTED", 120),
          )
          errors = []
          for name, dirname, expected, required_samples in cases:
              folder = root / dirname
              required = ("STATUS", "environment.json", "samples.jsonl", "summary.md")
              missing = [file for file in required if not (folder / file).is_file()
                         or not (folder / file).stat().st_size]
              if missing:
                  errors.append(f"{name} MISSING_EVIDENCE files={missing} at={folder}")
                  continue
              status = (folder / "STATUS").read_text().strip()
              if status != expected:
                  errors.append(f"{name} BAD_STATUS expected={expected!r} actual={status!r}")
              try:
                  meta = json.loads((folder / "environment.json").read_text())
                  found_sha = meta.get("git_sha")
                  if found_sha != sha:
                      errors.append(f"{name} WRONG_COMMIT expected={sha} actual={found_sha}")
                  versions = (meta.get("zig"), meta.get("zig_version"))
                  if "0.16.0" not in versions:
                      errors.append(f"{name} WRONG_ZIG_VERSION actual={versions}")
                  digests = meta.get("binary_sha256", {})
                  if sorted(digests) != ["rust", "zig"] or any(
                      len(value) != 64 for value in digests.values()
                  ):
                      errors.append(f"{name} MISSING_BINARY_SHA values={digests!r}")
                  rows = [json.loads(line) for line in
                          (folder / "samples.jsonl").read_text().splitlines()]
                  if len(rows) != required_samples:
                      errors.append(
                          f"{name} MISSING_SAMPLES expected={required_samples} actual={len(rows)}"
                      )
                  pairs = set(row.get("pair") for row in rows)
                  impls = set(row.get("impl") for row in rows)
                  if pairs != {0, 1, 2} or impls != {"zig", "rust"}:
                      errors.append(f"{name} BROKEN_PAIRING pairs={pairs} impls={impls}")
                  for row in rows:
                      if row.get("elapsed_ns", 0) <= 0 or row.get("reps", 0) <= 0:
                          errors.append(f"{name} INVALID_SAMPLE row={row!r}")
                          break
                  print(f"BENCH_EVIDENCE codec={name} commit={sha} samples={len(rows)} "
                        f"physical_parity={status.split(';')[0]} timings=EXPLORATORY")
              except (OSError, ValueError, TypeError, KeyError) as exc:
                  errors.append(f"{name} UNINFORMATIVE_OUTPUT exception={exc}")
          if errors:
              for error in errors:
                  print("::error::BENCH_REQUIRED " + error, flush=True)
              raise SystemExit(1)
          print("BENCH_REQUIRED_T5_F3C_PASS: both codecs mandatory; no speed threshold; SENS semantics NOT inferred")
          PY

      - name: Зберегти сирі Zig↔Rust T5/F3C виміри і SHA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zig-rust-codec-${{ github.sha }}
          path: |
            ${{ runner.temp }}/zig-rust-t5-results/
            ${{ runner.temp }}/zig-rust-f3c-results/
            ${{ runner.temp }}/sens-zig-purity.json
            ${{ runner.temp }}/e1-carrier-size.log
            ${{ runner.temp }}/e1-carrier-size.json
          if-no-files-found: error
          retention-days: 14

      - name: Червоний має говорити — валідність діагностики
        if: always()
        shell: bash
        env:
          BUDGET_OUTCOME: ${{ steps.budget.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          PACKED_OUTCOME: ${{ steps.packed.outcome }}
          SOURCE_OUTCOME: ${{ steps.source-census.outcome }}
          LAW_OUTCOME: ${{ steps.law.outcome }}
          MUTANT_OUTCOME: ${{ steps.mutant.outcome }}
          REASON_OUTCOME: ${{ steps.reason-selectors.outcome }}
          UNIFY_OUTCOME: ${{ steps.unify-observe-d1.outcome }}
          CORE2_OUTCOME: ${{ steps.core2.outcome }}
          CORE_WIDTH_OUTCOME: ${{ steps.core-width-law.outcome }}
          KNOWLEDGE_OUTCOME: ${{ steps.knowledge.outcome }}
          LINTER_OUTCOME: ${{ steps.linter-law.outcome }}
          LINTER_MUTANT_OUTCOME: ${{ steps.linter-mutant.outcome }}
          CORE_SENTINEL_OUTCOME: ${{ steps.core-sentinel.outcome }}
          CORE_SENTINEL_MUTANT_OUTCOME: ${{ steps.core-sentinel-mutant.outcome }}
          CORE1_OUTCOME: ${{ steps.core1-selectors.outcome }}
          QUOTED_OUTCOME: ${{ steps.quoted-d7.outcome }}
          TCP_OUTCOME: ${{ steps.tcp-migration.outcome }}
          META_FC_OUTCOME: ${{ steps.meta-fc-d1.outcome }}
          SID8_BROAD_OUTCOME: ${{ steps.sid8-broad-source.outcome }}
          T5_ORACLE_OUTCOME: ${{ steps.t5-oracle.outcome }}
          FRAME3_OUTCOME: ${{ steps.frame3-bcsw.outcome }}
          MIGRATOR_OUTCOME: ${{ steps.migrator-optimized.outcome }}
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/sens-focal-red.jsonl"
          # Власник 2026-10-14: обмеження UNINFORMATIVE-EXECUTOR знято —
          # мова ще не зріла вимагати нативної SENS-паритетності з Rust/Python.
          # Діагностика нижче лишається; нативні квитанції більше не вимагаються.
          diagnostic_rc=0
          if [[ "$BUDGET_OUTCOME" == success && "$BUILD_OUTCOME" == success && "$PACKED_OUTCOME" == success && "$SOURCE_OUTCOME" == success && "$LAW_OUTCOME" == success && "$MUTANT_OUTCOME" == success && "$REASON_OUTCOME" == success && "$UNIFY_OUTCOME" == success && "$CORE2_OUTCOME" == success && "$CORE_WIDTH_OUTCOME" == success && "$KNOWLEDGE_OUTCOME" == success && "$LINTER_OUTCOME" == success && "$LINTER_MUTANT_OUTCOME" == success && "$CORE_SENTINEL_OUTCOME" == success && "$CORE_SENTINEL_MUTANT_OUTCOME" == success && "$CORE1_OUTCOME" == success && "$QUOTED_OUTCOME" == success && "$MIGRATOR_OUTCOME" == success && "$TCP_OUTCOME" == success && "$META_FC_OUTCOME" == success && "$SID8_BROAD_OUTCOME" == success && "$T5_ORACLE_OUTCOME" == success && "$FRAME3_OUTCOME" == success ]]; then
            python3 scripts/ci_failure_contract.py scan --report-file "$report" --allow-empty || diagnostic_rc=$?
          else
            python3 scripts/ci_failure_contract.py scan --report-file "$report" || diagnostic_rc=$?
          fi
          if [[ "$diagnostic_rc" -ne 0 ]]; then
            echo "::error::UNINFORMATIVE-EXECUTOR or UNINFORMATIVE-OUTPUT; blocking CI"
            exit 1
          fi

      - name: Одноразовий запуск чинного мігратора для active lib (чистий checkout)
        if: ${{ always() && contains(github.event.head_commit.message, '[migration-apply-once]') }}
        shell: bash
        run: |
          # This is the *existing* migration driver, not a replacement or
          # additional semantic oracle. No hidden skip or silent PASS.
          set -uo pipefail
          out="$RUNNER_TEMP/sens-active-migration"
          mkdir -p "$out"
          git rev-parse HEAD > "$out/base-sha.txt"
          git status --porcelain=v1 > "$out/status-before.txt"
          echo "MIGRATION_COMMAND=bash scripts/migrate-active-lib-exact.sh --apply"
          echo "MIGRATION_SHA=$(git rev-parse HEAD)"
          timeout 480 bash scripts/migrate-active-lib-exact.sh --apply > "$out/driver.log" 2>&1
          rc=$?
          cat "$out/driver.log"
          git diff --binary > "$out/worktree.patch"
          git status --porcelain=v1 > "$out/status-after.txt"
          git diff --stat
          printf 'MIGRATION_EXIT=%s\nMIGRATION_PATCH_BYTES=%s\n' "$rc" "$(wc -c < "$out/worktree.patch")"
          exit "$rc"
      - name: Зберегти фактичні результати одноразового мігратора
        if: ${{ always() && contains(github.event.head_commit.message, '[migration-apply-once]') }}
        uses: actions/upload-artifact@v4
        with:
          name: sens-active-migration-${{ github.sha }}
          path: ${{ runner.temp }}/sens-active-migration/
          if-no-files-found: error
          retention-days: 7
