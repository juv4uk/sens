name: CI

# Owner freeze 2026-10-11: Core only. Original workflow is preserved at
# research/paused-actions/20261011/ci-pre-freeze.yml.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: Core-only source and domain contract
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Core crate compilation (no other kernels)
        run: cargo check --locked -p sens --lib
      - name: Exact-width Core semantic identity
        run: cargo test --locked -p sens --test domain_ladder --test domain_ast_value_identity --test domain_width_authority_test
      - name: Core source hygiene
        run: git diff --check
