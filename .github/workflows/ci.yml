        timeout-minutes: 4
        shell: bash
        run: CARGO_BUILD_JOBS=2 CARGO_INCREMENTAL=0 timeout 180s cargo test --locked -p sens --test probabilistic_decision_jev_like noul_policy_rejects_out_of_domain_threshold -- --exact --nocapture

      - name: "System One — Choice: відхилити поріг поза доменом"
        if: ${{ !cancelled() && steps.changed-t5m-lisp.outputs.system_one_tests == 'true' }}
        timeout-minutes: 4
        shell: bash
        run: CARGO_BUILD_JOBS=2 CARGO_INCREMENTAL=0 timeout 180s cargo test --locked -p sens --test probabilistic_decision_jev_like choice_policy_rejects_out_of_domain_threshold -- --exact --nocapture

      - name: "System One — Спільний стан: три типізовані питання"
        if: ${{ !cancelled() && steps.changed-t5m-lisp.outputs.system_one_tests == 'true' }}
        timeout-minutes: 4
        shell: bash
        run: CARGO_BUILD_JOBS=2 CARGO_INCREMENTAL=0 timeout 180s cargo test --locked -p sens --test probabilistic_decision_jev_like synthetic_witness_carries_one_state_through_three_typed_questions -- --exact --nocapture

      - name: "System One — Політика: accept, defer і provenance при нічиїй"
        if: ${{ !cancelled() && steps.changed-t5m-lisp.outputs.system_one_tests == 'true' }}
        timeout-minutes: 4
        shell: bash
        run: CARGO_BUILD_JOBS=2 CARGO_INCREMENTAL=0 timeout 180s cargo test --locked -p sens --test probabilistic_decision_jev_like automatic_choice_policy_selects_unique_winner_and_defers_unsafe_choices -- --exact --nocapture

      - name: "System One — Пакет: повна перевірка одного стану"
        if: ${{ !cancelled() && steps.changed-t5m-lisp.outputs.system_one_tests == 'true' }}
        timeout-minutes: 4
        shell: bash
        run: CARGO_BUILD_JOBS=2 CARGO_INCREMENTAL=0 timeout 180s cargo test --locked -p sens --test probabilistic_decision_jev_like system_one_validates_one_state_with_parallel_typed_questions_and_answers -- --exact --nocapture

      - name: "Контроль T5M CLI: позитивна й негативні фізичні межі"
        if: ${{ !cancelled() && (steps.changed-t5m-lisp.outputs.has_files == 'true' || steps.changed-t5m-lisp.outputs.t5m_cli_tests == 'true') }}
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p sens-cli --test cli t5m_file_mode_ -- --nocapture
          cargo test --locked -p sens-cli --test cli t5m_physical_pair_ -- --nocapture
          cargo test --locked -p sens-cli --test physical_bare_session_cli part_ii_exact_carrier_preserves_value_across_ukrainian_projection -- --exact --nocapture
          # Д1: спершу живий закон аксіом; чужий дрейф T5M не маскує діагностику.
          cargo test --locked -p sens --test d1_canonical_source_value executable_axioms_use_exact_d1_for_positive_and_invalid_knowledge -- --exact --nocapture
          cargo test --locked -p sens-cli --test physical_core4_sequence_cli ukrainian_d3_d4_existing_files_mint_verify_and_execute -- --exact --nocapture
          cargo test --locked -p sens-cli --test physical_core4_sequence_cli contest_uk_all_physical_programs_have_native_execution_and_peers -- --exact --nocapture
          cargo test --locked -p sens-cli --bin sens-trit exact_bit_view_maps_to_its_existing_sens_physical_companion -- --exact --nocapture
          cargo test --locked -p sens-cli --bin sens-trit t5m_view_inverse_preserves_d24_and_rejects_noncanonical_view -- --exact --nocapture
          # Цитоване ціле проходить ту саму D24+ проєкцію, Zig/T5M і обернення.
          cargo test --locked -p sens-cli --bin sens quoted_integer_in_t5m_source_preserves_exact_d24_word -- --nocapture
          cargo test --locked -p sens-cli --bin sens two_top_level_forms_have_exact_d2_separator_and_execute_after_zig_t5m -- --nocapture
          # Нуль відібраних тестів не є доказом: спершу перевірити точне ім'я.
          cargo test --locked -p sens-cli --bin sens -- --list |
            grep -Fqx 'repl::tests::native_sens_mint_and_pair_execute_without_python_or_json_oracle: test'
          cargo test --locked -p sens-cli --bin sens repl::tests::native_sens_mint_and_pair_execute_without_python_or_json_oracle -- --exact --nocapture
          # Перевірка реального SENS/Zig ремонту фізичної пари без Python/JSON.
          bash -n scripts/refresh-verified-t5m-pair.sh
          cargo build --locked -p sens-cli --bin sens --bin sens-trit
          repair_dir="$(mktemp -d)"
          trap 'rm -rf "$repair_dir"' EXIT
          source="$repair_dir/current.lisp"
          printf '(атом? (як-є ()))\n' > "$source"
          bash scripts/refresh-verified-t5m-pair.sh "$source" "$PWD/target/debug/sens" "$PWD/target/debug/sens-trit"
          initial_sha="$(sha256sum "$repair_dir/current.sens" | cut -d' ' -f1)"
          printf '(атом? (як-є (())))\n' > "$source"
          bash scripts/refresh-verified-t5m-pair.sh "$source" "$PWD/target/debug/sens" "$PWD/target/debug/sens-trit"
          repaired_sha="$(sha256sum "$repair_dir/current.sens" | cut -d' ' -f1)"
          test "$initial_sha" != "$repaired_sha"
          "$PWD/target/debug/sens-trit" view "$repair_dir/current.sens" > "$repair_dir/readback"
          cmp "$repair_dir/readback" "$repair_dir/current"
          printf '(невідома-функція ())\n' > "$source"
          if bash scripts/refresh-verified-t5m-pair.sh "$source" "$PWD/target/debug/sens" "$PWD/target/debug/sens-trit"; then
            echo "::error::T5M_REPAIR_BAD_SOURCE_ACCEPTED" >&2
            exit 1
          fi
          test "$(sha256sum "$repair_dir/current.sens" | cut -d' ' -f1)" = "$repaired_sha"
          cmp "$repair_dir/readback" "$repair_dir/current"
          # Фізичний publisher перевіряється реальним SENS/Zig, без Python/JSON.
          bash -n scripts/refresh-executed-t5m-pair.sh
          executed_source="tests/fixtures/.native-t5m-executed-$"
          trap 'rm -rf "$repair_dir"; rm -f "${executed_source}.lisp" "${executed_source}.sens" "$executed_source"' EXIT
          printf '(атом? (як-є ()))\n' > "${executed_source}.lisp"
          bash scripts/refresh-executed-t5m-pair.sh "${executed_source}.lisp" "$PWD/target/debug/sens"
          test -s "${executed_source}.sens"
          test -s "$executed_source"
          "$PWD/target/debug/sens-trit" verify-view "${executed_source}.sens"
          executed_sha="$(sha256sum "${executed_source}.sens" | cut -d' ' -f1)"
          printf '(невідома-функція ())\n' > "${executed_source}.lisp"
          if bash scripts/refresh-executed-t5m-pair.sh "${executed_source}.lisp" "$PWD/target/debug/sens"; then
            echo "::error::T5M_EXECUTED_REFRESH_BAD_SOURCE_ACCEPTED" >&2
            exit 1
          fi
          test "$(sha256sum "${executed_source}.sens" | cut -d' ' -f1)" = "$executed_sha"
          echo "T5M_EXECUTED_REFRESH_LIVE_SENS PASS: native mint, paired execution, Zig inverse, negative no-clobber"
          echo "T5M_REPAIR_LIVE_SENS PASS: native mint, pair, replacement, inverse view, negative"

      - name: "UTF-8 — справжнє SENS D1 виконання після зміни Lisp"
        if: ${{ !cancelled() && steps.changed-t5m-lisp.outputs.utf8_runtime_tests == 'true' }}
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p sens --test utf8 utf8_d1_predicates_run_in_sens_without_unbound_truth_symbols -- --exact --nocapture
          cargo test --locked -p sens --test utf8 utf8_integer_quotient_and_remainder_execute_in_sens_with_d1_branch -- --exact --nocapture
          cargo test --locked -p sens --test utf8 utf8_direct_d1_self_verdict_and_one_bit_mutant -- --exact --nocapture

      - name: "Непарний Lisp-бенчмарк — Zig/T5M → справжній SENS"
        if: ${{ !cancelled() && steps.changed-t5m-lisp.outputs.closure_runtime_tests == 'true' }}
        timeout-minutes: 6
        shell: bash
        run: cargo test --locked -p sens-cli --test closures_benchmark_cli -- --nocapture

      - name: "Українські D9 селектори й негативні мутації"
        if: ${{ !cancelled() && steps.changed-t5m-lisp.outputs.translation_tests == 'true' }}
        timeout-minutes: 4
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest tests.test_code_runs.TranslationSelectorsUkrProjectionTests -v
          CARGO_BUILD_JOBS=2 CARGO_INCREMENTAL=0 timeout 180s cargo test --locked -p sens --test d9_binary_surface_native -- --nocapture

      - name: "SENS D2 — незалежний Zig/T5M roundtrip фізичної пари"
        if: ${{ !cancelled() && steps.changed-t5m-lisp.outputs.codec_d2_tests == 'true' }}
        timeout-minutes: 8
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest tests.test_code_runs.CodecUkrProjectionTests -v
          CARGO_BUILD_JOBS=2 CARGO_INCREMENTAL=0 timeout 180s cargo test --locked -p sens --test codec_in_sens -- --nocapture
          CARGO_BUILD_JOBS=2 CARGO_INCREMENTAL=0 timeout 180s cargo test --locked -p sens --lib д2_фізичний_і_канонічний_читачі_збігаються_для_всіх_чотирьох_маркерів -- --nocapture
          CARGO_BUILD_JOBS=2 CARGO_INCREMENTAL=0 timeout 180s cargo run --locked -p sens-cli --bin sens -- --t5m-pair lib/codec-d2.lisp lib/codec-d2.sens

      - name: "SENS runtime перекладу: позитивні й негативні свідки"
        if: ${{ !cancelled() && steps.changed-t5m-lisp.outputs.translation_tests == 'true' }}
        timeout-minutes: 12
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p sens --test translation_boundary -- --nocapture

      - name: CML export — реальна відповідність джерела генератору
        if: ${{ !cancelled() && steps.changed-t5m-lisp.outputs.cml_export_tests == 'true' }}
        timeout-minutes: 4
        shell: bash
        run: |
          set -euo pipefail
          timeout 180s cargo test --locked -p sens-cli --bin cml-export committed_artifact_matches_producer_output -- --nocapture

      - name: Виконати змінені Lisp через поточний Zig T5M і справжній SENS
        id: t5m_changed_execute
        if: ${{ !cancelled() && steps.changed-t5m-lisp.outputs.has_files == 'true' }}
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked -p sens-cli --bin sens --bin sens-trit --features benchmark-ast-visits
          binary="$PWD/target/debug/sens"
          # SENS reader -> Zig T5M -> фізичний SENS reader -> SENS eval.
          # Для виконання мови Python/JSON не потрібні; історичний
          # Python-мігратор тестується окремо лише як допоміжний інструмент.
          SENS_NATIVE_T5M=1 SENS_T5M_OPEN="$PWD/target/debug/sens-trit" \
            bash scripts/execute_changed_lisp_t5m.sh \
              "$binary" "$RUNNER_TEMP/changed-t5m-lisp.txt" \
              "$RUNNER_TEMP/changed-t5m-pairs"

      # Кожний push виконуваного .lisp: фізичну пару щойно створив справжній
      # SENS reader → Zig/T5M. Рахуємо вузли AST та відвідування саме SENS.
      # Це НЕ розмір лише вже закомічених .sens, і НЕ Python/JSON-оракул.
      - name: "BENCH-LISP→SENS — AST-проходи і розмір змінених програм"
        if: ${{ !cancelled() && github.event_name == 'push' && steps.changed-t5m-lisp.outputs.has_files == 'true' }}
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          sources="$RUNNER_TEMP/changed-t5m-lisp.txt"
          staged="$RUNNER_TEMP/changed-t5m-pairs"
          report="$RUNNER_TEMP/lisp-ast-size"
          mkdir -p "$report"
          test -s "$sources"
          # benchmark-ast-visits: реальний лічильник evaluator-dispatch,
          # відсутній у звичайному SENS. Інші мови не визначають результат.
          CARGO_BUILD_JOBS=2 CARGO_INCREMENTAL=0 cargo build --locked \
            -p sens-cli --bin sens --bin sens-trit --features benchmark-ast-visits
          sens="$PWD/target/debug/sens"
          trit="$PWD/target/debug/sens-trit"
          printf 'source\tsource_bytes\tt5m_bytes\tast_nodes\teval_visits\tresult\n' > "$report/measurements.tsv"
          {
            echo '## Змінені Lisp → фізичний SENS: AST і розмір'
            echo
            printf 'SHA: %s. Тільки реально створені Zig/T5M програми, які SENS виконав автономно та в парі.\n\n' "$GITHUB_SHA"
            echo '| Українське Lisp-джерело | Lisp, байт | SENS T5M, байт | Вузли AST | Відвідування evaluator | Результат |'
            echo '|---|---:|---:|---:|---:|---|'
          } > "$report/report.md"
          total=0
          measured=0
          skipped=0
          while IFS= read -r source || [[ -n "$source" ]]; do
            [[ -n "$source" ]] || continue
            total=$((total + 1))
            id="$(printf '%s' "$source" | sha256sum | cut -c1-16)"
            dir="$staged/$id"
            physical="$dir/$(basename "$source" .lisp).sens"
            if [[ ! -f "$source" || -L "$source" || ! -s "$physical" || -L "$physical" ||
                  ! -s "$dir/native-paired.stdout" || ! -s "$dir/native-standalone.stdout" ]] ||
               ! cmp -s "$dir/native-paired.stdout" "$dir/native-standalone.stdout"; then
              echo "SENS_LISP_AST_SIZE_SKIP source=$source reason=no-verified-standalone-pair"
              skipped=$((skipped + 1))
              continue
            fi
            # Вміст джерела та носія вже парно виконано попереднім кроком.
            # Повторне verify-view захищає власне вимірювання від зіпсованих байтів.
            if ! timeout 45s "$trit" verify-view "$physical" >"$dir/size-verify.stdout" 2>"$dir/size-verify.stderr"; then
              echo "SENS_LISP_AST_SIZE_SKIP source=$source reason=physical-inverse-rejected"
              skipped=$((skipped + 1))
              continue
            fi
            if ! timeout 90s "$sens" --benchmark-physical "$physical" \
                 >"$dir/size-bench.stdout" 2>"$dir/size-bench.stderr"; then
              echo "SENS_LISP_AST_SIZE_SKIP source=$source reason=physical-benchmark-rejected"
              skipped=$((skipped + 1))
              continue
            fi
            entry="$(grep '^SENS_BINARY_BENCH ' "$dir/size-bench.stderr" || true)"
            if [[ "$entry" =~ ^SENS_BINARY_BENCH[[:space:]]AST_NODES=([0-9]+)[[:space:]]EVAL_VISITS=([0-9]+)[[:space:]]RESULT=(.+)$ ]]; then
              nodes="${BASH_REMATCH[1]}"
              visits="${BASH_REMATCH[2]}"
              result="${BASH_REMATCH[3]}"
            else
              echo "SENS_LISP_AST_SIZE_SKIP source=$source reason=missing-or-invalid-native-metrics"
              skipped=$((skipped + 1))
              continue
            fi
            if [[ "$result" != "$(tail -n 1 "$dir/size-bench.stdout")" ]] ||
               ! cmp -s "$dir/native-standalone.stdout" "$dir/size-bench.stdout"; then
              echo "SENS_LISP_AST_SIZE_SKIP source=$source reason=measured-result-drift"
              skipped=$((skipped + 1))
              continue
            fi
            source_bytes="$(wc -c < "$source" | tr -d '[:space:]')"
            t5m_bytes="$(wc -c < "$physical" | tr -d '[:space:]')"
            printf '%s\t%s\t%s\t%s\t%s\t%s\n' \
              "$source" "$source_bytes" "$t5m_bytes" "$nodes" "$visits" "$result" >> "$report/measurements.tsv"
            printf '| `%s` | %s | %s | %s | %s | `%s` |\n' \
              "$source" "$source_bytes" "$t5m_bytes" "$nodes" "$visits" "$result" >> "$report/report.md"
            echo "SENS_LISP_AST_SIZE source=$source lisp_bytes=$source_bytes t5m_bytes=$t5m_bytes ast_nodes=$nodes eval_visits=$visits result=$result"
            measured=$((measured + 1))
          done < "$sources"
          {
            echo
            echo "Виміряно: **$measured / $total**. Невиміряно: **$skipped** (без видуманих AST або PASS)."
            echo
            echo 'Це лічильники структури та виконання конкретних фізичних програм, не таймінг і не загальний релізний допуск.'
          } >> "$report/report.md"
          cat "$report/report.md" >> "$GITHUB_STEP_SUMMARY"
          echo "SENS_LISP_AST_SIZE_TOTAL changed=$total measured=$measured unmeasured=$skipped native=SENS/Zig/T5M"
          if (( measured == 0 )); then
            echo "::warning::SENS_LISP_AST_SIZE_NO_MEASURED_PROGRAMS changed=$total reason=no-eligible-standalone-physical-pair"
          fi

      - name: "BENCH-LISP→SENS — зберегти розмір і лічильники AST"
        if: ${{ always() && github.event_name == 'push' && steps.changed-t5m-lisp.outputs.has_files == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 pinned
        with:
          name: sens-lisp-ast-size-${{ github.sha }}
          path: ${{ runner.temp }}/lisp-ast-size/
          if-no-files-found: warn
          retention-days: 14

      - name: Бенчмарк змінених фізичних програм SENS
        if: ${{ !cancelled() && steps.changed-t5m-lisp.outputs.has_binary_files == 'true' && steps.t5m_changed_execute.outcome == 'success' }}
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          CARGO_BUILD_JOBS=2 CARGO_INCREMENTAL=0 timeout 180s cargo test --locked -p sens --lib --features benchmark-ast-visits binary_program_reports_actual_evaluator_dispatches
          CARGO_BUILD_JOBS=2 CARGO_INCREMENTAL=0 timeout 180s cargo test --locked -p sens-cli --bin sens --features benchmark-ast-visits physical_binary_metrics_come_from_the_sens_evaluator
          python3 -m unittest benchmarks/sens-program-size/test_run.py -v
          benchmark_binaries="$RUNNER_TEMP/changed-t5m-pairs/benchmark-binaries.txt"
          if [[ ! -s "$benchmark_binaries" ]]; then
            echo "::notice::SENS_BINARY_BENCHMARK_SKIPPED reason=no-changed-committed-binary-passed-standalone-execution"
            exit 0
          fi
          python3 benchmarks/sens-program-size/run.py --binary-list "$benchmark_binaries"

      # Фізичні байти від справжнього SENS/Zig зберігаємо як при RED,
      # так і при позитивному виконанні: без GREEN-артефакту не можна
      # інтегрувати перевірену .sens-пару і збільшувати виконуваний корпус.
      # Парний PASS не видаємо за standalone/release admission.
      - name: "T5M — фізичні пари після справжнього виконання SENS"
        if: ${{ always() && steps.changed-t5m-lisp.outputs.has_files == 'true' && (steps.t5m_changed_execute.outcome == 'success' || steps.t5m_changed_execute.outcome == 'failure') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4, pinned
        with:
          name: sens-t5m-refresh-${{ github.sha }}
          path: ${{ runner.temp }}/changed-t5m-pairs/
          if-no-files-found: ignore
          retention-days: 1

      # Заміряємо один і той самий фізичний код і його AST, а не тритний транспорт.
      # Нативний SENS до таймінгу доводить еквівалентність AST, прямого D2 і lowered.
      - name: "BENCH-AST — оптимізація D2 AST та виконання SENS (p50/p95)"
        if: ${{ !cancelled() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/sens-ast-optimization"
          mkdir -p "$dir"
          CARGO_BUILD_JOBS=2 CARGO_INCREMENTAL=0 cargo build --locked --release -p sens --example physical_sens_hot_bench
          probe="$PWD/target/release/examples/physical_sens_hot_bench"
          for forms in 1 16 128 1024; do
            "$probe" --generate "$forms" 65536 11 > "$dir/forms-$forms.tsv"
          done
          {
            echo '## SENS: AST і оптимізація реального виконання'
            echo
            printf 'SHA: `%s`\n\n' "$GITHUB_SHA"
            printf 'CPU: %s\n\n' "$(grep -m1 'model name' /proc/cpuinfo || true)"
            echo 'Реальні нативні виміри p50/p95, 11 серій після прогріву; однаковий фізичний код і спостережуваний результат SENS до таймінгу.'
            echo
            echo '**Порівнювані фази:** побудова D2 AST через текст і прямі типовані слова; виконання із lowering та вже зниженого AST. Друге порівняння показує ціну lowering, а не самостійну перевагу мови.'
            echo
          } > "$dir/report.md"
          awk -F '\t' '
            BEGIN { n = split("1 16 128 1024", sizes, " ") }
            $1 == "HOT_BENCH" {
              delete v
              for (i = 2; i <= NF; i++) { split($i, pair, "="); v[pair[1]] = pair[2] }
              key = v["forms"] ":" v["phase"]
              p50[key] = v["median_ns_op"] + 0
              p95[key] = v["p95_ns_op"] + 0
              seen[key]++
              if (v["samples"] != 11 || v["iterations"] < 4 || v["observable"] == "") bad = 1
            }
            END {
              if (bad) { print "SENS_AST_BENCH_BAD_SAMPLE" > "/dev/stderr"; exit 1 }
              print "| Форми | Текст→AST p50/p95, нс | Слова→AST p50/p95, нс | Text/direct | AST+lowering p50/p95, нс | Lowered p50/p95, нс | Ефект lowering | D24+ add p50/p95, нс |"
              print "|---:|---:|---:|---:|---:|---:|---:|---:|"
              for (i = 1; i <= n; i++) {
                f = sizes[i]
                a = f ":t5_visible_parse_d2"
                b = f ":t5_words_d2"
                c = f ":eval_from_ast"
                d = f ":eval_lowered"
                e = f ":eval_d24_plus"
                if (seen[a] != 1 || seen[b] != 1 || seen[c] != 1 || seen[d] != 1 || seen[e] != 1 || p50[b] < 1 || p50[d] < 1 || p50[e] < 1) {
                  print "SENS_AST_BENCH_MISSING_OR_DUPLICATE form=" f > "/dev/stderr"
                  exit 1
                }
                printf "| %d | %.0f / %.0f | %.0f / %.0f | %.3fx | %.0f / %.0f | %.0f / %.0f | %.3fx | %.0f / %.0f |\n", f, p50[a], p95[a], p50[b], p95[b], p50[a] / p50[b], p50[c], p95[c], p50[d], p95[d], p50[c] / p50[d], p50[e], p95[e]
              }
            }
          ' "$dir"/forms-*.tsv >> "$dir/report.md"
          cat "$dir/report.md" >> "$GITHUB_STEP_SUMMARY"
          echo "SENS_AST_OPT_BENCH_PASS sha=$GITHUB_SHA samples=11 sizes=1,16,128,1024 runtime=native-SENS"

      - name: "BENCH-AST — сирі серії та порівняння оптимізації"
        if: ${{ always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 pinned
        with:
          name: sens-ast-optimization-${{ github.sha }}
          path: ${{ runner.temp }}/sens-ast-optimization/
          if-no-files-found: warn
          retention-days: 14
      # Окремий адресний T5M транспортний вимір, не загальний бенчмарк мови.
      - name: "BENCH-T5M — Zig, x86-64 ASM, Rust"
        if: ${{ github.event_name == 'push' && startsWith(github.event.head_commit.message, 'BENCH-T5M:') }}
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/t5m-bench"
          mkdir -p "$dir"
          cd research/asm-t5m
          as --64 -o "$dir/t5m_pack.o" t5m_pack.S
          zig build-obj t5m_ref.zig -O ReleaseFast -femit-bin="$dir/t5m_ref.o"
          rustc -O --edition 2021 --crate-type lib --emit obj -C panic=abort -o "$dir/rust_t5m_ref.o" t5m_ref.rs
          zig cc -O2 -DHAVE_RUST bench.c "$dir/t5m_pack.o" "$dir/t5m_ref.o" "$dir/rust_t5m_ref.o" -o "$dir/bench"
          "$dir/bench" | tee "$dir/results.txt"
          # Старий bench друкує збіг, але сам не повертає FAIL.
          grep -Fq "pack збіг: asm/zig=1 asm/c=1" "$dir/results.txt"
          grep -Fq "pack збіг: asm/rust=1" "$dir/results.txt"
          grep -Fq "unpack==трити: asm=1 zig=1 c=1 rust=1" "$dir/results.txt"
          {
            echo "## T5M: Zig, ASM, Rust (+ C контроль)"
            echo "SHA: $GITHUB_SHA"
            echo "CPU: $(grep -m1 model /proc/cpuinfo)"
            echo "Zig: $(zig version); Rust: $(rustc --version)"
            echo "1 000 000 тритів, 200 повторень; pack/unpack"
            echo "Лише транспорт, не семантика SENS."
            echo '~~~text'
            cat "$dir/results.txt"
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: "BENCH-T5M — зберегти звіт"
        if: ${{ always() && github.event_name == 'push' && startsWith(github.event.head_commit.message, 'BENCH-T5M:') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 pinned
        with:
          name: t5m-zig-asm-rust-${{ github.sha }}
          path: ${{ runner.temp }}/t5m-bench/results.txt
          if-no-files-found: warn
          retention-days: 14

      # Одноразове виконання тільки на конкретному MIGRATE-SID8-UKR push.
      # Жодних комітів/пушів із раннера — лише звіт та patch artifact.
      - name: "ONE-SHOT — SID8/Sens8 до укр із історичним Git SHA"
        if: ${{ github.event_name == 'push' && startsWith(github.event.head_commit.message, 'MIGRATE-SID8-UKR:') }}
        shell: bash
        timeout-minutes: 7
        run: |
          set -euo pipefail
          historical_sha=4abb15f2cec953a74f63bd9ca8ea59b1b9bb1bb1
          output="$RUNNER_TEMP/sid8-ukr-migration"
          mkdir -p "$output"
          timeout 90s git fetch --no-tags --depth=1 origin "$historical_sha"
          # Фізично вилучений SID8 ledger потрібен лише для Git provenance
          # мігратора, не для будь-якого runtime, parser або executor.
          timeout 90s git fetch --no-tags --depth=1 origin 364c20e89429962928ea39027651f2bb47875aa0
          set +e
          python3 scripts/migrate-legacy-w8-ukr.py lib/ \
            --source-ref "$historical_sha" --write --report "$output/report.json"
          migration_rc=$?
          set -e
          git diff --binary -- lib/ > "$output/source.patch"
          git diff --stat -- lib/ > "$output/changes.txt"
          cat "$output/changes.txt"
          if [[ ! -s "$output/report.json" ]]; then
            echo "::error::SID8_UKR_NO_REPORT rc=$migration_rc"
            exit 1
          fi
          python3 - "$output/report.json" "$migration_rc" <<'PY'
          import collections
          import json
          import os
          from pathlib import Path
          import sys
          rows = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          rc = int(sys.argv[2])
          states = collections.Counter(row.get("status", "missing") for row in rows)
          replaced = sum(len(row.get("replacements", [])) for row in rows)
          unknown = sum(len(row.get("unresolved", [])) for row in rows)
          changed = sum(bool(row.get("written")) for row in rows)
          print(f"SID8_UKR_MIGRATION head={os.getenv('GITHUB_SHA')} rc={rc} "
                f"files={len(rows)} changed_files={changed} replacements={replaced} "
                f"unresolved={unknown} errors={states['error']} "
                f"nonexecutable={states['skipped-nonexecutable']}")
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as summary:
              summary.write("## SID8/Sens8 → укр: реальна міграція lib/\n\n")
              summary.write(f"- SHA: {os.environ['GITHUB_SHA']}\n")
              summary.write(f"- Файлів: {len(rows)}; змінено: {changed}; замін: {replaced}\n")
              summary.write(f"- Невідомих: {unknown}; помилок: {states['error']}\n")
              summary.write("- Результат: артефакт diff+JSON, без автоматичного push.\n")
          if states["error"] or rc not in (0, 2):
              for row in rows:
                  if row.get("status") == "error":
                      print(f"::error file={row['file']}::{row.get('reason', 'unknown')}")
              sys.exit(1)
          if unknown:
              print(f"::warning::SID8_UKR_PARTIAL unresolved={unknown}")
          PY

      - name: "ONE-SHOT — зберегти звіт та патч SID8/Sens8"
        if: ${{ always() && github.event_name == 'push' && startsWith(github.event.head_commit.message, 'MIGRATE-SID8-UKR:') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 pinned
        with:
          name: sens-sid8-ukr-${{ github.sha }}
          path: ${{ runner.temp }}/sid8-ukr-migration/
          if-no-files-found: warn
          retention-days: 7


      - name: Локальний Windows-шлях до пінованого Zig — без послаблення версії
        if: ${{ always() }}
        run: python3 -m unittest tests/test_pinned_zig_windows_setup.py -v

      - name: Заборона закодованих літералів у Lisp
        shell: bash
        env:
          PUSH_BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          python3 -m unittest tests/test_no_encoded_source_literals.py -v
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base_sha="$PR_BASE"
          else
            base_sha="$PUSH_BEFORE"
          fi
          if [[ -z "$base_sha" || "$base_sha" =~ ^0+$ ]]; then
            # A shallow checkout (depth 1) has no HEAD^; deepen just enough.
            git fetch --no-tags --deepen=2 origin >/dev/null 2>&1 || true
            base_sha="$(git rev-parse HEAD^)"
          fi
          timeout 30s git fetch --no-tags --depth=1 origin "$base_sha"
          python3 scripts/check_no_encoded_source_literals.py --base "$base_sha"

      - name: Клавіатурні символи у проєкціях ук, укр і sym (D1–D11)
        if: ${{ always() }} # самостійна перевірка, навіть коли попередній guard червоний
        run: python3 -m unittest tests/test_ukrainian_domain_projection_rules.py -v
