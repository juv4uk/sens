name: D5 ZEROP NUMBERP runtime

on:
  pull_request:
    paths:
      - "crates/sens/src/eval/d5_predicates.rs"
      - "crates/sens/src/eval/mod.rs"
      - "crates/sens/src/eval/canon.rs"
      - "crates/sens/tests/d5_zerop_numberp_runtime.rs"
      - ".github/workflows/d5-zerop-numberp.yml"
  workflow_dispatch:

jobs:
  predicates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p sens d5_predicates -- --nocapture
      - run: cargo test -p sens --test d5_zerop_numberp_runtime -- --nocapture
      - run: cargo test -p sens --test d5_arithmetic_sibling_law
