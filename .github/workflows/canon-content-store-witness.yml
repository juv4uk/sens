name: Canon and content-store exact D1 witnesses
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: canon-content-store-witness-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  canon-and-content-store:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CARGO_BUILD_JOBS: "1"
      RUST_TEST_THREADS: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Execute current exact D3 COND and D1 PredicateBit contract
        run: cargo test -p sens --test d3_empty_control -- --nocapture
      - name: Execute content-store Lisp-owned witness and mechanisms
        run: cargo test -p sens --test content_store_authority -- --nocapture
