name: Current D1 D3 and content-store witnesses
on:
  pull_request:
    paths:
      - "tests/fixtures/witness-runner.lisp"
      - "tests/fixtures/content-store-authority-witness.lisp"
      - ".github/workflows/canon-content-store-witness.yml"
      - "crates/sens/tests/d3_empty_control.rs"
      - "crates/sens/tests/content_store_authority.rs"
  push:
    branches: [main]
    paths:
      - "tests/fixtures/witness-runner.lisp"
      - "tests/fixtures/content-store-authority-witness.lisp"
      - ".github/workflows/canon-content-store-witness.yml"
      - "crates/sens/tests/d3_empty_control.rs"
      - "crates/sens/tests/content_store_authority.rs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: canon-content-store-witness-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  canon-and-content-store:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CARGO_BUILD_JOBS: "1"
      RUST_TEST_THREADS: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Execute current exact D1 D3 predicate and COND controls
        run: cargo test -p sens --test d3_empty_control -- --nocapture
      - name: Execute content-store mechanisms
        run: cargo test -p sens --test content_store_authority -- --nocapture
