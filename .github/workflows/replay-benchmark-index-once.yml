name: Replay benchmark index repair on hosted Ubuntu

on:
  push:
    branches:
      - replay/research-crosswidth-w6w8-current-20261009
    paths:
      - .github/workflows/replay-benchmark-index-once.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: replay-benchmark-index-${{ github.ref }}
  cancel-in-progress: false

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: replay/research-crosswidth-w6w8-current-20261009
          persist-credentials: true
      - name: Generate benchmark registry index from source manifests
        run: |
          python3 scripts/benchmark_registry.py
          python3 scripts/benchmark_registry.py --check
      - name: Commit exact generated index to repair branch only
        shell: bash
        run: |
          set -euo pipefail
          git add benchmarks/README.md
          if git diff --cached --quiet; then
            echo "Registry already matches manifests"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs(bench): regenerate discovery index for W6/W8 donor'
          git push origin HEAD:refs/heads/replay/research-crosswidth-w6w8-current-20261009
