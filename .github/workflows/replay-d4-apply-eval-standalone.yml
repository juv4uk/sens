name: Replay D4 APPLY EVAL standalone proof

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Reproduce historical independent oracle
        run: cargo test -p sens --test d4_eval_apply_probe -- --nocapture
