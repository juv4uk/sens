name: D4 current authority

on:
  pull_request:
    paths:
      - "knowledge/d4-cleanroom.json"
      - "contracts/d4-bootstrap-ratification.lisp"
      - "language-contract.lisp"
      - "CURRENT.md"
      - "docs/language-core.md"
      - "scripts/check-d4-cleanroom.py"
      - ".github/workflows/d4-cleanroom.yml"
  push:
    branches: [main]
    paths:
      - "knowledge/d4-cleanroom.json"
      - "contracts/d4-bootstrap-ratification.lisp"
      - "language-contract.lisp"
      - "CURRENT.md"
      - "docs/language-core.md"
      - "scripts/check-d4-cleanroom.py"

jobs:
  authority:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 scripts/check-d4-cleanroom.py
