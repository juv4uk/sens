name: D4 cleanroom guard

on:
  pull_request:
    paths:
      - "knowledge/d4-cleanroom.json"
      - "scripts/check-d4-cleanroom.py"
      - "benchmarks/d4-prefix-lift/**"
      - ".github/workflows/d4-cleanroom.yml"
  push:
    branches: [main]
    paths:
      - "knowledge/d4-cleanroom.json"
      - "scripts/check-d4-cleanroom.py"

jobs:
  cleanroom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 scripts/check-d4-cleanroom.py
