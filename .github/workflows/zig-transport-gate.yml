name: Zig transport gate

# Mechanical only: purity + pin + sterile corridor + optional codec bridge.
on:
  workflow_dispatch:

concurrency:
  group: zig-transport-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migration-zig-gate:
    name: pin · purity · sterile corridor · T5
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/actions/install-zig
      - name: Unit tests (no semantic admission)
        run: |
          python3 -m unittest tests.test_migration_zig_gate -v
          python3 -m unittest tests.test_t5_physical_python_parity -v
          python3 scripts/check_sterile_zig_corridor.py
          python3 -m unittest tests.test_sterile_zig_corridor -v
          python3 scripts/check_rust_sens_zig_corridor.py .
          python3 -m unittest tests.test_check_rust_sens_zig_corridor -v
      - name: Zig ABI v2 transport_abi unit tests (T5/F3C/E1 physical)
        run: |
          set -euo pipefail
          zig version
          # Physical corridor only: encode/decode BE3, alias rejection, E1 roundtrip.
          # No SENS semantic admission in this step.
          zig test research/zig-codecs/transport_abi.zig
      - name: Migration ↔ Zig preparation gate (require pinned Zig)
        run: |
          set -euo pipefail
          python3 scripts/migration-zig-gate.py --require-zig
