name: Zig transport gate

# Mechanical only: purity + pin + sterile corridor + optional codec bridge.
on:
  # Єдиний автоматичний workflow — ci.yml. Zig gate тільки ручний.
  workflow_dispatch:

concurrency:
  group: zig-transport-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  migration-zig-gate:
    name: pin · purity · sterile corridor · T5
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/actions/install-zig
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          toolchain: "1.99.0"
      - name: Unit tests (no semantic admission)
        run: |
          python3 -m unittest tests.test_migration_zig_gate -v
          cargo test --locked -p sens-cli --bin sens-trit sterile_f3c_corridor -- --nocapture
          python3 scripts/check_rust_sens_zig_corridor.py .
          python3 -m unittest tests.test_check_rust_sens_zig_corridor -v
          python3 scripts/check_corridor_axiom_binding.py .
          python3 -m unittest tests.test_check_corridor_axiom_binding -v
      - name: Zig ABI v2 transport_abi unit tests (T5/F3C/E1 physical)
        run: |
          set -euo pipefail
          zig version
          # Physical corridor only: encode/decode BE3, alias rejection, E1 roundtrip.
          # No SENS semantic admission in this step.
          zig test research/zig-codecs/transport_abi.zig
      - name: Migration ↔ Zig preparation gate (require pinned Zig)
        run: |
          set -euo pipefail
          python3 scripts/migration-zig-gate.py --require-zig \
            --report "$RUNNER_TEMP/sens-migration-zig-gate.json"
          python3 - <<'PY'
          import json, os, pathlib
          path = pathlib.Path(os.environ["RUNNER_TEMP"]) / "sens-migration-zig-gate.json"
          data = json.loads(path.read_text(encoding="utf-8"))
          assert data["schema"] == "sens-migration-zig-gate/v1"
          assert data["verdict"] == "PASS"
          assert data["transport_verified"] is True
          assert data["scope"] == "FULL_PHYSICAL_ZIG"
          assert [s["step"] for s in data["steps"]] == [
              "zig-pin",
              "ci_zig_purity",
              "check_sterile_zig_corridor",
              "check_rust_sens_zig_corridor",
              "check_rust_sens_corridor_coverage",
              "check_corridor_axiom_binding",
              "check-domain-ladder-identity",
              "migrate-exact-domain-authority",
              "test_zig_codec_bridge",
          ]
          assert data["zig_pin"] == "0.16.0"
          print("MIGRATION_ZIG_GATE_CI_PASS")
          PY
