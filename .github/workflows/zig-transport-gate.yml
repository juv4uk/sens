name: Zig transport gate

# Ручний фізичний коридор: поведінкові тести Rust і фізичні тести Zig.
on:
  workflow_dispatch:

concurrency:
  group: zig-transport-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  migration-zig-gate:
    name: Zig pin · T5M/F3C поведінка · фізичний ABI
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/actions/install-zig
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          toolchain: "1.99.0"

      - name: Перевірити закріплену версію Zig
        shell: bash
        run: |
          set -euo pipefail
          expected="$(tr -d '\r\n' < .zig-version)"
          actual="$(zig version)"
          test "$actual" = "$expected"
          printf 'Версію Zig підтверджено: %s\n' "$actual"

      - name: F3C — справжній обернений перехід через Zig
        run: cargo test --locked -p sens-cli --bin sens-trit explicit_f3_codec_roundtrip_is_zig_owned -- --nocapture

      - name: F3C — без Zig виконання мусить відмовити
        run: cargo test --locked --no-default-features -p sens-cli --bin sens-trit f3c_physical_ingress_and_egress_require_zig_even_for_valid_bytes -- --nocapture

      - name: T5M — фізичний обернений перехід через Zig
        run: cargo test --locked -p sens-cli --test binary_t5m_zig_roundtrip -- --nocapture

      - name: Тести фізичного ABI Zig v2 — T5M/F3C/E1
        shell: bash
        run: |
          set -euo pipefail
          zig test research/zig-codecs/transport_abi.zig -O ReleaseSafe -lc
