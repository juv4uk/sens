name: Zig transport gate

# Mechanical only: purity + pin + sterile corridor + optional codec bridge.
on:
  workflow_dispatch:
  push:
    paths:
      - "research/zig-codecs/**"
      - "scripts/ci_zig_purity.py"
      - "scripts/migration-zig-gate.py"
      - "scripts/zig_codec_bridge.py"
      - "scripts/test_zig_codec_bridge.py"
      - "scripts/sens_t5_codec.py"
      - "scripts/check_sterile_zig_corridor.py"
      - "scripts/check_rust_sens_zig_corridor.py"
      - "tests/test_check_rust_sens_zig_corridor.py"
      - "tests/test_migration_zig_gate.py"
      - "tests/test_t5_physical_python_parity.py"
      - "tests/test_sterile_zig_corridor.py"
      - "crates/sens-cli/src/zig_transport.rs"
      - "crates/sens-cli/src/bin/sens-trit.rs"
      - ".zig-version"
      - ".github/actions/install-zig/**"
      - ".github/workflows/zig-transport-gate.yml"
  pull_request:
    paths:
      - "research/zig-codecs/**"
      - "scripts/ci_zig_purity.py"
      - "scripts/migration-zig-gate.py"
      - "scripts/zig_codec_bridge.py"
      - "scripts/test_zig_codec_bridge.py"
      - "scripts/sens_t5_codec.py"
      - "scripts/check_sterile_zig_corridor.py"
      - "scripts/check_rust_sens_zig_corridor.py"
      - "tests/test_check_rust_sens_zig_corridor.py"
      - "tests/test_migration_zig_gate.py"
      - "tests/test_t5_physical_python_parity.py"
      - "tests/test_sterile_zig_corridor.py"
      - "crates/sens-cli/src/zig_transport.rs"
      - "crates/sens-cli/src/bin/sens-trit.rs"
      - ".zig-version"
      - ".github/actions/install-zig/**"
      - ".github/workflows/zig-transport-gate.yml"

concurrency:
  group: zig-transport-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migration-zig-gate:
    name: pin · purity · sterile corridor · T5
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/actions/install-zig
      - name: Unit tests (no semantic admission)
        run: |
          python3 -m unittest tests.test_migration_zig_gate -v
          python3 -m unittest tests.test_t5_physical_python_parity -v
          python3 scripts/check_sterile_zig_corridor.py
          python3 -m unittest tests.test_sterile_zig_corridor -v
          python3 scripts/check_rust_sens_zig_corridor.py .
          python3 -m unittest tests.test_check_rust_sens_zig_corridor -v
      - name: Zig ABI v2 transport_abi unit tests (T5/F3C/E1 physical)
        run: |
          set -euo pipefail
          zig version
          # Physical corridor only: encode/decode BE3, alias rejection, E1 roundtrip.
          # No SENS semantic admission in this step.
          zig test research/zig-codecs/transport_abi.zig
      - name: Migration ↔ Zig preparation gate (require pinned Zig)
        run: |
          set -euo pipefail
          python3 scripts/migration-zig-gate.py --require-zig \
            --report "$RUNNER_TEMP/sens-migration-zig-gate.json"
          python3 - <<'PY'
          import json, os, pathlib
          path = pathlib.Path(os.environ["RUNNER_TEMP"]) / "sens-migration-zig-gate.json"
          data = json.loads(path.read_text(encoding="utf-8"))
          assert data["schema"] == "sens-migration-zig-gate/v1"
          assert data["verdict"] == "PASS"
          assert data["transport_verified"] is True
          assert data["scope"] == "FULL_PHYSICAL_ZIG"
          assert [s["step"] for s in data["steps"]] == [
              "zig-pin", "ci_zig_purity", "check-domain-ladder-identity",
              "migrate-exact-domain-authority", "test_zig_codec_bridge"
          ]
          assert data["zig_pin"] == "0.16.0"
          print("MIGRATION_ZIG_GATE_CI_PASS")
          PY
