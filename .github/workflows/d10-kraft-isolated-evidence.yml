name: D10 точний префіксний код і сума Крафта
on:
  workflow_dispatch:
jobs:
  independent-exact-oracles:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check_d10_prefix_free_kraft_certificate.py
      - run: python3 -O scripts/check_d10_prefix_free_kraft_certificate.py
      - run: python3 scripts/check_d10_selection_transition_history.py --self-test
      - run: true
