name: D10 точний префіксний код і сума Крафта
on:
  pull_request:
    paths:
      - 'knowledge/d10-prefix-free-kraft-certificate-20261011.json'
      - 'scripts/check_d10_prefix_free_kraft_certificate.py'
      - 'knowledge/d10-v1-semantic-inventory.json'
      - 'knowledge/d10-selection-transition-history.json'
      - '.github/workflows/d10-kraft-isolated-evidence.yml'
  push:
    branches: [main]
    paths:
      - 'knowledge/d10-prefix-free-kraft-certificate-20261011.json'
      - 'scripts/check_d10_prefix_free_kraft_certificate.py'
      - 'knowledge/d10-v1-semantic-inventory.json'
      - 'knowledge/d10-selection-transition-history.json'
      - '.github/workflows/d10-kraft-isolated-evidence.yml'
jobs:
  independent-exact-oracles:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check_d10_prefix_free_kraft_certificate.py
      - run: python3 -O scripts/check_d10_prefix_free_kraft_certificate.py
      - run: python3 scripts/check_d10_selection_transition_history.py --self-test
      - run: python3 scripts/check-d10-proposal-ledger.py --self-test
