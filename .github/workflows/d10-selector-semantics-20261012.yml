name: D10 selector constructive semantics witness
on:
  push:
    branches: [main]
    paths:
      - 'knowledge/d9-ratified.json'
      - 'knowledge/d10-selector-seed.json'
      - 'knowledge/d10-v17-complete-research-gauge-20261012.json'
      - 'knowledge/d10-v18-semantic-inventory.json'
      - 'knowledge/d10-owner-whole-domain-ratification-20261012.json'
      - 'knowledge/d10-current-inventory.json'
      - 'scripts/check_d10_selector_semantics_20261012.py'
      - '.github/workflows/d10-selector-semantics-20261012.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  selector-constructive-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check 256 selector identities, 128 parents, and six negative controls
        run: |
          python3 scripts/check_d10_selector_semantics_20261012.py --self-test
          python3 -O scripts/check_d10_selector_semantics_20261012.py --self-test
