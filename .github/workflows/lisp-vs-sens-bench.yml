name: Lisp vs SENS benchmark (manual)
# Ручний бенчмарк: та сама програма у трьох формах --
#   en-text   (англійська поверхня = Lisp),
#   sens-text (SENS-читання),
#   sens-fasl (бінарний SENS FASL).
# Міряє кількість інструкцій (valgrind cachegrind), не час.
# Не запускається автоматично.
on:
  workflow_dispatch:
    inputs:
      reps:
        description: "повторів на замір"
        default: "3"
      repeat_n:
        description: "внутрішніх повторів"
        default: "5"

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Встановити Zig 0.16.0 (збірка sens його вимагає)
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --silent --show-error \
            https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz \
            --output "$RUNNER_TEMP/zig-0.16.0.tar.xz"
          echo '70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00  '"$RUNNER_TEMP/zig-0.16.0.tar.xz" | sha256sum --check --status
          tar -xJf "$RUNNER_TEMP/zig-0.16.0.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/zig-x86_64-linux-0.16.0" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/zig-x86_64-linux-0.16.0/zig" version
      - name: Встановити valgrind (лічильник інструкцій)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq valgrind
      - name: Зібрати ci_bench (release)
        run: cargo build --locked --release -p sens --example ci_bench
      - name: Lisp (en) vs SENS (sens-text / sens-fasl)
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/lisp-vs-sens"
          sh benchmarks/sens-surface/post_m8_three_way.sh \
            "$PWD/target/release/examples/ci_bench" "$OUT" "${{ inputs.reps }}" "${{ inputs.repeat_n }}"
          echo "===== summary.json ====="
          cat "$OUT/summary.json" 2>/dev/null || true
          echo "===== instructions.tsv ====="
          cat "$OUT/instructions.tsv" 2>/dev/null || true
      - name: Зберегти сирі заміри
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lisp-vs-sens-${{ github.sha }}
          path: ${{ runner.temp }}/lisp-vs-sens
