name: TEMP exact-current-main Core4 FASL refresh

on:
  push:
    branches:
      - fix/current-main-core4-fasl-refresh-20261010

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify exact current-main Core4 source
        run: |
          set -euo pipefail
          actual="$(git hash-object lib/core4.lisp)"
          test "$actual" = "19f370901bf00f39d53906940f2fc1f1cafa7191"
          echo "CORE4_SOURCE_BLOB=$actual"
      - name: Generate physical binary FASL and preserve unchanged freshness gate
        run: |
          set -euo pipefail
          cargo run --locked --release -p sens-cli --bin gen-fasl -- lib/core4.lisp lib/core4.lisp.fasl
          cargo test --locked -p sens --test core_fasl_freshness -- --nocapture
      - name: Commit only the verified binary artifact to this branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/core4.lisp.fasl
          if git diff --cached --quiet; then
            echo "FASL already fresh for this exact source"
            exit 0
          fi
          git commit -m "fix(fasl): refresh binary for exact current-main Core4 source"
          git push origin "HEAD:${GITHUB_REF_NAME}"
