name: Canonical embed staticlib

on:
  pull_request:
    paths:
      - "crates/sens-embed/**"
      - ".github/workflows/embed-staticlib.yml"
  push:
    branches: [main]
    paths:
      - "crates/sens-embed/**"
      - ".github/workflows/embed-staticlib.yml"
  workflow_dispatch:

jobs:
  windows-static-embed:
    if: vars.HOSTED_RUNNERS == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - name: Require canonical staticlib artifact contract
        shell: pwsh
        run: |
          $manifest = Get-Content crates/sens-embed/Cargo.toml -Raw
          if ($manifest -notmatch 'crate-type\s*=\s*\["cdylib",\s*"staticlib",\s*"rlib"\]') {
            throw 'sens-embed does not yet emit staticlib alongside cdylib/rlib'
          }

      - name: Preserve canonical embed tests
        run: cargo test --release -p sens-embed

      - name: Build canonical embed artifacts and capture Cargo metadata
        shell: pwsh
        run: |
          $lines = & cargo build --release -p sens-embed --message-format=json-render-diagnostics
          if ($LASTEXITCODE -ne 0) {
            throw 'cargo build failed for sens-embed'
          }

          $artifacts = @()
          foreach ($line in $lines) {
            try {
              $row = $line | ConvertFrom-Json -ErrorAction Stop
            }
            catch {
              continue
            }
            if ($row.reason -eq 'compiler-artifact' -and $row.target.name -eq 'sens_embed') {
              $artifacts += $row
            }
          }
          if ($artifacts.Count -eq 0) {
            throw 'Cargo emitted no compiler-artifact row for sens_embed'
          }

          $filenames = @($artifacts | ForEach-Object { $_.filenames } | Sort-Object -Unique)
          $filenames | ForEach-Object { Write-Output "artifact=$_" }

          $static = @($filenames | Where-Object {
            $_ -match '\.lib$' -and $_ -notmatch '\.dll\.lib$'
          })
          if ($static.Count -ne 1) {
            throw "expected exactly one Cargo-reported static .lib, found $($static.Count)"
          }
          "MY_LISP_EMBED_STATIC=$($static[0])" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Require Windows static library artifact
        shell: pwsh
        run: |
          if (-not (Test-Path $env:MY_LISP_EMBED_STATIC)) {
            throw "Cargo-reported staticlib does not exist: $env:MY_LISP_EMBED_STATIC"
          }
          Write-Output "staticlib=$env:MY_LISP_EMBED_STATIC"

      - name: Ask rustc for native static link dependencies
        shell: pwsh
        env:
          CARGO_TERM_COLOR: never
        run: |
          $nativeOutput = @(& cargo rustc --release -p sens-embed --lib -- --print native-static-libs 2>&1 | ForEach-Object { "$_" })
          $nativeOutput | ForEach-Object { Write-Output $_ }
          if ($LASTEXITCODE -ne 0) {
            throw 'rustc failed while reporting native-static-libs'
          }

          $matches = @($nativeOutput | Where-Object { $_ -match 'native-static-libs:\s*(.+)$' })
          if ($matches.Count -eq 0) {
            throw 'rustc did not report native-static-libs for sens-embed'
          }
          $match = [regex]::Match($matches[-1], 'native-static-libs:\s*(.+)$')
          $libs = @($match.Groups[1].Value.Trim() -split '\s+' | Where-Object { $_ })
          if ($libs.Count -eq 0) {
            throw 'native-static-libs report was empty'
          }
          $libs | ForEach-Object { Write-Output "native-lib=$_" }
          "MY_LISP_NATIVE_LIBS=$($libs -join ';')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure native static C consumer
        shell: pwsh
        run: |
          cmake -S crates/sens-embed/tests/static-consumer -B target/static-consumer `
            "-DMY_LISP_EMBED_STATIC=$env:MY_LISP_EMBED_STATIC" `
            "-DMY_LISP_NATIVE_LIBS=$env:MY_LISP_NATIVE_LIBS"
          if ($LASTEXITCODE -ne 0) { throw 'static consumer configure failed' }

      - name: Link native static C consumer
        shell: pwsh
        run: |
          cmake --build target/static-consumer --config Release --parallel 4
          if ($LASTEXITCODE -ne 0) { throw 'static consumer link failed' }

      - name: Run native static C consumer
        shell: pwsh
        run: |
          & .\target\static-consumer\Release\sens-embed-static-consumer.exe
          if ($LASTEXITCODE -ne 0) { throw "static consumer exited $LASTEXITCODE" }
