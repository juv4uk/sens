name: Historical D5 OD-005 closure provenance

on:
  pull_request:
    paths:
      - "benchmarks/d5-closure-map/**"
      - ".github/workflows/d5-closure-map.yml"
      - "scripts/research-2322-generative-domain-forecast.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  closure-map:
    runs-on: ubuntu-latest
    steps:
      - name: Historical provenance notice
        run: |
          echo "OD-005 D5 closure-map is historical provenance only."
          echo "Current D5 authority is #3305 / knowledge/d5-ratified.json."
          echo "Current selector geometry must not be checked against the frozen OD-005 map."
          echo "Use .github/workflows/d5-ratified-baseline.yml for current D5 authority."
