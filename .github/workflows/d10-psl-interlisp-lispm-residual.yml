name: D10 PSL Interlisp Lisp Machine historical research
on:
  workflow_dispatch:
jobs:
  historical-safe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fail-closed historical names and 12 negative cases
        run: python3 scripts/check_d10_psl_interlisp_lispm_residual.py --self-test
      - name: Historical verifier read-only
        run: git diff --exit-code
