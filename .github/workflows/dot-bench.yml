# Бенчмарк машинного шару SENS: sens_dot_scalar (SSE2) проти sens_dot_avx2 (AVX2/FMA).
#
# Що дає: 8 НЕЗАЛЕЖНИХ процесів на кожен розмір, середнє, ДІ95 і висновок
# про перекриття інтервалів. Результат пишеться у SUMMARY.txt (ASCII),
# а не тільки в лог — кирилиця в лозі читається ненадійно.
#
# Чого НЕ дає: джоулів. RAPL на hosted-раннері немає (перевірено:
# RAPL_AVAILABLE=no). Енергія — окремо, у wsm-lazarus/scripts/energy/measure.py
# на залізі з датчиком.
name: Дослід · dot_f64 машинний шар

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'crates/sens/examples/dot_bench.rs'
      - '.github/workflows/dot-bench.yml'

permissions:
  contents: read

jobs:
  dot:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      # build.rs вимагає піннутий Zig — без нього крейт не збирається.
      - name: Встановити Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Інструменти
        run: |
          zig version
          cargo --version
          rustc --version

      - name: Чи підтримує процесор AVX2
        run: |
          if grep -q avx2 /proc/cpuinfo; then echo "AVX2=yes"; else echo "AVX2=no"; fi

      - name: Зібрати бенчмарк
        run: cargo build --release --example dot_bench

      - name: 8 незалежних процесів на кожен розмір
        run: |
          # Кожен повтор — ОКРЕМИЙ процес: це незалежна одиниця ресемплінгу.
          mkdir -p build/dot
          for n in 4096 262144 1048576; do
            : > "build/dot/n$n.txt"
            for p in 1 2 3 4 5 6 7 8; do
              ./target/release/examples/dot_bench "$n" 32 >> "build/dot/n$n.txt" 2>&1 || true
            done
          done
          ls -l build/dot/

      - name: Порахувати ДІ95 у SUMMARY.txt
        run: python3 scripts/dot-summary.py build/dot

      - name: Показати SUMMARY
        run: cat build/dot/SUMMARY.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dot-bench
          path: build/dot/*.txt
          if-no-files-found: warn
