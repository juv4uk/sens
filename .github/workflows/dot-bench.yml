# Бенчмарк машинного шару SENS: sens_dot_scalar (SSE2) проти sens_dot_avx2 (AVX2/FMA).
#
# Що дає: BACKEND (який варіант обрано), WALL_NS, SUM на детермінованому масиві.
# Це порівняння ВСЕРЕДИНІ мови — не залежить від міжмовної коректності.
#
# Чого НЕ дає: джоулів. RAPL на hosted-раннері немає (перевірено:
# RAPL_AVAILABLE=no). Енергія — окремо, у wsm-lazarus/scripts/energy/measure.py
# на залізі з датчиком.
name: Дослід · dot_f64 машинний шар

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'crates/sens/examples/dot_bench.rs'
      - '.github/workflows/dot-bench.yml'

permissions:
  contents: read

jobs:
  dot:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      # build.rs вимагає піннутий Zig — без нього крейт не збирається.
      - name: Встановити Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Інструменти
        run: |
          zig version
          cargo --version
          rustc --version

      - name: Чи підтримує процесор AVX2
        run: |
          if grep -q avx2 /proc/cpuinfo; then echo "AVX2=yes"; else echo "AVX2=no"; fi

      - name: Зібрати бенчмарк
        run: cargo build --release --example dot_bench

      - name: Прогнати (малий, середній, великий)
        run: |
          for n in 4096 262144 1048576; do
            echo "=== n=$n ==="
            ./target/release/examples/dot_bench "$n" 32 || echo "DOT_BENCH_FAILED n=$n"
          done

      - name: Незалежні повтори — 8 процесів на розмір
        run: |
          # Один прогін не дає ДІ. Тут кожен повтор — ОКРЕМИЙ процес,
          # як вимагає методика (незалежна одиниця ресемплінгу).
          mkdir -p build/dot
          for n in 4096 262144 1048576; do
            : > "build/dot/n$n.txt"
            for p in 1 2 3 4 5 6 7 8; do
              ./target/release/examples/dot_bench "$n" 32 >> "build/dot/n$n.txt" 2>&1 || true
            done
          done
          ls -l build/dot/

      - name: Довірчі інтервали (95%) на 8 незалежних процесах
        run: |
          python3 - <<'PY'
          import re, statistics, math, pathlib
          for f in sorted(pathlib.Path("build/dot").glob("n*.txt")):
              txt = f.read_text(encoding="utf-8", errors="replace")
              sc = [int(x) for x in re.findall(r"SCALAR_WALL_NS (\d+)", txt)]
              av = [int(x) for x in re.findall(r"AVX2_WALL_NS (\d+)", txt)]
              if len(sc) < 2 or len(av) < 2:
                  print(f"{f.name}: замало повторів ({len(sc)}/{len(av)})")
                  continue
              def ci(v):
                  m = statistics.mean(v); s = statistics.stdev(v)
                  h = 2.365 * s / math.sqrt(len(v))   # t(0.975, df=7)
                  return m, m - h, m + h
              ms, ls, hs = ci(sc); ma, la, ha = ci(av)
              print(f"{f.name}: n={len(sc)}")
              print(f"  SSE2 {ms:,.0f} нс  ДІ95 [{ls:,.0f}, {hs:,.0f}]")
              print(f"  AVX2 {ma:,.0f} нс  ДІ95 [{la:,.0f}, {ha:,.0f}]")
              print(f"  відношення {ms/ma:.3f}")
              # ДІ відношення через перекриття: якщо [ls,hs] і [la,ha] не перетинаються — різниця стійка
              overlap = not (hs < la or ha < ls)
              print(f"  ДІ перетинаються: {'ТАК — висновок нестійкий' if overlap else 'НІ — різниця стійка'}")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dot-bench
          path: build/dot/*.txt
          if-no-files-found: warn
