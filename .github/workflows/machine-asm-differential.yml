name: machine-asm-differential

concurrency:
  group: machine-asm-differential-${{ github.sha }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - "crates/sens/tests/machine_asm_differential.rs"
      - "crates/sens/tests/x86_64_lisp_encoder.rs"
      - "lib/machine/encoding/x86-64.lisp"
      - "lib/machine/admission/x86-64.lisp"
      - "crates/sens/src/mixed_source.rs"
      - "crates/sens/src/lib.rs"
      - "crates/sens/src/eval/d5_arithmetic.rs"
      - "crates/sens/src/eval/d6_arithmetic.rs"
      - "crates/sens/src/eval/arithmetic.rs"
      - ".github/workflows/machine-asm-differential.yml"
  push:
    branches: [main]
    paths:
      - "crates/sens/tests/machine_asm_differential.rs"
      - "crates/sens/tests/x86_64_lisp_encoder.rs"
      - "lib/machine/encoding/x86-64.lisp"
      - "lib/machine/admission/x86-64.lisp"
      - "crates/sens/src/mixed_source.rs"
      - "crates/sens/src/lib.rs"
      - "crates/sens/src/eval/d5_arithmetic.rs"
      - "crates/sens/src/eval/d6_arithmetic.rs"
      - "crates/sens/src/eval/arithmetic.rs"
      - ".github/workflows/machine-asm-differential.yml"
  workflow_dispatch:

jobs:
  gas-nasm-byte-witness:
    name: GAS/NASM exact-byte witness
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Install external assembler witnesses
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils nasm
      - name: Compare external assembler bytes with Lisp-owned encoder
        run: cargo test --locked -p sens --test machine_asm_differential -- --ignored --nocapture

  mov-imm64-closed-domain:
    name: "MOV imm64: усі 16 регістрів, незалежний декодер"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: "Порівняти фізичні MOV imm64 на всіх 16 регістрах"
        run: |
          # Різні незалежні свідки: виконати всі, але будь-яке падіння
          # залишає job червоним. Стара остача не блокує діагностику MOV.
          set +e
          cargo test --locked -p sens --test x86_64_lisp_encoder x86_mov_imm64_component_stage_probe -- --exact --nocapture
          статус_байтів=$?
          cargo test --locked -p sens --test x86_64_lisp_encoder lisp_encodes_mov_r64_imm64_for_every_gpr_with_independent_decode -- --exact --nocapture
          статус_регістрів=$?
          cargo test --locked -p sens --test x86_64_lisp_encoder exact_ukrainian_quotient_and_remainder_stage_probe -- --exact --nocapture
          статус_арифметики=$?
          if [ "$статус_байтів" -ne 0 ] || [ "$статус_регістрів" -ne 0 ] || [ "$статус_арифметики" -ne 0 ]; then
            exit 1
          fi
