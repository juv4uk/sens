name: Binary SENS D1/D3 transport and mechanism witness

on:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  binary-self-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/install-zig
      - uses: dtolnay/rust-toolchain@stable
      - name: "Run physical binary SENS transport/mechanism witness"
        run: cargo test --locked -p sens --test binary_sens_d1_cond_oracle -- --nocapture
      - name: "Verify existing current exact-binary interpreter preflight"
        run: cargo test --locked -p sens --test current_binary_preflight -- --nocapture

      - name: SENS власноруч перевіряє D4 зв'язування FS (позитивні й однобітний негативний)
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked -p sens-cli --bin sens --bin sens-trit
          mkdir -p "$RUNNER_TEMP/fs-sens-proof"
          python3 - "$RUNNER_TEMP/fs-sens-proof" <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0, "scripts")
          from sens_t5_t5m_codec import encode_projection
          root = Path(sys.argv[1])
          for suite in ("fs-d4-binding", "bridge-d4-triple"):
              for name in ("law", "mutant"):
                  source = Path(f"tests/semantic/{suite}-{name}.bits").read_text(encoding="ascii")
                  for number, line in enumerate(source.splitlines(), 1):
                      words = line.split()
                      if not words or any(set(word) - {"0", "1"} for word in words):
                          raise SystemExit(f"Invalid binary word in {suite} {name} witness {number}")
                      (root / f"{suite}-{name}-{number}.sens").write_bytes(encode_projection(" ".join(words)))
          PY
          for suite in fs-d4-binding bridge-d4-triple; do
            for file in "$RUNNER_TEMP"/fs-sens-proof/"$suite"-law-*.sens; do
              target/debug/sens "$file" > "$file.sens-out"
              target/debug/sens-trit eval "$file" > "$file.trit-out"
              cmp "$file.sens-out" "$file.trit-out"
              test "$(cat "$file.sens-out")" = "1"
            done
            if target/debug/sens "$RUNNER_TEMP/fs-sens-proof/$suite-mutant-1.sens" > "$RUNNER_TEMP/fs-sens-proof/$suite-mutant.out" 2>&1; then
              echo "BLOCKED: one-bit mutated SENS verdict succeeded in $suite" >&2
              exit 1
            fi
          done
