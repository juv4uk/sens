name: D6 binding order research

on:
  pull_request:
    paths:
      - "benchmarks/d6-binding-order/**"
      - ".github/workflows/d6-binding-order.yml"
  push:
    branches: [main]
    paths:
      - "benchmarks/d6-binding-order/**"
      - ".github/workflows/d6-binding-order.yml"
  workflow_dispatch:

jobs:
  binding-order:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Run coordinate-independent binding-order witness
        run: |
          rm -rf /tmp/d6-binding-order
          python3 benchmarks/d6-binding-order/run.py             --out /tmp/d6-binding-order
      - name: Publish report
        if: always()
        run: |
          if test -f /tmp/d6-binding-order/report.md; then
            cat /tmp/d6-binding-order/report.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: d6-binding-order
          path: /tmp/d6-binding-order/
          retention-days: 14
