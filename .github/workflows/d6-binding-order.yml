name: D6 binding order research

on:
  workflow_dispatch:

jobs:
  binding-order:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Run coordinate-independent binding-order witness
        run: |
          rm -rf /tmp/d6-binding-order
          echo "FOREIGN_LANGUAGE_TEST_OR_BENCH=EXCLUDED_BY_POLICY native_equivalent=NOT_VERIFIED"
      - name: Publish report
        if: always()
        run: |
          if test -f /tmp/d6-binding-order/report.md; then
            cat /tmp/d6-binding-order/report.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d6-binding-order
          path: /tmp/d6-binding-order/
          retention-days: 14
