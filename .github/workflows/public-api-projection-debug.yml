name: Public API projection diagnostic

on:
  pull_request:
    paths:
      - "docs/generated/public-api-discovery.md"
      - ".github/workflows/public-api-projection-debug.yml"

jobs:
  projection-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Regenerate projection and show exact diff
        run: |
          python3 scripts/public_api_inventory.py --write-report
          git diff -- docs/generated/public-api-discovery.md
          python3 scripts/public_api_inventory.py --check
