name: migration-pair-cohort

on:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Three-pass exact migration + physical T5 checks
        run: python3 -m unittest discover -s tests -p 'test_migration_pair_cohort.py' -v
      - name: Current SENS oracle executes migrated physical programs
        run: cargo test -p sens --features rust-t5-reference --test migration_pair_cohort
