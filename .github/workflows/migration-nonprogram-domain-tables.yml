name: Domain D1-D9 non-program original source classification

on:
  pull_request:
    paths:
      - 'knowledge/migration-nonprogram-domain-tables-2026-10-08.json'
      - 'tests/test_migration_nonprogram_domain_tables.py'
      - 'lib/domains/d*.lisp'
      - '.github/workflows/migration-nonprogram-domain-tables.yml'
  push:
    branches: [main]
    paths:
      - 'knowledge/migration-nonprogram-domain-tables-2026-10-08.json'
      - 'tests/test_migration_nonprogram_domain_tables.py'
      - 'lib/domains/d*.lisp'
      - '.github/workflows/migration-nonprogram-domain-tables.yml'
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Validate nine pinned D1-D9 table sources and 1020 exact-width cells
        run: python3 -m unittest discover -s tests -p test_migration_nonprogram_domain_tables.py -v
