name: D10 historical DLL unit closure

on:
  pull_request:
    paths:
      - knowledge/d10-dll1962-unit-closure-research-v1.json
      - knowledge/d10-dll1962-glucose3-oracle-evidence-v1.json
      - docs/research/D10-DLL1962-UNIT-CLOSURE.uk.md
      - tests/test_d10_dll1962_unit_closure.py
      - tests/oracles/d10_real_pysat_unit.py
      - .github/workflows/d10-dll1962-unit-closure.yml
  push:
    branches: [main]
    paths:
      - knowledge/d10-dll1962-unit-closure-research-v1.json
      - knowledge/d10-dll1962-glucose3-oracle-evidence-v1.json
      - tests/test_d10_dll1962_unit_closure.py
      - tests/oracles/d10_real_pysat_unit.py
      - .github/workflows/d10-dll1962-unit-closure.yml

permissions:
  contents: read

jobs:
  original-proof-law-real-sat-donor:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v5
      - name: Independent 2304 finite model and BCP fixed-point cases
        run: python3 -m unittest discover -s tests -p test_d10_dll1962_unit_closure.py -v
      - name: Install real SAT engine PySAT Glucose3
        run: |
          python3 -m pip install --disable-pip-version-check --user 'python-sat==1.8.dev30'
          python3 -c 'from pysat.solvers import Glucose3; import pysat; print("SAT donor", pysat.__version__, Glucose3)'
      - name: Compare actual compiled propagation on 600 canonical cases
        run: python3 tests/oracles/d10_real_pysat_unit.py
