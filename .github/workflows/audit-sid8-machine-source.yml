name: Audit SID8 in-place machine Lisp cutover

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-witness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Guard six original Lisp machine modules and generated-input boundaries
        run: python3 -m unittest discover -s tests -p test_sid8_machine_source_cutover.py -v
