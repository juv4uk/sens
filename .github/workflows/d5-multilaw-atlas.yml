name: D5 multilaw atlas research

on:
  pull_request:
    paths:
      - "knowledge/d5-multilaw-atlas.json"
      - "knowledge/d3-d8-stable-residents.json"
      - "scripts/check-3039-d5-multilaw-atlas.py"
      - ".github/workflows/d5-multilaw-atlas.yml"
  push:
    branches: [main]
    paths:
      - "knowledge/d5-multilaw-atlas.json"
      - "scripts/check-3039-d5-multilaw-atlas.py"
      - ".github/workflows/d5-multilaw-atlas.yml"
  workflow_dispatch:

jobs:
  atlas:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Validate D5 stable-ID multilaw atlas
        run: |
          rm -rf /tmp/d5-multilaw-atlas
          python3 scripts/check-3039-d5-multilaw-atlas.py \
            --out /tmp/d5-multilaw-atlas

      - name: Publish report
        if: always()
        run: |
          if test -f /tmp/d5-multilaw-atlas/report.md; then
            cat /tmp/d5-multilaw-atlas/report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d5-multilaw-atlas
          path: /tmp/d5-multilaw-atlas/
          retention-days: 14
