name: audit-t5-program-syntax

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - '**/*.lisp'
      - '**/*.sens'
      - 'scripts/audit_t5_program_syntax.py'
      - 'scripts/audit_t5_file_pairs.py'
      - 'scripts/sens_t5_codec.py'
      - 'scripts/migrate-three-pass.py'
      - 'scripts/migrate.py'
      - 'crates/sens-cli/**'
      - 'crates/sens/src/parser.rs'
      - 'crates/sens/src/syntax.rs'
      - 'tests/test_audit_t5_program_syntax.py'
      - 'docs/T5-PROGRAM-SYNTAX-AUDIT-2026-10-08.uk.md'
      - '.github/workflows/audit-t5-program-syntax.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  d2-grammar-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the ACTUAL SENS binary reader
        run: cargo build -q -p sens-cli --bin sens-trit
      - name: Test physically valid but structurally invalid .sens
        env:
          SENS_TRIT_BIN: ${{ github.workspace }}/target/debug/sens-trit
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_audit_t5_program_syntax.py' -v
      - name: Audit tracked .sens without claiming semantic oracle parity
        shell: bash
        run: |
          set -euo pipefail
          # Не сховати причину, навіть коли D2 reader повернув BLOCK.
          status=0
          python3 scripts/audit_t5_program_syntax.py . \
            --reader "$PWD/target/debug/sens-trit" \
            --output "$RUNNER_TEMP/t5-syntax-report.json" \
            --require-files || status=$?
          python3 - "$RUNNER_TEMP/t5-syntax-report.json" "$status" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding='utf-8') as stream:
              report=json.load(stream)
          summary=report['summary']
          print('D2_SYNTAX_AUDIT',report['status'],summary,flush=True)
          for row in report['files']:
              if row['syntax_status'] != 'PASS_D2_SYNTAX':
                  print('D2_BLOCKED',row['sens'],row.get('syntax_reason','unknown'),flush=True)
          if (report['schema']!='sens-t5-d2-program-syntax-audit/v1'
                  or report['status']!='SYNTAX_ONLY'
                  or int(sys.argv[2])!=0
                  or summary['pairs_seen']<1
                  or summary['d2_syntax_blocked']!=0
                  or summary['executable_semantics_certified']!=0):
              raise SystemExit('BLOCKED: physical T5 + Rust D2 required; syntax does not certify semantics')
          PY
      - name: Upload provenance + D2 grammar report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t5-d2-syntax-audit
          if-no-files-found: warn
          path: ${{ runner.temp }}/t5-syntax-report.json
