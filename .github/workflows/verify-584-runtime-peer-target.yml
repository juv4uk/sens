name: Verify 584 runtime peer target

on:
  workflow_dispatch:

jobs:
  runtime-peer-target:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Run exact runtime-peer target
        run: cargo test -p sens --test runtime_peer_operators
      - name: Child diff hygiene
        run: git diff --check HEAD^ HEAD
