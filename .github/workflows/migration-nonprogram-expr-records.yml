name: Migration non-program expr fixture records

on:
  pull_request:
    paths:
      - "knowledge/migration-nonprogram-expr-records-2026-10-08.json"
      - "tests/test_migration_nonprogram_expr_records.py"
      - "tests/fixtures/*.lisp"
      - ".github/workflows/migration-nonprogram-expr-records.yml"
  push:
    branches: [main]
    paths:
      - "knowledge/migration-nonprogram-expr-records-2026-10-08.json"
      - "tests/test_migration_nonprogram_expr_records.py"
      - "tests/fixtures/*.lisp"
      - ".github/workflows/migration-nonprogram-expr-records.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Verify pinned Lisp test-record envelopes and executable negative controls
        run: python3 tests/test_migration_nonprogram_expr_records.py -v
