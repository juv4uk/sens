name: Paired wall evidence methodology (A/A negative control)

# This does not gate latency, and does not interfere with critical smoke lanes.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parity-first-paired-wall:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/install-zig
      - uses: dtolnay/rust-toolchain@stable

      - name: Test randomized protocol, bootstrap, and fail-closed parity — EXCLUDED (NOT_VERIFIED)
        if: false
        shell: bash
        run: echo "FOREIGN_LANGUAGE_TEST_BENCH=EXCLUDED_BY_POLICY native_equivalent=NOT_VERIFIED"
      - name: Build real physical SENS binary, without adding Cargo dependencies
        run: cargo build --locked --release -p sens-cli --bin sens

      - name: A/A negative control on a committed physical .sens file — EXCLUDED (NOT_VERIFIED)
        if: false
        shell: bash
        run: echo "FOREIGN_LANGUAGE_TEST_BENCH=EXCLUDED_BY_POLICY native_equivalent=NOT_VERIFIED"
      - name: SHA manifest and evidence, even if red
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sens-paired-methodology"
          git rev-parse HEAD > "$RUNNER_TEMP/sens-paired-methodology/commit.sha"
          sha256sum \
            benchmarks/methodology/paired_wall.py \
            benchmarks/methodology/tests/test_paired_wall.py \
            benchmarks/methodology/bench.json \
            tests/fixtures/migration-quote-cohort-main/quote-legacy.sens \
            > "$RUNNER_TEMP/sens-paired-methodology/inputs.sha256"
          if test -f target/release/sens; then
            sha256sum target/release/sens \
              > "$RUNNER_TEMP/sens-paired-methodology/executable.sha256"
          fi
          if test -f "$RUNNER_TEMP/paired-methodology-summary.txt"; then
            cp "$RUNNER_TEMP/paired-methodology-summary.txt" \
               "$RUNNER_TEMP/sens-paired-methodology/summary.txt"
          fi

      - name: Retain A/A raw pairs and statistical provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paired-methodology-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sens-paired-methodology/
          retention-days: 21
          if-no-files-found: error
