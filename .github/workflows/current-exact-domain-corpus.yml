name: Current exact-domain corpus

on:
  # Переведено на pull_request: workflow УЖЕ читає PR-дані
  # (github.event.pull_request.*), але тригер не стріляв.
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: current-exact-domain-corpus-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  projection:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Verify current D1-D7 projection
        run: python3 benchmarks/current-exact-domain-corpus/run.py --check
