name: Core-Math neutral IR research

on:
  pull_request:
    paths:
      - "docs/research/2433-core-math-neutral-v1.json"
      - "docs/research/2433-core-math-research-projection.json"
      - "docs/research/2433-core-math-generation-certificates.json"
      - "benchmarks/core-math-neutral-ir/**"
      - ".github/workflows/core-math-neutral-ir-research.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate neutral IR and canonical round-trip
        run: python3 benchmarks/core-math-neutral-ir/validate.py
