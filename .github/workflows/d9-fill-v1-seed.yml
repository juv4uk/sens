name: D9 fill v1 seed

on:
  workflow_dispatch:

jobs:
  seed:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: GPU runner identity
        run: nvidia-smi || true
      - name: Verify D9 selector seed
        run: python3 scripts/check-d9-fill-v1-seed.py
