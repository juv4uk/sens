name: D9 fill v1 seed

on:
  pull_request:
    paths:
      - "knowledge/d9-selector-seed.json"
      - "knowledge/d9-fill-v1-state.json"
      - "knowledge/d8-ratified.json"
      - "knowledge/d1-d8-foundation.json"
      - "scripts/check-d9-fill-v1-seed.py"
      - ".github/workflows/d9-fill-v1-seed.yml"
  push:
    branches: [main]
    paths:
      - "knowledge/d9-selector-seed.json"
      - "knowledge/d9-fill-v1-state.json"
      - "knowledge/d8-ratified.json"
      - "knowledge/d1-d8-foundation.json"
      - "scripts/check-d9-fill-v1-seed.py"
      - ".github/workflows/d9-fill-v1-seed.yml"
  workflow_dispatch:

jobs:
  seed:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: GPU runner identity
        run: nvidia-smi || true
      - name: Verify D9 selector seed
        run: python3 scripts/check-d9-fill-v1-seed.py
