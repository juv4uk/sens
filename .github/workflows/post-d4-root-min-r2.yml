name: Post-D4 root minimization R2

on:
  workflow_dispatch:

jobs:
  r2:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Run raw-form root minimization
        run: |
          rm -rf /tmp/post-d4-root-min-r2
          python3 benchmarks/post-d4-root-min-r2/run.py             --out /tmp/post-d4-root-min-r2
      - name: Publish report
        if: always()
        run: |
          if test -f /tmp/post-d4-root-min-r2/report.md; then
            cat /tmp/post-d4-root-min-r2/report.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: post-d4-root-min-r2
          path: /tmp/post-d4-root-min-r2/
          retention-days: 14
