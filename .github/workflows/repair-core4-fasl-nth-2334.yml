name: PR 2334 regenerate exact NTH Core4 FASL

on:
  push:
    branches: [migration/core-nth-exact-d1-20261010]
    paths:
      - lib/core4.lisp
      - .github/workflows/repair-core4-fasl-nth-2334.yml

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: migration/core-nth-exact-d1-20261010
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Rebuild FASL with the canonical Rust writer
        run: cargo run --locked --quiet -p sens-cli --bin gen-fasl -- lib/core4.lisp lib/core4.lisp.fasl
      - name: Verify exact source digest in generated cache
        run: cargo test --locked -p sens --test core_fasl_freshness -- --nocapture
      - name: Commit verified cache to feature branch only
        shell: bash
        run: |
          set -euo pipefail
          git add -- lib/core4.lisp.fasl
          if git diff --cached --quiet; then
            echo "FASL already exact-current"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(core): regenerate exact NTH Core4 FASL'
          git push origin HEAD:refs/heads/migration/core-nth-exact-d1-20261010
