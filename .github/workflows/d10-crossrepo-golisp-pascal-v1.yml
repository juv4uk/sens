name: D10 crossrepo golisp pascal v1

on:
  pull_request:
    paths:
      - "knowledge/d10-crossrepo-golisp-pascal-v1.json"
      - "knowledge/d10-v1-semantic-inventory.json"
      - "knowledge/d10-fill-v1-state.json"
      - "scripts/check-d10-crossrepo-golisp-pascal-v1.py"
      - "scripts/check-d10-v1-semantic-inventory.py"
      - ".github/workflows/d10-crossrepo-golisp-pascal-v1.yml"
  push:
    branches: [main]
    paths:
      - "knowledge/d10-crossrepo-golisp-pascal-v1.json"
      - "knowledge/d10-v1-semantic-inventory.json"
      - "knowledge/d10-fill-v1-state.json"
      - "scripts/check-d10-crossrepo-golisp-pascal-v1.py"
      - ".github/workflows/d10-crossrepo-golisp-pascal-v1.yml"
  workflow_dispatch:

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Verify golisp/pascal harvest
        run: python3 scripts/check-d10-crossrepo-golisp-pascal-v1.py
      - name: Verify global D10 inventory
        run: python3 scripts/check-d10-v1-semantic-inventory.py
      - name: Verify all-repo donor accounting
        run: python3 scripts/check-d10-owner-repo-donor-matrix-v2.py
