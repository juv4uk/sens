name: D9 overflow review v1

on:
  pull_request:
    paths:
      - "knowledge/d9-overflow-review-v1.json"
      - "knowledge/d9-fill-v1-state.json"
      - "knowledge/d8-v2-overflow-ledger.json"
      - "knowledge/d1-d8-foundation.json"
      - "scripts/check-d9-overflow-review-v1.py"
      - "scripts/check-d9-fill-v1-seed.py"
      - ".github/workflows/d9-overflow-review-v1.yml"
  push:
    branches: [main]
    paths:
      - "knowledge/d9-overflow-review-v1.json"
      - "knowledge/d9-fill-v1-state.json"
      - "scripts/check-d9-overflow-review-v1.py"
      - ".github/workflows/d9-overflow-review-v1.yml"
  workflow_dispatch:

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: GPU runner identity
        run: nvidia-smi || true
      - name: Verify D9 selector seed remains valid
        run: python3 scripts/check-d9-fill-v1-seed.py
      - name: Verify overflow review
        run: python3 scripts/check-d9-overflow-review-v1.py
