name: D9 overflow review v1

on:
  workflow_dispatch:

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: GPU runner identity
        run: nvidia-smi || true
      - name: Verify D9 selector seed remains valid
        run: python3 scripts/check-d9-fill-v1-seed.py
      - name: Verify overflow review
        run: python3 scripts/check-d9-overflow-review-v1.py
