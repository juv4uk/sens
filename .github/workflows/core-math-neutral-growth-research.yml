name: Core-Math neutral growth research

on:
  pull_request:
    paths:
      - "docs/research/2433-core-math-neutral-v1.json"
      - "docs/research/2433-core-math-research-projection.json"
      - "docs/research/2433-core-math-generation-certificates.json"
      - "scripts/research-2433-core-math-neutral-growth.py"
      - ".github/workflows/core-math-neutral-growth-research.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  neutral-growth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify language-neutral generated closure with two exact-Q models
        run: python3 scripts/research-2433-core-math-neutral-growth.py --check
