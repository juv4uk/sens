name: safe-batch-t5-migration

# The migrator must run when REAL library sources change, not only when
# somebody edits the migrator. This is an audit, never an automatic publisher.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-migration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Test real Core1 physical T5 conversion and fail-closed batch
        run: python3 -m unittest discover -s tests -p test_migrate_t5m_batch.py -v

      - name: Dry-run REAL lib corpus and preserve blocked ledger (never mint false .sens)
        run: |
          set +e
          python3 scripts/migrate-t5m-batch.py lib \
            --out /tmp/sens-library-batch-mirror \
            --report /tmp/sens-library-batch.json
          rc=$?
          set -e
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ]; then exit "$rc"; fi
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("/tmp/sens-library-batch.json").read_text())
          summary = data["summary"]
          print("REAL LIB MIGRATION CENSUS:", json.dumps(summary, sort_keys=True))
          assert summary["files_seen"] > 0
          assert summary["files_written"] == 0
          assert summary["files_seen"] == summary["files_admitted"] + summary["files_blocked"]
          assert not Path("/tmp/sens-library-batch-mirror").exists()
          # Make the actual reason for ZERO migrated files visible in Actions UI,
          # not just in a downloadable JSON that nobody opens.
          from collections import Counter
          issues = [row for row in data["files"] if row["status"] == "blocked"]
          reasons = Counter(row.get("reason", "unknown") for row in issues)
          with Path(__import__("os").environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as stream:
              stream.write("## Реальна міграція lib/ — тільки перевірка\n\n")
              stream.write(f"- Перевірено: **{summary['files_seen']}**\n")
              stream.write(f"- Допущено: **{summary['files_admitted']}**\n")
              stream.write(f"- BLOCK: **{summary['files_blocked']}**\n")
              stream.write("- **Жоден .sens тут не записано в репозиторій**\n\n")
              stream.write("### Основні причини BLOCK\n\n")
              for reason, count in reasons.most_common(10):
                  safe = reason.replace("|", "∣").replace("\n", " ")[:250]
                  stream.write(f"- {count} × `{safe}`\n")
              stream.write("\nПовний журнал: артефакт `real-lib-t5-migration-ledger`.\n")
          if summary["files_blocked"]:
              print(f"::warning::REAL lib/ migration still BLOCKS {summary['files_blocked']} files; inspect artifact")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: real-lib-t5-migration-ledger
          path: /tmp/sens-library-batch.json
