name: safe-batch-t5-migration

on:
  pull_request:
    paths:
      - 'lib/**/*.lisp'
      - 'scripts/**/*.lisp'
      - 'scripts/migrate-three-pass.py'
      - 'scripts/migrate-t5-batch.py'
      - 'scripts/sens_t5_codec.py'
      - 'tests/test_migrate_t5_batch.py'
      - 'knowledge/d1-d9-foundation.json'
      - 'contracts/core1-historical-sid-map.lisp'
      - 'crates/sens/src/domain_surface_registry_generated.rs'
      - 'crates/sens/src/semantic_registry_generated.rs'
      - 'crates/sens/src/text7_projection_generated.rs'
      - '.github/workflows/migrate-t5-batch.yml'
      - 'docs/MIGRATE-T5-BATCH.uk.md'
  push:
    branches: [main]
    paths:
      - 'lib/**/*.lisp'
      - 'scripts/**/*.lisp'
      - 'scripts/migrate-three-pass.py'
      - 'scripts/migrate-t5-batch.py'
      - 'scripts/sens_t5_codec.py'
      - 'tests/test_migrate_t5_batch.py'
      - 'knowledge/d1-d9-foundation.json'
      - 'contracts/core1-historical-sid-map.lisp'
      - 'crates/sens/src/domain_surface_registry_generated.rs'
      - 'crates/sens/src/semantic_registry_generated.rs'
      - 'crates/sens/src/text7_projection_generated.rs'
      - '.github/workflows/migrate-t5-batch.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-migration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Test physical Core1 T5 conversion and fail-closed batch
        run: python3 -m unittest discover -s tests -p test_migrate_t5_batch.py -v

      - name: Dry-run existing lib/ and scripts/ Lisp sources through REAL batch driver
        shell: bash
        run: |
          set +e
          python3 scripts/migrate-t5-batch.py lib scripts \
            --out /tmp/sens-active-source-t5-mirror \
            --report /tmp/sens-active-source-t5-ledger.json
          rc=$?
          set -e
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ]; then exit "$rc"; fi
          python3 - <<'PY'
          import collections
          import json
          import os
          from pathlib import Path
          path = Path("/tmp/sens-active-source-t5-ledger.json")
          report = json.loads(path.read_text(encoding="utf-8"))
          counts = report["summary"]
          assert counts["files_seen"] > 0
          assert counts["files_written"] == 0
          assert counts["files_seen"] == counts["files_admitted"] + counts["files_blocked"]
          assert not Path("/tmp/sens-active-source-t5-mirror").exists()
          print("ACTUAL lib/ + scripts/ T5 batch audit:", json.dumps(counts, sort_keys=True))
          blocked = [row for row in report["files"] if row["status"] == "blocked"]
          reasons = collections.Counter(row.get("reason", "unknown").split(":")[0] for row in blocked)
          md = [
            "## SENS physical T5 migration — actual active source audit",
            "",
            "This workflow **uses** the merged `scripts/migrate-t5-batch.py` against",
            "real existing `lib/` and `scripts/` files, not only fixture canaries.",
            "It is **dry-run only**; it does not write or publish `.sens`.",
            "",
            "| Scanned | Mechanically admitted | Blocked | Actually written |",
            "| ---: | ---: | ---: | ---: |",
            f"| {counts['files_seen']} | {counts['files_admitted']} | {counts['files_blocked']} | {counts['files_written']} |",
            "",
            "**Mechanical admission is NOT proof of semantic/oracle equivalence.**",
            "No blocked file has been converted. See attached complete per-file JSON ledger.",
            "",
            "### Most common blockers",
            "| Count | Blocker (not silently mapped) |",
            "| ---: | --- |",
          ]
          for reason, count in reasons.most_common(12):
              md.append(f"| {count} | {reason.replace('|', chr(92)+'|')[:180]} |")
          md += ["", "### First blocked paths for agents", "| File | Reason |",
                 "| --- | --- |"]
          for row in blocked[:12]:
              name = row["path"].replace("|", "/")
              why = row.get("reason", "unknown").replace("|", "/").replace("\n", " ")
              md.append(f"| `{name}` | {why[:180]} |")
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as stream:
                  stream.write("\n".join(md) + "\n")
          else:
              print("\n".join(md))
          PY

      - name: Upload per-file ORIGINAL lib/scripts migration blockers
        uses: actions/upload-artifact@v4
        with:
          name: active-lib-scripts-t5-migration-ledger
          path: /tmp/sens-active-source-t5-ledger.json
          if-no-files-found: error
