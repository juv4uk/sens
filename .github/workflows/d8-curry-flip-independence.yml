name: D8 CURRY-FLIP independence research

on:
  pull_request:
    paths:
      - "benchmarks/d8-curry-flip-independence/**"
      - "knowledge/d6-ratified.json"
      - ".github/workflows/d8-curry-flip-independence.yml"
  push:
    branches:
      - main
    paths:
      - "benchmarks/d8-curry-flip-independence/**"
      - "knowledge/d6-ratified.json"
      - ".github/workflows/d8-curry-flip-independence.yml"
  workflow_dispatch:

jobs:
  falsifier:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Run exhaustive dependent-axis falsifier
        run: |
          rm -rf /tmp/d8-curry-flip-independence
          python3 benchmarks/d8-curry-flip-independence/run.py \
            --out /tmp/d8-curry-flip-independence
      - name: Verify deterministic replay
        run: |
          rm -rf /tmp/d8-curry-flip-independence-2
          python3 benchmarks/d8-curry-flip-independence/run.py \
            --out /tmp/d8-curry-flip-independence-2
          cmp /tmp/d8-curry-flip-independence/witness.json \
              /tmp/d8-curry-flip-independence-2/witness.json
      - name: Publish report
        if: always()
        run: |
          test ! -f /tmp/d8-curry-flip-independence/report.md || \
            cat /tmp/d8-curry-flip-independence/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: d8-curry-flip-independence
          path: /tmp/d8-curry-flip-independence/
          retention-days: 14
