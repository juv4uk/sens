name: Core4 FASL refresh once

on:
  pull_request:
    paths:
      - 'lib/core4.lisp'
      - 'lib/core4.lisp.fasl'
      - '.github/workflows/core4-fasl-refresh-once.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: core4-fasl-refresh-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: core4-fasl-refresh-3658

      - name: Regenerate exact current Core4 FASL
        run: |
          set -euo pipefail
          cargo run --release -p sens-cli --bin gen-fasl --             lib/core4.lisp lib/core4.lisp.fasl
          test -s lib/core4.lisp.fasl

      - name: Commit only the generated binary when changed
        run: |
          set -euo pipefail
          if git diff --quiet -- lib/core4.lisp.fasl; then
            echo "Core4 FASL already current"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- lib/core4.lisp.fasl
          git diff --cached --name-only
          test "$(git diff --cached --name-only)" = "lib/core4.lisp.fasl"
          git commit -m "build(3658): refresh Core4 FASL"
          git push origin "HEAD:${{ github.head_ref || github.ref_name }}"
