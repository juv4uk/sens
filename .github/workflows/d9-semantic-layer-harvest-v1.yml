name: D9 semantic layer harvest v1

on:
  pull_request:
    paths:
      - "lib/content-store.lisp"
      - "lib/result-status.lisp"
      - "lib/narrate.lisp"
      - "lib/understand.lisp"
      - "lib/utf8.lisp"
      - "lib/translation.lisp"
      - "lib/guard.lisp"
      - "knowledge/d9-semantic-layer-harvest-v1.json"
      - "knowledge/d9-v1-semantic-inventory.json"
      - "knowledge/d9-fill-v1-state.json"
      - "scripts/check-d9-semantic-layer-harvest-v1.py"
      - "scripts/check-d9-v1-semantic-inventory.py"
      - "scripts/check-d9-registry-tail-v1.py"
      - ".github/workflows/d9-semantic-layer-harvest-v1.yml"
  push:
    branches: [main]
    paths:
      - "knowledge/d9-semantic-layer-harvest-v1.json"
      - "knowledge/d9-v1-semantic-inventory.json"
      - "knowledge/d9-fill-v1-state.json"
      - "scripts/check-d9-semantic-layer-harvest-v1.py"
      - ".github/workflows/d9-semantic-layer-harvest-v1.yml"
  workflow_dispatch:

jobs:
  semantic-layer:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: GPU runner identity
        run: nvidia-smi || true
      - name: Verify semantic-layer harvest
        run: python3 scripts/check-d9-semantic-layer-harvest-v1.py
      - name: Verify global D9 inventory
        run: python3 scripts/check-d9-v1-semantic-inventory.py
      - name: Preserve registry-tail tranche
        run: python3 scripts/check-d9-registry-tail-v1.py
      - name: Preserve library tranche
        run: python3 scripts/check-d9-library-harvest-v1.py
      - name: Preserve surface tranche
        run: python3 scripts/check-d9-surface-harvest-v1.py
      - name: Preserve local-law tranche
        run: python3 scripts/check-d9-laws-1.py
