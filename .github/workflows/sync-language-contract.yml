name: Sync sens language contract into consumer

on:
  workflow_call:
    inputs:
      contract_path:
        description: Vendored language-contract.lisp path in the consumer repository
        required: false
        type: string
        default: contracts/my-lisp/language-contract.lisp
      lock_path:
        description: Generated lock record path in the consumer repository
        required: false
        type: string
        default: contracts/my-lisp/lock.lisp

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      UPSTREAM_REPO: juv4uk/sens
      UPSTREAM_BRANCH: main
      UPSTREAM_PATH: language-contract.lisp
      TARGET_PATH: ${{ inputs.contract_path }}
      LOCK_PATH: ${{ inputs.lock_path }}
    steps:
      - name: Check out consumer default branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      - name: Fetch exact upstream contract and write lock
        id: sync
        shell: bash
        run: |
          set -euo pipefail

          # Pin the latest commit that actually changed the contract file.
          # Unrelated sens commits must not create downstream churn.
          contract_revision="$(
            curl -fsSL \
              "https://api.github.com/repos/${UPSTREAM_REPO}/commits?sha=${UPSTREAM_BRANCH}&path=${UPSTREAM_PATH}&per_page=1" \
              | jq -r '.[0].sha'
          )"
          [[ "$contract_revision" =~ ^[0-9a-f]{40}$ ]]

          mkdir -p "$(dirname "$TARGET_PATH")" "$(dirname "$LOCK_PATH")"
          curl -fsSL \
            "https://raw.githubusercontent.com/${UPSTREAM_REPO}/${contract_revision}/${UPSTREAM_PATH}" \
            -o "$TARGET_PATH"

          digest="$(sha256sum "$TARGET_PATH" | awk '{print $1}')"

          cat > "$LOCK_PATH" <<EOF
          ; Generated by juv4uk/sens/.github/workflows/sync-language-contract.yml
          ; This pins the observed upstream authority. It does NOT claim that the
          ; consumer implements the pinned contract version.
          (contract-lock
            (source
              (repository ${UPSTREAM_REPO})
              (branch ${UPSTREAM_BRANCH})
              (path ${UPSTREAM_PATH}))
            (revision "${contract_revision}")
            (sha256 "${digest}"))
          EOF

          # Fail closed before writing anything upstream.
          actual_digest="$(sha256sum "$TARGET_PATH" | awk '{print $1}')"
          test "$actual_digest" = "$digest"
          curl -fsSL \
            "https://raw.githubusercontent.com/${UPSTREAM_REPO}/${contract_revision}/${UPSTREAM_PATH}" \
            -o /tmp/language-contract.lisp
          cmp --silent "$TARGET_PATH" /tmp/language-contract.lisp

          if [ -n "$(git status --porcelain -- "$TARGET_PATH" "$LOCK_PATH")" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
          echo "contract_revision=${contract_revision}" >> "$GITHUB_OUTPUT"

      - name: Commit passive snapshot to consumer default branch
        if: steps.sync.outputs.changed == 'true'
        env:
          CONTRACT_REVISION: ${{ steps.sync.outputs.contract_revision }}
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.repository.default_branch }}"
          test -n "$base"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$TARGET_PATH" "$LOCK_PATH"
          git commit -m "chore(contract): observe sens contract ${CONTRACT_REVISION}"
          git push origin "HEAD:refs/heads/${base}"
