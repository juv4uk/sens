name: Verify 333 proven-byte read-file

on:
  workflow_dispatch:
jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/install-zig
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: verify-333-proven-byte-readfile
      - name: Build SENS CLI
        run: cargo build -p sens-cli --bin sens
      - name: Measure proven-byte read-file candidate
        run: |
          /usr/bin/time -f 'proven_byte_profile_wall_seconds=%e' \
            ./target/debug/sens scripts/profile-proven-byte-readfile-candidate.lisp
