name: "Тимчасове відновлення Core4 symbol? FASL (#5408)"
on:
  push:
    branches:
      - fix/5408-core4-symbol-predicate-20261010
    paths:
      - lib/core.lisp
      - lib/core4.lisp
      - .github/workflows/5408-symbol-fasl-once.yml
permissions:
  contents: write
jobs:
  regenerate-on-isolated-branch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/5408-core4-symbol-predicate-20261010
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Перевірити ізольований HEAD
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "fix/5408-core4-symbol-predicate-20261010"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --check
      - name: Перегенерувати автентичний двійковий FASL
        run: cargo run --locked -p sens-cli --bin gen-fasl -- lib/core4.lisp lib/core4.lisp.fasl
      - name: Перевірити AST, SHA, D6-прив'язки та негативний контроль
        run: cargo test --locked -p sens --test core_fasl_freshness -- --nocapture
      - name: Зберегти лише перевірений FASL у цій гілці
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "fix/5408-core4-symbol-predicate-20261010"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git add -- lib/core4.lisp.fasl
          if git diff --cached --quiet; then
            echo "FASL незмінний"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "збірка(5408): перевірена Core4 FASL після точного symbol?"
          git push origin HEAD:refs/heads/fix/5408-core4-symbol-predicate-20261010
