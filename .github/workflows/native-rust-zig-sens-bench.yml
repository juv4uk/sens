name: SENS — конкурс: Rust механізм / Zig коридор / SENS логіка

# Ручний конкурс на трьох незалежних осях. Не релізний гейт.
# Rust не визначає семантику, Zig не визначає логіку, SENS не підміняє транспорт.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-mechanism:
    name: Rust — механізм exact-width ingestion
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 pinned
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.99.0
      - name: Виміряти Rust reader без семантичного оракула
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/bench-rust-mechanism"
          mkdir -p "$out"
          { echo "sha=$GITHUB_SHA"; rustc --version; cargo --version; uname -m; } > "$out/environment.txt"
          CARGO_BUILD_JOBS=2 cargo run --locked --release -p sens \
            --example packed_vs_visible_bench -- --samples 15 \
            > "$out/raw.tsv" 2> "$out/build.log"
          test "$(grep -c '^RUST_PACKED_VISIBLE_SAMPLE[[:space:]]' "$out/raw.tsv" || true)" -eq 75
          test "$(grep -c '^RUST_PACKED_VISIBLE_SUMMARY[[:space:]]' "$out/raw.tsv" || true)" -eq 5
          grep '^RUST_PACKED_VISIBLE_SUMMARY[[:space:]]' "$out/raw.tsv"
      - name: Сирі виміри Rust
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 pinned
        with:
          name: bench-rust-mechanism-${{ github.sha }}
          path: ${{ runner.temp }}/bench-rust-mechanism/
          if-no-files-found: warn
          retention-days: 14

  zig-corridor:
    name: Zig — точність і пропускна здатність T5M
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 pinned
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-zig
      - name: Перевірити фізичний коридор до вимірювання
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/bench-zig-corridor"
          mkdir -p "$out"
          { echo "sha=$GITHUB_SHA"; zig version; uname -m; } > "$out/environment.txt"
          zig test -lc research/zig-codecs/tests.zig > "$out/codec-tests.log" 2>&1
          zig test -O ReleaseFast -lc bench_t5m_test.zig > "$out/t5m-tests.log" 2>&1
          zig run -O ReleaseFast -lc bench_t5m.zig > "$out/raw.tsv" 2>&1
          test "$(grep -c '^ZIG_T5M_SAMPLE ' "$out/raw.tsv" || true)" -eq 11
          test "$(grep -c '^ZIG_T5M_BENCH ' "$out/raw.tsv" || true)" -eq 1
          grep '^ZIG_T5M_BENCH ' "$out/raw.tsv"
      - name: Сирі виміри Zig
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 pinned
        with:
          name: bench-zig-corridor-${{ github.sha }}
          path: ${{ runner.temp }}/bench-zig-corridor/
          if-no-files-found: warn
          retention-days: 14

  sens-semantics:
    name: SENS — нативний закон і негативний мутант
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 pinned
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: ./.github/actions/install-zig
      - name: Виконати SENS-власний закон через Zig/T5M
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/bench-sens-semantics"
          mkdir -p "$out"
          { echo "sha=$GITHUB_SHA"; rustc --version; zig version; uname -m; } > "$out/environment.txt"
          CARGO_BUILD_JOBS=2 cargo build --locked -p sens-cli --bin sens > "$out/build.log" 2>&1 || {
            cat "$out/build.log" >&2
            exit 1
          }
          bash scripts/prove-бенчмарк-структура.sh "$PWD/target/debug/sens" > "$out/native-law.log" 2>&1 || {
            cat "$out/native-law.log" >&2
            exit 1
          }
          grep -q '^БЕНЧМАРК_СТРУКТУРА=PASS native=SENS positive=D1:так mutant=D1:ні samples=11 ' "$out/native-law.log"
          cat "$out/native-law.log"
      - name: Нативний доказ SENS і його час
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 pinned
        with:
          name: bench-sens-semantics-${{ github.sha }}
          path: ${{ runner.temp }}/bench-sens-semantics/
          if-no-files-found: warn
          retention-days: 14
