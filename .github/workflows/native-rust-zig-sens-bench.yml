name: "SENS — три незалежні заліки: Rust механізм, Zig коридор, SENS логіка"

# Лише ручний дослід: власник дозволив один автоматичний workflow (ci.yml).
# Результати на shared runner — виміри, а не допуск релізу чи доказ прискорення.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-triad:
    name: Rust host-механізм / Zig T5M коридор / SENS самосвідки
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 pinned
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: ./.github/actions/install-zig

      - name: Rust host-виклик Zig проти прямого Zig — лише механічна ціна
        shell: bash
        timeout-minutes: 18
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/native-triad"
          mkdir -p "$out"
          {
            echo "commit=$GITHUB_SHA"
            echo "runner=${RUNNER_NAME:-unknown}"
            echo "arch=$(uname -m)"
            cargo --version
            rustc --version
            zig version
          } > "$out/environment.txt"
          # RAPL — Rust-mechanism lane. Check physical counter identity without
          # attributing any GitHub-hosted package joules to the SENS process.
          rustc --edition=2021 -O benchmarks/mechanism/rapl-energy-bench.rs \
            -o "$out/rapl-energy" >> "$out/rapl-build.log" 2>&1
          echo 'RAPL_STATUS=NOT_MEASURED reason=shared_GitHub_runner_no_isolated_physical_meter' \
            > "$out/rapl-status.txt"
          # Rust: накладні витрати host-виклику Zig-owned T5M, НЕ власний T5-кодек або Lisp-оракул.
          CARGO_BUILD_JOBS=2 cargo run --locked --release -p sens \
            --example zig_t5_matched_bench > "$out/rust-raw.log" 2> "$out/rust-build.log"
          # Zig 0.16: власний monotonic clock_gettime, без вилученого std.time.Timer.
          zig build-exe -O ReleaseFast -lc research/zig-codecs/t5/bench.zig \
            -femit-bin="$out/zig-t5-bench" > "$out/zig-build.log" 2>&1
          "$out/zig-t5-bench" > "$out/zig-raw.log" 2>&1
          grep -E '^(fixture|physical) impl=rust ' "$out/rust-raw.log" \
            | sed 's/ impl=rust//' > "$out/rust-fixtures.txt"
          grep -E '^(fixture|physical) impl=zig ' "$out/zig-raw.log" \
            | sed 's/ impl=zig//' > "$out/zig-fixtures.txt"
          test "$(wc -l < "$out/rust-fixtures.txt")" -eq 8
          test "$(wc -l < "$out/zig-fixtures.txt")" -eq 8
          if ! diff -u "$out/rust-fixtures.txt" "$out/zig-fixtures.txt"; then
            echo '::error title=Rust/Zig T5::REGRESSION layer=transport expected=byte-exact-fixture-parity actual=divergent'
            exit 1
          fi
          grep '^sample impl=rust ' "$out/rust-raw.log" > "$out/rust-samples.txt"
          grep '^sample impl=zig ' "$out/zig-raw.log" > "$out/zig-samples.txt"
          test "$(wc -l < "$out/rust-samples.txt")" -eq 40
          test "$(wc -l < "$out/zig-samples.txt")" -eq 40
          echo '::notice title=Rust host/Zig corridor::PASS fixture_forms=1,16,128,1024 equal_bytes=true native_samples=40-per-path scope=transport-fixture-only-not-semantic-proof'

      - name: Rust-механізм і Zig-коридор на одному бінарному корпусі
        shell: bash
        timeout-minutes: 4
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/native-triad"
          mkdir -p "$out"
          # Лише Rust-фізика RAPL; unit-тести не мають мовного SENS-оракула.
          rustc --test benchmarks/mechanism/rapl-energy-bench.rs -o "$out/rapl-unit"
          "$out/rapl-unit" > "$out/rapl-unit.log" 2>&1
          rustc -O benchmarks/mechanism/rust-byte-copy-bench.rs -o "$out/rust-copy"
          "$out/rust-copy" > "$out/rust-copy.log" 2>&1
          grep -q 'RUST_BYTE_COPY_BENCH source=lib/core4.lisp' "$out/rust-copy.log"
          # Rust і Zig копіюють однакові сирі байти наявної проєкції .lisp; це НЕ семантика.
          zig test -O ReleaseFast -lc benchmarks/mechanism/zig-byte-copy-bench.zig > "$out/zig-copy.log" 2>&1
          grep -q 'ZIG_CORRIDOR_COPY_BENCH source=lib/core4.lisp' "$out/zig-copy.log"
          echo '::notice title=Benchmark lanes::Rust/Zig raw byte-copy + RAPL counter arithmetic recorded; SENS semantic verdict separate'
          # На shared runner RAPL не припускаємо; джоулі без датчика НЕ друкуємо.

      - name: SENS — Lisp-закон → Zig/T5M → самостійні фізичні виміри
        shell: bash
        timeout-minutes: 16
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/native-triad"
          mkdir -p "$out"
          CARGO_BUILD_JOBS=2 cargo build --locked -p sens-cli --bin sens --bin sens-trit \
            --features benchmark-ast-visits > "$out/sens-build.log" 2>&1
          sens="$PWD/target/debug/sens"
          trit="$PWD/target/debug/sens-trit"
          test -x "$sens" && test -x "$trit"
          printf 'source\trepeat\twall_ns\tphysical_bytes\tcommit\trunner\n' \
            > "$out/sens-samples.tsv"
          for source in tests/semantic/d1-not-law.lisp tests/semantic/d3-structural-native-t5m-law.lisp; do
            id="$(basename "$source" .lisp)"
            dir="$out/$id"
            mkdir -p "$dir"
            physical="$dir/program.sens"
            timeout 45s "$sens" "$source" > "$dir/direct.out" 2> "$dir/direct.err"
            # verify-view читає парний безрозширений sibling ($dir/program),
            # не view.txt; --t5m-mint-pair публікує його разом із носієм.
            timeout 45s "$sens" --t5m-mint-pair "$source" "$physical" > "$dir/mint.out" 2> "$dir/mint.err"
            test -s "$physical"
            timeout 45s "$trit" open "$physical" > "$dir/view.txt"
            timeout 45s "$trit" verify-view "$physical" > "$dir/verify.txt"
            timeout 45s "$sens" --t5m-pair "$source" "$physical" > "$dir/paired.out" 2> "$dir/paired.err"
            timeout 45s "$sens" "$physical" > "$dir/standalone.out" 2> "$dir/standalone.err"
            cmp "$dir/direct.out" "$dir/paired.out"
            cmp "$dir/paired.out" "$dir/standalone.out"
            if [[ "$(tail -n 1 "$dir/standalone.out")" != 1 ]]; then
              echo "::error file=$source,title=SENS::REGRESSION layer=semantics expected=D1:1 actual=other"
              exit 1
            fi
            physical_bytes="$(wc -c < "$physical" | tr -d ' ')"
            timeout 45s "$sens" "$physical" > "$dir/warmup.out" 2> "$dir/warmup.err"
            cmp "$dir/standalone.out" "$dir/warmup.out"
            : > "$dir/samples.ns"
            for repeat in 1 2 3 4 5 6 7; do
              started="$(date +%s%N)"
              timeout 45s "$sens" "$physical" > "$dir/sample-$repeat.out" 2> "$dir/sample-$repeat.err"
              finished="$(date +%s%N)"
              cmp "$dir/standalone.out" "$dir/sample-$repeat.out"
              elapsed="$((finished - started))"
              if (( elapsed <= 0 )); then
                echo "::error file=$source,title=SENS::REGRESSION layer=clock expected=positive-wall-ns actual=$elapsed"
                exit 1
              fi
              printf '%s\n' "$elapsed" >> "$dir/samples.ns"
              printf '%s\t%s\t%s\t%s\t%s\t%s\n' \
                "$source" "$repeat" "$elapsed" "$physical_bytes" \
                "$GITHUB_SHA" "${RUNNER_NAME:-unknown}" >> "$out/sens-samples.tsv"
            done
            median_ns="$(sort -n "$dir/samples.ns" | sed -n '4p')"
            echo "::notice file=$source,title=SENS physical::MEASURED p50_wall_ns=$median_ns samples=7 warmup=1 scope=CLI_bootstrap_eval codec=Zig/T5M output_parity=direct-paired-standalone release=NOT_CERTIFIED"
          done

      - name: Сирі бенчмарки та байтові докази
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 pinned
        with:
          name: sens-native-triad-${{ github.sha }}
          path: ${{ runner.temp }}/native-triad/
          if-no-files-found: warn
          retention-days: 14
