name: Time migration witness

on:
  pull_request:
    paths:
      - "lib/time.lisp"
      - ".github/workflows/time-migration-1635.yml"

jobs:
  time-domain:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: time-migration-1635
      - name: Time and NTP semantic witnesses
        run: cargo test -p sens --test clock --test time_host_surface
