name: migration-quote-cohort

on:
  pull_request:
    paths:
      - 'tests/fixtures/migration-quote-cohort/**'
      - 'tests/test_migration_quote_cohort.py'
      - 'crates/sens/tests/migration_quote_cohort.rs'
      - '.github/workflows/migration-quote-cohort.yml'
  push:
    branches: [main]
    paths:
      - 'tests/fixtures/migration-quote-cohort/**'
      - 'tests/test_migration_quote_cohort.py'
      - 'crates/sens/tests/migration_quote_cohort.rs'
      - '.github/workflows/migration-quote-cohort.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Three passes + true T5 artifact + negative controls
        run: python3 -m unittest discover -s tests -p 'test_migration_quote_cohort.py' -v
      - name: Current SENS oracle executes the physical migrated program
        run: cargo test -p sens --test migration_quote_cohort
