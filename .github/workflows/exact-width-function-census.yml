name: Historical pre-cleanroom exact-width function census

on:
  workflow_dispatch:

jobs:
  historical-census:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Reproduce historical pre-cleanroom census
        run: |
          rm -rf /tmp/function-status-census
          python3 scripts/research-2351-exact-width-function-census.py \
            --historical-pre-cleanroom \
            --check \
            --out /tmp/function-status-census
      - name: Publish summary
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          p=Path("/tmp/function-status-census/function-status-census-summary.json")
          print("## Historical pre-cleanroom exact-width function census — #2351")
          print()
          if not p.exists():
              print("summary missing")
          else:
              s=json.loads(p.read_text())
              c=s["counts"]
              print(f"- active function-like rows: {s['active_function_rows']}")
              print(f"- generated: {c['generated']}")
              print(f"- UNKNOWN: {c['UNKNOWN']}")
              print(f"- proven roots: {c['root']}")
              print(f"- bounded residue: {c['residue']}")
              print(f"- generated lower bound: {s['generated_fraction_of_active_rows']:.1%}")
              print()
              print("HISTORICAL ONLY: these counts predate bīja3 A / D4 clean-room #3225 and are not current semantic census authority.")
              print("UNKNOWN is not an independent-root claim.")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: historical-pre-cleanroom-exact-width-function-census
          path: /tmp/function-status-census/
          retention-days: 14
