name: Triple projection gate

# #4250 / #4430 release contour: every admitted executable program has three
# same-stem projections — uk .lisp, physical .sens, extensionless spaced-bit view.
# This gate is FAIL-CLOSED on: a broken view<->.sens round-trip, a word with no
# ratified uk surface, and a non-canonical view.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  triple:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # view edge + uk edge, over the admitted fixtures (fail-closed)
      - name: Triple-projection check (view + uk)
        run: bash scripts/check-triple-projection.sh

      # classify sources and report admitted triples with SHAs + typed-word digest
      - name: Triple inventory (classify + digests)
        run: python3 scripts/sens_inventory.py lib tests/fixtures --json /tmp/inventory.json

      - name: Upload inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: triple-inventory
          path: /tmp/inventory.json
          if-no-files-found: warn
