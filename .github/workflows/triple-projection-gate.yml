name: Triple projection gate

# Ручний gate перевіряє лише чинні native SENS/T5M механізми.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  triple:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: ./.github/actions/install-zig
      - name: Зібрати нативні механізми SENS/T5M
        run: cargo build --locked -p sens-cli --bin sens --bin sens-trit --features benchmark-ast-visits
      - name: Перевірити чинні джерела й мовні закони
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/check-current-authority-docs.sh
          bash scripts/check-language-policy-archive.sh
          bash scripts/check-sens-only-semantic-tests.sh
          bash scripts/check-sens-rust-zig-only-tests.sh
          bash scripts/prove-lisp-language-laws.sh "$PWD/target/debug/sens"
          bash scripts/prove-d8-products-main.sh "$PWD/target/debug/sens"
      - name: Перевірити канонічну фізичну трійку
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/check-triple-projection.sh \
            --fixture tests/fixtures/migration-d1-cond-cohort/branch.lisp
      - name: Показати стан решти історичних трійок
        shell: bash
        run: |
          set -euo pipefail
          set +e
          bash scripts/check-triple-projection.sh > "$RUNNER_TEMP/triple-debt.log" 2>&1
          result=$?
          set -e
          cat "$RUNNER_TEMP/triple-debt.log"
          if (( result == 0 )); then
            echo 'Усі трійки стандартного набору пройшли нативну перевірку.' >> "$GITHUB_STEP_SUMMARY"
          elif (( result == 2 )); then
            echo 'У повному наборі лишилися непідтверджені історичні трійки; це не допускає їх до релізу.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Неочікуваний код завершення перевірки трійок: $result" >&2
            exit 1
          fi
