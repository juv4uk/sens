name: Verify 419 Canon sculpture research

on:
  workflow_dispatch:
jobs:
  research-probes:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/install-zig
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: verify-419-canon-sculpt-research

      - name: Quote ordinary-function route is genuinely RED
        shell: bash
        run: |
          set +e
          output=$(cargo run -q -p sens-cli --bin sens -- docs/research/canon-sculpt-probes/quote-ordinary-function-red.lisp 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -eq 0 ]; then
            echo 'Expected quote ordinary-function probe to fail, but it succeeded.' >&2
            exit 1
          fi
          printf '%s\n' "$output" | grep -Eqi 'UnknownSymbol|unknown symbol|nevidomyi symvol|unbekanntes Symbol'

      - name: Ordinary eager application cannot skip an unused branch
        shell: bash
        run: |
          set +e
          output=$(cargo run -q -p sens-cli --bin sens -- docs/research/canon-sculpt-probes/selective-evaluation-ordinary-function-red.lisp 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -eq 0 ]; then
            echo 'Expected selective-evaluation ordinary-function probe to fail, but it succeeded.' >&2
            exit 1
          fi
          printf '%s\n' "$output" | grep -Eqi 'UnknownSymbol|unknown symbol|nevidomyi symvol|unbekanntes Symbol'

      - name: Canonical explicit-result COND witness remains green
        run: cargo test -p sens --test quantity_d1_direct_cutover cond_short_circuit_does_not_evaluate_unsupported_branch -- --exact --nocapture

      - name: Verification-only child has no whitespace errors
        run: git diff --check "origin/${{ github.base_ref }}...HEAD"
