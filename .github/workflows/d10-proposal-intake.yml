name: D10 proposal intake

on:
  pull_request:
    paths:
      - AGENTS.md
      - docs/architecture/ARCHIPELAGO-V1.uk.md
      - docs/architecture/D10-PROPOSAL-WORKFLOW.uk.md
      - knowledge/d10-proposal-ledger.tsv
      - knowledge/d10-v1-semantic-inventory.json
      - knowledge/d10-selection-transition-history.json
      - knowledge/d10-growth-baseline-v1.json
      - tests/test_d10_proposal_ledger_growth.py
      - scripts/check-d10-proposal-ledger.py
      - .github/workflows/d10-proposal-intake.yml
  push:
    branches:
      - main
    paths:
      - knowledge/d10-proposal-ledger.tsv
      - knowledge/d10-v1-semantic-inventory.json
      - knowledge/d10-selection-transition-history.json
      - knowledge/d10-growth-baseline-v1.json
      - docs/architecture/ARCHIPELAGO-V1.uk.md
      - scripts/check-d10-proposal-ledger.py
      - tests/test_d10_proposal_ledger_growth.py
      - .github/workflows/d10-proposal-intake.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Перевірити D10 intake та негативні контролі
        run: python3 scripts/check-d10-proposal-ledger.py --self-test
      - name: Негативні свідки оптимізованого Python для D10
        shell: bash
        run: |
          set -euo pipefail
          for mode in cli env; do
            log="$RUNNER_TEMP/d10-intake-optimized-$mode.log"
            if [[ "$mode" == cli ]]; then
              if python3 -O scripts/check-d10-proposal-ledger.py --self-test >"$log" 2>&1; then
                echo "::error::D10 intake помилково прийняв Python -O"
                exit 1
              fi
            else
              if PYTHONOPTIMIZE=2 python3 scripts/check-d10-proposal-ledger.py --self-test >"$log" 2>&1; then
                echo "::error::D10 intake помилково прийняв PYTHONOPTIMIZE=2"
                exit 1
              fi
            fi
            if ! grep -Fq "D10-PROPOSAL-LEDGER: BLOCKED" "$log"; then
              cat "$log"
              echo "::error::D10 intake відмовив без названої причини"
              exit 1
            fi
          done
      - name: Перевірити контракти зростання й 10 негативних випадків
        run: python3 -m unittest discover -s tests -p test_d10_proposal_ledger_growth.py -v
