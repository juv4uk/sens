name: D10 proposal intake

on:
  pull_request:
    paths:
      - AGENTS.md
      - docs/agent-doctrine.md
      - docs/architecture/ARCHIPELAGO-V1.uk.md
      - docs/architecture/D10-PROPOSAL-WORKFLOW.uk.md
      - knowledge/d10-proposal-ledger.tsv
      - knowledge/d10-v1-semantic-inventory.json
      - knowledge/d10-selection-transition-history.json
      - knowledge/d10-growth-baseline-v1.json
      - tests/test_d10_proposal_ledger_growth.py
      - scripts/check-d10-proposal-ledger.py
      - .github/workflows/d10-proposal-intake.yml
  push:
    branches:
      - main
    paths:
      - knowledge/d10-proposal-ledger.tsv
      - knowledge/d10-v1-semantic-inventory.json
      - knowledge/d10-selection-transition-history.json
      - knowledge/d10-growth-baseline-v1.json
      - docs/architecture/ARCHIPELAGO-V1.uk.md
      - docs/architecture/D10-PROPOSAL-WORKFLOW.uk.md
      - docs/agent-doctrine.md
      - scripts/check-d10-proposal-ledger.py
      - tests/test_d10_proposal_ledger_growth.py
      - .github/workflows/d10-proposal-intake.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Перевірити D10 intake, append-only та нові selection-переходи
        env:
          D10_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          python3 scripts/check-d10-proposal-ledger.py --self-test
          python3 -m unittest discover -s tests -p test_d10_proposal_ledger_growth.py -v
          python3 scripts/check-d10-proposal-ledger.py --base-ref "$D10_BASE_REF"
