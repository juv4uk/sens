name: D6 set lattice research

on:
  workflow_dispatch:

jobs:
  lattice:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Run coordinate-independent set lattice witness
        run: |
          rm -rf /tmp/d6-set-lattice
          echo "FOREIGN_LANGUAGE_TEST_OR_BENCH=EXCLUDED_BY_POLICY native_equivalent=NOT_VERIFIED"
      - name: Publish report
        if: always()
        run: |
          if test -f /tmp/d6-set-lattice/report.md; then
            cat /tmp/d6-set-lattice/report.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d6-set-lattice
          path: /tmp/d6-set-lattice/
          retention-days: 14
