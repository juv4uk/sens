name: D6 set lattice research

on:
  pull_request:
    paths:
      - "benchmarks/d6-set-lattice/**"
      - ".github/workflows/d6-set-lattice.yml"
  push:
    branches: [main]
    paths:
      - "benchmarks/d6-set-lattice/**"
      - ".github/workflows/d6-set-lattice.yml"
  workflow_dispatch:

jobs:
  lattice:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Run coordinate-independent set lattice witness
        run: |
          rm -rf /tmp/d6-set-lattice
          python3 benchmarks/d6-set-lattice/run.py             --out /tmp/d6-set-lattice
      - name: Publish report
        if: always()
        run: |
          if test -f /tmp/d6-set-lattice/report.md; then
            cat /tmp/d6-set-lattice/report.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: d6-set-lattice
          path: /tmp/d6-set-lattice/
          retention-days: 14
