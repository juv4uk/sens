name: Verify content-store D1 clause nesting

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semantic:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Assert original content-store semantic and deterministic history laws
        run: cargo test -p sens --test content_store_authority -- --nocapture
      - name: Assert current D3 COND and D1 PredicateBit contract
        run: cargo test -p sens --test d3_empty_control -- --nocapture
