name: D7 — ASCII-клавіатура та точні 7-бітні імена

on:
  pull_request:
    paths:
      - "crates/sens/src/text7.rs"
      - ".github/workflows/text7-ascii-exact-w7.yml"
  push:
    branches: [main]
    paths:
      - "crates/sens/src/text7.rs"
      - ".github/workflows/text7-ascii-exact-w7.yml"

jobs:
  ascii-w7:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Вичерпна перевірка всіх 128 клавіатурних координат
        run: cargo test --locked -p sens --lib text7::tests::d7_v2_ascii_128_exact_coordinates_without_sid8_widening -- --exact
      - name: Фізичні golden-байти імені та відхилення пошкодженого заповнення
        run: cargo test --locked -p sens --lib text7::tests::d7_v2_ascii_lisp_identifier_golden_and_bad_padding_fail_closed -- --exact
      - name: Unicode без явної проєкції мусить відхилятися
        run: cargo test --locked -p sens --lib text7::tests::d7_v2_unicode_requires_explicit_non_ascii_keyboard_projection -- --exact
      - name: Уся попередня логіка Text7 має лишатися сумісною
        run: cargo test --locked -p sens --lib text7::tests:: -- --nocapture
