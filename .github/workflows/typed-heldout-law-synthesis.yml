name: Typed held-out law synthesis

on:
  pull_request:
    paths:
      - "scripts/research-2321-typed-heldout-synthesis.py"
      - ".github/workflows/typed-heldout-law-synthesis.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthesize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Discover shortest typed proof paths
        run: python3 scripts/research-2321-typed-heldout-synthesis.py
