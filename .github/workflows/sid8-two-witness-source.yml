name: SID8 two original Lisp witness cutovers

on:
  push:
    branches: [main]
    paths:
      - tests/fixtures/machine-replaceability-witness.lisp
      - tests/fixtures/post-d4-evalquote-witness.lisp
      - tests/test_sid8_two_witness_source_cutover.py
      - scripts/migrate-sid8-source-batch.py
      - knowledge/sens8-current-coverage-v1.json
      - knowledge/d1-d9-foundation.json
      - .github/workflows/sid8-two-witness-source.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove-source-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Original Git blob to exact in-place Lisp rewrite witness
        run: python3 -m unittest discover -s tests -p test_sid8_two_witness_source_cutover.py -v
