name: Core2 historical profile archive

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  historical-record:
    name: Historical Core2 record integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Record historical artifacts
        shell: bash
        run: |
          set -euo pipefail
          sha256sum contracts/core2-profile-contract.lisp
          sha256sum scripts/check-core2-profile-contract.lisp
          sha256sum lib/core2.lisp

      - name: Explain authority status
        run: |
          echo "Historical Core2 semantic expectations are not active merge authority."
          echo "Current shared Core1-4 semantics are owned by #1703/#1663/#1704/#1705 and Lisp witnesses #1709."

      - name: Diff hygiene
        run: git diff --check
