name: Core2 profile contract

on:
  pull_request:
    paths:
      - "contracts/core2-profile-contract.lisp"
      - "lib/core2.lisp"
      - "scripts/check-core2-profile-contract.lisp"
      - ".github/workflows/core2-profile-contract.yml"
  push:
    branches: [main]
    paths:
      - "contracts/core2-profile-contract.lisp"
      - "lib/core2.lisp"
      - "scripts/check-core2-profile-contract.lisp"
      - ".github/workflows/core2-profile-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core2:
    name: Contract 6 frozen compatibility profile
    runs-on: [self-hosted, guix]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build semantic oracle
        run: cargo build -p sens-cli --bin sens

      - name: Verify Core2 contract and witnesses
        shell: bash
        run: |
          set -euo pipefail
          verdict="$(./target/debug/sens scripts/check-core2-profile-contract.lisp)"
          printf '%s\n' "$verdict"
          test "$verdict" = "(core2-profile-contract-ok)"

      - name: No Rust growth in Core2 slice
        shell: bash
        run: |
          set -euo pipefail
          if git diff --name-only "${{ github.event.pull_request.base.sha || github.event.before }}" HEAD 2>/dev/null | grep -E '\.rs$'; then
            echo "Core2 authority slice must not grow Rust" >&2
            exit 1
          fi

      - name: Diff hygiene
        run: git diff --check
