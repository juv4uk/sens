name: Function status census research

on:
  pull_request:
    paths:
      - "lib/surface/semantic-registry.lisp"
      - "scripts/research-2351-function-status-census.py"
      - "docs/research/2351-function-status-census.json"
      - "docs/research/2351-function-status-census.tsv"
      - ".github/workflows/function-status-census-research.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  census:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify current registry census is complete and fresh
        run: python3 scripts/research-2351-function-status-census.py --check
