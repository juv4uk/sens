name: SENS file authority guard

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      base_sha:
        description: "Exact Git commit SHA to use as the audit base"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: sens-file-authority-${{ github.sha }}
  cancel-in-progress: false

jobs:
  file-authority:
    name: Fail-closed file census
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Positive and negative witnesses, including optimized Python
        run: |
          set -euo pipefail
          python3 tools/important_file_guard.py --self-test
          python3 -O tools/important_file_guard.py --self-test
      - name: Current Git delta and complete tools Python census
        env:
          EVENT_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before || '' }}
          DISPATCH_BASE_SHA: ${{ inputs.base_sha || '' }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          base="${EVENT_BASE_SHA:-}"
          policy="knowledge/file-authority-policy.lisp"
          [[ -f "$policy" ]] || {
            echo "NAMED_FAIL: SENS_FILE_POLICY_MISSING" >&2
            exit 2
          }
          # Навіть автоматичний CI перевіряє синтаксис SENS-пінованої бази.
          policy_base="$(sed -nE 's/^[[:space:]]*\(activation-git-commit[[:space:]]*\.[[:space:]]*"([0-9a-f]{40})"\)[[:space:]]*$/\1/p' "$policy")"
          [[ "$policy_base" =~ ^[0-9a-f]{40}$ ]] || {
            echo "NAMED_FAIL: SENS_FILE_POLICY_BASE_INVALID" >&2
            exit 2
          }
          git cat-file -e "$policy_base^{commit}" || {
            echo "NAMED_FAIL: SENS_FILE_POLICY_BASE_MISSING" >&2
            exit 2
          }
          # Активація постанови має належати історії саме цього HEAD.
          # Існуючий, але сторонній SHA не може визначати обсяг доказу.
          git merge-base --is-ancestor "$policy_base" "$HEAD_SHA" || {
            echo "NAMED_FAIL: SENS_FILE_POLICY_BASE_NOT_ANCESTOR" >&2
            exit 2
          }
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            [[ "$GITHUB_REF" == "refs/heads/main" ]] || {
              echo "NAMED_FAIL: DISPATCH_REQUIRES_MAIN" >&2
              exit 2
            }
            # Ручний аудит використовує задану оператором точну базу.
            base="${DISPATCH_BASE_SHA:-}"
          fi
          [[ "$base" =~ ^[0-9a-f]{40}$ && "$base" != "0000000000000000000000000000000000000000" ]] || {
            echo "NAMED_FAIL: EVENT_BASE_UNAVAILABLE" >&2
            exit 2
          }
          python3 -O tools/important_file_guard.py "$base" "$HEAD_SHA"
