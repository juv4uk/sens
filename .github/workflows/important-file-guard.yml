# Виведено з карантину 14.10.2026 за ПРАВИЛОМ 24 ГОДИН (AGENTS.md; docs/ci-red-cause-policy.uk.md):
# RED не ховаємо за if:false — workflow лишається ВИДИМИМ, а RED старший за 24 год ескалюється
# (Q_TRIAGE_24H у #5741). Жоден gate не вимикаємо на підставі кольору.
name: SENS file authority guard — physical T5 oracle

on:
  # Переведено на pull_request: цей workflow УЖЕ обробляє PR-події
  # (github.event.pull_request), але тригер не стріляв — перевірка не мала наслідків.
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      base_sha:
        description: "Exact Git commit SHA to use as the audit base"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: sens-file-authority-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  file-authority:
    name: Physical SENS T5 file-admission oracle
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Встановити Zig 0.16.0 (дефолтний транспортний кодек; потрібен sens-cli/build.rs)
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --silent --show-error \
            https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz \
            --output "$RUNNER_TEMP/zig-0.16.0.tar.xz"
          echo '70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00  '"$RUNNER_TEMP/zig-0.16.0.tar.xz" | sha256sum --check --status
          tar -xJf "$RUNNER_TEMP/zig-0.16.0.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/zig-x86_64-linux-0.16.0" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/zig-x86_64-linux-0.16.0/zig" version

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.x'

      - name: Build exact physical SENS entrypoints
        run: cargo build --locked -p sens-cli --bin sens --bin sens-trit

      - name: Test transport in ordinary and optimized Python
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/important_file_guard.py --self-test
          python3 -O tools/important_file_guard.py --self-test

      - name: Prove D2 to physical T5 and reject mixed textual calls
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p sens-cli --test file_authority_t5_boundary_cli -- --nocapture
          # Канонічна обмежена ук-трійка має власний незалежний read-only доказ.
          bash scripts/check-triple-projection.sh \
            --fixture tests/fixtures/migration-d1-cond-cohort/branch.lisp

      - name: Prove admitted D2-D7 binding migration through physical T5 (fail-closed)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import importlib.util
          import os
          import sys
          sys.path.insert(0, "scripts")
          spec = importlib.util.spec_from_file_location(
              "sens_domain_migration", "scripts/migrate-to-sens-codes.py"
          )
          assert spec is not None and spec.loader is not None
          migration = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = migration
          spec.loader.exec_module(migration)
          foundation = Path("knowledge/d1-d9-foundation.json")
          data, _ = migration.load_foundation(foundation)
          code_map = migration.build_map(data, migration.CALL_DOMAINS)
          surfaces = [Path(f"lib/domains/d{n}.lisp") for n in range(1, 7)]
          registry = Path("lib/surface/semantic-registry.lisp")
          code_map = migration.augment_code_map_with_domain_surfaces(code_map, surfaces)
          code_map = migration.augment_code_map_with_registry_aliases(code_map, registry)
          resolver = migration.build_resolver(
              historical_map=Path("contracts/core1-historical-sid-map.lisp"),
              foundation=foundation, registry=registry, domain_surfaces=surfaces,
          )
          # Ratified D7 keyboard/v2 is the current Text7 authority; the retired
          # crates/sens/src/text7_projection_generated.rs donor carries no
          # executable SA_SLP1/UK mapping and is fail-closed.
          glyphs = migration.build_text7_encoder(
              data, Path("knowledge/d7-keyboard-v2-ratified.json")
          )
          sources = {
              "current": "(define identity (lambda (value) value)) (identity ())",
              "historical": "(00001001 identity (00001000 (value) value)) (identity ())",
          }
          for label, original in sources.items():
              projected, hits, shadowed = migration.binary_rewrite(
                  original, code_map, glyphs, resolver=resolver,
              )
              assert projected.strip() and set(projected) <= set("01 \n\t\r")
              assert "identity" not in projected and "value" not in projected
              assert not shadowed, "ambiguously rebound callable from source"
              Path(os.environ["RUNNER_TEMP"], f"d2-d7-{label}.lisp").write_text(
                  projected, encoding="ascii"
              )
          for invalid in ('(define x "unratified string")',
                          "(define x 261)", "(quote unbound)",
                          "(00001001 binary (00001000 (width) (00100111 (00000001 binary) width)))"):
              try:
                  migration.binary_rewrite(invalid, code_map, glyphs, resolver=resolver)
              except migration.BinaryMigrationError:
                  pass
              else:
                  raise AssertionError("unadmitted source silently passed: " + invalid)
          print("D2_D7_BINDING_MIGRATION_READY canonical binary words")
          PY
          for label in current historical; do
            target/debug/sens-trit encode "$RUNNER_TEMP/d2-d7-$label.lisp"
            target/debug/sens-trit open "$RUNNER_TEMP/d2-d7-$label.sens" \
              > "$RUNNER_TEMP/d2-d7-$label.reopened.words"
            diff -u "$RUNNER_TEMP/d2-d7-$label.lisp" \
              "$RUNNER_TEMP/d2-d7-$label.reopened.words"
            target/debug/sens "$RUNNER_TEMP/d2-d7-$label.sens" \
              > "$RUNNER_TEMP/d2-d7-$label.executed.log"
            test "$(tail -n 1 "$RUNNER_TEMP/d2-d7-$label.executed.log")" = '()'
          done

      - name: Select and validate the exact Git comparison base
        id: base
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          MANUAL_BASE_SHA: ${{ inputs.base_sha }}
        run: |
          set -euo pipefail
          case "$GITHUB_EVENT_NAME" in
            pull_request) base="$PR_BASE_SHA" ;;
            push) base="$PUSH_BEFORE_SHA" ;;
            workflow_dispatch) base="$MANUAL_BASE_SHA" ;;
            *) echo "SENS_FILE_AUTHORITY_BLOCKED: unsupported event" >&2; exit 2 ;;
          esac
          [[ "$base" =~ ^[0-9a-f]{40}$ && "$base" != "0000000000000000000000000000000000000000" ]] || {
            echo "SENS_FILE_AUTHORITY_BLOCKED: missing or invalid base SHA" >&2
            exit 2
          }
          git cat-file -e "$base^{commit}"
          git merge-base --is-ancestor "$base" HEAD
          printf 'sha=%s\n' "$base" >> "$GITHUB_OUTPUT"

      - name: Transport Git paths and package SENS source only
        id: transport
        shell: bash
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/file-authority-transport.log"
          if python3 tools/important_file_guard.py \
            --base "$BASE_SHA" \
            --output "$RUNNER_TEMP/file-authority.lisp" >"$log" 2>&1; then
            cat "$log"
          else
            cat "$log" >&2
            echo "SENS_FILE_AUTHORITY_BLOCKED: Git transport failed" >&2
            exit 2
          fi
          proof="$(tail -n 1 "$log")"
          pattern='^GIT_PATH_TRANSPORT_READY base=([0-9a-f]{40}) head=([0-9a-f]{40}) added_paths=([0-9]+) tracked_tools_paths=([0-9]+)$'
          if [[ ! "$proof" =~ $pattern ]]; then
            echo "SENS_FILE_AUTHORITY_BLOCKED: missing exact Git transport inventory" >&2
            exit 2
          fi
          proof_base="${BASH_REMATCH[1]}"
          proof_head="${BASH_REMATCH[2]}"
          added_count="${BASH_REMATCH[3]}"
          tools_count="${BASH_REMATCH[4]}"
          current_head="$(git rev-parse --verify 'HEAD^{commit}')"
          if [[ "$proof_base" != "$BASE_SHA" || "$proof_head" != "$current_head" ]]; then
            echo "SENS_FILE_AUTHORITY_BLOCKED: inventory SHA mismatch" >&2
            exit 2
          fi
          printf 'added_paths=%s\ntracked_tools_paths=%s\n' \
            "$added_count" "$tools_count" >>"$GITHUB_OUTPUT"

      - name: Prove canonical binary projection encoding remains admitted
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' '10 001 00 000 01' > "$RUNNER_TEMP/canonical-projection.lisp"
          target/debug/sens-trit encode "$RUNNER_TEMP/canonical-projection.lisp"
          target/debug/sens-trit open "$RUNNER_TEMP/canonical-projection.sens" > "$RUNNER_TEMP/canonical-projection.words"
          test "$(cat "$RUNNER_TEMP/canonical-projection.words")" = "10 001 00 000 01"

      - name: Prove noncanonical text is rejected without emitting physical SENS
        shell: bash
        run: |
          set -euo pipefail
          source="$RUNNER_TEMP/noncanonical-source.lisp"
          output="$RUNNER_TEMP/noncanonical-source.sens"
          log="$RUNNER_TEMP/noncanonical-source-encode.log"
          printf '%s\n' '(ordinary-name "text data")' > "$source"
          if target/debug/sens-trit encode "$source" >"$log" 2>&1; then
            cat "$log"
            echo "SENS_FILE_AUTHORITY_BLOCKED: noncanonical textual source was accepted" >&2
            exit 1
          fi
          cat "$log" >&2
          if ! grep -Fq 'InvalidBinaryProjection' "$log"; then
            echo "SENS_FILE_AUTHORITY_BLOCKED: negative control failed for an unexpected reason" >&2
            exit 2
          fi
          if test -e "$output"; then
            echo "SENS_FILE_AUTHORITY_BLOCKED: encoder emitted .sens despite rejecting input" >&2
            exit 3
          fi
          echo "SENS_FILE_AUTHORITY_NEGATIVE_CONTROL_PASS: textual call/string rejected; no .sens emitted"

      - name: Migrate entire assembled Lisp oracle into admitted D2-D7 projection
        shell: bash
        run: |
          set -euo pipefail
          # A real, fail-closed source migration, not passing Lisp straight
          # to the strict T5 packer. This source is pinned to exact Git HEAD
          # by the transport step, and must migrate ALL forms, without drops.
          input_dir="$RUNNER_TEMP/file-authority-source"
          mirror_dir="$RUNNER_TEMP/file-authority-exact-projection"
          report="$RUNNER_TEMP/file-authority-migration-report.json"
          log="$RUNNER_TEMP/file-authority-migration.log"
          mkdir -p "$input_dir" "$mirror_dir"
          cp "$RUNNER_TEMP/file-authority.lisp" "$input_dir/file-authority.lisp"
          if ! python3 scripts/migrate-to-sens-codes.py "$input_dir" \
            --foundation knowledge/d1-d9-foundation.json \
            --binary-mirror "$mirror_dir" --report "$report" \
            >"$log" 2>&1; then
            cat "$log" >&2
            python3 - "$report" <<'PY'
          import json
          import sys
          from pathlib import Path
          path = Path(sys.argv[1])
          if path.is_file():
              report = json.loads(path.read_text(encoding="utf-8"))
              for row in report.get("files", []):
                  if row.get("status") == "blocked":
                      for blocker in row.get("blockers", []):
                          print("SENS_FILE_AUTHORITY_MIGRATION_BLOCKED: "
                                + blocker.get("reason", "unknown"), file=sys.stderr)
          PY
            echo "SENS_FILE_AUTHORITY_BLOCKED: semantic source migration incomplete; no T5 oracle verdict" >&2
            test ! -e "$RUNNER_TEMP/file-authority.sens"
            exit 2
          fi
          cat "$log"
          python3 - "$report" <<'PY'
          import json
          import sys
          from pathlib import Path
          report = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          items = report["files"]
          if (report["summary"]["files_seen"] != 1 or
              report["summary"]["files_written"] != 1 or
              report["summary"]["files_blocked"] != 0 or
              items[0]["status"] != "binary-mirrored" or
              items[0].get("blockers") or
              items[0].get("shadowed_labels")):
              raise SystemExit("SENS_FILE_AUTHORITY_BLOCKED: incomplete or shadowed migration")
          PY
          test -s "$mirror_dir/file-authority.lisp"

      - name: Encode the complete admitted binary oracle into physical T5
        shell: bash
        run: |
          set -euo pipefail
          source="$RUNNER_TEMP/file-authority-exact-projection/file-authority.lisp"
          physical="$RUNNER_TEMP/file-authority-exact-projection/file-authority.sens"
          log="$RUNNER_TEMP/file-authority-encode.log"
          if target/debug/sens-trit encode "$source" >"$log" 2>&1; then
            cat "$log"
            test -s "$physical"
            # Publish to the evaluator only after a successful canonical
            # encode. No partial output may become a SENS authority program.
            cp "$physical" "$RUNNER_TEMP/file-authority.sens"
          else
            cat "$log" >&2
            echo "SENS_FILE_AUTHORITY_BLOCKED: canonical T5 binary encoding failed" >&2
            if test -e "$physical" || test -e "$RUNNER_TEMP/file-authority.sens"; then
              echo "SENS_FILE_AUTHORITY_BLOCKED: encoder left output after failure" >&2
              exit 3
            fi
            exit 2
          fi

      - name: Execute and attest the physical SENS authority verdict
        shell: bash
        env:
          EXPECTED_ADDED_PATHS: ${{ steps.transport.outputs.added_paths }}
          EXPECTED_TRACKED_TOOLS_PATHS: ${{ steps.transport.outputs.tracked_tools_paths }}
        run: |
          set -euo pipefail
          verdict_pattern='^\(SENS_FILE_AUTHORITY_PASS new-paths [0-9]+ tracked-tool-paths [0-9]+\)$'

          if [[ ! "$EXPECTED_ADDED_PATHS" =~ ^[0-9]+$ ||
                ! "$EXPECTED_TRACKED_TOOLS_PATHS" =~ ^[0-9]+$ ]]; then
            echo "SENS_FILE_AUTHORITY_BLOCKED: missing numeric Git inventory evidence" >&2
            exit 2
          fi
          check_inventory_verdict() {
            local candidate="$1" count_added="$2" count_tools="$3"
            [[ "$candidate" =~ $verdict_pattern ]] &&
              [[ "$candidate" == "(SENS_FILE_AUTHORITY_PASS new-paths $count_added tracked-tool-paths $count_tools)" ]]
          }
          
          # Незалежні фальсифікатори: чужий текст/порожній вивід — не рішення SENS.
          valid='(SENS_FILE_AUTHORITY_PASS new-paths 0 tracked-tool-paths 1)'
          if ! check_inventory_verdict "$valid" 0 1; then
            echo "SENS_FILE_AUTHORITY_BLOCKED: validator rejected canonical inventory" >&2
            exit 2
          fi
          if check_inventory_verdict "$valid" 1 1 || check_inventory_verdict "$valid" 0 2; then
            echo "SENS_FILE_AUTHORITY_BLOCKED: wrong inventory counts were accepted" >&2
            exit 2
          fi
          for invalid in '' 'SENS_FILE_AUTHORITY_PASS' \
            '(SENS_FILE_AUTHORITY_PASS new-paths 0 tracked-tool-paths 1) junk' \
            '(SENS_FILE_AUTHORITY_PASS new-paths unknown tracked-tool-paths 1)' \
            '(FOREIGN_PASS new-paths 0 tracked-tool-paths 1)'; do
            if [[ "$invalid" =~ $verdict_pattern ]]; then
              echo "SENS_FILE_AUTHORITY_BLOCKED: fake or incomplete verdict was admitted" >&2
              exit 2
            fi
          done

          log="$RUNNER_TEMP/file-authority-execution.log"
          if target/debug/sens "$RUNNER_TEMP/file-authority.sens" >"$log" 2>&1; then
            cat "$log"
          else
            cat "$log" >&2
            echo "SENS_FILE_AUTHORITY_BLOCKED: physical SENS execution failed" >&2
            exit 1
          fi

          # CLI друкує EvalResult.output, потім EvalResult.value: остаточне
          # значення мусить бути повним, типізованим рішенням SENS, не substring.
          verdict="$(tail -n 1 "$log")"
          if ! check_inventory_verdict "$verdict" "$EXPECTED_ADDED_PATHS" "$EXPECTED_TRACKED_TOOLS_PATHS"; then
            echo "SENS_FILE_AUTHORITY_BLOCKED: final SENS verdict mismatches Git inventory" >&2
            exit 2
          fi

      - name: Diff hygiene
        run: git diff --check
