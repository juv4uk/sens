name: SENS important file guard

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  important-file-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fail-closed guard self-test (also under python -O)
        run: |
          set -euo pipefail
          python3 -O tools/important_file_guard.py --self-test
          python3 tools/important_file_guard.py --self-test
      - name: Reject new foreign important files and unregistered Python
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python3 -O tools/important_file_guard.py "$BASE_SHA" "$HEAD_SHA"
