name: D6 UNKNOWN frontier research\n\non:\n  pull_request:\n    paths:\n      - "benchmarks/d6-unknown-frontier/**"\n      - "benchmarks/d6-closure-map/**"\n      - "scripts/research-2506-d6-binding-policy-generator.py"\n      - "scripts/research-2619-d6-residency-readiness.py"\n      - "scripts/research-2624-d6-middle-corners.py"\n      - "docs/research/2344-post-d4-historical-ledger.json"\n      - ".github/workflows/d6-unknown-frontier.yml"\n  push:\n    branches: [main]\n    paths:\n      - "benchmarks/d6-unknown-frontier/**"\n      - "benchmarks/d6-closure-map/**"\n      - "scripts/research-2506-d6-binding-policy-generator.py"\n      - "scripts/research-2619-d6-residency-readiness.py"\n      - "scripts/research-2624-d6-middle-corners.py"\n      - "docs/research/2344-post-d4-historical-ledger.json"\n      - ".github/workflows/d6-unknown-frontier.yml"\n  workflow_dispatch:\n\njobs:\n  frontier:\n    runs-on: ubuntu-latest\n    timeout-minutes: 5\n    steps:\n      - uses: actions/checkout@v5\n      - name: Classify D6 UNKNOWN frontier\n        run: |\n          python3 benchmarks/d6-unknown-frontier/run.py --out /tmp/d6-unknown-frontier.json\n          python3 -c 'import json; d=json.load(open("/tmp/d6-unknown-frontier.json")); assert d["canonical"]["occupancy_mutations"] == 0; assert sum(d["frontier_counts"].values()) == 48'\n      - uses: actions/upload-artifact@v4\n        if: always()\n        with:\n          name: d6-unknown-frontier\n          path: /tmp/d6-unknown-frontier.json\n          retention-days: 14\n