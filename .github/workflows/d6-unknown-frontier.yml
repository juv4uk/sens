name: D6 UNKNOWN frontier research

on:
  pull_request:
    paths:
      - "benchmarks/d6-unknown-frontier/**"
      - "benchmarks/d6-closure-map/**"
      - "scripts/research-2506-d6-binding-policy-generator.py"
      - "scripts/research-2619-d6-residency-readiness.py"
      - "scripts/research-2624-d6-middle-corners.py"
      - "docs/research/2344-post-d4-historical-ledger.json"
      - ".github/workflows/d6-unknown-frontier.yml"
  push:
    branches: [main]
    paths:
      - "benchmarks/d6-unknown-frontier/**"
      - "benchmarks/d6-closure-map/**"
      - "scripts/research-2506-d6-binding-policy-generator.py"
      - "scripts/research-2619-d6-residency-readiness.py"
      - "scripts/research-2624-d6-middle-corners.py"
      - "docs/research/2344-post-d4-historical-ledger.json"
      - ".github/workflows/d6-unknown-frontier.yml"
  workflow_dispatch:

jobs:
  frontier:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Classify D6 UNKNOWN frontier
        run: |
          python3 benchmarks/d6-unknown-frontier/run.py --out /tmp/d6-unknown-frontier.json
          python3 -c 'import json; d=json.load(open("/tmp/d6-unknown-frontier.json")); assert d["canonical"]["occupancy_mutations"] == 0; assert sum(d["frontier_counts"].values()) == 48'
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: d6-unknown-frontier
          path: /tmp/d6-unknown-frontier.json
          retention-days: 14
