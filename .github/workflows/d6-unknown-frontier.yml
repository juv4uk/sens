name: D6 UNKNOWN frontier research

on:
  workflow_dispatch:

jobs:
  frontier:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Classify D6 UNKNOWN frontier
        run: |
          echo "FOREIGN_LANGUAGE_TEST_OR_BENCH=EXCLUDED_BY_POLICY native_equivalent=NOT_VERIFIED"
          echo "FOREIGN_LANGUAGE_TEST_OR_BENCH=EXCLUDED_BY_POLICY native_equivalent=NOT_VERIFIED"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d6-unknown-frontier
          path: /tmp/d6-unknown-frontier.json
          retention-days: 14
