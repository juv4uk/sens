name: D5 zero number predicates

on:
  pull_request:
    paths:
      - "crates/sens/src/eval/d5_arithmetic.rs"
      - "crates/sens/src/eval/canon.rs"
      - "crates/sens/tests/d5_zero_number_predicates.rs"
      - ".github/workflows/d5-zero-number-predicates.yml"
  workflow_dispatch:

jobs:
  predicate-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: cargo test -p sens --test d5_zero_number_predicates -- --nocapture
      - run: cargo test -p sens eval::d5_arithmetic::tests -- --nocapture
