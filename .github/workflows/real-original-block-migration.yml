name: real-original-block-migration

on:
  pull_request:
    paths:
      - "lib/machine/block.lisp"
      - "lib/machine/block.sens"
      - "scripts/migrate.py"
      - "scripts/migrate-t5-batch.py"
      - "scripts/migrate-three-pass.py"
      - "scripts/sens_t5_codec.py"
      - "tests/test_migration_real_block.py"
      - ".github/workflows/real-original-block-migration.yml"
  push:
    branches: [main]
    paths:
      - "lib/machine/block.lisp"
      - "lib/machine/block.sens"
      - "tests/test_migration_real_block.py"
      - ".github/workflows/real-original-block-migration.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Build real current Rust D2 reader
        run: cargo build -q -p sens-cli --bin sens-trit
      - name: Verify original machine block stays BLOCKED until exact-domain authority exists
        run: python3 -m unittest discover -s tests -p 'test_migration_real_block.py' -v
      - name: Audit all retained physical T5 programs with actual Rust D2 parser
        run: |
          set -euo pipefail
          python3 scripts/audit_t5_program_syntax.py . \
            --reader "$PWD/target/debug/sens-trit" \
            --require-files \
            --output "$RUNNER_TEMP/retained-t5-d2-audit.json"
      - name: Upload blocked-source and D2 audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-original-block-quarantine-evidence
          path: ${{ runner.temp }}/retained-t5-d2-audit.json
          if-no-files-found: warn
