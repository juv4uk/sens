name: real-original-block-integrity

# Physical proof witness for the real original machine-block pair.
# Semantic admission remains separately guarded by the source-pinned #4654 proof gate.
on:
  pull_request:
    paths:
      - "lib/machine/block.lisp"
      - "lib/machine/block.sens"
      - "scripts/migrate.py"
      - "scripts/migrate-t5-batch.py"
      - "scripts/migrate-three-pass.py"
      - "scripts/sens_t5_codec.py"
      - "tests/test_migration_real_block.py"
      - ".github/workflows/real-original-block-migration.yml"
  push:
    branches: [main]
    paths:
      - "lib/machine/block.lisp"
      - "lib/machine/block.sens"
      - "scripts/migrate-three-pass.py"
      - "scripts/migrate-t5-batch.py"
      - "tests/test_migration_real_block.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Build current Rust SENS reader/evaluator
        run: cargo build -q -p sens-cli --bin sens-trit
      - name: Verify physical pair and current runtime observation
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_migration_real_block.py' -v
          target/debug/sens-trit open lib/machine/block.sens
          echo 'CURRENT_EVAL_BEGIN'
          target/debug/sens-trit eval lib/machine/block.sens
          echo 'CURRENT_EVAL_END'


