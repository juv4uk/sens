name: real-original-block-integrity

# Physical proof witness for the real original machine-block pair.
# Semantic admission remains separately guarded by the source-pinned #4654 proof gate.
on:
  pull_request:
    paths:
      - "lib/machine/block.lisp"
      - "lib/machine/block.sens"
      - "scripts/migrate.py"
      - "scripts/migrate-t5-batch.py"
      - "scripts/migrate-three-pass.py"
      - "scripts/sens_t5_codec.py"
      - "tests/test_migration_real_block.py"
      - ".github/workflows/real-original-block-migration.yml"
  push:
    branches: [main]
    paths:
      - "lib/machine/block.lisp"
      - "lib/machine/block.sens"
      - "scripts/migrate-three-pass.py"
      - "scripts/migrate-t5-batch.py"
      - "tests/test_migration_real_block.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Build current Rust SENS reader/evaluator
        run: cargo build -q -p sens-cli --bin sens-trit
      - name: Verify physical pair and regenerate with current canonical migrator
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_migration_real_block.py' -v
          rm -rf "$RUNNER_TEMP/current-block-mirror"
          python3 scripts/migrate-to-sens-codes.py . \
            --foundation knowledge/d1-d7-foundation.json \
            --sens-mirror "$RUNNER_TEMP/current-block-mirror" \
            --report "$RUNNER_TEMP/current-block-report.json"
          python3 - "$RUNNER_TEMP/current-block-report.json" "$RUNNER_TEMP/current-block-mirror/lib/machine/block.sens" <<'PY'
          import base64,json,sys
          from pathlib import Path
          data=json.loads(Path(sys.argv[1]).read_text())
          rows=[r for r in data["files"] if r["path"]=="lib/machine/block.lisp"]
          assert len(rows)==1, rows
          row=rows[0]
          print(json.dumps(row,ensure_ascii=False,indent=2))
          assert row["status"]=="sens-written", row
          payload=Path(sys.argv[2]).read_bytes()
          print("CURRENT_BLOCK_BYTES",len(payload))
          print("CURRENT_BLOCK_PHYSICAL_SHA256",row["physical_sha256"])
          print("CURRENT_BLOCK_TYPED_SHA256",row["typed_word_sha256"])
          print("CURRENT_BLOCK_B64_BEGIN")
          print(base64.b64encode(payload).decode())
          print("CURRENT_BLOCK_B64_END")
          PY
          test "$(git hash-object -- lib/machine/block.lisp)" = "200201b741787c4e144ad4194848acf51d7b439e"
          cmp "$RUNNER_TEMP/current-block-mirror/lib/machine/block.sens" lib/machine/block.sens
          target/debug/sens-trit open lib/machine/block.sens
      - name: Current Rust runtime observation
        run: |
          set -euo pipefail
          echo 'CURRENT_EVAL_BEGIN'
          target/debug/sens-trit eval lib/machine/block.sens
          echo 'CURRENT_EVAL_END'


