name: real-original-block-migration

on:
  pull_request:
    paths:
      - "lib/machine/block.lisp"
      - "lib/machine/block.sens"
      - "scripts/migrate.py"
      - "scripts/migrate-t5-batch.py"
      - "scripts/migrate-three-pass.py"
      - "scripts/sens_t5_codec.py"
      - "tests/test_migration_real_block.py"
      - ".github/workflows/real-original-block-migration.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Build current Rust D2 physical reader
        run: cargo build -q -p sens-cli --bin sens-trit
      - name: Re-run canonical migration entrypoint and verify exact physical bytes
        run: python3 -m unittest discover -s tests -p 'test_migration_real_block.py' -v
