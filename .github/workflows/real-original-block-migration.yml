name: real-original-block-integrity

# Former success-asserting workflow was RED because an INVALID D2 binary
# had been published as a completed real-library migration. This test now
# enforces the honest BLOCK until the source has independent oracle proof.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Confirm original source is retained and rejected binary is not published
        run: python3 -m unittest discover -s tests -p 'test_migration_real_block.py' -v
