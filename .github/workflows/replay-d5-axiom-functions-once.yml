name: Replay D5 function identity hosted proof and index
on:
  push:
    branches:
      - replay/research-d5-axiom-function-description-20261009
  workflow_dispatch:
permissions:
  contents: write
jobs:
  proof-and-index:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: replay/research-d5-axiom-function-description-20261009
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Reproduce original exact D5 name-erased proof
        run: cargo test -p sens --test axiom_corpus_function_description -- --nocapture
      - name: Generate benchmark index, then fail if stale
        run: |
          python3 scripts/benchmark_registry.py
          python3 scripts/benchmark_registry.py --check
      - name: Commit generated index to isolated branch
        shell: bash
        run: |
          set -euo pipefail
          git add -- benchmarks/README.md
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs(bench): register historical D5 function identity proof'
          git push origin HEAD:refs/heads/replay/research-d5-axiom-function-description-20261009
