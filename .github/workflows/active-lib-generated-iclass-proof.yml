name: Active Lisp vs generated instruction catalogue

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generated-nonprogram-vs-active-code:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify ALL active Lisp, compiler-role AST and generated-data boundary tests
        run: |
          cargo test -q -p sens-cli --test active_lib_sens_completion
      - name: Explain separate unfinished semantic migration
        shell: bash
        run: |
          echo 'Data-only classification never counts as a migrated executable.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Compiler nucleus is verified through canonical Ukrainian AST/lowering; every other active source keeps strict zero-convertible gate.' >> "$GITHUB_STEP_SUMMARY"
