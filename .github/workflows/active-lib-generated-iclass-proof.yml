name: Active Lisp vs generated instruction catalogue

on:
  pull_request:
    paths:
      - 'crates/sens-cli/tests/active_lib_sens_completion.rs'
      - 'lib/machine/encoding/admitted-iclass-index.lisp'
      - 'scripts/generate-encoder-coverage-input.py'
      - '.github/workflows/active-lib-generated-iclass-proof.yml'
  push:
    branches: [main]
    paths:
      - 'crates/sens-cli/tests/active_lib_sens_completion.rs'
      - 'lib/machine/encoding/admitted-iclass-index.lisp'
      - 'scripts/generate-encoder-coverage-input.py'
      - '.github/workflows/active-lib-generated-iclass-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generated-nonprogram-vs-active-code:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify exact 1176-row generated-data role, syntax tampering rejection, real active source inclusion
        run: |
          cargo test -q -p sens-cli --test active_lib_sens_completion -- --skip active_authored_lib_has_no_parser_convertible_surface_heads
      - name: Explain separate unfinished semantic migration
        shell: bash
        run: |
          echo 'Data-only classification never counts as a migrated executable.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Compiler nucleus and native-first remain in the real executable migration gate.' >> "$GITHUB_STEP_SUMMARY"
