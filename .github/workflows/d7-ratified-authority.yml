name: D7 current keyboard authority and exact W7 transport

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authority:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/install-zig
      - name: Verify current ratified 128/128 D7 keyboard and surface
        run: |
          python3 scripts/check-d7-keyboard-v2-table.py
          python3 scripts/check-d7-current-authority.py
          python3 scripts/check-d7-runtime-projection.py
      - name: Ensure optimized Python cannot bypass the current D7 checks
        run: |
          PYTHONOPTIMIZE=1 python3 scripts/check-d7-keyboard-v2-table.py
          PYTHONOPTIMIZE=2 python3 scripts/check-d7-runtime-projection.py
      - name: Test only current D7 keyboard and exact T5
        run: |
          python3 -m unittest discover -s tests -p 'test_d7_symbol_codec.py' -v
          python3 -m unittest discover -s tests -p 'test_d7_t5_keyboard.py' -v
          python3 -m unittest discover -s tests -p 'test_d7_source_projection.py' -v
          python3 -m unittest discover -s tests -p 'test_d7_no_historical_runtime.py' -v
      - uses: dtolnay/rust-toolchain@stable
      - name: Prove current Rust W7 occupancy, projection and physical transport
        run: |
          cargo test --locked -p sens --features rust-t5-reference --test d7_w7_pack --test d7_keyboard_t5 --test d7_runtime_presentation --test text7_canonical_wire
          cargo test --locked -p sens --lib text7_projection::tests
          cargo test --locked -p sens --lib d7_keyboard::tests
      - name: Execute binary SENS-owned domain and compiler selector self-verdicts
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked -p sens-cli --bin sens --bin sens-trit
          for witness in tests/semantic/d1-d3-control-law.bits tests/semantic/d4-d6-selector-chain.bits tests/semantic/compiler-nucleus-l1-l5-selectors.bits; do
            filename="$(basename "$witness" .bits)"
            cp "$witness" "$RUNNER_TEMP/$filename.lisp"
            target/debug/sens-trit encode "$RUNNER_TEMP/$filename.lisp"
            target/debug/sens-trit open "$RUNNER_TEMP/$filename.sens" > "$RUNNER_TEMP/$filename.open.bits"
            cmp "$witness" "$RUNNER_TEMP/$filename.open.bits"
            target/debug/sens "$RUNNER_TEMP/$filename.sens" > "$RUNNER_TEMP/$filename.sens.out"
            target/debug/sens-trit eval "$RUNNER_TEMP/$filename.sens" > "$RUNNER_TEMP/$filename.trit.out"
            cmp "$RUNNER_TEMP/$filename.sens.out" "$RUNNER_TEMP/$filename.trit.out"
            printf '1\n' | cmp - "$RUNNER_TEMP/$filename.sens.out"
          done
