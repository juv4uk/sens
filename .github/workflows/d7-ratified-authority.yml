name: D7 ratified authority and W7 transport

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authority:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - name: Check 126/128 ratified D7 residents, reserved coordinates and Lisp surface
        run: python3 scripts/check-d7-current-authority.py
      - name: Оптимізований Python не минає доказ D7
        shell: bash
        run: |
          set -euo pipefail
          for level in 1 2; do
            log="$RUNNER_TEMP/d7-optimized-$level.log"
            if PYTHONOPTIMIZE="$level" python3 scripts/check-d7-current-authority.py >"$log" 2>&1; then
              echo "::error::D7 validator reported success with PYTHONOPTIMIZE=$level"
              exit 1
            fi
            if ! grep -Fq "D7-CURRENT-AUTHORITY: BLOCKED" "$log"; then
              cat "$log"
              echo "::error::D7 validator did not report named fail-closed outcome"
              exit 1
            fi
          done
      - name: Check D7 Sound/Text versus LocalOrdinal and arithmetic boundary
        run: python3 benchmarks/d7-ratification-conformance/validate.py
      - name: Admit only owner-ratified D7 projection and distinguish W7 roles
        run: |
          python3 scripts/d7_source_projection.py --check
          python3 -m unittest discover -s tests -p 'test_d7_source_projection.py' -v
      - uses: dtolnay/rust-toolchain@stable
      - name: Prove mechanical dense W7 and contextual D2/Text7 identities
        run: cargo test --locked -p sens --test d7_w7_pack --test text7_contextual_binding
      - name: Confirm D7 coordinates remain only width-qualified Rust carriers
        run: cargo test --locked -p sens --lib domain_ladder::tests::every_d7_source_word_has_a_width_preserving_coordinate -- --exact
