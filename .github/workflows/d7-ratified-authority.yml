name: D7 current keyboard authority and exact W7 transport

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authority:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - name: Verify current ratified 128/128 D7 keyboard and surface
        run: |
          python3 scripts/check-d7-keyboard-v2-table.py
          python3 scripts/check-d7-current-authority.py
          python3 scripts/check-d7-runtime-projection.py
      - name: Ensure optimized Python cannot bypass the current D7 checks
        run: |
          PYTHONOPTIMIZE=1 python3 scripts/check-d7-keyboard-v2-table.py
          PYTHONOPTIMIZE=2 python3 scripts/check-d7-runtime-projection.py
      - name: Test only current D7 keyboard and exact T5
        run: |
          python3 -m unittest discover -s tests -p 'test_d7_symbol_codec.py' -v
          python3 -m unittest discover -s tests -p 'test_d7_t5_keyboard.py' -v
          python3 -m unittest discover -s tests -p 'test_d7_source_projection.py' -v
          python3 -m unittest discover -s tests -p 'test_d7_no_historical_runtime.py' -v
      - uses: dtolnay/rust-toolchain@stable
      - name: Prove current Rust W7 occupancy, projection and physical transport
        run: |
          cargo test --locked -p sens --test d7_w7_pack --test d7_keyboard_t5 --test d7_runtime_presentation --test text7_canonical_wire
          cargo test --locked -p sens --lib text7_projection::tests
          cargo test --locked -p sens --lib d7_keyboard::tests
      - name: Execute binary SENS-owned D1/D3/D7/D8/D9 semantic verdict
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked -p sens-cli --bin sens
          python3 - "$RUNNER_TEMP/d1-d9-domain-law.sens" <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, "scripts")
          from sens_t5_codec import encode_projection

          # Transport only. Expected domain results are nowhere in Python.
          source = Path("tests/semantic/d1-d3-control-law.bits").read_text(encoding="ascii")
          Path(sys.argv[1]).write_bytes(encode_projection(source))
          PY
          # The SENS program itself returns D1:1 only if every internal law holds.
          verdict="$(target/debug/sens "$RUNNER_TEMP/d1-d9-domain-law.sens")"
          test "$verdict" = "1"
