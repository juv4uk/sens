name: D7 ratified authority and W7 transport

on:
  pull_request:
    paths:
      - "knowledge/d7-ratified.json"
      - "knowledge/d7-v2-evidence-ledger.json"
      - "contracts/d7-ratification.lisp"
      - "lib/domains/d7.lisp"
      - "language-contract.lisp"
      - "CURRENT.md"
      - "scripts/check-d7-current-authority.py"
      - "scripts/domain_tables.py"
      - "benchmarks/d7-ratification-conformance/**"
      - "crates/sens/src/text7.rs"
      - "crates/sens/tests/d7_w7_pack.rs"
      - "crates/sens/tests/text7_contextual_binding.rs"
      - ".github/workflows/d7-ratified-authority.yml"
  push:
    branches: [main]
    paths:
      - "knowledge/d7-ratified.json"
      - "knowledge/d7-v2-evidence-ledger.json"
      - "contracts/d7-ratification.lisp"
      - "lib/domains/d7.lisp"
      - "language-contract.lisp"
      - "CURRENT.md"
      - "scripts/check-d7-current-authority.py"
      - "scripts/domain_tables.py"
      - "benchmarks/d7-ratification-conformance/**"
      - "crates/sens/src/text7.rs"
      - "crates/sens/tests/d7_w7_pack.rs"
      - "crates/sens/tests/text7_contextual_binding.rs"
      - ".github/workflows/d7-ratified-authority.yml"

permissions:
  contents: read

jobs:
  authority:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - name: Check 126/128 ratified D7 residents, reserved coordinates and Lisp surface
        run: python3 scripts/check-d7-current-authority.py
      - name: Check D7 Sound/Text versus LocalOrdinal and arithmetic boundary
        run: python3 benchmarks/d7-ratification-conformance/validate.py
      - uses: dtolnay/rust-toolchain@stable
      - name: Prove mechanical dense W7 and contextual D2/Text7 identities
        run: cargo test --locked -p sens --test d7_w7_pack --test text7_contextual_binding
