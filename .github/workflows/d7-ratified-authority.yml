name: D7 ratified authority and exact W7 carrier

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "knowledge/d7-ratified.json"
      - "knowledge/d7-v2-evidence-ledger.json"
      - "contracts/d7-ratification.lisp"
      - "lib/domains/d7.lisp"
      - "language-contract.lisp"
      - "CURRENT.md"
      - "scripts/check-d7-current-authority.py"
      - "benchmarks/d7-ratification-conformance/**"
      - "crates/sens/src/domain_ladder.rs"
      - "crates/sens/src/domain_identity.rs"
      - "crates/sens/src/canonical_reader.rs"
      - "crates/sens/src/text7.rs"
      - "crates/sens/tests/d7_w7_pack.rs"
      - "crates/sens/tests/domain_ladder.rs"
      - "crates/sens/tests/d2_text7_frame_role_boundary.rs"
      - "crates/sens/tests/text7_contextual_binding.rs"
      - ".github/workflows/d7-ratified-authority.yml"
  workflow_dispatch:

permissions:
  contents: read

# Run on every main SHA: no historical green can replace current evidence.
jobs:
  authority:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: D7 owner authority and 126-row Lisp surface projection
        run: python3 scripts/check-d7-current-authority.py
      - name: D7 Sound/Text, LocalOrdinal and Number role boundaries
        run: python3 benchmarks/d7-ratification-conformance/validate.py
      - name: D7 exact width, W7 packing and contextual D2 framing
        run: >-
          cargo test --locked -p sens
          --test domain_ladder
          --test d7_w7_pack
          --test d2_text7_frame_role_boundary
          --test text7_contextual_binding
      - name: No semantic ownership in Rust D7 coordinate carrier
        run: >-
          cargo test --locked -p sens --lib
          domain_ladder::tests::every_d7_source_word_has_a_width_preserving_coordinate
