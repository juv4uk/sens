name: Temporary strict Core4 FASL regeneration
on:
  push:
    branches: [fix/core4-strict-cond-macro-20261010]
    paths: [".github/workflows/strict-cond-fasl-once.yml"]
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Rebuild canonical Core4 FASL and check strict freshness
        shell: bash
        run: |
          set -euo pipefail
          cargo run --locked --release -p sens-cli --bin gen-fasl -- lib/core4.lisp lib/core4.lisp.fasl
          cargo test --locked -p sens --test core_fasl_freshness
          sha256sum lib/core4.lisp lib/core4.lisp.fasl
          echo "FASL_BASE64=$(base64 -w 0 lib/core4.lisp.fasl)"
      - name: Commit only binary FASL, not this temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/core4.lisp.fasl
          git diff --cached --check
          git commit -m 'build(core4): regenerate FASL after two-field COND migration'
          git push origin HEAD:refs/heads/fix/core4-strict-cond-macro-20261010
