name: D9 local laws v1

on:
  workflow_dispatch:

jobs:
  laws:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: GPU runner identity
        run: nvidia-smi || true
      - name: Replay finite D9 law witnesses
        run: python3 scripts/research-d9-laws-1.py
      - name: Verify consolidated D9 inventory
        run: python3 scripts/check-d9-v1-semantic-inventory.py
