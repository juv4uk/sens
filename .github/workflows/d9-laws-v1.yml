name: D9 local laws v1

on:
  pull_request:
    paths:
      - "knowledge/d9-laws-v1.json"
      - "knowledge/d9-v1-semantic-inventory.json"
      - "knowledge/d9-fill-v1-state.json"
      - "scripts/research-d9-laws-1.py"
      - "scripts/check-d9-laws-1.py"
      - ".github/workflows/d9-laws-v1.yml"
  push:
    branches: [main]
    paths:
      - "knowledge/d9-laws-v1.json"
      - "knowledge/d9-v1-semantic-inventory.json"
      - "knowledge/d9-fill-v1-state.json"
      - "scripts/research-d9-laws-1.py"
      - "scripts/check-d9-laws-1.py"
      - ".github/workflows/d9-laws-v1.yml"
  workflow_dispatch:

jobs:
  laws:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: GPU runner identity
        run: nvidia-smi || true
      - name: Replay finite D9 law witnesses
        run: python3 scripts/research-d9-laws-1.py
      - name: Verify D9 law authority boundary
        run: python3 scripts/check-d9-laws-1.py
      - name: Verify consolidated D9 inventory
        run: python3 scripts/check-d9-v1-semantic-inventory.py
