name: "Тимчасове відновлення FASL для D6 нехай* (#5408)"
on:
  push:
    branches:
      - fix/5408-core4-letstar-empty-and-recursive-20261010
    paths:
      - lib/core.lisp
      - lib/core4.lisp
      - crates/sens/tests/core_fasl_freshness.rs
      - .github/workflows/core4-letstar-5408-branch-rebuild.yml

permissions:
  contents: write

jobs:
  regenerate-core4-on-isolated-branch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/5408-core4-letstar-empty-and-recursive-20261010
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Довести, що працюємо лише в ізольованій гілці
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "fix/5408-core4-letstar-empty-and-recursive-20261010"
          test "$GITHUB_REF_NAME" = "fix/5408-core4-letstar-empty-and-recursive-20261010"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --check
      - name: Створити автентичний двійковий FASL із чинного Core4
        run: cargo run --locked -p sens-cli --bin gen-fasl -- lib/core4.lisp lib/core4.lisp.fasl
      - name: Перевірити точний AST та SHA FASL, послідовні й негативні прив'язки
        run: cargo test --locked -p sens --test core_fasl_freshness -- --nocapture
      - name: Перевірити реальний український D6-свідок у CLI
        shell: bash
        run: |
          set -euo pipefail
          cargo run --locked --quiet -p sens-cli --bin sens -- witnesses/quantity-sequential-binding.lisp > "$RUNNER_TEMP/letstar.out"
          grep -Fxq '7' "$RUNNER_TEMP/letstar.out"
      - name: Зберегти регенерований FASL тільки в дослідній гілці
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "fix/5408-core4-letstar-empty-and-recursive-20261010"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git add -- lib/core4.lisp.fasl
          if git diff --cached --quiet; then
            echo "FASL уже співпадає з джерелом"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "збірка(5408): зафіксувати справжній FASL після перевірених прив'язок"
          git push origin HEAD:refs/heads/fix/5408-core4-letstar-empty-and-recursive-20261010
