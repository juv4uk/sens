name: Core source integrity

on:
  pull_request:
    paths:
      - "lib/core.lisp"
      - "lib/core4.lisp.fasl"
      - ".github/workflows/core4-source-replay.yml"
  push:
    branches: [main]
    paths:
      - "lib/core.lisp"
      - "lib/core4.lisp.fasl"
      - ".github/workflows/core4-source-replay.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Single active core artifacts exist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Prove canonical source and snapshot exist
        shell: bash
        run: |
          set -euo pipefail
          test -s lib/core.lisp
          test -s lib/core4.lisp.fasl
          printf 'core source sha256: '
          sha256sum lib/core.lisp
          printf 'core fasl sha256: '
          sha256sum lib/core4.lisp.fasl

      - name: No active Core4 replay authority
        shell: bash
        run: |
          set -euo pipefail
          ! grep -F 'current-profile-source . "lib/core4.lisp"' contracts/core-profile-contract.lisp
          grep -F '(active-core-source . "lib/core.lisp")' contracts/core-profile-contract.lisp

      - name: Diff hygiene
        run: git diff --check
