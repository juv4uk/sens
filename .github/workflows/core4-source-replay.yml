name: Core4 source replay

on:
  pull_request:
    paths:
      - "lib/core.lisp"
      - "lib/core4.lisp"
      - "tests/fixtures/core4-predicate-combinator-v1.lisp"
      - ".github/workflows/core4-source-replay.yml"
  push:
    branches: [main]
    paths:
      - "lib/core.lisp"
      - "lib/core4.lisp"
      - "tests/fixtures/core4-predicate-combinator-v1.lisp"
      - ".github/workflows/core4-source-replay.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    name: Current core donor replays exactly as Core4
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Prove byte-for-byte replay
        shell: bash
        run: |
          set -euo pipefail
          test -s lib/core.lisp
          test -s lib/core4.lisp
          cmp --silent lib/core.lisp lib/core4.lisp
          printf 'core donor sha256: '
          sha256sum lib/core.lisp
          printf 'core4 replay sha256: '
          sha256sum lib/core4.lisp

      - name: Contract-8 landmarks survive replay
        shell: bash
        run: |
          set -euo pipefail
          grep -F '(1)' lib/core4.lisp
          grep -F '(1)' lib/core4.lisp
          grep -F '(1)' lib/core4.lisp

      - name: Execute variadic PredicateBit combinators
        shell: bash
        run: |
          set -euo pipefail
          cargo run --release -p sens-cli --bin gen-fasl -- lib/core4.lisp lib/core4.lisp.fasl
          cargo build -p sens-cli --bin sens
          ./target/debug/sens tests/fixtures/core4-predicate-combinator-v1.lisp > /tmp/core4-predicate-combinators.out
          cat /tmp/core4-predicate-combinators.out
          test "$(grep -cx '1' /tmp/core4-predicate-combinators.out)" -eq 5

      - name: Diff hygiene
        run: git diff --check
