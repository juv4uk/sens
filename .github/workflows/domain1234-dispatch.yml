name: Historical pre-bīja3 D3-D4 dispatch benchmark

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/domain1234-dispatch.yml"
      - "benchmarks/domain1234-dispatch/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/domain1234-dispatch.yml"
      - "benchmarks/domain1234-dispatch/**"

concurrency:
  group: d34-dispatch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Install Valgrind
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind gcc
          valgrind --version
          gcc --version
      - name: Measure historical pre-bīja3 D3/D4 dispatch mechanisms
        run: |
          mkdir -p /tmp/d34
          python3 benchmarks/domain1234-dispatch/run.py \
            --out /tmp/d34/raw.tsv \
            --report /tmp/d34/report.md \
            --calls 200000 \
            --reps 3
      - name: Upload raw evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: historical-pre-bija3-d34-dispatch-cachegrind
          path: |
            /tmp/d34/raw.tsv
            /tmp/d34/report.md
          retention-days: 7
