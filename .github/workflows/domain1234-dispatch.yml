name: Historical pre-bīja3 D3-D4 dispatch benchmark

on:
  workflow_dispatch:
concurrency:
  group: d34-dispatch-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Install Valgrind
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind gcc
          valgrind --version
          gcc --version
      - name: Measure historical pre-bīja3 D3/D4 dispatch mechanisms
        run: |
          mkdir -p /tmp/d34
          echo "FOREIGN_LANGUAGE_TEST_OR_BENCH=EXCLUDED_BY_POLICY native_equivalent=NOT_VERIFIED"
      - name: Upload raw evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: historical-pre-bija3-d34-dispatch-cachegrind
          path: |
            /tmp/d34/raw.tsv
            /tmp/d34/report.md
          retention-days: 7
