name: TEMP compiler nucleus migration generator

on:
  pull_request:
    paths:
      - ".github/workflows/temp-compiler-nucleus-migrate.yml"
      - "lib/compiler-nucleus.lisp"
      - "crates/sens-cli/src/bin/sens-to-sens.rs"

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build canonical migration tool
        run: cargo build --release -p sens-cli --bin sens-to-sens
      - name: Rewrite compiler nucleus with repository tool
        run: |
          cp lib/compiler-nucleus.lisp /tmp/compiler-nucleus.before.lisp
          target/release/sens-to-sens lib/compiler-nucleus.lisp | tee /tmp/migrate.txt
          target/release/sens-to-sens --check lib/compiler-nucleus.lisp | tee /tmp/check.txt
          grep -F "lib/compiler-nucleus.lisp: convertible=0" /tmp/check.txt
          git diff -- lib/compiler-nucleus.lisp > /tmp/compiler-nucleus.diff
          test -s /tmp/compiler-nucleus.diff
          cp lib/compiler-nucleus.lisp /tmp/compiler-nucleus.after.lisp
      - uses: actions/upload-artifact@v4
        with:
          name: compiler-nucleus-sens-migration
          path: |
            /tmp/compiler-nucleus.before.lisp
            /tmp/compiler-nucleus.after.lisp
            /tmp/compiler-nucleus.diff
            /tmp/migrate.txt
            /tmp/check.txt
          retention-days: 3
