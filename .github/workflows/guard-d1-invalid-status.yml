name: Guard exact-D1 direct-status migration

on:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  d1-guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: "D1-D10: 2046 coordinates, 2 historical Git blobs, 93 call-head bits"
        run: python3 -m unittest discover -s tests -p 'test_guard_d1_invalid_status.py' -v
      - uses: dtolnay/rust-toolchain@stable
      - name: "Guard: exact D1, 12 status responses, historical parity, short-circuit"
        run: cargo test --locked -p sens --test guard_d1_invalid_status -- --nocapture
