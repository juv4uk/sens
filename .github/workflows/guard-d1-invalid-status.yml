name: Guard — лише SENS-власний семантичний свідок

on:
  push:
    branches: [main]
    paths:
      - "lib/guard.lisp"
      - "crates/sens/tests/guard.rs"
      - "tests/fixtures/guard-exact-d3-semantic.lisp"
      - ".github/workflows/guard-d1-invalid-status.yml"
  pull_request:
    paths:
      - "lib/guard.lisp"
      - "crates/sens/tests/guard.rs"
      - "tests/fixtures/guard-exact-d3-semantic.lisp"
      - ".github/workflows/guard-d1-invalid-status.yml"

permissions:
  contents: read

jobs:
  d1-guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: "SENS сам перевіряє логіку Guard у двійковій програмі"
        run: cargo test --locked -p sens --test guard -- --nocapture
