name: Same-machine SENS cross-language benchmark

on:
  pull_request:
    paths:
      - "benchmarks/cross-language/current_sens.py"
      - "benchmarks/cross-language/external_controls.py"
      - "benchmarks/cross-language/footprint_controls.py"
      - "benchmarks/cross-language/join_current_ratios.py"
      - "benchmarks/cross-language/pareto_report.py"
      - "benchmarks/cross-language/test_pareto_report.py"
      - "crates/sens/examples/current_exact_domain_bench.rs"
      - "crates/sens/src/mixed_source.rs"
      - ".github/workflows/same-machine-cross-language.yml"
  workflow_dispatch:

concurrency:
  group: same-machine-cross-language-${{ github.ref }}
  cancel-in-progress: true

jobs:
  paired:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Fast Pareto accounting smoke
        run: python3 benchmarks/cross-language/test_pareto_report.py

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install external runtimes and measurement tools
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4 racket sbcl valgrind time binutils
          python3 --version
          lua5.4 -v
          racket --version
          sbcl --version
          rustc --version
          valgrind --version
          /usr/bin/time --version | head -1
          size --version | head -1

      - name: Build current SENS runner before measurement
        run: cargo build -p sens --release --example current_exact_domain_bench

      - name: Run external controls
        run: |
          rm -rf /tmp/cross-language-paired
          mkdir -p /tmp/cross-language-paired/external /tmp/cross-language-paired/sens /tmp/cross-language-paired/footprint /tmp/cross-language-paired/join /tmp/cross-language-paired/pareto
          python3 benchmarks/cross-language/external_controls.py --lua lua5.4 --racket racket --sbcl sbcl --rustc rustc --reps 3 --out /tmp/cross-language-paired/external

      - name: Run current exact-domain SENS
        run: |
          python3 benchmarks/cross-language/current_sens.py --runner target/release/examples/current_exact_domain_bench --reps 3 --out /tmp/cross-language-paired/sens

      - name: Collect scoped footprint on the same host
        run: |
          python3 benchmarks/cross-language/footprint_controls.py --sens-runner target/release/examples/current_exact_domain_bench --lua lua5.4 --racket racket --sbcl sbcl --rustc rustc --rss-reps 3 --out /tmp/cross-language-paired/footprint
          cat /tmp/cross-language-paired/footprint/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Join paired ratios
        run: |
          python3 benchmarks/cross-language/join_current_ratios.py --external /tmp/cross-language-paired/external/external-full.tsv --sens /tmp/cross-language-paired/sens/sens-exact-full.tsv --out /tmp/cross-language-paired/join
          cat /tmp/cross-language-paired/join/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Build Pareto tables
        run: |
          python3 benchmarks/cross-language/pareto_report.py --external /tmp/cross-language-paired/external/external-full.tsv --sens /tmp/cross-language-paired/sens/sens-exact-full.tsv --footprint /tmp/cross-language-paired/footprint/footprint.tsv --out /tmp/cross-language-paired/pareto
          cat /tmp/cross-language-paired/pareto/report.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: same-machine-sens-cross-language
          path: /tmp/cross-language-paired
