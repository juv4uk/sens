name: Residue root domain law

on:
  workflow_dispatch:

jobs:
  tournament:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Run parentless-root domain tournament — EXCLUDED (NOT_VERIFIED)
        if: false
        shell: bash
        run: echo "FOREIGN_LANGUAGE_BENCH=EXCLUDED_BY_POLICY native_equivalent=NOT_VERIFIED"
      - name: Publish report
        if: always()
        run: |
          if test -f /tmp/residue-domain-law/report.md; then
            cat /tmp/residue-domain-law/report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: residue-domain-law
          path: /tmp/residue-domain-law/
          retention-days: 14
