name: Sens8 current coverage v1

on:
  pull_request:
    paths:
      - "lib/generated/function-table.lisp"
      - "knowledge/sens8-current-coverage-v1.json"
      - "knowledge/d10-v1-semantic-inventory.json"
      - "knowledge/d10-fill-v1-state.json"
      - "scripts/check-sens8-current-coverage-v1.py"
      - ".github/workflows/sens8-current-coverage-v1.yml"
  push:
    branches: [main]
    paths:
      - "knowledge/sens8-current-coverage-v1.json"
      - "knowledge/d10-fill-v1-state.json"
      - "scripts/check-sens8-current-coverage-v1.py"
      - ".github/workflows/sens8-current-coverage-v1.yml"
  workflow_dispatch:

jobs:
  coverage:
    runs-on: [self-hosted, Linux, X64, gpu, gtx-1050-ti, cuda-12.6]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: GPU runner identity
        run: nvidia-smi || true
      - name: Verify complete Sens8 donor coverage
        run: python3 scripts/check-sens8-current-coverage-v1.py
      - name: Verify D10 seed still valid
        run: python3 scripts/check-d10-fill-v1-seed.py
