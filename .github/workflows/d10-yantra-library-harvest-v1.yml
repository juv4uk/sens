name: Дослідження D10 — перевірка бібліотечного донора Yantra

on:
  workflow_dispatch:

jobs:
  harvest:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Негативні свідки цілісності та рухомих рядків — EXCLUDED (NOT_VERIFIED)
        if: false
        shell: bash
        run: echo "FOREIGN_LANGUAGE_TEST_BENCH=EXCLUDED_BY_POLICY native_equivalent=NOT_VERIFIED"
      - name: Перевірити розширення історичного добору D10 Panini
        run: python3 scripts/check-d10-crossrepo-panini-v1.py
      - name: Перевірити повноваження й облік D10
        run: python3 scripts/check-d10-fill-v1-seed.py
