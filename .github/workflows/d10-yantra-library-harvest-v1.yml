name: Дослідження D10 — перевірка бібліотечного донора Yantra

on:
  pull_request:
    paths:
      - "lib/yantra.lisp"
      - "knowledge/d10-yantra-library-harvest-v1.json"
      - "knowledge/d10-v1-semantic-inventory.json"
      - "knowledge/d10-fill-v1-state.json"
      - "scripts/check-d10-yantra-library-harvest-v1.py"
      - "knowledge/archive/d10-yantra-donor-76460b72.lisp"
      - "scripts/check-d10-crossrepo-panini-v1.py"
      - ".github/workflows/d10-yantra-library-harvest-v1.yml"
  push:
    branches: [main]
    paths:
      - "lib/yantra.lisp"
      - "knowledge/d10-yantra-library-harvest-v1.json"
      - "knowledge/d10-v1-semantic-inventory.json"
      - "knowledge/d10-fill-v1-state.json"
      - "scripts/check-d10-yantra-library-harvest-v1.py"
      - "knowledge/archive/d10-yantra-donor-76460b72.lisp"
      - ".github/workflows/d10-yantra-library-harvest-v1.yml"
  workflow_dispatch:

jobs:
  harvest:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Перевірити історичний SHA, рядки донора й чинні визначення
        run: python3 scripts/check-d10-yantra-library-harvest-v1.py
      - name: Перевірити розширення історичного добору D10 Panini
        run: python3 scripts/check-d10-crossrepo-panini-v1.py
      - name: Перевірити повноваження й облік D10
        run: python3 scripts/check-d10-fill-v1-seed.py
