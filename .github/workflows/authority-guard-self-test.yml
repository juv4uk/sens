name: Authority Guard Self-Test

on:
  pull_request:
    paths:
      - ".github/workflows/authority-guard-self-test.yml"
      - "scripts/authority-guard.lisp"
      - "scripts/authority-guard-enforce.lisp"
      - "tests/fixtures/semantic-authority-guard/**"
      - "scripts/test-semantic-authority-guard.sh"
      - "scripts/semantic-authority-guard-enforce.lisp"
      - "scripts/semantic-authority-guard.lisp"
      - "tests/authority-inventory.lisp"
      - "tests/fixtures/authority-guard/**"
      - "lib/life-1-scheduler.lisp"
      - "tests/fixtures/life-1-scheduler-witness.lisp"
      - "crates/sens/tests/life_1_scheduler.rs"
  push:
    branches: [main]
    paths:
      - ".github/workflows/authority-guard-self-test.yml"
      - "scripts/authority-guard.lisp"
      - "scripts/authority-guard-enforce.lisp"
      - "tests/authority-inventory.lisp"
      - "tests/fixtures/authority-guard/**"
  workflow_dispatch:

jobs:
  self-test:
    name: forbidden fails, mechanism passes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: authority-guard-self-test

      - name: Build sens transport
        run: cargo build -p sens-cli --bin sens

      - name: Host semantic fixture is accepted
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' \
            '(change "tests/fixtures/authority-guard/forbidden-semantic.rs" modified)' \
            > tests/changed-host-tests.lisp

          ./target/debug/sens scripts/authority-guard.lisp > tests/authority-verdict.lisp
          cat tests/authority-verdict.lisp
          grep -q 'authority-ok' tests/authority-verdict.lisp
          ./target/debug/sens scripts/authority-guard-enforce.lisp

      - name: Host mechanism fixture is accepted
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' \
            '(change "tests/fixtures/authority-guard/allowed-mechanism.rs" modified)' \
            > tests/changed-host-tests.lisp

          ./target/debug/sens scripts/authority-guard.lisp > tests/authority-verdict.lisp
          cat tests/authority-verdict.lisp
          grep -q 'authority-ok' tests/authority-verdict.lisp
          ./target/debug/sens scripts/authority-guard-enforce.lisp

      - name: Asymmetric semantic firewall fixtures
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/test-semantic-authority-guard.sh ./target/debug/sens

      - name: Focused LIFE-1 scheduler witness
        run: cargo test -p sens --test life_1_scheduler
