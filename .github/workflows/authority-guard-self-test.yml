name: Authority Guard Self-Test

on:
  workflow_dispatch:

jobs:
  self-test:
    name: asymmetric firewall fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: authority-guard-self-test

      - name: Build sens transport
        run: cargo build -p sens-cli --bin sens

      - name: Asymmetric semantic firewall fixtures
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/test-semantic-authority-guard.sh ./target/debug/sens

      - name: Focused LIFE-1 scheduler witness
        run: cargo test -p sens --test life_1_scheduler
