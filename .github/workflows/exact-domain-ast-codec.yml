name: Точний AST кодек доменів D1–D9

on:
  push:
    branches: [main]
    paths:
      - "crates/sens/src/syntax.rs"
      - ".github/workflows/exact-domain-ast-codec.yml"
  pull_request:
    paths:
      - "crates/sens/src/syntax.rs"
      - ".github/workflows/exact-domain-ast-codec.yml"
  workflow_dispatch:

jobs:
  exact-ast-codec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Перевірити точні доменні слова та відхилення неправильних ширин у wire
        run: >-
          cargo test --locked -p sens --lib syntax::wire_tests:: -- --nocapture
      - name: Перевірити незмінність FASL і зворотний запис
        run: >-
          cargo test --locked -p sens --lib syntax::fasl_tests:: -- --nocapture
