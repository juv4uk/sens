name: Migration non-program evidence manifest

on:
  pull_request:
    paths:
      - "knowledge/migration-nonprogram-evidence-manifest-2026-10-08.json"
      - "tests/test_migration_nonprogram_evidence_manifest.py"
      - "evidence/**/*.lisp"
      - "tests/fixtures/semantic-authority-guard/allowed-lisp-host-evidence.lisp"
      - ".github/workflows/migration-nonprogram-evidence.yml"
  push:
    branches: [main]
    paths:
      - "knowledge/migration-nonprogram-evidence-manifest-2026-10-08.json"
      - "tests/test_migration_nonprogram_evidence_manifest.py"
      - "evidence/**/*.lisp"
      - "tests/fixtures/semantic-authority-guard/allowed-lisp-host-evidence.lisp"
      - ".github/workflows/migration-nonprogram-evidence.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Verify path-pinned non-program evidence cohort
        run: python3 -m unittest tests.test_migration_nonprogram_evidence_manifest -v
