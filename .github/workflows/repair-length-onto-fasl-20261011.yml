name: temporary Core4 FASL regeneration (isolated 5408 repair)

on:
  push:
    branches:
      - fix/5408-length-onto-current-098f-20261011

permissions:
  contents: write

concurrency:
  group: sens-core4-fasl-regeneration-${{ github.ref }}
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Regenerate FASL from exact source
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/core4.lisp.fasl"
          cargo run --locked --release -p sens-cli --bin gen-fasl -- lib/core4.lisp "$output"
          test -s "$output"
          cp "$output" lib/core4.lisp.fasl
      - name: Commit generated FASL only to the repair branch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- lib/core4.lisp.fasl; then
            echo "Core4 FASL already matches generated source."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/core4.lisp.fasl
          git commit -m "build(core4): regenerate FASL after exact NULL fix"
          git push origin "HEAD:$GITHUB_REF_NAME"
