name: Ratified domains D1-D4 benchmark

# Active benchmark lane after D1-D4 owner ratification (#2151/#2162).
# The retired English-Lisp-vs-Function8 comparison remains historical evidence
# under benchmarks/sens-surface, but it is no longer an automatic CI baseline.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/sens-bench.yml"
      - "crates/sens/src/bits.rs"
      - "crates/sens/src/domain_words.rs"
      - "crates/sens/examples/domain1234_bench.rs"
      - "benchmarks/domain1234/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/sens-bench.yml"
      - "crates/sens/src/bits.rs"
      - "crates/sens/src/domain_words.rs"
      - "crates/sens/examples/domain1234_bench.rs"
      - "benchmarks/domain1234/**"

# A newer head supersedes older benchmark evidence on the same ref, including
# main. This prevents stale benchmark queues from consuming runner capacity.
concurrency:
  group: domain1234-bench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: domain1234-bench

      - name: Install Valgrind
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind
          valgrind --version

      - name: Build ratified-foundation benchmark
        run: cargo build --release -p sens --example domain1234_bench

      - name: Measure D1-D4 exact-width foundation
        run: |
          mkdir -p /tmp/domain1234
          python3 benchmarks/domain1234/run.py \
            --binary target/release/examples/domain1234_bench \
            --out /tmp/domain1234/results.tsv \
            --iterations 200000 \
            --reps 3

      - name: Upload D1-D4 benchmark evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: domain1234-cachegrind
          path: /tmp/domain1234/results.tsv
          retention-days: 7
