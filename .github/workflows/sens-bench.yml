name: Language benchmark (instructions, base vs change)

# #1433: швидкий детермінований бенчмарк — кількість інструкцій процесора
# (valgrind) для 11 програм × 2 форми (англійська / SENS), база і зміна
# міряються на одній машині. Регрес понад поріг — червоний крок.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  bench:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: sens-bench
      - name: Install valgrind
        run: sudo apt-get update -qq && sudo apt-get install -y -qq valgrind
      - name: Preserve harness from the change
        run: |
          mkdir -p /tmp/bench
          cp benchmarks/sens-surface/run.py benchmarks/sens-surface/ci_bench.sh \
             benchmarks/sens-surface/ci_compare.py crates/my-lisp/examples/ci_bench.rs /tmp/bench/
          python3 /tmp/bench/run.py --sens /bin/true --emit /tmp/bench/workloads --small
      - name: Measure base on this runner
        run: |
          git checkout --detach "$BASE_SHA"
          cp /tmp/bench/ci_bench.rs crates/my-lisp/examples/ci_bench.rs
          cargo build --release -p my-lisp --example ci_bench
          sh /tmp/bench/ci_bench.sh target/release/examples/ci_bench /tmp/bench/workloads /tmp/bench/base.tsv
          git checkout -- . && git clean -fdq crates/my-lisp/examples
      - name: Measure change on this runner
        run: |
          git checkout --detach "$HEAD_SHA"
          # Гілка може бути старшою за сам харнес — міряємо тим самим файлом.
          cp /tmp/bench/ci_bench.rs crates/my-lisp/examples/ci_bench.rs
          cargo build --release -p my-lisp --example ci_bench
          sh /tmp/bench/ci_bench.sh target/release/examples/ci_bench /tmp/bench/workloads /tmp/bench/head.tsv
      - name: Compare base -> change
        run: python3 /tmp/bench/ci_compare.py /tmp/bench/base.tsv /tmp/bench/head.tsv --fail-above 3.0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sens-bench-instructions
          path: /tmp/bench/*.tsv
