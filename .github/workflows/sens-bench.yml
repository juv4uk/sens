name: Contract 11.8 W1-W9 carrier benchmark

# Exact-width carrier benchmark across the implemented W1..W9 ladder.
# Contract 11.8 authority is D1-D9 current. W9 is measured mechanically
# through the exact u16 carrier; domain-law execution remains separate.
# Measuring a carrier never grants callability or replaces semantic authority.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/sens-bench.yml"
      - "crates/sens/src/bits.rs"
      - "crates/sens/src/domain_words.rs"
      - "crates/sens/src/domain_identity.rs"
      - "crates/sens/src/source_words.rs"
      - "crates/sens/examples/domain12345678_bench.rs"
      - "benchmarks/domain12345678/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/sens-bench.yml"
      - "crates/sens/src/bits.rs"
      - "crates/sens/src/domain_words.rs"
      - "crates/sens/src/domain_identity.rs"
      - "crates/sens/src/source_words.rs"
      - "crates/sens/examples/domain12345678_bench.rs"
      - "benchmarks/domain12345678/**"

# Pinned-SHA Cachegrind measurements must not be cancelled by the push storm.
# Path-scoped triggers already limit measurements to changed carrier code.

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: domain12345678-bench

      - name: Install Valgrind
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind
          valgrind --version
          rustc --version

      - name: Build W1-W9 carrier benchmark
        run: cargo build --release -p sens --example domain12345678_bench

      - name: Measure Contract 11.8 W1-W9 mechanical carrier cost
        run: |
          rm -rf /tmp/domain12345678
          python3 benchmarks/domain12345678/run.py \
            --binary target/release/examples/domain12345678_bench \
            --out-dir /tmp/domain12345678 \
            --iterations 200000 \
            --reps 3

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: domain12345678-cachegrind
          path: /tmp/domain12345678
          retention-days: 7
