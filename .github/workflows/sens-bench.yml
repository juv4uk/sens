name: Language benchmark (English Lisp vs SENS, instructions)

# #1433: швидкий відтворюваний бенчмарк — кількість інструкцій процесора
# (valgrind) для 11 програм на одному коміті: англійський Lisp (текст, імена)
# проти SENS (двійковий вигляд, функція = 1 байт), той самий бінарник.
# Страховка: попередній коміт проти зміни; уповільнення понад поріг —
# червоний крок.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  bench:
    runs-on: [self-hosted, guix]
    timeout-minutes: 30
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: sens-bench
      - name: Valgrind from the Guix channel pin
        # Власний runner: без sudo/apt — valgrind з того самого закріпленого Guix-каналу.
        run: |
          VG="$(guix time-machine -C channels.scm -- build valgrind | grep -v -- '-debug$' | tail -1)"
          echo "$VG/bin" >> "$GITHUB_PATH"
          "$VG/bin/valgrind" --version
      - name: Preserve harness from the change
        run: |
          rm -rf /tmp/bench && mkdir -p /tmp/bench
          cp benchmarks/sens-surface/run.py benchmarks/sens-surface/ci_bench.sh \
             benchmarks/sens-surface/ci_compare.py crates/sens/examples/ci_bench.rs /tmp/bench/
          python3 /tmp/bench/run.py --sens /bin/true --emit /tmp/bench/workloads --small \
            --forms en,sens
      - name: Measure base on this runner
        run: |
          git checkout --detach "$BASE_SHA"
          # Назва каталогу крейта різна на базі й на гілці — визначаємо з дерева.
          CRATE_DIR="$(ls -d crates/my-lisp 2>/dev/null || ls -d crates/sens)"
          CRATE_PKG="$(basename "$CRATE_DIR")"
          cp /tmp/bench/ci_bench.rs "$CRATE_DIR/examples/ci_bench.rs"
          cargo build --release -p "$CRATE_PKG" --example ci_bench
          sh /tmp/bench/ci_bench.sh target/release/examples/ci_bench /tmp/bench/workloads /tmp/bench/base.tsv
          git checkout -- . && git clean -fdq "$CRATE_DIR/examples"
      - name: Measure change on this runner
        run: |
          git checkout --detach "$HEAD_SHA"
          # Гілка може бути старшою за сам харнес — міряємо тим самим файлом.
          cp /tmp/bench/ci_bench.rs crates/sens/examples/ci_bench.rs
          cargo build --release -p sens --example ci_bench
          sh /tmp/bench/ci_bench.sh target/release/examples/ci_bench /tmp/bench/workloads /tmp/bench/head.tsv
      - name: Compare English Lisp -> SENS, and base -> change
        run: python3 /tmp/bench/ci_compare.py /tmp/bench/base.tsv /tmp/bench/head.tsv --fail-above 3.0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sens-bench-instructions
          path: /tmp/bench/*.tsv
