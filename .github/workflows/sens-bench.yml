# Manual diagnostic only. Carrier timing belongs to Rust; language laws stay in Lisp/SENS.
name: Contract 11.8 carrier — native Rust

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: domain12345678-bench-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.99.0
      - name: Build the exact-width carrier benchmark
        shell: bash
        run: cargo build --locked --release -p sens --example domain12345678_bench
      - name: Verify exact identities before adaptive timing
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/domain12345678"
          mkdir -p "$out"
          binary="$PWD/target/release/examples/domain12345678_bench"
          for case in empty d1 d2 d3 d4 d5 d6 d7 d8 d9 mixed width-roundtrip; do
            "$binary" series "$case" 100000 9 >> "$out/raw.tsv"
          done
          test "$(grep -c '^RUST_DOMAIN_SAMPLE[[:space:]]' "$out/raw.tsv")" -eq 108
          test "$(grep -c '^RUST_DOMAIN_SUMMARY[[:space:]]' "$out/raw.tsv")" -eq 12
          cat "$out/raw.tsv"
      - name: Preserve measured Rust samples
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node 24
        with:
          name: domain-carrier-rust-${{ github.sha }}
          path: ${{ runner.temp }}/domain12345678/raw.tsv
          if-no-files-found: warn
          retention-days: 21
