name: Language benchmark (old English Lisp vs SENS, instructions)

# #1433: швидкий детермінований бенчмарк — кількість інструкцій процесора
# (valgrind) для 11 програм. Головне порівняння: закріплений англійський Lisp
# до таблиці функцій (LEGACY_SHA, 2026-09-08) проти SENS цієї зміни — так видно
# справжній прогрес мови. Страховка: база (попередній коміт) проти зміни;
# регрес понад поріг — червоний крок.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  bench:
    runs-on: [self-hosted, guix]
    timeout-minutes: 45
    env:
      # Англійський Lisp до реєстру й таблиці функцій (перед 16620d83).
      LEGACY_SHA: b4f75d2f3de1eff3a5784b60d9bb57978e0accb0
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: sens-bench
      - name: Valgrind from the Guix channel pin
        # Власний runner: без sudo/apt — valgrind з того самого закріпленого Guix-каналу.
        run: |
          VG="$(guix time-machine -C channels.scm -- build valgrind | grep -v -- '-debug$' | tail -1)"
          echo "$VG/bin" >> "$GITHUB_PATH"
          "$VG/bin/valgrind" --version
      - name: Preserve harness from the change
        run: |
          rm -rf /tmp/bench && mkdir -p /tmp/bench
          cp benchmarks/sens-surface/run.py benchmarks/sens-surface/ci_bench.sh \
             benchmarks/sens-surface/ci_compare.py benchmarks/sens-surface/ci_bench_legacy.rs \
             crates/sens/examples/ci_bench.rs /tmp/bench/
          python3 /tmp/bench/run.py --sens /bin/true --emit /tmp/bench/workloads --small \
            --forms en,sens,legacy-en
      - name: Measure old English Lisp (LEGACY_SHA, before the function table)
        env:
          # Закріплений коміт не змінюється: збірка живе в кеші ранера.
          CARGO_TARGET_DIR: ${{ runner.tool_cache }}/sens-bench-legacy-target
        run: |
          git checkout --detach "$LEGACY_SHA"
          mkdir -p crates/my-lisp/examples
          cp /tmp/bench/ci_bench_legacy.rs crates/my-lisp/examples/ci_bench.rs
          cargo build --release -p my-lisp --example ci_bench
          sh /tmp/bench/ci_bench.sh "$CARGO_TARGET_DIR/release/examples/ci_bench" \
            /tmp/bench/workloads /tmp/bench/legacy.tsv legacy-en
          git checkout -- . && git clean -fdq crates/my-lisp/examples
      - name: Measure base on this runner
        run: |
          git checkout --detach "$BASE_SHA"
          # Назва каталогу крейта різна на базі й на гілці — визначаємо з дерева.
          CRATE_DIR="$(ls -d crates/my-lisp 2>/dev/null || ls -d crates/sens)"
          CRATE_PKG="$(basename "$CRATE_DIR")"
          cp /tmp/bench/ci_bench.rs "$CRATE_DIR/examples/ci_bench.rs"
          cargo build --release -p "$CRATE_PKG" --example ci_bench
          sh /tmp/bench/ci_bench.sh target/release/examples/ci_bench /tmp/bench/workloads /tmp/bench/base.tsv
          git checkout -- . && git clean -fdq "$CRATE_DIR/examples"
      - name: Measure change on this runner
        run: |
          git checkout --detach "$HEAD_SHA"
          # Гілка може бути старшою за сам харнес — міряємо тим самим файлом.
          cp /tmp/bench/ci_bench.rs crates/sens/examples/ci_bench.rs
          cargo build --release -p sens --example ci_bench
          sh /tmp/bench/ci_bench.sh target/release/examples/ci_bench /tmp/bench/workloads /tmp/bench/head.tsv
      - name: Compare old English -> SENS, and base -> change
        run: |
          python3 /tmp/bench/ci_compare.py /tmp/bench/base.tsv /tmp/bench/head.tsv \
            --legacy /tmp/bench/legacy.tsv --fail-above 3.0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sens-bench-instructions
          path: /tmp/bench/*.tsv
