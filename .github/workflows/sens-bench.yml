name: W1-W8 exact-width carrier benchmark

# Exact-width carrier/runtime benchmark. Contract 11.4 semantic authority is
# D1-D5 current; D6-D8 remain research. Historical results stay archived.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/sens-bench.yml"
      - "crates/sens/src/bits.rs"
      - "crates/sens/src/domain_words.rs"
      - "crates/sens/src/domain_identity.rs"
      - "crates/sens/src/source_words.rs"
      - "crates/sens/examples/domain12345678_bench.rs"
      - "benchmarks/domain12345678/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/sens-bench.yml"
      - "crates/sens/src/bits.rs"
      - "crates/sens/src/domain_words.rs"
      - "crates/sens/src/domain_identity.rs"
      - "crates/sens/src/source_words.rs"
      - "crates/sens/examples/domain12345678_bench.rs"
      - "benchmarks/domain12345678/**"

concurrency:
  group: domain12345678-bench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: domain12345678-bench

      - name: Install Valgrind
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind
          valgrind --version
          rustc --version

      - name: Build D1-D8 benchmark
        run: cargo build --release -p sens --example domain12345678_bench

      - name: Measure D1-D8 exact-domain carrier/runtime
        run: |
          rm -rf /tmp/domain12345678
          python3 benchmarks/domain12345678/run.py \
            --binary target/release/examples/domain12345678_bench \
            --out-dir /tmp/domain12345678 \
            --iterations 200000 \
            --reps 3

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: domain12345678-cachegrind
          path: /tmp/domain12345678
          retention-days: 7
