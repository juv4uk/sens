name: D1-D6 current, D7-D8 research, W1-W8 benchmark

# Exact-width carrier/runtime benchmark under Contract 11.5.
# Semantic identity authority: D1-D6 current; D7-D8 research.
# W1-W8 remain mechanical carrier controls; callability is reported separately.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/sens-bench.yml"
      - "crates/sens/src/bits.rs"
      - "crates/sens/src/domain_words.rs"
      - "crates/sens/src/domain_identity.rs"
      - "crates/sens/src/source_words.rs"
      - "crates/sens/examples/domain12345678_bench.rs"
      - "benchmarks/domain12345678/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/sens-bench.yml"
      - "crates/sens/src/bits.rs"
      - "crates/sens/src/domain_words.rs"
      - "crates/sens/src/domain_identity.rs"
      - "crates/sens/src/source_words.rs"
      - "crates/sens/examples/domain12345678_bench.rs"
      - "benchmarks/domain12345678/**"

concurrency:
  group: domain12345678-bench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: domain12345678-bench

      - name: Install Valgrind
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind
          valgrind --version
          rustc --version

      - name: Build W1-W8 carrier benchmark
        run: cargo build --release -p sens --example domain12345678_bench

      - name: Measure W1-W8 carrier cost under D1-D6 authority split
        run: |
          rm -rf /tmp/domain12345678
          python3 benchmarks/domain12345678/run.py \
            --binary target/release/examples/domain12345678_bench \
            --out-dir /tmp/domain12345678 \
            --iterations 200000 \
            --reps 3

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: domain12345678-cachegrind
          path: /tmp/domain12345678
          retention-days: 7
