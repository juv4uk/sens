name: Math free-placement research

on:
  pull_request:
    paths:
      - "scripts/research-2250-math-placement.py"
      - "scripts/research-2276-law-fingerprints.py"
      - ".github/workflows/math-free-placement-research.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-q-witness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify arithmetic family and order action algebra
        run: python3 scripts/research-2250-math-placement.py
      - name: Recover candidate domains from law fingerprints
        run: python3 scripts/research-2276-law-fingerprints.py
