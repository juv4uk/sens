name: Release

# Карантин власника 2026-10-13: автоматичний релізний workflow вимкнено.
# Ручний запуск із вибраного релізного тегу — лише після явного дозволу власника.
on:
  workflow_dispatch:

permissions:
  contents: read

# Never publish a partial release or let concurrent tagged runs race.
concurrency:
  group: sens-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: focused release smoke before publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/actions/install-zig
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          toolchain: "1.99.0"
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - name: Release version alignment (gate #1 mechanical)
        run: |
          python3 scripts/check-release-version-alignment.py --self-test
          python3 scripts/check-release-version-alignment.py
      - name: Release toolchain pins (gate #3 mechanical)
        run: python3 scripts/check-release-pins.py
      - name: Перевірити версію тегу та інсталятор
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python3 scripts/verify_release_tag.py "$RELEASE_TAG"
          python3 -m unittest discover -s packaging/tests -v
      - name: Узгодженість версій усіх релізних crates
        run: cargo test --locked -p sens-lsp --test release_parity
      - name: translation boundary regression
        run: cargo test --locked -p sens --test translation_boundary
      - name: Ukrainian/Sanskrit surface regression
        run: cargo test --locked -p sens --test uk_sa_surface
      - name: island installer CLI
        run: cargo test --locked -p sens-cli --test islands_cli
      - name: release asset contract
        run: cargo test --locked -p sens-cli --test islands_release_asset
      # Tag publication MUST NOT bypass the owner-ratified 2026-10-09
      # Ukrainian source / packed T5 / extensionless ASCII view law. A scoped
      # D1 witness is necessary, never sufficient for whole-corpus admission.
      - name: Current bounded Ukrainian source -> T5 -> ASCII triple proof
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_uk_t5_triplet.py \
            --lisp tests/fixtures/migration-d1-cond-cohort/branch.lisp \
            --sens tests/fixtures/migration-d1-cond-cohort/branch.sens \
            --view tests/fixtures/migration-d1-cond-cohort/branch
          cargo test --locked -q -p sens --test migration_d1_cond_cohort -- --nocapture

      - name: BLOCK tag publishing until ALL tracked T5 views and Ukrainian oracles are admitted
        shell: bash
        run: |
          set -euo pipefail
          status=0
          python3 scripts/report_t5_triplet_inventory.py . \
            --strict \
            --require-view tests/fixtures/migration-d1-cond-cohort/branch.sens \
            --report "$RUNNER_TEMP/release-triple-inventory.json" || status=$?
          python3 - "$RUNNER_TEMP/release-triple-inventory.json" "$status" <<'PY'
          import json, sys
          from pathlib import Path
          path=Path(sys.argv[1])
          if not path.is_file():
              raise SystemExit("RELEASE_BLOCKED: triple evidence ledger missing")
          r=json.loads(path.read_text(encoding="utf-8"))
          if r.get("schema")!="sens-t5-triplet-inventory/v1":
              raise SystemExit("RELEASE_BLOCKED: unknown triple proof schema")
          s=r["summary"]
          print("RELEASE_TRIPLE_DEBT",json.dumps(s,sort_keys=True))
          physical=s["physical_pairs_seen"]
          # The read-only inventory intentionally cannot claim independent
          # Ukrainian oracle evidence for all old physical canaries. A new
          # ratified proof ledger must first be implemented/consumed; never
          # turn the single bounded D1 witness into corpus-wide admission.
          blockers=(
              int(sys.argv[2]) != 0 or
              bool(r["failed_required"]) or
              physical == 0 or
              s["physical_blocked"] != 0 or
              s["view_missing"] != 0 or
              s["view_invalid_or_unsafe"] != 0 or
              s["view_present_valid"] != physical or
              s["uk_oracle_verified"] != physical or
              s["release_admitted"] != physical
          )
          if blockers:
              raise SystemExit(
                  "RELEASE_BLOCKED: some packed T5 views are absent/invalid, "
                  "or canonical Ukrainian <-> current semantics and independent "
                  "oracle admission for all release-scoped executables remain unproved"
              )
          print("RELEASE_TRIPLE_FULL_CORPUS_PASS")
          PY

      - name: Exact-SHA independent CI verifier negative controls
        run: python3 -m unittest discover -s tests -p test_verify_release_ci.py -v

      - name: Release asset integrity negative controls
        run: python3 -m unittest discover -s tests -p test_verify_release_assets.py -v

      - name: Required full workspace test (same tagged SHA)
        run: cargo test --locked --workspace

      - name: Required full workspace Clippy (same tagged SHA)
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: focused release clippy
        run: cargo clippy --locked -p sens -p sens-cli --all-targets -- -D warnings


  publish-island-manifest:
    name: Publish generated self-bootstrap island manifest
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          toolchain: "1.99.0"
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2

      - name: Download and hash CLIPS 6.4.2 Windows runtime archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p packaging/vendor
          curl -fsSL -o packaging/vendor/clips_windows_x86_64_cli.zip \
            "https://sourceforge.net/projects/clipsrules/files/CLIPS/6.4.2/clips_windows_x86_64_cli.zip/download"
          python3 - <<'PY'
          import hashlib, pathlib
          p = pathlib.Path("packaging/vendor/clips_windows_x86_64_cli.zip")
          digest = hashlib.sha256(p.read_bytes()).hexdigest()
          print(f"CLIPS_WINDOWS_SHA256={digest}")
          pathlib.Path("clips_windows_sha256.txt").write_text(digest + "\n", encoding="utf-8")
          PY

      - name: Materialize release manifest with verified asset hashes
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/generate_islands_manifest.py \
            --output packaging/islands-manifest-v1.json \
            --clips-windows-sha256 "$(cat clips_windows_sha256.txt)"

      - name: Stage manifest and installer (not a public release)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p staged
          cp packaging/islands-manifest-v1.json staged/
          cp packaging/install.sh staged/

      - name: Upload staged manifest and installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-manifest
          path: staged/
          if-no-files-found: error

  build-cli:
    name: sens-cli · ${{ matrix.os }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: sens
            asset_suffix: linux_amd64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: sens.exe
            asset_suffix: windows_amd64
          - os: macos-13
            target: x86_64-apple-darwin
            artifact_name: sens
            asset_suffix: macos_x64
          - os: macos-14
            target: aarch64-apple-darwin
            artifact_name: sens
            asset_suffix: macos_arm64
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          toolchain: "1.99.0"
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --locked --release -p sens-cli --target ${{ matrix.target }}

      - name: Rename binary
        shell: bash
        run: |
          set -euo pipefail
          SRC="target/${{ matrix.target }}/release/${{ matrix.artifact_name }}"
          DEST="sens-cli_${{ matrix.asset_suffix }}"
          if [[ "${{ matrix.artifact_name }}" == *.exe ]]; then
            DEST="${DEST}.exe"
          fi
          cp "$SRC" "$DEST"
          echo "ASSET_PATH=$DEST" >> "$GITHUB_ENV"

      - name: Stage CLI asset (one unique artifact per matrix leg)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-cli-${{ matrix.asset_suffix }}
          path: ${{ env.ASSET_PATH }}
          if-no-files-found: error

  build-msi:
    name: sens-cli · Windows MSI installer
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          toolchain: "1.99.0"
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2

      - name: Build
        run: cargo build --locked --release -p sens-cli

      - name: Install WiX
        run: |
          dotnet tool install --global wix --version 6.0.2

      - name: Build MSI
        shell: pwsh
        run: |
          $VERSION = $env:GITHUB_REF_NAME -replace '^l',''
          if ($VERSION -notmatch '^\d+\.\d+\.\d+$') { throw "cannot parse version from tag '$env:GITHUB_REF_NAME'" }
          & "$env:USERPROFILE\.dotnet\tools\wix.exe" build packaging/wix/sens-cli.wxs -d Version=$VERSION -o sens-cli.msi

      - name: Stage MSI (not a public release)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-msi
          path: sens-cli.msi
          if-no-files-found: error

  build-web:
    name: Portable web REPL · single HTML
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          toolchain: "1.99.0"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@0.4.0
        with:
          version: 'v0.15.0'

      - name: Build the WASM bindings
        run: wasm-pack build crates/sens-wasm --target web --out-dir ../../packaging/web/pkg --release

      - name: Bundle the standalone HTML
        run: python3 packaging/web/bundle.py

      - name: Stage portable HTML (not a public release)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-web
          path: packaging/web/sens.html
          if-no-files-found: error
