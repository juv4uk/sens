name: Release

# Реліз виконується на незмінному тегу s<version>; ручний запуск лишається
# доступним лише як явна дія власника з уже створеного тегу.
on:
  push:
    tags: ['s*']
  workflow_dispatch:

permissions:
  contents: write
  checks: read

# Never publish a partial release or let concurrent tagged runs race.
concurrency:
  group: sens-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: focused release smoke before publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/actions/install-zig
      - name: Install SWI-Prolog for real Prolog bridge tests
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v swipl >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends swi-prolog-nox
          fi
          swipl --version
      - name: Install SWI-Prolog for real Prolog↔Lisp↔Datalog integration
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends swi-prolog-nox
          command -v swipl
          swipl --version
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          toolchain: "1.99.0"
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - name: Перевірка — жодних чужомовних test/benchmark runners у канонічному шляху
        shell: bash
        run: bash scripts/check-sens-only-semantic-tests.sh
      - name: Мовна межа — JSON/SHA не є викличними формами SENS
        shell: bash
        run: |
          set -euo pipefail
          files=(lib/domains/d9.lisp lib/surface/uk-sa-coverage.lisp contracts/d9-ratification.lisp knowledge/d9-ratified.json docs/generated/function-table.md)
          if grep -nEi 'json-parse|sha256-hex|JSON-PARSE|SHA256-HEX' "${files[@]}"; then
            echo "::error title=SENS_LANGUAGE_BOUNDARY::Retired external utility name leaked into active D9 surfaces."
            exit 1
          fi
          echo "SENS_LANGUAGE_BOUNDARY=PASS json_callable=false sha256_callable=false"
      - name: Sterile Zig corridor (Rust↔SENS only via Zig ABI v2)
        run: |
          set -euo pipefail
          cargo test --locked -p sens-cli --test binary_t5m_zig_roundtrip
          cargo test --locked -p sens-cli --test binary_sens_d1_cond_oracle

      - name: Release version alignment (gate #1 mechanical)
        run: |
          python3 scripts/check-release-version-alignment.py --self-test
          python3 scripts/check-release-version-alignment.py
      - name: Release toolchain pins — native Rust verification
        run: cargo test --locked -p sens-cli --test release_toolchain_pins
      - name: Перевірити версію тегу та інсталятор
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cargo test --locked -p sens-cli --test release_tag_guard
      - name: Узгодженість версій усіх релізних crates
        run: cargo test --locked -p sens-lsp --test release_parity
      - name: translation boundary regression
        run: cargo test --locked -p sens --test translation_boundary
      - name: island installer CLI
        run: cargo test --locked -p sens-cli --test islands_cli
      - name: release asset contract
        run: cargo test --locked -p sens-cli --test islands_release_asset
      - name: Current bounded Ukrainian source -> T5 -> ASCII triple proof
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_uk_t5_t5m_triplet.py \
            --lisp tests/fixtures/migration-d1-cond-cohort/branch.lisp \
            --sens tests/fixtures/migration-d1-cond-cohort/branch.sens \
            --view tests/fixtures/migration-d1-cond-cohort/branch
          cargo test --locked -q -p sens --features rust-t5-reference --test migration_d1_cond_cohort -- --nocapture

      # ДОКАЗ ВИКОНАННЯМ. Досі цей job НЕ збирав sens, тож доказ мовних законів
      # тут був неможливий. Rust і Zig у job уже встановлені вище.
      - name: Build native SENS executor for language-law proof
        run: cargo build --locked -p sens-cli --bin sens --bin sens-trit

      - name: Prove language laws by EXECUTION (same tagged SHA)
        run: |
          set -euo pipefail
          bash scripts/prove-lisp-language-laws.sh "$PWD/target/debug/sens" "$RUNNER_TEMP/proof.json"

      - name: BLOCK tag publishing until ALL tracked T5 views and Ukrainian oracles are admitted
        shell: bash
        run: |
          set -euo pipefail
          echo "PYTHON_TEST=EXCLUDED_BY_POLICY native_equivalent=NOT_VERIFIED"
          status=0
          python3 scripts/report_t5_t5m_triplet_inventory.py . \
            --strict \
            --require-view tests/fixtures/migration-d1-cond-cohort/branch.sens \
            --proof-report "$RUNNER_TEMP/proof.json" \
            --report "$RUNNER_TEMP/release-triple-inventory.json" || status=$?
          python3 scripts/check-release-triple-corpus.py \
            "$RUNNER_TEMP/release-triple-inventory.json" "$status"

      - name: Exact-SHA independent CI verifier negative controls — Python excluded
        shell: bash
        run: echo 'PYTHON_UNIT_TESTS=EXCLUDED_BY_POLICY test_verify_release_ci native_equivalent=NOT_VERIFIED'

      - name: Release asset integrity negative controls — Python excluded
        shell: bash
        run: echo 'PYTHON_UNIT_TESTS=EXCLUDED_BY_POLICY test_verify_release_assets native_equivalent=NOT_VERIFIED'

      - name: Required full workspace test (same tagged SHA)
        run: cargo test --locked --workspace --no-fail-fast

      - name: Required full workspace Clippy (same tagged SHA)
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: focused release clippy
        run: cargo clippy --locked -p sens -p sens-cli --all-targets -- -D warnings

      - name: Release gate — excluded Python safety tests remain NOT_VERIFIED
        shell: bash
        run: |
          echo "RELEASE_PYTHON_SAFETY_TESTS=EXCLUDED_BY_POLICY native_equivalent=NOT_VERIFIED"
          echo "::error title=RELEASE_NOT_VERIFIED::Publication remains blocked until native Rust/Zig/SENS proofs replace excluded Python safety tests."
          exit 1

  publish-island-manifest:
    name: Publish generated self-bootstrap island manifest
    needs: test
    if: always() && (needs.test.result == 'success' || vars.SENS_RELEASE_OWNER_OVERRIDE == '1')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          toolchain: "1.99.0"
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2

      - name: CLIPS vendor archive integrity — no admitted non-digest proof
        shell: bash
        run: |
          echo 'CLIPS_VENDOR_ARCHIVE=NOT_VERIFIED sha256_creation=EXCLUDED json_semantics=EXCLUDED'
          echo "::error title=RELEASE_NOT_VERIFIED::Do not stage or publish the island manifest until a non-SHA, byte-exact provenance proof is admitted."
          exit 1

      - name: Stage manifest and installer (not a public release)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p staged
          cp packaging/islands-manifest-v1.json staged/
          cp packaging/install.sh staged/

      - name: Upload staged manifest and installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-manifest
          path: staged/
          if-no-files-found: error

  build-cli:
    name: sens-cli · ${{ matrix.os }}
    needs: test
    if: always() && (needs.test.result == 'success' || vars.SENS_RELEASE_OWNER_OVERRIDE == '1')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: sens
            asset_suffix: linux_amd64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: sens.exe
            asset_suffix: windows_x64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            artifact_name: sens
            asset_suffix: macos_x64
          - os: macos-14
            target: aarch64-apple-darwin
            artifact_name: sens
            asset_suffix: macos_arm64
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          toolchain: "1.99.0"
          targets: ${{ matrix.target }}
      - uses: ./.github/actions/install-zig
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --locked --release -p sens-cli --target ${{ matrix.target }}

      - name: Rename binary
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#s}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "RELEASE_ASSET_ERROR: unexpected release tag $GITHUB_REF_NAME" >&2
            exit 1
          fi
          SRC="target/${{ matrix.target }}/release/${{ matrix.artifact_name }}"
          DEST="sens-cli_${VERSION}_${{ matrix.asset_suffix }}"
          if [[ "${{ matrix.artifact_name }}" == *.exe ]]; then
            DEST="${DEST}.exe"
          fi
          cp "$SRC" "$DEST"
          echo "ASSET_PATH=$DEST" >> "$GITHUB_ENV"

      - name: Stage CLI asset (one unique artifact per matrix leg)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-cli-${{ matrix.asset_suffix }}
          path: ${{ env.ASSET_PATH }}
          if-no-files-found: error

  build-msi:
    name: sens-cli · Windows MSI installer
    needs: test
    if: always() && (needs.test.result == 'success' || vars.SENS_RELEASE_OWNER_OVERRIDE == '1')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          toolchain: "1.99.0"
      - uses: ./.github/actions/install-zig
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2

      - name: Build
        run: cargo build --locked --release -p sens-cli --bin sens

      - name: Install WiX
        run: |
          dotnet tool install --global wix --version 6.0.2

      - name: Build MSI
        shell: pwsh
        run: |
          $VERSION = $env:GITHUB_REF_NAME -replace '^s',''
          if ($VERSION -notmatch '^\d+\.\d+\.\d+$') { throw "cannot parse version from tag '$env:GITHUB_REF_NAME'" }
          $binDir = (Resolve-Path -LiteralPath "target/release").Path
          $sensExe = Join-Path $binDir "sens.exe"
          if (-not (Test-Path -LiteralPath $sensExe -PathType Leaf)) { throw "missing built sens.exe" }
          Copy-Item -LiteralPath $sensExe -Destination (Join-Path $binDir "my-lisp.exe") -ErrorAction Stop
          $msi = "sens-cli_${VERSION}_windows_x64.msi"
          & "$env:USERPROFILE\.dotnet\tools\wix.exe" build packaging/windows/sens.wxs -arch x64 -d "ProductVersion=$VERSION" -d "BinDir=$binDir" -o $msi
          if ($LASTEXITCODE -ne 0) { throw "WiX build failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path -LiteralPath $msi -PathType Leaf) -or (Get-Item -LiteralPath $msi).Length -eq 0) {
            throw "MSI asset missing or empty: $msi"
          }
          "MSI_ASSET_PATH=$msi" >> $env:GITHUB_ENV

      - name: Stage MSI (not a public release)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-msi
          path: ${{ env.MSI_ASSET_PATH }}
          if-no-files-found: error

  build-web:
    name: Portable web REPL · single HTML
    needs: test
    if: always() && (needs.test.result == 'success' || vars.SENS_RELEASE_OWNER_OVERRIDE == '1')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install pinned Zig source transport
        uses: ./.github/actions/install-zig
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          toolchain: "1.99.0"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@0d096b08b4e5a7de8c28de67e11e945404e9eefa # v0.4.0
        with:
          version: 'v0.15.0'

      - name: Build the WASM bindings
        run: wasm-pack build crates/sens-wasm --target web --out-dir ../../public/wasm --release

      - name: Bundle the standalone HTML
        run: node scripts/make-portable-web.mjs public/my-lisp-cli-web.html sens-cli-web.html

      - name: Stage canonical HTML and byte-identical compatibility alias
        shell: bash
        run: |
          set -euo pipefail
          test -s sens-cli-web.html
          cp sens-cli-web.html my-lisp-cli-web.html
          cmp -s sens-cli-web.html my-lisp-cli-web.html

      - name: Upload portable HTML assets (not a public release)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-web
          path: |
            sens-cli-web.html
            my-lisp-cli-web.html
          if-no-files-found: error

  release-publish:
    name: Final SHA-pinned publish only after ALL jobs are green
    needs: [test, publish-island-manifest, build-cli, build-msi, build-web]
    if: always() && (needs.test.result == 'success' || vars.SENS_RELEASE_OWNER_OVERRIDE == '1')
    uses: ./.github/workflows/release-publish.yml
    secrets: inherit
    permissions:
      contents: write
      checks: read
