name: Release

# Карантин власника 2026-10-13: автоматичний релізний workflow вимкнено.
# Ручний запуск із вибраного релізного тегу — лише після явного дозволу власника.
on:
  workflow_dispatch:

permissions:
  contents: read

# Never publish a partial release or let concurrent tagged runs race.
concurrency:
  group: sens-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: focused release smoke before publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/actions/install-zig
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          toolchain: "1.99.0"
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - name: Release version alignment (gate #1 mechanical)
        run: |
          python3 scripts/check-release-version-alignment.py --self-test
          python3 scripts/check-release-version-alignment.py
      - name: Release toolchain pins (gate #3 mechanical)
        run: python3 scripts/check-release-pins.py
      - name: Перевірити версію тегу та інсталятор
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python3 scripts/verify_release_tag.py "$RELEASE_TAG"
          python3 -m unittest discover -s packaging/tests -v
      - name: Узгодженість версій усіх релізних crates
        run: cargo test --locked -p sens-lsp --test release_parity
      - name: translation boundary regression
        run: cargo test --locked -p sens --test translation_boundary
      - name: Ukrainian/Sanskrit surface regression
        run: cargo test --locked -p sens --test uk_sa_surface
      - name: island installer CLI
        run: cargo test --locked -p sens-cli --test islands_cli
      - name: release asset contract
        run: cargo test --locked -p sens-cli --test islands_release_asset
      # Tag publication MUST NOT bypass the owner-ratified 2026-10-09
      # Ukrainian source / packed T5 / extensionless ASCII view law. A scoped
      # D1 witness is necessary, never sufficient for whole-corpus admission.
      - name: Current bounded Ukrainian source -> T5 -> ASCII triple proof
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_uk_t5_triplet.py \
            --lisp tests/fixtures/migration-d1-cond-cohort/branch.lisp \
            --sens tests/fixtures/migration-d1-cond-cohort/branch.sens \
            --view tests/fixtures/migration-d1-cond-cohort/branch
          cargo test --locked -q -p sens --test migration_d1_cond_cohort -- --nocapture

      - name: BLOCK tag publishing until ALL tracked T5 views and Ukrainian oracles are admitted
        shell: bash
        run: |
          set -euo pipefail
          status=0
          python3 scripts/report_t5_triplet_inventory.py . \
            --strict \
            --require-view tests/fixtures/migration-d1-cond-cohort/branch.sens \
            --report "$RUNNER_TEMP/release-triple-inventory.json" || status=$?
          python3 - "$RUNNER_TEMP/release-triple-inventory.json" "$status" <<'PY'
          import json, sys
          from pathlib import Path
          path=Path(sys.argv[1])
          if not path.is_file():
              raise SystemExit("RELEASE_BLOCKED: triple evidence ledger missing")
          r=json.loads(path.read_text(encoding="utf-8"))
          if r.get("schema")!="sens-t5-triplet-inventory/v1":
              raise SystemExit("RELEASE_BLOCKED: unknown triple proof schema")
          s=r["summary"]
          print("RELEASE_TRIPLE_DEBT",json.dumps(s,sort_keys=True))
          physical=s["physical_pairs_seen"]
          blockers=(
              int(sys.argv[2]) != 0 or
              bool(r["failed_required"]) or
              physical == 0 or
              s["physical_blocked"] != 0 or
              s["view_missing"] != 0 or
              s["view_invalid_or_unsafe"] != 0 or
              s["view_present_valid"] != physical or
              s["uk_oracle_verified"] != physical or
              s["release_admitted"] != physical
          )
          if blockers:
              raise SystemExit(
                  "RELEASE_BLOCKED: some packed T5 views are absent/invalid, "
                  "or canonical Ukrainian <-> current semantics and independent "
                  "oracle admission for all release-scoped executables remain unproved"
              )
          print("RELEASE_TRIPLE_FULL_CORPUS_PASS")
          PY

      - name: Exact-SHA independent CI verifier negative controls
        run: python3 -m unittest discover -s tests -p test_verify_release_ci.py -v

      - name: Release asset integrity negative controls
        run: python3 -m unittest discover -s tests -p test_verify_release_assets.py -v

      - name: Required full workspace test (same tagged SHA)
        run: cargo test --locked --workspace

      - name: Required full workspace Clippy (same tagged SHA)
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: focused release clippy
        run: cargo clippy --locked -p sens -p sens-cli --all-targets -- -D warnings

  PLACEHOLDER_REMAINDER_SEE_NEXT_COMMIT: true
