name: "Release — quarantined until all gates are native Rust/Zig/SENS"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  blocked:
    name: "Release blocked — excluded-language safety gates lack verified native replacements"
    if: false
    runs-on: ubuntu-latest
    steps:
      - shell: bash
        run: |
          echo "RELEASE=NO-GO"
          echo "candidate_sha=UNSET"
          echo "python_release_safety_tests=EXCLUDED_BY_POLICY"
          echo "native_release_safety_equivalent=NOT_VERIFIED"
