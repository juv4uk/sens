name: Release

on:
  push:
    tags: ['l*']

permissions:
  contents: write

jobs:
  test:
    name: focused release smoke before publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Перевірити версію тегу та інсталятор
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, pathlib, tomllib
          package = tomllib.loads(pathlib.Path("crates/sens-cli/Cargo.toml").read_text())["package"]
          assert os.environ["RELEASE_TAG"] == "l" + package["version"], "tag/package version mismatch"
          PY
          python3 -m unittest discover -s packaging/tests -v
      - name: Узгодженість версій усіх релізних crates
        run: cargo test --locked -p sens-lsp --test release_parity
      - name: translation boundary regression
        run: cargo test -p sens --test translation_boundary
      - name: Ukrainian/Sanskrit surface regression
        run: cargo test -p sens --test uk_sa_surface
      - name: island installer CLI
        run: cargo test -p sens-cli --test islands_cli
      - name: release asset contract
        run: cargo test -p sens-cli --test islands_release_asset
      # Tag publication MUST NOT bypass the owner-ratified 2026-10-09
      # Ukrainian source / packed T5 / extensionless ASCII view law. A scoped
      # D1 witness is necessary, never sufficient for whole-corpus admission.
      - name: Current bounded Ukrainian source -> T5 -> ASCII triple proof
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_uk_t5_triplet.py \
            --lisp tests/fixtures/migration-d1-cond-cohort/branch.lisp \
            --sens tests/fixtures/migration-d1-cond-cohort/branch.sens \
            --view tests/fixtures/migration-d1-cond-cohort/branch
          cargo test -q -p sens --test migration_d1_cond_cohort -- --nocapture

      - name: BLOCK tag publishing until ALL tracked T5 views and Ukrainian oracles are admitted
        shell: bash
        run: |
          set -euo pipefail
          status=0
          python3 scripts/report_t5_triplet_inventory.py . \
            --strict \
            --require-view tests/fixtures/migration-d1-cond-cohort/branch.sens \
            --report "$RUNNER_TEMP/release-triple-inventory.json" || status=$?
          python3 - "$RUNNER_TEMP/release-triple-inventory.json" "$status" <<'PY'
          import json, sys
          from pathlib import Path
          path=Path(sys.argv[1])
          if not path.is_file():
              raise SystemExit("RELEASE_BLOCKED: triple evidence ledger missing")
          r=json.loads(path.read_text(encoding="utf-8"))
          if r.get("schema")!="sens-t5-triplet-inventory/v1":
              raise SystemExit("RELEASE_BLOCKED: unknown triple proof schema")
          s=r["summary"]
          print("RELEASE_TRIPLE_DEBT",json.dumps(s,sort_keys=True))
          physical=s["physical_pairs_seen"]
          # The read-only inventory intentionally cannot claim independent
          # Ukrainian oracle evidence for all old physical canaries. A new
          # ratified proof ledger must first be implemented/consumed; never
          # turn the single bounded D1 witness into corpus-wide admission.
          blockers=(
              int(sys.argv[2]) != 0 or
              bool(r["failed_required"]) or
              physical == 0 or
              s["physical_blocked"] != 0 or
              s["view_missing"] != 0 or
              s["view_invalid_or_unsafe"] != 0 or
              s["view_present_valid"] != physical or
              s["uk_oracle_verified"] != physical or
              s["release_admitted"] != physical
          )
          if blockers:
              raise SystemExit(
                  "RELEASE_BLOCKED: some packed T5 views are absent/invalid, "
                  "or canonical Ukrainian <-> current semantics and independent "
                  "oracle admission for all release-scoped executables remain unproved"
              )
          print("RELEASE_TRIPLE_FULL_CORPUS_PASS")
          PY

      - name: focused release clippy
        run: cargo clippy -p sens -p sens-cli --all-targets -- -D warnings


  create-release:
    name: Create the GitHub release
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Creates the release once, before any asset-uploading job runs. Without
      # this, build-cli's 4 matrix jobs and build-web all raced to create the
      # same tag_name concurrently — softprops/action-gh-release only upserts
      # cleanly against a release that already exists; several simultaneous
      # "does it exist yet" checks can all say no and all try to create it,
      # and only the first one to land succeeds (l0.11.0's build-cli and
      # build-web jobs all failed with "already_exists" this way).
      # Створює реліз один раз, до того, як запуститься будь-яка джоба
      # заливання asset'ів. Без цього 4 матричні джоби build-cli і build-web
      # усі одночасно змагались створити той самий tag_name —
      # softprops/action-gh-release чисто апсертить лише в реліз, що вже
      # існує; кілька одночасних перевірок "чи він уже є" можуть усі
      # відповісти "ні" й усі спробувати створити, і успішною буде лише
      # перша, що доїде (саме так усі джоби build-cli й build-web для
      # l0.11.0 впали з "already_exists").
      # Erstellt das Release einmal, bevor irgendein Asset-Upload-Job läuft.
      # Ohne dies liefen sich die 4 Matrix-Jobs von build-cli und build-web
      # gegenseitig ins Rennen, um denselben tag_name zu erstellen —
      # softprops/action-gh-release upsertet nur sauber gegen ein bereits
      # existierendes Release; mehrere gleichzeitige "existiert es schon"
      # Prüfungen können alle Nein sagen und alle versuchen zu erstellen,
      # und nur die erste, die ankommt, gewinnt (genau so scheiterten
      # l0.11.0s build-cli- und build-web-Jobs mit "already_exists").
      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          name: Release ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-island-manifest:
    name: Publish generated self-bootstrap island manifest
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download and hash CLIPS 6.4.2 Windows runtime archive
        shell: bash
        run: |
          set -euo pipefail
          url='https://sourceforge.net/projects/clipsrules/files/CLIPS/6.4.2/clips_windows_projects_642.zip/download'
          curl --fail --location --silent --show-error --max-time 120 "$url" -o clips_windows_projects_642.zip
          test -s clips_windows_projects_642.zip
          echo "CLIPS_SHA256=$(sha256sum clips_windows_projects_642.zip | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: Materialize release manifest with verified asset hashes
        shell: python
        run: |
          import json
          import os
          from pathlib import Path

          source = Path("packaging/islands-manifest-v1.json")
          destination = Path("islands-manifest-v1.json")
          manifest = json.loads(source.read_text(encoding="utf-8"))

          for island in manifest["islands"]:
              for entry in island["platforms"]:
                  if entry.get("provider") != "release-asset":
                      continue
                  if not entry.get("url"):
                      raise SystemExit(f"{island['key']} release asset has no URL")
                  if entry.get("sha256") is None:
                      if island["key"] == "clips":
                          entry["sha256"] = os.environ["CLIPS_SHA256"]
                      else:
                          raise SystemExit(f"{island['key']} release asset has no pinned SHA-256")
                  if len(entry["sha256"]) != 64:
                      raise SystemExit(f"{island['key']} has invalid generated SHA-256")

          destination.write_text(
              json.dumps(manifest, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          print(destination.read_text(encoding="utf-8"))

      - name: Upload generated manifest and installer script
        uses: softprops/action-gh-release@v1
        with:
          files: |
            islands-manifest-v1.json
            packaging/install.sh
          name: Release ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-cli:
    name: sens-cli · ${{ matrix.os }}
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: sens
            asset_suffix: linux_amd64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: sens.exe
            asset_suffix: windows_x64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: sens
            asset_suffix: macos_x64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: sens
            asset_suffix: macos_arm64

    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: cli-${{ matrix.target }}

      - name: Build
        run: cargo build --release -p sens-cli --target ${{ matrix.target }}

      - name: Rename binary
        shell: bash
        run: |
          VERSION=${GITHUB_REF_NAME#l}
          SRC="target/${{ matrix.target }}/release/${{ matrix.artifact_name }}"
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            DST="sens-cli_${VERSION}_${{ matrix.asset_suffix }}.exe"
          else
            DST="sens-cli_${VERSION}_${{ matrix.asset_suffix }}"
          fi
          mv "$SRC" "$DST"
          echo "ASSET_PATH=$DST" >> "$GITHUB_ENV"

      - name: Upload
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ env.ASSET_PATH }}
          name: Release ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-msi:
    name: sens-cli · Windows MSI installer
    needs: create-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: cli-x86_64-pc-windows-msvc

      - name: Build
        run: cargo build --release -p sens-cli --target x86_64-pc-windows-msvc

      - name: Install WiX
        shell: pwsh
        # Pinned to v6: WiX v7 gates usage behind the OSMF EULA acceptance
        # (WIX7015). v6 uses the same v4 schema and is EULA-free.
        run: dotnet tool install --global wix --version 6.0.2

      - name: Build MSI
        shell: pwsh
        run: |
          $VERSION = $env:GITHUB_REF_NAME.TrimStart('l')
          if ($VERSION -notmatch '^\d+\.\d+\.\d+$') { throw "cannot parse version from tag '$env:GITHUB_REF_NAME'" }
          # WiX ProductVersion must be numeric; l-prefixed tags map 1:1.
          wix build `
            -arch x64 `
            -D "ProductVersion=$VERSION" `
            -D "BinDir=target\x86_64-pc-windows-msvc\release" `
            -out "sens-cli_${VERSION}_windows_x64.msi" `
            packaging/windows/sens.wxs
          if (-not (Test-Path "sens-cli_${VERSION}_windows_x64.msi")) { throw 'MSI was not produced.' }

      - name: Upload
        uses: softprops/action-gh-release@v1
        with:
          files: sens-cli_*_windows_x64.msi
          name: Release ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-web:
    name: Portable web REPL · single HTML
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: wasm
      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: 'v0.15.0'

      - name: Build the WASM bindings
        run: wasm-pack build crates/sens-wasm --target web --out-dir ../../public/wasm

      - name: Bundle the standalone HTML
        run: |
          node scripts/make-portable-web.mjs public/sens-cli-web.html sens-cli-web.html
          test -s sens-cli-web.html

      - name: Upload
        uses: softprops/action-gh-release@v1
        with:
          files: sens-cli-web.html
          name: Release ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
