name: Release

on:
  push:
    tags: ['l*']

permissions:
  contents: read

# Never publish a partial release or let concurrent tagged runs race.
concurrency:
  group: sens-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: focused release smoke before publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.0"
      - uses: Swatinem/rust-cache@v2
      - name: Перевірити версію тегу та інсталятор
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python3 scripts/verify_release_tag.py "$RELEASE_TAG"
          python3 -m unittest discover -s packaging/tests -v
      - name: Узгодженість версій усіх релізних crates
        run: cargo test --locked -p sens-lsp --test release_parity
      - name: translation boundary regression
        run: cargo test --locked -p sens --test translation_boundary
      - name: Ukrainian/Sanskrit surface regression
        run: cargo test --locked -p sens --test uk_sa_surface
      - name: island installer CLI
        run: cargo test --locked -p sens-cli --test islands_cli
      - name: release asset contract
        run: cargo test --locked -p sens-cli --test islands_release_asset
      # Tag publication MUST NOT bypass the owner-ratified 2026-10-09
      # Ukrainian source / packed T5 / extensionless ASCII view law. A scoped
      # D1 witness is necessary, never sufficient for whole-corpus admission.
      - name: Current bounded Ukrainian source -> T5 -> ASCII triple proof
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_uk_t5_triplet.py \
            --lisp tests/fixtures/migration-d1-cond-cohort/branch.lisp \
            --sens tests/fixtures/migration-d1-cond-cohort/branch.sens \
            --view tests/fixtures/migration-d1-cond-cohort/branch
          cargo test --locked -q -p sens --test migration_d1_cond_cohort -- --nocapture

      - name: BLOCK tag publishing until ALL tracked T5 views and Ukrainian oracles are admitted
        shell: bash
        run: |
          set -euo pipefail
          status=0
          python3 scripts/report_t5_triplet_inventory.py . \
            --strict \
            --require-view tests/fixtures/migration-d1-cond-cohort/branch.sens \
            --report "$RUNNER_TEMP/release-triple-inventory.json" || status=$?
          python3 - "$RUNNER_TEMP/release-triple-inventory.json" "$status" <<'PY'
          import json, sys
          from pathlib import Path
          path=Path(sys.argv[1])
          if not path.is_file():
              raise SystemExit("RELEASE_BLOCKED: triple evidence ledger missing")
          r=json.loads(path.read_text(encoding="utf-8"))
          if r.get("schema")!="sens-t5-triplet-inventory/v1":
              raise SystemExit("RELEASE_BLOCKED: unknown triple proof schema")
          s=r["summary"]
          print("RELEASE_TRIPLE_DEBT",json.dumps(s,sort_keys=True))
          physical=s["physical_pairs_seen"]
          # The read-only inventory intentionally cannot claim independent
          # Ukrainian oracle evidence for all old physical canaries. A new
          # ratified proof ledger must first be implemented/consumed; never
          # turn the single bounded D1 witness into corpus-wide admission.
          blockers=(
              int(sys.argv[2]) != 0 or
              bool(r["failed_required"]) or
              physical == 0 or
              s["physical_blocked"] != 0 or
              s["view_missing"] != 0 or
              s["view_invalid_or_unsafe"] != 0 or
              s["view_present_valid"] != physical or
              s["uk_oracle_verified"] != physical or
              s["release_admitted"] != physical
          )
          if blockers:
              raise SystemExit(
                  "RELEASE_BLOCKED: some packed T5 views are absent/invalid, "
                  "or canonical Ukrainian <-> current semantics and independent "
                  "oracle admission for all release-scoped executables remain unproved"
              )
          print("RELEASE_TRIPLE_FULL_CORPUS_PASS")
          PY

      - name: Release asset integrity negative controls
        run: python3 -m unittest discover -s tests -p test_verify_release_assets.py -v

      - name: Required full workspace test (same tagged SHA)
        run: cargo test --locked --workspace

      - name: Required full workspace Clippy (same tagged SHA)
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: focused release clippy
        run: cargo clippy --locked -p sens -p sens-cli --all-targets -- -D warnings


  publish-island-manifest:
    name: Publish generated self-bootstrap island manifest
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download and hash CLIPS 6.4.2 Windows runtime archive
        shell: bash
        run: |
          set -euo pipefail
          url='https://sourceforge.net/projects/clipsrules/files/CLIPS/6.4.2/clips_windows_projects_642.zip/download'
          curl --fail --location --silent --show-error --max-time 120 "$url" -o clips_windows_projects_642.zip
          test -s clips_windows_projects_642.zip
          echo "CLIPS_SHA256=$(sha256sum clips_windows_projects_642.zip | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: Materialize release manifest with verified asset hashes
        shell: python
        run: |
          import json
          import os
          from pathlib import Path

          source = Path("packaging/islands-manifest-v1.json")
          destination = Path("islands-manifest-v1.json")
          manifest = json.loads(source.read_text(encoding="utf-8"))

          for island in manifest["islands"]:
              for entry in island["platforms"]:
                  if entry.get("provider") != "release-asset":
                      continue
                  if not entry.get("url"):
                      raise SystemExit(f"{island['key']} release asset has no URL")
                  if entry.get("sha256") is None:
                      if island["key"] == "clips":
                          entry["sha256"] = os.environ["CLIPS_SHA256"]
                      else:
                          raise SystemExit(f"{island['key']} release asset has no pinned SHA-256")
                  if len(entry["sha256"]) != 64:
                      raise SystemExit(f"{island['key']} has invalid generated SHA-256")

          destination.write_text(
              json.dumps(manifest, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          print(destination.read_text(encoding="utf-8"))

      - name: Stage manifest and installer (not a public release)
        shell: bash
        run: cp packaging/install.sh install.sh

      - name: Upload staged manifest and installer
        uses: actions/upload-artifact@v4
        with:
          name: release-manifest
          path: |
            islands-manifest-v1.json
            install.sh
          if-no-files-found: error
          retention-days: 7

  build-cli:
    name: sens-cli · ${{ matrix.os }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: sens
            asset_suffix: linux_amd64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: sens.exe
            asset_suffix: windows_x64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: sens
            asset_suffix: macos_x64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: sens
            asset_suffix: macos_arm64

    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.0"
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: cli-${{ matrix.target }}

      - name: Build
        run: cargo build --locked --release -p sens-cli --target ${{ matrix.target }}

      - name: Rename binary
        shell: bash
        run: |
          VERSION=${GITHUB_REF_NAME#l}
          SRC="target/${{ matrix.target }}/release/${{ matrix.artifact_name }}"
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            DST="sens-cli_${VERSION}_${{ matrix.asset_suffix }}.exe"
          else
            DST="sens-cli_${VERSION}_${{ matrix.asset_suffix }}"
          fi
          mv "$SRC" "$DST"
          echo "ASSET_PATH=$DST" >> "$GITHUB_ENV"

      - name: Stage CLI asset (one unique artifact per matrix leg)
        uses: actions/upload-artifact@v4
        with:
          name: release-cli-${{ matrix.asset_suffix }}
          path: ${{ env.ASSET_PATH }}
          if-no-files-found: error
          retention-days: 7

  build-msi:
    name: sens-cli · Windows MSI installer
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.0"
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: cli-x86_64-pc-windows-msvc

      - name: Build
        run: cargo build --locked --release -p sens-cli --target x86_64-pc-windows-msvc

      - name: Install WiX
        shell: pwsh
        # Pinned to v6: WiX v7 gates usage behind the OSMF EULA acceptance
        # (WIX7015). v6 uses the same v4 schema and is EULA-free.
        run: dotnet tool install --global wix --version 6.0.2

      - name: Build MSI
        shell: pwsh
        run: |
          $VERSION = $env:GITHUB_REF_NAME.TrimStart('l')
          if ($VERSION -notmatch '^\d+\.\d+\.\d+$') { throw "cannot parse version from tag '$env:GITHUB_REF_NAME'" }
          # WiX ProductVersion must be numeric; l-prefixed tags map 1:1.
          wix build `
            -arch x64 `
            -D "ProductVersion=$VERSION" `
            -D "BinDir=target\x86_64-pc-windows-msvc\release" `
            -out "sens-cli_${VERSION}_windows_x64.msi" `
            packaging/windows/sens.wxs
          if (-not (Test-Path "sens-cli_${VERSION}_windows_x64.msi")) { throw 'MSI was not produced.' }

      - name: Stage MSI (not a public release)
        uses: actions/upload-artifact@v4
        with:
          name: release-msi
          path: sens-cli_*_windows_x64.msi
          if-no-files-found: error
          retention-days: 7

  build-web:
    name: Portable web REPL · single HTML
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.0"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: wasm
      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: 'v0.15.0'

      - name: Build the WASM bindings
        run: wasm-pack build crates/sens-wasm --target web --out-dir ../../public/wasm

      - name: Bundle the standalone HTML
        run: |
          node scripts/make-portable-web.mjs public/sens-cli-web.html sens-cli-web.html
          test -s sens-cli-web.html

      - name: Stage portable HTML (not a public release)
        uses: actions/upload-artifact@v4
        with:
          name: release-web
          path: sens-cli-web.html
          if-no-files-found: error
          retention-days: 7

  release-publish:
    name: Final SHA-pinned publish only after ALL jobs are green
    needs: [test, publish-island-manifest, build-cli, build-msi, build-web]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      checks: read
    steps:
      - uses: actions/checkout@v5
      - name: Verify exact main SHA, version and explicit owner GO
        shell: bash
        env:
          RELEASE_GO_SHA: ${{ vars.SENS_RELEASE_GO_SHA }}
          RELEASE_GO_TAG: ${{ vars.SENS_RELEASE_GO_TAG }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_TYPE" = "tag"
          test "$GITHUB_REF_NAME" = "l$(python3 -c 'import pathlib,tomllib; print(tomllib.loads(pathlib.Path("crates/sens-cli/Cargo.toml").read_text())["package"]["version"])')"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch --no-tags --depth=1 origin main
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA" || {
            echo "RELEASE_BLOCKED: candidate tag is not current main"; exit 1;
          }
          if [[ -z "$RELEASE_GO_SHA" || -z "$RELEASE_GO_TAG" || "$RELEASE_GO_SHA" != "$GITHUB_SHA" || "$RELEASE_GO_TAG" != "$GITHUB_REF_NAME" ]]; then
            echo "RELEASE_BLOCKED: exact-SHA owner GO variables are missing or mismatched"
            exit 1
          fi

      # No public release may be created while any independent mandatory
      # Hosted/Native/T5/preflight gate is red, stale, missing, or still running.
      - name: Verify independent exact-SHA mandatory CI before draft
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_release_ci.py "$GITHUB_SHA" "$GITHUB_REPOSITORY"

      - name: Download all independently built artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - name: Exercise release integrity negative controls
        run: python3 -m unittest discover -s tests -p test_verify_release_assets.py -v

      - name: Verify staged assets and write SHA-256 manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_release_assets.py prepare dist "$GITHUB_REF_NAME" "$GITHUB_SHA"
          (cd dist && sha256sum --check SHA256SUMS)

      - name: Create DRAFT, verify downloaded bytes, then publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_GO_SHA: ${{ vars.SENS_RELEASE_GO_SHA }}
          RELEASE_GO_TAG: ${{ vars.SENS_RELEASE_GO_TAG }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" --json isDraft >/dev/null 2>&1; then
            echo "RELEASE_BLOCKED: release record already exists; refuse overwrite"
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --draft --verify-tag \
            --title "SENS $GITHUB_REF_NAME · Contract 11.9" \
            --notes "SENS Contract 11.9 release on exact commit $GITHUB_SHA. Source of truth: RELEASE.md and RELEASE-EVIDENCE.md at this commit."
          mkdir -p "$RUNNER_TEMP/release-replay"
          gh release download "$GITHUB_REF_NAME" --dir "$RUNNER_TEMP/release-replay"
          python3 scripts/verify_release_assets.py replay \
            dist "$RUNNER_TEMP/release-replay" "$GITHUB_REF_NAME" "$GITHUB_SHA"
          (cd "$RUNNER_TEMP/release-replay" && sha256sum --check SHA256SUMS)

          # Revalidate authorization and main immediately before publication:
          # the branch may advance while assets are building/uploading/replayed.
          git fetch --no-tags --depth=1 origin main
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA" || {
            echo "RELEASE_BLOCKED: main moved while the draft assets were being verified" >&2
            exit 1
          }
          if [[ -z "$RELEASE_GO_SHA" || -z "$RELEASE_GO_TAG" || "$RELEASE_GO_SHA" != "$GITHUB_SHA" || "$RELEASE_GO_TAG" != "$GITHUB_REF_NAME" ]]; then
            echo "RELEASE_BLOCKED: final exact-SHA owner GO check failed" >&2
            exit 1
          fi
          # Recheck independently of cached earlier status: CI may be
          # rerun or invalidated while multi-platform artifacts are staged.
          python3 scripts/verify_release_ci.py "$GITHUB_SHA" "$GITHUB_REPOSITORY"
          gh release edit "$GITHUB_REF_NAME" --draft=false
