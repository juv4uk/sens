name: D8 historical full-map guard

on:
  pull_request:
    paths:
      - "knowledge/d6-historical-full-map.json"
      - "knowledge/d7-full-map.json"
      - "knowledge/d8-historical-full-map.json"
      - "scripts/build-d8-historical-full-map.py"
      - "scripts/check-d8-full-map.py"
      - "scripts/research-2322-generative-domain-forecast.py"
      - ".github/workflows/d8-full-map.yml"
  push:
    branches: [main]
    paths:
      - "knowledge/d6-historical-full-map.json"
      - "knowledge/d7-full-map.json"
      - "knowledge/d8-historical-full-map.json"
      - "scripts/build-d8-historical-full-map.py"
      - "scripts/check-d8-full-map.py"
      - "scripts/research-2322-generative-domain-forecast.py"
      - ".github/workflows/d8-full-map.yml"

jobs:
  historical-map:
    name: D8 full-map constitution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verify the committed D8 map
        run: python3 scripts/check-d8-full-map.py
      - name: Prove the committed map is reproducible from the builder
        run: |
          python3 scripts/build-d8-historical-full-map.py
          git diff --exit-code -- knowledge/d8-historical-full-map.json
      - name: Publish summary
        if: always()
        run: |
          {
            echo "## D8 historical full map"
            echo
            echo "- D8: 256/256 occupied, 0 unallocated"
            echo "- Lineage: 4 children per D6 coordinate; the D7 rung is crossed by documented fact"
            echo "- 64 selector coordinates equal the #2322 generator word set"
            echo "- 192 historical coordinates are an agent-derived continuation, not ratified allocation"
            echo "- Residency and semantic derivability remain separate axes"
          } >> "$GITHUB_STEP_SUMMARY"