name: Pair eliminator lower bound research

on:
  workflow_dispatch:

jobs:
  lower-bound:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Run higher-order pair-eliminator witness
        run: |
          rm -rf /tmp/pair-eliminator-lower-bound
          python3 benchmarks/pair-eliminator-lower-bound/run.py             --out /tmp/pair-eliminator-lower-bound

      - name: Publish report
        if: always()
        run: |
          if test -f /tmp/pair-eliminator-lower-bound/report.md; then
            cat /tmp/pair-eliminator-lower-bound/report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pair-eliminator-lower-bound
          path: /tmp/pair-eliminator-lower-bound/
          retention-days: 14
