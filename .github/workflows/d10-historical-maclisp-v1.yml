name: D10 historical MacLisp v1

on:
  workflow_dispatch:

jobs:
  historical-maclisp:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Verify historical MacLisp recovery
        run: python3 scripts/check-d10-historical-maclisp-v1.py
      - name: Verify global D10 inventory
        run: python3 scripts/check-d10-v1-semantic-inventory.py
