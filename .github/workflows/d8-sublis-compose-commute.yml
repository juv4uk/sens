name: D8 SUBLIS-COMPOSE commutativity research

on:
  workflow_dispatch:

jobs:
  falsifier:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Run exhaustive SUBLIS/COMPOSE commutativity falsifier
        run: |
          rm -rf /tmp/d8-sublis-compose-commute
          python3 benchmarks/d8-sublis-compose-commute/run.py \
            --out /tmp/d8-sublis-compose-commute
      - name: Verify deterministic replay
        run: |
          rm -rf /tmp/d8-sublis-compose-commute-2
          python3 benchmarks/d8-sublis-compose-commute/run.py \
            --out /tmp/d8-sublis-compose-commute-2
          cmp /tmp/d8-sublis-compose-commute/witness.json \
              /tmp/d8-sublis-compose-commute-2/witness.json
      - name: Publish report
        if: always()
        run: |
          test ! -f /tmp/d8-sublis-compose-commute/report.md || \
            cat /tmp/d8-sublis-compose-commute/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d8-sublis-compose-commute
          path: /tmp/d8-sublis-compose-commute/
          retention-days: 14
