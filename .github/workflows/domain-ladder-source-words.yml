name: "Драбина D1–D10: механічний носій джерельних слів"

on:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  domain-ladder-source-words:
    name: "D1–D10: 1024/1024 координати, жодного W8→D8"
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: "Вичерпний unit-тест parser-а: 2 046 координат D1–D10"
        run: cargo test --locked -p sens --lib source_words::tests::domain_ladder_source_words_round_trip_all_2046_coordinates -- --exact
      - name: "Зовнішній Rust-тест на незмінній канонічній бібліотеці"
        run: cargo test --locked -p sens --test domain_ladder_source_words -- --nocapture
      - name: "Відсутність мутацій джерел"
        shell: bash
        run: |
          test -z "$(git status --porcelain --untracked-files=all)" || {
            git status --short
            exit 1
          }
