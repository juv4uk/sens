name: Full Cargo workspace (manual)
# Ручний повний прогін усього workspace. Не запускається автоматично.
# Призначення (розпорядження власника 14.10.2026): коли в CI багато червоного --
# запустити ЦЕЙ workflow і розібрати причину до кореня.
# Див. AGENTS.md -> OWNER-CI-RED-DISCIPLINE-20261014.
on:
  workflow_dispatch:

jobs:
  full-cargo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Встановити Zig 0.16.0 для типового транспортного кодека
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --silent --show-error \
            https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz \
            --output "$RUNNER_TEMP/zig-0.16.0.tar.xz"
          echo '70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00  '"$RUNNER_TEMP/zig-0.16.0.tar.xz" | sha256sum --check --status
          tar -xJf "$RUNNER_TEMP/zig-0.16.0.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/zig-x86_64-linux-0.16.0" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/zig-x86_64-linux-0.16.0/zig" version
      - name: FULL_CARGO_WORKSPACE -- повний прогін на точному SHA
        shell: bash
        run: |
          set -euo pipefail
          echo "FULL_CARGO_MANUAL commit=$GITHUB_SHA command=cargo test --workspace --all-targets --locked --no-fail-fast"
          python3 scripts/ci_failure_contract.py run \
            --test-id full-cargo-workspace-all-targets \
            --layer transport \
            --fixture Cargo.toml \
            --report-file "$RUNNER_TEMP/sens-full-cargo-red.jsonl" \
            -- cargo test --workspace --all-targets --locked --no-fail-fast
