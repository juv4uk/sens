name: Domain altitude economy research

on:
  push:
    paths:
      - "benchmarks/domain-altitude-economy/**"
      - ".github/workflows/domain-altitude-economy.yml"
  pull_request:
    paths:
      - "benchmarks/domain-altitude-economy/**"
      - ".github/workflows/domain-altitude-economy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: Pareto consumer unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run benchmark unit tests
        run: python3 -m unittest discover -s benchmarks/domain-altitude-economy -p 'test_*.py'
