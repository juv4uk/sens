name: execution-ladder bounded D1-D3 corpus

on:
  pull_request:
    paths:
      - "benchmarks/execution-ladder-conformance/**"
      - "crates/sens/examples/execution_ladder_bounded_probe.rs"
      - ".github/workflows/execution-ladder-bounded-d1-d3.yml"
  push:
    branches: [main]
    paths:
      - "benchmarks/execution-ladder-conformance/**"
      - "crates/sens/examples/execution_ladder_bounded_probe.rs"
      - ".github/workflows/execution-ladder-bounded-d1-d3.yml"

jobs:
  bounded-d1-d3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build isolated bounded oracle/P1 probe
        run: cargo build --release -p sens --example execution_ladder_bounded_probe

      - name: Generate bounded-exhaustive evidence twice
        run: |
          SOURCE_SHA=$(python3 -c 'import json; print(json.load(open("benchmarks/execution-ladder-conformance/artifacts/bounded-d1-d3.summary.json"))["source_sha"])')
          git cat-file -e "$SOURCE_SHA^{commit}"
          python3 benchmarks/execution-ladder-conformance/generate_bounded.py \
            --helper target/release/examples/execution_ladder_bounded_probe \
            --upstream-sha "$SOURCE_SHA" \
            --out /tmp/bounded-a.jsonl
          python3 benchmarks/execution-ladder-conformance/generate_bounded.py \
            --helper target/release/examples/execution_ladder_bounded_probe \
            --upstream-sha "$SOURCE_SHA" \
            --out /tmp/bounded-b.jsonl

      - name: Prove deterministic output and schema validity
        run: |
          cmp /tmp/bounded-a.jsonl /tmp/bounded-b.jsonl
          cmp /tmp/bounded-a.jsonl benchmarks/execution-ladder-conformance/artifacts/bounded-d1-d3.jsonl
          python3 benchmarks/execution-ladder-conformance/validate.py /tmp/bounded-a.jsonl
          python3 benchmarks/execution-ladder-conformance/validate.py benchmarks/execution-ladder-conformance/artifacts/bounded-d1-d3.jsonl
          test "$(wc -l < /tmp/bounded-a.jsonl)" -eq 56
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          rows=[json.loads(line) for line in open("/tmp/bounded-a.jsonl", encoding="utf-8") if line.strip()]
          artifact=Path("benchmarks/execution-ladder-conformance/artifacts/bounded-d1-d3.jsonl")
          summary=json.load(open("benchmarks/execution-ladder-conformance/artifacts/bounded-d1-d3.summary.json", encoding="utf-8"))
          assert hashlib.sha256(artifact.read_bytes()).hexdigest()==summary["artifact_sha256"]
          assert {row["upstream_sha"] for row in rows}=={summary["source_sha"]}
          assert summary["rows"]==56 and summary["case_ids"]==28
          assert summary["l0_rows"]==28 and summary["l1_rows"]==28
          assert summary["legacy_identity_used"] is False
          case_ids={row["case_id"] for row in rows}
          assert len(case_ids)==28, len(case_ids)
          assert sum(row["producer_layer"]=="L0" for row in rows)==28
          assert sum(row["producer_layer"]=="L1" for row in rows)==28
          assert all(row["exhaustive_bound"]=={
              "grammar_profile":"d1-d3-structural-predicate-v1",
              "domain_set":[1,2,3],
              "max_ast_depth":3,
              "max_nodes":11,
              "argument_value_bound":2,
          } for row in rows)
          assert all(row["legacy_identity_used"] is False for row in rows)
          print("bounded D1-D3 determinism/coverage: PASS")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: sens-bounded-d1-d3-conformance-jsonl
          path: /tmp/bounded-a.jsonl
