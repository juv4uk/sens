name: D6 theorem input stability

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stable-inputs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify neutral D6 theorem inputs and reopen behavior
        run: python3 benchmarks/d6-theorem-input-gate/run.py --self-test
