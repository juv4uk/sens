name: Targeted canon check (manual)
# Точкова перевірка лише цільових бінарів -- щоб бачити результат без стороннього
# червоного з інших тестів. Не запускається автоматично.
on:
  workflow_dispatch:

jobs:
  targeted:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Встановити Zig 0.16.0 для типового транспортного кодека
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --silent --show-error \
            https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz \
            --output "$RUNNER_TEMP/zig-0.16.0.tar.xz"
          echo '70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00  '"$RUNNER_TEMP/zig-0.16.0.tar.xz" | sha256sum --check --status
          tar -xJf "$RUNNER_TEMP/zig-0.16.0.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/zig-x86_64-linux-0.16.0" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/zig-x86_64-linux-0.16.0/zig" version
      - name: canon_immutability_meta + binary_number_live
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p sens --test canon_immutability_meta --test binary_number_live -- --nocapture
