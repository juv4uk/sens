name: Historical D5 admission-path donor audit

on:
  pull_request:
    paths:
      - "knowledge/d5-historical-full-map.json"
      - "crates/sens/src/source_words.rs"
      - "crates/sens/src/domain_words.rs"
      - "crates/sens/src/parser.rs"
      - "crates/sens/src/sens.rs"
      - "crates/sens/src/semantic_registry.rs"
      - "crates/sens/src/eval/lower.rs"
      - "crates/sens/tests/d5_source_boundary.rs"
      - "scripts/research-2766-d5-runtime-admission.py"
      - ".github/workflows/d5-runtime-admission-audit.yml"
      - "knowledge/repo-tooling-inventory.lisp"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Historical D5 path against current implementation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Prove all 32 exact W5 source words
        run: cargo test -p sens --test d5_source_boundary

      - name: Emit historical D5 path matrix
        run: |
          python3 scripts/research-2766-d5-runtime-admission.py --json d5-runtime-admission.json
          cat d5-runtime-admission.json

      - name: Upload matrix
        uses: actions/upload-artifact@v4
        with:
          name: historical-d5-admission-path
          path: d5-runtime-admission.json

      - name: Publish summary
        run: |
          {
            echo "## Historical D5 admission-path donor audit"
            echo
            echo "~~~text"
            python3 scripts/research-2766-d5-runtime-admission.py
            echo "~~~"
            echo
            echo "- Historical map: knowledge/d5-historical-full-map.json (donor/provenance only)."
            echo "- Current D5 semantic authority: #3305 / Contract 11.3 / knowledge/d5-ratified.json."
            echo "- This historical audit does not define current D5 coordinates or residency; human names remain projection only."
          } >> "$GITHUB_STEP_SUMMARY"
