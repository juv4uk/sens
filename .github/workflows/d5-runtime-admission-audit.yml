name: D5 research W5 boundary audit

on:
  pull_request:
    paths:
      - "knowledge/d5-historical-full-map.json"
      - "crates/sens/src/source_words.rs"
      - "crates/sens/src/domain_words.rs"
      - "crates/sens/src/parser.rs"
      - "crates/sens/src/sens.rs"
      - "crates/sens/src/semantic_registry.rs"
      - "crates/sens/src/eval/lower.rs"
      - "crates/sens/tests/d5_source_boundary.rs"
      - "scripts/research-2766-d5-runtime-admission.py"
      - ".github/workflows/d5-runtime-admission-audit.yml"
      - "knowledge/repo-tooling-inventory.lisp"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: D5 historical donor and W5 mechanism boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Prove all 32 exact W5 mechanical source words
        run: cargo test -p sens --test d5_source_boundary

      - name: Emit D5 research boundary matrix
        run: |
          python3 scripts/research-2766-d5-runtime-admission.py --json d5-research-boundary.json
          cat d5-research-boundary.json

      - name: Upload matrix
        uses: actions/upload-artifact@v4
        with:
          name: d5-research-boundary
          path: d5-research-boundary.json

      - name: Publish summary
        run: |
          {
            echo "## D5 research W5 boundary audit"
            echo
            echo "~~~text"
            python3 scripts/research-2766-d5-runtime-admission.py
            echo "~~~"
            echo
            echo "- Historical donor map: OD-005; it is not current semantic authority."
            echo "- Current D5 semantic status: UNRATIFIED / RESEARCH under #3278."
            echo "- W5 mechanics and human projections do not admit D5 semantics."
          } >> "$GITHUB_STEP_SUMMARY"
