name: Migration archived benchmark snapshot (non-program)

on:
  pull_request:
    paths:
      - 'knowledge/migration-benchmark-snapshot-2026-10-08.json'
      - 'tests/test_migration_benchmark_snapshot.py'
      - '.github/workflows/migration-benchmark-snapshot.yml'
      - 'benchmarks/sens-surface/results/**'
  push:
    branches: [main]
    paths:
      - 'knowledge/migration-benchmark-snapshot-2026-10-08.json'
      - 'tests/test_migration_benchmark_snapshot.py'
      - '.github/workflows/migration-benchmark-snapshot.yml'
      - 'benchmarks/sens-surface/results/**'

permissions:
  contents: read

jobs:
  archive-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verify archive-only, fail-closed, SHA-pinned evidence
        run: python3 -m unittest discover -s tests -p 'test_migration_benchmark_snapshot.py' -v
