name: Migration archived benchmark snapshot (non-program)

on:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  archive-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify archive-only, fail-closed, SHA-pinned evidence
        run: python3 -m unittest discover -s tests -p 'test_migration_benchmark_snapshot.py' -v
