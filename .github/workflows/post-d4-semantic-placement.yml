name: Post-D4 semantic placement

on:
  pull_request:
    paths:
      - "docs/research/2344-post-d4-historical-ledger.json"
      - "benchmarks/d5-sens-derivation-closeout/factor-eligibility.json"
      - "benchmarks/post-d4-root-min-closeout/run.py"
      - "benchmarks/post-d4-semantic-placement/**"
      - "docs/research/2703-post-d4-semantic-placement*.md"
      - ".github/workflows/post-d4-semantic-placement.yml"
  push:
    branches: [main]
    paths:
      - "docs/research/2344-post-d4-historical-ledger.json"
      - "benchmarks/d5-sens-derivation-closeout/factor-eligibility.json"
      - "benchmarks/post-d4-root-min-closeout/run.py"
      - "benchmarks/post-d4-semantic-placement/**"
      - "docs/research/2703-post-d4-semantic-placement*.md"
      - ".github/workflows/post-d4-semantic-placement.yml"

jobs:
  placement:
    name: 19-row semantic placement
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate semantic placement
        run: |
          rm -rf /tmp/post-d4-semantic-placement
          python3 benchmarks/post-d4-semantic-placement/run.py \
            --out /tmp/post-d4-semantic-placement
      - name: Publish summary
        if: always()
        run: |
          {
            echo "## Post-D4 semantic placement"
            echo
            echo "- 19/19 historical rows must be placed exactly once."
            echo "- Derived/mechanism rows receive no resident coordinate."
            echo "- D5 remains 8 generated + 24 UNKNOWN/free."
            echo "- RETURN remains a proven root with width UNKNOWN."
            echo "- SETQ D6 001111 remains candidate-only here."
          } >> "$GITHUB_STEP_SUMMARY"
