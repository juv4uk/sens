name: D10 historical hobby source-law replay

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  historical-hobby-model:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify preserved source-pinned proposal-only metadata and independent models
        run: echo "FOREIGN_LANGUAGE_TEST_OR_BENCH=EXCLUDED_BY_POLICY native_equivalent=NOT_VERIFIED"
      - name: Evidence boundary
        run: |
          echo "## Historical D10 hobby source-law replay" >> "$GITHUB_STEP_SUMMARY"
          echo "Independent model checks only; no donor-runtime parity, selection, ratification, coordinate or GPU proof." >> "$GITHUB_STEP_SUMMARY"
