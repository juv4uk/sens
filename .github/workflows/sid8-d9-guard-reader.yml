name: SID8 D9 Guard reader source cutover
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pinned-source-and-independent-peer:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify original Git blob, current D9 coordinates and peer mechanism
        run: python3 -m unittest discover -s tests -p test_sid8_d9_guard_reader_cutover.py -v
      - name: Verify source-only SID8 migration census is fail-closed
        run: python3 -m unittest discover -s tests -p test_migrate_sid8_source_batch.py -v
      - name: Verify D3 source law and guard-side exact D9 source
        run: python3 -m unittest discover -s tests -p test_sid8_d4_policy_cohort.py -v
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: sid8-d9-guard-reader
      - name: Compile canonical SENS executable
        run: cargo build -p sens-cli --bin sens
      - name: Execute eight real Guard cases through admitted D9 reader
        run: bash scripts/test-semantic-authority-guard.sh ./target/debug/sens
