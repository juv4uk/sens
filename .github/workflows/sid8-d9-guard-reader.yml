name: SID8 D9 Guard reader source cutover
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pinned-source-and-independent-peer:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/install-zig
      - name: Python migration witnesses excluded (NOT_VERIFIED)
        shell: bash
        run: echo "PYTHON_UNIT_TESTS=EXCLUDED_BY_LANGUAGE_POLICY native_equivalent=NOT_VERIFIED"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: sid8-d9-guard-reader
      - name: Compile canonical SENS executable
        run: cargo build -p sens-cli --bin sens
      - name: Execute eight real Guard cases through admitted D9 reader
        run: bash scripts/test-semantic-authority-guard.sh ./target/debug/sens
