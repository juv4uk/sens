name: D10 v13 staged semantic law check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-proposals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check all 70 researched descriptions
        run: python3 scripts/check_d10_v13_standards.py
