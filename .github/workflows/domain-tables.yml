name: domain-tables

on:
  workflow_dispatch:
jobs:
  canonical-domain-tables:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate canonical domain tables
        run: python3 scripts/check-domain-tables.py
      - name: Guard linter against old flat 8-bit head aliases
        run: python3 -m unittest discover -s tests -p test_linter_domain_head_cutover.py -v
      - name: Check generated SENS domain-width certificate
        run: python3 scripts/generate-domain-width-certificate.py --check
      - name: Prove Rust exact-width carriers match SENS certificate
        run: cargo test -p sens --test domain_width_authority_test
      - name: Check D1-D5 runtime projection
        run: python3 scripts/check-domain-surfaces-d1-d4.py
      - name: Check D7 ratified human display projection
        run: python3 scripts/check-d7-runtime-projection.py
      - name: Test D7 width and non-callable human presentation
        run: cargo test --locked -p sens --test d7_runtime_presentation --test d7_w7_pack --test canonical_w7_frame_invariance
      - name: Prove exact-width substrate preserves domain address
        run: |
          cargo test -p sens source_words::tests::same_numeric_payload_at_different_widths_never_collapses
          cargo test -p sens canonical_reader::tests::w3_through_w8_reach_ast_with_exact_domain_preserved
      - name: Record Lisp table-reader gap
        run: |
          echo "ordinary read-all width bridge tracked by #3946; canonical human tables are lib/domains/d1.lisp..d9.lisp; Rust D9 runtime remains fail-closed pending W9 #4038"
