name: domain-tables

on:
  pull_request:
    paths:
      - "knowledge/d1-d9-foundation.json"
      - "language-contract.lisp"
      - "README.md"
      - "knowledge/d5-ratified.json"
      - "knowledge/d7-ratified.json"
      - "knowledge/d8-ratified.json"
      - "knowledge/d9-ratified.json"
      - "lib/domains/d1.lisp"
      - "lib/domains/d2.lisp"
      - "lib/domains/d3.lisp"
      - "lib/domains/d4.lisp"
      - "lib/domains/d5.lisp"
      - "lib/domains/d6.lisp"
      - "lib/domains/d7.lisp"
      - "lib/domains/d8.lisp"
      - "lib/domains/d9.lisp"
      - "scripts/domain_tables.py"
      - "scripts/check-domain-tables.py"
      - "scripts/check-d2-structure-ownership.py"
      - "knowledge/d2-structure-audit.json"
      - "contracts/d2-language-control-contract.lisp"
      - "scripts/check-domain-surfaces-d1-d4.py"
      - "scripts/check-domain-surfaces-d5.py"
      - "scripts/translate-domain-program.py"
      - "scripts/sens_source_resolver.py"
      - "scripts/migrate-to-sens-codes.py"
      - "crates/sens/src/domain_surface_registry_generated.rs"
      - "crates/sens/src/binary_framing.rs"
      - "crates/sens/tests/text7_canonical_wire.rs"
      - "knowledge/structure-not-ontology-inventory.lisp"
      - "crates/sens/src/semantic_registry.rs"
      - "crates/sens/src/presentation.rs"
      - "crates/sens/src/eval/lower.rs"
      - ".github/workflows/domain-tables.yml"
  push:
    branches: [main]
    paths:
      - "knowledge/d1-d9-foundation.json"
      - "language-contract.lisp"
      - "README.md"
      - "knowledge/d5-ratified.json"
      - "knowledge/d7-ratified.json"
      - "knowledge/d8-ratified.json"
      - "knowledge/d9-ratified.json"
      - "lib/domains/d1.lisp"
      - "lib/domains/d2.lisp"
      - "lib/domains/d3.lisp"
      - "lib/domains/d4.lisp"
      - "lib/domains/d5.lisp"
      - "lib/domains/d6.lisp"
      - "lib/domains/d7.lisp"
      - "lib/domains/d8.lisp"
      - "lib/domains/d9.lisp"
      - "scripts/domain_tables.py"
      - "scripts/check-domain-tables.py"
      - "scripts/check-d2-structure-ownership.py"
      - "knowledge/d2-structure-audit.json"
      - "contracts/d2-language-control-contract.lisp"
      - "scripts/check-domain-surfaces-d1-d4.py"
      - "scripts/check-domain-surfaces-d5.py"
      - "scripts/translate-domain-program.py"
      - "scripts/sens_source_resolver.py"
      - "scripts/migrate-to-sens-codes.py"
      - "crates/sens/src/domain_surface_registry_generated.rs"
      - "knowledge/structure-not-ontology-inventory.lisp"
      - "crates/sens/tests/text7_canonical_wire.rs"
      - "crates/sens/src/binary_framing.rs"
      - "crates/sens/src/semantic_registry.rs"
      - "crates/sens/src/presentation.rs"
      - "crates/sens/src/eval/lower.rs"
      - ".github/workflows/domain-tables.yml"

jobs:
  canonical-domain-tables:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate canonical domain tables
        run: python3 scripts/check-domain-tables.py
      - name: Enforce D2-only language structure ownership
        run: python3 scripts/check-d2-structure-ownership.py
      - name: Check D1-D5 runtime projection
        run: python3 scripts/check-domain-surfaces-d1-d4.py
      - name: Check D5 authority
        run: python3 scripts/check-domain-surfaces-d5.py
      - name: Check human-surface translation
        run: python3 scripts/translate-domain-program.py --self-test
      - name: Check D9 ratified authority
        run: python3 scripts/check-d9-current-authority.py
      - name: Prove D2 structural exclusivity
        run: |
          cargo test -p sens canonical_reader::tests::d2_open_close_builds_empty_proper_list
          cargo test -p sens canonical_reader::tests::malformed_d2_structure_fails_closed
          cargo test -p sens binary_framing::tests::current_d2_dot_round_trips_as_domain_identity_not_wire_escape
      - name: Prove exact-width substrate preserves domain address
        run: |
          cargo test -p sens source_words::tests::same_numeric_payload_at_different_widths_never_collapses
          cargo test -p sens canonical_reader::tests::w3_through_w8_reach_ast_with_exact_domain_preserved
      - name: Prove direct exact-domain human lowering
        run: |
          cargo test -p sens uk_sa_
          cargo test -p sens necessary_forms_lower_to_exact_d4_calls
          cargo test -p sens exact_domain_human_presentation_round_trips_d1_d4_surfaces
          cargo test -p sens sanskrit_presentation_projects_domain_identities_inside_lists
      - name: Record Lisp table-reader gap
        run: |
          echo "ordinary read-all width bridge tracked by #3946; canonical human tables are lib/domains/d1.lisp..d9.lisp; Rust D9 runtime remains fail-closed pending W9 #4038"
