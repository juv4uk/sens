name: Macro expansion timing research

on:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  timing:
    name: Hart DEFINE-time vs SENS evaluation-time
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - name: Run live SENS timing witnesses
        run: cargo test -p sens --test post_d4_macro_timing -- --nocapture

      - name: Run bounded historical timing countermodel
        run: python3 scripts/research-2568-macro-timing.py

      - name: Run live SENS call-form witness
        run: cargo test -p sens --test post_d4_macro_call_form -- --nocapture

      - name: Run bounded whole-call vs operand-only witness
        run: python3 scripts/research-2580-macro-call-form.py

      - name: Publish summary
        if: always()
        run: |
          {
            echo "## Macro expansion timing"
            echo
            echo "~~~text"
            python3 scripts/research-2568-macro-timing.py
            python3 scripts/research-2580-macro-call-form.py
            echo "~~~"
            echo
            echo "- Historical premise: Hart AIM-057 (1963) expands through DEFINE."
            echo "- Current SENS controls are executed, not inferred."
            echo "- Hart whole-call vs SENS operand-only packaging is tested separately from timing."
            echo "- No binary placement follows from this gate."
          } >> "$GITHUB_STEP_SUMMARY"
