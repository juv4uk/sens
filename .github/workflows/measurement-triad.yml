name: SENS benchmark methodology triad
on:
  pull_request:
    paths:
      - ".github/workflows/measurement-triad.yml"
      - "benchmarks/measurement-triad/**"
      - "benchmarks/README.md"
      - "crates/sens/src/domain_ladder.rs"
      - "crates/sens/src/domain_owner_generated.rs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sens-measurement-triad-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  verdict:
    name: Paired evidence schema and fail-closed statistical verdict
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Verify benchmark manifest and generated registry
        run: python3 scripts/benchmark_registry.py --check
      - name: Reject synthetic false positives and invalid parity
        run: python3 -m unittest discover -v -s benchmarks/measurement-triad -p 'test_*.py'

  rust-adapters:
    name: Compile the independent instruction and wall-time Rust adapters
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: benchmarks/measurement-triad
      - name: Test the actual D3 owner projection mechanism
        run: cd "$RUNNER_TEMP" && cargo test --manifest-path "$GITHUB_WORKSPACE/benchmarks/measurement-triad/Cargo.toml"
      - name: Compile both benchmarking harnesses without claiming speed
        run: cd "$RUNNER_TEMP" && cargo bench --manifest-path "$GITHUB_WORKSPACE/benchmarks/measurement-triad/Cargo.toml" --benches --no-run

  instruction-probe:
    name: Callgrind I-refs capture (not a cross-environment regression gate)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Install pinned Valgrind measurement tool and matched runner
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind
          cd "$RUNNER_TEMP"
          cargo install --locked --version 0.16.1 iai-callgrind-runner
      - name: Capture deterministic Callgrind lane
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          cargo test --manifest-path "$GITHUB_WORKSPACE/benchmarks/measurement-triad/Cargo.toml"
          cargo bench --manifest-path "$GITHUB_WORKSPACE/benchmarks/measurement-triad/Cargo.toml" --bench instruction_lane | tee "$RUNNER_TEMP/sens-iai-callgrind.log"
          {
            echo "SHA=$GITHUB_SHA"
            rustc --version
            valgrind --version
            grep -m1 'model name' /proc/cpuinfo || true
          } > "$RUNNER_TEMP/sens-iai-environment.txt"
      - name: Preserve instruction raw evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: sens-measurement-triad-instruction-${{ github.sha }}
          path: |
            ${{ runner.temp }}/sens-iai-callgrind.log
            ${{ runner.temp }}/sens-iai-environment.txt
          if-no-files-found: warn
          retention-days: 14

  wall-time-probe:
    name: Criterion raw hosted wall-time (informational only)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Run Criterion; do not infer a portable speedup from hosted CI
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          cargo test --manifest-path "$GITHUB_WORKSPACE/benchmarks/measurement-triad/Cargo.toml"
          cargo bench --manifest-path "$GITHUB_WORKSPACE/benchmarks/measurement-triad/Cargo.toml" --bench wall_time_lane | tee "$RUNNER_TEMP/sens-criterion.log"
          {
            echo "SHA=$GITHUB_SHA"
            rustc --version
            uname -a
            grep -m1 'model name' /proc/cpuinfo || true
            cat /sys/devices/system/cpu/cpu0/cpufreq/scaling_governor 2>/dev/null || true
          } > "$RUNNER_TEMP/sens-criterion-environment.txt"
      - name: Preserve informational wall-time evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: sens-measurement-triad-criterion-${{ github.sha }}
          path: |
            ${{ runner.temp }}/sens-criterion.log
            ${{ runner.temp }}/sens-criterion-environment.txt
            benchmarks/measurement-triad/target/criterion/**/raw.csv
            benchmarks/measurement-triad/target/criterion/**/estimates.json
            benchmarks/measurement-triad/target/criterion/**/sample.json
          if-no-files-found: warn
          retention-days: 14
