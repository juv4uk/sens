name: D5 ratified baseline guard

on:
  pull_request:
    paths:
      - "scripts/research-2689-d5-ratified-baseline.py"
      - "knowledge/d5-historical-full-map.json"
      - "knowledge/repo-tooling-inventory.lisp"
      - ".github/workflows/d5-ratified-baseline.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify current owner-ratified D5 OD-005 baseline
        run: |
          python3 scripts/research-2689-d5-ratified-baseline.py \
            --json-out /tmp/d5-ratified-baseline.json
          cat /tmp/d5-ratified-baseline.json

      - name: Publish invariant summary
        run: |
          {
            echo "## Core D5 ratified baseline"
            echo
            echo "- width: 5"
            echo "- capacity: 32"
            echo "- resident coordinates: 32/32"
            echo "- unallocated coordinates: 0"
            echo "- selector residents retained: 8"
            echo "- historical nonselector residents: 24"
            echo "- every D4 parent has exact P0/P1 D5 children"
            echo "- canonical authority: OD-005 / #2750"
            echo "- old 8+24 sparse map is pre-OD005 research evidence, not current occupancy authority"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload machine-readable result
        uses: actions/upload-artifact@v4
        with:
          name: d5-ratified-baseline
          path: /tmp/d5-ratified-baseline.json
