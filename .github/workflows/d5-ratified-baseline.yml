name: D5 current authority

on:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  authority:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 scripts/check-d5-current-authority.py
      - name: Оптимізований Python не обходить атестацію D5
        shell: bash
        run: |
          set -euo pipefail
          for level in 1 2; do
            log="$RUNNER_TEMP/d5-opt-$level.log"
            if PYTHONOPTIMIZE="$level" python3 scripts/check-d5-current-authority.py >"$log" 2>&1; then
              echo "::error::D5 guard reported success with PYTHONOPTIMIZE=$level"
              exit 1
            fi
            if ! grep -Fq "D5-CURRENT-AUTHORITY: BLOCKED" "$log"; then
              cat "$log"
              echo "::error::D5 guard did not report named fail-closed outcome"
              exit 1
            fi
          done
      - run: cargo test -p sens domain_identity -- --nocapture
      - run: cargo test -p sens --test d5_reverse_onto_law -- --nocapture
