name: D5 current authority

on:
  pull_request:
    paths:
      - "knowledge/d5-ratified.json"
      - "contracts/d5-ratification.lisp"
      - "language-contract.lisp"
      - "CURRENT.md"
      - "docs/language-core.md"
      - "crates/sens/src/domain_identity.rs"
      - "crates/sens/src/source_words.rs"
      - "scripts/check-d5-current-authority.py"
      - ".github/workflows/d5-ratified-baseline.yml"
  push:
    branches: [main]
    paths:
      - "knowledge/d5-ratified.json"
      - "contracts/d5-ratification.lisp"
      - "language-contract.lisp"
      - "CURRENT.md"
      - "docs/language-core.md"
      - "crates/sens/src/domain_identity.rs"
      - "scripts/check-d5-current-authority.py"

permissions:
  contents: read

jobs:
  authority:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 scripts/check-d5-current-authority.py
      - run: cargo test -p sens domain_identity -- --nocapture
      - run: cargo test -p sens --test d5_reverse_onto_law -- --nocapture
