name: D10 1958 GPS symbolic AI donor
on:
  workflow_dispatch:
jobs:
  independent-symbolic-ai-donor:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Audit 3 historical laws, five HOLD and ten anti-forgery controls
        run: python3 scripts/check_d10_gps_means_ends_history.py
      - name: Install independent Prolog runner
        run: sudo apt-get update -qq && sudo apt-get install -y swi-prolog-nox
      - name: Run actual 17-witness Prolog oracle
        run: python3 scripts/check_d10_gps_means_ends_history.py --real-prolog
