name: Generate public API report artifact

on:
  pull_request:
    paths:
      - ".github/workflows/public-api-report-artifact.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Generate exact report
        run: python3 scripts/public_api_inventory.py --write-report
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: public-api-discovery-generated
          path: docs/generated/public-api-discovery.md
          if-no-files-found: error
