name: Generate public API report artifact

on:
  pull_request:
    paths:
      - ".github/workflows/public-api-report-artifact.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
      - name: Generate exact report
        run: python3 scripts/public_api_inventory.py --write-report
      - name: Commit generated report to PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/generated/public-api-discovery.md
          if git diff --cached --quiet; then
            echo "report already current"
            exit 0
          fi
          git commit -m "chore: regenerate public API discovery"
          git push origin HEAD:${{ github.head_ref }}
