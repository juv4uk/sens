name: Core-Math demand derivation research

on:
  pull_request:
    paths:
      - "benchmarks/core-math-demand-derivation/**"
      - ".github/workflows/core-math-demand-derivation.yml"
      - "benchmarks/core-math-autonomous-closure/**"
      - "benchmarks/core-math-closure-scaling/**"
      - "docs/research/2433-core-math-neutral-v1.json"
      - "scripts/research-2433-core-math-neutral-growth.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  demand-derivation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Re-check autonomous closure donor
        run: |
          rm -rf /tmp/core-math-autonomous-closure
          python3 benchmarks/core-math-autonomous-closure/run.py \
            --out /tmp/core-math-autonomous-closure

      - name: Re-check closure scaling donor
        run: |
          rm -rf /tmp/core-math-closure-scaling
          python3 benchmarks/core-math-closure-scaling/run.py \
            --max-depth 3 \
            --out /tmp/core-math-closure-scaling

      - name: Run demand-derived construction/search
        run: |
          rm -rf /tmp/core-math-demand-derivation
          python3 benchmarks/core-math-demand-derivation/run.py \
            --out /tmp/core-math-demand-derivation

      - name: Publish report
        if: always()
        run: |
          if test -f /tmp/core-math-demand-derivation/report.md; then
            cat /tmp/core-math-demand-derivation/report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-math-demand-derivation
          path: /tmp/core-math-demand-derivation/
          retention-days: 14
