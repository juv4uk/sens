name: D10 historical source admission batch 1
on:
  push:
    paths:
      - 'knowledge/d10-v1-semantic-inventory.json'
      - 'knowledge/d10-fill-v1-state.json'
      - 'knowledge/d10-growth-baseline-v1.json'
      - 'knowledge/d10-historical-primary-admission-batch1-v1.json'
      - 'scripts/check_d10_historical_admission_batch1.py'
      - 'scripts/check_d10_historical_primary_reconcile.py'
      - 'scripts/check_d10_psl_interlisp_lispm_residual.py'
      - 'scripts/check_d10_r6rs_history_audit.py'
      - 'docs/architecture/ARCHIPELAGO-V1.uk.md'
      - '.github/workflows/d10-historical-admission-batch1.yml'
  pull_request:
    paths:
      - 'knowledge/d10-*'
      - 'scripts/check_d10_*'
      - 'docs/architecture/ARCHIPELAGO-V1.uk.md'
      - '.github/workflows/d10-historical-admission-batch1.yml'
jobs:
  admission:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit batch with adverse controls
        run: python3 scripts/check_d10_historical_admission_batch1.py --self-test
      - name: Canonical D10 count
        run: python3 scripts/check-d10-v1-semantic-inventory.py
      - name: Historical primary reconciliation
        run: python3 scripts/check_d10_historical_primary_reconcile.py --self-test
      - name: R6RS HOLD still protected
        run: python3 scripts/check_d10_r6rs_history_audit.py --self-test
      - name: PSL Interlisp machine HOLD protected
        run: python3 scripts/check_d10_psl_interlisp_lispm_residual.py --self-test
      - name: Archipelago projection
        run: python3 scripts/check-d10-archipelago-doc-projection.py
