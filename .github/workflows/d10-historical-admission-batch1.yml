name: D10 historical source admission batch 1
on:
  workflow_dispatch:
jobs:
  admission:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit batch with adverse controls
        run: python3 scripts/check_d10_historical_admission_batch1.py --self-test
      - name: Canonical D10 count
        run: python3 scripts/check-d10-v1-semantic-inventory.py
      - name: Historical primary reconciliation
        run: python3 scripts/check_d10_historical_primary_reconcile.py --self-test
      - name: R6RS HOLD still protected
        run: python3 scripts/check_d10_r6rs_history_audit.py --self-test
      - name: PSL Interlisp machine HOLD protected
        run: python3 scripts/check_d10_psl_interlisp_lispm_residual.py --self-test
