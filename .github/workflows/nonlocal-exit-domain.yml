name: Non-local exit domain falsifier

on:
  workflow_dispatch:

concurrency:
  group: nonlocal-exit-domain-${{ github.ref }}
  cancel-in-progress: false

jobs:
  falsifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run domain falsifier
        run: |
          rm -rf /tmp/nonlocal-exit-domain
          python3 benchmarks/nonlocal-exit-domain/run.py \
            --out /tmp/nonlocal-exit-domain
      - name: Publish report
        run: cat /tmp/nonlocal-exit-domain/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: nonlocal-exit-domain
          path: /tmp/nonlocal-exit-domain
