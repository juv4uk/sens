name: Non-local exit domain falsifier

on:
  pull_request:
    paths:
      - "benchmarks/nonlocal-exit-domain/**"
      - "benchmarks/d5-sens-derivation-closeout/**"
      - "benchmarks/post-d4-root-min-closeout/**"
      - "benchmarks/d6-closure-map/**"
      - "benchmarks/d6-unknown-frontier/**"
      - "scripts/research-2488-return-placement.py"
      - ".github/workflows/nonlocal-exit-domain.yml"
  workflow_dispatch:

concurrency:
  group: nonlocal-exit-domain-${{ github.ref }}
  cancel-in-progress: true

jobs:
  falsifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run domain falsifier
        run: |
          rm -rf /tmp/nonlocal-exit-domain
          python3 benchmarks/nonlocal-exit-domain/run.py \
            --out /tmp/nonlocal-exit-domain
      - name: Publish report
        run: cat /tmp/nonlocal-exit-domain/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: nonlocal-exit-domain
          path: /tmp/nonlocal-exit-domain
