name: D9 surface harvest v1

on:
  workflow_dispatch:

jobs:
  surface-harvest:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: GPU runner identity
        run: nvidia-smi || true
      - name: Verify public-surface harvest
        run: python3 scripts/check-d9-surface-harvest-v1.py
      - name: Verify global D9 inventory
        run: python3 scripts/check-d9-v1-semantic-inventory.py
      - name: Preserve D8-overflow tranche
        run: python3 scripts/check-d9-overflow-review-v1.py
