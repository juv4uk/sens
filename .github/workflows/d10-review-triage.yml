name: D10 candidate triage preserves source identities
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check-lossless-triage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify original 7396 immutable source appearances
        run: python3 scripts/d10_restore_source_occurrences.py
      - name: Regenerate and compare sorted queue, all 1809 identities
        run: python3 scripts/d10_sort_review_queue.py
      - name: Fail-closed regression tests
        run: python3 -m unittest discover -s tests -p 'test_d10_review_queue.py' -v
