name: D8 ratified authority

on:
  pull_request:
    paths:
      - "knowledge/d8-ratified.json"
      - "knowledge/d8-v2-gauge-fixed-candidate.json"
      - "knowledge/d1-d8-foundation.json"
      - "knowledge/d1-d9-foundation.json"
      - "knowledge/d9-ratified.json"
      - "contracts/d8-ratification.lisp"
      - "contracts/d1-d8-foundation-ratification.lisp"
      - "contracts/d1-d9-foundation-ratification.lisp"
      - "language-contract.lisp"
      - "CURRENT.md"
      - "docs/language-core.md"
      - "crates/sens/src/domain_identity.rs"
      - "crates/sens/src/source_words.rs"
      - "scripts/check-d8-current-authority.py"
      - ".github/workflows/d8-ratified-authority.yml"
  push:
    branches: [main]
    paths:
      - "knowledge/d8-ratified.json"
      - "knowledge/d1-d8-foundation.json"
      - "knowledge/d1-d9-foundation.json"
      - "knowledge/d9-ratified.json"
      - "contracts/d8-ratification.lisp"
      - "contracts/d1-d8-foundation-ratification.lisp"
      - "contracts/d1-d9-foundation-ratification.lisp"
      - "language-contract.lisp"
      - "CURRENT.md"
      - "crates/sens/src/domain_identity.rs"
      - "scripts/check-d8-current-authority.py"
      - ".github/workflows/d8-ratified-authority.yml"
  workflow_dispatch:

jobs:
  authority:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: GPU runner identity
        run: nvidia-smi || true
      - name: Verify D8 current authority
        run: python3 scripts/check-d8-current-authority.py
      - name: Verify D1-D9 foundation
        run: python3 scripts/check-d1-d5-foundation.py
