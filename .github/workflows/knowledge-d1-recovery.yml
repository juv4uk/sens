name: Knowledge exact-D1 partial recovery

on:
  push:
    branches: [main]
    paths:
      - "lib/knowledge.lisp"
      - "tests/test_knowledge_d1_recovery.py"
      - "crates/sens/tests/knowledge_d1_recovery.rs"
      - ".github/workflows/knowledge-d1-recovery.yml"
  pull_request:
    paths:
      - "lib/knowledge.lisp"
      - "tests/test_knowledge_d1_recovery.py"
      - "crates/sens/tests/knowledge_d1_recovery.rs"
      - ".github/workflows/knowledge-d1-recovery.yml"

permissions:
  contents: read

jobs:
  recovered-slice:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: "Immutable 20-function prefix, 3 recovered functions, all 2046 exact-width coordinates"
        run: python3 -m unittest discover -s tests -p test_knowledge_d1_recovery.py -v
      - uses: dtolnay/rust-toolchain@stable
      - name: "Execute 3 knowledge functions with direct D1, negative paths, structural D3"
        run: cargo test --locked -p sens --test knowledge_d1_recovery -- --nocapture
