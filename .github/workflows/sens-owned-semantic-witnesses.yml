name: SENS-owned binary semantic witnesses

# One automatic targeted job. Existing broader witnesses remain manual-only.
# Єдиний автоматичний main workflow — ci.yml. Цей свідок ручний.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  world-metadata-exact:
    if: ${{ false }} # Карантин: самовільний запуск недопустимий
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@1.99.0
      - name: Compile existing SENS transport (no host-language semantic law)
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked -p sens-cli --bin sens-trit
      - name: SENS checks all four laws and the one-bit mutant; print exact diagnostics
        shell: bash
        run: |
          set -euo pipefail
          dir=tests/semantic
          base="$dir/world-metadata-selector"
          oracle=target/debug/sens-trit
          failure=0
          for kind in law mutant; do
            fixture="$base-$kind.sens"
            actual="$RUNNER_TEMP/world-metadata-$kind.actual"
            errfile="$RUNNER_TEMP/world-metadata-$kind.stderr"
            expected="$RUNNER_TEMP/world-metadata-$kind.expected"
            if [[ "$kind" == law ]]; then printf '1\n' > "$expected"; else printf '0\n' > "$expected"; fi
            set +e
            "$oracle" eval "$fixture" >"$actual" 2>"$errfile"
            rc=$?
            set -e
            fixture_sha="$(sha256sum "$fixture" | cut -d ' ' -f 1)"
            expected_sha="$(sha256sum "$expected" | cut -d ' ' -f 1)"
            actual_sha="$(sha256sum "$actual" | cut -d ' ' -f 1)"
            echo "test_id=WORLD-METADATA-$kind layer=eval source=$fixture"
            echo "fixture_sha256=$fixture_sha expected_sha256=$expected_sha actual_sha256=$actual_sha"
            echo "commit=$GITHUB_SHA exit_code=$rc reproduce='$oracle eval $fixture'"
            if [[ "$rc" -eq 0 ]] && cmp -s "$expected" "$actual"; then
              echo "PASS id=WORLD-METADATA-$kind verdict=$(cat "$actual")"
              echo "| WORLD-METADATA-$kind | D1:$(cat "$actual") | $fixture_sha |" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::error file=$fixture::REGRESSION test_id=WORLD-METADATA-$kind layer=eval sha=$GITHUB_SHA"
              echo "REGRESSION first_observed_bad_sha=$GITHUB_SHA first_bad_sha=UNRESOLVED"
              echo "first_difference=$(cmp -l "$expected" "$actual" | head -n 1 || true)"
              echo "actual_text=$(head -c 100 "$actual")"
              echo "stderr=$(tail -c 400 "$errfile")"
              echo "UNINFORMATIVE-OUTPUT until first_bad_sha is proven; no false green"
              failure=1
            fi
          done
          exit "$failure"
  binary-self-verdicts:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@1.99.0
      - name: Двійковий SENS сам перевіряє D4 λ й однобітний мутант
        shell: bash
        run: |
          set -euo pipefail
          base="tests/semantic/persistent-vector-rotation-d4"
          # Тільки механіка: слова кодованого SENS мають коректну ширину.
          for variant in law mutant; do
            cargo run --quiet --locked -p sens-cli --bin sens-trit -- encode "${base}-${variant}.lisp"
          done
          # Одна зміна у D1-слові даних, решта канонічного D2/T5 не міняється.
          mapfile -t good < <(tail -n 1 "${base}-law.lisp" | tr ' ' '\n' | sed '/^$/d')
          mapfile -t bad < <(tr ' ' '\n' < "${base}-mutant.lisp" | sed '/^$/d')
          [[ "${#good[@]}" -eq "${#bad[@]}" ]]
          changes=0
          for ((i=0; i<${#good[@]}; i++)); do
            if [[ "${good[i]}" != "${bad[i]}" ]]; then
              [[ "${good[i]}" == 0 && "${bad[i]}" == 1 ]]
              ((changes+=1))
            fi
          done
          [[ "$changes" -eq 1 ]]

          # SENS має власні D3 COND/EQ та fail-гілку (0).
          cargo run --quiet --locked -p sens-cli --bin sens-trit -- eval "${base}-law.sens" > "$RUNNER_TEMP/sens-pass.txt"
          grep -Fxq "1" "$RUNNER_TEMP/sens-pass.txt"
          if cargo run --quiet --locked -p sens-cli --bin sens-trit -- eval "${base}-mutant.sens" > "$RUNNER_TEMP/sens-mutant.txt" 2>&1; then
            echo "BLOCKED: мутант пройшов, хоча його SENS-гілка зобов'язана відмовити" >&2
            exit 1
          fi
      - name: SENS-вирок для четвертого і п'ятого вузла — власна D3 логіка, однобітний мутант
        shell: bash
        run: |
          set -euo pipefail
          base="tests/semantic/persistent-vector-node-selectors"
          cargo run --quiet --locked -p sens-cli --bin sens-trit -- verify "${base}-law.lisp"
          cargo run --quiet --locked -p sens-cli --bin sens-trit -- verify "${base}-mutant.lisp"
          # Rust/host не обчислює EQ/COND: сам двійковий SENS видає D1:1 чи D1:0.
          cargo run --quiet --locked -p sens-cli --bin sens-trit -- eval "${base}-law.sens" > "$RUNNER_TEMP/node-law.txt"
          cargo run --quiet --locked -p sens-cli --bin sens-trit -- eval "${base}-mutant.sens" > "$RUNNER_TEMP/node-mutant.txt"
          test "$(tail -n 1 "$RUNNER_TEMP/node-law.txt")" = "1"
          test "$(tail -n 1 "$RUNNER_TEMP/node-mutant.txt")" = "0"
          # Mutant changes exactly ONE already typed D1 word, never width or D2.
          diff_count="$(paste <(tr '[:space:]' '\n' < "${base}-law.lisp" | sed '/^$/d') <(tr '[:space:]' '\n' < "${base}-mutant.lisp" | sed '/^$/d') | awk '$1 != $2 { if ($1!="1" || $2!="0") exit 3; n++ } END {print n+0}')"
          test "$diff_count" = 1
      - name: Execute semantic laws owned by binary SENS
        run: cargo test --locked -p sens --test sens_semantic_witnesses -- --nocapture
      - name: Виконати точний SENS-закон персистентної мапи і мутант
        run: cargo test --locked -p sens --test persistent_map_binary_oracle -- --nocapture
