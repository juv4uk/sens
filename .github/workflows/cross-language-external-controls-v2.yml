name: Cross-language external controls v2

on:
  pull_request:
    paths:
      - "benchmarks/cross-language/external_controls.py"
      - "benchmarks/cross-language/manifest.scm"
      - "benchmarks/cross-language/README.md"
      - ".github/workflows/cross-language-external-controls-v2.yml"
  workflow_dispatch:

concurrency:
  group: cross-language-external-controls-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  external-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Install benchmark runtimes
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4 racket sbcl valgrind rustc
          python3 --version
          lua5.4 -v
          racket --version
          sbcl --version
          rustc --version
          valgrind --version

      - name: Correctness and same-machine measurements
        run: |
          rm -rf /tmp/sens-external-controls-v2
          python3 benchmarks/cross-language/external_controls.py \
            --lua lua5.4 \
            --racket racket \
            --sbcl sbcl \
            --rustc rustc \
            --reps 3 \
            --out /tmp/sens-external-controls-v2

      - name: Publish report
        if: always()
        run: |
          if test -f /tmp/sens-external-controls-v2/report.md; then
            cat /tmp/sens-external-controls-v2/report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cross-language-external-controls-v2
          path: /tmp/sens-external-controls-v2
