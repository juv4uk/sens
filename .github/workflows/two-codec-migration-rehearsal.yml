name: Two-codec SENS migration rehearsal - inventory, stage, restore
on:
  push:
    paths:
      - 'scripts/prepare-two-codec-migration.py'
      - 'crates/sens/examples/two_codec_small_programs.rs'
      - '.github/workflows/two-codec-migration-rehearsal.yml'
      - 'docs/two-codec-migration-plan-2026-10-11.uk.md'
  pull_request:
    paths:
      - 'scripts/prepare-two-codec-migration.py'
      - 'crates/sens/examples/two_codec_small_programs.rs'
      - '.github/workflows/two-codec-migration-rehearsal.yml'
      - 'docs/two-codec-migration-plan-2026-10-11.uk.md'
permissions:
  contents: read
jobs:
  rehearsal:
    name: Offline dry-run, isolated physical stage, exact restoration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build reviewed Rust transport oracle once
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --release -p sens --example two_codec_small_programs
      - name: Dry-run all Git tracked .sens inputs with exact SHA manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/prepare-two-codec-migration.py \
            --runner target/release/examples/two_codec_small_programs \
            > "$RUNNER_TEMP/two-codec-migration-dry-run.json"
          python3 - "$RUNNER_TEMP/two-codec-migration-dry-run.json" <<'PY'
          import json,sys
          p=json.load(open(sys.argv[1]))
          if p["source_files"] < 23 or p["selected_f3"] < 1:
              raise SystemExit("missing real corpus or short-format candidate")
          if p["planned_total_bytes"] >= p["t5_total_bytes"]:
              raise SystemExit("two-codec policy made actual physical corpus larger")
          if len(p["files"]) != p["source_files"]:
              raise SystemExit("partial migration manifest")
          print("MIGRATION_DRY_RUN_PASS", p["source_files"], p["selected_f3"])
          PY
      - name: Stage outside checkout and reverse EVERY selected physical file
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/prepare-two-codec-migration.py \
            --runner target/release/examples/two_codec_small_programs \
            --stage "$RUNNER_TEMP/sens-two-codec-staged" \
            > "$RUNNER_TEMP/two-codec-migration-staged.json"
          python3 scripts/prepare-two-codec-migration.py \
            --runner target/release/examples/two_codec_small_programs \
            --verify-stage "$RUNNER_TEMP/sens-two-codec-staged" \
            > "$RUNNER_TEMP/two-codec-migration-audit.json"
          git diff --exit-code -- '*.sens'
          test -z "$(git status --porcelain --untracked-files=no -- '*.sens')"
      - name: Fail closed on corrupted framed file, then restore staged fixture
        shell: bash
        run: |
          set -euo pipefail
          staged="$RUNNER_TEMP/sens-two-codec-staged"
          example="$staged/tests/fixtures/migration-quote-cohort/quote-legacy.senc"
          test -s "$example"
          cp "$example" "$RUNNER_TEMP/known-good-F3.senc"
          python3 - "$example" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1])
          data=p.read_bytes()
          if not data or data[0]!=0xf3:
              raise SystemExit("wrong physical F3 fixture")
          p.write_bytes(b"\xf4"+data[1:])
          PY
          if python3 scripts/prepare-two-codec-migration.py \
              --runner target/release/examples/two_codec_small_programs \
              --verify-stage "$staged" > "$RUNNER_TEMP/must-fail.txt" 2>&1; then
            echo "MIGRATION_BLOCKED: corrupted carrier unexpectedly accepted" >&2
            exit 1
          fi
          cp "$RUNNER_TEMP/known-good-F3.senc" "$example"
          python3 scripts/prepare-two-codec-migration.py \
            --runner target/release/examples/two_codec_small_programs \
            --verify-stage "$staged" > "$RUNNER_TEMP/restored-audit.json"
          test -z "$(git status --porcelain --untracked-files=no -- '*.sens')"
          echo MIGRATION_NEGATIVE_CONTROL_PASS
      - name: Retain SHA-grounded plan, staged files and verification output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sens-two-codec-migration-${{ github.sha }}
          path: |
            ${{ runner.temp }}/two-codec-migration-*.json
            ${{ runner.temp }}/restored-audit.json
            ${{ runner.temp }}/sens-two-codec-staged/
          if-no-files-found: error
          retention-days: 30
