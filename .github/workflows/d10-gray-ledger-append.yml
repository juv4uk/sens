name: D10 Gray historical ledger append regression

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-historical-id-and-source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Original Gray source guard (immutable SHA and bit witnesses)
        run: python3 scripts/check_d10_gray_word_selection.py --self-test
      - name: Append-only positive and negative ledger regressions
        run: python3 -m unittest discover -s tests -p test_d10_gray_ledger_append.py -v
