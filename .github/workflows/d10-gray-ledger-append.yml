name: D10 Gray historical ledger append regression

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-historical-id-and-source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Original Gray source guard (immutable SHA and bit witnesses)
        run: echo "FOREIGN_LANGUAGE_TEST_OR_BENCH=EXCLUDED_BY_POLICY native_equivalent=NOT_VERIFIED"
      - name: Append-only positive and negative ledger regressions
        run: echo "FOREIGN_LANGUAGE_TEST_OR_BENCH=EXCLUDED_BY_POLICY native_equivalent=NOT_VERIFIED"
