name: D10 primitive binary word source and oracle
on:
  workflow_dispatch:
jobs:
  exact-word-law:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: D10 source / ledger / negative controls
        run: python3 scripts/check_d10_primitive_binary_word_root.py --self-test
      - name: Exhaustive Python primitive-root vs KMP witnesses
        run: python3 -m unittest discover -s tests -p test_d10_primitive_binary_word_root.py -v
      - name: Install actual Chez Scheme R6RS runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y chezscheme
      - name: Execute Scheme mathematical donor oracle
        run: scheme --script tests/d10_primitive_binary_root_chez.ss
      - name: Existing monotonic source and ledger proofs
        run: |
          python3 scripts/check_d10_selection_transition_history.py --self-test
          true
