name: Verify #524 d295 CLI baseline

on:
  # Переведено на pull_request: цей workflow УЖЕ обробляє PR-події
  # (github.event.pull_request), але тригер не стріляв — перевірка не мала наслідків.
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read

jobs:
  cli-baseline:
    if: github.event.pull_request.head.ref == 'verify/524-d295-cli-baseline'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/install-zig
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: verify-524-d295-cli
      - name: Build CLI
        run: cargo build -p sens-cli
      - name: Capture startup diagnostics
        shell: bash
        run: |
          set -u
          printf '(1 2' > /tmp/sens-524-bad.lisp
          set +e
          ./target/debug/sens /tmp/sens-524-bad.lisp >/tmp/parse.out 2>/tmp/parse.err
          parse_code=$?
          timeout 3s ./target/debug/sens --tcp=0 --protocol=sexpr >/tmp/tcp.out 2>/tmp/tcp.err
          tcp_code=$?
          set -e
          echo "PARSE_EXIT=$parse_code"
          echo "--- parse stderr ---"
          sed -n '1,20p' /tmp/parse.err
          echo "--- parse stdout ---"
          sed -n '1,20p' /tmp/parse.out
          echo "TCP_EXIT=$tcp_code"
          echo "--- tcp stderr ---"
          sed -n '1,20p' /tmp/tcp.err
          echo "--- tcp stdout ---"
          sed -n '1,20p' /tmp/tcp.out
      - name: Exact CLI smoke
        run: cargo test -p sens-cli --test cli -- --nocapture
