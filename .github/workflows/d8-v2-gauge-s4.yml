name: D8 gauge S4

on:
  workflow_dispatch:

jobs:
  gauge-s4:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: GPU runner presence
        run: nvidia-smi || true
      - name: Check semantic inventory
        run: python3 scripts/check-d8-v2-semantic-inventory.py
      - name: Check S2 geometry
        run: python3 scripts/check-d8-v2-geometry-s2.py
      - name: Reproduce S4 candidate
        run: python3 scripts/check-d8-v2-gauge-s4.py
