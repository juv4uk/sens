name: D10 linguistic mark and rewrite research

on:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Перевірити перенесення наголосів, транслітерацію та негативні тести
        run: python3 tests/test_d10_linguistic_laws.py