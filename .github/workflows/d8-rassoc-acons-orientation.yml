name: D8 RASSOC-ACONS orientation research

on:
  workflow_dispatch:

jobs:
  typed-product-witness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Run exhaustive association-orientation witness
        run: |
          rm -rf /tmp/d8-rassoc-acons-orientation
          python3 benchmarks/d8-rassoc-acons-orientation/run.py \
            --out /tmp/d8-rassoc-acons-orientation
      - name: Verify deterministic replay
        run: |
          rm -rf /tmp/d8-rassoc-acons-orientation-2
          python3 benchmarks/d8-rassoc-acons-orientation/run.py \
            --out /tmp/d8-rassoc-acons-orientation-2
          cmp /tmp/d8-rassoc-acons-orientation/witness.json \
              /tmp/d8-rassoc-acons-orientation-2/witness.json
      - name: Publish report
        if: always()
        run: |
          test ! -f /tmp/d8-rassoc-acons-orientation/report.md || \
            cat /tmp/d8-rassoc-acons-orientation/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d8-rassoc-acons-orientation
          path: /tmp/d8-rassoc-acons-orientation/
          retention-days: 14
