name: guarded-t5-mirror-transaction

on:
  pull_request:
    paths:
      - 'scripts/guarded_sens_mirror.py'
      - 'tests/test_guarded_sens_mirror.py'
      - 'docs/T5-GUARDED-MIRROR.uk.md'
      - '.github/workflows/guarded-t5-mirror-transaction.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  atomic-batch-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Python atomic migration test suite
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_guarded_sens_mirror.py' -v
      - name: Real converter positive two file transaction
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/originals"
          printf '()\n' > "$RUNNER_TEMP/originals/alpha.lisp"
          printf '()\n' > "$RUNNER_TEMP/originals/beta.lisp"
          python3 scripts/guarded_sens_mirror.py --root "$RUNNER_TEMP/originals" --out "$RUNNER_TEMP/accepted"
          test "$(find "$RUNNER_TEMP/accepted" -name '*.sens' -type f | wc -l)" -eq 2
          printf '000\n' > "$RUNNER_TEMP/expected.lisp"
          cargo run -q -p sens-cli --bin sens-trit -- encode "$RUNNER_TEMP/expected.lisp"
          cmp "$RUNNER_TEMP/expected.sens" "$RUNNER_TEMP/accepted/alpha.sens"
          cmp "$RUNNER_TEMP/expected.sens" "$RUNNER_TEMP/accepted/beta.sens"
          python3 - "$RUNNER_TEMP/accepted/_physical-migration-report.json" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1]))
          assert x['summary']['physical_files'] == 2
          assert x['summary']['semantic_oracle_verified'] == 0
          assert x['semantics'] == 'NOT_VERIFIED'
          PY
      - name: Real converter mixed blocked must publish zero files
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/blocked"
          printf '()\n' > "$RUNNER_TEMP/blocked/good.lisp"
          printf '(\n' > "$RUNNER_TEMP/blocked/bad.lisp"
          if python3 scripts/guarded_sens_mirror.py --root "$RUNNER_TEMP/blocked" --out "$RUNNER_TEMP/should-not-exist"; then
            echo 'FAIL partial conversion accepted'; exit 1
          fi
          test ! -e "$RUNNER_TEMP/should-not-exist"
