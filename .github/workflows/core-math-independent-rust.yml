name: Core-Math independent Rust executor

on:
  pull_request:
    paths:
      - "docs/research/2433-core-math-neutral-v1.json"
      - "docs/research/2433-core-math-generation-certificates.json"
      - "benchmarks/core-math-neutral-ir/**"
      - "benchmarks/core-math-independent-executor/**"
      - ".github/workflows/core-math-independent-rust.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independent-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Independence source guard
        run: |
          ! grep -R -n -E 'sens::|crates/sens|core\.lisp|Command::new|python3'             benchmarks/core-math-independent-executor/src

      - name: Unit tests
        run: cargo test --manifest-path benchmarks/core-math-independent-executor/Cargo.toml

      - name: Execute neutral IR independently
        run: cargo run --quiet --release --manifest-path benchmarks/core-math-independent-executor/Cargo.toml
