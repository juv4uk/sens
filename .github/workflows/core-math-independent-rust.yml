name: Core-Math independent Rust executor

on:
  pull_request:
    paths:
      - "docs/research/2433-core-math-neutral-v1.json"
      - "docs/research/2433-core-math-generation-certificates.json"
      - "benchmarks/core-math-independent-executor/**"
      - ".github/workflows/core-math-independent-rust.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  execute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run standalone Rust executor
        run: cargo run --quiet --manifest-path benchmarks/core-math-independent-executor/Cargo.toml
