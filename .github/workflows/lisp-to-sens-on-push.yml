name: Lisp → SENS на пуш (змінені або нові .lisp)

# Вимога власника: коли .lisp змінено або створено — пуш сам запускає
# перетворення на .sens і комітить фізичний носій.
#
# Чому окремий workflow, а не remint-drifted-pairs.yml:
#   remint важкий (карбує всі пари, ганяє F6, конкурс) і його коміт
#   відхиляється прапорцем regenerated_failed. Тут — лише те, що змінилось:
#   один прохід по змінених .lisp, той самий канонічний карб
#   (scripts/refresh-verified-t5m-pair.sh), один коміт.
#
# Джерело істини карбу — Zig/T5M через sens-trit, не Python.

on:
  push:
    branches: [main]
    paths:
      - "**.lisp"
  # Ручний запуск: без нього карбування неможливо форсувати, коли пуш
  # не спрацював (наприклад, носій відстав, а нового пушу немає).
  # Дефект, знайдений 2026-10-27: core4.sens відстав на 2 години, а
  # запустити воркфлоу вручну було неможливо.
  workflow_dispatch:

# Не скасовувати попередні прогони (правило власника) і не ставити в чергу
# один поверх одного: карбування пише в git, тож паралельність тут шкідлива.
# ВЛАСНИК: cancel-in-progress: true — і НІКОЛИ БІЛЬШЕ НЕ ЗМІНЮВАТИ.
# Загальне правило «не скасовувати попередні актіони» — про ПЕРЕВІРКИ,
# де важливий результат кожного прогону. Для КАРБУВАННЯ навпаки: якщо
# в черзі кілька пушів, карбувати треба лише ОСТАННІЙ — проміжні все одно
# перезапишуться, а їхнє карбування дало б застарілий носій і зайняло чергу.
# Без цього при темпі ~670 комітів на добу черга накопичувалась.
concurrency:
  group: sens-physical-pair-writer
  cancel-in-progress: true

permissions:
  contents: write
  # GITHUB_TOKEN push does not start downstream CI; explicit workflow_dispatch does.
  actions: write

jobs:
  mint:
    name: Перетворити змінені .lisp на .sens
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Встановити Zig
        uses: ./.github/actions/install-zig

      - uses: dtolnay/rust-toolchain@1.99.0

      - name: Збудувати SENS-бінарники (sens + sens-trit)
        run: cargo build --locked -p sens-cli --bin sens --bin sens-trit

      - name: Перетворити змінені або нові .lisp на .sens
        shell: bash
        run: |
          set -euo pipefail

          before='${{ github.event.before }}'
          # Перший пуш у гілку дає нульовий SHA — тоді беремо попередній коміт.
          if [[ "$before" =~ ^0+$ ]] || [[ -z "$before" ]] || ! git cat-file -e "$before^{commit}" 2>/dev/null; then
            before="$(git rev-parse "${GITHUB_SHA}^" 2>/dev/null || echo "")"
          fi

          if [[ -z "$before" ]]; then
            echo "LISP_TO_SENS_NO_BASE (перший коміт у гілці) — нічого не перетворюю"
            exit 0
          fi

          # Дзеркало виключень міграції: generated/surface — не джерела мови,
          # docs/research — історія, superseded — карантин.
          changed="$(git -c core.quotePath=false diff --name-only "$before" "$GITHUB_SHA" -- '*.lisp' \
            | grep -vE '^(lib/generated/|lib/surface/|docs/|research/|superseded/|target/)' || true)"

          if [[ -z "$changed" ]]; then
            echo "LISP_TO_SENS_NO_CHANGES"
            exit 0
          fi

          echo "LISP_TO_SENS_CHANGED:"
          printf '%s\n' "$changed"

          fail=0
          while IFS= read -r f; do
            [[ -n "$f" ]] || continue
            if [[ ! -f "$f" ]]; then
              # Видалене джерело: пару прибирає окремий census, не цей крок.
              echo "LISP_TO_SENS_SKIP_MISSING $f"
              continue
            fi
            echo "LISP_TO_SENS_MINT $f"
            profile_args=()
            binding_args=()
            expected_error=""
            case "$f" in
              tests/integration/core1/core1-*.lisp|tests/semantic/core1-gc-reachability-laws.lisp)
                # Core1 witnesses execute with Core1's own definitions only.
                binding_args=(--binding-source lib/core1.lisp);;
              tests/semantic/d6-compose-flip-law.lisp|tests/semantic/d6-compose-flip-laws.lisp|tests/semantic/d6-compose-flip-mutant.lisp)
                # D6 closure witnesses require the Core1-local function laws.
                binding_args=(--binding-source lib/core1.lisp);;
              tests/semantic/d8-core1-*.lisp|tests/semantic/d9-core1-*.lisp|tests/semantic/d10-core1-*.lisp|tests/semantic/d8-and-or-d9-fifth-laws.lisp)
                # D8/D9/D10 Core1 witnesses execute definitions shipped by Core1.
                binding_args=(--binding-source lib/core1.lisp);;
              tests/semantic/d10-core4-if-*.lisp)
                # Core4 is the runtime profile; do not reload its root D10 definition.
                profile_args=(--core4-runtime);;
              tests/integration/core1/reject-core1-cond-empty.lisp|tests/integration/core1/reject-core1-cond-number-zero.lisp)
                binding_args=(--binding-source lib/core1.lisp)
                expected_error='D4:0100 NOT requires an exact D1 PredicateBit';;
              tests/integration/core1/reject-core1-d7-as-function.lisp)
                binding_args=(--binding-source lib/core1.lisp)
                expected_error='D7 1100110 не має допущеного механізму виклику';;
              tests/integration/core1/reject-core1-list-as-function.lisp)
                binding_args=(--binding-source lib/core1.lisp)
                expected_error='D4:0000 застосувати: D7 1101100 не має допущеного механізму виклику';;
              tests/semantic/d9-d10-defined-functions-law.lisp)
                # The D9 witness invokes real world functions, which Core4 does not bind itself.
                binding_args=(--binding-source lib/world.lisp)
                profile_args=(--core4-runtime);;
              tests/fixtures/wsm-fs-record-producer.lisp)
                # The F6 witness calls the real filesystem functions. Mint it
                # against the same explicit SENS sources as the canonical
                # remint lane; Core4 alone cannot bind these functions.
                binding_args=(--binding-source lib/persistent-map.lisp --binding-source lib/world.lisp --binding-source lib/content-store.lisp --binding-source lib/lisp-fs.lisp)
                profile_args=(--core4-runtime);;
              tests/semantic/unification-occurs-check-law.lisp|tests/semantic/unification-occurs-check-mutant.lisp)
                # These laws call SENS-defined unification functions; keep the
                # same explicit binding source as the canonical remint lane.
                binding_args=(--binding-source lib/unify.lisp);;
              lib/lisp-fs.lisp|lib/unify.lisp|tests/semantic/d6-derived-research-batch-01.lisp|tests/semantic/d8-rassq-until-batch.lisp|scripts/check-domain-logic-laws.lisp) profile_args=(--core4-runtime);;
            esac
            if [[ -n "$expected_error" ]]; then
              profile_args+=(--expect-error "$expected_error")
            fi
            if ! bash scripts/refresh-verified-t5m-pair.sh "$f" target/debug/sens target/debug/sens-trit "${binding_args[@]}" "${profile_args[@]}"; then
              echo "::error::LISP_TO_SENS_MINT_FAILED $f"
              fail=1
            elif [[ "$f" == "lib/core4.lisp" ]]; then
              # The compiled SENS binary embeds the Core4 T5M present at build time.
              # Refresh it now, before any changed laws run against Core4.
              echo "LISP_TO_SENS_REBUILD_CORE4_EMBEDDED"
              if ! cargo build --locked -p sens-cli --bin sens --bin sens-trit; then
                echo "::error::LISP_TO_SENS_CORE4_REBUILD_FAILED" >&2
                exit 1
              fi
            fi
          done <<< "$changed"

          exit "$fail"

      - name: Закомітити оновлені .sens
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name  "sens-mint-bot"
          git config user.email "sens-mint-bot@users.noreply.github.com"

          stage_physical_pairs() {
            # Штатний SENS/Zig карбує T5M і читабельну проєкцію разом.
            # Комітимо обидва; виправлення лише view теж має бути збережене.
            git add -A -- '*.sens'
            while IFS= read -r view; do
              [[ -f "$view.lisp" && -f "$view.sens" && ! -L "$view" ]] || continue
              git add -- "$view"
            done < <( { git -c core.quotePath=false ls-files --modified; git -c core.quotePath=false ls-files --others --exclude-standard; } | sort -u )
          }

          stage_physical_pairs
          if git diff --cached --quiet; then
            echo "LISP_TO_SENS_NO_BYTE_CHANGES"
            exit 0
          fi

          echo "LISP_TO_SENS_COMMIT:"
          git diff --cached --stat

          git commit -m "Lisp → SENS: перекарбовано змінені джерела (пуш)"

          # .sens — бінарні фізичні артефакти; їх не можна rebase/merge.
          # Якщо main випередив нас, скидаємо лише наш генерований commit,
          # перебудовуємо SENS на свіжому main і повторно mint'имо ті самі
          # джерела. Семантика та порядок байтів визначаються тільки SENS/Zig/T5M.
          # Відновлення включає й зміну тільки view, коли T5M уже актуальний.
          mapfile -t generated_sources < <(
            while IFS= read -r changed; do
              if [[ "$changed" == *.sens ]]; then
                stem="${changed%.sens}"
              else
                stem="$changed"
              fi
              [[ -f "$stem.lisp" && -f "$stem.sens" ]] && printf '%s\n' "$stem.lisp"
            done < <(git -c core.quotePath=false diff --name-only HEAD^ HEAD) | sort -u
          )
          if [[ "${#generated_sources[@]}" -eq 0 ]]; then
            echo "LISP_TO_SENS_NO_SOURCE_FOR_GENERATED_PAIRS"
            exit 1
          fi

          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main 2>/dev/null; then
              published_sha="$(git rev-parse HEAD)"
              echo "LISP_TO_SENS_PUSHED attempt=$attempt sha=$published_sha"
              # A GITHUB_TOKEN push cannot trigger ci.yml's push event. Dispatch
              # the standalone preflight on the exact generated-pair SHA.
              if ! gh workflow run release-preflight.yml --ref main \
                  -f full=true -f ref="$published_sha"; then
                echo "::error::LISP_TO_SENS_EXACT_SHA_PREFLIGHT_DISPATCH_FAILED sha=$published_sha" >&2
                exit 1
              fi
              echo "LISP_TO_SENS_PREFLIGHT_DISPATCHED sha=$published_sha"
              exit 0
            fi
            echo "LISP_TO_SENS_PUSH_RETRY attempt=$attempt (main рухається)"
            git fetch origin main
            git reset --hard origin/main
            if ! cargo build --locked -p sens-cli --bin sens --bin sens-trit; then
              echo "::error::LISP_TO_SENS_REBUILD_AFTER_RACE_FAILED attempt=$attempt"
              exit 1
            fi

            for source in "${generated_sources[@]}"; do
              [[ -f "$source" ]] || continue
              profile_args=()
              binding_args=()
              expected_error=""
              case "$source" in
                tests/integration/core1/core1-*.lisp|tests/semantic/core1-gc-reachability-laws.lisp)
                  binding_args=(--binding-source lib/core1.lisp);;
                tests/semantic/d6-compose-flip-law.lisp|tests/semantic/d6-compose-flip-laws.lisp|tests/semantic/d6-compose-flip-mutant.lisp)
                  binding_args=(--binding-source lib/core1.lisp);;
                tests/semantic/d8-core1-*.lisp|tests/semantic/d9-core1-*.lisp|tests/semantic/d10-core1-*.lisp|tests/semantic/d8-and-or-d9-fifth-laws.lisp)
                  binding_args=(--binding-source lib/core1.lisp);;
                tests/semantic/d10-core4-if-*.lisp)
                  # Core4 is the runtime profile; do not reload its root D10 definition.
                  profile_args=(--core4-runtime);;
                tests/integration/core1/reject-core1-cond-empty.lisp|tests/integration/core1/reject-core1-cond-number-zero.lisp)
                  binding_args=(--binding-source lib/core1.lisp)
                  expected_error='D4:0100 NOT requires an exact D1 PredicateBit';;
                tests/integration/core1/reject-core1-d7-as-function.lisp)
                  binding_args=(--binding-source lib/core1.lisp)
                  expected_error='D7 1100110 не має допущеного механізму виклику';;
                tests/integration/core1/reject-core1-list-as-function.lisp)
                  binding_args=(--binding-source lib/core1.lisp)
                  expected_error='D4:0000 застосувати: D7 1101100 не має допущеного механізму виклику';;
                tests/fixtures/wsm-fs-record-producer.lisp)
                  binding_args=(--binding-source lib/persistent-map.lisp --binding-source lib/world.lisp --binding-source lib/content-store.lisp --binding-source lib/lisp-fs.lisp)
                  profile_args=(--core4-runtime);;
                tests/semantic/unification-occurs-check-law.lisp|tests/semantic/unification-occurs-check-mutant.lisp)
                  binding_args=(--binding-source lib/unify.lisp);;
                lib/lisp-fs.lisp|lib/unify.lisp|tests/semantic/d6-derived-research-batch-01.lisp|tests/semantic/d8-rassq-until-batch.lisp|scripts/check-domain-logic-laws.lisp)
                  profile_args=(--core4-runtime);;
              esac
              if [[ -n "$expected_error" ]]; then
                profile_args+=(--expect-error "$expected_error")
              fi
              if ! bash scripts/refresh-verified-t5m-pair.sh "$source" target/debug/sens target/debug/sens-trit "${binding_args[@]}" "${profile_args[@]}"; then
                echo "::error::LISP_TO_SENS_REMINT_AFTER_RACE_FAILED source=$source attempt=$attempt"
                exit 1
              fi
              if [[ "$source" == "lib/core4.lisp" ]]; then
                if ! cargo build --locked -p sens-cli --bin sens --bin sens-trit; then
                  echo "::error::LISP_TO_SENS_CORE4_REBUILD_AFTER_RACE_FAILED"
                  exit 1
                fi
              fi
            done

            stage_physical_pairs
            if git diff --cached --quiet; then
              echo "LISP_TO_SENS_NO_BYTE_CHANGES_AFTER_REFRESH source_head=$(git rev-parse HEAD)"
              exit 0
            fi
            git commit -m "Lisp → SENS: перекарбовано змінені джерела (пуш)"
          done
          echo "::error::LISP_TO_SENS_PUSH_RACE after 5 remint attempts"
          exit 1
