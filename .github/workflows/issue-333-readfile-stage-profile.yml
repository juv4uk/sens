name: Issue 333 read-file stage profile

on:
  pull_request:
    paths:
      - 'scripts/profile-read-file-stages.lisp'
      - '.github/workflows/issue-333-readfile-stage-profile.yml'
      - 'lib/utf8.lisp'
      - 'lib/fs.lisp'
      - 'crates/my-lisp-host/src/lib.rs'

jobs:
  profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: issue-333-readfile-stage-profile
      - name: Build my-lisp CLI
        run: cargo build -p my-lisp-cli --bin my-lisp
      - name: Profile Lisp-owned read-file stages
        run: |
          /usr/bin/time -f 'profile_wall_seconds=%e' \
            ./target/debug/my-lisp scripts/profile-read-file-stages.lisp
