name: One-shot native-first consumer exact migration

on:
  push:
    branches: [fix/4320-native-first-consumers-exact]
    paths:
      - ".github/workflows/migrate-native-first-consumers-once.yml"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/4320-native-first-consumers-exact
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Rewrite current native-first consumers with the repository exact-domain migrator
        run: |
          cargo run --quiet -p sens-cli --bin sens-to-sens -- --exact-domain \
            lib/machine/dispatch/native-first-execute.lisp \
            tests/fixtures/native-first-totality-witness.lisp \
            tests/fixtures/native-first-coverage-ledger-witness.lisp
      - name: Prove no exact-domain rewrite remains
        run: |
          cargo run --quiet -p sens-cli --bin sens-to-sens -- --check --exact-domain \
            lib/machine/dispatch/native-first-execute.lisp \
            tests/fixtures/native-first-totality-witness.lisp \
            tests/fixtures/native-first-coverage-ledger-witness.lisp
      - name: Focused exact-domain checks
        run: |
          cargo test -p sens-cli --test active_lib_sens_completion -- --nocapture
          cargo test -p sens --test native_first_exact_domain -- --nocapture
      - name: Commit parser-aware migration only
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            lib/machine/dispatch/native-first-execute.lisp \
            tests/fixtures/native-first-totality-witness.lisp \
            tests/fixtures/native-first-coverage-ledger-witness.lisp
          if git diff --cached --quiet; then
            echo "No migration changes produced."
            exit 0
          fi
          git commit -m "fix(4320): migrate native-first current consumers to exact-domain source"
          git push origin HEAD:fix/4320-native-first-consumers-exact
