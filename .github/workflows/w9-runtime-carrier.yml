name: W9 runtime carrier

on:
  workflow_dispatch:

jobs:
  exact-w9:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Exact Bit9 and DomainIdentity carrier
        run: |
          cargo test -p sens bit9::
          cargo test -p sens domain_identity::tests::w9_
          cargo test -p sens domain_identity::tests::d9_does_not_collapse
      - name: Exact W9 source and canonical reader
        run: |
          cargo test -p sens source_words::tests::w9_
          cargo test -p sens canonical_reader::tests::w9_
      - name: Dense W9 packing
        run: |
          cargo test -p sens packed_bits::tests::w9_
          cargo test -p sens source_packing::tests::grammar_bound_w9_
      - name: Explicit W9 standalone framing
        run: |
          cargo test -p sens binary_framing::tests::d9_uses_explicit_wide_domain_extension
          cargo test -p sens binary_framing::tests::wide_domain_extension_fails_closed
      - name: W9 wire and FASL persistence
        run: cargo test -p sens syntax::wire_tests::w9_domain_identity_round_trips
      - name: D1-D9 AST and Value anti-collapse integration
        run: cargo test -p sens --test domain_ast_value_identity
      - name: Existing D3 machine witness stays on callable u8 projection
        run: cargo test -p sens --test machine_exact_d3_structural
