name: D10 Newman Knuth Bendix critical-pair confluence

on:
  push:
    paths:
      - 'knowledge/d10-critical-pairs-confluence-20261009.json'
      - 'tests/test_d10_critical_pairs_confluence.py'
      - '.github/workflows/d10-critical-pairs-confluence.yml'
  pull_request:
    paths:
      - 'knowledge/d10-critical-pairs-confluence-20261009.json'
      - 'tests/test_d10_critical_pairs_confluence.py'
      - '.github/workflows/d10-critical-pairs-confluence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finite-critical-pairs:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - name: Validate critical-pair theorem witnesses against independent exhaustive peaks
        run: python3 -m unittest discover -s tests -p 'test_d10_critical_pairs_confluence.py' -v
