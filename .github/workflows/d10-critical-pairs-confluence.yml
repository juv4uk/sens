name: D10 Newman Knuth Bendix critical-pair confluence

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finite-critical-pairs:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Validate critical-pair theorem witnesses against independent exhaustive peaks
        run: python3 -m unittest discover -s tests -p 'test_d10_critical_pairs_confluence.py' -v
