name: Current exact-domain width witness

on:
  pull_request:
    paths:
      - "lib/domains/d3.lisp"
      - "crates/sens/tests/domain_width_authority_test.rs"
      - ".github/workflows/834-semantic-coordinate-targeted.yml"

jobs:
  semantic-coordinate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check canonical domain widths (no Function8 semantics)
        run: cargo test -p sens --test domain_width_authority_test -- --nocapture
