name: #834 semantic-coordinate targeted witness

on:
  pull_request:
    paths:
      - "tests/fixtures/semantic-coordinate-law-axis-v1.lisp"
      - "crates/sens/tests/semantic_coordinate_law_axis.rs"
      - ".github/workflows/834-semantic-coordinate-targeted.yml"

jobs:
  semantic-coordinate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run bounded mathematical-law coordinate witnesses
        run: cargo test -p sens --test semantic_coordinate_law_axis -- --nocapture
