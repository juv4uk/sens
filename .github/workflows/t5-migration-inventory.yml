# КАРАНТИН (повернено 14.10.2026 після фактичної перевірки): інформативна, але
# реальності поки не відповідає — run 38564263758 червоний на кроці «Незалежний негативний свідок».
# Це реальний, названий розрив, а не анахронізм. Повторні запуски/runner заборонені.
name: КАРАНТИН — T5 migration inventory (М0)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    if: ${{ false }} # КАРАНТИН: червоний, run 38564263758
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Незалежний негативний свідок
        run: python3 scripts/test-t5-migration-inventory.py
      - name: Live-реєстр == закомічений manifest (fail-closed)
        run: python3 scripts/report_t5_migration_inventory.py --check data/t5-migration-inventory.jsonl
