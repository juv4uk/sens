name: Historical machine-block source provenance

on:
  pull_request:
    paths:
      - "lib/machine/block.lisp"
      - "tests/test_machine_block_historical_oracle.py"
      - ".github/workflows/machine-block-original-parity.yml"
  push:
    branches: [main]
    paths:
      - "lib/machine/block.lisp"
      - "tests/test_machine_block_historical_oracle.py"
      - ".github/workflows/machine-block-original-parity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  historical-source-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Незалежне історичне дослідження (без Rust семантичного оракула)
        run: python3 -m unittest discover -s tests -p test_machine_block_historical_oracle.py -v
      - name: Зафіксувати межу історичного дослідження
        run: |
          echo "Historical Python source oracle only; no current-SENS semantic parity is claimed." >> "$GITHUB_STEP_SUMMARY"
          echo "D1-D9 current semantic laws are owned by ratified domain contracts, not Rust." >> "$GITHUB_STEP_SUMMARY"
          test -z "$(git status --porcelain --untracked-files=all)"
