name: Core4 — точна міграція внутрішніх викликів

on:
  pull_request:
    branches: [main]
    paths:
      - "lib/core4.lisp"
      - "tests/test_core4_internal_sid8_migration.py"
      - ".github/workflows/core4-internal-cutover.yml"
  push:
    branches: [main]
    paths:
      - "lib/core4.lisp"
      - "tests/test_core4_internal_sid8_migration.py"
      - ".github/workflows/core4-internal-cutover.yml"

jobs:
  current-core4-internal-calls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Перевірити шість замін, цитати та негативні свідки
        run: python3 -m unittest discover -s tests -p 'test_core4_internal_sid8_migration.py' -v
      - name: Перевірити незмінність D24+ боргу Core4
        run: python3 scripts/check-core4-d24-migration.py --check
      - uses: dtolnay/rust-toolchain@stable
      - name: Перевірити точний шлях читання Core4
        run: cargo test --locked -p sens --lib mixed_source::tests::core4_source_has_no_numeric_0100_in_executable_call_head_positions
