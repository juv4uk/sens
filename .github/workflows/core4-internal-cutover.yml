name: Core4 — точна міграція внутрішніх викликів

on:
  workflow_dispatch:
jobs:
  current-core4-internal-calls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/install-zig
      - name: Перевірити 2046 residents, точні ширини та негативні свідки
        run: python3 -m unittest discover -s tests -p 'test_core4_internal_sid8_migration.py' -v
      - name: Перевірити незмінність D24+ боргу Core4
        run: python3 scripts/check-core4-d24-migration.py --check
      - name: Запобіжник проти двох відкочуваних регресій Core4 (COND/CLIPS)
        run: python3 scripts/check-core4-regressions.py --check
      - uses: dtolnay/rust-toolchain@stable
      - name: Перевірити точний шлях читання Core4
        run: cargo test --locked -p sens --lib mixed_source::tests::core4_source_has_no_numeric_0100_in_executable_call_head_positions
      - name: Точковий runtime-свідок Core4
        run: cargo test --locked -p sens --test core4_migration_point -- --nocapture
      - name: Згенерувати автентичний Core4 FASL
        run: cargo run --locked --release -p sens-cli --bin gen-fasl -- lib/core4.lisp lib/core4.lisp.fasl
      - name: Довести source/FASL parity
        run: cargo test --locked -p sens --test core_fasl_freshness -- --nocapture
      - uses: actions/upload-artifact@v4
        with:
          name: core4-fasl-${{ github.sha }}
          path: lib/core4.lisp.fasl
          if-no-files-found: error
          retention-days: 1
