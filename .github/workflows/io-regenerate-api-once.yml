name: Regenerate API discovery for D1 IO fix
on:
  push:
    branches:
      - fix/io-exact-d1-carrier-variant-20261009
    paths:
      - ".github/workflows/io-regenerate-api-once.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/io-exact-d1-carrier-variant-20261009
          persist-credentials: true
      - name: Generate API discovery from Lisp source without bypassing guard
        run: |
          python3 scripts/public_api_inventory.py --write-report
          python3 scripts/public_api_inventory.py --check
      - name: Commit the exact generated report to repair branch only
        shell: bash
        run: |
          set -euo pipefail
          git add -- docs/generated/public-api-discovery.md
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs(generated): synchronize public API inventory with current Lisp source'
          git push origin HEAD:refs/heads/fix/io-exact-d1-carrier-variant-20261009
