name: D9 geometry laws S3

on:
  pull_request:
    paths:
      - "knowledge/d9-geometry-laws-s3.json"
      - "knowledge/d9-v1-geometry-state.json"
      - "knowledge/d9-v1-semantic-inventory.json"
      - "scripts/research-d9-geometry-laws-s3.py"
      - "scripts/check-d9-geometry-laws-s3.py"
      - ".github/workflows/d9-geometry-laws-s3.yml"
  push:
    branches: [main]
    paths:
      - "knowledge/d9-geometry-laws-s3.json"
      - "scripts/research-d9-geometry-laws-s3.py"
      - "scripts/check-d9-geometry-laws-s3.py"
      - ".github/workflows/d9-geometry-laws-s3.yml"
  workflow_dispatch:

jobs:
  laws-s3:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: GPU runner identity
        run: nvidia-smi || true
      - name: Replay S3 finite witnesses
        run: python3 scripts/research-d9-geometry-laws-s3.py
      - name: Verify S3 authority boundary
        run: python3 scripts/check-d9-geometry-laws-s3.py
      - name: Verify unchanged S2 geometry
        run: python3 scripts/check-d9-geometry-s2.py
