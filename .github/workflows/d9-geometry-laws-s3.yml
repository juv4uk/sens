name: D9 geometry laws S3

on:
  workflow_dispatch:

jobs:
  laws-s3:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: GPU runner identity
        run: nvidia-smi || true
      - name: Replay S3 finite witnesses
        run: python3 scripts/research-d9-geometry-laws-s3.py
      - name: Verify S3 authority boundary
        run: python3 scripts/check-d9-geometry-laws-s3.py
      - name: Verify unchanged S2 geometry
        run: python3 scripts/check-d9-geometry-s2.py
