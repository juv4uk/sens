name: Точний D1 для індексу міркування

on:
  push:
    branches: [main]
    paths:
      - "lib/reason.lisp"
      - "crates/sens/tests/reason_index.rs"
      - "tests/semantic/reason-index-car-eq-guard-law.bits"
      - ".github/workflows/reason-index-exact-d1.yml"
  pull_request:
    paths:
      - "lib/reason.lisp"
      - "crates/sens/tests/reason_index.rs"
      - "tests/semantic/reason-index-car-eq-guard-law.bits"
      - ".github/workflows/reason-index-exact-d1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-d1-reason-index:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: "Бінарний SENS: CAR перед EQ та D1"
        run: cargo test --locked -p sens --test reason_index binary_sens_owns_reason_index_car_eq_guard_law -- --exact --nocapture
      - name: Профільні свідки й повний набір 2046 координат
        run: cargo test --locked -p sens --test reason_index -- --nocapture
