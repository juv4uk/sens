name: Точний D1 для індексу міркування

on:
  push:
    branches: [main]
    paths:
      - "lib/reason.lisp"
      - "crates/sens/tests/reason_index.rs"
      - ".github/workflows/reason-index-exact-d1.yml"
  pull_request:
    paths:
      - "lib/reason.lisp"
      - "crates/sens/tests/reason_index.rs"
      - ".github/workflows/reason-index-exact-d1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-d1-reason-index:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: "Binary SENS witness: nested rule head is not a schema tag"
        run: cargo test --locked -p sens --test reason_index binary_sens_reason_index_head_atom_witness_decides_the_law -- --exact --nocapture
      - name: "Full reason-index regression and 2046 domain coordinates"
        run: cargo test --locked -p sens --test reason_index -- --nocapture
