name: Точний D1 для індексу міркування

on:
  push:
    branches: [main]
    paths:
      - "lib/reason.lisp"
      - "crates/sens/tests/reason_index.rs"
      - ".github/workflows/reason-index-exact-d1.yml"
  pull_request:
    paths:
      - "lib/reason.lisp"
      - "crates/sens/tests/reason_index.rs"
      - ".github/workflows/reason-index-exact-d1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-d1-reason-index:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: "Exact D1: coordinate and non-atom negatives"
        run: cargo test --locked -p sens --test reason_index reason_index_predicate_returns_exact_d1_not_atom_or_legacy_boolean -- --exact --nocapture
      - name: "64 unique predicates stay indexed"
        run: cargo test --locked -p sens --test reason_index exactly_sixty_four_distinct_predicates_remain_indexed -- --exact --nocapture
      - name: "65 unique predicates fall back without numeric arithmetic"
        run: cargo test --locked -p sens --test reason_index too_many_distinct_predicates_fall_back_to_linear_mode -- --exact --nocapture
      - name: "Full index regression and all 2046 exact-width coordinates"
        run: cargo test --locked -p sens --test reason_index -- --nocapture
