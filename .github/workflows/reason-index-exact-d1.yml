name: Точний D1 для індексу міркування

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-d1-reason-index:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Профільні 6 свідків і повний набір 2046 координат
        run: cargo test --locked -p sens --test reason_index -- --nocapture
