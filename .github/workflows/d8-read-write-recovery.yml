name: D8 READ-WRITE recovery

on:
  workflow_dispatch:

jobs:
  round-trip:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Show Rust toolchain
        run: rustc --version && cargo --version
      - name: Run focused READ/WRITE witness
        run: cargo test -p sens --test d8_read_write_recovery
