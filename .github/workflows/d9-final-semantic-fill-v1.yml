name: D9 final semantic fill v1

on:
  pull_request:
    paths:
      - "lib/forward.lisp"
      - "lib/lisp-fs.lisp"
      - "lib/clips-import.lisp"
      - "lib/canon.lisp"
      - "lib/linter.lisp"
      - "lib/process.lisp"
      - "lib/tcp.lisp"
      - "knowledge/d9-final-semantic-fill-v1.json"
      - "knowledge/d9-v1-semantic-inventory.json"
      - "knowledge/d9-fill-v1-state.json"
      - "scripts/check-d9-final-semantic-fill-v1.py"
      - "scripts/check-d9-v1-semantic-inventory.py"
      - "scripts/check-d9-world-quantity-harvest-v1.py"
      - ".github/workflows/d9-final-semantic-fill-v1.yml"
  push:
    branches: [main]
    paths:
      - "knowledge/d9-final-semantic-fill-v1.json"
      - "knowledge/d9-v1-semantic-inventory.json"
      - "knowledge/d9-fill-v1-state.json"
      - "scripts/check-d9-final-semantic-fill-v1.py"
      - ".github/workflows/d9-final-semantic-fill-v1.yml"
  workflow_dispatch:

jobs:
  final-fill:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: GPU runner identity
        run: nvidia-smi || true
      - name: Verify final 137 semantic fill
        run: python3 scripts/check-d9-final-semantic-fill-v1.py
      - name: Verify complete global D9 inventory
        run: python3 scripts/check-d9-v1-semantic-inventory.py
      - name: Preserve world/quantity tranche
        run: python3 scripts/check-d9-world-quantity-harvest-v1.py
      - name: Preserve semantic-layer tranche
        run: python3 scripts/check-d9-semantic-layer-harvest-v1.py
      - name: Preserve registry-tail tranche
        run: python3 scripts/check-d9-registry-tail-v1.py
