name: LIFE-1 real spine

on:
  pull_request:
    paths:
      - ".github/workflows/life-1.yml"
      - "tests/test_life1_exact_d3_2046.py"
      - "contracts/life-1-contract.lisp"
      - "lib/bridge/prolog-to-datalog.lisp"
      - "lib/life-1-scheduler.lisp"
      - "crates/wsm-native-result-types/**"
      - "crates/wsm-prolog-kernel/**"
      - "crates/wsm-datalog-kernel/**"
      - "crates/sens/**"
      - "Cargo.toml"
      - "Cargo.lock"
  push:
    branches: [main]
    paths:
      - ".github/workflows/life-1.yml"
      - "contracts/life-1-contract.lisp"
      - "lib/bridge/prolog-to-datalog.lisp"
      - "lib/life-1-scheduler.lisp"
      - "crates/wsm-native-result-types/**"
      - "crates/wsm-prolog-kernel/**"
      - "crates/wsm-datalog-kernel/**"
      - "crates/sens/**"
      - "Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch:

jobs:
  life-1:
    name: does LIFE-1 still live?
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: life-1-real-spine

      - name: Install SWI-Prolog runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y swi-prolog-nox
          swipl --version

      - name: Всі 2046 точнодоменних координат і 6 W8 cutover
        run: python3 -m unittest discover -s tests -p test_life1_exact_d3_2046.py -v

      - name: Реальний Lisp-owned scheduler — порожні та вкладені значення
        run: cargo test --locked -p sens --test life_1_scheduler -- --nocapture

      - name: Prove the canonical real LIFE-1 spine
        run: |
          cargo test -p wsm-native-result-types --test prolog_datalog_bridge -- --nocapture
