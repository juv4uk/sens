name: TEMP verify consolidated SENS file guard

on:
  push:
    branches:
      - fix/sens-file-policy-single-owner-20261010
    paths:
      - ".github/workflows/tmp-sens-file-policy.yml"
      - ".github/workflows/important-file-guard.yml"
      - "tools/important_file_guard.py"
      - "knowledge/foreign-tools-census.lisp"
      - "knowledge/file-authority-policy.lisp"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Verify no optimization bypass and no fallback
        run: |
          set -euo pipefail
          python3 tools/important_file_guard.py --self-test
          python3 -O tools/important_file_guard.py --self-test
          base="${GITHUB_SHA}"
          base="$(git rev-parse HEAD^)"
          python3 -O tools/important_file_guard.py "$base" "$GITHUB_SHA"
