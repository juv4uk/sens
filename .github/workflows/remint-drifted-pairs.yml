name: remint-drifted-pairs

# Перемайн дрейфуючих фізичних пар .lisp<->.sens КАНОНІЧНИМ Zig/T5M.
# Використовує той самий reader/writer, що CI (scripts/refresh-verified-t5m-pair.sh),
# і комітить лише ті пари, чиї байти справді змінилися.
on:
  # Новий україномовний учасник конкурсу одразу отримує фізичну пару
  # від SENS/Zig, без ручного workflow_dispatch і зовнішнього оракула.
  push:
    paths:
      - "benchmarks/contest-uk/*.lisp"
      - "lib/list-*.lisp"
      - "lib/tree-*.lisp"
      - ".github/workflows/remint-drifted-pairs.yml"
  workflow_dispatch:
    inputs:
      files:
        description: "newline-separated .lisp sources (default: .lisp of .sens added in recent history)"
        required: false
        default: ""

permissions:
  contents: write

# GitHub за замовчуванням викидає попередній pending того самого group,
# навіть якщо cancel-in-progress: false. Черга max зберігає всі native remint.
concurrency:
  group: remint-queued-v2-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  remint:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/install-zig
      - uses: dtolnay/rust-toolchain@1.99.0

      - name: Build SENS binaries (sens + sens-trit)
        run: cargo build --locked -p sens-cli --bin sens --bin sens-trit --features benchmark-ast-visits

      - name: Remint pairs via canonical Zig T5M
        id: remint
        env:
          FILES: ${{ inputs.files }}
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -uo pipefail
          list="$FILES"
          if [[ "$EVENT_NAME" == push ]]; then
            # Лише реально додані/змінені .lisp у цьому push, не весь
            # історичний список. Видалені під час promotion не перемайнювати.
            if [[ "$BEFORE" =~ ^0+$ ]]; then
              list="$(git -c core.quotePath=false diff-tree --no-commit-id --diff-filter=AM --name-only -r HEAD -- 'benchmarks/contest-uk/*.lisp' 'lib/list-*.lisp' 'lib/tree-*.lisp')"
            else
              list="$(git -c core.quotePath=false diff --diff-filter=AM --name-only "$BEFORE" "$AFTER" -- 'benchmarks/contest-uk/*.lisp' 'lib/list-*.lisp' 'lib/tree-*.lisp')"
            fi
            # Не втрачати непарні програми після скасованого queued run.
            # Змінений конкурсний .lisp уже є у git diff вище, навіть якщо
            # стара .sens ще існує. Не перемайнювати незмінені повні трійки
            # при кожному незалежному push: це відтягує обернення нових Lisp.
            # Джерело без .sens або view залишається в черзі; нативний
            # суддя як і раніше відхиляє drift та хибне виконання.
            for source in benchmarks/contest-uk/*.lisp lib/list-*.lisp lib/tree-*.lisp; do
              [[ -f "$source" && ! -L "$source" ]] || continue
              pair="${source%.lisp}.sens"
              view="${source%.lisp}"
              [[ ! -f "$pair" || -L "$pair" || ! -f "$view" || -L "$view" ]] || continue
              if ! printf '%s\n' "$list" | grep -Fxq -- "$source"; then
                list="$(printf '%s\n%s' "$list" "$source")"
              fi
            done
          fi
          if [ -z "$list" ] && [[ "$EVENT_NAME" != push ]]; then
            if [ -f scripts/remint-drifted-pairs.txt ]; then
              list="$(grep -vE '^[[:space:]]*(#|$)' scripts/remint-drifted-pairs.txt)"
            else
              list="$(git log --diff-filter=A --name-only -n 600 -- '*.sens' | grep '\.sens$' | sed 's/\.sens$/.lisp/' | sort -u)"
            fi
          fi
          # Судити конкурс лише після конкурсанта, не кожного lib/list/tree.
          # Факт категорії визначає реальний змінений/непарний шлях, не JSON.
          if printf '%s\n' "$list" | grep -Eq '^benchmarks/contest-uk/[^[:space:]]+\.lisp$'; then
            echo "contest=true" >> "$GITHUB_OUTPUT"
          else
            echo "contest=false" >> "$GITHUB_OUTPUT"
          fi
          echo "candidates:"; printf '%s\n' "$list" | sed '/^$/d' | wc -l
          # Журнал тільки справді виконаних нативних джерел переживе
          # перемикання ephemeral checkout на свіжий main у кроці публікації.
          : > "$RUNNER_TEMP/sens-remint-success.txt"
          ok=0; skip=0
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            if [ ! -f "$f" ]; then
              # Переможець вже фізично перенесений до історії конкурсу.
              # Це не зламана SENS-програма й не причина губити успішні mint.
              case "$f" in
                benchmarks/contest-uk/*.lisp)
                  old="benchmarks/contest-uk/superseded/${f##*/}"
                  if [[ -f "$old" && ! -L "$old" ]]; then
                    echo "MOVED_TO_SUPERSEDED $f -> $old"
                    continue
                  fi;;
              esac
              echo "MISSING $f"; skip=$((skip+1)); continue
            fi
            # Пари може ще не бути — refresh створює її канонічно (mint + view).
            bs=()
            case "$f" in
              lib/reason.lisp|lib/forward.lisp) bs=(--binding-source lib/unify.lisp);;
              lib/narrate.lisp) bs=(--binding-source lib/unify.lisp --binding-source lib/reason.lisp);;
              lib/result-status.lisp) bs=(--binding-source lib/unify.lisp --binding-source lib/knowledge.lisp --binding-source lib/reason.lisp);;
              lib/translation.lisp) bs=(--binding-source lib/unify.lisp --binding-source lib/knowledge.lisp --binding-source lib/reason.lisp --binding-source lib/world.lisp --binding-source lib/yantra.lisp --binding-source lib/result-status.lisp);;
              tests/fixtures/mechanism-selector-1047-witness.lisp) bs=(--binding-source lib/surface/semantic-registry-api.lisp --binding-source lib/mechanism-selector.lisp);;
              tests/semantic/d9-world-shape-module-events-laws.lisp|tests/semantic/world-exact-arity-witness.lisp) bs=(--binding-source lib/world.lisp);;
            esac
            if bash scripts/refresh-verified-t5m-pair.sh "$f" target/debug/sens target/debug/sens-trit "${bs[@]}"; then
              ok=$((ok+1))
              printf '%s\n' "$f" >> "$RUNNER_TEMP/sens-remint-success.txt"
            else
              echo "SKIP_FAIL $f"; skip=$((skip+1))
              if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
                printf -- '- SKIP_FAIL `%s`\n' "$f" >> "$GITHUB_STEP_SUMMARY"
              fi
            fi
          done <<< "$list"
          echo "remint done ok=$ok skip=$skip"
          if (( skip != 0 )); then
            echo "failed=true" >> "$GITHUB_OUTPUT"
            echo "::error::Нативний SENS/Zig відхилив $skip конкретних джерел; успішні фізичні пари все одно буде опубліковано" >&2
          else
            echo "failed=false" >> "$GITHUB_OUTPUT"
          fi

      # RED одного кандидата не затримує конкурс уже доведених трійок.
      # Наприкінці workflow справжня відмова mint лишається червоною.
      - name: Нативне суддівство і просування справжніх переможців
        id: contest_judge
        if: github.event_name == 'push' && steps.remint.outputs.contest == 'true'
        run: bash benchmarks/contest-uk/promote.sh

      - name: Commit refreshed pairs (only real byte changes)
        # Застарілий queued job не має права накочувати старий коміт через
        # git pull --rebase: при конкурентних авторах конфлікт втрачає
        # справді виконані Zig/SENS пари. Переобчислюємо їх на новому HEAD.
        if: ${{ !cancelled() && steps.remint.outcome == 'success' }}
        env:
          CONTEST_JUDGE_OUTCOME: ${{ steps.contest_judge.outcome }}
        run: |
          set -euo pipefail
          git config user.name "sens-remint-bot"
          git config user.email "sens-remint-bot@users.noreply.github.com"
          prune_archived_duplicates() {
            local physical stem archive
            for physical in benchmarks/contest-uk/*.sens; do
              [[ -f "$physical" && ! -L "$physical" ]] || continue
              stem="${physical%.sens}"
              [[ ! -e "$stem.lisp" && ! -L "$stem.lisp" ]] || continue
              archive="benchmarks/contest-uk/superseded/${stem##*/}"
              if [[ -f "$stem" && ! -L "$stem" &&
                    -f "$archive.lisp" && ! -L "$archive.lisp" &&
                    -f "$archive.sens" && ! -L "$archive.sens" &&
                    -f "$archive" && ! -L "$archive" ]] &&
                 cmp -s "$physical" "$archive.sens" &&
                 cmp -s "$stem" "$archive"; then
                rm -- "$physical" "$stem"
                echo "REMINT_PRUNED_ARCHIVED_DUPLICATE stem=$stem exact_blobs=YES"
              fi
            done
          }
          # На першому checkout уже перевірено конкретний набір; порожнє
          # оновлення не потребує ані перепакування, ані нового коміту.
          prune_archived_duplicates
          git add -A
          if git diff --cached --quiet; then
            echo "REMINT_NO_BYTE_CHANGE"
            exit 0
          fi

          published=0
          for attempt in 1 2 3 4 5 6; do
            # Працюємо ТІЛЬКИ в одноразовому Actions checkout. Нічого
            # не переписуємо в remote й не використовуємо force-push.
            # Старі локальні згенеровані байти навмисне викидаються:
            # їх НЕ можна безпечно rebase-ити на нове джерело.
            git fetch origin main
            git reset --hard origin/main
            cargo build --locked -p sens-cli --bin sens --bin sens-trit --features benchmark-ast-visits
            count=0
            while IFS= read -r f; do
              [[ -n "$f" ]] || continue
              if [[ ! -f "$f" || -L "$f" ]]; then
                case "$f" in
                  benchmarks/contest-uk/*.lisp)
                    old="benchmarks/contest-uk/superseded/${f##*/}"
                    if [[ -f "$old" && ! -L "$old" ]]; then
                      echo "REMINT_ALREADY_SUPERSEDED source=$f"
                      continue
                    fi;;
                esac
                echo "REMINT_SOURCE_NO_LONGER_ACTIVE source=$f"
                continue
              fi
              # Рівно ті самі правила імпортованих українських DEFINE,
              # що й у першому проході, але на актуальному вмісті main.
              bs=()
              case "$f" in
                lib/reason.lisp|lib/forward.lisp) bs=(--binding-source lib/unify.lisp);;
                lib/narrate.lisp) bs=(--binding-source lib/unify.lisp --binding-source lib/reason.lisp);;
                lib/result-status.lisp) bs=(--binding-source lib/unify.lisp --binding-source lib/knowledge.lisp --binding-source lib/reason.lisp);;
                lib/translation.lisp) bs=(--binding-source lib/unify.lisp --binding-source lib/knowledge.lisp --binding-source lib/reason.lisp --binding-source lib/world.lisp --binding-source lib/yantra.lisp --binding-source lib/result-status.lisp);;
                tests/fixtures/mechanism-selector-1047-witness.lisp) bs=(--binding-source lib/surface/semantic-registry-api.lisp --binding-source lib/mechanism-selector.lisp);;
                tests/semantic/d9-world-shape-module-events-laws.lisp|tests/semantic/world-exact-arity-witness.lisp) bs=(--binding-source lib/world.lisp);;
              esac
              bash scripts/refresh-verified-t5m-pair.sh "$f" target/debug/sens target/debug/sens-trit "${bs[@]}"
              count=$((count+1))
            done < "$RUNNER_TEMP/sens-remint-success.txt"
            # Переможців після зміни HEAD визначає лише нове нативне
            # виконання. Якщо перший суд уже впав, не ховаємо цей RED.
            if [[ "$CONTEST_JUDGE_OUTCOME" == success ]]; then
              bash benchmarks/contest-uk/promote.sh
            fi
            prune_archived_duplicates
            git add -A
            if git diff --cached --quiet; then
              echo "REMINT_ALREADY_PRESENT_ON_MAIN native_rechecked=$count"
              published=1
              break
            fi
            git commit -m "ремонт пар: SENS/Zig T5M на актуальному main, без конфліктного rebase"
            if git push origin HEAD:main; then
              echo "REMINT_PUBLISHED attempt=$attempt native_rechecked=$count"
              published=1
              break
            fi
            echo "REMINT_MAIN_ADVANCED attempt=$attempt: повторити нативний доказ на новому HEAD" >&2
          done
          if (( published == 0 )); then
            echo "::error::Точний main рухається; нативний результат не опубліковано, без force-push" >&2
            exit 1
          fi

      # Не оголошувати GREEN, коли SENS відхилив джерело; але не губити
      # незалежні вже доведені Zig/T5M пари через одного конкурсанта.
      - name: Зафіксувати адресні відмови після публікації справних пар
        if: steps.remint.outputs.failed == 'true'
        run: |
          echo "::error::SENS native mint має адресні RED; справні трійки збережено" >&2
          exit 1
