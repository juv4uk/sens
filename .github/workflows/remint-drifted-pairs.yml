name: remint-drifted-pairs

# Перемайн дрейфуючих фізичних пар .lisp<->.sens КАНОНІЧНИМ Zig/T5M.
# Використовує той самий reader/writer, що CI (scripts/refresh-verified-t5m-pair.sh),
# і комітить лише ті пари, чиї байти справді змінилися.
on:
  # Незалежна вузька доріжка: тільки зміна цього workflow з маркером
  # F6_PRODUCER_REMINT може відновити stale F6-пару без cancellation
  # батьківського CI під час паралельних push.
  push:
    branches: [main]
    paths:
      - ".github/workflows/remint-drifted-pairs.yml"
      - "lib/lisp-fs.lisp"
      - "tests/fixtures/wsm-fs-record-producer.lisp"
  workflow_call:
    inputs:
      files:
        description: "newline-separated .lisp sources"
        required: false
        type: string
        default: ""
    outputs:
      published_sha:
        description: "Точний SHA перевірених джерела й фізичних пар після remint"
        value: ${{ jobs.remint.outputs.published_sha }}
  workflow_dispatch:
    inputs:
      files:
        description: "newline-separated .lisp sources (default: .lisp of .sens added in recent history)"
        required: false
        default: ""

# Serialize both pair-writing lanes (lightweight changed-source mint and heavy drift recovery).
# Concurrent writers can otherwise race on the same .sens blob and fail rebase.
# ВЛАСНА група, не спільна з lisp-to-sens-on-push.
# Причина: у спільній групі `cancel-in-progress: true` пуш-карбування
# СКАСОВУВАЛО явний remint (прогін 0509d0c4 → completed/skipped).
# Явний remint ручний і не має гинути від чужого пушу — тому своя група
# і false (він не скасовує себе).
concurrency:
  group: sens-explicit-remint
  cancel-in-progress: false
  queue: max

permissions:
  contents: write

# Кожен push зберігає власний доказовий запуск. Не скасовувати старі
# remint-запуски через наступний push; вони можуть бути потрібні для
# фізичного відновлення конкретної пари.

jobs:
  remint:
    # У звичайному CI caller-owned запуску лишаємо наявну логіку.
    # Прямий push у цей файл є лише аварійним target remint і вимагає маркера.
    if: ${{ github.event_name == 'workflow_dispatch' || github.workflow != 'remint-drifted-pairs' || contains(github.event.head_commit.message, 'F6_PRODUCER_REMINT') || contains(github.event.head_commit.message, 'SENS_REMINT_F6_KEY_CANON') || contains(github.event.head_commit.message, 'COMPILER_NUCLEUS_REMINT') }}
    outputs:
      published_sha: ${{ steps.published_pairs.outputs.published_sha }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/install-zig
      - uses: dtolnay/rust-toolchain@1.99.0

      - name: Build SENS binaries (sens + sens-trit)
        run: cargo build --locked -p sens-cli --bin sens --bin sens-trit --bin lisp-data-schema-guard --features benchmark-ast-visits

      - name: Канонічні D24 корені для фізичного вектора
        run: |
          awk '
            /^\(визначити число-нуль 0\)$/ { zero++; print; next }
            /^\(визначити число-один 1\)$/ { one++; print; next }
            END { if (zero != 1 || one != 1) exit 2 }
          ' lib/core4-parts/core4-language.lisp > "$RUNNER_TEMP/sens-core4-d24-roots.lisp"

      - name: Remint pairs via canonical Zig T5M
        id: remint
        env:
          FILES: ${{ inputs.files }}
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -uo pipefail
          list="$FILES"
          if [[ "$EVENT_NAME" == push ]]; then
            # Лише реально додані/змінені .lisp у цьому push, не весь
            # історичний список. Видалені під час promotion не перемайнювати.
            if [[ "$BEFORE" =~ ^0+$ ]]; then
              list="$(git -c core.quotePath=false diff-tree --no-commit-id --diff-filter=AM --name-only -r HEAD -- 'benchmarks/contest-uk/*.lisp'  ':(top,glob)lib/*.lisp' 'lib/core*.lisp' 'lib/list-*.lisp' 'lib/interleave-pairs.lisp' 'lib/tree-*.lisp' 'lib/d11-*.lisp' 'lib/meta-eval-first-class.lisp' 'tests/semantic/*.lisp' 'lib/reverse-three.lisp' 'lib/axioms-d1-principle-five.lisp' 'lib/life-1-scheduler.lisp' 'lib/lisp-fs.lisp' 'lib/world.lisp' 'lib/reason.lisp' 'lib/forward.lisp' 'lib/knowledge.lisp' 'lib/unify.lisp' 'lib/clips-import.lisp' 'lib/yantra.lisp' 'lib/machine/projection/x86-64.lisp' 'lib/machine/lowering/semantic-x86-64.lisp' ':(exclude)lib/core2.lisp' ':(exclude)lib/core-math.lisp' ':(exclude)tests/semantic/meta-fc-predicates-d1-mutant.lisp')"
            else
              list="$(git -c core.quotePath=false diff --diff-filter=AM --name-only "$BEFORE" "$AFTER" -- 'benchmarks/contest-uk/*.lisp'  ':(top,glob)lib/*.lisp' 'lib/core*.lisp' 'lib/list-*.lisp' 'lib/interleave-pairs.lisp' 'lib/tree-*.lisp' 'lib/d11-*.lisp' 'lib/meta-eval-first-class.lisp' 'tests/semantic/*.lisp' 'lib/reverse-three.lisp' 'lib/axioms-d1-principle-five.lisp' 'lib/life-1-scheduler.lisp' 'lib/lisp-fs.lisp' 'lib/world.lisp' 'lib/reason.lisp' 'lib/forward.lisp' 'lib/knowledge.lisp' 'lib/unify.lisp' 'lib/clips-import.lisp' 'lib/yantra.lisp' 'lib/machine/projection/x86-64.lisp' 'lib/machine/lowering/semantic-x86-64.lisp' ':(exclude)lib/core2.lisp' ':(exclude)lib/core-math.lisp' ':(exclude)tests/semantic/meta-fc-predicates-d1-mutant.lisp')"
            fi
            # Обʼєднати точну push-різницю зі списком, отриманим від CI-вибору.
            # Жодне джерело з вхідного маніфесту не губиться через повторний diff.
            # Close the non-Core4 pair-drift gap: also include every changed
            # Lisp source that already has a committed physical T5M + view,
            # regardless of which historical pathspec originally selected it.
            # Added/modified only: deleting a source must not mint it back.
            if [[ "$BEFORE" =~ ^0+$ ]]; then
              all_changed_lisp_sources="$(git -c core.quotePath=false diff-tree --no-commit-id --diff-filter=AM --name-only -r HEAD -- '*.lisp')"
            else
              all_changed_lisp_sources="$(git -c core.quotePath=false diff --diff-filter=AM --name-only "$BEFORE" "$AFTER" -- '*.lisp')"
            fi
            while IFS= read -r source; do
              [[ -n "$source" && -f "$source" && ! -L "$source" ]] || continue
              case "$source" in
                lib/core2.lisp|lib/core-math.lisp|lib/core4.lisp|lib/yantra.lisp) continue ;;
              esac
              pair="${source%.lisp}.sens"
              view="${source%.lisp}"
              [[ -s "$pair" && -f "$view" && ! -L "$pair" && ! -L "$view" ]] || continue
              if ! printf '%s\n' "$list" | grep -Fxq -- "$source"; then
                list="$(printf '%s\n%s' "$list" "$source")"
                echo "REMINT_PAIRED_SOURCE_CHANGED source=$source"
              fi
            done <<< "$all_changed_lisp_sources"
            # Зміна самого SENS-нижувача потребує перевірки його
            # СПОЖИВАЧА навіть коли вихідний свідок і байти ще не змінювались.
            # Не намагатись виконати бібліотеку як невідомий текстовий виклик.
            if [[ "$BEFORE" =~ ^0+$ ]]; then
              island_change="$(git -c core.quotePath=false diff-tree --no-commit-id --name-only -r HEAD -- lib/island-lowering.lisp)"
            else
              island_change="$(git -c core.quotePath=false diff --name-only "$BEFORE" "$AFTER" -- lib/island-lowering.lisp)"
            fi
            if [[ -n "$island_change" ]] &&
               ! printf '%s\n' "$list" | grep -Fxq 'tests/fixtures/island-lowering-1048-witness.lisp'; then
              list="$(printf '%s\n%s' "$list" 'tests/fixtures/island-lowering-1048-witness.lisp')"
              echo "REMINT_ISLAND_BINDING_CHANGED test=tests/fixtures/island-lowering-1048-witness.lisp"
            fi
            # Закон першокласного предиката залежить від реального D11 DEFINE.
            # Зміна бібліотеки повинна перемайнити і фізичного споживача.
            if [[ "$BEFORE" =~ ^0+$ ]]; then
              meta_eval_change="$(git -c core.quotePath=false diff-tree --no-commit-id --name-only -r HEAD -- lib/meta-eval-first-class.lisp)"
            else
              meta_eval_change="$(git -c core.quotePath=false diff --name-only "$BEFORE" "$AFTER" -- lib/meta-eval-first-class.lisp)"
            fi
            if [[ -n "$meta_eval_change" ]] &&
               ! printf '%s\n' "$list" | grep -Fxq 'tests/semantic/meta-fc-predicates-d1-law.lisp'; then
              list="$(printf '%s\n%s' "$list" 'tests/semantic/meta-fc-predicates-d1-law.lisp')"
              echo "REMINT_D11_BINDING_CHANGED source=lib/meta-eval-first-class.lisp test=tests/semantic/meta-fc-predicates-d1-law.lisp"
            fi
            # Core1 — справжній власник обходу графа; GC-свідок залежить
            # від його DEFINE, хоч фізичний .sens-супутник ще існує.
            if [[ "$BEFORE" =~ ^0+$ ]]; then
              core1_change="$(git -c core.quotePath=false diff-tree --no-commit-id --name-only -r HEAD -- lib/core1.lisp)"
            else
              core1_change="$(git -c core.quotePath=false diff --name-only "$BEFORE" "$AFTER" -- lib/core1.lisp)"
            fi
            if [[ -n "$core1_change" ]] &&
               ! printf '%s\n' "$list" | grep -Fxq 'tests/semantic/core1-gc-reachability-laws.lisp'; then
              list="$(printf '%s\n%s' "$list" 'tests/semantic/core1-gc-reachability-laws.lisp')"
              echo "REMINT_CORE1_BINDING_CHANGED source=lib/core1.lisp test=tests/semantic/core1-gc-reachability-laws.lisp"
            fi
            # Не передавати нативному mint незмінні описи принципів:
            # core2 і core-math складаються тільки з коментарів, не є програмами.
            # Git pathspec виключає їх з push-дифа, а реальні core1/core3/core4
            # залишає без змін для предметного нативного виконання.
            # Універсальний diff нижче як і раніше бере реальну зміну core4.
            # Але Core2 є описом профілю, а Core4 без пари не повинен
            # повторно ламати кожен незалежний запуск remint.
            # Янтра має окремий реальний RED: рядки зовнішнього формату
            # ще не проходять точну D7-проєкцію. Не перезапускати її на
            # кожен сторонній push, але зміну самої yantra.lisp з push diff
            # завжди передавати в нативний remint і зберігати її RED.
            # F6_PRODUCER_REMINT у точному push-коміті адресує
            # фізичного producer навіть тоді, коли змінено тільки workflow.
            # Інакше джерел push = 0, а P0 витісняє випадковий backlog.
            if git show -s --format=%B "$AFTER" | grep -Fq 'F6_PRODUCER_REMINT'; then
              list="$(printf '%s\n%s' "$list" 'tests/fixtures/wsm-fs-record-producer.lisp')"
              echo "REMINT_F6_PRODUCER_TARGET source=tests/fixtures/wsm-fs-record-producer.lisp"
            fi
            # Релізна трійка ядра компілятора не повинна чекати позаду backlog:
            # точний маркер push ставить єдине чинне SENS-джерело в пріоритет.
            if git show -s --format=%B "$AFTER" | grep -Fq 'COMPILER_NUCLEUS_REMINT'; then
              list="$(printf '%s\n%s' "$list" 'lib/compiler-nucleus.lisp')"
              echo "REMINT_COMPILER_NUCLEUS_TARGET source=lib/compiler-nucleus.lisp"
            fi
            # Зберігати точні джерела push, а не тільки їхню кількість:
            # подальше впорядкування непарних трійок змінює позиції.
            declare -A push_changed_sources=()
            while IFS= read -r changed; do
              [[ -n "$changed" ]] || continue
              push_changed_sources["$changed"]=1
            done <<< "$list"
            # Не втрачати непарні програми після скасованого queued run.
            # Змінений конкурсний .lisp уже є у git diff вище, навіть якщо
            # стара .sens ще існує. Не перемайнювати незмінені повні трійки
            # при кожному незалежному push: це відтягує обернення нових Lisp.
            # Джерело без .sens або view залишається в черзі; нативний
            # суддя як і раніше відхиляє drift та хибне виконання.
            for source in benchmarks/contest-uk/*.lisp lib/*.lisp tests/semantic/d9-string-append-physical.lisp tests/semantic/core1-gc-reachability-laws.lisp tests/semantic/біджа3-уточнення-атома-1968.lisp tests/semantic/meta-fc-predicates-d1-law.lisp tests/semantic/repl-uk-queue-law.lisp tests/semantic/repl-uk-queue-mutant.lisp lib/machine/projection/x86-64.lisp lib/machine/lowering/semantic-x86-64.lisp; do
              [[ -f "$source" && ! -L "$source" ]] || continue
              # Після скасованого remint відновлювати всі непарні кореневі
              # виконувані Lisp, не тільки старий вручну заданий перелік.
              # Дані/опис профілю та окремо діагностовані Core4/Янтра
              # перевіряються на власну зміну, але не кожним чужим push.
              case "$source" in
                lib/core2.lisp|lib/core-math.lisp|lib/core4.lisp|lib/yantra.lisp) continue ;;
              esac
              pair="${source%.lisp}.sens"
              view="${source%.lisp}"
              [[ ! -f "$pair" || -L "$pair" || ! -f "$view" || -L "$view" ]] || continue
              if ! printf '%s\n' "$list" | grep -Fxq -- "$source"; then
                list="$(printf '%s\n%s' "$list" "$source")"
              fi
            done
            # Git визначає лише джерела для повторного рідного mint.
            # Не плутати цей список із доказом оборотності чи виконання.
            # Повертаємо не лише конкурс, а й D11/list/tree, коли
            # проміжний queued push було замінено найновішим.
            if [[ "$EVENT_NAME" == push ]]; then
              for source in benchmarks/contest-uk/*.lisp tests/fixtures/wsm-fs-record-producer.lisp lib/core1.lisp lib/core3.lisp lib/list-*.lisp lib/*-д1.lisp lib/викликати-доменний-код.lisp lib/застосувати-ланцюг-доменних-функцій.lisp lib/повторити-доменну-функцію.lisp lib/narrate.lisp lib/interleave-pairs.lisp lib/tree-*.lisp lib/d11-*.lisp lib/meta-eval-first-class.lisp lib/compiler-nucleus.lisp tests/semantic/d9-string-append-physical.lisp tests/semantic/core1-gc-reachability-laws.lisp tests/semantic/біджа3-уточнення-атома-1968.lisp tests/semantic/meta-fc-predicates-d1-law.lisp tests/semantic/repl-uk-queue-law.lisp tests/semantic/repl-uk-queue-mutant.lisp lib/reverse-three.lisp lib/axioms-d1-principle-five.lisp lib/life-1-scheduler.lisp lib/lisp-fs.lisp lib/world.lisp lib/reason.lisp lib/forward.lisp lib/knowledge.lisp lib/unify.lisp lib/clips-import.lisp lib/machine/projection/x86-64.lisp lib/machine/lowering/semantic-x86-64.lisp; do
                [[ -f "$source" && ! -L "$source" ]] || continue
                pair="${source%.lisp}.sens"
                view="${source%.lisp}"
                [[ -s "$pair" && -f "$view" && ! -L "$pair" && ! -L "$view" ]] || continue
                source_commit="$(git log -1 --format=%H -- "$source")"
                pair_commit="$(git log -1 --format=%H -- "$pair")"
                if [[ -n "$source_commit" && -n "$pair_commit" ]] &&
                   ! git merge-base --is-ancestor "$source_commit" "$pair_commit"; then
                  if ! printf '%s\n' "$list" | grep -Fxq -- "$source"; then
                    list="$(printf '%s\n%s' "$list" "$source")"
                    echo "REMINT_SOURCE_NEWER_THAN_PAIR source=$source"
                  fi
                fi
              done
            fi
          fi
          # Не судити за git-дата/наявністю файла: точний T5M визначають
          # тільки чинний SENS mint та Zig view. Перевірити кожну
          # активну конкурсну трійку (в т. ч. незмінений НСД), щоб
          # пропущений дрейф негайно став кандидатом на справжній remint.
          if [[ "$EVENT_NAME" == push ]]; then
            for source in benchmarks/contest-uk/*.lisp tests/semantic/meta-fc-predicates-d1-law.lisp lib/axioms-d1-principle-five.lisp lib/machine/lowering/semantic-x86-64.lisp; do
              [[ -f "$source" && ! -L "$source" ]] || continue
              if printf '%s\n' "$list" | grep -Fxq -- "$source"; then
                continue
              fi
              pair="${source%.lisp}.sens"
              view="${source%.lisp}"
              [[ -s "$pair" && -f "$view" && ! -L "$pair" && ! -L "$view" ]] || continue
              # CLI SENS допускає ціль ЛИШЕ *.sens; mktemp без суфікса
              # завжди давав помилковий RED для кожного справного Lisp.
              probe_dir="$(mktemp -d "$RUNNER_TEMP/sens-native-mint.XXXXXX")"
              probe="$probe_dir/program.sens"
              drift=0
              if [[ "$source" == tests/semantic/meta-fc-predicates-d1-law.lisp ]]; then
                # Д11 DEFINE існує у власному SENS Lisp, не в host-регулярці.
                # Для чесного drift-probe використовуємо ТОЙ САМИЙ native
                # binding-source, що в позитивному парному eval.
                if ! target/debug/sens --t5m-mint-pair "$source" "$probe" --binding-source lib/meta-eval-first-class.lisp >/dev/null; then
                  echo "REMINT_MINT_PROBE_RED source=$source binding=lib/meta-eval-first-class.lisp"
                  drift=1
                fi
              elif ! target/debug/sens --t5m-mint "$source" "$probe" >/dev/null; then
                echo "REMINT_MINT_PROBE_RED source=$source"
                drift=1
              fi
              if (( ! drift )) && ! cmp -s "$probe" "$pair"; then
                echo "REMINT_PHYSICAL_DRIFT source=$source"
                drift=1
              elif (( ! drift )) && ! target/debug/sens-trit view "$pair" | cmp -s - "$view"; then
                echo "REMINT_VIEW_DRIFT source=$source"
                drift=1
              fi
              rm -rf -- "$probe_dir"
              if (( drift )); then
                list="$(printf '%s\n%s' "$list" "$source")"
              fi
            done
          fi
          # Розширюємо чергу на відсутні семантичні свідки.
          # Очікувані Type/ділення-на-нуль проходять окремий негативний маршрут,
          # тому не можна віддавати їх звичайному успішному remint.
          if [[ "$EVENT_NAME" == push ]]; then
            for source in tests/semantic/*.lisp; do
              [[ -f "$source" && ! -L "$source" ]] || continue
              case "$source" in
                tests/semantic/*-type-negative.lisp|\
                tests/semantic/*-improper-*-negative.lisp|\
                tests/semantic/*-improper-tail-negative.lisp|\
                tests/semantic/d24-reader-zero-denominator-negative.lisp|\
                tests/semantic/meta-fc-predicates-d1-mutant.lisp)
                  continue ;;
              esac
              pair="${source%.lisp}.sens"
              view="${source%.lisp}"
              # Лише реально відсутня фізична трійка; готові пари не перемайнюємо
              # тут навмання — зміна джерела вже входить у Git-diff вище.
              if [[ -s "$pair" && -f "$view" && ! -L "$pair" && ! -L "$view" ]]; then
                continue
              fi
              if ! printf '%s\n' "$list" | grep -Fxq -- "$source"; then
                list="$(printf '%s\n%s' "$list" "$source")"
                echo "REMINT_SEMANTIC_TRIPLET_PENDING source=$source"
              fi
            done
          fi
          if [ -z "$list" ] && [[ "$EVENT_NAME" != push ]]; then
            if [ -f scripts/remint-drifted-pairs.txt ]; then
              list="$(grep -vE '^[[:space:]]*(#|$)' scripts/remint-drifted-pairs.txt)"
            else
              list="$(git log --diff-filter=A --name-only -n 600 -- '*.sens' | grep '\.sens$' | sed 's/\.sens$/.lisp/' | sort -u)"
            fi
          fi
          # Початковий native mint також має бути коротким: сотні повних
          # SENS/Zig перевірок раніше не встигали опублікуватись до нового push.
          # Непарні українські програми мають пріоритет у ліміті 24:
          # інакше десятки старих drift-джерел витісняють кожну нову.
          # Це тільки порядок native mint, НЕ мовний закон і НЕ PASS.
          if [[ "$EVENT_NAME" == push ]]; then
            # У попередній черзі pending-first переставляв кандидати з
            # актуального push ПІСЛЯ історичних непарних Lisp; водночас
            # priority_slots рахував старий порядок. Через це реальні зміни
            # нового SHA голодували навіть за вільних слотів.
            # Git визначає чергу, лише native SENS/Zig підтверджує програму.
            changed_sources=()
            pending_sources=()
            other_sources=()
            declare -A queued_sources=()
            while IFS= read -r source; do
              [[ -n "$source" ]] || continue
              if [[ -z "${queued_sources[$source]+seen}" ]]; then
                queued_sources["$source"]=1
                stem="${source%.lisp}"
                # Пріоритет визначає ТОЧНА множина push, а не позиція
                # у черзі чи неоголошений лічильник priority_count.
                if [[ -n "${push_changed_sources[$source]+seen}" ]]; then
                  changed_sources+=("$source")
                elif [[ "$source" == *.lisp && -f "$source" && ! -L "$source" &&
                        ( ! -s "$stem.sens" || ! -f "$stem" ) ]]; then
                  pending_sources+=("$source")
                else
                  other_sources+=("$source")
                fi
              fi
            done <<< "$list"
            list="$(printf '%s\n' "${changed_sources[@]}" "${pending_sources[@]}" "${other_sources[@]}")"
            echo "REMINT_PUSH_FIRST sources=${#changed_sources[@]} unpaired=${#pending_sources[@]} native=SENS_ZIG"
          fi
          # Reusable workflow отримує точний список від ci.yml.
          # Push-диф не повинен стирати явно замовлений нативний remint;
          # ці джерела мають пріоритет над історичним backlog.
          if [[ -n "$FILES" ]]; then
            while IFS= read -r requested; do
              [[ -n "$requested" ]] || continue
              if [[ "$requested" != *.lisp || ! -f "$requested" || -L "$requested" ]]; then
                echo "::error::REMINT_REQUESTED_SOURCE_INVALID source=$requested" >&2
                exit 2
              fi
              if [[ "$EVENT_NAME" == push ]]; then
                push_changed_sources["$requested"]=1
              fi
            done <<< "$FILES"
            # Явна область reusable-job є ЗАКРИТИМ набором кандидатів.
            # Інакше 2 F6/Core4 джерела змішуються з сотнями старих
            # непарних тестів і чужі RED зривають перевірку цих 2 пар.
            # Відкритий backlog НЕ стає PASS: окремий census після
            # remint і загальний release gate залишаються чинними.
            list="$(printf '%s\n' "$FILES" | awk 'NF && !seen[$0]++')"
            echo "REMINT_REQUESTED_NATIVE_SOURCES validated=yes scope=exact-caller-manifest backlog=separate-census"
          fi
          # Незавершений хвіст — PENDING, не виданий за PASS чи реліз.
          list="$(printf '%s\n' "$list" | sed '/^$/d')"
          initial_total="$(printf '%s\n' "$list" | sed '/^$/d' | wc -l)"
          if [[ "$EVENT_NAME" == push ]] && (( initial_total > 24 )); then
            # Нові зміни не витісняються старою алфавітною чергою;
            # далі — спершу непарні Lisp, потім дрейф фізичних трійок.
            # Переповнені черги обходимо циклічно, без фальшивого PASS.
            changed_batch=()
            backlog_batch=()
            while IFS= read -r candidate; do
              [[ -n "$candidate" ]] || continue
              if [[ -n "${push_changed_sources[$candidate]+seen}" ]]; then
                changed_batch+=("$candidate")
              else
                backlog_batch+=("$candidate")
              fi
            done <<< "$list"
            run_number=${GITHUB_RUN_NUMBER:-1}
            priority_slots=$(( ${#changed_batch[@]} < 24 ? ${#changed_batch[@]} : 24 ))
            backlog_slots=$(( 24 - priority_slots ))
            selected_sources=()
            if (( priority_slots > 0 )); then
              priority_start=$(( ((run_number - 1) * priority_slots) % ${#changed_batch[@]} ))
              for (( offset=0; offset<priority_slots; offset++ )); do
                pick=$(( (priority_start + offset) % ${#changed_batch[@]} ))
                selected_sources+=("${changed_batch[pick]}")
              done
            fi
            if (( backlog_slots > 0 )); then
              backlog_start=$(( ((run_number - 1) * backlog_slots) % ${#backlog_batch[@]} ))
              for (( offset=0; offset<backlog_slots; offset++ )); do
                pick=$(( (backlog_start + offset) % ${#backlog_batch[@]} ))
                selected_sources+=("${backlog_batch[pick]}")
              done
            fi
            printf -v list '%s\n' "${selected_sources[@]}"
            list="${list%$'\n'}"
            echo "REMINT_INITIAL_BATCH selected=24 changed=$priority_slots backlog=$backlog_slots unprocessed=$((initial_total - 24)) native=SENS_ZIG"
          else
            echo "REMINT_INITIAL_BATCH selected=$initial_total pending=0 native=SENS_ZIG"
          fi
          # Джерела для відтворення на новому exact main, якщо інші агенти
          # посунули HEAD до публікації. Не зберігати готові старі байти.
          printf '%s\n' "$list" > "$RUNNER_TEMP/sens-remint-candidates.list"
          # Судити конкурс лише після конкурсанта, не кожного lib/list/tree.
          # Факт категорії визначає реальний змінений/непарний шлях, не JSON.
          if printf '%s\n' "$list" | grep -Eq '^benchmarks/contest-uk/[^[:space:]]+\.lisp$'; then
            echo "contest=true" >> "$GITHUB_OUTPUT"
          else
            echo "contest=false" >> "$GITHUB_OUTPUT"
          fi
          echo "candidates:"; printf '%s\n' "$list" | sed '/^$/d' | wc -l
          # Журнал тільки справді виконаних нативних джерел переживе
          # перемикання ephemeral checkout на свіжий main у кроці публікації.
          : > "$RUNNER_TEMP/sens-remint-success.txt"
          ok=0; skip=0
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            if [ ! -f "$f" ]; then
              # Переможець вже фізично перенесений до історії конкурсу.
              # Це не зламана SENS-програма й не причина губити успішні mint.
              case "$f" in
                benchmarks/contest-uk/*.lisp)
                  old="benchmarks/contest-uk/superseded/${f##*/}"
                  if [[ -f "$old" && ! -L "$old" ]]; then
                    echo "MOVED_TO_SUPERSEDED $f -> $old"
                    continue
                  fi;;
              esac
              echo "MISSING $f"; skip=$((skip+1)); continue
            fi
            # Коментарний файл — опис, не виконуваний Lisp. Навіть старий
            # queued/rebase список не має майнити порожню програму:
            # T5M_REPL_EMPTY тут є хибним адміністративним RED.
            # Symlink і реальне джерело з формами НЕ обходити.
            # Схемний реєстр сайтів є інвентарем, а не виконуваним Lisp.
            # Перевіряємо і точний шлях, і форму даних: зміна на програму
            # не може бути непомітно пропущена.
            if [[ "$f" == knowledge/silent-fallback-inventory.lisp && ! -L "$f" ]] &&
               target/debug/lisp-data-schema-guard silent-fallback-inventory "$f"; then
              echo "REMINT_DATA_ONLY source=$f classification=SCHEMA_INVENTORY"
              continue
            fi
            # Ці два машинні профілі — таблиці механізмів, не SENS-виклики.
            # Як і суцільний облік, звіряємо шлях ТА чинну кореневу схему.
            # Якщо їхній вміст зміниться на Lisp-програму, її не пропускаємо.
            machine_schema=""
            case "$f" in
              lib/machine/intel-core-i5-6400.lisp) machine_schema="machine-profile-1" ;;
              lib/machine/profile/current-domain-x86-64.lisp) machine_schema="machine-domain-profile-3" ;;
            esac
            if [[ -n "$machine_schema" && ! -L "$f" ]] &&
               target/debug/lisp-data-schema-guard "$machine_schema" "$f"; then
              echo "REMINT_DATA_ONLY source=$f classification=EXACT_SCHEMA:$machine_schema"
              continue
            fi
            if [[ ! -L "$f" ]] &&
               ! LC_ALL=C grep -Eq '^[[:space:]]*[^[:space:];]' -- "$f"; then
              echo "REMINT_DATA_ONLY source=$f classification=COMMENT_ONLY"
              continue
            fi
            # Це навмисно негативна програма: SENS мусить відхилити
            # її виклик Д1:ні. Єдиний нативний суд — meta_fc_predicate_witness,
            # де доведено тип помилки та рівно один змінений біт джерела.
            # Не видавати очікуваний негатив за зламаний позитивний remint.
            if [[ "$f" == tests/semantic/meta-fc-predicates-d1-mutant.lisp ]]; then
              echo "REMINT_EXPECTED_SENS_NEGATIVE source=$f test=meta_fc_predicate_witness counted_executable=NO"
              continue
            fi
            # Пари може ще не бути — refresh створює її канонічно (mint + view).
            bs=()
            profile_args=()
            expect_args=()
            case "$f" in
              benchmarks/contest-uk/*.lisp) profile_args=(--core4-runtime);;
              tests/semantic/d9-f6-package-key-canonicalization-law.lisp|tests/semantic/d9-f6-package-key-canonicalization-mutant.lisp) bs=(--binding-source lib/lisp-fs.lisp); profile_args=(--core4-runtime);;
              tests/semantic/meta-eval-graph-d1-law.lisp|tests/semantic/meta-eval-graph-d1-mutant.lisp) bs=(--binding-source lib/meta-eval.lisp); profile_args=(--core4-runtime);;
              tests/semantic/exact-arithmetic-laws.lisp|tests/semantic/exact-arithmetic-mutant.lisp|lib/lisp-fs.lisp|lib/unify.lisp|tests/semantic/d6-derived-research-batch-01.lisp|tests/semantic/d8-rassq-until-batch.lisp|scripts/check-domain-logic-laws.lisp) profile_args=(--core4-runtime);;
              tests/semantic/core-d3-car-cdr-cons-mutant.lisp) expect_args=(--expect-error "car expects a non-empty list");;
              tests/semantic/d4-recursion-atom-result-law.lisp|tests/semantic/d4-recursion-atom-result-mutant.lisp|tests/semantic/d4-recursion-benchmark-law.lisp|tests/semantic/d4-recursion-benchmark-mutant.lisp) bs=(--binding-source benchmarks/recursion.lisp);;
              lib/persistent-vector.lisp|lib/knowledge.lisp) bs=(--binding-source "$RUNNER_TEMP/sens-core4-d24-roots.lisp");;
              lib/world.lisp|lib/yantra.lisp) bs=(--binding-source "$RUNNER_TEMP/sens-core4-d24-roots.lisp");;
              lib/reason.lisp) bs=(--binding-source "$RUNNER_TEMP/sens-core4-d24-roots.lisp" --binding-source lib/unify.lisp);;
              lib/forward.lisp) bs=(--binding-source lib/unify.lisp);;
              lib/d11-clojure-partition-by.lisp) bs=(--binding-source lib/d11-srfi1-span-break.lisp);;
                lib/d11-clojure-frequencies-unary.lisp) bs=(--binding-source lib/d11-clojure-group-by.lisp);;
              lib/narrate.lisp) bs=(--binding-source "$RUNNER_TEMP/sens-core4-d24-roots.lisp" --binding-source lib/unify.lisp --binding-source lib/reason.lisp);;
              lib/result-status.lisp) bs=(--binding-source "$RUNNER_TEMP/sens-core4-d24-roots.lisp" --binding-source lib/unify.lisp --binding-source lib/knowledge.lisp --binding-source lib/reason.lisp);;
              lib/translation.lisp) bs=(--binding-source "$RUNNER_TEMP/sens-core4-d24-roots.lisp" --binding-source lib/unify.lisp --binding-source lib/knowledge.lisp --binding-source lib/reason.lisp --binding-source lib/world.lisp --binding-source lib/yantra.lisp --binding-source lib/result-status.lisp);;
              tests/fixtures/mechanism-selector-1047-witness.lisp) bs=(--binding-source lib/mechanism-selector.lisp);;
              tests/fixtures/island-lowering-1048-witness.lisp) bs=(--binding-source lib/mechanism-selector.lisp --binding-source lib/island-lowering.lisp);;
              tests/semantic/d11-clojure-juxt-laws.lisp|tests/semantic/d11-clojure-juxt-mutant.lisp) bs=(--binding-source lib/d11-clojure-juxt.lisp);;
              tests/semantic/d11-clojure-dedupe-laws.lisp) bs=(--binding-source lib/d11-srfi1-span-break.lisp --binding-source lib/d11-clojure-partition-by.lisp);;
              tests/semantic/d11-clojure-partition-by-laws.lisp|tests/semantic/d11-clojure-partition-by-d7-parity.lisp) bs=(--binding-source lib/d11-srfi1-span-break.lisp --binding-source lib/d11-clojure-partition-by.lisp);;
              tests/semantic/d11-srfi1-find-tail-laws.lisp) bs=(--binding-source lib/d11-srfi1-find-tail.lisp);;
                tests/semantic/d11-srfi1-find-tail-improper-tail-negative.lisp) bs=(--binding-source lib/d11-srfi1-find-tail.lisp); expect_args=(--expect-error "car expects a non-empty list");;
              tests/semantic/d11-srfi1-list-equality-law.lisp|tests/semantic/d11-srfi1-list-equality-mutant.lisp) bs=(--binding-source lib/d11-srfi1-list-equality.lisp);;
              tests/semantic/d11-family-selection-law.lisp|tests/semantic/d11-family-selection-mutant.lisp) bs=(--binding-source lib/d11-family-selection.lisp);;
              tests/semantic/d11-family-association-law.lisp|tests/semantic/d11-family-association-mutant.lisp) bs=(--binding-source lib/d11-srfi1-alist-protocol.lisp);;
              tests/semantic/d11-families-benchmark-law.lisp|tests/semantic/d11-families-benchmark-mutant.lisp) bs=(--binding-source lib/d11-family-selection.lisp --binding-source lib/d11-srfi1-alist-protocol.lisp --binding-source lib/d11-clojure-group-by.lisp --binding-source lib/d11-clojure-frequencies-unary.lisp);;
              tests/semantic/unification-variable-shape-negative.lisp|tests/semantic/unification-variable-shape-positive.lisp) bs=(--binding-source lib/unify.lisp);;
              tests/semantic/unification-occurs-predicate-law.lisp|tests/semantic/unification-occurs-predicate-mutant.lisp) bs=(--binding-source lib/unify.lisp);;
              tests/semantic/utf8-quotient-laws.lisp|tests/semantic/utf8-quotient-mutant.lisp) bs=(--binding-source lib/utf8.lisp);;
              tests/semantic/unification-constructor-law.lisp|tests/semantic/unification-constructor-mutant.lisp|tests/semantic/unification-occurs-check-law.lisp|tests/semantic/unification-occurs-check-mutant.lisp) bs=(--binding-source lib/unify.lisp);;
              tests/semantic/d11-srfi1-span-break-laws.lisp) bs=(--binding-source lib/d11-srfi1-span-break.lisp);;
              tests/semantic/d9-world-shape-module-events-laws.lisp|tests/semantic/world-exact-arity-witness.lisp) bs=(--binding-source lib/world.lisp);;
              tests/semantic/core1-gc-reachability-laws.lisp) bs=(--binding-source lib/core1.lisp);;
              tests/semantic/meta-fc-predicates-d1-law.lisp) bs=(--binding-source lib/meta-eval-first-class.lisp);;
              # F6 producer is a Core4 consumer and exercises filesystem code.
              # Bundle the same SENS-owned dependencies used by its WRITE→READ laws.
              tests/fixtures/wsm-fs-record-producer.lisp) bs=(--binding-source lib/persistent-map.lisp --binding-source lib/world.lisp --binding-source lib/content-store.lisp --binding-source lib/lisp-fs.lisp); profile_args=(--core4-runtime);;
            esac
            if bash scripts/refresh-verified-t5m-pair.sh "$f" target/debug/sens target/debug/sens-trit "${bs[@]}" "${expect_args[@]}" "${profile_args[@]}"; then
              ok=$((ok+1))
              printf '%s\n' "$f" >> "$RUNNER_TEMP/sens-remint-success.txt"
              if [[ "$f" == "lib/core4.lisp" ]]; then
                # Core4 is embedded into SENS at build time; dependent laws and F6
                # must use the freshly reminted carrier, never the pre-remint binary.
                echo "REMINT_REBUILD_CORE4_EMBEDDED"
                if ! cargo build --locked -p sens-cli --bin sens --bin sens-trit --bin lisp-data-schema-guard --features benchmark-ast-visits; then
                  echo "::error::REMINT_CORE4_EMBEDDED_REBUILD_FAILED" >&2
                  exit 2
                fi
              fi
            else
              echo "SKIP_FAIL $f"; skip=$((skip+1))
              if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
                printf -- '- SKIP_FAIL `%s`\n' "$f" >> "$GITHUB_STEP_SUMMARY"
              fi
            fi
          done <<< "$list"
          echo "remint done ok=$ok skip=$skip"
          if (( skip != 0 )); then
            echo "failed=true" >> "$GITHUB_OUTPUT"
            echo "::error::Нативний SENS/Zig відхилив $skip конкретних джерел; успішні фізичні пари все одно буде опубліковано" >&2
          else
            echo "failed=false" >> "$GITHUB_OUTPUT"
          fi

      # Після remint перевіряємо реальний F6 producer→consumer на ТІЙ САМІЙ
      # робочій копії, де щойно згенеровані фізичні T5M активи.
      # build.rs / Zig @embedFile бачать змінені .sens файли через Cargo rebuild.
      # Невдала пара не може бути закомічена лише тому, що сам mint завершився.
      - name: F6 — нативний producer → фізичний T5M → consumer
        id: f6_physical_proof
        shell: bash
        run: |
          set -euo pipefail
          # F6 producer is a required release witness, not rotational backlog.
          # Mint it on this checkout when the bounded 24-source pass omitted it.
          if ! grep -Fxq 'tests/fixtures/wsm-fs-record-producer.lisp' "$RUNNER_TEMP/sens-remint-success.txt"; then
            bash scripts/refresh-verified-t5m-pair.sh \
              tests/fixtures/wsm-fs-record-producer.lisp \
              target/debug/sens target/debug/sens-trit \
              --binding-source lib/persistent-map.lisp \
              --binding-source lib/world.lisp \
              --binding-source lib/content-store.lisp \
              --binding-source lib/lisp-fs.lisp \
              --core4-runtime
            printf '%s\n' 'tests/fixtures/wsm-fs-record-producer.lisp' >> "$RUNNER_TEMP/sens-remint-success.txt"
          fi
          SENS_EQ_TRACE=1 cargo test --locked -p sens-cli --test wsm_fs_f6_pipeline -- --nocapture

      # Один нативний суд одночасно перевіряє всі фізичні програми
      # й друкує CONTEST_NATIVE_VERIFIED_EXECUTABLES. Другий повний
      # count-executable-lisp до push дублював SENS/Zig виконання,
      # витрачав час та програвав гонку main без нового доказу.
      # Адресний повний облік залишається у scripts/count-executable-lisp.sh.
      # RED одного кандидата не затримує конкурс уже доведених трійок.
      # Наприкінці workflow справжня відмова mint лишається червоною.
      - name: Нативне суддівство і просування справжніх переможців
        id: contest_judge
        if: github.event_name == 'push' && steps.remint.outputs.contest == 'true'
        run: bash benchmarks/contest-uk/promote.sh

      - name: Commit refreshed pairs (only real byte changes)
        id: published_pairs
        # Публікація тільки реальних SENS/Zig пар; суперечливий або старий
        # фізичний код не перебазовувати поверх свіжої української програми.
        # Після гонки refs заново майнити джерела на актуальному main.
        if: ${{ !cancelled() && steps.remint.outcome == 'success' && steps.f6_physical_proof.outcome == 'success' }}
        env:
          REMINT_CONTEST: ${{ steps.remint.outputs.contest }}
          REMINT_GITHUB_REF: ${{ github.ref }}
          # Preserve the caller's closed candidate set after a non-fast-forward.
          REMINT_FILES: ${{ inputs.files }}
        run: |
          set -euo pipefail
          # Native proof повертається виключно до ref, який його запустив.
          # Короткоживуча агентська гілка ніколи не записує свій T5M у main.
          case "$REMINT_GITHUB_REF" in
            refs/heads/*) target_branch="${REMINT_GITHUB_REF#refs/heads/}" ;;
            *) echo "::error::REMINT_TARGET_NOT_BRANCH ref=$REMINT_GITHUB_REF" >&2; exit 2 ;;
          esac
          echo "REMINT_TARGET_BRANCH branch=$target_branch"
          git config user.name "sens-remint-bot"
          git config user.email "sens-remint-bot@users.noreply.github.com"
          prune_archived_duplicates() {
            local physical stem archive
            for physical in benchmarks/contest-uk/*.sens; do
              [[ -f "$physical" && ! -L "$physical" ]] || continue
              stem="${physical%.sens}"
              [[ ! -e "$stem.lisp" && ! -L "$stem.lisp" ]] || continue
              archive="benchmarks/contest-uk/superseded/${stem##*/}"
              if [[ -f "$stem" && ! -L "$stem" &&
                    -f "$archive.lisp" && ! -L "$archive.lisp" &&
                    -f "$archive.sens" && ! -L "$archive.sens" &&
                    -f "$archive" && ! -L "$archive" ]] &&
                 cmp -s "$physical" "$archive.sens" &&
                 cmp -s "$stem" "$archive"; then
                rm -- "$physical" "$stem"
                echo "REMINT_PRUNED_ARCHIVED_DUPLICATE stem=$stem exact_blobs=YES"
              fi
            done
          }
          commit_verified_changes() {
            prune_archived_duplicates
            git add -A || return 2
            local diff_status=0
            git diff --cached --quiet || diff_status=$?
            case "$diff_status" in
              0) echo "REMINT_ALREADY_CURRENT no-byte-changes"; return 1 ;;
              1) ;;
              *) echo "::error::REMINT_GIT_DIFF_FAILED status=$diff_status" >&2; return 2 ;;
            esac
            git commit -m "ремонт пар: канонічні SENS/Zig T5M на актуальному main" || return 2
          }
          regenerate_on_current_main() {
            # Стан відмови — тільки поточної перевірки exact main.
            # Якщо наступний rebase уже містить виправлення, старий RED
            # не переживає новий успішний SENS/Zig remint.
            # RED належить саме цьому актуальному SHA. Стара помилка у
            # попередній спробі не переживає нативного ремонту нової версії.
            regenerated_failed=0
            local f old source
            local -a bs
            # Після чергового push у main могли з'явитися нові конкурсанти.
            # Не судити їх за старим T5M: додати в той самий нативний
            # маршрут mint → Zig inverse → paired/standalone SENS.
            # Після паралельного оновлення перевірити й дрейфуючі трійки,
            # а не лишати їх новим непоясненим RED під час judge.
            # Новий незалежний конкурсант міг з'явитися, коли workflow
            # уже майнив старий HEAD. Push від GITHUB_TOKEN не запускає
            # наступний push-workflow: забираємо його в поточний native mint.
            if [[ -n "${REMINT_FILES:-}" ]]; then
              echo "REMINT_CURRENT_MAIN_SCOPE explicit-manifest=preserved"
            else
              for source in benchmarks/contest-uk/*.lisp; do
                [[ -f "$source" && ! -L "$source" ]] || continue
                pair="${source%.lisp}.sens"
                view="${source%.lisp}"
                needs_pair=0
                if [[ ! -s "$pair" || ! -f "$view" ||
                      -L "$pair" || -L "$view" ]]; then
                  needs_pair=1
                else
                  source_commit="$(git log -1 --format=%H -- "$source")"
                  pair_commit="$(git log -1 --format=%H -- "$pair")"
                  if [[ -n "$source_commit" && -n "$pair_commit" ]] &&
                     ! git merge-base --is-ancestor "$source_commit" "$pair_commit"; then
                    needs_pair=1
                  fi
                fi
                # Свіжий main може міняти фізичні байти без зміни .lisp.
                # Перевіряємо чинний SENS/Zig mint перед конкурсним judge,
                # щоб старий НСД не зупиняв нових справних учасників.
                if (( ! needs_pair )) && [[ "$REMINT_CONTEST" == true ]]; then
                  probe_dir="$(mktemp -d "$RUNNER_TEMP/sens-contest-probe.XXXXXX")"
                  if ! target/debug/sens --t5m-mint "$source" "$probe_dir/probe.sens" >/dev/null ||
                     ! cmp -s "$probe_dir/probe.sens" "$pair" ||
                     ! target/debug/sens-trit view "$pair" | cmp -s - "$view"; then
                    needs_pair=1
                    echo "REMINT_RECOVER_CONTEST_DRIFT source=$source native=SENS_ZIG"
                  fi
                  rm -rf -- "$probe_dir"
                fi
                if (( needs_pair )); then
                  REMINT_CONTEST=true
                  if ! grep -Fxq -- "$source" "$RUNNER_TEMP/sens-remint-candidates.list"; then
                    printf '%s\n' "$source" >> "$RUNNER_TEMP/sens-remint-candidates.list"
                    echo "REMINT_RECOVER_CONTEST_SOURCE source=$source"
                  fi
                fi
              done
              # Якщо попередні queued push скасовано, після rebase потрібно
              # забрати й нові бібліотечні Lisp. Інакше незмінений старий
              # кандидат-список ніколи не помітить їхні відсутні T5M пари.
              # Тільки непарні або новіші за носій: без масового перемайну.
              for source in lib/*.lisp tests/fixtures/wsm-fs-record-producer.lisp tests/semantic/d9-string-append-physical.lisp tests/semantic/core1-gc-reachability-laws.lisp tests/semantic/біджа3-уточнення-атома-1968.lisp tests/semantic/meta-fc-predicates-d1-law.lisp tests/semantic/repl-uk-queue-law.lisp tests/semantic/repl-uk-queue-mutant.lisp lib/reverse-three.lisp lib/axioms-d1-principle-five.lisp lib/life-1-scheduler.lisp lib/lisp-fs.lisp lib/world.lisp lib/reason.lisp lib/forward.lisp lib/knowledge.lisp lib/unify.lisp lib/clips-import.lisp lib/machine/projection/x86-64.lisp lib/machine/lowering/semantic-x86-64.lisp; do
                [[ -f "$source" && ! -L "$source" ]] || continue
                # Незмінні описові й окремо діагностовані великі модулі
                # не запускаються при чужому push; власна зміна — у diff вище.
                case "$source" in
                  lib/core2.lisp|lib/core-math.lisp|lib/core4.lisp|lib/yantra.lisp) continue ;;
                esac
                pair="${source%.lisp}.sens"
                view="${source%.lisp}"
                needs_pair=0
                if [[ ! -s "$pair" || ! -f "$view" ||
                      -L "$pair" || -L "$view" ]]; then
                  needs_pair=1
                else
                  source_commit="$(git log -1 --format=%H -- "$source")"
                  pair_commit="$(git log -1 --format=%H -- "$pair")"
                  if [[ -n "$source_commit" && -n "$pair_commit" ]] &&
                     ! git merge-base --is-ancestor "$source_commit" "$pair_commit"; then
                    needs_pair=1
                  fi
                fi
                if (( needs_pair )) &&
                   ! grep -Fxq -- "$source" "$RUNNER_TEMP/sens-remint-candidates.list"; then
                  printf '%s\n' "$source" >> "$RUNNER_TEMP/sens-remint-candidates.list"
                  echo "REMINT_RECOVER_LIBRARY_SOURCE source=$source"
                fi
              done
            fi

            # Відновлення після зсуву main: нові українські конкурсні
            # програми без T5M мають бути першими у короткому пакеті.
            # Інакше старий список із 24 бібліотечних записів витісняє
            # всіх нових учасників, і число виконуваних файлів не росте.
            # Це тільки черга файлів, НЕ оцінювання семантики хостом.
            priority_list="$RUNNER_TEMP/sens-remint-unpaired-contest.list"
            deferred_list="$RUNNER_TEMP/sens-remint-other-candidates.list"
            : > "$priority_list"
            : > "$deferred_list"
            while IFS= read -r candidate; do
              [[ -n "$candidate" ]] || continue
              if [[ "$candidate" == benchmarks/contest-uk/*.lisp &&
                    -f "$candidate" && ! -L "$candidate" ]]; then
                pair="${candidate%.lisp}.sens"
                view="${candidate%.lisp}"
                needs_pair=0
                if [[ ! -s "$pair" || ! -f "$view" || -L "$pair" || -L "$view" ]]; then
                  needs_pair=1
                else
                  source_commit="$(git log -1 --format=%H -- "$candidate")"
                  pair_commit="$(git log -1 --format=%H -- "$pair")"
                  if [[ -n "$source_commit" && -n "$pair_commit" ]] &&
                     ! git merge-base --is-ancestor "$source_commit" "$pair_commit"; then
                    needs_pair=1
                    echo "REMINT_PRIORITY_CONTEST_DRIFT source=$candidate native=SENS_ZIG"
                  fi
                fi
                if (( needs_pair )); then
                  printf '%s\n' "$candidate" >> "$priority_list"
                else
                  printf '%s\n' "$candidate" >> "$deferred_list"
                fi
              elif [[ "$candidate" == lib/*.lisp &&
                      "$candidate" != lib/*/*.lisp &&
                      -f "$candidate" && ! -L "$candidate" ]] &&
                   { [[ ! -s "${candidate%.lisp}.sens" ||
                         ! -f "${candidate%.lisp}" ||
                         -L "${candidate%.lisp}.sens" ||
                         -L "${candidate%.lisp}" ]]; }; then
                # Новий першокласний код Д3/Д5 також чекає фізичну пару:
                # не витісняти його сотнею старих повних файлів.
                printf '%s\n' "$candidate" >> "$priority_list"
              else
                printf '%s\n' "$candidate" >> "$deferred_list"
              fi
            done < "$RUNNER_TEMP/sens-remint-candidates.list"
            cat "$priority_list" "$deferred_list" > "$RUNNER_TEMP/sens-remint-candidates.list"
            rm -- "$priority_list" "$deferred_list"
            # При конкурентних push повторний native recovery не повинен
            # перетворювати пакет на сотні незалежних програм. Решта —
            # явно PENDING, ніколи не зараховується як обернена/виконана.
            # Той самий нативний SENS/Zig маршрут лишається обов'язковим.
            # One bounded recovery batch fits all 37 known drifted contest sources plus a small library tail.
            recovery_limit=48
            recovery_selected=0
            recovery_pending=0
            recovery_list="$RUNNER_TEMP/sens-remint-current-main-batch.list"
            : > "$recovery_list"
            while IFS= read -r pending_source; do
              [[ -n "$pending_source" ]] || continue
              if (( recovery_selected < recovery_limit )); then
                printf '%s\n' "$pending_source" >> "$recovery_list"
                recovery_selected=$((recovery_selected + 1))
              else
                echo "REMINT_CURRENT_MAIN_PENDING source=$pending_source status=NOT_EXECUTED"
                recovery_pending=$((recovery_pending + 1))
              fi
            done < "$RUNNER_TEMP/sens-remint-candidates.list"
            mv -- "$recovery_list" "$RUNNER_TEMP/sens-remint-candidates.list"
            echo "REMINT_CURRENT_MAIN_BATCH selected=$recovery_selected pending=$recovery_pending"
            while IFS= read -r f; do
              [[ -n "$f" ]] || continue
              if [[ ! -f "$f" ]]; then
                case "$f" in
                  benchmarks/contest-uk/*.lisp)
                    old="benchmarks/contest-uk/superseded/${f##*/}"
                    if [[ -f "$old" && ! -L "$old" ]]; then
                      echo "REMINT_ALREADY_ARCHIVED source=$f"
                      continue
                    fi ;;
                esac
                # Застарілий queued job міг бачити файл, який вже
                # вилучено/перейменовано іншим комітом main. Якщо повного
                # джерела та його фізичних виходів більше НЕМА, це не
                # помилка SENS. Наявність хоч одного осиротілого байтового
                # носія лишається RED і підхоплюється нативним судом.
                if [[ "$f" == *.lisp && ! -e "$f" && ! -L "$f" &&
                      ! -e "${f%.lisp}.sens" && ! -L "${f%.lisp}.sens" &&
                      ! -e "${f%.lisp}" && ! -L "${f%.lisp}" ]]; then
                  echo "REMINT_REMOVED_ON_CURRENT_MAIN source=$f stale_queue=YES"
                  continue
                fi
                echo "::error::REMINT_SOURCE_MISSING $f" >&2
                regenerated_failed=1
                continue
              fi
              # Перевірка повторюється після перемикання на новий main:
              # джерело могло стати суто описовим, не створюємо бутафорію.
              # Схемний реєстр сайтів є інвентарем, а не виконуваним Lisp.
              # Перевіряємо і точний шлях, і форму даних: зміна на програму
              # не може бути непомітно пропущена.
              if [[ "$f" == knowledge/silent-fallback-inventory.lisp && ! -L "$f" ]] &&
                 target/debug/lisp-data-schema-guard silent-fallback-inventory "$f"; then
                echo "REMINT_CURRENT_MAIN_DATA_ONLY source=$f classification=SCHEMA_INVENTORY"
                continue
              fi
              # Другий прохід після конкурентного push мусить мати ті самі
              # правила відокремлення схемних даних від виконуваних форм.
              machine_schema=""
              case "$f" in
                lib/machine/intel-core-i5-6400.lisp) machine_schema="machine-profile-1" ;;
                lib/machine/profile/current-domain-x86-64.lisp) machine_schema="machine-domain-profile-3" ;;
              esac
              if [[ -n "$machine_schema" && ! -L "$f" ]] &&
                 target/debug/lisp-data-schema-guard "$machine_schema" "$f"; then
                echo "REMINT_CURRENT_MAIN_DATA_ONLY source=$f classification=EXACT_SCHEMA:$machine_schema"
                continue
              fi
              if [[ ! -L "$f" ]] &&
                 ! LC_ALL=C grep -Eq '^[[:space:]]*[^[:space:];]' -- "$f"; then
                echo "REMINT_CURRENT_MAIN_DATA_ONLY source=$f classification=COMMENT_ONLY"
                continue
              fi
              # На свіжому main той самий явно негативний свідок
              # перевіряється SENS meta_fc_predicate_witness, не позитивним mint.
              if [[ "$f" == tests/semantic/meta-fc-predicates-d1-mutant.lisp ]]; then
                echo "REMINT_CURRENT_MAIN_EXPECTED_SENS_NEGATIVE source=$f test=meta_fc_predicate_witness counted_executable=NO"
                continue
              fi
              bs=()
              profile_args=()
              expect_args=()
              case "$f" in
                benchmarks/contest-uk/*.lisp) profile_args=(--core4-runtime);;
                tests/semantic/d9-f6-package-key-canonicalization-law.lisp|tests/semantic/d9-f6-package-key-canonicalization-mutant.lisp) bs=(--binding-source lib/lisp-fs.lisp); profile_args=(--core4-runtime);;
              tests/semantic/meta-eval-graph-d1-law.lisp|tests/semantic/meta-eval-graph-d1-mutant.lisp) bs=(--binding-source lib/meta-eval.lisp); profile_args=(--core4-runtime);;
              tests/semantic/exact-arithmetic-laws.lisp|tests/semantic/exact-arithmetic-mutant.lisp|lib/lisp-fs.lisp|lib/unify.lisp|tests/semantic/d6-derived-research-batch-01.lisp|tests/semantic/d8-rassq-until-batch.lisp|scripts/check-domain-logic-laws.lisp) profile_args=(--core4-runtime);;
              tests/semantic/core-d3-car-cdr-cons-mutant.lisp) expect_args=(--expect-error "car expects a non-empty list");;
              tests/semantic/d4-recursion-atom-result-law.lisp|tests/semantic/d4-recursion-atom-result-mutant.lisp|tests/semantic/d4-recursion-benchmark-law.lisp|tests/semantic/d4-recursion-benchmark-mutant.lisp) bs=(--binding-source benchmarks/recursion.lisp);;
                lib/persistent-vector.lisp|lib/knowledge.lisp) bs=(--binding-source "$RUNNER_TEMP/sens-core4-d24-roots.lisp");;
                lib/world.lisp|lib/yantra.lisp) bs=(--binding-source "$RUNNER_TEMP/sens-core4-d24-roots.lisp");;
                lib/reason.lisp) bs=(--binding-source "$RUNNER_TEMP/sens-core4-d24-roots.lisp" --binding-source lib/unify.lisp);;
              lib/forward.lisp) bs=(--binding-source lib/unify.lisp);;
              lib/d11-clojure-partition-by.lisp) bs=(--binding-source lib/d11-srfi1-span-break.lisp);;
                lib/d11-clojure-frequencies-unary.lisp) bs=(--binding-source lib/d11-clojure-group-by.lisp);;
                lib/narrate.lisp) bs=(--binding-source "$RUNNER_TEMP/sens-core4-d24-roots.lisp" --binding-source lib/unify.lisp --binding-source lib/reason.lisp);;
                lib/result-status.lisp) bs=(--binding-source "$RUNNER_TEMP/sens-core4-d24-roots.lisp" --binding-source lib/unify.lisp --binding-source lib/knowledge.lisp --binding-source lib/reason.lisp);;
                lib/translation.lisp) bs=(--binding-source "$RUNNER_TEMP/sens-core4-d24-roots.lisp" --binding-source lib/unify.lisp --binding-source lib/knowledge.lisp --binding-source lib/reason.lisp --binding-source lib/world.lisp --binding-source lib/yantra.lisp --binding-source lib/result-status.lisp);;
                tests/fixtures/mechanism-selector-1047-witness.lisp) bs=(--binding-source lib/mechanism-selector.lisp);;
              tests/fixtures/island-lowering-1048-witness.lisp) bs=(--binding-source lib/mechanism-selector.lisp --binding-source lib/island-lowering.lisp);;
                tests/semantic/d11-clojure-juxt-laws.lisp|tests/semantic/d11-clojure-juxt-mutant.lisp) bs=(--binding-source lib/d11-clojure-juxt.lisp);;
                tests/semantic/d11-clojure-dedupe-laws.lisp) bs=(--binding-source lib/d11-srfi1-span-break.lisp --binding-source lib/d11-clojure-partition-by.lisp);;
                tests/semantic/d11-clojure-partition-by-laws.lisp|tests/semantic/d11-clojure-partition-by-d7-parity.lisp) bs=(--binding-source lib/d11-srfi1-span-break.lisp --binding-source lib/d11-clojure-partition-by.lisp);;
                tests/semantic/d11-srfi1-find-tail-laws.lisp) bs=(--binding-source lib/d11-srfi1-find-tail.lisp);;
                tests/semantic/d11-srfi1-find-tail-improper-tail-negative.lisp) bs=(--binding-source lib/d11-srfi1-find-tail.lisp); expect_args=(--expect-error "car expects a non-empty list");;
                tests/semantic/d11-srfi1-list-equality-law.lisp|tests/semantic/d11-srfi1-list-equality-mutant.lisp) bs=(--binding-source lib/d11-srfi1-list-equality.lisp);;
                tests/semantic/d11-family-selection-law.lisp|tests/semantic/d11-family-selection-mutant.lisp) bs=(--binding-source lib/d11-family-selection.lisp);;
                tests/semantic/d11-family-association-law.lisp|tests/semantic/d11-family-association-mutant.lisp) bs=(--binding-source lib/d11-srfi1-alist-protocol.lisp);;
                tests/semantic/d11-families-benchmark-law.lisp|tests/semantic/d11-families-benchmark-mutant.lisp) bs=(--binding-source lib/d11-family-selection.lisp --binding-source lib/d11-srfi1-alist-protocol.lisp --binding-source lib/d11-clojure-group-by.lisp --binding-source lib/d11-clojure-frequencies-unary.lisp);;
                tests/semantic/unification-variable-shape-negative.lisp|tests/semantic/unification-variable-shape-positive.lisp) bs=(--binding-source lib/unify.lisp);;
                tests/semantic/unification-occurs-predicate-law.lisp|tests/semantic/unification-occurs-predicate-mutant.lisp) bs=(--binding-source lib/unify.lisp);;
                tests/semantic/utf8-quotient-laws.lisp|tests/semantic/utf8-quotient-mutant.lisp) bs=(--binding-source lib/utf8.lisp);;
                tests/semantic/unification-constructor-law.lisp|tests/semantic/unification-constructor-mutant.lisp|tests/semantic/unification-occurs-check-law.lisp|tests/semantic/unification-occurs-check-mutant.lisp) bs=(--binding-source lib/unify.lisp);;
                tests/semantic/d11-srfi1-span-break-laws.lisp) bs=(--binding-source lib/d11-srfi1-span-break.lisp);;
                tests/semantic/d9-world-shape-module-events-laws.lisp|tests/semantic/world-exact-arity-witness.lisp) bs=(--binding-source lib/world.lisp);;
              tests/semantic/core1-gc-reachability-laws.lisp) bs=(--binding-source lib/core1.lisp);;
              tests/semantic/meta-fc-predicates-d1-law.lisp) bs=(--binding-source lib/meta-eval-first-class.lisp);;
              # F6 producer dependencies must match both initial mint and current-main recovery.
              tests/fixtures/wsm-fs-record-producer.lisp) bs=(--binding-source lib/persistent-map.lisp --binding-source lib/world.lisp --binding-source lib/content-store.lisp --binding-source lib/lisp-fs.lisp); profile_args=(--core4-runtime);;
              esac
              if ! bash scripts/refresh-verified-t5m-pair.sh "$f" target/debug/sens target/debug/sens-trit "${bs[@]}" "${expect_args[@]}" "${profile_args[@]}"; then
                echo "::error::REMINT_CURRENT_MAIN_NATIVE_FAILED $f" >&2
                regenerated_failed=1
              elif [[ "$f" == "lib/core4.lisp" ]]; then
                # Rebase recovery can remint Core4 too; refresh the embedded runtime before dependent candidates.
                echo "REMINT_CURRENT_MAIN_REBUILD_CORE4_EMBEDDED"
                if ! cargo build --locked -p sens-cli --bin sens --bin sens-trit --bin lisp-data-schema-guard --features benchmark-ast-visits; then
                  echo "::error::REMINT_CURRENT_MAIN_CORE4_REBUILD_FAILED" >&2
                  exit 2
                fi
              fi
            done < "$RUNNER_TEMP/sens-remint-candidates.list"
            # Перевірити дійсний конкурс уже на тих самих поточних джерелах.
            if [[ "$REMINT_CONTEST" == true ]]; then
              if ! bash benchmarks/contest-uk/promote.sh; then
                echo "::error::REMINT_CURRENT_MAIN_CONTEST_RED" >&2
                regenerated_failed=1
              fi
            fi
          }
          regenerated_failed=0
          recovered_on_current_main=0
          commit_result=0
          commit_verified_changes || commit_result=$?
          case "$commit_result" in
            0) ;;
            1)
              published_sha="$(git rev-parse HEAD)"
              echo "published_sha=$published_sha" >> "$GITHUB_OUTPUT"
              echo "REMINT_ALREADY_CURRENT_SHA=$published_sha"
              exit 0
              ;;
            *) echo "::error::REMINT_NATIVE_COMMIT_FAILED status=$commit_result" >&2; exit "$commit_result" ;;
          esac
          published=0
          # При частих незалежних push перевірені фізичні T5M можуть
          # годинами програвати гонку refs: повний суд триває десятки секунд.
          # Швидкий rebase дозволений ЛИШЕ коли remote змінив документацію
          # чи CI, а НЕ Lisp, SENS, Zig, Rust, домени або корпус конкурсу.
          # Інакше обов'язкові новий mint, Zig inverse і SENS execution.
          for attempt in 1 2 3 4 5 6; do
            if git push origin "HEAD:$target_branch"; then
              echo "REMINT_PUBLISHED attempt=$attempt"
              published=1
              break
            fi
            echo "REMINT_MAIN_ADVANCED attempt=$attempt: exact remote ref changed" >&2
            if (( attempt == 6 )); then break; fi
            git fetch origin "$target_branch"
            verified_parent="$(git rev-parse HEAD^)"
            safe_rebase=1
            # Новий незалежний lib/list Lisp не змінює байтів раніше
            # нативно перевіреного корпусу. Перевіримо ЙОГО SENS/Zig
            # після fast-rebase замість 80-секундного повного пересуду.
            fast_mint_sources=()
            # Не перезапускати повний SENS суд за НОВОГО незалежного
            # конкурсанта без фізичної пари: він потрапить у наступний mint.
            # Але M/D/R Lisp, SENS/Zig/Rust, реєстри й фізичні байти
            # ЗАВЖДИ потребують re-mint на новому exact main.
            # core.quotePath=false зберігає справжні D7/укр назви.
            while IFS= read -r changed; do
              [[ -n "$changed" ]] || continue
              case "$changed" in
                docs/*.md|benchmarks/contest-uk/RESULTS.md|.github/workflows/*.yml|.github/workflows/*.yaml)
                  ;;
                crates/sens/tests/*.rs|crates/sens-cli/tests/*.rs|crates/xtask/tests/*.rs|tests/*.py)
                  # Тести Python, як і Rust integration tests, не входять у
                  # sens/sens-trit runtime та не визначають семантики SENS.
                  # Їхні окремі перевірки виконує CI; для попередньо
                  # доведених SENS/Zig пар не потрібен повторний native judge.
                  # Rust src, Zig, Lisp та фізичні .sens і далі вимагають remint.
                  ;;
                benchmarks/contest-uk/*.lisp)
                  # Новий, незалежний кандидат без носія не може змінити
                  # вже доведених фізичних байтів решти учасників.
                  # НЕ зараховуємо новий Lisp виконаним чи переможцем.
                  # Пошкоджену/змінену програму, її .sens/view або кандидата
                  # із поточної перевірки обов'язково перевіряти знову.
                  if grep -Fxq -- "$changed" "$RUNNER_TEMP/sens-remint-candidates.list" ||
                     ! git -c core.quotePath=false diff --diff-filter=A --name-only "$verified_parent" "origin/$target_branch" -- "$changed" | grep -Fxq -- "$changed" ||
                     git cat-file -e "origin/$target_branch:${changed%.lisp}.sens" 2>/dev/null ||
                     git cat-file -e "origin/$target_branch:${changed%.lisp}" 2>/dev/null; then
                    echo "REMINT_CONTESTANT_CHANGED source=$changed mint=REVERIFY_CURRENT_MAIN"
                    safe_rebase=0
                    break
                  fi
                  # Після concurrency-cancel нового конкурсанта не губити:
                  # перевірити його на ЦЬОМУ HEAD нативним SENS/Zig,
                  # без оголошення переможцем до окремого judge.
                  fast_mint_sources+=("$changed")
                  REMINT_CONTEST=true
                  echo "REMINT_FAST_NATIVE_NEW_CONTESTANT source=$changed status=PENDING_REAL_SENS_ZIG winner=NOT_JUDGED"
                  ;;
                lib/d11-*.lisp|lib/meta-eval-first-class.lisp|lib/list-*.lisp|lib/*-д1.lisp|lib/tree-*.lisp|tests/semantic/*.lisp|tests/fixtures/*.lisp)
                  # Перемайн лише коли змінилося ВИКОРИСТАНЕ джерело.
                  # Самостійна зміна іншого Lisp не міняє вже перевірених
                  # SENS/Zig байтів: потрібні той самий сенсовий runtime,
                  # кандидати та binding-source. Усі зміни .sens, Zig,
                  # Rust runtime, core і доменів обробляє fail-closed case *.
                  # При M/D/R від поточного кандидата — завжди native remint.
                  # Вилучені джерела й відомий binding-source теж fail-closed.
                  if grep -Fxq -- "$changed" "$RUNNER_TEMP/sens-remint-candidates.list" ||
                     [[ "$changed" == lib/d11-srfi1-span-break.lisp ]] ||
                     ! git cat-file -e "origin/$target_branch:$changed" 2>/dev/null; then
                    safe_rebase=0; break
                  fi
                  # Новий незалежний Lisp не можна пропустити після
                  # fast-rebase: очікуваний queued workflow міг бути
                  # скасований, а push через GITHUB_TOKEN не породить
                  # наступного запуску. Перевірити фізичну трійку саме
                  # на поточному remote/main.
                  case "$changed" in
                    lib/d11-*.lisp|lib/meta-eval-first-class.lisp|lib/list-*.lisp|lib/*-д1.lisp|lib/tree-*.lisp|tests/semantic/*.lisp)
                      candidate_pair="${changed%.lisp}.sens"
                      candidate_view="${changed%.lisp}"
                      if ! git cat-file -e "origin/$target_branch:$candidate_pair" 2>/dev/null ||
                         ! git cat-file -e "origin/$target_branch:$candidate_view" 2>/dev/null; then
                        # Тільки незалежний НОВИЙ бібліотечний файл,
                        # без фізичних супутників та зміни інших runtime inputs.
                        # Всі M/D/R, D11 та tests/semantic лишаються fail-closed.
                        if [[ "$changed" == lib/list-*.lisp || "$changed" == lib/*-д1.lisp ]] &&
                           git -c core.quotePath=false diff --diff-filter=A --name-only "$verified_parent" "origin/$target_branch" -- "$changed" | grep -Fxq -- "$changed" &&
                           ! git cat-file -e "origin/$target_branch:$candidate_pair" 2>/dev/null &&
                           ! git cat-file -e "origin/$target_branch:$candidate_view" 2>/dev/null; then
                          fast_mint_sources+=("$changed")
                          echo "REMINT_FAST_NATIVE_NEW_LIB source=$changed status=PENDING_REAL_SENS_ZIG"
                          continue
                        fi
                        echo "REMINT_NEW_UNPAIRED_LISP source=$changed mint=REVERIFY_CURRENT_MAIN"
                        safe_rebase=0
                        break
                      fi
                      candidate_source_commit="$(git log -1 --format=%H "origin/$target_branch" -- "$changed")"
                      candidate_pair_commit="$(git log -1 --format=%H "origin/$target_branch" -- "$candidate_pair")"
                      if [[ -z "$candidate_source_commit" || -z "$candidate_pair_commit" ]] ||
                         ! git merge-base --is-ancestor "$candidate_source_commit" "$candidate_pair_commit"; then
                        echo "REMINT_NEW_DRIFTED_LISP source=$changed mint=REVERIFY_CURRENT_MAIN"
                        safe_rebase=0
                        break
                      fi
                      ;;
                  esac
                  echo "REMINT_UNRELATED_LISP source=$changed verified_candidates=UNCHANGED"
                  ;;
                lib/*.lisp)
                  # Лише цілком НОВИЙ незалежний Lisp без носія:
                  # попередній перевірений фізичний код не містить його.
                  # Заміни, rename, залежності поточного пакета й готові
                  # трійки — тільки через повне SENS/Zig повторне виконання.
                  # Після fast-rebase джерело ОБОВ'ЯЗКОВО майниться,
                  # перевіряється Zig inverse та SENS paired/standalone.
                  if grep -Fxq -- "$changed" "$RUNNER_TEMP/sens-remint-candidates.list" ||
                     ! git -c core.quotePath=false diff --diff-filter=A --name-only "$verified_parent" "origin/$target_branch" -- "$changed" | grep -Fxq -- "$changed" ||
                     git cat-file -e "origin/$target_branch:${changed%.lisp}.sens" 2>/dev/null ||
                     git cat-file -e "origin/$target_branch:${changed%.lisp}" 2>/dev/null; then
                    safe_rebase=0
                    break
                  fi
                  fast_mint_sources+=("$changed")
                  echo "REMINT_FAST_NATIVE_NEW_ROOT_LIB source=$changed status=PENDING_REAL_SENS_ZIG"
                  ;;
                *) safe_rebase=0; break ;;
              esac
            done < <(git -c core.quotePath=false diff --name-only "$verified_parent" origin/$target_branch)
            if (( safe_rebase )) &&
               git merge-base --is-ancestor "$verified_parent" origin/$target_branch; then
              if git rebase origin/$target_branch; then
                # Ніяких вгаданих T5M: кожен новий lib/list отримує
                # справжній mint + exact Zig inverse + SENS paired/standalone.
                fast_mint_failed=0
                for independent in "${fast_mint_sources[@]}"; do
                  if ! bash scripts/refresh-verified-t5m-pair.sh "$independent" target/debug/sens target/debug/sens-trit; then
                    echo "::error::REMINT_FAST_NATIVE_RED source=$independent" >&2
                    fast_mint_failed=1
                  fi
                done
                if (( ! fast_mint_failed )); then
                  if (( ${#fast_mint_sources[@]} )); then
                    for independent in "${fast_mint_sources[@]}"; do
                      git add -- "$independent" "${independent%.lisp}.sens" "${independent%.lisp}"
                    done
                    git commit --amend --no-edit
                  fi
                  echo "REMINT_SAFE_FAST_REBASE attempt=$attempt verified_inputs=UNCHANGED new_native=${#fast_mint_sources[@]}"
                  continue
                fi
                # Після адресного RED не переносимо жодних неперевірених
                # байтів: нижче існуючий повний native remint на exact main.
              fi
              # Конфлікт не вирішувати силоміць: перейти на native remint.
              git rebase --abort || true
            fi
            echo "REMINT_REVERIFY_REQUIRED attempt=$attempt reason=semantic_or_source_delta"
            # Це тільки епізодичний workspace Actions, НЕ перепис історії
            # remote/main. Старий mint відкидається і перевіряється знову.
            git reset --hard origin/$target_branch
            # Кожний новий main має отримати свій справжній SENS binary:
            # ніколи не перевіряти поточний Lisp за старим виконуваним кодом.
            cargo build --locked -p sens-cli --bin sens --bin sens-trit --bin lisp-data-schema-guard --features benchmark-ast-visits
            regenerate_on_current_main
            # Ознаку успішного відновлення дозволено лише після
            # нативного remint і суду на новому main. Старий RED не є
            # чинним, якщо цей самий source уже виправлено та перевірено.
            recovered_on_current_main=1
            commit_result=0
            commit_verified_changes || commit_result=$?
            case "$commit_result" in
              0) ;;
              1) echo "REMINT_ALREADY_PUBLISHED_EXACT on-current-main"; published=1; break ;;
              *) echo "::error::REMINT_NATIVE_COMMIT_FAILED status=$commit_result" >&2; exit "$commit_result" ;;
            esac
          done
          if (( ! published )); then
            echo "::error::REMINT_PUBLISH_RACE after 6 verified attempts; newer main must retry natively; no force push" >&2
            exit 1
          fi
          if (( regenerated_failed )); then
            echo "::error::REMINT_RECOVERY_NATIVE_RED, already verified pairs kept" >&2
            exit 1
          fi
          if (( recovered_on_current_main )); then
            echo "recovered=true" >> "$GITHUB_OUTPUT"
            echo "REMINT_CURRENT_MAIN_NATIVE_RECOVERED sha=$(git rev-parse HEAD) verified=YES"
          fi
          published_sha="$(git rev-parse HEAD)"
          echo "published_sha=$published_sha" >> "$GITHUB_OUTPUT"
          echo "REMINT_PUBLISHED_EXACT_SHA=$published_sha"

      # Показуємо реальний залишок трійок після нативного ремонту.
      # Це облік фізичних файлів; він не оголошує мовний закон доведеним.
      - name: Зафіксувати адресні відмови після публікації справних пар
        if: steps.remint.outputs.failed == 'true' && steps.published_pairs.outputs.recovered != 'true'
        run: |
          echo "::error::SENS native mint має адресні RED, не виправлені на новому main; справні трійки збережено" >&2
          exit 1
