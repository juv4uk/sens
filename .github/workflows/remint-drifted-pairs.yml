name: remint-drifted-pairs

# Перемайн дрейфуючих фізичних пар .lisp<->.sens КАНОНІЧНИМ Zig/T5M.
# Використовує той самий reader/writer, що CI (scripts/refresh-verified-t5m-pair.sh),
# і комітить лише ті пари, чиї байти справді змінилися.
on:
  # Новий україномовний учасник конкурсу одразу отримує фізичну пару
  # від SENS/Zig, без ручного workflow_dispatch і зовнішнього оракула.
  push:
    paths:
      - "benchmarks/contest-uk/*.lisp"
      - "lib/list-*.lisp"
      - "lib/interleave-pairs.lisp"
      - "lib/tree-*.lisp"
      - "lib/d11-*.lisp"
      - "tests/semantic/*.lisp"
      - "lib/reverse-three.lisp"
      - "lib/axioms-d1-principle-five.lisp"
      - "lib/core*.lisp"
      - "lib/island-lowering.lisp"
      - "lib/life-1-scheduler.lisp"
      - "lib/machine/projection/x86-64.lisp"
      - "lib/machine/lowering/semantic-x86-64.lisp"
      - ".github/workflows/remint-drifted-pairs.yml"
  workflow_dispatch:
    inputs:
      files:
        description: "newline-separated .lisp sources (default: .lisp of .sens added in recent history)"
        required: false
        default: ""

permissions:
  contents: write

# Останній push охоплює всі ще не обернуті та відсталі .lisp нижче.
# Не тримати десятки застарілих build: один native remint на чинному main.
concurrency:
  group: remint-queued-v2-${{ github.ref }}
  cancel-in-progress: false
  queue: single

jobs:
  remint:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/install-zig
      - uses: dtolnay/rust-toolchain@1.99.0

      - name: Build SENS binaries (sens + sens-trit)
        run: cargo build --locked -p sens-cli --bin sens --bin sens-trit --features benchmark-ast-visits

      - name: Remint pairs via canonical Zig T5M
        id: remint
        env:
          FILES: ${{ inputs.files }}
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -uo pipefail
          list="$FILES"
          if [[ "$EVENT_NAME" == push ]]; then
            # Лише реально додані/змінені .lisp у цьому push, не весь
            # історичний список. Видалені під час promotion не перемайнювати.
            if [[ "$BEFORE" =~ ^0+$ ]]; then
              list="$(git -c core.quotePath=false diff-tree --no-commit-id --diff-filter=AM --name-only -r HEAD -- 'benchmarks/contest-uk/*.lisp' 'lib/core*.lisp' 'lib/list-*.lisp' 'lib/interleave-pairs.lisp' 'lib/tree-*.lisp' 'lib/d11-*.lisp' 'tests/semantic/*.lisp' 'lib/reverse-three.lisp' 'lib/axioms-d1-principle-five.lisp' 'lib/life-1-scheduler.lisp' 'lib/machine/projection/x86-64.lisp' 'lib/machine/lowering/semantic-x86-64.lisp' ':(exclude)lib/core2.lisp' ':(exclude)lib/core-math.lisp')"
            else
              list="$(git -c core.quotePath=false diff --diff-filter=AM --name-only "$BEFORE" "$AFTER" -- 'benchmarks/contest-uk/*.lisp' 'lib/core*.lisp' 'lib/list-*.lisp' 'lib/interleave-pairs.lisp' 'lib/tree-*.lisp' 'lib/d11-*.lisp' 'tests/semantic/*.lisp' 'lib/reverse-three.lisp' 'lib/axioms-d1-principle-five.lisp' 'lib/life-1-scheduler.lisp' 'lib/machine/projection/x86-64.lisp' 'lib/machine/lowering/semantic-x86-64.lisp' ':(exclude)lib/core2.lisp' ':(exclude)lib/core-math.lisp')"
            fi
            # Зміна самого SENS-нижувача потребує перевірки його
            # СПОЖИВАЧА навіть коли вихідний свідок і байти ще не змінювались.
            # Не намагатись виконати бібліотеку як невідомий текстовий виклик.
            if [[ "$BEFORE" =~ ^0+$ ]]; then
              island_change="$(git -c core.quotePath=false diff-tree --no-commit-id --name-only -r HEAD -- lib/island-lowering.lisp)"
            else
              island_change="$(git -c core.quotePath=false diff --name-only "$BEFORE" "$AFTER" -- lib/island-lowering.lisp)"
            fi
            if [[ -n "$island_change" ]] &&
               ! printf '%s\n' "$list" | grep -Fxq 'tests/fixtures/island-lowering-1048-witness.lisp'; then
              list="$(printf '%s\n%s' "$list" 'tests/fixtures/island-lowering-1048-witness.lisp')"
              echo "REMINT_ISLAND_BINDING_CHANGED test=tests/fixtures/island-lowering-1048-witness.lisp"
            fi
            # Не передавати нативному mint незмінні описи принципів:
            # core2 і core-math складаються тільки з коментарів, не є програмами.
            # Git pathspec виключає їх з push-дифа, а реальні core1/core3/core4
            # залишає без змін для предметного нативного виконання.
            # Універсальний diff нижче як і раніше бере реальну зміну core4.
            # Але Core2 є описом профілю, а Core4 без пари не повинен
            # повторно ламати кожен незалежний запуск remint.
            # Не втрачати непарні програми після скасованого queued run.
            # Змінений конкурсний .lisp уже є у git diff вище, навіть якщо
            # стара .sens ще існує. Не перемайнювати незмінені повні трійки
            # при кожному незалежному push: це відтягує обернення нових Lisp.
            # Джерело без .sens або view залишається в черзі; нативний
            # суддя як і раніше відхиляє drift та хибне виконання.
            for source in benchmarks/contest-uk/*.lisp lib/core1.lisp lib/core3.lisp lib/list-*.lisp lib/interleave-pairs.lisp lib/tree-*.lisp lib/d11-*.lisp tests/semantic/d9-four-uk-projections-laws.lisp tests/semantic/repl-uk-queue-law.lisp tests/semantic/repl-uk-queue-mutant.lisp lib/reverse-three.lisp lib/axioms-d1-principle-five.lisp lib/life-1-scheduler.lisp lib/machine/projection/x86-64.lisp lib/machine/lowering/semantic-x86-64.lisp; do
              [[ -f "$source" && ! -L "$source" ]] || continue
              pair="${source%.lisp}.sens"
              view="${source%.lisp}"
              [[ ! -f "$pair" || -L "$pair" || ! -f "$view" || -L "$view" ]] || continue
              if ! printf '%s\n' "$list" | grep -Fxq -- "$source"; then
                list="$(printf '%s\n%s' "$list" "$source")"
              fi
            done
            # Git визначає лише джерела для повторного рідного mint.
            # Не плутати цей список із доказом оборотності чи виконання.
            # Повертаємо не лише конкурс, а й D11/list/tree, коли
            # проміжний queued push було замінено найновішим.
            if [[ "$EVENT_NAME" == push ]]; then
              for source in benchmarks/contest-uk/*.lisp lib/core1.lisp lib/core3.lisp lib/list-*.lisp lib/interleave-pairs.lisp lib/tree-*.lisp lib/d11-*.lisp tests/semantic/d9-four-uk-projections-laws.lisp tests/semantic/repl-uk-queue-law.lisp tests/semantic/repl-uk-queue-mutant.lisp lib/reverse-three.lisp lib/axioms-d1-principle-five.lisp lib/life-1-scheduler.lisp lib/machine/projection/x86-64.lisp lib/machine/lowering/semantic-x86-64.lisp; do
                [[ -f "$source" && ! -L "$source" ]] || continue
                pair="${source%.lisp}.sens"
                view="${source%.lisp}"
                [[ -s "$pair" && -f "$view" && ! -L "$pair" && ! -L "$view" ]] || continue
                source_commit="$(git log -1 --format=%H -- "$source")"
                pair_commit="$(git log -1 --format=%H -- "$pair")"
                if [[ -n "$source_commit" && -n "$pair_commit" ]] &&
                   ! git merge-base --is-ancestor "$source_commit" "$pair_commit"; then
                  if ! printf '%s\n' "$list" | grep -Fxq -- "$source"; then
                    list="$(printf '%s\n%s' "$list" "$source")"
                    echo "REMINT_SOURCE_NEWER_THAN_PAIR source=$source"
                  fi
                fi
              done
            fi
          fi
          # Не судити за git-дата/наявністю файла: точний T5M визначають
          # тільки чинний SENS mint та Zig view. Перевірити кожну
          # активну конкурсну трійку (в т. ч. незмінений НСД), щоб
          # пропущений дрейф негайно став кандидатом на справжній remint.
          if [[ "$EVENT_NAME" == push ]]; then
            for source in benchmarks/contest-uk/*.lisp lib/axioms-d1-principle-five.lisp lib/machine/lowering/semantic-x86-64.lisp; do
              [[ -f "$source" && ! -L "$source" ]] || continue
              if printf '%s\n' "$list" | grep -Fxq -- "$source"; then
                continue
              fi
              pair="${source%.lisp}.sens"
              view="${source%.lisp}"
              [[ -s "$pair" && -f "$view" && ! -L "$pair" && ! -L "$view" ]] || continue
              # CLI SENS допускає ціль ЛИШЕ *.sens; mktemp без суфікса
              # завжди давав помилковий RED для кожного справного Lisp.
              probe_dir="$(mktemp -d "$RUNNER_TEMP/sens-native-mint.XXXXXX")"
              probe="$probe_dir/program.sens"
              drift=0
              if ! target/debug/sens --t5m-mint "$source" "$probe" >/dev/null; then
                echo "REMINT_MINT_PROBE_RED source=$source"
                drift=1
              elif ! cmp -s "$probe" "$pair"; then
                echo "REMINT_PHYSICAL_DRIFT source=$source"
                drift=1
              elif ! target/debug/sens-trit view "$pair" | cmp -s - "$view"; then
                echo "REMINT_VIEW_DRIFT source=$source"
                drift=1
              fi
              rm -rf -- "$probe_dir"
              if (( drift )); then
                list="$(printf '%s\n%s' "$list" "$source")"
              fi
            done
          fi
          # PR не успадковує чужий незакритий remint-борг з main.
          # Власний diff до main — єдині джерела, які PR може публікувати.
          if [[ "$EVENT_NAME" == push && "$GITHUB_REF" != refs/heads/main ]]; then
            git rev-parse --verify refs/remotes/origin/main >/dev/null
            list="$(git -c core.quotePath=false diff --diff-filter=AM --name-only origin/main HEAD -- 'benchmarks/contest-uk/*.lisp' 'lib/core*.lisp' 'lib/list-*.lisp' 'lib/interleave-pairs.lisp' 'lib/tree-*.lisp' 'lib/d11-*.lisp' 'tests/semantic/*.lisp' 'lib/reverse-three.lisp' 'lib/axioms-d1-principle-five.lisp' 'lib/life-1-scheduler.lisp' 'lib/machine/projection/x86-64.lisp' 'lib/machine/lowering/semantic-x86-64.lisp' ':(exclude)lib/core2.lisp' ':(exclude)lib/core-math.lisp')"
            echo "REMINT_PR_SOURCE_SCOPE branch=$GITHUB_REF base=origin/main"
          fi
          if [ -z "$list" ] && [[ "$EVENT_NAME" != push ]]; then
            if [ -f scripts/remint-drifted-pairs.txt ]; then
              list="$(grep -vE '^[[:space:]]*(#|$)' scripts/remint-drifted-pairs.txt)"
            else
              list="$(git log --diff-filter=A --name-only -n 600 -- '*.sens' | grep '\.sens$' | sed 's/\.sens$/.lisp/' | sort -u)"
            fi
          fi
          # Джерела для відтворення на новому exact main, якщо інші агенти
          # посунули HEAD до публікації. Не зберігати готові старі байти.
          printf '%s\n' "$list" > "$RUNNER_TEMP/sens-remint-candidates.list"
          # Судити конкурс лише після конкурсанта, не кожного lib/list/tree.
          # Факт категорії визначає реальний змінений/непарний шлях, не JSON.
          if printf '%s\n' "$list" | grep -Eq '^benchmarks/contest-uk/[^[:space:]]+\.lisp$'; then
            echo "contest=true" >> "$GITHUB_OUTPUT"
          else
            echo "contest=false" >> "$GITHUB_OUTPUT"
          fi
          echo "candidates:"; printf '%s\n' "$list" | sed '/^$/d' | wc -l
          # Журнал тільки справді виконаних нативних джерел переживе
          # перемикання ephemeral checkout на свіжий main у кроці публікації.
          : > "$RUNNER_TEMP/sens-remint-success.txt"
          ok=0; skip=0
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            if [ ! -f "$f" ]; then
              # Переможець вже фізично перенесений до історії конкурсу.
              # Це не зламана SENS-програма й не причина губити успішні mint.
              case "$f" in
                benchmarks/contest-uk/*.lisp)
                  old="benchmarks/contest-uk/superseded/${f##*/}"
                  if [[ -f "$old" && ! -L "$old" ]]; then
                    echo "MOVED_TO_SUPERSEDED $f -> $old"
                    continue
                  fi;;
              esac
              echo "MISSING $f"; skip=$((skip+1)); continue
            fi
            # Коментарний файл — опис, не виконуваний Lisp. Навіть старий
            # queued/rebase список не має майнити порожню програму:
            # T5M_REPL_EMPTY тут є хибним адміністративним RED.
            # Symlink і реальне джерело з формами НЕ обходити.
            # Схемний реєстр сайтів є інвентарем, а не виконуваним Lisp.
            # Перевіряємо і точний шлях, і форму даних: зміна на програму
            # не може бути непомітно пропущена.
            if [[ "$f" == knowledge/silent-fallback-inventory.lisp && ! -L "$f" ]] &&
               LC_ALL=C grep -Eq '^[[:space:]]*\(silent-fallback-inventory([[:space:]]|$)' -- "$f"; then
              echo "REMINT_DATA_ONLY source=$f classification=SCHEMA_INVENTORY"
              continue
            fi
            if [[ ! -L "$f" ]] &&
               ! LC_ALL=C grep -Eq '^[[:space:]]*[^[:space:];]' -- "$f"; then
              echo "REMINT_DATA_ONLY source=$f classification=COMMENT_ONLY"
              continue
            fi
            # Пари може ще не бути — refresh створює її канонічно (mint + view).
            bs=()
            case "$f" in
              lib/reason.lisp|lib/forward.lisp) bs=(--binding-source lib/unify.lisp);;
              lib/d11-clojure-partition-by.lisp) bs=(--binding-source lib/d11-srfi1-span-break.lisp);;
              lib/narrate.lisp) bs=(--binding-source lib/unify.lisp --binding-source lib/reason.lisp);;
              lib/result-status.lisp) bs=(--binding-source lib/unify.lisp --binding-source lib/knowledge.lisp --binding-source lib/reason.lisp);;
              lib/translation.lisp) bs=(--binding-source lib/unify.lisp --binding-source lib/knowledge.lisp --binding-source lib/reason.lisp --binding-source lib/world.lisp --binding-source lib/yantra.lisp --binding-source lib/result-status.lisp);;
              tests/fixtures/mechanism-selector-1047-witness.lisp) bs=(--binding-source lib/mechanism-selector.lisp);;
              tests/fixtures/island-lowering-1048-witness.lisp) bs=(--binding-source lib/mechanism-selector.lisp --binding-source lib/island-lowering.lisp);;
              tests/semantic/d9-world-shape-module-events-laws.lisp|tests/semantic/world-exact-arity-witness.lisp) bs=(--binding-source lib/world.lisp);;
            esac
            if bash scripts/refresh-verified-t5m-pair.sh "$f" target/debug/sens target/debug/sens-trit "${bs[@]}"; then
              ok=$((ok+1))
              printf '%s\n' "$f" >> "$RUNNER_TEMP/sens-remint-success.txt"
            else
              echo "SKIP_FAIL $f"; skip=$((skip+1))
              if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
                printf -- '- SKIP_FAIL `%s`\n' "$f" >> "$GITHUB_STEP_SUMMARY"
              fi
            fi
          done <<< "$list"
          echo "remint done ok=$ok skip=$skip"
          if (( skip != 0 )); then
            echo "failed=true" >> "$GITHUB_OUTPUT"
            echo "::error::Нативний SENS/Zig відхилив $skip конкретних джерел; успішні фізичні пари все одно буде опубліковано" >&2
          else
            echo "failed=false" >> "$GITHUB_OUTPUT"
          fi

      # Один нативний суд одночасно перевіряє всі фізичні програми
      # й друкує CONTEST_NATIVE_VERIFIED_EXECUTABLES. Другий повний
      # count-executable-lisp до push дублював SENS/Zig виконання,
      # витрачав час та програвав гонку main без нового доказу.
      # Адресний повний облік залишається у scripts/count-executable-lisp.sh.
      # RED одного кандидата не затримує конкурс уже доведених трійок.
      # Наприкінці workflow справжня відмова mint лишається червоною.
      - name: Нативне суддівство і просування справжніх переможців
        id: contest_judge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.remint.outputs.contest == 'true'
        run: bash benchmarks/contest-uk/promote.sh

      - name: Commit refreshed pairs (only real byte changes)
        id: published_pairs
        # Публікація тільки реальних SENS/Zig пар; суперечливий або старий
        # фізичний код не перебазовувати поверх свіжої української програми.
        # Після гонки refs заново майнити джерела на актуальному main.
        if: ${{ !cancelled() && steps.remint.outcome == 'success' }}
        env:
          REMINT_CONTEST: ${{ steps.remint.outputs.contest }}
          REMINT_GITHUB_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          # Native proof повертається виключно до ref, який його запустив.
          # Короткоживуча агентська гілка ніколи не записує свій T5M у main.
          case "$REMINT_GITHUB_REF" in
            refs/heads/*) target_branch="${REMINT_GITHUB_REF#refs/heads/}" ;;
            *) echo "::error::REMINT_TARGET_NOT_BRANCH ref=$REMINT_GITHUB_REF" >&2; exit 2 ;;
          esac
          echo "REMINT_TARGET_BRANCH branch=$target_branch"
          git config user.name "sens-remint-bot"
          git config user.email "sens-remint-bot@users.noreply.github.com"
          prune_archived_duplicates() {
            local physical stem archive
            for physical in benchmarks/contest-uk/*.sens; do
              [[ -f "$physical" && ! -L "$physical" ]] || continue
              stem="${physical%.sens}"
              [[ ! -e "$stem.lisp" && ! -L "$stem.lisp" ]] || continue
              archive="benchmarks/contest-uk/superseded/${stem##*/}"
              if [[ -f "$stem" && ! -L "$stem" &&
                    -f "$archive.lisp" && ! -L "$archive.lisp" &&
                    -f "$archive.sens" && ! -L "$archive.sens" &&
                    -f "$archive" && ! -L "$archive" ]] &&
                 cmp -s "$physical" "$archive.sens" &&
                 cmp -s "$stem" "$archive"; then
                rm -- "$physical" "$stem"
                echo "REMINT_PRUNED_ARCHIVED_DUPLICATE stem=$stem exact_blobs=YES"
              fi
            done
          }
          commit_verified_changes() {
            if [[ "$target_branch" == main ]]; then
              prune_archived_duplicates
              git add -A
            else
              # У PR публікуємо виключно дві проєкції тих джерел,
              # що пройшли реальний SENS/Zig; інші зміни не підхоплюємо.
              local verified pair view
              while IFS= read -r verified; do
                [[ "$verified" == *.lisp ]] || continue
                pair="${verified%.lisp}.sens"
                view="${verified%.lisp}"
                if [[ ! -f "$pair" || ! -f "$view" || -L "$pair" || -L "$view" ]]; then
                  echo "::error::REMINT_VERIFIED_PAIR_MISSING source=$verified" >&2
                  return 2
                fi
                git add -- "$pair" "$view"
              done < "$RUNNER_TEMP/sens-remint-success.txt"
            fi
            if git diff --cached --quiet; then
              echo "REMINT_ALREADY_CURRENT no-byte-changes"
              return 1
            fi
            git commit -m "ремонт пар: канонічні SENS/Zig T5M на актуальному main"
          }
          regenerate_on_current_main() {
            # Стан відмови — тільки поточної перевірки exact main.
            # Якщо наступний rebase уже містить виправлення, старий RED
            # не переживає новий успішний SENS/Zig remint.
            # RED належить саме цьому актуальному SHA. Стара помилка у
            # попередній спробі не переживає нативного ремонту нової версії.
            regenerated_failed=0
            local f old source
            local -a bs
            # Після чергового push у main могли з'явитися нові конкурсанти.
            # Не судити їх за старим T5M: додати в той самий нативний
            # маршрут mint → Zig inverse → paired/standalone SENS.
            # Після паралельного оновлення перевірити й дрейфуючі трійки,
            # а не лишати їх новим непоясненим RED під час judge.
            # Новий незалежний конкурсант міг з'явитися, коли workflow
            # уже майнив старий HEAD. Push від GITHUB_TOKEN не запускає
            # наступний push-workflow: забираємо його в поточний native mint.
            for source in benchmarks/contest-uk/*.lisp; do
              [[ "$target_branch" == main ]] || break
              [[ -f "$source" && ! -L "$source" ]] || continue
              pair="${source%.lisp}.sens"
              view="${source%.lisp}"
              needs_pair=0
              if [[ ! -s "$pair" || ! -f "$view" ||
                    -L "$pair" || -L "$view" ]]; then
                needs_pair=1
              else
                source_commit="$(git log -1 --format=%H -- "$source")"
                pair_commit="$(git log -1 --format=%H -- "$pair")"
                if [[ -n "$source_commit" && -n "$pair_commit" ]] &&
                   ! git merge-base --is-ancestor "$source_commit" "$pair_commit"; then
                  needs_pair=1
                fi
              fi
              if (( needs_pair )); then
                REMINT_CONTEST=true
                if ! grep -Fxq -- "$source" "$RUNNER_TEMP/sens-remint-candidates.list"; then
                  printf '%s\n' "$source" >> "$RUNNER_TEMP/sens-remint-candidates.list"
                  echo "REMINT_RECOVER_CONTEST_SOURCE source=$source"
                fi
              fi
            done
            # Якщо попередні queued push скасовано, після rebase потрібно
            # забрати й нові бібліотечні Lisp. Інакше незмінений старий
            # кандидат-список ніколи не помітить їхні відсутні T5M пари.
            # Тільки непарні або новіші за носій: без масового перемайну.
            for source in lib/core1.lisp lib/core3.lisp lib/list-*.lisp lib/interleave-pairs.lisp lib/tree-*.lisp lib/d11-*.lisp tests/semantic/d9-four-uk-projections-laws.lisp tests/semantic/repl-uk-queue-law.lisp tests/semantic/repl-uk-queue-mutant.lisp lib/reverse-three.lisp lib/axioms-d1-principle-five.lisp lib/life-1-scheduler.lisp lib/machine/projection/x86-64.lisp lib/machine/lowering/semantic-x86-64.lisp; do
              [[ "$target_branch" == main ]] || break
              [[ -f "$source" && ! -L "$source" ]] || continue
              pair="${source%.lisp}.sens"
              view="${source%.lisp}"
              needs_pair=0
              if [[ ! -s "$pair" || ! -f "$view" ||
                    -L "$pair" || -L "$view" ]]; then
                needs_pair=1
              else
                source_commit="$(git log -1 --format=%H -- "$source")"
                pair_commit="$(git log -1 --format=%H -- "$pair")"
                if [[ -n "$source_commit" && -n "$pair_commit" ]] &&
                   ! git merge-base --is-ancestor "$source_commit" "$pair_commit"; then
                  needs_pair=1
                fi
              fi
              if (( needs_pair )) &&
                 ! grep -Fxq -- "$source" "$RUNNER_TEMP/sens-remint-candidates.list"; then
                printf '%s\n' "$source" >> "$RUNNER_TEMP/sens-remint-candidates.list"
                echo "REMINT_RECOVER_LIBRARY_SOURCE source=$source"
              fi
            done
            while IFS= read -r f; do
              [[ -n "$f" ]] || continue
              if [[ ! -f "$f" ]]; then
                case "$f" in
                  benchmarks/contest-uk/*.lisp)
                    old="benchmarks/contest-uk/superseded/${f##*/}"
                    if [[ -f "$old" && ! -L "$old" ]]; then
                      echo "REMINT_ALREADY_ARCHIVED source=$f"
                      continue
                    fi ;;
                esac
                # Застарілий queued job міг бачити файл, який вже
                # вилучено/перейменовано іншим комітом main. Якщо повного
                # джерела та його фізичних виходів більше НЕМА, це не
                # помилка SENS. Наявність хоч одного осиротілого байтового
                # носія лишається RED і підхоплюється нативним судом.
                if [[ "$f" == *.lisp && ! -e "$f" && ! -L "$f" &&
                      ! -e "${f%.lisp}.sens" && ! -L "${f%.lisp}.sens" &&
                      ! -e "${f%.lisp}" && ! -L "${f%.lisp}" ]]; then
                  echo "REMINT_REMOVED_ON_CURRENT_MAIN source=$f stale_queue=YES"
                  continue
                fi
                echo "::error::REMINT_SOURCE_MISSING $f" >&2
                regenerated_failed=1
                continue
              fi
              # Перевірка повторюється після перемикання на новий main:
              # джерело могло стати суто описовим, не створюємо бутафорію.
              # Схемний реєстр сайтів є інвентарем, а не виконуваним Lisp.
              # Перевіряємо і точний шлях, і форму даних: зміна на програму
              # не може бути непомітно пропущена.
              if [[ "$f" == knowledge/silent-fallback-inventory.lisp && ! -L "$f" ]] &&
                 LC_ALL=C grep -Eq '^[[:space:]]*\(silent-fallback-inventory([[:space:]]|$)' -- "$f"; then
                echo "REMINT_CURRENT_MAIN_DATA_ONLY source=$f classification=SCHEMA_INVENTORY"
                continue
              fi
              if [[ ! -L "$f" ]] &&
                 ! LC_ALL=C grep -Eq '^[[:space:]]*[^[:space:];]' -- "$f"; then
                echo "REMINT_CURRENT_MAIN_DATA_ONLY source=$f classification=COMMENT_ONLY"
                continue
              fi
              bs=()
              case "$f" in
                lib/reason.lisp|lib/forward.lisp) bs=(--binding-source lib/unify.lisp);;
              lib/d11-clojure-partition-by.lisp) bs=(--binding-source lib/d11-srfi1-span-break.lisp);;
                lib/narrate.lisp) bs=(--binding-source lib/unify.lisp --binding-source lib/reason.lisp);;
                lib/result-status.lisp) bs=(--binding-source lib/unify.lisp --binding-source lib/knowledge.lisp --binding-source lib/reason.lisp);;
                lib/translation.lisp) bs=(--binding-source lib/unify.lisp --binding-source lib/knowledge.lisp --binding-source lib/reason.lisp --binding-source lib/world.lisp --binding-source lib/yantra.lisp --binding-source lib/result-status.lisp);;
                tests/fixtures/mechanism-selector-1047-witness.lisp) bs=(--binding-source lib/mechanism-selector.lisp);;
              tests/fixtures/island-lowering-1048-witness.lisp) bs=(--binding-source lib/mechanism-selector.lisp --binding-source lib/island-lowering.lisp);;
                tests/semantic/d9-world-shape-module-events-laws.lisp|tests/semantic/world-exact-arity-witness.lisp) bs=(--binding-source lib/world.lisp);;
              esac
              if ! bash scripts/refresh-verified-t5m-pair.sh "$f" target/debug/sens target/debug/sens-trit "${bs[@]}"; then
                echo "::error::REMINT_CURRENT_MAIN_NATIVE_FAILED $f" >&2
                regenerated_failed=1
              fi
            done < "$RUNNER_TEMP/sens-remint-candidates.list"
            # Перевірити дійсний конкурс уже на тих самих поточних джерелах.
            if [[ "$REMINT_CONTEST" == true ]]; then
              if ! bash benchmarks/contest-uk/promote.sh; then
                echo "::error::REMINT_CURRENT_MAIN_CONTEST_RED" >&2
                regenerated_failed=1
              fi
            fi
          }
          regenerated_failed=0
          recovered_on_current_main=0
          if ! commit_verified_changes; then
            exit 0
          fi
          published=0
          # При частих незалежних push перевірені фізичні T5M можуть
          # годинами програвати гонку refs: повний суд триває десятки секунд.
          # Швидкий rebase дозволений ЛИШЕ коли remote змінив документацію
          # чи CI, а НЕ Lisp, SENS, Zig, Rust, домени або корпус конкурсу.
          # Інакше обов'язкові новий mint, Zig inverse і SENS execution.
          for attempt in 1 2 3 4; do
            if git push origin "HEAD:$target_branch"; then
              echo "REMINT_PUBLISHED attempt=$attempt"
              published=1
              break
            fi
            echo "REMINT_MAIN_ADVANCED attempt=$attempt: exact remote ref changed" >&2
            if (( attempt == 4 )); then break; fi
            git fetch origin "$target_branch"
            verified_parent="$(git rev-parse HEAD^)"
            safe_rebase=1
            # Не перезапускати повний SENS суд за НОВОГО незалежного
            # конкурсанта без фізичної пари: він потрапить у наступний mint.
            # Але M/D/R Lisp, SENS/Zig/Rust, реєстри й фізичні байти
            # ЗАВЖДИ потребують re-mint на новому exact main.
            # core.quotePath=false зберігає справжні D7/укр назви.
            while IFS= read -r changed; do
              [[ -n "$changed" ]] || continue
              case "$changed" in
                docs/*.md|benchmarks/contest-uk/RESULTS.md|.github/workflows/*.yml|.github/workflows/*.yaml)
                  ;;
                crates/sens/tests/*.rs|crates/sens-cli/tests/*.rs|crates/xtask/tests/*.rs|tests/*.py)
                  # Тести Python, як і Rust integration tests, не входять у
                  # sens/sens-trit runtime та не визначають семантики SENS.
                  # Їхні окремі перевірки виконує CI; для попередньо
                  # доведених SENS/Zig пар не потрібен повторний native judge.
                  # Rust src, Zig, Lisp та фізичні .sens і далі вимагають remint.
                  ;;
                benchmarks/contest-uk/*.lisp)
                  # Без фізичної пари новий Lisp НЕ стає виконуваним від
                  # одного git rebase. Перейти до SENS/Zig на чинному SHA.
                  echo "REMINT_NEW_CONTESTANT source=$changed mint=REVERIFY_CURRENT_MAIN"
                  safe_rebase=0
                  break ;;
                lib/d11-*.lisp|lib/list-*.lisp|lib/tree-*.lisp|tests/semantic/*.lisp|tests/fixtures/*.lisp)
                  # Лише A незалежного джерела без фізичної пари:
                  # нова D11/list/tree форма чи незалежний Lisp-свідок не змінює
                  # вже перевірений фізичний вхід; candidate і M/D/R — remint.
                  # Зміни/вилучення M/D/R чи готові .sens — тільки re-mint.
                  if grep -Fxq -- "$changed" "$RUNNER_TEMP/sens-remint-candidates.list" ||
                     ! git -c core.quotePath=false diff --diff-filter=A --name-only "$verified_parent" origin/$target_branch -- "$changed" | grep -Fxq -- "$changed" ||
                     git cat-file -e "origin/$target_branch:${changed%.lisp}.sens" 2>/dev/null; then
                    safe_rebase=0; break
                  fi
                  echo "REMINT_NEW_INDEPENDENT_SOURCE source=$changed mint=NEXT_QUEUE"
                  ;;
                *) safe_rebase=0; break ;;
              esac
            done < <(git -c core.quotePath=false diff --name-only "$verified_parent" origin/$target_branch)
            if (( safe_rebase )) &&
               git merge-base --is-ancestor "$verified_parent" origin/$target_branch; then
              if git rebase origin/$target_branch; then
                echo "REMINT_SAFE_FAST_REBASE attempt=$attempt verified_inputs=UNCHANGED"
                continue
              fi
              # Конфлікт не вирішувати силоміць: перейти на native remint.
              git rebase --abort || true
            fi
            echo "REMINT_REVERIFY_REQUIRED attempt=$attempt reason=semantic_or_source_delta"
            # Це тільки епізодичний workspace Actions, НЕ перепис історії
            # remote/main. Старий mint відкидається і перевіряється знову.
            git reset --hard origin/$target_branch
            # Кожний новий main має отримати свій справжній SENS binary:
            # ніколи не перевіряти поточний Lisp за старим виконуваним кодом.
            cargo build --locked -p sens-cli --bin sens --bin sens-trit --features benchmark-ast-visits
            regenerate_on_current_main
            # Ознаку успішного відновлення дозволено лише після
            # нативного remint і суду на новому main. Старий RED не є
            # чинним, якщо цей самий source уже виправлено та перевірено.
            recovered_on_current_main=1
            if ! commit_verified_changes; then
              echo "REMINT_ALREADY_PUBLISHED_EXACT on-current-main"
              published=1
              break
            fi
          done
          if (( ! published )); then
            echo "::error::REMINT_PUBLISH_RACE after 4 verified attempts; newer main must retry natively; no force push" >&2
            exit 1
          fi
          if (( regenerated_failed )); then
            echo "::error::REMINT_RECOVERY_NATIVE_RED, already verified pairs kept" >&2
            exit 1
          fi
          if (( recovered_on_current_main )); then
            echo "recovered=true" >> "$GITHUB_OUTPUT"
            echo "REMINT_CURRENT_MAIN_NATIVE_RECOVERED sha=$(git rev-parse HEAD) verified=YES"
          fi

      # Не оголошувати GREEN, коли SENS відхилив джерело; але не губити
      # незалежні вже доведені Zig/T5M пари через одного конкурсанта.
      - name: Зафіксувати адресні відмови після публікації справних пар
        if: steps.remint.outputs.failed == 'true' && steps.published_pairs.outputs.recovered != 'true'
        run: |
          echo "::error::SENS native mint має адресні RED, не виправлені на новому main; справні трійки збережено" >&2
          exit 1
