name: remint-drifted-pairs

# Перемайн дрейфуючих фізичних пар .lisp<->.sens КАНОНІЧНИМ Zig/T5M.
# Використовує той самий reader/writer, що CI (scripts/refresh-verified-t5m-pair.sh),
# і комітить лише ті пари, чиї байти справді змінилися.
on:
  workflow_dispatch:
    inputs:
      files:
        description: "newline-separated .lisp sources (default: .lisp of .sens added in recent history)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  remint:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/install-zig
      - uses: dtolnay/rust-toolchain@stable

      - name: Build SENS binaries (sens + sens-trit)
        run: cargo build -p sens-cli --bin sens --bin sens-trit

      - name: Remint pairs via canonical Zig T5M
        env:
          FILES: ${{ inputs.files }}
        run: |
          set -uo pipefail
          list="$FILES"
          if [ -z "$list" ]; then
            if [ -f scripts/remint-drifted-pairs.txt ]; then
              list="$(grep -vE '^[[:space:]]*(#|$)' scripts/remint-drifted-pairs.txt)"
            else
              list="$(git log --diff-filter=A --name-only -n 600 -- '*.sens' | grep '\.sens$' | sed 's/\.sens$/.lisp/' | sort -u)"
            fi
          fi
          echo "candidates:"; printf '%s\n' "$list" | sed '/^$/d' | wc -l
          ok=0; skip=0
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            if [ ! -f "$f" ]; then echo "MISSING $f"; skip=$((skip+1)); continue; fi
            if [ ! -f "${f%.lisp}.sens" ]; then echo "UNPAIRED $f"; skip=$((skip+1)); continue; fi
            bs=()
            case "$f" in
              lib/reason.lisp|lib/forward.lisp) bs=(--binding-source lib/unify.lisp);;
              lib/narrate.lisp) bs=(--binding-source lib/unify.lisp --binding-source lib/reason.lisp);;
              lib/result-status.lisp) bs=(--binding-source lib/unify.lisp --binding-source lib/knowledge.lisp --binding-source lib/reason.lisp);;
              lib/translation.lisp) bs=(--binding-source lib/unify.lisp --binding-source lib/knowledge.lisp --binding-source lib/reason.lisp --binding-source lib/world.lisp --binding-source lib/yantra.lisp --binding-source lib/result-status.lisp);;
              tests/fixtures/mechanism-selector-1047-witness.lisp) bs=(--binding-source lib/surface/semantic-registry-api.lisp --binding-source lib/mechanism-selector.lisp);;
              tests/semantic/d9-world-shape-module-events-laws.lisp|tests/semantic/world-exact-arity-witness.lisp) bs=(--binding-source lib/world.lisp);;
            esac
            if bash scripts/refresh-verified-t5m-pair.sh "$f" target/debug/sens target/debug/sens-trit "${bs[@]}"; then
              ok=$((ok+1))
            else
              echo "SKIP_FAIL $f"; skip=$((skip+1))
            fi
          done <<< "$list"
          echo "remint done ok=$ok skip=$skip"

      - name: Commit refreshed pairs (only real byte changes)
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "sens-remint-bot"
          git config user.email "sens-remint-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no drift -- nothing to commit"
            exit 0
          fi

          # Комітити лише обидва похідні носії перевіреної Lisp-трійки.
          # Читач SENS і Zig відпрацювали у попередньому кроці; тут немає
          # власного Python/JSON-оракула або перекодування.
          mapfile -d '' paths < <(git diff --cached --name-only -z)
          sources=()
          for changed in "${paths[@]}"; do
            if [[ "$changed" == *.sens ]]; then
              source="${changed%.sens}.lisp"
            elif [[ -f "$changed.lisp" && -f "$changed.sens" ]]; then
              source="$changed.lisp"
            else
              echo "::error::REMINT_UNEXPECTED_CHANGE path=$changed" >&2
              exit 1
            fi
            if [[ ! -f "$source" || ! -f "${source%.lisp}.sens" || ! -f "${source%.lisp}" ]]; then
              echo "::error::REMINT_INCOMPLETE_TRIPLET source=$source" >&2
              exit 1
            fi
            sources+=("$source")
          done

          base="$(git rev-parse HEAD)"
          git commit -m "ремонт пар: перемайнено дрейфуючі .lisp<->.sens канонічним Zig T5M (refresh-verified-t5m-pair)"

          # На активному main простий git push часто відхиляється через
          # незалежні коміти інших агентів. Перебазувати можна лише коли
          # ті самі джерела/пари й сам SENS/Zig-маршрут не змінилися.
          # У разі drift потрібен новий нативний mint, а не force-push.
          for attempt in {1..12}; do
            git fetch --quiet origin main
            if ! git merge-base --is-ancestor "$base" origin/main; then
              echo "::error::REMINT_MAIN_DIVERGED old_base=$base" >&2
              exit 1
            fi
            for source in "${sources[@]}"; do
              if ! git diff --quiet "$base" origin/main --                   "$source" "${source%.lisp}.sens" "${source%.lisp}"; then
                echo "::error::REMINT_SOURCE_CHANGED source=$source; нативне карбування слід повторити на новому main" >&2
                exit 1
              fi
            done
            if ! git diff --quiet "$base" origin/main --                 crates/sens/src crates/sens-cli/src research/zig-codecs                 lib/domains scripts/refresh-verified-t5m-pair.sh                 .github/actions/install-zig; then
              echo "::error::REMINT_RUNTIME_CHANGED; нативне карбування слід повторити" >&2
              exit 1
            fi
            git rebase origin/main
            if git push origin HEAD:main; then
              echo "REMINT_PUBLISHED native_pairs=${#sources[@]} attempts=$attempt"
              exit 0
            fi
          done
          echo "::error::REMINT_PUSH_RACE attempts=12; жодного force-push, виправлені пари не опубліковано" >&2
          exit 1
