name: migration-dynamic-binding-triage
on:
  pull_request:
    paths:
      - "knowledge/migration-dynamic-binding-triage-2026-10-08.json"
      - "tests/test_migration_dynamic_binding_triage.py"
      - "benchmarks/arithmetic.lisp"
      - "benchmarks/closures.lisp"
      - "benchmarks/recursion.lisp"
      - "scripts/migrate-three-pass.py"
      - ".github/workflows/migration-dynamic-binding-triage.yml"
  push:
    branches: [main]
    paths:
      - "knowledge/migration-dynamic-binding-triage-2026-10-08.json"
      - "tests/test_migration_dynamic_binding_triage.py"
      - "benchmarks/arithmetic.lisp"
      - "benchmarks/closures.lisp"
      - "benchmarks/recursion.lisp"
      - "scripts/migrate-three-pass.py"
      - ".github/workflows/migration-dynamic-binding-triage.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dynamic-binding-block:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Verify source SHAs and fail-closed physical T5 migration
        run: python3 -m unittest discover -s tests -p 'test_migration_dynamic_binding_triage.py' -v
