name: D10 historical STRIPS symbolic planning oracle
on:
  pull_request:
    paths:
      - 'knowledge/d10-strips-goal-regression-research-v1.json'
      - 'tests/oracles/d10_strips_regression_swi.pl'
      - 'scripts/check_d10_strips_goal_regression.py'
      - 'docs/research/d10-strips-goal-regression-20261009.uk.md'
      - '.github/workflows/d10-strips-regression-oracle.yml'
  workflow_dispatch:
jobs:
  real-strips-goal-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Check exact source, 10 negative controls and domain admission boundaries
        run: python3 scripts/check_d10_strips_goal_regression.py
      - name: Install real SWI-Prolog
        run: sudo apt-get update -qq && sudo apt-get install -y swi-prolog-nox
      - name: Execute 24 real Prolog observations and exhaust 13824 finite models
        run: python3 scripts/check_d10_strips_goal_regression.py --real-donor
