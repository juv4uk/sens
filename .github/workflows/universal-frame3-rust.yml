name: Universal Frame3 Rust proof
on:
  push:
    paths:
      - 'crates/sens/src/universal_frame3.rs'
      - 'crates/sens/src/frame3_v2.rs'
      - 'crates/sens/examples/frame3_f3_bench.rs'
      - 'crates/sens/examples/frame3_v3_bench.rs'
      - 'crates/sens/examples/frame3_v2_bench.rs'
      - 'crates/sens/examples/frame3_v2_paired_bench.rs'
      - 'crates/sens/src/lib.rs'
      - 'crates/sens/src/frame3_grammar.rs'
      - 'crates/sens/src/frame3_semantic.rs'
      - 'crates/sens/tests/frame3_grammar_rank.rs'
      - 'research/framed3/rust_codec/senc.rs'
      - 'research/framed3/rust_codec/canonical_form_capacity.rs'
      - 'research/framed3/semantic_redundancy_research.py'
      - 'research/framed3/test_semantic_redundancy_research.py'
      - '.github/workflows/universal-frame3-rust.yml'
  pull_request:
    paths:
      - 'crates/sens/src/universal_frame3.rs'
      - 'crates/sens/src/frame3_v2.rs'
      - 'crates/sens/examples/frame3_f3_bench.rs'
      - 'crates/sens/examples/frame3_v3_bench.rs'
      - 'crates/sens/examples/frame3_v2_bench.rs'
      - 'crates/sens/examples/frame3_v2_paired_bench.rs'
      - 'crates/sens/src/lib.rs'
      - 'crates/sens/src/frame3_grammar.rs'
      - 'crates/sens/src/frame3_semantic.rs'
      - 'crates/sens/tests/frame3_grammar_rank.rs'
      - 'research/framed3/rust_codec/senc.rs'
      - 'research/framed3/rust_codec/canonical_form_capacity.rs'
      - 'research/framed3/semantic_redundancy_research.py'
      - 'research/framed3/test_semantic_redundancy_research.py'
      - '.github/workflows/universal-frame3-rust.yml'
permissions:
  contents: read
jobs:
  rust-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Verify focused Rust codec
        run: |
          set -euo pipefail
          rustfmt --edition 2021 crates/sens/src/universal_frame3.rs crates/sens/src/frame3_v2.rs
          cargo test -p sens universal_frame3 -- --nocapture
          cargo test -p sens --test frame3_grammar_rank -- --nocapture
          cargo test --locked -p sens --lib exact_d3_frame3_admission_tests -- --nocapture
          cargo clippy -p sens --lib -- -D warnings
      - name: Frame3 v2 full physical benchmark against T5 and v1
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "# benchmark SHA: ${GITHUB_SHA}"
            echo "# runner OS: $(uname -srm)"
            echo "# rustc: $(rustc --version)"
            echo "# CPU: $(grep -m1 'model name' /proc/cpuinfo || true)"
            cargo run --locked --release -p sens --example frame3_v2_bench --quiet
          } | tee "$RUNNER_TEMP/frame3-v2-physical.tsv"
      - name: Upload source-SHA full-file byte and encode/decode timing evidence
        uses: actions/upload-artifact@v4
        with:
          name: frame3-v2-physical-${{ github.sha }}
          path: ${{ runner.temp }}/frame3-v2-physical.tsv
          if-no-files-found: error
          retention-days: 21
      - name: Paired randomized full-file T5 / S3v1 / S3v2 benchmark
        shell: bash
        env:
          FRAME3_BENCH_RAW: ${{ runner.temp }}/frame3-v2-paired-raw.tsv
        run: |
          set -euo pipefail
          {
            echo "# SHA: ${GITHUB_SHA}"
            echo "# runner OS: $(uname -srm)"
            echo "# rustc: $(rustc --version)"
            echo "# CPU: $(grep -m1 'model name' /proc/cpuinfo || true)"
            cargo run --locked --release -p sens --example frame3_v2_paired_bench --quiet
          } | tee "$RUNNER_TEMP/frame3-v2-paired-summary.tsv"
      - name: Upload all paired samples plus full-byte summary
        uses: actions/upload-artifact@v4
        with:
          name: frame3-v2-paired-${{ github.sha }}
          path: |
            ${{ runner.temp }}/frame3-v2-paired-raw.tsv
            ${{ runner.temp }}/frame3-v2-paired-summary.tsv
          if-no-files-found: error
          retention-days: 21
      - name: Prove no coordinates for impossible D3 calls, keep QUOTE data
        run: |
          set -euo pipefail
          python3 -m unittest discover -s research/framed3 -p 'test_semantic_redundancy_research.py' -v
          python3 -O -m unittest discover -s research/framed3 -p 'test_semantic_redundancy_research.py' -v
          python3 research/framed3/semantic_redundancy_research.py

  frame3-all-bench:
    name: Frame3 paired CPU and full-file bytes (T5, F3, S3v1-v3)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify Rust codec exact-word roundtrips before timing
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p sens --lib universal_frame3
      - name: Measure identical typed programs and complete physical bytes
        shell: bash
        env:
          FRAME3_BENCH_RAW: ${{ runner.temp }}/frame3-all/paired-raw.tsv
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/frame3-all"
          mkdir -p "$out"
          export BENCH_OS="$(uname -srm)"
          export BENCH_RUSTC="$(rustc --version)"
          export BENCH_CPU="$(grep -m1 'model name' /proc/cpuinfo || true)"
          {
            echo "SHA=$GITHUB_SHA"
            echo "RUN_ID=$GITHUB_RUN_ID"
            echo "RUN_ATTEMPT=$GITHUB_RUN_ATTEMPT"
            echo "OS=$BENCH_OS"
            echo "RUSTC=$BENCH_RUSTC"
            echo "CPU=$BENCH_CPU"
            echo "scope=warm in-process codec encode/decode and full serialized bytes, not evaluation"
          } | tee "$out/environment.txt"
          cargo run --locked --release -p sens --example frame3_f3_bench --quiet | tee "$out/f3-vs-all.tsv"
          cargo run --locked --release -p sens --example frame3_v3_bench --quiet | tee "$out/v3-vs-all.tsv"
          cargo run --locked --release -p sens --example frame3_v2_paired_bench --quiet | tee "$out/v2-paired-summary.tsv"
          test -s "$out/f3-vs-all.tsv"
          test -s "$out/v3-vs-all.tsv"
          test -s "$out/v2-paired-summary.tsv"
          test -s "$out/paired-raw.tsv"
          grep -q '^case' "$out/f3-vs-all.tsv"
          grep -q '^case' "$out/v3-vs-all.tsv"
          grep -q '^case' "$out/v2-paired-summary.tsv"
      - name: Preserve measured data (or diagnose blocked run)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frame3-all-bench-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/frame3-all/
          if-no-files-found: warn
          retention-days: 21
