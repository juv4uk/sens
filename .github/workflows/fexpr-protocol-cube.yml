name: FEXPR protocol cube research

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cube:
    name: FEXPR raw/env/result protocol cube
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run Phase-E protocol cube
        run: python3 scripts/research-2522-fexpr-protocol-cube.py
      - name: Run Phase-E behavioral conformance
        run: python3 scripts/research-2530-fexpr-conformance.py
      - name: Publish summary
        if: always()
        run: |
          {
            echo "## #2522 FEXPR/FSUBR protocol cube"
            echo
            echo "~~~text"
            python3 scripts/research-2522-fexpr-protocol-cube.py
            python3 scripts/research-2530-fexpr-conformance.py
            echo "~~~"
            echo
            echo "- Historical source control: LISP 1.5 Appendix B pp. 70–71."
            echo "- No width/address is allocated by this research gate."
          } >> "$GITHUB_STEP_SUMMARY"
