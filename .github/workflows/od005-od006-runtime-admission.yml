name: OD005/OD006 exact domain identity audit

on:
  workflow_dispatch:
jobs:
  admission-audit:
    name: D5/D6 exact identity and callability boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check 96-row exact identity matrix
        run: python3 scripts/audit-od005-od006-runtime-admission.py --check
      - name: Run canonical exact-domain identity witnesses
        run: cargo test -p sens --test od005_od006_runtime_admission_gap -- --nocapture
      - name: Publish summary
        if: always()
        run: |
          {
            echo "## OD-005 / OD-006 exact domain identity"
            echo
            echo "- Exact canonical identities: D5 32/32, D6 64/64"
            echo "- Core-operation admission remains separate: D5 has its admitted projection; D6 admits only 001110 and 001111."
            echo "- Historical SID8/Sens8 is provenance only and is not a runtime identity."
            echo "- This audit does not claim full evaluator coverage for every resident."
          } >> "$GITHUB_STEP_SUMMARY"
