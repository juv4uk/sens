name: Compiler selfhost lineage contract

on:
  pull_request:
    paths:
      - "contracts/compiler-selfhost-lineage-v1.lisp"
      - "scripts/validate-compiler-selfhost-lineage.py"
      - ".github/workflows/compiler-selfhost-lineage-contract.yml"
  push:
    branches: [main]
    paths:
      - "contracts/compiler-selfhost-lineage-v1.lisp"
      - "scripts/validate-compiler-selfhost-lineage.py"
      - ".github/workflows/compiler-selfhost-lineage-contract.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  self-test:
    runs-on: [self-hosted, guix]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Validate lineage contract falsifiers
        run: python3 scripts/validate-compiler-selfhost-lineage.py --self-test
