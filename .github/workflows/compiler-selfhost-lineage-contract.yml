name: Compiler selfhost lineage contract
# #3822 stored executable fixed-point report gate.

on:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lineage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate lineage contract falsifiers
        run: python3 scripts/validate-compiler-selfhost-lineage.py --self-test

      - name: Validate Nano-SENS size measurement guards
        run: python3 scripts/measure-nano-sens-size.py --self-test

      - name: Validate stored historical and current Nano-SENS lineage reports
        run: |
          set -euo pipefail
          python3 scripts/validate-compiler-selfhost-lineage.py evidence/compiler-selfhost-lineage-2026-10-07.json
          python3 scripts/validate-compiler-selfhost-lineage.py evidence/compiler-selfhost-lineage-2026-10-12-nano-sens.json

      - name: Recompute exact historical SENS source digests
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import subprocess
          from pathlib import Path

          report_paths = [
              "evidence/compiler-selfhost-lineage-2026-10-07.json",
              "evidence/compiler-selfhost-lineage-2026-10-12-nano-sens.json",
          ]
          for report_path in report_paths:
              report = json.loads(Path(report_path).read_text())
              source = report["source"]
              sens_sha = source["sens_source_sha"]
              checks = {
                  "lib/compiler-nucleus.lisp": source["compiler_nucleus_sha256"],
                  "language-contract.lisp": source["language_contract_sha256"],
                  "knowledge/bija3-l1-l5-structure-projection.json":
                      source["structural_law_projection_sha256"],
              }
              for path, expected in checks.items():
                  blob = subprocess.check_output(["git", "show", f"{sens_sha}:{path}"])
                  actual = hashlib.sha256(blob).hexdigest()
                  assert actual == expected, (report_path, path, expected, actual)
              print(f"COMPILER-SELFHOST-SOURCE-DIGESTS: PASS {report_path}")
          PY

      - name: Assert strongest fixed-point evidence is internally consistent
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          report_paths = [
              "evidence/compiler-selfhost-lineage-2026-10-07.json",
              "evidence/compiler-selfhost-lineage-2026-10-12-nano-sens.json",
          ]
          for report_path in report_paths:
              r = json.loads(Path(report_path).read_text())
              assert r["generations"]["c1"]["artifact_sha256"] == r["generations"]["c2"]["artifact_sha256"]
              assert r["generations"]["c1"]["normalized_sha256"] == r["generations"]["c2"]["normalized_sha256"]
              e = r["evidence"]
              assert e["c1_executable_sha256"] == e["c2_executable_sha256"]
              assert e["c1_c_source_sha256"] == e["c2_c_source_sha256"]
              assert e["c1_output_sha256"] == e["c2_output_sha256"]
              assert r["equivalence"]["selected_method"] == "byte-identical-artifact"
              print(f"COMPILER-SELFHOST-LINEAGE-EVIDENCE: PASS {report_path}")
          PY
