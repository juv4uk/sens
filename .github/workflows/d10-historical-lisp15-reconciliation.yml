name: D10 historical Lisp 1.5 reconciliation
on:
  workflow_dispatch:
jobs:
  research-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Reconcile the pinned historical view against current D10
        run: python3 scripts/check_d10_historical_lisp15_reconciliation.py
      - name: Reject authority leakage and unrecorded changes
        run: python3 -m unittest discover -s tests -p 'test_d10_historical_lisp15_reconciliation.py' -v
      - name: No generated changes
        run: git diff --exit-code
