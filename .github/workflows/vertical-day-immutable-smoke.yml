# Вертикальна перевірка виконується чинними native SENS/Rust/Zig свідками.
name: Vertical Day native SENS smoke

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vertical-day-native-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: ./.github/actions/install-zig
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - name: Зібрати нативний SENS
        run: cargo build --locked -p sens-cli --bin sens --bin sens-trit --features benchmark-ast-visits
      - name: Мовні закони з позитивним і негативним свідками
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/prove-lisp-language-laws.sh "$PWD/target/debug/sens"
          bash scripts/prove-d8-products-main.sh "$PWD/target/debug/sens"
      - name: Канонічні фізичні трійки через SENS, Zig/T5M та cmp
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/check-triple-projection.sh \
            --fixture tests/fixtures/migration-d1-cond-cohort/branch.lisp \
            --fixture tests/fixtures/migration-d4-selector-cohort/caar.lisp
      - name: Нативні механізми ядра
        run: cargo test --locked -p sens-host --test native_lisp_bytes --test native_cond_profile
      - name: Точна доменна драбина
        run: cargo test --locked -p sens --test domain_ladder_only_kernel
      - name: Записати коміт, перевірений цим прогоном
        shell: bash
        run: printf 'Перевірений коміт: %s\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
