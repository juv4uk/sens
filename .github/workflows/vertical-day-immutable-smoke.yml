name: Vertical Day immutable L0 and native smoke

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Do not cancel an already-running pinned-SHA witness as main advances.
concurrency:
  group: vertical-day-immutable-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  oracle-native-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Verify immutable oracle checker rejects tampering
        run: python3 scripts/verify_vertical_day_smoke.py --self-test

      - name: Build exact-domain L0 oracle
        run: cargo build --locked --release -p sens --example current_en_vs_d1d8_cpu

      - name: Run real L0 binary-domain oracle
        run: |
          python3 benchmarks/execution-ladder-conformance/emit_oracle.py \
            --manifest benchmarks/current-en-vs-d1d8/fixtures/d3-smoke.json \
            --helper target/release/examples/current_en_vs_d1d8_cpu \
            --out "$RUNNER_TEMP/vertical-day-oracle.jsonl"

      - name: Verify conformance envelope and pinned observable SHA256
        run: |
          python3 benchmarks/execution-ladder-conformance/validate.py \
            "$RUNNER_TEMP/vertical-day-oracle.jsonl"
          python3 scripts/verify_vertical_day_smoke.py \
            "$RUNNER_TEMP/vertical-day-oracle.jsonl" \
            --expected-sha "$GITHUB_SHA"

      - name: Native CPU vertical mechanism witnesses
        if: always()
        run: cargo test --locked -p sens-host --test native_lisp_bytes --test native_cond_profile

      - name: Exact domain ladder and retired-semantic firewall
        if: always()
        run: cargo test --locked -p sens --test domain_ladder_only_kernel

      - name: Retain real oracle evidence for exact commit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vertical-day-l0-${{ github.sha }}
          path: ${{ runner.temp }}/vertical-day-oracle.jsonl
          if-no-files-found: warn
