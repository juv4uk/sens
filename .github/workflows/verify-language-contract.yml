name: Verify pinned sens language contract

on:
  workflow_call:
    inputs:
      contract_path:
        description: Vendored language-contract.lisp path in the consumer repository
        required: false
        type: string
        default: contracts/my-lisp/language-contract.lisp
      lock_path:
        description: Contract lock record path in the consumer repository
        required: false
        type: string
        default: contracts/my-lisp/lock.lisp

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      UPSTREAM_REPO: juv4uk/sens
      UPSTREAM_PATH: language-contract.lisp
      TARGET_PATH: ${{ inputs.contract_path }}
      LOCK_PATH: ${{ inputs.lock_path }}
    steps:
      - name: Check out consumer repository
        uses: actions/checkout@v5

      - name: Verify digest and exact pinned source
        shell: bash
        run: |
          set -euo pipefail
          test -f "$TARGET_PATH"
          test -f "$LOCK_PATH"

          revision="$(awk -F'"' '/\(revision "/ {print $2; exit}' "$LOCK_PATH")"
          locked_digest="$(awk -F'"' '/\(sha256 "/ {print $2; exit}' "$LOCK_PATH")"
          test "$revision" != ""
          test "$locked_digest" != ""
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          [[ "$locked_digest" =~ ^[0-9a-f]{64}$ ]]

          actual_digest="$(sha256sum "$TARGET_PATH" | awk '{print $1}')"
          test "$actual_digest" = "$locked_digest"

          curl -fsSL \
            "https://raw.githubusercontent.com/${UPSTREAM_REPO}/${revision}/${UPSTREAM_PATH}" \
            -o /tmp/language-contract.lisp
          cmp --silent "$TARGET_PATH" /tmp/language-contract.lisp
