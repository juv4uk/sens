name: Core source integrity

on:
  pull_request:
    paths:
      - "lib/core.lisp"
      - "lib/core.lisp.fasl"
      - ".github/workflows/core-source-integrity.yml"
  push:
    branches: [main]
    paths:
      - "lib/core.lisp"
      - "lib/core.lisp.fasl"
      - ".github/workflows/core-source-integrity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Single active core artifacts exist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Prove canonical source and snapshot exist
        shell: bash
        run: |
          set -euo pipefail
          test -s lib/core.lisp
          test -s lib/core.lisp.fasl
          test ! -e lib/core4.lisp
          test ! -e lib/core4.lisp.fasl
          printf 'core source sha256: '
          sha256sum lib/core.lisp
          printf 'core fasl sha256: '
          sha256sum lib/core.lisp.fasl

      - name: Prove one-core authority
        shell: bash
        run: |
          set -euo pipefail
          grep -F '(active-core-count . 1)' contracts/core-profile-contract.lisp
          grep -F '(active-core-source . "lib/core.lisp")' contracts/core-profile-contract.lisp
          grep -F '(language-core-selection . unnecessary)' contracts/core-profile-contract.lisp

      - name: Diff hygiene
        run: git diff --check
