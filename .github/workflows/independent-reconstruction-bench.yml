name: Independent reconstruction benchmark

on:
  workflow_dispatch:

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: "Run independent reconstruction smoke benchmark — EXCLUDED (NOT_VERIFIED)"
        shell: bash
        run: echo "PYTHON_TESTS_AND_BENCHMARKS=EXCLUDED_BY_LANGUAGE_POLICY native_equivalent=NOT_VERIFIED"

      - name: "Run reconstruction ablation smoke benchmark — EXCLUDED (NOT_VERIFIED)"
        shell: bash
        run: echo "PYTHON_TESTS_AND_BENCHMARKS=EXCLUDED_BY_LANGUAGE_POLICY native_equivalent=NOT_VERIFIED"

      - name: Upload raw reconstruction evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: independent-reconstruction
          path: |
            /tmp/independent-reconstruction/results.tsv
            /tmp/independent-reconstruction/results.json
            /tmp/reconstruction-ablation/results.tsv
            /tmp/reconstruction-ablation/results.json
          retention-days: 7
