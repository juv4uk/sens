name: TEMP Core4 defmacro FASL regeneration
on:
  push:
    branches:
      - fix/core4-defmacro-peer-materialization-20261010
    paths:
      - ".github/workflows/tmp-core4-defmacro-fasl.yml"
      - "lib/core4.lisp"
      - "crates/sens/tests/current_binary_preflight.rs"

permissions:
  contents: write

jobs:
  exact-source-replay:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Pin the exact edited source
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git hash-object lib/core4.lisp)"
          test "$actual" = "e048741b24762eeef2a220b43c910b1fa04e7efd"
          echo "CORE4_SOURCE_BLOB=$actual"
      - name: Regenerate the committed physical FASL
        shell: bash
        run: |
          set -euo pipefail
          cargo run --locked --release -p sens-cli --bin gen-fasl -- lib/core4.lisp lib/core4.lisp.fasl
          cargo test --locked -p sens --test core_fasl_freshness -- --nocapture
          cargo test --locked -p sens --test current_binary_preflight current_core4_peer_materialization_uses_current_macro_law -- --exact --nocapture
          git diff --exit-code -- . ':!lib/core4.lisp.fasl'
          git add lib/core4.lisp.fasl
          if git diff --cached --quiet; then
            echo "FASL already matches the pinned source"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "оновити Core4 FASL для чинного defmacro"
          git push origin "HEAD:${GITHUB_REF_NAME}"
