name: SENS performance scoreboard

# Benchmarks lead. Correctness/oracle parity is only an admission guard:
# publish actual nanoseconds, Cachegrind instruction references and bytes.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/main-performance.yml"
      - "benchmarks/current-en-vs-d1d8/**"
      - "benchmarks/byte-pack/**"
      - "crates/sens/examples/current_en_vs_d1d8_cpu.rs"
      - "crates/sens/examples/byte_pack_bench.rs"
      - "crates/sens/src/canonical_reader.rs"
      - "crates/sens/src/source_words.rs"
      - "crates/sens/src/source_packing.rs"
      - "crates/sens/src/eval/**"
  pull_request:
    paths:
      - ".github/workflows/main-performance.yml"
      - "benchmarks/current-en-vs-d1d8/**"
      - "benchmarks/byte-pack/**"
      - "crates/sens/examples/current_en_vs_d1d8_cpu.rs"
      - "crates/sens/examples/byte_pack_bench.rs"
      - "crates/sens/src/canonical_reader.rs"
      - "crates/sens/src/source_words.rs"
      - "crates/sens/src/source_packing.rs"
      - "crates/sens/src/eval/**"
  schedule:
    - cron: "20 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Do not cancel a measurement in progress whenever other agents advance main.
# Keep at most one queued replay per ref instead of flooding the hosted runners.
concurrency:
  group: sens-performance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cpu-phases:
    name: English vs binary · measured CPU phases
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: sens-main-performance-cpu
      - name: Build paired current SENS implementation (release)
        run: cargo build --locked --release -p sens --example current_en_vs_d1d8_cpu
      - name: Measure current D3 workload pairs (nanoseconds)
        run: |
          mkdir -p "$RUNNER_TEMP/sens-performance/cpu"
          python3 benchmarks/current-en-vs-d1d8/cpu_runner.py \
            --helper target/release/examples/current_en_vs_d1d8_cpu \
            --manifest benchmarks/current-en-vs-d1d8/fixtures/d3-smoke.json \
            --out "$RUNNER_TEMP/sens-performance/cpu/samples.jsonl" \
            --blocked-out "$RUNNER_TEMP/sens-performance/cpu/blocked.json" \
            --reps 7 --repeat-n 64 \
            --phases session,ingest,lower,execute,full,repeated
          python3 benchmarks/current-en-vs-d1d8/validate.py \
            "$RUNNER_TEMP/sens-performance/cpu/samples.jsonl"
      - name: Publish real CPU phase medians and paired ratios
        run: |
          python3 benchmarks/current-en-vs-d1d8/performance_scoreboard.py \
            --cpu-jsonl "$RUNNER_TEMP/sens-performance/cpu/samples.jsonl" \
            --out "$RUNNER_TEMP/sens-performance/cpu/scoreboard.md"
          cat "$RUNNER_TEMP/sens-performance/cpu/scoreboard.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Retain raw samples, blocked cases, scoreboard and metadata
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sens-performance-cpu-${{ github.sha }}
          path: ${{ runner.temp }}/sens-performance/cpu/
          if-no-files-found: warn
          retention-days: 21

  dense-packing:
    name: D3 D7 D8 · measured bytes and instruction cost
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: sens-main-performance-pack
      - name: Install instruction-counter tool
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y valgrind
          valgrind --version
      - name: Build bit-packing benchmark (release)
        run: cargo build --locked --release -p sens --example byte_pack_bench
      - name: Measure real packed bytes and Cachegrind I-refs
        run: |
          mkdir -p "$RUNNER_TEMP/sens-performance/pack"
          python3 benchmarks/byte-pack/run.py \
            --binary target/release/examples/byte_pack_bench \
            --out "$RUNNER_TEMP/sens-performance/pack" \
            --sizes 1024 --reps 16 --workloads d3,w7,w8
      - name: Publish physical density vs instruction tradeoff
        run: |
          python3 benchmarks/current-en-vs-d1d8/performance_scoreboard.py \
            --pack-tsv "$RUNNER_TEMP/sens-performance/pack/results.tsv" \
            --out "$RUNNER_TEMP/sens-performance/pack/scoreboard.md"
          cat "$RUNNER_TEMP/sens-performance/pack/scoreboard.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Retain instruction references, physical bytes and host metadata
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sens-performance-pack-${{ github.sha }}
          path: ${{ runner.temp }}/sens-performance/pack/
          if-no-files-found: warn
          retention-days: 21
