name: Core profile contract

on:
  push:
    branches: [main]
    paths:
      - "contracts/core-profile-contract.lisp"
      - "scripts/check-core-profile-contract.lisp"
      - "knowledge/repo-tooling-inventory.lisp"
      - ".github/workflows/core-profile-contract.yml"
  pull_request:
    paths:
      - "contracts/core-profile-contract.lisp"
      - "scripts/check-core-profile-contract.lisp"
      - "knowledge/repo-tooling-inventory.lisp"
      - ".github/workflows/core-profile-contract.yml"
  workflow_dispatch:

jobs:
  contract:
    name: Lisp-owned four-core authority
    runs-on: [self-hosted, guix]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build semantic oracle
        run: cargo build -p sens-cli --bin sens

      - name: Verify four-core contract
        shell: bash
        run: |
          set -euo pipefail
          verdict="$(./target/debug/sens scripts/check-core-profile-contract.lisp)"
          printf '%s\n' "$verdict"
          test "$verdict" = "(core-profile-contract-ok)"

      - name: Diff hygiene
        run: git diff --check
