name: Core profile contract — transition archive

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archive:
    name: Historical four-Core contract archive
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Record contract
        run: sha256sum contracts/core-profile-contract.lisp
      - name: Explain active authority
        run: |
          echo "Profile-specific ATOM/EQ/COND semantics are superseded by #1703."
          echo "Current shared foundation is being proven by #1664/#1709."
          echo "This legacy checker is not an active semantic oracle."
      - name: Diff hygiene
        run: git diff --check
