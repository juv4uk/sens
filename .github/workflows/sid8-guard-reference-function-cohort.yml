name: Guard source D3 six-function cutover witness
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-original-blobs:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check immutable source delta and D3 negative controls
        run: python3 -m unittest discover -s tests -p 'test_sid8_guard_reference_function_cohort.py' -v
