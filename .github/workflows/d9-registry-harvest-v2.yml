name: D9 registry harvest v2

on:
  pull_request:
    paths:
      - "lib/surface/semantic-registry.lisp"
      - "lib/surface/function-signatures.lisp"
      - "knowledge/d9-registry-harvest-v2.json"
      - "knowledge/d9-v1-semantic-inventory.json"
      - "knowledge/d9-fill-v1-state.json"
      - "scripts/check-d9-registry-harvest-v2.py"
      - "scripts/check-d9-v1-semantic-inventory.py"
      - "scripts/check-d9-surface-harvest-v1.py"
      - ".github/workflows/d9-registry-harvest-v2.yml"
  push:
    branches: [main]
    paths:
      - "knowledge/d9-registry-harvest-v2.json"
      - "knowledge/d9-v1-semantic-inventory.json"
      - "knowledge/d9-fill-v1-state.json"
      - "scripts/check-d9-registry-harvest-v2.py"
      - ".github/workflows/d9-registry-harvest-v2.yml"
  workflow_dispatch:

jobs:
  registry-harvest:
    runs-on: [self-hosted, Linux, X64, gpu, gtx-1050-ti, cuda-12.6]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: GPU runner identity
        run: nvidia-smi || true
      - name: Verify wider registry harvest
        run: python3 scripts/check-d9-registry-harvest-v2.py
      - name: Verify global D9 inventory
        run: python3 scripts/check-d9-v1-semantic-inventory.py
      - name: Preserve public-signature tranche
        run: python3 scripts/check-d9-surface-harvest-v1.py
      - name: Preserve first law-mining tranche
        run: python3 scripts/check-d9-laws-1.py
