name: D5 v2 shadow

on:
  pull_request:
    paths:
      - "knowledge/d5-v2-shadow.json"
      - "docs/research/d5-v2-shadow.md"
      - "docs/research/d5-v2-shadow.uk.md"
      - "scripts/check-d5-v2-shadow.py"
      - ".github/workflows/d5-v2-shadow.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 scripts/check-d5-v2-shadow.py
