name: TEMP current defmacro/Core4 bootstrap repair
on:
  push:
    branches:
      - fix/core4-defmacro-peer-bootstrap-20261010
    paths:
      - ".github/workflows/tmp-core4-defmacro-bootstrap.yml"
      - "lib/core.lisp"
      - "lib/core4.lisp"
      - "crates/sens/tests/current_binary_preflight.rs"

permissions:
  contents: write

jobs:
  exact-source-bootstrap:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Pin exact current Core4 source
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git hash-object lib/core4.lisp)"
          test "$actual" = "7d33812285a53d961fc75017e11952b61672a241"
          echo "CORE4_SOURCE_BLOB=$actual"
      - name: Regenerate physical FASL and execute macro-law witnesses
        shell: bash
        run: |
          set -euo pipefail
          cargo run --locked --release -p sens-cli --bin gen-fasl -- lib/core4.lisp lib/core4.lisp.fasl
          cargo test --locked -p sens --test core_fasl_freshness -- --nocapture
          cargo test --locked -p sens --test current_binary_preflight current_defmacro_bootstrap_executes_let_and_let_star -- --exact --nocapture
          cargo test --locked -p sens --test current_binary_preflight postcore_peer_materializer_installs_the_stable_ukrainian_time_surface -- --exact --nocapture
          git diff --exit-code -- . ':!lib/core4.lisp.fasl'
          git add lib/core4.lisp.fasl
          if git diff --cached --quiet; then
            echo "FASL already matches exact Core4 source"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "refresh Core4 FASL for current defmacro source"
          git push origin "HEAD:${GITHUB_REF_NAME}"
