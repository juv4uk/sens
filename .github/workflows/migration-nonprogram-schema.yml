name: Migration non-program schema manifest

on:
  pull_request:
    paths:
      - "knowledge/migration-nonprogram-schema-manifest-2026-10-08.json"
      - "tests/test_migration_nonprogram_schema_manifest.py"
      - "contracts/*.lisp"
      - "lib/function-table-mechanisms.lisp"
      - "lib/island-math-evidence.lisp"
      - "tests/fixtures/island-math-evidence/*.lisp"
      - ".github/workflows/migration-nonprogram-schema.yml"
  push:
    branches: [main]
    paths:
      - "knowledge/migration-nonprogram-schema-manifest-2026-10-08.json"
      - "tests/test_migration_nonprogram_schema_manifest.py"
      - "contracts/*.lisp"
      - "lib/function-table-mechanisms.lisp"
      - "lib/island-math-evidence.lisp"
      - "tests/fixtures/island-math-evidence/*.lisp"
      - ".github/workflows/migration-nonprogram-schema.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Verify path-pinned non-program schema cohort
        run: python3 -m unittest tests.test_migration_nonprogram_schema_manifest -v
