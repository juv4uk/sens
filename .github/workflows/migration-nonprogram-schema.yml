name: Migration non-program schema manifest

on:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Verify path-pinned non-program schema cohort
        run: python3 -m unittest tests.test_migration_nonprogram_schema_manifest -v
