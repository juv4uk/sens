name: sens-domain-spaces-audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-domain-spaces:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Test word boundaries without rejoining binary words
        run: python3 -m unittest tests/test_sens_domain_spaces.py -v
      - name: Check word view without pretending it is a physical T5M carrier
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '10 001 00 000 01' > "${RUNNER_TEMP}/sample.bits"
          python3 scripts/check-sens-domain-spaces.py "${RUNNER_TEMP}/sample.bits"
          cp "${RUNNER_TEMP}/sample.bits" "${RUNNER_TEMP}/not-a-carrier.sens"
          if python3 scripts/check-sens-domain-spaces.py "${RUNNER_TEMP}/not-a-carrier.sens"; then
            echo "ERROR: textual .bits view was incorrectly treated as physical Zig/T5M"
            exit 1
          else
            echo "PASS: only .bits was audited; no fake physical or semantic blocker"
          fi
