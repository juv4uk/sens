name: D10 historical second tranche monotonic 638
on:
  pull_request:
    paths:
      - 'knowledge/d10-historical-primary-admission-batch2-v1.json'
      - 'knowledge/d10-v1-semantic-inventory.json'
      - 'knowledge/d10-fill-v1-state.json'
      - 'docs/architecture/ARCHIPELAGO-V1.uk.md'
      - 'scripts/check_d10_historical_second_tranche.py'
      - '.github/workflows/d10-historical-second-tranche.yml'
  workflow_dispatch:
jobs:
  semantic-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check 638-row monotonic D10 and adversarial bit/hash witnesses
        run: python3 scripts/check_d10_historical_second_tranche.py --self-test
      - name: Check no mutation of source tree
        run: git diff --exit-code
