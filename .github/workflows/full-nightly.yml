name: Full Nightly Verification

on:
  schedule:
    # 02:17 UTC = 04:17/05:17 in Ukraine, after the deep-meta nightly window.
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-nightly
  cancel-in-progress: false

jobs:
  workspace-regression:
    name: full workspace regression
    if: vars.HOSTED_RUNNERS == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: full-nightly-workspace
      - name: Check generated authority projections
        run: |
          cargo run --quiet -p sens-cli --bin my-lisp -- scripts/generate-meta-semantic-registry.lisp --check
          cargo run --quiet -p sens-cli --bin my-lisp -- scripts/generate-rust-semantic-registry.lisp --check
          python3 scripts/public_api_inventory.py --check
      - name: Full workspace tests
        run: cargo test --workspace
      - name: Full workspace build
        run: cargo build --workspace
      - name: Governance and policy checks
        run: |
          cargo run --quiet -p sens-cli --bin sens -- scripts/verify-repo.lisp
      - name: Ukrainian full-word source profile
        run: ./target/debug/sens scripts/перевірити-український-профіль.lisp
      - name: Ukrainian direct-peer topology
        shell: bash
        run: |
          set -euo pipefail
          if grep -Fqx '(define зчепити string-append)' lib/surface/uk.lisp; then
            echo '1043 regression: stable UK зчепити must be a registry-driven peer, not an EN bridge' >&2
            exit 1
          fi
          if grep -Fqx '(define довжина-тексту string-length)' lib/surface/uk.lisp; then
            echo '1044 regression: stable UK довжина-тексту must be a registry-driven peer, not an EN bridge' >&2
            exit 1
          fi
          if grep -Fqx '(define текст-порожній? string-empty?)' lib/surface/uk.lisp; then
            echo '1045 regression: stable UK текст-порожній? must be a registry-driven peer, not an EN bridge' >&2
            exit 1
          fi
          if grep -Fqx '(define префікс-тексту? string-prefix?)' lib/surface/uk.lisp; then
            echo '1046 regression: stable UK префікс-тексту? must be a registry-driven peer, not an EN bridge' >&2
            exit 1
          fi
          if grep -Fqx '(define фрагмент-у-тексті? string-contains?)' lib/surface/uk.lisp; then
            echo '1047 regression: stable UK фрагмент-у-тексті? must be a registry-driven peer, not an EN bridge' >&2
            exit 1
          fi
          if grep -Fqx '(define перший-символ-тексту string-first)' lib/surface/uk.lisp; then
            echo '1048 regression: stable preferred UK перший-символ-тексту must be a registry-driven peer, not an EN bridge' >&2
            exit 1
          fi
          if grep -Fqx '(define решта-символів-тексту string-rest)' lib/surface/uk.lisp; then
            echo '1049 regression: stable preferred UK решта-символів-тексту must be a registry-driven peer, not an EN bridge' >&2
            exit 1
          fi
          if grep -Fqx '(define відрізати string-slice)' lib/surface/uk.lisp; then
            echo '1050 regression: stable UK відрізати must be a registry-driven peer, not an EN bridge' >&2
            exit 1
          fi
          if grep -Fqx '(define символ-у-текст symbol->string)' lib/surface/uk.lisp; then
            echo '1051 regression: stable UK символ-у-текст must be a registry-driven peer, not an EN bridge' >&2
            exit 1
          fi
          if grep -Fqx '(define текст-у-символ string->symbol)' lib/surface/uk.lisp; then
            echo '1052 regression: stable UK текст-у-символ must be a registry-driven peer, not an EN bridge' >&2
            exit 1
          fi

  workspace-clippy:
    name: full workspace clippy
    if: vars.HOSTED_RUNNERS == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: full-nightly-clippy
      - run: cargo clippy --workspace --all-targets -- -D warnings

  full-advice-taker:
    name: full Advice Taker optimized witness
    if: vars.HOSTED_RUNNERS == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: full-nightly-advice
      - run: cargo test --profile ci-meta -p sens --test meta_eval_advice_taker advice_taker_native_and_meta_preserve_expected_outcome_classes -- --ignored --nocapture

  android-build:
    name: Android cross-build (aarch64 + armv7)
    if: vars.HOSTED_RUNNERS == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: full-nightly-android
      - name: Install Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r30
          add-to-path: false
      - name: Build aarch64-linux-android
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER: ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android30-clang
          CC_aarch64_linux_android: ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android30-clang
          AR_aarch64_linux_android: ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
        run: |
          cargo build --release --target aarch64-linux-android -p sens-cli
          file target/aarch64-linux-android/release/my-lisp
      - name: Build armv7-linux-androideabi
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER: ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi28-clang
          CC_armv7_linux_androideabi: ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi28-clang
          AR_armv7_linux_androideabi: ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
        run: |
          cargo build --release --target armv7-linux-androideabi -p sens-cli
          file target/armv7-linux-androideabi/release/my-lisp
      - uses: actions/upload-artifact@v6
        with:
          name: sens-android-nightly
          path: |
            target/aarch64-linux-android/release/my-lisp
            target/armv7-linux-androideabi/release/my-lisp
          if-no-files-found: error

  web-repl-build:
    name: portable web REPL build
    if: vars.HOSTED_RUNNERS == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: full-nightly-wasm-build
      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: 'v0.15.0'
      - name: Build WASM bindings
        run: wasm-pack build crates/sens-wasm --target web --out-dir ../../public/wasm
      - name: Bundle standalone HTML
        run: |
          node scripts/make-portable-web.mjs public/sens-cli-web.html sens-cli-web.html
          test -s sens-cli-web.html

  wasm-browser:
    name: WASM browser tests (Chrome + Firefox)
    if: vars.HOSTED_RUNNERS == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Use online Cargo registry on hosted runner
        run: rm .cargo/config.toml
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: jetli/wasm-pack-action@v0.4.0
      - name: Headless Chrome
        run: wasm-pack test --headless --chrome crates/sens-wasm
      - name: Headless Firefox
        run: wasm-pack test --headless --firefox crates/sens-wasm