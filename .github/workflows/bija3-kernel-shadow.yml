name: Bija3 epistemic kernel shadow

on:
  pull_request:
    paths:
      - "docs/research/2071-bija3-kernel.tsv"
      - "docs/research/2071-bija3-kernel-report*.md"
      - "scripts/research-2071-bija3-kernel.py"
      - ".github/workflows/bija3-kernel-shadow.yml"
  push:
    branches: [main]
    paths:
      - "docs/research/2071-bija3-kernel.tsv"
      - "docs/research/2071-bija3-kernel-report*.md"
      - "scripts/research-2071-bija3-kernel.py"
      - ".github/workflows/bija3-kernel-shadow.yml"
  workflow_dispatch:

jobs:
  kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Run seed-kernel checker
        run: python3 scripts/research-2071-bija3-kernel.py
      - name: Publish summary
        run: |
          {
            echo '## bīja3 epistemic kernel'
            echo
            echo 'Research-only. All seed addresses remain premise; unresolved remains unresolved.'
            echo
            echo '```text'
            python3 scripts/research-2071-bija3-kernel.py
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"