name: Current exact-domain SBCL load comparison

on:
  pull_request:
    paths:
      - "benchmarks/cross-language/current_sbcl_load.py"
      - "benchmarks/cross-language/current_sens.py"
      - "benchmarks/cross-language/current_sens_phases.py"
      - "crates/sens/examples/current_exact_domain_phase_bench.rs"
      - ".github/workflows/current-sbcl-load.yml"
  workflow_dispatch:

concurrency:
  group: current-sbcl-load-${{ github.ref }}
  cancel-in-progress: true

jobs:
  current-sbcl-load:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install SBCL and Cachegrind
        run: |
          sudo apt-get update
          sudo apt-get install -y sbcl valgrind
          sbcl --version
          valgrind --version

      - name: Build current exact-domain phase runner
        run: cargo build -p sens --release --example current_exact_domain_phase_bench

      - name: Compare current SENS with SBCL source/FASL ready phases
        run: |
          rm -rf /tmp/current-sbcl-load
          python3 benchmarks/cross-language/current_sbcl_load.py \
            --sens-runner target/release/examples/current_exact_domain_phase_bench \
            --sbcl sbcl \
            --reps 3 \
            --out /tmp/current-sbcl-load
          cat /tmp/current-sbcl-load/sbcl-load-report.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: current-exact-sbcl-load
          path: /tmp/current-sbcl-load
