name: Nano-SENS source closure edge audit
# Static inventory only: this workflow must not imply a minimum-seed or full-closure result.

on:
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-edges:
    name: Static Rust module and include edge inventory
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Вилучити точний стан репозиторію
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Витягнути pinned CML і SENS SHA з машинозчитуваних доказів
        id: pins
        shell: bash
        run: |
          set -euo pipefail
          CML_SHA="$(python3 - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path("evidence/nano-sens-seed-v0-2026-10-12.json").read_text())
          print(r["run"]["head_sha"])
          PY
          )"
          SENS_SHA="$(python3 - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path("evidence/nano-sens-seed-v0-source-closure-census-2026-10-12.json").read_text())
          print(r["pinned_source"]["commit"])
          PY
          )"
          [[ "$CML_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SENS_SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "cml_sha=$CML_SHA" >> "$GITHUB_OUTPUT"
          echo "sens_sha=$SENS_SHA" >> "$GITHUB_OUTPUT"
          echo "Nano-SENS pins: CML=$CML_SHA SENS=$SENS_SHA"

      - name: Отримати точний pinned CML source tree
        uses: actions/checkout@v5
        with:
          repository: juv4uk/cml
          ref: ${{ steps.pins.outputs.cml_sha }}
          path: cml-pinned
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Перевірити сам аудит на позитивних і негативних прикладах
        run: python3 scripts/audit-nano-sens-source-closure.py --self-test

      - name: Побудувати граф входів актуального main
        run: |
          set -euo pipefail
          python3 scripts/audit-nano-sens-source-closure.py \
            --repo-root . \
            --out "$RUNNER_TEMP/nano-sens-source-edges-main.json"

      - name: Побудувати граф точної SENS-версії, закріпленої в Nano-SENS census
        shell: bash
        run: |
          set -euo pipefail
          PINNED_SHA="${{ steps.pins.outputs.sens_sha }}"
          git cat-file -e "${PINNED_SHA}^{commit}"
          PINNED_ROOT="$RUNNER_TEMP/sens-pinned-source"
          git worktree add --detach "$PINNED_ROOT" "$PINNED_SHA"
          trap 'git worktree remove --force "$PINNED_ROOT" >/dev/null 2>&1 || true' EXIT
          python3 scripts/audit-nano-sens-source-closure.py \
            --repo-root "$PINNED_ROOT" \
            --out "$RUNNER_TEMP/nano-sens-source-edges-pinned.json"

      - name: Побудувати граф CML src/lib.rs та build.rs для pinned CML
        run: |
          set -euo pipefail
          test "$(git -C cml-pinned rev-parse HEAD)" = "${{ steps.pins.outputs.cml_sha }}"
          python3 scripts/audit-nano-sens-source-closure.py \
            --repo-root cml-pinned \
            --root-file src/lib.rs \
            --root-file build.rs \
            --manifest-file Cargo.toml \
            --manifest-file Cargo.lock \
            --manifest-file .gitmodules \
            --out "$RUNNER_TEMP/nano-sens-source-edges-cml-pinned.json"

      - name: Опублікувати всі три машинозчитувані аудити на 30 днів
        uses: actions/upload-artifact@v4
        with:
          name: nano-sens-static-source-edges-${{ github.sha }}
          path: |
            ${{ runner.temp }}/nano-sens-source-edges-main.json
            ${{ runner.temp }}/nano-sens-source-edges-pinned.json
            ${{ runner.temp }}/nano-sens-source-edges-cml-pinned.json
          if-no-files-found: error
          retention-days: 30

      - name: Зафіксувати межі доказу в анотації CI
        run: |
          echo "::notice title=Nano-SENS::Побудовано граф актуального main, pinned SENS і pinned CML із рекурсивними submodules. OUT_DIR класифіковано як згенерований output; build-script inputs, Cargo/vendor/Git/toolchain межі лишаються відкритими."
