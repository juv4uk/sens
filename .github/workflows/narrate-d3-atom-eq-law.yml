name: Двійковий SENS визначає точну D3 EQ у narrate

on:
  push:
    branches: [main]
    paths:
      - 'lib/narrate.lisp'
      - 'tests/semantic/narrate-d3-atom-eq-law.bits'
      - 'tests/semantic/narrate-d3-atom-eq-mutant.bits'
      - 'scripts/ci_failure_contract.py'
      - 'knowledge/red-test-quarantine.json'
      - '.github/workflows/narrate-d3-atom-eq-law.yml'
  pull_request:
    paths:
      - 'lib/narrate.lisp'
      - 'tests/semantic/narrate-d3-atom-eq-law.bits'
      - 'tests/semantic/narrate-d3-atom-eq-mutant.bits'
      - 'scripts/ci_failure_contract.py'
      - 'knowledge/red-test-quarantine.json'
      - '.github/workflows/narrate-d3-atom-eq-law.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  narrate-d3-exact:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: dtolnay/rust-toolchain@1.99.0
      - name: Контракт діагностики має відкидати відсутні поля
        run: python3 scripts/ci_failure_contract.py self-test
      - name: Зібрати механізм виконання SENS
        run: cargo build --locked -p sens-cli --bin sens --bin sens-trit
      - name: Виконати двійкові закони через контрольовану діагностику
        shell: bash
        run: |
          set -euo pipefail
          diagnostic='scripts/ci_failure_contract.py'
          report="$RUNNER_TEMP/narrate-diagnostic.jsonl"
          : > "$report"
          for kind in law mutant; do
            fixture="tests/semantic/narrate-d3-atom-eq-$kind.bits"
            program="$RUNNER_TEMP/narrate-$kind.sens"
            cp "$fixture" "$RUNNER_TEMP/narrate-$kind.lisp"
            python3 "$diagnostic" run --test-id "narrate-$kind-encode" --layer encode --fixture "$fixture" --report-file "$report" -- target/debug/sens-trit encode "$RUNNER_TEMP/narrate-$kind.lisp"
            python3 "$diagnostic" run --test-id "narrate-$kind-open" --layer transport --fixture "$fixture" --expected-file "$fixture" --report-file "$report" -- target/debug/sens-trit open "$program"
            if [ "$kind" = law ]; then printf '1\n' > "$RUNNER_TEMP/narrate-expected"; else printf '0\n' > "$RUNNER_TEMP/narrate-expected"; fi
            python3 "$diagnostic" run --test-id "narrate-$kind-eval" --layer eval --fixture "$fixture" --expected-file "$RUNNER_TEMP/narrate-expected" --report-file "$report" -- target/debug/sens "$program"
            python3 "$diagnostic" run --test-id "narrate-$kind-trit-eval" --layer eval --fixture "$fixture" --expected-file "$RUNNER_TEMP/narrate-expected" --report-file "$report" -- target/debug/sens-trit eval "$program"
          done
      - name: UNINFORMATIVE-OUTPUT — перевірити всі червоні діагностики
        if: always()
        run: python3 scripts/ci_failure_contract.py scan --report-file "$RUNNER_TEMP/narrate-diagnostic.jsonl" --allow-empty
