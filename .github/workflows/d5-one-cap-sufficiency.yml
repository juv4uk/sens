name: D5 one-capability sufficiency

on:
  workflow_dispatch:
jobs:
  d5-one-cap:
    name: D5 one transformer capability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run one-capability sufficiency witnesses
        run: cargo test -p sens --test d5_one_cap_sufficiency -- --nocapture
      - name: Publish summary
        if: always()
        run: |
          {
            echo "## D5 one-capability sufficiency"
            echo
            echo "- W1 raw operand preservation"
            echo "- W2 nested transformer expansion"
            echo "- W3 caller-environment post-expansion evaluation"
            echo "- W4 ordinary LAMBDA remains eager"
            echo "- W5 DEFMACRO remains derived"
            echo "- Research-only: 00101 is not ratified."
          } >> "$GITHUB_STEP_SUMMARY"
