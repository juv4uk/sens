name: Post-D4 root minimization R3

on:
  workflow_dispatch:

jobs:
  r3:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Run caller-env root minimization — EXCLUDED (NOT_VERIFIED)
        if: false
        shell: bash
        run: echo "FOREIGN_LANGUAGE_TEST_BENCH=EXCLUDED_BY_POLICY native_equivalent=NOT_VERIFIED"
      - name: Publish report
        if: always()
        run: |
          if test -f /tmp/post-d4-root-min-r3/report.md; then
            cat /tmp/post-d4-root-min-r3/report.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: post-d4-root-min-r3
          path: /tmp/post-d4-root-min-r3/
          retention-days: 14
