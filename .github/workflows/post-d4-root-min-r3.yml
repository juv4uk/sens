name: Post-D4 root minimization R3

on:
  pull_request:
    paths:
      - "benchmarks/post-d4-root-min-r3/**"
      - ".github/workflows/post-d4-root-min-r3.yml"
  push:
    branches: [main]
    paths:
      - "benchmarks/post-d4-root-min-r3/**"
      - ".github/workflows/post-d4-root-min-r3.yml"
  workflow_dispatch:

jobs:
  r3:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Run caller-env root minimization
        run: |
          rm -rf /tmp/post-d4-root-min-r3
          python3 benchmarks/post-d4-root-min-r3/run.py             --out /tmp/post-d4-root-min-r3
      - name: Publish report
        if: always()
        run: |
          if test -f /tmp/post-d4-root-min-r3/report.md; then
            cat /tmp/post-d4-root-min-r3/report.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: post-d4-root-min-r3
          path: /tmp/post-d4-root-min-r3/
          retention-days: 14
