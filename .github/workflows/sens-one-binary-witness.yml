name: SENS one automatic exact-bit witness

# Single automatic semantic check. The verdict belongs only to binary SENS.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sens-one-binary-witness.yml'
      - 'tests/semantic/d4-selector-width-*.bits'
      - 'tests/semantic/d4-selector-width-*.sens'
      - 'crates/sens/src/eval/selector_law.rs'
      - 'crates/sens/src/eval/special_forms/**'
      - 'crates/sens-cli/src/bin/sens-trit.rs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sens-single-exact-bit-witness
  cancel-in-progress: true

jobs:
  binary-sens:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.99.0

      - name: Run exactly one SENS-owned selector/width law and its one-bit falsifier
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/sens-d4-report.jsonl"
          : > "$report"
          python3 scripts/ci_failure_contract.py run \
            --test-id d4-build --layer transport \
            --fixture tests/semantic/d4-selector-width-law.bits \
            --report-file "$report" \
            -- cargo build --locked -p sens-cli --bin sens-trit
          for variant in law mutant; do
            fixture="tests/semantic/d4-selector-width-$variant"
            cp "$fixture.bits" "$RUNNER_TEMP/d4-$variant.lisp"
            cp "$fixture.sens" "$RUNNER_TEMP/d4-$variant.sens"
            python3 scripts/ci_failure_contract.py run \
              --test-id "d4-$variant-transport" --layer transport \
              --fixture "$fixture.bits" --report-file "$report" \
              -- target/debug/sens-trit verify "$RUNNER_TEMP/d4-$variant.lisp"
            python3 scripts/ci_failure_contract.py run \
              --test-id "d4-$variant-parse" --layer parse \
              --fixture "$fixture.bits" --report-file "$report" \
              -- target/debug/sens-trit explain "$RUNNER_TEMP/d4-$variant.sens"
          done

          # Mechanical comparison of EXACT words; never changes semantic truth.
          mapfile -t good < <(tr '[:space:]' '\n' < tests/semantic/d4-selector-width-law.bits | sed '/^$/d')
          mapfile -t bad < <(tr '[:space:]' '\n' < tests/semantic/d4-selector-width-mutant.bits | sed '/^$/d')
          if (( ${#good[@]} != ${#bad[@]} )); then
            echo "::error title=BITNESS::law and mutant have different word counts"
            exit 1
          fi
          flips=0
          for ((i=0; i<${#good[@]}; i++)); do
            if (( ${#good[i]} != ${#bad[i]} )); then
              echo "::error title=BITNESS::different domain width word=$i law=${good[i]} mutant=${bad[i]}"
              exit 1
            fi
            for ((j=0; j<${#good[i]}; j++)); do
              if [[ "${good[i]:j:1}" != "${bad[i]:j:1}" ]]; then
                ((flips+=1))
                echo "BIT_DIFF word=$i bit=$j expected=${good[i]} actual=${bad[i]}"
              fi
            done
          done
          if (( flips != 1 )); then
            echo "::error title=BIT_MUTANT::exactly one bit must change, found=$flips"
            exit 1
          fi

          # A successful SENS COND branch produces D1:1, not a host truth table.
          printf '1\n' > "$RUNNER_TEMP/d1-pass.txt"
          python3 scripts/ci_failure_contract.py run \
            --test-id d4-self-verdict --layer eval \
            --fixture tests/semantic/d4-selector-width-law.bits \
            --expected-file "$RUNNER_TEMP/d1-pass.txt" --report-file "$report" \
            -- target/debug/sens-trit eval "$RUNNER_TEMP/d4-law.sens"

          python3 scripts/ci_failure_contract.py run \
            --test-id d4-mutant-noncallable --layer eval \
            --fixture tests/semantic/d4-selector-width-mutant.bits \
            --report-file "$report" \
            -- bash -c '
              set +e
              target/debug/sens-trit eval "$RUNNER_TEMP/d4-mutant.sens" > "$RUNNER_TEMP/mutant.out" 2> "$RUNNER_TEMP/mutant.err"
              code=$?
              if [ "$code" -eq 0 ]; then
                echo "Mutant wrongly accepted by SENS" >&2
                cat "$RUNNER_TEMP/mutant.out" >&2
                exit 1
              fi
              if ! grep -qi "not callable" "$RUNNER_TEMP/mutant.err"; then
                echo "Mutant rejected for a reason other than SENS non-callable branch" >&2
                cat "$RUNNER_TEMP/mutant.err" >&2
                exit 1
              fi
              exit 0
            '
      - name: Red must speak (SHA, exact mismatch and reproduction)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "### Focused binary SENS D4 test"
            echo "Source SHA: $GITHUB_SHA"
            echo "Law: tests/semantic/d4-selector-width-law.sens"
            echo "Mutant: tests/semantic/d4-selector-width-mutant.sens"
            sha256sum tests/semantic/d4-selector-width-{law,mutant}.{bits,sens}
            echo "Reproduce: cargo build --locked -p sens-cli --bin sens-trit && target/debug/sens-trit eval tests/semantic/d4-selector-width-law.sens"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          python3 scripts/ci_failure_contract.py scan \
            --report-file "$RUNNER_TEMP/sens-d4-report.jsonl" --allow-empty
