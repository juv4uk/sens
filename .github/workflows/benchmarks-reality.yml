name: benchmarks-reality

# Круті бенчмарки, витягнуті з надр на воркфлоу й перероблені під нову
# реальність. Двійковий SENS — влада; тут — точкові вимірювані факти мови:
# економія генераторів, метрики графа доменів, алгебра функцій-чисел (закони
# ширини — саме нова реальність D24+), стрес інваріантності, µCPU-фази,
# необмежена ширина носія. Кожен бенчмарк друкує вердикт; гейт його звіряє, а
# вердикт виноситься як ::notice:: — анотація на прогоні (видно в UI).
# ПОЛІТИКА ВЛАСНИКА: рівно один автоматичний workflow (ci.yml).
# Performance evidence лишається доступним вручну; додатковий push заборонено.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmarks:
    name: Buried benchmarks in the new reality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Generator economy — one-off never amortises
        run: |
          set -euo pipefail
          out="$(python3 benchmarks/generator-economy/generator_economy.py)"
          printf '%s\n' "$out" | tail -3
          line="$(printf '%s\n' "$out" | grep 'falsifiers:')"
          printf '%s\n' "$line" | grep -q 'falsifiers:'
          echo "::notice title=generator-economy::${line}"
      - name: Domain graph metrics
        run: |
          set -euo pipefail
          out="$(python3 benchmarks/domain-graph-metrics/run.py)"
          printf '%s\n' "$out" | tail -5
          line="$(printf '%s\n' "$out" | grep 'host_timing')"
          printf '%s\n' "$line" | grep -q 'host_timing'
          echo "::notice title=domain-graph-metrics::${line}"
      - name: Function-number algebra — width laws (D24+ reality)
        run: |
          set -euo pipefail
          out="$(python3 benchmarks/function-number-algebra/probe.py)"
          printf '%s\n' "$out" | grep -q 'full_mul'
          echo "::notice title=function-number-algebra::full_add Wn x Wn -> W(n+1); full_mul Wn x Wn -> W(2n)"
      - name: Semantic invariance stress — no canonical drift
        run: |
          set -euo pipefail
          out="$(python3 benchmarks/semantic-invariance-stress/invariance_suite.py)"
          printf '%s\n' "$out"
          line="$(printf '%s\n' "$out" | grep 'VERDICT:')"
          printf '%s\n' "$line" | grep -q 'VERDICT: INVARIANT'
          echo "::notice title=semantic-invariance-stress::${line}"
      - name: MicroCPU — warm vs full phase boundaries
        run: |
          set -euo pipefail
          out="$(python3 benchmarks/microcpu/bench.py --out "$RUNNER_TEMP/microcpu.json")"
          printf '%s\n' "$out"
          line="$(printf '%s\n' "$out" | grep 'T5=' | head -1)"
          printf '%s\n' "$line" | grep -q 'T5='
          echo "::notice title=microcpu::${line}"
      - name: Unbounded width — carrier has no language maximum
        run: |
          set -euo pipefail
          if ! command -v valgrind >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y -qq valgrind; fi
          out="$(python3 benchmarks/unbounded-width/run.py --smoke --out "$RUNNER_TEMP/unbounded-width.tsv")"
          printf '%s\n' "$out" | tail -3
          line="$(printf '%s\n' "$out" | grep 'wrote')"
          printf '%s\n' "$line" | grep -q 'wrote'
          echo "::notice title=unbounded-width::${line}"
