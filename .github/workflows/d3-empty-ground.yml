name: D3 EMPTY ground law research

on:
  workflow_dispatch:

jobs:
  empty-ground:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Run semantic witness plus exhaustive 8! audit
        run: |
          rm -rf /tmp/d3-empty-ground
          echo "FOREIGN_LANGUAGE_TEST_OR_BENCH=EXCLUDED_BY_POLICY native_equivalent=NOT_VERIFIED"

      - name: Publish report
        if: always()
        run: |
          if test -f /tmp/d3-empty-ground/report.md; then
            cat /tmp/d3-empty-ground/report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d3-empty-ground
          path: /tmp/d3-empty-ground/
          retention-days: 14
