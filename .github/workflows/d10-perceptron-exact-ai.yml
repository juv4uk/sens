name: D10 1958 perceptron exact AI research

on:
  pull_request:
    paths:
      - knowledge/d10-rosenblatt-novikoff-exact-step-20261009.json
      - tests/test_d10_rosenblatt_perceptron_exact.py
      - .github/workflows/d10-perceptron-exact-ai.yml
  push:
    branches: [main]
    paths:
      - knowledge/d10-rosenblatt-novikoff-exact-step-20261009.json
      - tests/test_d10_rosenblatt_perceptron_exact.py
      - .github/workflows/d10-perceptron-exact-ai.yml

permissions:
  contents: read

jobs:
  exact-neural-law:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Compare Rosenblatt Novikoff update with exact signed margin invariant
        run: python3 tests/test_d10_rosenblatt_perceptron_exact.py
