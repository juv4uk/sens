name: Temporary Core4 FASL artifact regeneration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/core4-fasl-artifact.yml'
      - 'lib/core4.lisp'
      - 'crates/sens/src/mixed_source.rs'
      - 'crates/sens-cli/src/bin/gen-fasl.rs'
      - 'lib/surface/function-signatures.lisp'

permissions:
  contents: write

jobs:
  build-fasl:
    name: Generate, verify, and commit exact-domain Core4 FASL
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Generate source-matched exact-domain snapshot
        run: cargo run --locked -p sens-cli --bin gen-fasl -- lib/core4.lisp "$RUNNER_TEMP/core4.lisp.fasl"
      - name: Replace generated FASL and prove freshness
        shell: bash
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/core4.lisp.fasl" lib/core4.lisp.fasl
          test -s lib/core4.lisp.fasl
          cargo test --locked -p sens --test core_fasl_freshness
          git diff --check
      - name: Commit binary snapshot with race-safe fast-forward
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/core4.lisp.fasl
          git commit -m "fix(fasl): regenerate Core4 exact-domain snapshot"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort
              echo "FASL commit could not rebase cleanly; refusing to overwrite concurrent changes" >&2
              exit 1
            fi
            # A concurrent main update may have changed the source after the
            # first generation. Rebuild from the rebased tree and prove source
            # hash freshness again before allowing this commit to reach main.
            cargo run --locked -p sens-cli --bin gen-fasl -- lib/core4.lisp "$RUNNER_TEMP/core4.lisp.fasl"
            cp "$RUNNER_TEMP/core4.lisp.fasl" lib/core4.lisp.fasl
            test -s lib/core4.lisp.fasl
            cargo test --locked -p sens --test core_fasl_freshness
            git diff --check
            git add lib/core4.lisp.fasl
            git commit --amend --no-edit
            if git push origin HEAD:main; then
              exit 0
            fi
          done
          echo "FASL snapshot push failed after five fast-forward attempts" >&2
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core4-fasl-verified-${{ github.sha }}
          path: lib/core4.lisp.fasl
          if-no-files-found: error
          retention-days: 1
