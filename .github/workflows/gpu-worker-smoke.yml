name: Shared CUDA worker smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gpu-worker:
    # SKIPPED = hardware UNVERIFIED, not a GPU pass. GitHub-hosted GPU required.
    if: vars.GITHUB_HOSTED_GPU_RUNNER != ''
    runs-on: ${{ vars.GITHUB_HOSTED_GPU_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 5
    env:
      CML_GPU_WORKER_SOCKET: /run/cml-gpu-worker/worker.sock

    steps:
      - name: GitHub-hosted GPU availability (fail closed)
        run: |
          test "${RUNNER_ENVIRONMENT:-}" = github-hosted || { echo "::error::Self-hosted forbidden"; exit 1; }
          command -v nvidia-smi >/dev/null 2>&1 || { echo "::error::No CUDA device on standard GitHub-hosted runner"; exit 1; }
          nvidia-smi

      - name: Probe shared GPU worker
        shell: bash
        run: |
          set -euo pipefail
          /usr/lib/wsl/lib/nvidia-smi             --query-gpu=name,compute_cap,memory.total             --format=csv,noheader
          test "$(cml-gpu-worker ping)" = "pong"
          cml-gpu-worker probe

      - name: Execute real CUDA witness
        shell: bash
        run: |
          set -euo pipefail
          result="$(cml-gpu-worker add-i32 7 1 2 3 4)"
          test "$result" = "8 9 10 11"
          echo "GPU_SHARED_WORKER_GREEN repo=$GITHUB_REPOSITORY result=$result"
