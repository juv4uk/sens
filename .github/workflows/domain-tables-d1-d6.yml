name: domain-tables-d1-d6

on:
  pull_request:
    paths:
      - "knowledge/d1-d7-foundation.json"
      - "knowledge/domain-table-projection-d1-d6.json"
      - "lib/surface/domain-surfaces-d1-d4.lisp"
      - "lib/surface/domain-surfaces-d5.lisp"
      - "scripts/generate-domain-tables-d1-d6.py"
      - "docs/generated/domain-tables-d1-d6.md"
      - ".github/workflows/domain-tables-d1-d6.yml"
  push:
    branches: [main]
    paths:
      - "knowledge/d1-d7-foundation.json"
      - "knowledge/domain-table-projection-d1-d6.json"
      - "lib/surface/domain-surfaces-d1-d4.lisp"
      - "lib/surface/domain-surfaces-d5.lisp"
      - "scripts/generate-domain-tables-d1-d6.py"
      - "docs/generated/domain-tables-d1-d6.md"
      - ".github/workflows/domain-tables-d1-d6.yml"

jobs:
  canonical-domain-tables:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check canonical D1-D6 tables
        id: check
        shell: bash
        run: |
          set +e
          python3 scripts/generate-domain-tables-d1-d6.py > domain-table-check.log 2>&1
          code=$?
          echo "$code" > domain-table-exit-code.txt
          cat domain-table-check.log
          exit 0
      - name: Upload diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: domain-table-check
          path: |
            domain-table-check.log
            domain-table-exit-code.txt
      - name: Enforce result
        shell: bash
        run: test "$(cat domain-table-exit-code.txt)" = "0"
