name: domain-tables-d1-d6

on:
  pull_request:
    paths:
      - "knowledge/d1-d7-foundation.json"
      - "lib/surface/domain-surfaces-d1-d4.lisp"
      - "lib/surface/domain-surfaces-d5.lisp"
      - "lib/surface/domain-surfaces-d6.lisp"
      - "lib/surface/semantic-registry.lisp"
      - "scripts/generate-domain-tables-d1-d6.py"
      - "scripts/check-domain-table-readable.lisp"
      - "lib/generated/domain-table-d1-d6.lisp"
      - "docs/generated/domain-tables-d1-d6.md"
      - ".github/workflows/domain-tables-d1-d6.yml"
  push:
    branches: [main]
    paths:
      - "knowledge/d1-d7-foundation.json"
      - "lib/surface/domain-surfaces-d1-d4.lisp"
      - "lib/surface/domain-surfaces-d5.lisp"
      - "lib/surface/domain-surfaces-d6.lisp"
      - "lib/surface/semantic-registry.lisp"
      - "scripts/generate-domain-tables-d1-d6.py"
      - "scripts/check-domain-table-readable.lisp"
      - "lib/generated/domain-table-d1-d6.lisp"
      - "docs/generated/domain-tables-d1-d6.md"
      - ".github/workflows/domain-tables-d1-d6.yml"

jobs:
  canonical-domain-tables:
    runs-on: [self-hosted, Linux, X64, gpu, gtx-1050-ti, cuda-12.6]
    steps:
      - uses: actions/checkout@v5
      - name: Check canonical D1-D6 Lisp-first tables
        id: check
        shell: bash
        run: |
          set +e
          python3 scripts/generate-domain-tables-d1-d6.py > domain-table-check.log 2>&1
          code=$?
          echo "$code" > domain-table-exit-code.txt
          cat domain-table-check.log
          exit 0
      - name: Upload diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: domain-table-check
          path: |
            domain-table-check.log
            domain-table-exit-code.txt
      - name: Enforce result
        shell: bash
        run: test "$(cat domain-table-exit-code.txt)" = "0"
      - name: Prove exact-width substrate preserves domain address
        run: |
          cargo test -p sens source_words::tests::same_numeric_payload_at_different_widths_never_collapses
          cargo test -p sens canonical_reader::tests::w3_through_w8_reach_ast_with_exact_domain_preserved
      - name: Record Lisp table-reader gap
        run: echo "ordinary read-all width bridge tracked by #3946; acceptance witness is scripts/check-domain-table-readable.lisp"
