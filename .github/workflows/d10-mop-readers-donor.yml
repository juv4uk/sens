name: D10 CLOS MOP 17 reader donor census
on:
  pull_request:
    paths:
      - 'knowledge/d10-mop-metaobject-reader-census-20261009.json'
      - 'scripts/check_d10_mop_reader_census.py'
      - 'tests/oracles/d10_mop_readers_sbcl.lisp'
      - 'docs/research/d10-mop-readers-20261009.uk.md'
      - '.github/workflows/d10-mop-readers-donor.yml'
  workflow_dispatch:
jobs:
  mop-reader-oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Check 17 reader census and 7 negative mutations
        run: python3 scripts/check_d10_mop_reader_census.py
      - name: Install real SBCL
        run: sudo apt-get update -qq && sudo apt-get install -y sbcl
      - name: Run independent 15 case historical MOP donor
        run: python3 scripts/check_d10_mop_reader_census.py --run-sbcl
