name: Physical T5 performance benchmarks

# Record real numbers from release binaries, not pass/fail-only smoke.
on:
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: physical-t5-performance-${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  physical-t5-measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/install-zig
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: sens-t5-benchmark

      - name: Build production physical SENS executables (release)
        run: cargo build --locked --release -p sens-cli --bin sens --bin sens-trit

      - name: "Measure packed T5 execution, decode and code size — EXCLUDED (NOT_VERIFIED)"
        shell: bash
        run: echo "PYTHON_TESTS_AND_BENCHMARKS=EXCLUDED_BY_LANGUAGE_POLICY native_equivalent=NOT_VERIFIED"

      - name: "Validate in-process evidence protocol (fail closed) — EXCLUDED (NOT_VERIFIED)"
        shell: bash
        run: echo "PYTHON_TESTS_AND_BENCHMARKS=EXCLUDED_BY_LANGUAGE_POLICY native_equivalent=NOT_VERIFIED"

      - name: Build real pure SENS in-process phase probe
        run: cargo build --locked --release -p sens --example physical_t5_phase_probe

      - name: "Measure in-process decode, parse and hot execution — EXCLUDED (NOT_VERIFIED)"
        shell: bash
        run: echo "PYTHON_TESTS_AND_BENCHMARKS=EXCLUDED_BY_LANGUAGE_POLICY native_equivalent=NOT_VERIFIED"

      - name: Publish measured summary
        if: always()
        shell: bash
        run: |
          if test -s "$RUNNER_TEMP/physical-t5-bench/report.md"; then
            cat "$RUNNER_TEMP/physical-t5-bench/report.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No measurements: build or parity blocked; no speed claim." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Show in-process phase results
        if: always()
        shell: bash
        run: |
          if test -s "$RUNNER_TEMP/physical-t5-bench/inprocess.md"; then
            cat "$RUNNER_TEMP/physical-t5-bench/inprocess.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No phase-local evidence: protocol, oracle or build blocked." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload raw timings, SHA and statistics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: physical-t5-bench-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/physical-t5-bench/
          if-no-files-found: warn
          retention-days: 14
