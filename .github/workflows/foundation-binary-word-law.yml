name: Foundation binary-word law shadow

on:
  pull_request:
    paths:
      - "scripts/research-2077-binary-word-law.py"
      - "docs/research/2077-binary-word-law*.md"
      - ".github/workflows/foundation-binary-word-law.yml"
  push:
    branches: [main]
    paths:
      - "scripts/research-2077-binary-word-law.py"
      - "docs/research/2077-binary-word-law*.md"
      - ".github/workflows/foundation-binary-word-law.yml"
  workflow_dispatch:

jobs:
  witness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Run Foundation-0 witness
        run: python3 scripts/research-2077-binary-word-law.py

      - name: Publish invariant summary
        run: |
          {
            echo '## Foundation-0 binary-word law'
            echo
            echo 'Shadow/research witness only. It does not supersede the active language contract.'
            echo
            echo '```text'
            python3 scripts/research-2077-binary-word-law.py
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"