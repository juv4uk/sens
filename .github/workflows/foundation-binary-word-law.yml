name: Foundation binary-word law shadow

on:
  pull_request:
    paths:
      - "scripts/research-2077-binary-word-law.py"
      - "scripts/research-4261-current-binary-authority.py"
      - "lib/domains/d1.lisp"
      - "lib/domains/d2.lisp"
      - "lib/domains/d3.lisp"
      - "lib/domains/d4.lisp"
      - "lib/domains/d5.lisp"
      - "lib/domains/d6.lisp"
      - "lib/domains/d7.lisp"
      - "lib/domains/d8.lisp"
      - "lib/domains/d9.lisp"
      - "docs/research/2077-binary-word-law*.md"
      - ".github/workflows/foundation-binary-word-law.yml"
  push:
    branches: [main]
    paths:
      - "scripts/research-2077-binary-word-law.py"
      - "scripts/research-4261-current-binary-authority.py"
      - "lib/domains/d1.lisp"
      - "lib/domains/d2.lisp"
      - "lib/domains/d3.lisp"
      - "lib/domains/d4.lisp"
      - "lib/domains/d5.lisp"
      - "lib/domains/d6.lisp"
      - "lib/domains/d7.lisp"
      - "lib/domains/d8.lisp"
      - "lib/domains/d9.lisp"
      - "docs/research/2077-binary-word-law*.md"
      - ".github/workflows/foundation-binary-word-law.yml"
  workflow_dispatch:

jobs:
  witness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Run Foundation-0 witness
        run: python3 scripts/research-2077-binary-word-law.py

      - name: Run current-authority D1-D9 witness
        run: python3 scripts/research-4261-current-binary-authority.py

      - name: Перевірити Foundation-0 і чинні D1–D9 за Python -O
        run: |
          set -euo pipefail
          for script in scripts/research-2077-binary-word-law.py scripts/research-4261-current-binary-authority.py; do
            for mode in -O -OO; do
              if python3 "$mode" "$script" > /tmp/foundation-opt.log 2>&1; then
                echo "Хибний PASS оптимізованого Python: $script" >&2
                exit 1
              fi
              grep -q 'BLOCKED' /tmp/foundation-opt.log
              ! grep -q 'PASS' /tmp/foundation-opt.log
            done
            for level in 1 2; do
              if PYTHONOPTIMIZE="$level" python3 "$script" > /tmp/foundation-opt.log 2>&1; then
                echo "Хибний PASS PYTHONOPTIMIZE: $script" >&2
                exit 1
              fi
              grep -q 'BLOCKED' /tmp/foundation-opt.log
              ! grep -q 'PASS' /tmp/foundation-opt.log
            done
          done
      - name: Publish invariant summary
        run: |
          {
            echo '## Foundation-0 binary-word law'
            echo
            echo 'Shadow/research witness only. It does not supersede the active language contract.'
            echo
            echo '```text'
            python3 scripts/research-2077-binary-word-law.py
            echo
            python3 scripts/research-4261-current-binary-authority.py
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"