name: Core1 compiler SID8 resolver

on:
  pull_request:
    paths:
      - "lib/core1.lisp"
      - "lib/core1-compiler-sid-resolver.lisp"
      - "contracts/core1-historical-sid-map.lisp"
      - "contracts/core-profile-contract.lisp"
      - "scripts/check-core1-compiler-sid-resolver.lisp"
      - "knowledge/repo-tooling-inventory.lisp"
      - ".github/workflows/core1-compiler-sid-resolver.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core1-sid8-resolver:
    name: Core1 compiler resolver delegates to admitted SID8
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build semantic oracle
        run: cargo build -p my-lisp-cli --bin my-lisp

      - name: Check Lisp-owned resolver authority
        shell: bash
        run: |
          set -euo pipefail
          actual="$(./target/debug/my-lisp scripts/check-core1-compiler-sid-resolver.lisp)"
          printf '%s\n' "$actual"
          test "$actual" = "(core1-compiler-sid-resolver-check pass)"

      - name: Checkout typed-SID8 historical S0
        uses: actions/checkout@v5
        with:
          repository: juv4uk/mccarthy-eval
          ref: 79f2f38f2a8da22a5bbcb39312da5f726ab2471f
          path: .core1-resolver/mccarthy-eval

      - name: Build typed-SID8 historical S0
        working-directory: .core1-resolver/mccarthy-eval
        run: gcc -no-pie -O0 -s -o mccarthy-kernel mccarthy-kernel.s

      - name: Execute compiler resolver on S0/Core1
        shell: bash
        run: |
          set -euo pipefail

          {
            cat lib/core1.lisp
            cat lib/core1-compiler-sid-resolver.lisp
            cat <<'LISP'
          (C1-COMPILER-SID-FOR-SURFACE (QUOTE CONS))
          (C1-COMPILER-SID-FOR-SURFACE (QUOTE CAR))
          (C1-COMPILER-SID-FOR-SURFACE (QUOTE ATOM))
          (C1-COMPILER-SID-FOR-SURFACE (QUOTE EQ))
          (C1-COMPILER-SID-FOR-SURFACE (QUOTE CDR))
          (C1-COMPILER-SID-FOR-SURFACE (QUOTE NOT))
          (C1-COMPILER-SID-FOR-SURFACE (QUOTE LIST))
          (C1-COMPILER-SID-FOR-SURFACE (QUOTE +))
          (C1-COMPILER-SID-FOR-SURFACE (QUOTE -))
          (C1-COMPILER-SID-FOR-SURFACE (QUOTE UNKNOWN))
          (EQ (C1-COMPILER-SID-FOR-SURFACE (QUOTE CONS)) (QUOTE 00000100))
          LISP
          } > .core1-resolver/resolver-witness.lisp

          expected='00000100
          00000101
          00000010
          00000011
          00000110
          00100001
          00100111
          NIL
          NIL
          NIL
          T'

          actual="$(
            cd .core1-resolver/mccarthy-eval
            ./mccarthy-kernel ../resolver-witness.lisp
          )"

          printf '%s\n' "$actual"
          test "$actual" = "$expected"

      - name: Diff hygiene
        run: git diff --check
