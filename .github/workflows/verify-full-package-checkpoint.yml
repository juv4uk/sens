name: Verify current full package checkpoint

on:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  full-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Full SENS package
        run: cargo test -p sens
