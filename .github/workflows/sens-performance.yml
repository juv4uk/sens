# Manual benchmark tournament: each implementation owns one measurable lane.
# Rust = mechanism, Zig = physical corridor, SENS = language semantics.
# No host-language truth tables and no synthetic success when evidence is absent.
name: SENS contest — Rust mechanism, Zig corridor, SENS laws

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sens-performance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rust-mechanism:
    name: Rust — exact-width and memory mechanism
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.99.0
      - name: Measure byte-copy mechanism (11 timed samples; exact physical parity)
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/contest-rust"
          mkdir -p "$out"
          printf 'git_sha\t%s\n' "$GITHUB_SHA" > "$out/environment.tsv"
          rustc -O --edition=2021 benchmarks/mechanism/rust-byte-copy-bench.rs -o "$out/rust-byte-copy"
          "$out/rust-byte-copy" | tee "$out/byte-copy.tsv"
          grep -Fq 'scope=mechanism_only' "$out/byte-copy.tsv"
      - name: Measure exact-width bit packing only (no language-result oracle)
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/contest-rust"
          cargo run --locked --release -p sens --example byte_pack_bench -- series mixed 1024 9 > "$out/packed.tsv"
          grep -Eq '^PACK_BENCH_SAMPLE[[:space:]]' "$out/packed.tsv"
          grep -Eq '^PACK_BENCH_SUMMARY[[:space:]]' "$out/packed.tsv"
          grep -Fq 'parity=exact' "$out/packed.tsv"
      - name: Preserve raw Rust mechanism observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: contest-rust-mechanism-${{ github.sha }}
          path: ${{ runner.temp }}/contest-rust/
          if-no-files-found: warn
          retention-days: 21

  zig-corridor:
    name: Zig — T5M physical corridor and byte transport
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-zig
      - name: Measure Zig byte movement over the identical Rust corpus
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/contest-zig"
          mkdir -p "$out"
          printf 'git_sha\t%s\n' "$GITHUB_SHA" > "$out/environment.tsv"
          zig version >> "$out/environment.tsv"
          zig test -O ReleaseFast -lc benchmarks/mechanism/zig-byte-copy-bench.zig > "$out/byte-copy.log" 2>&1 || {
            cat "$out/byte-copy.log" >&2
            exit 1
          }
          grep -F 'ZIG_CORRIDOR_COPY_BENCH ' "$out/byte-copy.log" | tee "$out/byte-copy.tsv"
          grep -Fq 'scope=physical_only' "$out/byte-copy.tsv"
          grep -Fq 'source=lib/core4.lisp ' "$out/byte-copy.tsv"
          grep -Fq 'batch=512 samples=11 ' "$out/byte-copy.tsv"
      - name: Exercise physical codecs without any SENS language truth table
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/contest-zig"
          zig test -lc research/zig-codecs/tests.zig > "$out/codec-tests.log" 2>&1 || {
            cat "$out/codec-tests.log" >&2
            exit 1
          }
          zig test -O ReleaseFast -lc bench_t5m_test.zig > "$out/t5m-tests.log" 2>&1 || {
            cat "$out/t5m-tests.log" >&2
            exit 1
          }
          zig run -O ReleaseFast -lc bench_t5m.zig > "$out/t5m-bench.log" 2>&1 || {
            cat "$out/t5m-bench.log" >&2
            exit 1
          }
          grep -F 'ZIG_T5M_SAMPLE ' "$out/t5m-bench.log" > "$out/t5m-samples.tsv"
          grep -F 'ZIG_T5M_BENCH ' "$out/t5m-bench.log" > "$out/t5m-summary.tsv"
          test "$(wc -l < "$out/t5m-samples.tsv")" -eq 11
          test "$(wc -l < "$out/t5m-summary.tsv")" -eq 1
          grep -Fq 'scope=zig-codec-only' "$out/t5m-summary.tsv"
      - name: Preserve raw Zig corridor observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: contest-zig-corridor-${{ github.sha }}
          path: ${{ runner.temp }}/contest-zig/
          if-no-files-found: warn
          retention-days: 21

  sens-language:
    name: SENS — native language law and negative mutant
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: ./.github/actions/install-zig
      - name: Build the physical SENS executor
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked -p sens-cli --bin sens --bin sens-trit --features benchmark-ast-visits
          test -x target/debug/sens
          test -x target/debug/sens-trit
      - name: Execute the SENS-owned structural law and its false mutant
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/contest-sens"
          mkdir -p "$out"
          printf 'git_sha\t%s\n' "$GITHUB_SHA" > "$out/environment.tsv"
          SENS_BENCH_SAMPLES_OUT="$out/raw-samples.tsv" bash scripts/prove-бенчмарк-структура.sh "$PWD/target/debug/sens" | tee "$out/native-law.tsv"
          grep -Fq 'БЕНЧМАРК_СТРУКТУРА=PASS native=SENS' "$out/native-law.tsv"
          grep -Fq 'mutant=D1:ні samples=11' "$out/native-law.tsv"
          test "$(wc -l < "$out/raw-samples.tsv")" -eq 12
          test "$(grep -c '^[0-9][0-9]*[[:space:]]' "$out/raw-samples.tsv")" -eq 11
      - name: Preserve actual SENS verdict and elapsed-time samples
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: contest-sens-language-${{ github.sha }}
          path: ${{ runner.temp }}/contest-sens/
          if-no-files-found: warn
          retention-days: 21
