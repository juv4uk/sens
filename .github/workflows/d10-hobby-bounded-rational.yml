name: D10 Spanda bounded rational root
on:
  pull_request:
    paths:
      - knowledge/d10-v1-semantic-inventory.json
      - knowledge/d10-fill-v1-state.json
      - knowledge/d10-selection-transition-history.json
      - knowledge/d10-hobby-exact-measurement-intake-v1.json
      - docs/architecture/ARCHIPELAGO-V1.uk.md
      - scripts/check_d10_hobby_bounded_rational.py
      - .github/workflows/d10-hobby-bounded-rational.yml
  workflow_dispatch:
jobs:
  exact-recovery:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify D10 selector count and shared inventory authority
        run: python3 scripts/check-d10-fill-v1-seed.py
      - name: Prove immutable 625 to 627 to 630 to 631 Git-blob chain
        run: python3 scripts/check_d10_selection_transition_history.py --self-test
      - name: Run bounded exact recovery exhaustive differential oracle
        run: python3 scripts/check_d10_hobby_bounded_rational.py --self-test
