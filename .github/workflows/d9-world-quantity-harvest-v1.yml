name: D9 world quantity harvest v1

on:
  pull_request:
    paths:
      - "lib/world.lisp"
      - "lib/quantity.lisp"
      - "knowledge/d9-world-quantity-harvest-v1.json"
      - "knowledge/d9-v1-semantic-inventory.json"
      - "knowledge/d9-fill-v1-state.json"
      - "scripts/check-d9-world-quantity-harvest-v1.py"
      - "scripts/check-d9-v1-semantic-inventory.py"
      - "scripts/check-d9-semantic-layer-harvest-v1.py"
      - ".github/workflows/d9-world-quantity-harvest-v1.yml"
  push:
    branches: [main]
    paths:
      - "knowledge/d9-world-quantity-harvest-v1.json"
      - "knowledge/d9-v1-semantic-inventory.json"
      - "knowledge/d9-fill-v1-state.json"
      - "scripts/check-d9-world-quantity-harvest-v1.py"
      - ".github/workflows/d9-world-quantity-harvest-v1.yml"
  workflow_dispatch:

jobs:
  world-quantity:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: GPU runner identity
        run: nvidia-smi || true
      - name: Verify world and quantity harvest
        run: python3 scripts/check-d9-world-quantity-harvest-v1.py
      - name: Verify global D9 inventory
        run: python3 scripts/check-d9-v1-semantic-inventory.py
      - name: Preserve semantic-layer tranche
        run: python3 scripts/check-d9-semantic-layer-harvest-v1.py
      - name: Preserve registry-tail tranche
        run: python3 scripts/check-d9-registry-tail-v1.py
      - name: Preserve library tranche
        run: python3 scripts/check-d9-library-harvest-v1.py
