name: D10 D9 donor dedup evidence
on:
  workflow_dispatch:
jobs:
  pinned-d9-research-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Source blob, D9 coordinate and no D10 false promotion
        run: python3 scripts/check_d10_d9_donor_dedup.py --root .
      - name: Adversarial contract tests
        run: python3 -m unittest discover -s tests -p 'test_d10_d9_donor_dedup.py' -v
