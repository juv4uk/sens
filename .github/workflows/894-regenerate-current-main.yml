name: #894 regenerate current-main generated artifacts

on:
  push:
    branches:
      - fix/894-core-fasl-current-main

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/894-core-fasl-current-main
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Regenerate generated artifacts
        run: |
          set -euo pipefail
          cargo run --release -p my-lisp-cli --bin gen-fasl -- lib/core.lisp lib/core.lisp.fasl
          python3 scripts/public_api_inventory.py --write-report
      - name: Commit regenerated artifacts
        run: |
          set -euo pipefail
          if git diff --quiet -- lib/core.lisp.fasl docs/generated/public-api-discovery.md; then
            echo "generated artifacts already match current source"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/core.lisp.fasl docs/generated/public-api-discovery.md
          git commit -m "fix(#894): regenerate current-main generated artifacts"
          git push origin HEAD:fix/894-core-fasl-current-main
