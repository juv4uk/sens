name: Verify 536 runtime peer topology GREEN

on:
  workflow_dispatch:

jobs:
  green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/install-zig
      - uses: dtolnay/rust-toolchain@stable
      - name: Run Lisp-owned comparison peer topology witness
        run: |
          output="$(cargo run --quiet -p sens-cli --bin sens -- tests/fixtures/runtime-peer-comparison-topology-witness.lisp)"
          printf 'actual: %s\n' "$output"
          test "$output" = "(runtime-peer-comparison-topology-witness (status pass))"
