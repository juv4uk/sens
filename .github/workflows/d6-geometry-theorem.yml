name: D6 geometry theorem research

on:
  pull_request:
    paths:
      - "benchmarks/d6-geometry-theorem/**"
      - "knowledge/d3-d8-stable-residents.json"
      - ".github/workflows/d6-geometry-theorem.yml"
  workflow_dispatch:

jobs:
  geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Run D6 geometry theorem S1
        run: |
          rm -rf /tmp/d6-geometry-theorem
          python3 benchmarks/d6-geometry-theorem/run.py             --out /tmp/d6-geometry-theorem
      - name: Publish report
        if: always()
        run: |
          if test -f /tmp/d6-geometry-theorem/report.md; then
            cat /tmp/d6-geometry-theorem/report.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d6-geometry-theorem
          path: /tmp/d6-geometry-theorem/
          retention-days: 14
