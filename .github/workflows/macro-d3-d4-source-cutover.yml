name: Міграція макро-bootstrap D3 D4

on:
  pull_request:
    branches: [main]
    paths:
      - "lib/macro.lisp"
      - "tests/test_domain_lisp_corpus_macro_source.py"
      - ".github/workflows/macro-d3-d4-source-cutover.yml"
  workflow_dispatch:

jobs:
  exact-macro-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Перевірити ратифіковані координати і незалежний source-delta/AST proof
        run: python3 -m unittest discover -s tests -p 'test_domain_lisp_corpus_macro_source.py' -v
