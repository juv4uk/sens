name: Frame3-Micro dense 1-5 byte proof and real file corpus
on:
  push:
    paths:
      - 'crates/sens/examples/frame3_one_byte_research.rs'
      - 'crates/sens/src/frame3_micro.rs'
      - 'crates/sens/src/frame3_micro_enumerator.rs'
      - 'crates/sens/src/frame3_micro_v5.rs'
      - 'crates/sens/src/frame3_micro_v5_lambda.rs'
      - 'crates/sens/src/frame3_micro_v5_lambda_app.rs'
      - 'knowledge/f3m5-lambda-lexical-reference-candidate-v1.json'
      - 'scripts/check_f3m5_lambda_lexical_reference.py'
      - 'research/framed3/fixtures/*.f3m'
      - 'crates/sens/examples/frame3_real_files_bench.rs'
      - 'research/framed3/rust_codec/senc.rs'
      - '.github/workflows/frame3-one-byte-real-file.yml'
  pull_request:
    paths:
      - 'crates/sens/examples/frame3_one_byte_research.rs'
      - 'crates/sens/src/frame3_micro.rs'
      - 'crates/sens/src/frame3_micro_enumerator.rs'
      - 'crates/sens/src/frame3_micro_v5.rs'
      - 'crates/sens/src/frame3_micro_v5_lambda.rs'
      - 'crates/sens/src/frame3_micro_v5_lambda_app.rs'
      - 'research/framed3/fixtures/*.f3m'
      - 'crates/sens/examples/frame3_real_files_bench.rs'
      - 'research/framed3/rust_codec/senc.rs'
      - '.github/workflows/frame3-one-byte-real-file.yml'
permissions:
  contents: read
jobs:
  dense-f3m-programs:
    name: 'Dense F3M-1/2/3/4/5 rank and evaluator proofs'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Prove nameless lexical-reference law independently
        shell: bash
        run: python3 scripts/check_f3m5_lambda_lexical_reference.py
      - name: Prove dense F3M 1-5 byte rank windows and executable witnesses
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/frame3-proof"
          {
            cargo test --locked -p sens frame3_micro_v5::tests -- --nocapture
            cargo test --locked -p sens frame3_micro_v5_lambda::tests -- --nocapture
            cargo test --locked -p sens frame3_micro_v5_lambda_app::tests -- --nocapture
            cargo test --locked -p sens frame3_micro_enumerator::tests -- --nocapture
          } 2>&1 | tee "$RUNNER_TEMP/frame3-proof/enumerator-tests.log"
      - name: Encode, decode, and execute with real Rust SENS oracle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/frame3-one-byte"
          {
            echo "sha=$GITHUB_SHA"
            echo "os=$(uname -srm)"
            echo "rustc=$(rustc --version)"
            cargo run --locked --release -p sens --example frame3_one_byte_research --quiet -- "$RUNNER_TEMP/frame3-one-byte"
          } | tee "$RUNNER_TEMP/frame3-one-byte/program-results.tsv"
          test "$(wc -c < "$RUNNER_TEMP/frame3-one-byte/car-cons-one-nil.f3m")" -eq 1
          cmp research/framed3/fixtures/car-cons-one-nil.f3m "$RUNNER_TEMP/frame3-one-byte/car-cons-one-nil.f3m"
          test "$(wc -c < "$RUNNER_TEMP/frame3-one-byte/atom-nil.f3m")" -eq 1
          test "$(od -An -tx1 "$RUNNER_TEMP/frame3-one-byte/car-cons-one-nil.f3m" | tr -d ' \n')" = '3e'
          awk -F '\\t' '$1 == "3e" && $2 == 1 && $3 > 1 { ok=1 } END { exit !ok }' "$RUNNER_TEMP/frame3-one-byte/program-results.tsv"
      - name: Paired speed benchmark for one-byte profile, T5 and execution
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "# sha=$GITHUB_SHA"
            echo "# cpu=$(grep -m1 'model name' /proc/cpuinfo || true)"
            echo "# machine=$(uname -srm)"
            echo "# compiler=$(rustc --version)"
            cargo run --locked --release -p sens --example frame3_one_byte_research --quiet -- --speed
          } | tee "$RUNNER_TEMP/frame3-one-byte/speed.tsv"
          awk -F '\t' '$1 == "f3m_dense_encode_exact_program" && $2 > 0 { en=1 } $1 == "t5_decode_5b_to_typed_words" && $2 > 0 { de=1 } $1 == "f3m_dense_decode_1b_to_program" && $2 > 0 { dec=1 } END { exit !(en && de && dec) }' "$RUNNER_TEMP/frame3-one-byte/speed.tsv"
      - name: Preserve dense proof and actual one-byte physical files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frame3-dense-proof-${{ github.sha }}
          path: |
            ${{ runner.temp }}/frame3-proof/
            ${{ runner.temp }}/frame3-one-byte/
          if-no-files-found: error
          retention-days: 30
  real-files:
    name: Original F3 physical size and warm CPU on actual tracked files
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify real Rust T5 admission and original F3 full carrier
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "# sha=$GITHUB_SHA"
            echo "# os=$(uname -srm)"
            echo "# rustc=$(rustc --version)"
            echo "# cpu=$(grep -m1 'model name' /proc/cpuinfo || true)"
            cargo run --locked --release -p sens --example frame3_real_files_bench --quiet
          } | tee "$RUNNER_TEMP/frame3-real-file-results.tsv"
          # Guard against silently shrinking real-file coverage or cheating on subset total.
          awk -F '\\t' '$2 == "ROUNDTRIP_OK" { supported++; t5 += $3; f3 += $4 } END { exit !(supported >= 12 && f3 < t5) }' "$RUNNER_TEMP/frame3-real-file-results.tsv"
      - name: Preserve complete file sizes and all admission verdicts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frame3-real-file-${{ github.sha }}
          path: ${{ runner.temp }}/frame3-real-file-results.tsv
          if-no-files-found: warn
          retention-days: 30
