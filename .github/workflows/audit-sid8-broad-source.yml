name: Audit SID8 broad in-place Lisp source cutover

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify exact D6 MAP single-list sites and original Lisp source integrity
        run: python3 -m unittest discover -s tests -p test_sid8_broad_source_cutover.py -v
