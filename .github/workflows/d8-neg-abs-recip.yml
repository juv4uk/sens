name: D8 NEG-ABS reciprocal research

on:
  pull_request:
    paths:
      - "benchmarks/d8-neg-abs-recip/**"
      - "docs/research/3729-d8-neg-abs-recip.md"
      - "docs/research/3729-d8-neg-abs-recip.uk.md"
      - "knowledge/d6-ratified.json"
      - ".github/workflows/d8-neg-abs-recip.yml"
  push:
    branches:
      - main
    paths:
      - "benchmarks/d8-neg-abs-recip/**"
      - "docs/research/3729-d8-neg-abs-recip.md"
      - "docs/research/3729-d8-neg-abs-recip.uk.md"
      - "knowledge/d6-ratified.json"
      - ".github/workflows/d8-neg-abs-recip.yml"
  workflow_dispatch:

jobs:
  product-witness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Run exhaustive nonzero-Q product witness
        run: |
          rm -rf /tmp/d8-neg-abs-recip
          python3 benchmarks/d8-neg-abs-recip/run.py \
            --out /tmp/d8-neg-abs-recip
      - name: Verify deterministic replay
        run: |
          rm -rf /tmp/d8-neg-abs-recip-2
          python3 benchmarks/d8-neg-abs-recip/run.py \
            --out /tmp/d8-neg-abs-recip-2
          cmp /tmp/d8-neg-abs-recip/witness.json \
              /tmp/d8-neg-abs-recip-2/witness.json
      - name: Publish report
        if: always()
        run: |
          test ! -f /tmp/d8-neg-abs-recip/report.md || \
            cat /tmp/d8-neg-abs-recip/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: d8-neg-abs-recip
          path: /tmp/d8-neg-abs-recip/
          retention-days: 14
