name: GPU worker parity

# Справжня GPU-перевірка: CPU-референс проти CUDA-воркера cml (див.
# docs/tooling/GPU-WORKER-PARITY.uk.md). Запускається лише на змінах, що
# стосуються GPU-шляху, щоб не займати єдину карту даремно.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "crates/sens/src/gpu_*.rs"
      - "crates/sens/src/compiler_role.rs"
      - "contracts/compiler-gpu-execution-packet-v1.lisp"
      - "scripts/gpu-worker-parity.py"
      - ".github/workflows/gpu-worker-parity.yml"
  push:
    branches: [main]
    paths:
      - "crates/sens/src/gpu_*.rs"
      - "crates/sens/src/compiler_role.rs"
      - "contracts/compiler-gpu-execution-packet-v1.lisp"
      - "scripts/gpu-worker-parity.py"
      - ".github/workflows/gpu-worker-parity.yml"

permissions:
  contents: read

# Одна фізична карта: нова заявка для тієї ж гілки/PR скасовує попередню.
# Між репозиторіями чергу веде сам воркер (замок допуску cml#603).
concurrency:
  group: sens-gpu-worker-parity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cpu-oracle-conformance:
    name: CPU oracle conformance corpus
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Require GitHub-hosted CUDA device
        run: |
          test "${RUNNER_ENVIRONMENT:-}" = github-hosted || { echo "::error::Local runner forbidden"; exit 1; }
          command -v nvidia-smi >/dev/null 2>&1 || { echo "::error::Hosted GPU larger runner required for parity"; exit 1; }
          nvidia-smi

      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Current GPU oracle fixtures match the CPU evaluator
        run: cargo test -p sens --lib gpu_oracle_conformance::tests::every_fixture_matches_the_cpu_oracle -- --nocapture

  gpu-worker-parity:
    # Лише GPU-runner: ніколи не падаємо назад на CPU-runner.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CML_GPU_WORKER_SOCKET: /run/cml-gpu-worker/worker.sock
    steps:
      - uses: actions/checkout@v5

      # НЕ обгортати в flock: замок допуску бере сам воркер на опкодах з provenance.
      - name: CUDA parity against CPU reference
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/gpu-worker-parity.py --evidence gpu-worker-parity.json
          {
            echo '### GPU worker parity'
            echo '```json'
            cat gpu-worker-parity.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
