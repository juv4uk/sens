name: Framing A-S confirmation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  confirm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pinned framing benchmark
        uses: actions/checkout@v4
        with:
          ref: 77d2edb0620c2c162f5c7e63386bc36113e9d0ef
          fetch-depth: 1

      - name: Install Valgrind
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind
          valgrind --version
          rustc --version

      - name: Run pinned 3-sample A-S confirmation — EXCLUDED (NOT_VERIFIED)
        if: false
        shell: bash
        run: echo "FOREIGN_LANGUAGE_TEST_BENCH=EXCLUDED_BY_POLICY native_equivalent=NOT_VERIFIED"
      - name: Upload raw confirmation evidence
        uses: actions/upload-artifact@v4
        with:
          name: framing-as-confirm-77d2edb
          path: |
            ${{ runner.temp }}/framing-as-confirm/instructions.tsv
            ${{ runner.temp }}/framing-as-confirm/environment.json
