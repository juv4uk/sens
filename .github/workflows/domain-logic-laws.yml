name: domain-logic-laws

# Binary SENS is the ONLY logic-semantic authority for this gate.
# Shell runs existing physical SENS interpreters; it has no truth table.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-sens-law:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Статичний ratchet: заборонити десяткові мости ідентичності
        run: |
          python3 scripts/check-domain-ladder-identity.py --self-test
          python3 scripts/check-domain-ladder-identity.py --check
      - uses: dtolnay/rust-toolchain@stable
      - name: Build physical SENS mechanism
        run: cargo build --locked -p sens-cli --bin sens --bin sens-trit
      - name: Execute all 2040 SENS-owned semantic checks
        shell: bash
        run: |
          set -euo pipefail
          file=tests/semantic/domain-logic-2040/proof.sens
          target/debug/sens "$file" > "$RUNNER_TEMP/sens-law.out"
          test "$(cat "$RUNNER_TEMP/sens-law.out")" = "1"
          target/debug/sens-trit eval "$file" > "$RUNNER_TEMP/trit-law.out"
          cmp "$RUNNER_TEMP/sens-law.out" "$RUNNER_TEMP/trit-law.out"
      - name: One false SENS EQ law must enter noncallable D1 failure branch
        shell: bash
        run: |
          set -euo pipefail
          mutant=tests/semantic/domain-logic-2040/mutant.sens
          if target/debug/sens "$mutant" > "$RUNNER_TEMP/bad-sens.out" 2>&1; then
            echo "BLOCK: invalid SENS law was accepted"
            exit 1
          fi
          if target/debug/sens-trit eval "$mutant" > "$RUNNER_TEMP/bad-trit.out" 2>&1; then
            echo "BLOCK: invalid SENS law was accepted by second entrypoint"
            exit 1
          fi
