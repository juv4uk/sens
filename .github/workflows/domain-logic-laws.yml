name: domain-logic-laws

# Тест семанти й логіки двійковим сенсом. Семантику визначає сам SENS:
# scripts/check-domain-logic-laws.lisp перевіряє закони D3/D4/D5 у точних
# доменних адресах, а не зовнішній інструмент. Раннер збирає my-lisp і
# запускає файл; очікується друк PASS і нульовий код виходу.

on:
  push:
    branches: [main]
    paths:
      - "scripts/check-domain-logic-laws.lisp"
      - "lib/domains/*.lisp"
      - "lib/core4.lisp"
      - ".github/workflows/domain-logic-laws.yml"
  pull_request:
    paths:
      - "scripts/check-domain-logic-laws.lisp"
      - "lib/domains/*.lisp"
      - "lib/core4.lisp"
      - ".github/workflows/domain-logic-laws.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  laws:
    name: D3/D4/D5 laws in binary SENS
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Build my-lisp
        run: cargo build --release -p my-lisp-cli --bin my-lisp
      - name: Run domain logic laws
        shell: bash
        run: |
          set -euo pipefail
          out="$(./target/release/my-lisp scripts/check-domain-logic-laws.lisp)"
          printf '%s\n' "$out"
          printf '%s\n' "$out" | grep -q 'DOMAIN-LOGIC-LAWS: PASS'
