name: TEMP regenerate public API discovery report
# Temporary branch-only generation; remove after the one-file report commit.

on:
  push:
    branches:
      - fix/public-api-report-refresh-20261010

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - name: Regenerate the derived report from canonical source
        run: |
          set -euo pipefail
          python3 scripts/public_api_inventory.py --write-report
          python3 scripts/public_api_inventory.py --check
      - name: Commit only the generated report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/generated/public-api-discovery.md
          if git diff --cached --quiet; then
            echo "Public API report already current."
            exit 0
          fi
          git commit -m "docs: regenerate public API discovery report"
          git push origin "HEAD:${GITHUB_REF_NAME}"
