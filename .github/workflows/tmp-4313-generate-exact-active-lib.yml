name: TMP 4313 generate exact active lib

on:
  push:
    branches:
      - replay/4313-exact-active-lib-current

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: replay/4313-exact-active-lib-current
      - uses: dtolnay/rust-toolchain@stable
      - name: Build exact migrator
        run: cargo build -p sens-cli --bin sens-to-sens
      - name: Rewrite bounded active source to exact domains
        run: |
          cargo run --quiet -p sens-cli --bin sens-to-sens -- --exact-domain \
            lib/compiler-nucleus.lisp \
            lib/machine/dispatch/native-first.lisp
      - name: Exact migration must be at fixed point
        run: |
          cargo run --quiet -p sens-cli --bin sens-to-sens -- --check --exact-domain \
            lib/compiler-nucleus.lisp \
            lib/machine/dispatch/native-first.lisp
      - name: Focused semantic parity
        run: |
          cargo test -p sens-cli --bin sens-to-sens
          cargo test -p sens-cli --test to_sens
          cargo test -p sens \
            --test compiler_l1_l5_role \
            --test compiler_nucleus_diff \
            --test compiler_selfhost_role_closure \
            --test native_first_exact_domain
      - name: Commit generated source only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/compiler-nucleus.lisp lib/machine/dispatch/native-first.lisp
          if git diff --cached --quiet; then
            echo "No generated source changes"
            exit 1
          fi
          git commit -m "migrate(4313): generate exact active library source"
          git push origin HEAD:replay/4313-exact-active-lib-current
