name: Temporary Node24 action migration
on:
  push:
    branches:
      - chore/sens-actions-node24-bulk-staging
    paths:
      - ".github/workflows/node24-one-shot-migration.yml"
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Upgrade Node20 GitHub Actions in every workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import collections
          import re
          root = Path(".github/workflows")
          substitutions = {
              r"actions/upload-artifact@v4(?:\.\d+)*": "actions/upload-artifact@v6",
              r"actions/checkout@v4(?:\.\d+)*": "actions/checkout@v5",
              r"actions/setup-python@v5(?:\.\d+)*": "actions/setup-python@v6",
              r"actions/setup-node@v4(?:\.\d+)*": "actions/setup-node@v5",
          }
          files = sorted((*root.glob("*.yml"), *root.glob("*.yaml")))
          if len(files) < 500:
              raise SystemExit(f"Workflow inventory unexpectedly small: {len(files)}")
          changed = []
          counts = collections.Counter()
          for path in files:
              original = path.read_bytes().decode("utf-8")
              updated = original
              for old, new in substitutions.items():
                  pattern = re.compile(r"(?m)^([ \t]*-?[ \t]*uses:[ \t]*['\"]?)" + old + r"(?=[ \t'\"#]|$)")
                  updated, n = pattern.subn(lambda m: m.group(1) + new, updated)
                  counts[new] += n
              if updated != original:
                  path.write_bytes(updated.encode("utf-8"))
                  changed.append(str(path))
          if len(changed) < 200:
              raise SystemExit(f"Expected broad workflow migration; changed only {len(changed)}")
          for path in files:
              raw = path.read_bytes().decode("utf-8")
              for old in substitutions:
                  pattern = re.compile(r"(?m)^[ \t]*-?[ \t]*uses:[ \t]*['\"]?" + old + r"(?=[ \t'\"#]|$)")
                  if pattern.search(raw):
                      raise SystemExit(f"Unmigrated action in {path}")
          print(f"Scanned {len(files)} workflows; updated {len(changed)} files")
          for action, n in sorted(counts.items()):
              print(f"  {action}: {n}")
          PY
          rm -f .github/node24-upgrade-paths.json .github/workflows/node24-one-shot-migration.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u -- .github
          git diff --cached --check
          git diff --cached --stat | tail -n 6
          git commit -m "ci: upgrade all legacy Node20 actions in SENS workflows"
          git push origin HEAD:refs/heads/chore/sens-actions-node24-bulk-staging
