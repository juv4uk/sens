name: Compiler nucleus three-file T5 triplet

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: compiler-nucleus-t5-triplet
  cancel-in-progress: false

jobs:
  triplet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: ./.github/actions/install-zig
      - name: Foreign-language test/benchmark — EXCLUDED (NOT_VERIFIED)
        if: false
        shell: bash
        run: echo "FOREIGN_LANGUAGE_TEST_BENCH=EXCLUDED_BY_POLICY native_equivalent=NOT_VERIFIED"
      - name: Regression test compiler migration fails closed on unratified symbol data — EXCLUDED (NOT_VERIFIED)
        if: false
        shell: bash
        run: echo "FOREIGN_LANGUAGE_TEST_BENCH=EXCLUDED_BY_POLICY native_equivalent=NOT_VERIFIED"
      - name: Migrate the compiler source with the canonical three-pass converter
        id: generate
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$(sha256sum lib/compiler-nucleus.lisp | cut -d ' ' -f 1)"
          work="$RUNNER_TEMP/compiler-nucleus-t5"
          rm -rf "$work"
          mkdir -p "$work"
          set +e
          python3 scripts/migrate-three-pass.py \
            lib/compiler-nucleus.lisp \
            --out "$work/candidate" \
            --report "$work/migration-report.json"
          migration_rc=$?
          set -e
          if [[ -f "$work/migration-report.json" ]]; then
            python3 - "$work/migration-report.json" <<'PY'
          import json, pathlib, sys
          report = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          print(json.dumps({
              "summary": report.get("summary"),
              "files": [{k: row.get(k) for k in ("path", "output", "status", "reason", "token", "line", "column", "passes") if k in row}
                        for row in report.get("files", [])]
          }, ensure_ascii=False, sort_keys=True))
          PY
          fi
          if [[ "$migration_rc" -ne 0 ]]; then
            echo "The canonical migrator blocked the compiler source; no projection was published." >&2
            exit "$migration_rc"
          fi
          python3 - "$work/migration-report.json" <<'PY'
          import json, pathlib, sys
          report = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          summary = report["summary"]
          if summary["files_seen"] != 1 or summary["files_written"] != 1 or summary["files_blocked"] != 0:
              raise SystemExit("compiler nucleus was not migrated as exactly one fully encoded source")
          row = report["files"][0]
          if row["status"] != "written" or row["path"] != "compiler-nucleus.lisp":
              raise SystemExit("migration report does not attest to the selected compiler source")
          PY
          python3 - "$work/candidate/compiler-nucleus.sens" "$work/candidate/compiler-nucleus" <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0, "scripts")
          from sens_t5_t5m_codec import decode_bytes, encode_words
          physical = Path(sys.argv[1]).read_bytes()
          words = decode_bytes(physical)
          if encode_words(words) != physical:
              raise SystemExit("T5 canonical byte roundtrip failed")
          view = (" ".join(words) + "\n").encode("ascii")
          if b"2" in view or not view.endswith(b"\n"):
              raise SystemExit("invalid canonical bit-word presentation")
          Path(sys.argv[2]).write_bytes(view)
          print(f"compiler_words={len(words)} semantic_bits={sum(map(len, words))} physical_bytes={len(physical)} view_bytes={len(view)}")
          PY
          test "$source_sha" = "$(sha256sum lib/compiler-nucleus.lisp | cut -d ' ' -f 1)" || {
            echo "compiler source changed during conversion" >&2
            exit 1
          }
          sens="lib/compiler-nucleus.sens"
          view="lib/compiler-nucleus"
          if [[ -e "$sens" || -e "$view" ]]; then
            [[ -f "$sens" && -f "$view" ]] || {
              echo "partial pre-existing triplet; refusing to overwrite" >&2
              exit 1
            }
            cmp "$work/candidate/compiler-nucleus.sens" "$sens" || {
              echo "stale .sens; candidate differs, refusing silent overwrite" >&2
              exit 1
            }
            cmp "$work/candidate/compiler-nucleus" "$view" || {
              echo "stale extensionless view; candidate differs, refusing silent overwrite" >&2
              exit 1
            }
            echo "created=false" >> "$GITHUB_OUTPUT"
          else
            cp -- "$work/candidate/compiler-nucleus.sens" "$sens"
            cp -- "$work/candidate/compiler-nucleus" "$view"
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi
          echo "source_sha256=$source_sha" >> "$GITHUB_OUTPUT"
          echo "physical_bytes=$(wc -c < "$sens" | tr -d ' ')" >> "$GITHUB_OUTPUT"
          echo "view_bytes=$(wc -c < "$view" | tr -d ' ')" >> "$GITHUB_OUTPUT"
          sha256sum "$sens" "$view"

      - name: Verify physical T5 with the Rust canonical reader — EXCLUDED (NOT_VERIFIED)
        if: false
        shell: bash
        run: echo "FOREIGN_LANGUAGE_TEST_BENCH=EXCLUDED_BY_POLICY native_equivalent=NOT_VERIFIED"
      - name: Compile the compiler's own T5 triplet through the real SENS compiler
        shell: bash
        run: |
          set -euo pipefail
          artifact="$RUNNER_TEMP/compiler-nucleus-self-compile.bin"
          cargo xtask compiler-compile \
            --triplet "$GITHUB_WORKSPACE/lib/compiler-nucleus.sens" \
            --out "$artifact"
          test -s "$artifact"
          printf 'compiler_self_compile_artifact_bytes=%s\n' "$(wc -c < "$artifact" | tr -d ' ')"

      - name: Commit only newly generated projections to main
        if: steps.generate.outputs.created == 'true'
        env:
          EXPECTED_SOURCE_SHA: ${{ steps.generate.outputs.source_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- lib/compiler-nucleus.sens lib/compiler-nucleus
          git diff --cached --check
          git commit -m "build: add compiler nucleus T5 three-file triplet"
          git fetch origin main
          remote_source_sha="$(git show origin/main:lib/compiler-nucleus.lisp | sha256sum | cut -d ' ' -f 1)"
          if [[ "$remote_source_sha" != "$EXPECTED_SOURCE_SHA" ]]; then
            echo "main compiler source advanced during migration; refusing to publish stale projections" >&2
            exit 1
          fi
          if [[ "$(git rev-parse HEAD^)" != "$(git rev-parse origin/main)" ]]; then
            git rebase origin/main
          fi
          git push origin HEAD:main
