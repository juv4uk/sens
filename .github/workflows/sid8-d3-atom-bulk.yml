name: SID8 legacy ATOM D3 five-source cutover witnesses

on:
  push:
    branches: [main]
    paths:
      - benchmarks/lists.lisp
      - benchmarks/recursion.lisp
      - scripts/gen-functions.lisp
      - scripts/build-constitution.lisp
      - scripts/fixtures-for-tier.lisp
      - tests/test_sid8_d3_atom_bulk_source.py
      - .github/workflows/sid8-d3-atom-bulk.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-witnesses:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify all five immutable source blobs and seven exact D3 edits
        run: python3 -m unittest discover -s tests -p test_sid8_d3_atom_bulk_source.py -v
