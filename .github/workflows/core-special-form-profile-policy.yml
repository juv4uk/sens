name: Core special-form profile policy — transition archive

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archive:
    name: Historical COND profile policy archive
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Record policy
        run: sha256sum contracts/core-special-form-profile-policy.lisp
      - name: Explain active authority
        run: |
          echo "Profile-specific COND laws are superseded by #1663/#1703."
          echo "Active target is one two-part COND law across Core1-4."
          echo "This workflow is manual-only until #1709 supplies the new Lisp witness lane."
      - name: Diff hygiene
        run: git diff --check
