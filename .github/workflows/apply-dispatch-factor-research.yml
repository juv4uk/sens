name: APPLY dispatch factor research

on:
  pull_request:
    paths:
      - "lib/core1.lisp"
      - "knowledge/function-status-census.json"
      - "scripts/research-2400-apply-dispatch-factor.py"
      - ".github/workflows/apply-dispatch-factor-research.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  factor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify APPLY callable-case factorization
        run: python3 scripts/research-2400-apply-dispatch-factor.py
