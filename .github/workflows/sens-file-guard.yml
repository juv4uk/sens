name: SENS — файлова гвардія нових джерел

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      base_sha:
        description: 'Точний Git SHA бази (40 hex); потрібен для ручної перевірки'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: sens-file-guard-${{ github.sha }}
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Негативні свідки файлової гвардії
        run: |
          set -euo pipefail
          python3 tools/file_guard.py --self-test
          PYTHONOPTIMIZE=2 python3 tools/file_guard.py --self-test
      - name: Нові важливі файли — тільки .lisp/.sens
        env:
          BASE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.base_sha || github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          python3 tools/file_guard.py --base "$BASE_SHA"
