name: D9 registry tail v1

on:
  workflow_dispatch:

jobs:
  registry-tail:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: GPU runner identity
        run: nvidia-smi || true
      - name: Verify final semantic-registry review
        run: python3 scripts/check-d9-registry-tail-v1.py
      - name: Verify global D9 inventory
        run: python3 scripts/check-d9-v1-semantic-inventory.py
      - name: Preserve canonical library tranche
        run: python3 scripts/check-d9-library-harvest-v1.py
      - name: Preserve public-surface tranche
        run: python3 scripts/check-d9-surface-harvest-v1.py
      - name: Preserve overflow tranche
        run: python3 scripts/check-d9-overflow-review-v1.py
