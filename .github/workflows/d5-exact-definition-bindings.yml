name: D5 exact definition bindings

on:
  workflow_dispatch:

jobs:
  exact-bindings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python3 scripts/check-d5-definition-bindings.py
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p sens --test d5_exact_definition_bindings -- --nocapture
      - run: cargo test -p sens --test d5_reverse_onto_law
