name: D8 consolidated research ledger

on:
  workflow_dispatch:

jobs:
  ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Build D8 research ledger
        run: |
          rm -rf /tmp/d8-research-ledger
          echo "FOREIGN_LANGUAGE_TEST_OR_BENCH=EXCLUDED_BY_POLICY native_equivalent=NOT_VERIFIED"

      - name: Assert current accounting
        run: |
          echo "FOREIGN_LANGUAGE_TEST_OR_BENCH=EXCLUDED_BY_POLICY native_equivalent=NOT_VERIFIED"

      - name: Verify deterministic replay
        run: |
          rm -rf /tmp/d8-research-ledger-2
          echo "FOREIGN_LANGUAGE_TEST_OR_BENCH=EXCLUDED_BY_POLICY native_equivalent=NOT_VERIFIED"
          cmp /tmp/d8-research-ledger/ledger.json \
              /tmp/d8-research-ledger-2/ledger.json

      - name: Publish report
        if: always()
        run: |
          test ! -f /tmp/d8-research-ledger/report.md || \
            cat /tmp/d8-research-ledger/report.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d8-research-ledger
          path: /tmp/d8-research-ledger/
          retention-days: 14
