name: Outer record prefix research

on:
  pull_request:
    paths:
      - 'scripts/research-3151-outer-record-prefix.py'
      - '.github/workflows/research-3151-outer-record-prefix.yml'

jobs:
  witness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Run bounded injectivity and anti-collapse witness
        run: python3 scripts/research-3151-outer-record-prefix.py
