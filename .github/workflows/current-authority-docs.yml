name: Current authority docs

on:
  pull_request:
    paths:
      - README.md
      - AGENTS.md
      - scripts/check-encoder-swarm-contract.py
      - CURRENT.md
      - docs/semantic-authority-map.md
      - docs/semantic-authority-map.uk.md
      - docs/domain-paradigm.uk.md
      - docs/program-surface-translator.md
      - docs/ukrainian-api.md
      - docs/README.md
      - docs/domain-surfaces-d9.md
      - lib/domains/d9.lisp
      - scripts/check-current-authority-docs.sh
      - .github/workflows/current-authority-docs.yml
  push:
    branches: [main]
    paths:
      - README.md
      - AGENTS.md
      - scripts/check-encoder-swarm-contract.py
      - CURRENT.md
      - docs/semantic-authority-map.md
      - docs/semantic-authority-map.uk.md
      - docs/domain-paradigm.uk.md
      - docs/program-surface-translator.md
      - docs/ukrainian-api.md
      - docs/README.md
      - docs/domain-surfaces-d9.md
      - lib/domains/d9.lisp
      - scripts/check-current-authority-docs.sh
      - .github/workflows/current-authority-docs.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  current-authority-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Verify current authority entry-points
        shell: bash
        run: bash scripts/check-current-authority-docs.sh
      - name: Перевірка контракту рою та його негативних мутацій
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check-encoder-swarm-contract.py --self-test
          python3 -O scripts/check-encoder-swarm-contract.py --self-test
