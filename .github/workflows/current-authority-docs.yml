name: Current authority docs

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  current-authority-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Verify current authority entry-points
        shell: bash
        run: bash scripts/check-current-authority-docs.sh
