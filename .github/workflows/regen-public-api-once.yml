name: refresh public API report once
on:
  push:
    branches:
      - replay/4604-compiler-current-main-1008
    paths:
      - "lib/core4.lisp"
      - "docs/generated/public-api-discovery.md"
      - "scripts/public_api_inventory.py"
      - ".github/workflows/regen-public-api-once.yml"
permissions:
  contents: write
jobs:
  regen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: replay/4604-compiler-current-main-1008
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Refresh generated public API report
        run: |
          python3 scripts/public_api_inventory.py --write-report
          python3 scripts/public_api_inventory.py --check
      - name: Commit generated report only
        run: |
          git diff --check
          if git diff --quiet -- docs/generated/public-api-discovery.md; then
            echo "public API report already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/generated/public-api-discovery.md
          git commit -m "chore(4604): refresh generated public API projection"
          git push origin HEAD:replay/4604-compiler-current-main-1008
