name: T5 migration readiness census

on:
  push:
    branches: [main]
    paths:
      - "scripts/migrate-three-pass.py"
      - "scripts/sens_t5_codec.py"
      - "scripts/migration-readiness-census.py"
      - "scripts/migration_source_scope.py"
      - "tests/test_report_original_migration_candidates.py"
      - "benchmarks/sens-surface/results/**/*.lisp"
      - "tests/test_migration_readiness_contract.py"
      - "scripts/migrate-t5-batch.py"
      - "lib/**/*.lisp"
      - "knowledge/d1-d9-foundation.json"
      - "crates/sens/src/domain_surface_registry_generated.rs"
      - "crates/sens/src/semantic_registry_generated.rs"
      - "crates/sens/src/semantic_registry.rs"
      - "crates/sens/src/eval/necessary_forms_generated.rs"
      - "crates/sens/src/text7_projection_generated.rs"
      - "contracts/core1-historical-sid-map.lisp"
      - ".github/workflows/migration-readiness-census.yml"
  pull_request:
    paths:
      - "scripts/migrate-three-pass.py"
      - "scripts/sens_t5_codec.py"
      - "scripts/migration-readiness-census.py"
      - "scripts/migration_source_scope.py"
      - "tests/test_report_original_migration_candidates.py"
      - "benchmarks/sens-surface/results/**/*.lisp"
      - "tests/test_migration_readiness_contract.py"
      - "scripts/migrate-t5-batch.py"
      - "lib/**/*.lisp"
      - "knowledge/d1-d9-foundation.json"
      - "crates/sens/src/domain_surface_registry_generated.rs"
      - "crates/sens/src/semantic_registry_generated.rs"
      - "crates/sens/src/semantic_registry.rs"
      - "crates/sens/src/eval/necessary_forms_generated.rs"
      - "crates/sens/src/text7_projection_generated.rs"
      - "contracts/core1-historical-sid-map.lisp"
      - ".github/workflows/migration-readiness-census.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  census:
    name: fail-closed full corpus census
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Verify ratified D1–D9, W8 fail-closed and unpaired-only contract
        run: python3 -m unittest discover -s tests -p test_migration_readiness_contract.py -v
      - name: Run migration readiness census
        run: |
          python3 scripts/migration-readiness-census.py \
            --out /tmp/sens-t5-migration-readiness.json
      - name: Publish actionable original-source cohorts separately from archive
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          r = json.loads(Path("/tmp/sens-t5-migration-readiness.json").read_text(encoding="utf-8"))
          s = r["source_scope"]
          lines = [
              "## Original .lisp migration — source scope, not fake completion",
              "",
              f"- Original unpaired scanned: **{r['migrator_summary']['files_seen']}**",
              f"- Archived benchmarks mechanically convertible: **{s['archived_benchmark_mechanically_eligible']}** (nonprogram evidence)",
              f"- Active/unknown sources mechanically convertible: **{s['active_or_unclassified_mechanically_eligible']}** (NOT oracle-admitted)",
              f"- Actual .sens written: **{r['migrator_summary']['files_written']}**",
              f"- Semantic original executable certifications from census: **{s['executable_originals_semantically_certified']}**",
              "",
              "### Work for agents (first blocker by actual source)",
              "| Workstream | Blocked sources | Example original |",
              "| --- | ---: | --- |",
          ]
          for q in r["agent_work_queue"]:
              example = q["examples"][0]["path"].replace("|", "/") if q["examples"] else "none"
              lines.append(f"| {q['cohort']} | {q['blocked_count']} | `{example}` |")
          if s["archived_candidate_paths"]:
              lines += ["", "### Do NOT count archive as program migration"]
              for name in s["archived_candidate_paths"][:10]:
                  lines.append(f"- `{name}`")
          Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8").write("\n".join(lines)+"\n")
          PY
      - name: Publish census artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sens-t5-migration-readiness-${{ github.sha }}
          path: /tmp/sens-t5-migration-readiness.json
          if-no-files-found: error
          retention-days: 14
