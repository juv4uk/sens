name: D11/D13 ladder contest · Zig (targeted)
# Ручний вузький запуск експерименту; не оцінює семантику SENS.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  d11-contest:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Встановити зафіксований Zig 0.16.0
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --silent --show-error \
            https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz \
            --output "$RUNNER_TEMP/zig-0.16.0.tar.xz"
          echo '70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00  '"$RUNNER_TEMP/zig-0.16.0.tar.xz" | sha256sum --check --status
          tar -xJf "$RUNNER_TEMP/zig-0.16.0.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/zig-x86_64-linux-0.16.0" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/zig-x86_64-linux-0.16.0/zig" version
      - name: Тести кодеку — 512 координат, roundtrip і негативні випадки
        run: zig test -lc research/zig-codecs/d11_selector_contest.zig
      - name: Зібрати змагання оптимізовано
        run: zig build-exe -lc -O ReleaseFast research/zig-codecs/d11_selector_contest.zig -femit-bin="$RUNNER_TEMP/d11_contest"
      - name: Виміряти 9/11/16-бітні кодеки на однакових потоках 64 і 512 слів
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/d11_contest" 2>&1 | tee "$RUNNER_TEMP/d11_contest.log"
          grep -Fq 'mode=selector9 words=64 bytes=72' "$RUNNER_TEMP/d11_contest.log"
          grep -Fq 'mode=dense11 words=64 bytes=88' "$RUNNER_TEMP/d11_contest.log"
          grep -Fq 'mode=raw16 words=64 bytes=128' "$RUNNER_TEMP/d11_contest.log"
          grep -Fq 'mode=selector9 words=512 bytes=576' "$RUNNER_TEMP/d11_contest.log"
          grep -Fq 'mode=dense11 words=512 bytes=704' "$RUNNER_TEMP/d11_contest.log"
          grep -Fq 'mode=raw16 words=512 bytes=1024' "$RUNNER_TEMP/d11_contest.log"
          test "$(grep -c '^D11_CONTEST mode=' "$RUNNER_TEMP/d11_contest.log")" -eq 6
          grep -Fq 'samples=15' "$RUNNER_TEMP/d11_contest.log"
          grep -Fq 'p50_ns_per_roundtrip=' "$RUNNER_TEMP/d11_contest.log"
          grep -Fq 'p90_ns_per_roundtrip=' "$RUNNER_TEMP/d11_contest.log"
          grep -Fq 'D11_CONTEST_METHOD paired=YES alternating=YES samples=15' "$RUNNER_TEMP/d11_contest.log"
          test "$(grep -c 'roundtrip=EXACT paired=YES' "$RUNNER_TEMP/d11_contest.log")" -eq 6
      - name: SENS-семантика D11/D13 — потрібен нативний доказ
        run: |
          echo '::error::Zig-оракули назв і законів D11/D13 видалено; позитивний і негативний SENS-свідки через Zig/T5M не підтверджені'
          exit 1
      - name: Зберегти сирі результати
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d11-contest-${{ github.sha }}
          path: ${{ runner.temp }}/d11_contest.log
          if-no-files-found: warn
