name: Canon V2 targeted witness regression
on:
  pull_request:
    paths:
      - 'crates/sens/tests/canon_laws_v2_contract.rs'
      - 'tests/fixtures/witness-runner.lisp'
      - 'tests/fixtures/canon-laws-v2-witness.lisp'
      - 'lib/canon.lisp'
      - 'lib/core4.lisp'
      - 'lib/core4.lisp.fasl'
      - 'lib/core.lisp'
      - '.github/workflows/canon-v2-targeted.yml'
  workflow_dispatch:
jobs:
  canon-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Generate exact current Core4 FASL and print encoded blob for review
        shell: bash
        run: |
          set -euo pipefail
          cargo run --release --locked -p sens-cli --bin gen-fasl -- lib/core4.lisp lib/core4.lisp.fasl
          echo 'SENS_FASL_BEGIN'
          base64 -w0 lib/core4.lisp.fasl
          echo
          echo 'SENS_FASL_END'
      - name: Exact Canon witness regression
        run: cargo test -p sens --test canon_laws_v2_contract -- --nocapture
