name: Verify #549 Trilingual Surface Lisp Migration

on:
  workflow_dispatch:

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/install-zig
      - uses: dtolnay/rust-toolchain@stable

      - name: Build release SENS CLI
        run: cargo build --release -p sens-cli --bin sens

      - name: Current D1–D10 projections agree between Python inventory and SENS Lisp
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check_trilingual_surface.py > /tmp/tri-python.txt
          ./target/release/sens scripts/check-trilingual-surface.lisp > /tmp/tri-lisp.txt

          rows="$(sed -nE 's/^точнодоменних рядків: ([0-9]+);.*/\1/p' /tmp/tri-python.txt)"
          test "$rows" = "2046"
          grep -Fq "(точнодоменні-рядки $rows)" /tmp/tri-lisp.txt

          for language in ук укр san en lisp sym; do
            read -r present missing < <(
              awk -v lang="$language" '$1 == lang {print $2, $3}' /tmp/tri-python.txt
            )
            test -n "$present"
            test -n "$missing"
            test $((present + missing)) -eq "$rows"
            canonical="$language"
            if [ "$canonical" = "lisp" ]; then canonical="LISP"; fi
            grep -Fq "($canonical (наявні $present) (порожні $missing))" /tmp/tri-lisp.txt
          done

          shared="$(sed -nE 's/^укр\/en\/san заповнені разом: ([0-9]+)\/.*/\1/p' /tmp/tri-python.txt)"
          test -n "$shared"
          grep -Fq "(спільні-укр-en-san $shared)" /tmp/tri-lisp.txt
          grep -Fq "(релізний-статус не-встановлюється)" /tmp/tri-lisp.txt

      - name: Incomplete human projections fail closed without claiming release status
        shell: bash
        run: |
          set -euo pipefail
          set +e
          python3 scripts/check_trilingual_surface.py --require-complete > /tmp/tri-python-complete.txt 2>&1
          py_rc=$?
          ./target/release/sens scripts/check-trilingual-surface.lisp --require-complete > /tmp/tri-lisp-complete.txt 2>&1
          lisp_rc=$?
          set -e
          test "$py_rc" -ne 0
          test "$lisp_rc" -ne 0
          grep -Fq "(релізний-статус не-встановлюється)" /tmp/tri-lisp-complete.txt

      - name: D3 Ukrainian projection mutation is detected by both counters
        shell: bash
        run: |
          set -euo pipefail
          file="lib/domains/d3.lisp"
          cp "$file" /tmp/tri-d3-original.lisp
          trap 'cp /tmp/tri-d3-original.lisp "$file"' EXIT

          before="$(python3 scripts/check_trilingual_surface.py | awk '$1 == "укр" {print $2}')"
          test -n "$before"
          sed -i 's/(001 (ук як-є) (укр як-є)/(001 (ук як-є) (укр ())/g' "$file"
          grep -Fq '(001 (ук як-є) (укр ())' "$file"

          python3 scripts/check_trilingual_surface.py > /tmp/tri-python-mutated.txt
          ./target/release/sens scripts/check-trilingual-surface.lisp > /tmp/tri-lisp-mutated.txt
          after="$(awk '$1 == "укр" {print $2}' /tmp/tri-python-mutated.txt)"
          test -n "$after"
          test "$after" -eq "$((before - 1))"
          grep -Fq "(укр (наявні $after)" /tmp/tri-lisp-mutated.txt
