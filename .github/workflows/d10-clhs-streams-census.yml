name: D10 CLHS Streams census

on:
  pull_request:
    paths:
      - knowledge/d10-clhs-streams-census-20261009.json
      - docs/research/D10-CLHS-STREAMS-CENSUS.uk.md
      - scripts/check_d10_clhs_streams_census.py
      - .github/workflows/d10-clhs-streams-census.yml
  push:
    branches:
      - main
    paths:
      - knowledge/d10-clhs-streams-census-20261009.json
      - scripts/check_d10_clhs_streams_census.py
      - .github/workflows/d10-clhs-streams-census.yml

permissions:
  contents: read

jobs:
  research-only-census:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Довести перепис Streams без підміни D10
        run: python3 scripts/check_d10_clhs_streams_census.py
