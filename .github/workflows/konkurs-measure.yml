name: konkurs-measure

# Вимір внесків конкурсу #5934: T5M-байти, AST, visits, result.
# Той самий стенд, що в CI (benchmarks/sens-program-size), лише з opt-in метриками.
on:
  workflow_dispatch:
    inputs:
      binary:
        description: ".sens to measure (default: all konkurs-*.sens fixtures)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/install-zig
      - uses: dtolnay/rust-toolchain@1.99.0

      - name: Build SENS binaries with benchmark metrics
        run: cargo build --locked -p sens-cli --bin sens --bin sens-trit --features benchmark-ast-visits

      - name: Вимірювати реальні програми SENS через Zig/T5M
        env:
          BINARY: ${{ inputs.binary }}
        shell: bash
        run: |
          set -euo pipefail
          # Єдина семантика — чинний SENS. Python/JSON не потрібні
          # ані для вимірювання, ані для оцінки переможця.
          if [[ -n "$BINARY" ]]; then
            [[ "$BINARY" == benchmarks/contest-uk/*.sens ||
               "$BINARY" == benchmarks/sens-program-size/fixtures/konkurs-*.sens ]] || {
              echo "::error::Невідомий конкурсний шлях: $BINARY"
              exit 2
            }
            [[ -f "$BINARY" && ! -L "$BINARY" ]] || {
              echo "::error::Відсутній фізичний носій: $BINARY"
              exit 2
            }
            if [[ "$BINARY" == benchmarks/contest-uk/*.sens ]]; then
              bash benchmarks/contest-uk/judge.sh "$BINARY"
            else
              echo "CONTEST_FIXTURE_OBSERVATION_ONLY path=$BINARY"
              target/debug/sens-trit verify-view "$BINARY"
              target/debug/sens --benchmark-physical "$BINARY"
            fi
          else
            # Парне та автономне SENS виконання, негативний мутант,
            # відомий результат, Zig inverse, точні байти й AST/visits.
            bash benchmarks/contest-uk/judge.sh
            # Реальні медіани часу автономного SENS для тих самих трійок.
            # Не вносить ні Python/JSON, ні нового workflow чи release-гейту.
            bash benchmarks/contest-uk/run-native.sh
            # Дослідні поліноми вимірюємо окремо: не приписуємо їм
            # релізного чи семантичного свідка без незалежного оракула.
            for file in benchmarks/sens-program-size/fixtures/konkurs-*.sens; do
              [[ -f "$file" ]] || continue
              echo "CONTEST_FIXTURE_OBSERVATION_ONLY path=$file"
              target/debug/sens-trit verify-view "$file"
              target/debug/sens --benchmark-physical "$file"
            done
          fi
