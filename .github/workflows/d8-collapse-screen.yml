name: D8 second-axis collapse screen

on:
  workflow_dispatch:

jobs:
  collapse-screen:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Run bounded collapse screen
        run: |
          rm -rf /tmp/d8-collapse-screen
          echo "FOREIGN_LANGUAGE_TEST_OR_BENCH=EXCLUDED_BY_POLICY native_equivalent=NOT_VERIFIED"
      - name: Verify deterministic replay
        run: |
          rm -rf /tmp/d8-collapse-screen-2
          echo "FOREIGN_LANGUAGE_TEST_OR_BENCH=EXCLUDED_BY_POLICY native_equivalent=NOT_VERIFIED"
          cmp /tmp/d8-collapse-screen/screen.json /tmp/d8-collapse-screen-2/screen.json
      - name: Publish report
        if: always()
        run: |
          test ! -f /tmp/d8-collapse-screen/report.md || cat /tmp/d8-collapse-screen/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d8-collapse-screen
          path: /tmp/d8-collapse-screen/
          retention-days: 14
