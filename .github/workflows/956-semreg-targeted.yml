name: #956 Lisp semantic registry targeted

on:
  pull_request:
    paths:
      - "lib/surface/semantic-registry-api.lisp"
      - "crates/sens/tests/semantic_registry_lisp.rs"
      - "tests/fixtures/semantic-registry-self-hosted-witness.lisp"
      - "scripts/generate-rust-semantic-registry.lisp"
      - "knowledge/domain-surface-registry.lisp"
      - "scripts/generate-rust-domain-registry.lisp"
      - "crates/sens/src/domain_surface_registry_generated.rs"
      - "crates/sens/src/human_surface.rs"
      - "crates/sens/src/eval/lower.rs"
      - "crates/sens/tests/current_human_surface.rs"
      - ".github/workflows/956-semreg-targeted.yml"

jobs:
  semantic-registry-lisp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run Lisp-owned semantic registry witness
        run: cargo test -p sens --test semantic_registry_lisp -- --nocapture

      - name: Check exact-domain surface projection
        run: cargo run -p sens-cli --bin sens -- scripts/generate-rust-domain-registry.lisp --check

      - name: Prove D3 Ukrainian and Sanskrit exact-domain parity
        run: |
          cargo test -p sens --lib human_surface::tests -- --nocapture
          cargo test -p sens --lib migrated_d3_surfaces_lower_to_exact_domain_calls -- --nocapture
          cargo test -p sens --test canon_surface -- --nocapture
          cargo test -p sens --test current_human_surface -- --nocapture
