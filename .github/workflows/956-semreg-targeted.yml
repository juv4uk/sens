name: "SENS registry — двійкова перевірка COND"

on:
  push:
    branches: [main]
    paths:
      - "lib/surface/semantic-registry-api.lisp"
      - "tests/semantic/registry-find-row-cond-law.bits"
      - "tests/semantic/registry-find-row-cond-mutant.bits"
      - ".github/workflows/956-semreg-targeted.yml"
  pull_request:
    paths:
      - "lib/surface/semantic-registry-api.lisp"
      - "tests/semantic/registry-find-row-cond-law.bits"
      - "tests/semantic/registry-find-row-cond-mutant.bits"
      - ".github/workflows/956-semreg-targeted.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  registry-d1-self-verdict:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Зібрати наявний фізичний читач та виконавець SENS
        run: cargo build --locked -p sens-cli --bin sens-trit
      - name: SENS сам перевіряє гілку пошуку та однобітний мутант
        shell: bash
        run: |
          set -euo pipefail
          cp tests/semantic/registry-find-row-cond-law.bits "$RUNNER_TEMP/registry-law.lisp"
          cp tests/semantic/registry-find-row-cond-mutant.bits "$RUNNER_TEMP/registry-mutant.lisp"
          target/debug/sens-trit encode "$RUNNER_TEMP/registry-law.lisp"
          target/debug/sens-trit encode "$RUNNER_TEMP/registry-mutant.lisp"
          diagnose() {
            local id="$1" fixture="$2" expected="$3" observed="$4"
            echo "REGRESSION test_id=$id layer=eval"
            echo "program_path=$fixture"
            sha256sum "$fixture"
            echo "domains=D1:1,D2:2,D3:3"
            echo "expected=$expected observed=$observed"
            if test -f "$RUNNER_TEMP/mutant.err"; then
              cat "$RUNNER_TEMP/mutant.err"
            fi
            exit 1
          }
          target/debug/sens-trit eval "$RUNNER_TEMP/registry-law.sens" > "$RUNNER_TEMP/law.out" ||
            diagnose registry-cond-law tests/semantic/registry-find-row-cond-law.bits D1:1 interpreter-error
          law_result="$(cat "$RUNNER_TEMP/law.out")"
          test "$law_result" = "1" ||
            diagnose registry-cond-law tests/semantic/registry-find-row-cond-law.bits D1:1 "$law_result"
          if target/debug/sens-trit eval "$RUNNER_TEMP/registry-mutant.sens" > "$RUNNER_TEMP/mutant.out" 2> "$RUNNER_TEMP/mutant.err"; then
            diagnose registry-cond-mutant tests/semantic/registry-find-row-cond-mutant.bits noncallable-language-error unexpectedly-executed
          fi
          grep -Fq "not callable" "$RUNNER_TEMP/mutant.err" ||
            diagnose registry-cond-mutant tests/semantic/registry-find-row-cond-mutant.bits noncallable-language-error different-error
          test ! -s "$RUNNER_TEMP/mutant.out" ||
            diagnose registry-cond-mutant tests/semantic/registry-find-row-cond-mutant.bits empty-stdout nonempty-stdout
          echo "SENS: двійковий закон і негативний свідок виконані"
