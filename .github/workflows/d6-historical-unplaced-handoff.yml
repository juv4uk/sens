name: D6 historical-unplaced handoff

on:
  workflow_dispatch:

jobs:
  handoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Historical-unplaced handoff
        run: |
          python3 benchmarks/d6-historical-unplaced-handoff/run.py \
            --out /tmp/d6-historical-unplaced
          cat /tmp/d6-historical-unplaced/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: d6-historical-unplaced-handoff
          path: /tmp/d6-historical-unplaced
