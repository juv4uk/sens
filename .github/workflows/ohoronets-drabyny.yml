# Охоронець драбини — живий прогін, а не заява.
#
# Що робить: збирає sens, генерує індекс із джерел, проганяє запити
# охоронця через справжній SENS і перевіряє, що відповіді правильні.
#
# Навіщо окремий workflow: попередній коміт додав lib/ohoronets-drabyny.lisp,
# але НЕ прогнав його. Файл, який ніколи не виконувався, — це не механізм,
# а текст. Тут він виконується.
name: Охоронець драбини

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lib/ohoronets-drabyny.lisp'
      - 'lib/generated/drabyna-data.lisp'
      - 'scripts/drabyna-index.py'
      - '.github/workflows/ohoronets-drabyny.yml'

permissions:
  contents: read

jobs:
  ohoronets:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Встановити Zig (потрібен build.rs)
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Зібрати sens
        run: cargo build --release -p sens-cli

      - name: Перегенерувати індекс із джерел
        run: |
          python3 scripts/drabyna-index.py .
          python3 scripts/drabyna-index.py --domains
          python3 scripts/drabyna-index.py --lisp

      - name: Індекс мусить збігтися з тим, що в репозиторії
        run: |
          # Якщо джерела змінились, а згенеровані дані ні — це розбіжність,
          # і вона мусить бути видимою, а не тихою.
          if ! git diff --quiet -- lib/generated/drabyna-data.lisp; then
            echo "РОЗБІЖНІСТЬ: lib/generated/drabyna-data.lisp не відповідає джерелам"
            git diff --stat -- lib/generated/drabyna-data.lisp
            exit 1
          fi
          echo "ІНДЕКС_УЗГОДЖЕНО"

      - name: Прогнати охоронець живим виконанням
        run: |
          # Охоронець уже є: lib/domain-function-reuse.lisp.
          # Раніше цей крок тестував МОЇ функції, яких я не мав додавати —
          # тому він падав. Тепер тестується те, що справді в репозиторії.
          ./target/release/sens --t5m-files \
            lib/domain-function-reuse.lisp \
            tests/ohoronets-drabyny-probe.lisp
          echo "ОХОРОНЕЦЬ_ВИКОНАНО"
