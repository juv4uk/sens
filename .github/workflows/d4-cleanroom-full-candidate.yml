name: D4 cleanroom full candidate

on:
  pull_request:
    paths:
      - "knowledge/d4-cleanroom-full-candidate.json"
      - "docs/research/d4-cleanroom-full-candidate.md"
      - "scripts/check-d4-cleanroom-full-candidate.py"
      - ".github/workflows/d4-cleanroom-full-candidate.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 scripts/check-d4-cleanroom-full-candidate.py
