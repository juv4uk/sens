name: Post-D4 root minimization

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  root-min:
    name: Shared-location carrier premise
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable

      - name: Re-check explicit D4 state-passing model
        run: cargo test -p sens --test post_d4_setq_state_passing -- --nocapture

      - name: Re-check local-vs-global protocol boundary
        run: cargo test -p sens --test post_d4_transform_boundary -- --nocapture

      - name: Re-check shared-location identity lower bound
        run: cargo test -p sens --test post_d4_setq_shared_location -- --nocapture

      - name: Verify shared-location root-min result — EXCLUDED (NOT_VERIFIED)
        if: false
        shell: bash
        run: echo "FOREIGN_LANGUAGE_TEST_BENCH=EXCLUDED_BY_POLICY native_equivalent=NOT_VERIFIED"
      - name: Publish summary — EXCLUDED (NOT_VERIFIED)
        if: false
        shell: bash
        run: echo "FOREIGN_LANGUAGE_TEST_BENCH=EXCLUDED_BY_POLICY native_equivalent=NOT_VERIFIED"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: post-d4-root-min-shared-location
          path: benchmarks/post-d4-root-min/shared-location-result.json
          retention-days: 14
