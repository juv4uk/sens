name: D10 historical Interlisp PSL
on:
  pull_request:
    paths:
      - "knowledge/d10-interlisp-psl-history-harvest-v1.json"
      - "knowledge/d10-v1-semantic-inventory.json"
      - "knowledge/d10-fill-v1-state.json"
      - "scripts/check-d10-interlisp-psl-history-v1.py"
      - ".github/workflows/d10-interlisp-psl-history-v1.yml"
  push:
    branches: [main]
    paths:
      - "knowledge/d10-interlisp-psl-history-harvest-v1.json"
      - "knowledge/d10-v1-semantic-inventory.json"
      - "knowledge/d10-fill-v1-state.json"
      - "scripts/check-d10-interlisp-psl-history-v1.py"
      - ".github/workflows/d10-interlisp-psl-history-v1.yml"
  workflow_dispatch:
jobs:
  provenance:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - run: python3 scripts/check-d10-interlisp-psl-history-v1.py
      - run: python3 scripts/check-d10-v1-semantic-inventory.py
      - run: python3 scripts/check-d10-fill-v1-seed.py
