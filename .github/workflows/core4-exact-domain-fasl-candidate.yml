name: Core4 exact-domain FASL candidate

on:
  push:
    branches:
      - fix/core4-exact-domain-fasl-mainline-20261010
    paths:
      - crates/sens/src/mixed_source.rs
      - crates/sens/src/lib.rs
      - crates/sens-cli/src/bin/gen-fasl.rs
      - crates/sens/tests/core_fasl_freshness.rs
      - crates/sens/tests/machine_asm_differential.rs
      - lib/core4.lisp
      - lib/machine/encoding/x86-64.lisp
      - .github/workflows/core4-exact-domain-fasl-candidate.yml
  pull_request:
    branches:
      - main
    paths:
      - crates/sens/src/mixed_source.rs
      - crates/sens/src/lib.rs
      - crates/sens-cli/src/bin/gen-fasl.rs
      - crates/sens/tests/core_fasl_freshness.rs
      - crates/sens/tests/machine_asm_differential.rs
      - lib/core4.lisp
      - lib/machine/encoding/x86-64.lisp
      - .github/workflows/core4-exact-domain-fasl-candidate.yml

permissions:
  contents: read

jobs:
  regenerate-and-prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Prove scoped Core4 reader and preserve quoted/number data
        run: |
          cargo test --locked -p sens --lib mixed_source::tests::core4_reader_lifts_d4_not_inside_w8_cond_but_keeps_quoted_data -- --exact --nocapture
          cargo test --locked -p sens --lib mixed_source::tests::core4_source_has_no_numeric_0100_in_executable_call_head_positions -- --exact --nocapture
      - name: Generate Core4 FASL from the path-bound exact-domain AST
        run: |
          cargo run --locked --release -p sens-cli --bin gen-fasl -- lib/core4.lisp /tmp/core4.lisp.fasl
          cp /tmp/core4.lisp.fasl lib/core4.lisp.fasl
      - name: Verify source hash and AST snapshot parity
        run: cargo test --locked -p sens --test core_fasl_freshness -- --nocapture
      - name: Publish binary snapshot for exact-tree commit
        uses: actions/upload-artifact@v4
        with:
          name: core4-exact-domain-fasl
          path: lib/core4.lisp.fasl
          if-no-files-found: error
          retention-days: 1
      - name: Pin exact x86 encoder source
        run: test "$(git hash-object lib/machine/encoding/x86-64.lisp)" = "0b3f0989cf23df21edbcf5697b9f8548ff410e24"
      - name: Diagnose x86 encoder callability stages
        shell: bash
        run: |
          set +e
          set -uo pipefail
          cargo test --locked -p sens --test machine_asm_differential x86_encoder_callability_stage_probe -- --exact --ignored --nocapture
          status=$?
          echo "X86_STAGE_PROBE_EXIT=$status"
          exit 0
      - name: Exact-domain x86 CPU witness
        run: cargo test --locked -p sens --test machine_exact_domain_cpu -- --nocapture
      - name: Exact-D1 register and instruction admission
        run: cargo test --locked -p sens --test machine_admission_adversarial -- --nocapture
      - name: Bounded D5 effect projection
        run: cargo test --locked -p sens --test machine_effect_d5_arithmetic_projection -- --nocapture
      - name: Native physical CAR/CDR and reject-before-host
        run: cargo test --locked -p sens-host --test native_lisp_bytes -- --nocapture
      - name: Native D3 COND / EQ execution
        run: cargo test --locked -p sens-host --test native_cond_profile -- --nocapture
