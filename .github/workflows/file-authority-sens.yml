name: Охорона файлової влади SENS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: file-authority-${{ github.sha }}
  cancel-in-progress: true

jobs:
  file-authority:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: Прочитати незмінний Git baseline
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin 9c94727eb1c45378f3debccf633aad2366e13599
          git cat-file -e '9c94727eb1c45378f3debccf633aad2366e13599^{commit}'
      - name: Негативні свідки файлової охорони
        shell: bash
        run: bash tools/file-authority-guard.sh --self-test
      - name: Допуск нових файлів за SENS-постановою
        shell: bash
        run: bash tools/file-authority-guard.sh
