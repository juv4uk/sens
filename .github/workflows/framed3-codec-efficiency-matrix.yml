# Спільна лабораторія фізичних кодеків; .sens лишається T5.
name: SENS codec efficiency matrix

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "research/framed3/**"
      - "benchmarks/byte-pack/носій22.py"
      - "scripts/sens_t5_codec.py"
      - ".github/workflows/framed3-codec-efficiency-matrix.yml"
  push:
    branches: [main]
    paths:
      - "research/framed3/**"
      - ".github/workflows/framed3-codec-efficiency-matrix.yml"

permissions:
  contents: read

concurrency:
  group: sens-codec-efficiency-${{ github.sha }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  paired-physical-profiles:
    name: Парний T5 / F3 / Tb-33 — одне середовище
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Відмови й байтовий паритет у звичайному Python
        run: python3 research/framed3/bench_efficiency.py --check
      - name: Ті самі свідки за Python -O
        run: python3 -O research/framed3/bench_efficiency.py --check
      - name: Наявні дослідні позитивні/негативні suites
        run: python3 -m unittest discover -s research/framed3 -p 'test_*.py' -v
      - name: Rust ↔ Python точні байти й негативні маркери
        shell: bash
        run: |
          set -euo pipefail
          bash research/framed3/rust_codec/run_parity.sh
      - name: Парні часи кодування, декодування і повні фізичні байти
        shell: bash
        run: |
          set -euo pipefail
          python3 research/framed3/bench_efficiency.py \
            --reps 19 --inner 25 --warmup 3 \
            --out "$RUNNER_TEMP/paired-codecs.json"
          test -s "$RUNNER_TEMP/paired-codecs.json"
      - name: Зафіксувати сирий корпус і всі повтори
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paired-codecs-${{ github.sha }}
          path: ${{ runner.temp }}/paired-codecs.json
          if-no-files-found: warn
          retention-days: 30

  constrained-trit-blocks:
    name: T21 / T22 / T33 — незалежний повноблоковий дослід
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Перевірити допустимість блоків та відмови на пошкодження
        run: python3 benchmarks/byte-pack/носій22.py --verify
      - name: Ті самі 4620 тритів, 15 парних повторів
        shell: bash
        run: |
          set -euo pipefail
          python3 benchmarks/byte-pack/носій22.py \
            --bench --ntrits 4620 --reps 15 \
            --out "$RUNNER_TEMP/block-codecs.json"
          test -s "$RUNNER_TEMP/block-codecs.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: block-codecs-${{ github.sha }}
          path: ${{ runner.temp }}/block-codecs.json
          if-no-files-found: warn
          retention-days: 30

  canonical-physical-t5:
    name: Реальний CLI T5 — запуск, розбір і вимірювання
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: sens-codec-matrix
      - name: Release production binaries
        run: cargo build --locked --release -p sens-cli --bin sens --bin sens-trit
      - name: Фізичні T5 джерела, процесний startup, декодування
        shell: bash
        run: |
          set -euo pipefail
          python3 benchmarks/byte-pack/physical_t5.py \
            --sens target/release/sens \
            --trit target/release/sens-trit \
            --out "$RUNNER_TEMP/physical-t5" \
            --warmup 4 --reps 19
      - name: Незалежні негативні тести цілісності таймінгів
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_direct_t5_timing_guard.py' -v
          python3 -O -m unittest discover -s tests -p 'test_direct_t5_timing_guard.py' -v
      - name: Реальний фізичний декодер проти D2-parser і кешованого AST
        shell: bash
        run: |
          set -euo pipefail
          cargo run --locked --release --quiet -p sens --example bench_direct_t5 -- 2000 \
            | tee "$RUNNER_TEMP/direct-t5.csv"
          python3 scripts/check_direct_t5_timing.py "$RUNNER_TEMP/direct-t5.csv"
      - name: Сирі T5 вимірювання і provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canonical-physical-t5-${{ github.sha }}
          path: |
            ${{ runner.temp }}/physical-t5/
            ${{ runner.temp }}/direct-t5.csv
          if-no-files-found: warn
          retention-days: 30
