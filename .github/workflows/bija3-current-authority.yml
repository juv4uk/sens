name: bīja3 current authority

on:
  pull_request:
    paths:
      - "language-contract.lisp"
      - "CURRENT.md"
      - "README.md"
      - "docs/language-core.md"
      - "docs/domain-paradigm.uk.md"
      - "contracts/bija3-l1-l5-ratification.lisp"
      - "benchmarks/domain1234-dispatch/**"
      - "scripts/check-bija3-current-authority.py"
      - ".github/workflows/bija3-current-authority.yml"
  push:
    branches: [main]
    paths:
      - "language-contract.lisp"
      - "CURRENT.md"
      - "README.md"
      - "docs/language-core.md"
      - "docs/domain-paradigm.uk.md"
      - "contracts/bija3-l1-l5-ratification.lisp"
      - "benchmarks/domain1234-dispatch/**"
      - "scripts/check-bija3-current-authority.py"
      - ".github/workflows/bija3-current-authority.yml"

concurrency:
  group: bija3-current-authority-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  authority:
    runs-on: [self-hosted, guix]
    steps:
      - uses: actions/checkout@v5
      - run: python3 scripts/check-bija3-current-authority.py
