name: D10 1024-code canonical research coordinate placement
on:
  push:
    branches: [main]
    paths:
      - 'knowledge/d10-v18-semantic-inventory.json'
      - 'knowledge/d10-v18-coordinate-transfer-20261012.json'
      - 'knowledge/d10-current-inventory.json'
      - 'knowledge/d10-v17-semantic-inventory.json'
      - 'knowledge/d10-v17-complete-research-gauge-20261012.json'
      - 'scripts/check_d10_v18_research_placement.py'
      - '.github/workflows/d10-v18-coordinate-placement.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  no-collision-no-ratification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check all 1024 canonical research coordinates and 6 negative mutations
        run: python3 scripts/check_d10_v18_research_placement.py --self-test
      - name: Optimized Python cannot omit fail-closed assertions
        run: python3 -O scripts/check_d10_v18_research_placement.py --self-test
