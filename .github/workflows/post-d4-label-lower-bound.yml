name: Post-D4 LABEL lower bound research

on:
  pull_request:
    paths:
      - "lib/core1.lisp"
      - "tests/fixtures/2234-label-self-binding-witness.lisp"
      - ".github/workflows/post-d4-label-lower-bound.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  label-self-binding:
    name: Core1 LABEL self-binding witness
    runs-on: ubuntu-latest
    steps:
      - name: Checkout SENS
        uses: actions/checkout@v5

      - name: Checkout pinned typed-SID8 S0 seed
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        uses: actions/checkout@v5
        with:
          repository: juv4uk/mccarthy-eval
          ssh-key: ${{ secrets.MCCARTHY_EVAL_SSH_KEY }}
          persist-credentials: false
          ref: 6031f92652066825a245c806c0773e9e524257bd
          path: .core1-s0/mccarthy-eval

      - name: Verify and build exact S0 seed
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        working-directory: .core1-s0/mccarthy-eval
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "6031f92652066825a245c806c0773e9e524257bd"
          gcc --version | head -1
          gcc -no-pie -O0 -s -o mccarthy-kernel mccarthy-kernel.s
          printf 'S0 seed=%s\n' "$actual_sha"
          sha256sum mccarthy-kernel.s

      - name: Execute current Core1 LABEL witness
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          cat lib/core1.lisp tests/fixtures/2234-label-self-binding-witness.lisp \
            > .core1-s0/2234-label-full.lisp

          expected='(C1-ERROR UNBOUND SELF)'
          actual="$(
            cd .core1-s0/mccarthy-eval
            ./mccarthy-kernel ../2234-label-full.lisp
          )"

          printf 'LABEL-CURRENT expected=%s\n' "$expected"
          printf 'LABEL-CURRENT actual=%s\n' "$actual"
          test "$actual" = "$expected"

          {
            echo "## #2234 LABEL lower-bound research"
            echo
            echo "- Current Core1 LABEL branch does not install the local self binding."
            echo "- Recursive call to SELF resolves as UNBOUND under the current implementation."
            echo "- This proves an implementation gap, not yet that LABEL needs a new SENS identity."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Execute D4 fixed-point recursion falsifier
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          cat lib/core1.lisp tests/fixtures/2234-d4-fixed-point-witness.lisp \
            > .core1-s0/2234-fixed-point-full.lisp

          expected='DONE'
          actual="$(
            cd .core1-s0/mccarthy-eval
            ./mccarthy-kernel ../2234-fixed-point-full.lisp
          )"

          printf 'D4-FIXPOINT expected=%s\n' "$expected"
          printf 'D4-FIXPOINT actual=%s\n' "$actual"
          test "$actual" = "$expected"

          {
            echo "- D4 LAMBDA fixed-point recursion succeeds without LABEL or DEFINE."
            echo "- If this witness is stable, LABEL is derivable behavior rather than a required new semantic identity."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Execute escaping recursive closure witness
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          cat lib/core1.lisp tests/fixtures/2234-d4-fixed-point-escape-witness.lisp \
            > .core1-s0/2234-fixed-point-escape-full.lisp

          expected='CAPTURED'
          actual="$(
            cd .core1-s0/mccarthy-eval
            ./mccarthy-kernel ../2234-fixed-point-escape-full.lisp
          )"

          printf 'D4-FIXPOINT-ESCAPE expected=%s\n' "$expected"
          printf 'D4-FIXPOINT-ESCAPE actual=%s\n' "$actual"
          test "$actual" = "$expected"

          {
            echo "- Escaping D4 recursive closure captures lexical MARK and survives alpha-renamed self reference."
            echo "- No LABEL or DEFINE is used by the witness."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail closed when private S0 evidence is unavailable
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          echo "::error::Private Core1 S0 evidence is unavailable to untrusted fork PRs."
          exit 1
