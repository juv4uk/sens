name: D9 gauge S4

on:
  pull_request:
    paths:
      - "knowledge/d9-v1-gauge-fixed-candidate.json"
      - "knowledge/d9-v1-geometry-state.json"
      - "knowledge/d9-v1-semantic-inventory.json"
      - "knowledge/d9-geometry-laws-s3.json"
      - "scripts/check-d9-gauge-s4.py"
      - ".github/workflows/d9-gauge-s4.yml"
  push:
    branches: [main]
    paths:
      - "knowledge/d9-v1-gauge-fixed-candidate.json"
      - "scripts/check-d9-gauge-s4.py"
      - ".github/workflows/d9-gauge-s4.yml"
  workflow_dispatch:

jobs:
  gauge-s4:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: GPU runner identity
        run: nvidia-smi || true
      - name: Verify S2 geometry
        run: python3 scripts/check-d9-geometry-s2.py
      - name: Verify S3 semantic-law boundary
        run: python3 scripts/check-d9-geometry-laws-s3.py
      - name: Reproduce full S4 candidate
        run: python3 scripts/check-d9-gauge-s4.py
