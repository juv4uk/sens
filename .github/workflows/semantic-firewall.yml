name: Semantic firewall tournament

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firewall:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - name: Run negative-control tournament
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/semantic-firewall"
          python3 benchmarks/semantic-firewall/run.py \
            --out "$RUNNER_TEMP/semantic-firewall"
          cat "$RUNNER_TEMP/semantic-firewall/report.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve raw evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semantic-firewall-${{ github.sha }}
          path: ${{ runner.temp }}/semantic-firewall/
          if-no-files-found: warn
          retention-days: 14
