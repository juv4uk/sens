name: D8 EXPT reciprocal-sign research

on:
  workflow_dispatch:

jobs:
  falsifier:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Run EXPT axis-collapse falsifier
        run: |
          rm -rf /tmp/d8-expt-recip-sign
          echo "FOREIGN_LANGUAGE_TEST_OR_BENCH=EXCLUDED_BY_POLICY native_equivalent=NOT_VERIFIED"
      - name: Verify deterministic replay
        run: |
          rm -rf /tmp/d8-expt-recip-sign-2
          echo "FOREIGN_LANGUAGE_TEST_OR_BENCH=EXCLUDED_BY_POLICY native_equivalent=NOT_VERIFIED"
          cmp /tmp/d8-expt-recip-sign/witness.json \
              /tmp/d8-expt-recip-sign-2/witness.json
      - name: Publish report
        if: always()
        run: |
          test ! -f /tmp/d8-expt-recip-sign/report.md || \
            cat /tmp/d8-expt-recip-sign/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d8-expt-recip-sign
          path: /tmp/d8-expt-recip-sign/
          retention-days: 14
