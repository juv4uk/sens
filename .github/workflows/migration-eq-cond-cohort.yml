name: migration-eq-cond-cohort

on:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04  # CPU-only Python + Rust witnesses; no local or CUDA runner
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Three-pass exact migration and physical T5 parity
        run: python3 -m unittest discover -s tests -p 'test_migration_eq_cond_cohort.py' -v
      - name: Historical EQ/COND physical T5 transport (no semantic oracle)
        run: cargo test -p sens --features rust-t5-reference --test migration_eq_cond_cohort
