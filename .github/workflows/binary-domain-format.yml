name: Binary-domain format

on:
  pull_request:
    paths:
      - "scripts/check-binary-domain-format.py"
      - "scripts/task_schema_record.py"
      - "scripts/check-task-record-structure.py"
      - "scripts/check-task-falsifier.py"
      - "knowledge/binary-domain-format-baseline.json"
      - "knowledge/task-record-structure-baseline.json"
      - ".github/workflows/binary-domain-format.yml"
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *"

permissions:
  contents: read
  issues: read

jobs:
  binary-domain-format:
    name: DOMAIN names an exact width or says UNKNOWN
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Self-test the rule
        run: python3 scripts/check-binary-domain-format.py --self-test

      - name: Self-test shared task-record structure
        run: |
          python3 scripts/task_schema_record.py
          python3 scripts/check-task-record-structure.py --self-test

      # Live snapshot: on PRs report-only so a stale baseline cannot block the
      # first land of the checker itself. Schedule/workflow_dispatch enforce.
      - name: Self-test FALSIFIER quality
        run: python3 scripts/check-task-falsifier.py --self-test

      - name: Snapshot open issues
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/${{ github.repository }}/issues?state=open&per_page=100" \
            --jq '[.[] | select(.pull_request == null) | {number, title, body, state}]' > /tmp/pages.jsonl
          python3 - <<'PY'
          import json
          items = []
          for line in open("/tmp/pages.jsonl"):
              line = line.strip()
              if line:
                  items.extend(json.loads(line))
          json.dump({"issues": items}, open("/tmp/issues.json", "w"))
          print("snapshot:", len(items))
          PY

      - name: No new unnamed DOMAIN
        if: github.event_name != 'pull_request'
        run: |
          python3 scripts/check-binary-domain-format.py \
            --issues /tmp/issues.json \
            --baseline knowledge/binary-domain-format-baseline.json

      - name: Report live debt on PRs (non-blocking)
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        continue-on-error: true
        run: |
          set -euo pipefail
          gh api --paginate "repos/${{ github.repository }}/issues?state=open&per_page=100" \
            --jq '[.[] | select(.pull_request == null) | {number, title, body, state}]' > /tmp/pages.jsonl
          python3 - <<'PY'
          import json
          items = []
          for line in open("/tmp/pages.jsonl"):
              line = line.strip()
              if line:
                  items.extend(json.loads(line))
          json.dump({"issues": items}, open("/tmp/issues.json", "w"))
          print("snapshot:", len(items))
          PY
          python3 scripts/check-binary-domain-format.py \
            --issues /tmp/issues.json \
            --baseline knowledge/binary-domain-format-baseline.json || true


      # Structural seven-field debt follows the same ratchet philosophy:
      # report-only on PRs, blocking on scheduled/manual live audits.
      - name: Enforce no new seven-field structural debt
        if: github.event_name != 'pull_request'
        run: |
          python3 scripts/check-task-record-structure.py \
            --issues /tmp/issues.json \
            --baseline knowledge/task-record-structure-baseline.json

      - name: Report seven-field structural debt on PRs
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          python3 scripts/check-task-record-structure.py \
            --issues /tmp/issues.json \
            --baseline knowledge/task-record-structure-baseline.json \
            --report-only

      - name: Emit structural baseline candidate
        if: always()
        run: |
          if [ -f /tmp/issues.json ]; then
            python3 scripts/check-task-record-structure.py \
              --issues /tmp/issues.json \
              --emit-baseline > /tmp/task-record-structure-baseline.json
            cat /tmp/task-record-structure-baseline.json
          else
            printf '%s\n' '{"schema":"task-record-structure-baseline/v1","violations":[]}' \
              > /tmp/task-record-structure-baseline.json
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: task-record-structure-baseline-candidate
          path: /tmp/task-record-structure-baseline.json
          retention-days: 7


      # #2532 first live slice: report-only until the emitted baseline is reviewed.
      # The checker already supports --baseline non-growth enforcement; this step
      # deliberately does not enable it before observing real false positives.
      - name: Report FALSIFIER quality debt
        if: always() && hashFiles('scripts/check-task-falsifier.py') != ''
        continue-on-error: true
        run: |
          if [ -f /tmp/issues.json ]; then
            mkdir -p /tmp/task-falsifier
            python3 scripts/check-task-falsifier.py \
              --issues /tmp/issues.json \
              --json-out /tmp/task-falsifier/audit.json \
              --report-only | tee /tmp/task-falsifier/report.txt
            python3 scripts/check-task-falsifier.py \
              --issues /tmp/issues.json \
              --emit-baseline > /tmp/task-falsifier/baseline-candidate.json
            cat /tmp/task-falsifier/baseline-candidate.json
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: task-falsifier-audit
          path: /tmp/task-falsifier/
          if-no-files-found: ignore
          retention-days: 7
