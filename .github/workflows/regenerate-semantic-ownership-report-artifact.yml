name: Regenerate semantic ownership report artifact

on:
  pull_request:
    paths:
      - ".github/workflows/regenerate-semantic-ownership-report-artifact.yml"
      - "scripts/semantic-ownership.py"
      - "knowledge/semantic-ownership.lisp"
      - "knowledge/meta-eval-evidence.lisp"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Regenerate semantic ownership report
        run: python3 scripts/semantic-ownership.py --write
      - name: Show diff
        run: git diff -- docs/semantic-ownership-report.md
      - uses: actions/upload-artifact@v6
        with:
          name: regenerated-semantic-ownership-report
          path: docs/semantic-ownership-report.md
          if-no-files-found: error
