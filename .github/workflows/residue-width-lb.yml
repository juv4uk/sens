name: Residue semantic width lower bound

on:
  workflow_dispatch:

jobs:
  width-lb:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Run semantic width lower-bound attack
        run: |
          rm -rf /tmp/residue-width-lb
          python3 benchmarks/residue-width-lb/run.py --out /tmp/residue-width-lb
      - name: Publish report
        if: always()
        run: |
          if test -f /tmp/residue-width-lb/report.md; then
            cat /tmp/residue-width-lb/report.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: residue-width-lb
          path: /tmp/residue-width-lb/
          retention-days: 14
