name: Early Lisp historical ledger provenance guard
on:
  pull_request:
    paths:
      - 'knowledge/early-lisp-post-d4-history-provenance-v1.json'
      - 'knowledge/d1-d9-foundation.json'
      - 'knowledge/d10-v1-semantic-inventory.json'
      - 'scripts/check-early-lisp-post-d4-provenance.py'
      - '.github/workflows/early-lisp-post-d4-provenance.yml'
  workflow_dispatch:
jobs:
  historical-provenance-only:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Check current dedup and negative controls
        run: python3 scripts/check-early-lisp-post-d4-provenance.py --self-test
      - name: Prove the checker made no changes
        run: git diff --exit-code
