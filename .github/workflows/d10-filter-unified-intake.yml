name: D10 unified candidate mechanical sieve

on:
  workflow_dispatch:
permissions:
  contents: write

concurrency:
  group: d10-unified-sieve-main-single-writer
  cancel-in-progress: false

jobs:
  verify-and-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1
      - name: Run negative-gate regression tests (normal and optimized)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_d10_mechanical_filter.py' -v
          python3 -m unittest discover -s tests -p 'test_d10_prepare_filter_input.py' -v
          python3 -m unittest discover -s tests -p 'test_d10_restore_candidate_catalog.py' -v
          python3 -O -m unittest discover -s tests -p 'test_d10_mechanical_filter.py' -v
          python3 -O -m unittest discover -s tests -p 'test_d10_prepare_filter_input.py' -v
          python3 -O -m unittest discover -s tests -p 'test_d10_restore_candidate_catalog.py' -v
      - name: Partition entire pending D10 database into bounded proof batches
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/d10_batch_work.py --self-test
          python3 -O scripts/d10_batch_work.py --self-test
          python3 scripts/d10_batch_work.py \
            --batch-size 64 --output-dir "$RUNNER_TEMP/d10-batch" \
            | tee "$RUNNER_TEMP/d10-batch-run.json"
          python3 - "$RUNNER_TEMP/d10-batch/summary.json" <<'PY'
          import csv, json, pathlib, sys
          summary = json.loads(pathlib.Path(sys.argv[1]).read_text())
          folder = pathlib.Path(sys.argv[1]).parent
          with (folder / "all-work.tsv").open(newline="", encoding="utf-8") as stream:
              rows = list(csv.DictReader(stream, delimiter="\t"))
          if len(rows) != summary["still_pending_work"]:
              raise SystemExit("D10_BATCH_BLOCKED: work-count drift")
          if len(rows) + summary["already_transferred_by_exact_proposal"] != summary["source_pending"]:
              raise SystemExit("D10_BATCH_BLOCKED: lost pending candidates")
          if summary["executed_witnesses_created"] != 0:
              raise SystemExit("D10_BATCH_BLOCKED: fabricated witness receipt")
          print("D10_WORK_BATCHES", summary["batches"], "PENDING", len(rows))
          PY
      - name: Materialize current pinned name index and run F1-F4 gates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/d10-filter"
          # Pinned 1495-name all-time baseline is a source snapshot, never
          # an authority to overwrite a newer canonical D10 resident.
          git fetch origin 17ab25d65346a6a1bfc71f0ed6d64ee75fc6f22f --depth=1 --quiet
          git show 17ab25d65346a6a1bfc71f0ed6d64ee75fc6f22f:knowledge/d10-filter/all-candidates.tsv \
            > "$RUNNER_TEMP/d10-filter/original-1495.tsv"
          python3 scripts/d10_restore_candidate_catalog.py \
            --historical "$RUNNER_TEMP/d10-filter/original-1495.tsv" \
            --output knowledge/d10-filter/all-candidates.tsv \
            | tee "$RUNNER_TEMP/d10-filter/reconciliation.json"
          python3 scripts/d10_prepare_filter_input.py \
            --output "$RUNNER_TEMP/d10-filter/normalized.tsv" \
            | tee "$RUNNER_TEMP/d10-filter/adapter.json"
          python3 scripts/d10_mechanical_filter.py \
            --input "$RUNNER_TEMP/d10-filter/normalized.tsv" \
            --output-dir knowledge/d10-filter \
            | tee "$RUNNER_TEMP/d10-filter/gates.json"
      - name: Verify exact partition and emit source hashes
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/d10-filter/normalized.tsv" "$RUNNER_TEMP/d10-filter/adapter.json" "$RUNNER_TEMP/d10-filter/gates.json" "$RUNNER_TEMP/d10-filter/reconciliation.json" <<'PY'
          import csv
          import hashlib
          import json
          import os
          import pathlib
          import sys
          index, adapter_json, filter_json, reconcile_json = map(pathlib.Path, sys.argv[1:])
          with index.open(encoding="utf-8", newline="") as fh:
              incoming = list(csv.DictReader(fh, delimiter="\t"))
          ids = [r["candidate_id"] for r in incoming]
          if len(ids) != len(set(ids)):
              raise SystemExit("D10 BLOCKED: duplicate source identities")
          buckets = {}
          for name, file in (("accepted","accepted-queue.tsv"),
                             ("rejected","rejected.tsv"), ("escalated","escalated.tsv")):
              with (pathlib.Path("knowledge/d10-filter") / file).open(encoding="utf-8", newline="") as fh:
                  buckets[name] = list(csv.DictReader(fh, delimiter="\t"))
          part = [r["candidate_id"] for rows in buckets.values() for r in rows]
          if len(part) != len(ids) or set(part) != set(ids) or len(part) != len(set(part)):
              raise SystemExit("D10 BLOCKED: incomplete, repeated, or missing rows")
          stats = json.loads(filter_json.read_text().strip().splitlines()[-1])
          adapter = json.loads(adapter_json.read_text().strip().splitlines()[-1])
          reconciliation = json.loads(reconcile_json.read_text().strip().splitlines()[-1])
          if reconciliation["full_union_candidate_ids"] != adapter["index_rows"]:
              raise SystemExit("D10 BLOCKED: restored candidate-ID count differs from actual filter input")
          if (reconciliation["source_union_candidate_ids"] + reconciliation["canonical_overlay_ids_added"]
                  != reconciliation["full_union_candidate_ids"]):
              raise SystemExit("D10 BLOCKED: candidate-ID conservation failed during canonical overlay")
          if (reconciliation["source_historical_ids"] + reconciliation["source_latest_ids"]
                  - reconciliation["source_id_overlap"] != reconciliation["source_union_candidate_ids"]):
              raise SystemExit("D10 BLOCKED: historical/current source-ID union arithmetic failed")
          if reconciliation["source_historical_records"] != 1495:
              raise SystemExit("D10 BLOCKED: frozen 1495-record historical source changed")
          if reconciliation["full_union_names"] < reconciliation["source_historical_names"]:
              raise SystemExit("D10 BLOCKED: missing historical semantic-name coverage")
          if stats != {key: len(rows) for key, rows in buckets.items()}:
              raise SystemExit("D10 BLOCKED: summary count drift")
          if buckets["accepted"]:
              raise SystemExit("D10 BLOCKED: ACCEPT without executed receipt in input")
          def sha(p):
              return hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()
          pointer = json.loads(pathlib.Path("knowledge/d10-current-inventory.json").read_text())
          manifest = {
              "schema": "d10-unified-filter-run/v1",
              "authority": "RESEARCH-HOLD-F1-F4-NO-RATIFICATION",
              "source_commit": os.environ.get("GITHUB_SHA"),
              "current_inventory": pointer["canonical_current"],
              "input_index": "knowledge/d10-filter/all-candidates.tsv",
              "input_index_sha256": sha("knowledge/d10-filter/all-candidates.tsv"),
              "name_index": adapter,
              "historical_catalog_reconciliation": reconciliation,
              "mechanical_partition": stats,
              "complete_historical_branches_claimed": False,
              "accepted_queue_reviewed_by_owner": False,
              "physical_t5_authorized": False,
              "files_sha256": {
                  f: sha("knowledge/d10-filter/" + f) for f in
                  ("accepted-queue.tsv", "rejected.tsv", "escalated.tsv")
              }
          }
          pathlib.Path("knowledge/d10-filter/filter-run-summary.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2, sort_keys=True) + "\n",
              encoding="utf-8")
          print(json.dumps({"status":"PASS_PARTITION_NOT_RATIFICATION", "counts":stats}))
          PY
      - name: Prepare full historical F1-F4 evidence batches
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/d10_full_census_batches.py --self-test
          python3 -O scripts/d10_full_census_batches.py --self-test
          python3 scripts/d10_full_census_batches.py \
            --batch-size 64 --output-dir "$RUNNER_TEMP/d10-full-batches" \
            | tee "$RUNNER_TEMP/d10-full-batch-run.json"
      - name: Publish deterministic evidence triage directly to current main (single writer)
        shell: bash
        run: |
          set -euo pipefail
          git add -- knowledge/d10-filter/all-candidates.tsv \
             knowledge/d10-filter/accepted-queue.tsv \
             knowledge/d10-filter/rejected.tsv \
             knowledge/d10-filter/escalated.tsv \
             knowledge/d10-filter/filter-run-summary.json
          if git diff --cached --quiet; then
            echo "D10_SIEVE_UNCHANGED"
            exit 0
          fi
          # Single-writer with optimistic main fast-forward, not a new branch.
          # If other agents moved main, only rebase our 4 GENERATED paths
          # when no source, contract, or output path changed since checkout.
          for attempt in 1 2 3 4 5; do
            git fetch origin main --quiet
            latest="$(git rev-parse refs/remotes/origin/main)"
            if ! git diff --quiet "$GITHUB_SHA" "$latest" -- \
               knowledge/d10-filter/all-candidates.tsv \
               knowledge/d10-current-inventory.json \
               knowledge/d1-d9-foundation.json \
               scripts/d10_prepare_filter_input.py \
               scripts/d10_restore_candidate_catalog.py \
               scripts/d10_mechanical_filter.py \
               knowledge/d10-filter/accepted-queue.tsv \
               knowledge/d10-filter/rejected.tsv \
               knowledge/d10-filter/escalated.tsv \
               knowledge/d10-filter/filter-run-summary.json; then
              echo "D10_SIEVE_BLOCKED: relevant inputs or outputs changed; regenerate receipts on latest main" >&2
              exit 1
            fi
            git reset --mixed "$latest"
            git add -- knowledge/d10-filter/all-candidates.tsv \
               knowledge/d10-filter/accepted-queue.tsv \
               knowledge/d10-filter/rejected.tsv \
               knowledge/d10-filter/escalated.tsv \
               knowledge/d10-filter/filter-run-summary.json
            if git diff --cached --quiet; then
              echo "D10_SIEVE_UNCHANGED_AFTER_MAIN_REFRESH"
              exit 0
            fi
            git -c user.name='sens-d10-sieve[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m "data(d10): publish evidence-verified F1-F4 triage partition"
            if git push origin HEAD:main; then
              echo "D10_SIEVE_PUBLISHED_MAIN"
              exit 0
            fi
            echo "D10_SIEVE_RETRY_FAST_FORWARD $attempt"
          done
          echo "D10_SIEVE_BLOCKED: main write contention after bounded safe retries" >&2
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d10-indexed-census-proof-batches
          path: |
            ${{ runner.temp }}/d10-full-batches/full-work.tsv
            ${{ runner.temp }}/d10-full-batches/full-batch-*.tsv
            ${{ runner.temp }}/d10-full-batches/summary.json
          if-no-files-found: warn
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d10-bulk-proof-work-queue
          path: |
            ${{ runner.temp }}/d10-batch/all-work.tsv
            ${{ runner.temp }}/d10-batch/batch-*.tsv
            ${{ runner.temp }}/d10-batch/summary.json
          if-no-files-found: warn
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d10-unified-sieve-receipts
          path: |
            knowledge/d10-filter/accepted-queue.tsv
            knowledge/d10-filter/rejected.tsv
            knowledge/d10-filter/escalated.tsv
            knowledge/d10-filter/filter-run-summary.json
          if-no-files-found: warn
          retention-days: 30
