name: D6 structural width pressure

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pressure:
    name: D6 historical width pressure
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Classify completed historical sample
        run: |
          rm -rf /tmp/d6-width-pressure
          echo "FOREIGN_LANGUAGE_TEST_OR_BENCH=EXCLUDED_BY_POLICY native_equivalent=NOT_VERIFIED"
      - name: Publish report
        if: always()
        run: |
          if test -f /tmp/d6-width-pressure/report.md; then
            cat /tmp/d6-width-pressure/report.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d6-width-pressure
          path: /tmp/d6-width-pressure/
          retention-days: 14
