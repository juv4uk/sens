name: D10 crossrepo MAL v1

on:
  pull_request:
    paths:
      - "knowledge/d10-crossrepo-mal-v1.json"
      - "knowledge/d10-v1-semantic-inventory.json"
      - "knowledge/d10-fill-v1-state.json"
      - "scripts/check-d10-crossrepo-mal-v1.py"
      - ".github/workflows/d10-crossrepo-mal-v1.yml"
  push:
    branches: [main]
    paths:
      - "knowledge/d10-crossrepo-mal-v1.json"
      - "knowledge/d10-v1-semantic-inventory.json"
      - "knowledge/d10-fill-v1-state.json"
      - "scripts/check-d10-crossrepo-mal-v1.py"
      - ".github/workflows/d10-crossrepo-mal-v1.yml"
  workflow_dispatch:

jobs:
  harvest:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Verify MAL historical donor harvest
        run: python3 scripts/check-d10-crossrepo-mal-v1.py
      - name: Verify global D10 inventory
        run: python3 scripts/check-d10-v1-semantic-inventory.py
      - name: Verify island ownership boundary
        run: python3 scripts/check-island-ownership-gate.py
