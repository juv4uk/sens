name: Current GPU oracle

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "crates/sens/src/gpu_oracle.rs"
      - "benchmarks/gpu-oracle-current/**"
      - ".github/workflows/gpu-oracle-current.yml"
  push:
    branches: [main]
    paths:
      - "crates/sens/src/gpu_oracle.rs"
      - "benchmarks/gpu-oracle-current/**"
      - ".github/workflows/gpu-oracle-current.yml"

concurrency:
  group: gpu-oracle-current-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  oracle:
    # Semantic oracle verification is CPU control-plane work; never reserve CUDA.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CARGO_BUILD_JOBS: "1"
      RUST_TEST_THREADS: "1"
    steps:
      - uses: actions/checkout@v5
      - name: Validate machine-readable blocked artifact
        run: python3 -m json.tool benchmarks/gpu-oracle-current/blocked-gpu-admission.json >/dev/null
      - name: Run GPU oracle unit tests
        run: cargo test -p sens --lib gpu_oracle::tests -- --nocapture --test-threads=1
