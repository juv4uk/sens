name: Release Preflight

on:
  pull_request:
    paths:
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/**/Cargo.toml"
      - ".github/workflows/release.yml"
      - ".github/workflows/release-preflight.yml"
      - "scripts/verify_uk_t5_triplet.py"
      - "scripts/report_t5_triplet_inventory.py"
      - "scripts/audit_t5_file_pairs.py"
      - "scripts/sens_t5_codec.py"
      - "tests/fixtures/migration-d1-cond-cohort/**"
      - "tests/test_verify_uk_t5_triplet.py"
      - "tests/test_report_t5_triplet_inventory.py"
      - "lib/domains/d1.lisp"
      - "lib/domains/d3.lisp"
  workflow_dispatch:

concurrency:
  group: release-preflight-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  release-preflight:
    # Той самий focused набір, що тег-гейт `test` у `release.yml`: тег-час
    # гарантує ці чеки серверно, тут вони ловлять проблему ще в PR. Повний
    # `cargo test --workspace` + `clippy --workspace` належить `full-nightly`,
    # не PR-гейту випуску: релізний скрипт тепер вимагає саме зелений CI на
    # злитому SHA, а не локальний повний прогон.
    name: focused release preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-preflight

      - name: Версійна паритетність релізних crates
        run: cargo test --locked -p sens-lsp --test release_parity

      - name: Ізольовані перевірки інсталятора
        run: python3 -m unittest discover -s packaging/tests -p test_install.py -v

      - name: Owner's 2026-10-09 Ukrainian / physical T5 / ASCII triple preflight
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_verify_uk_t5_triplet.py' -v
          python3 -m unittest discover -s tests -p 'test_report_t5_triplet_inventory.py' -v
          python3 scripts/verify_uk_t5_triplet.py \
            --lisp tests/fixtures/migration-d1-cond-cohort/branch.lisp \
            --sens tests/fixtures/migration-d1-cond-cohort/branch.sens \
            --view tests/fixtures/migration-d1-cond-cohort/branch
          python3 scripts/report_t5_triplet_inventory.py . \
            --require-view tests/fixtures/migration-d1-cond-cohort/branch.sens \
            --report "$RUNNER_TEMP/t5-preflight-triple-ledger.json"
          python3 - "$RUNNER_TEMP/t5-preflight-triple-ledger.json" <<'PY'
          import json, sys
          from pathlib import Path
          data=json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert data["schema"] == "sens-t5-triplet-inventory/v1"
          assert data["failed_required"] == []
          assert data["summary"]["physical_pairs_seen"] > 0
          assert data["summary"]["physical_blocked"] == 0
          assert data["summary"]["view_present_valid"] >= 1
          assert data["summary"]["release_admitted"] == 0
          assert data["summary"]["original_executable_migrations_certified"] == 0
          print("BOUNDED_TRIPLE_PREFLIGHT_PASS / GENERAL_UK_ORACLE_AND_FULL_VIEW_RELEASE_STILL_BLOCKED")
          print("REMAINING_MISSING_SPACED_VIEWS", data["summary"]["view_missing"])
          PY

      - name: translation boundary regression
        run: cargo test --locked -p sens --test translation_boundary

      - name: Ukrainian/Sanskrit surface regression
        run: cargo test --locked -p sens --test uk_sa_surface

      - name: island installer CLI
        run: cargo test --locked -p sens-cli --test islands_cli

      - name: release asset contract
        run: cargo test --locked -p sens-cli --test islands_release_asset

      - name: focused release clippy
        run: cargo clippy -p sens -p sens-cli --all-targets -- -D warnings