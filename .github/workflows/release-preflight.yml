name: Release Preflight

on:
  workflow_dispatch:

concurrency:
  group: release-preflight-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  release-preflight:
    # Full pre-tag release gate. Run workspace tests and Clippy before the
    # explicit owner GO/tag step; release.yml repeats them on the tagged SHA.
    name: focused release preflight
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/actions/install-zig
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          toolchain: "1.99.0"
          components: clippy
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          shared-key: release-preflight

      - name: Sterile Zig corridor (Rust↔SENS only via Zig ABI v2)
        run: |
          set -euo pipefail
          python3 scripts/check_sterile_zig_corridor.py
          python3 -m unittest tests.test_sterile_zig_corridor -v
          python3 scripts/check_rust_sens_zig_corridor.py .
          python3 -m unittest tests.test_check_rust_sens_zig_corridor -v
          python3 scripts/check_rust_sens_corridor_coverage.py .
          python3 -m unittest tests.test_check_rust_sens_corridor_coverage -v
          python3 scripts/check_corridor_axiom_binding.py .
          python3 -m unittest tests.test_check_corridor_axiom_binding -v
          python3 scripts/report_rust_zig_sens_boundary.py --out "$RUNNER_TEMP/rust-zig-sens-boundary.json"
          python3 scripts/check_migration_zig_only_path.py .
          python3 -m unittest tests.test_check_migration_zig_only_path -v
          python3 scripts/check_axiom_coverage.py .
          python3 -m unittest tests.test_check_axiom_coverage -v
          python3 scripts/check_principle_force.py .
          python3 -m unittest tests.test_check_principle_force -v
          python3 scripts/check_numeric_domain_exclusive.py .
          python3 -m unittest tests.test_check_numeric_domain_exclusive -v
          # Structural success permits the remaining checks to run; it is NOT
          # a release GO or authorization to publish.
          python3 scripts/release_go_gate.py . --structural-only --json "$RUNNER_TEMP/release-go-gate.json"
          python3 -m unittest tests.test_rust_zig_sens_boundary -v
          python3 scripts/migration-zig-gate.py --require-zig
          # Zig 0.16 native test suite with release-like optimizations and safety.
          # Full migration proof + native physical test are separate GO inputs.
          echo 'test_id=zig-release-safe-corridor layer=transport semantic_authority=SENS compiler=0.16.0'
          zig test research/zig-codecs/tests.zig -O ReleaseSafe -lc
          # Independent Rust-free C caller compiled and linked with Zig ABI v2.
          # Physical T5/F3C/E1 + ELF/archive evidence, never a semantic oracle.
          echo 'test_id=zig-release-c-host-abi-v2 layer=transport semantic_authority=SENS host=C'
          bash research/zig-codecs/host-c/verify.sh
          # Release corpus parity: real Rust-free C -> pinned Zig ABI v2,
          # immutable migration fixture bits, exact negative reason and SHA.
          # --self-test alone is NOT physical evidence; --run is mandatory.
          echo 'test_id=zig-release-h2-corpus layer=transport host=C semantic_authority=SENS'
          python3 research/zig-codecs/host-c/verify_h2_physical_parity.py --self-test --run

      - name: Upload release GO-gate report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-go-gate
          path: ${{ runner.temp }}/release-go-gate.json
          if-no-files-found: error

      - name: Release version alignment (gate #1 mechanical)
        run: |
          python3 scripts/check-release-version-alignment.py --self-test
          python3 scripts/check-release-version-alignment.py

      - name: Release toolchain pins (gate #3 mechanical)
        run: python3 scripts/check-release-pins.py

      - name: Release preflight trigger scope negative controls
        run: python3 -m unittest discover -s packaging/tests -p test_release_preflight_scope.py -v

      - name: Release tag safety under optimized Python
        run: python3 -m unittest discover -s packaging/tests -p test_release_tag_guard.py -v

      - name: Release artifact integrity negative controls
        run: python3 -m unittest discover -s tests -p test_verify_release_assets.py -v

      - name: Independent exact-SHA CI gate negative controls
        run: python3 -m unittest discover -s packaging/tests -p test_release_ci_check_runs.py -v

      - name: Exact-SHA GitHub check-run verifier negative controls
        run: python3 -m unittest discover -s tests -p test_verify_release_ci.py -v

      - name: Release publication workflow structure regression
        run: python3 -m unittest discover -s packaging/tests -p 'test_release_publication_gate.py' -v

      - name: Версійна паритетність релізних crates
        run: cargo test --locked -p sens-lsp --test release_parity

      - name: Ізольовані перевірки інсталятора
        run: python3 -m unittest discover -s packaging/tests -p test_install.py -v

      - name: "Український Lisp ↔ SENS: чинний T5M, облік програм і негативні свідки"
        shell: bash
        run: |
          set -euo pipefail
          # Єдина чинна фізична публікація — T5M; старий T5 не може видавати .sens.
          # Це механічні інваріанти та облік, а не підміна SENS-виконання Python.
          python3 -m unittest tests/test_retired_t5_publisher.py -v
          python3 -m unittest tests/test_guarded_sens_mirror.py -v
          python3 -m unittest tests/test_audit_all_lisp_triplets.py -v
          python3 -m unittest discover -s tests -p 'test_verify_uk_t5_t5m_triplet.py' -v
          python3 -m unittest discover -s tests -p 'test_report_t5_t5m_triplet_inventory.py' -v
          python3 -m unittest discover -s tests -p 'test_check_release_triple_corpus.py' -v
          # F1–F4 receipt: T5M physical hash, negative fraud cases, never semantic GO.
          python3 -m unittest discover -s tests -p 'test_check_release_admission_ledger.py' -v
          python3 scripts/verify_uk_t5_t5m_triplet.py \
            --lisp tests/fixtures/migration-d1-cond-cohort/branch.lisp \
            --sens tests/fixtures/migration-d1-cond-cohort/branch.sens \
            --view tests/fixtures/migration-d1-cond-cohort/branch
          python3 scripts/report_t5_t5m_triplet_inventory.py . \
            --require-view tests/fixtures/migration-d1-cond-cohort/branch.sens \
            --report "$RUNNER_TEMP/t5-preflight-triple-ledger.json"
          python3 - "$RUNNER_TEMP/t5-preflight-triple-ledger.json" <<'PY'
          import json, sys
          from pathlib import Path
          data=json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          summary = data["summary"]
          physical = summary["physical_pairs_seen"]
          checks = (
              (data["schema"] == "sens-t5-triplet-inventory/v1", "invalid evidence schema"),
              (data["failed_required"] == [], "required triple witness failed"),
              (physical > 0, "no physical pairs"),
              (summary["physical_blocked"] == 0, "physical source blocked"),
              (summary["view_present_valid"] >= 1, "bounded view witness missing"),
              (0 <= summary["view_present_valid"] <= physical, "view count exceeds physical pair count"),
              (0 <= summary["uk_oracle_verified"] <= physical, "oracle count exceeds physical pair count"),
              (0 <= summary["release_admitted"] <= physical, "admission count exceeds physical pair count"),
              (0 <= summary["original_executable_migrations_certified"] <= physical,
               "certified migration count exceeds physical pair count"),
          )
          for valid, explanation in checks:
              if not valid:
                  raise SystemExit("RELEASE_PREFLIGHT_BLOCKED: " + explanation)
          print("BOUNDED_TRIPLE_PREFLIGHT_PASS / TAG-TIME GATE STILL REQUIRES COMPLETE SAME-SHA CORPUS ADMISSION")
          print("RELEASE_ADMITTED", summary["release_admitted"], "/", physical)
          print("ORIGINAL_EXECUTABLE_MIGRATIONS_CERTIFIED", summary["original_executable_migrations_certified"])
          print("REMAINING_MISSING_SPACED_VIEWS", summary["view_missing"])
          PY

      - name: translation boundary regression
        run: cargo test --locked -p sens --test translation_boundary

      - name: island installer CLI
        run: cargo test --locked -p sens-cli --test islands_cli

      - name: release asset contract
        run: cargo test --locked -p sens-cli --test islands_release_asset

      - name: Install SWI-Prolog for real Prolog↔Lisp↔Datalog integration
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v swipl >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends swi-prolog-nox
          fi
          command -v swipl
          swipl --version

      - name: Full workspace tests (pre-tag, exact SHA)
        run: cargo test --locked --workspace --no-fail-fast

      - name: "Native SENS F2/F4: позитивні та негативні докази на цьому SHA"
        shell: bash
        run: |
          set -euo pipefail
          # Семантичний вирок належить реальному SENS-процесу; оболонка й Python
          # перевіряють лише фізичні байти, форму свідків та їхні результати.
          cargo build --locked -p sens-cli --bin sens
          bash scripts/prove-meta-eval-graph-d1.sh target/debug/sens
          bash scripts/prove-meta-eval-lexical-shadow-d1.sh target/debug/sens
          bash scripts/prove-meta-eval-predicates-d1.sh target/debug/sens
          bash scripts/prove-meta-eval-mutual-d4.sh target/debug/sens
          bash scripts/prove-d4-selector-width.sh target/debug/sens

      - name: Full workspace Clippy (pre-tag, exact SHA)
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
