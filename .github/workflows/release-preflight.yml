name: Release Preflight

on:
  pull_request:
    paths:
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/**/Cargo.toml"
      - ".github/workflows/release.yml"
      - ".github/workflows/release-preflight.yml"
      - "scripts/domain_word_carrier.py"
      - "scripts/sens_source_pair_codec.py"
      - "scripts/sens-uk-encode.py"
      - "scripts/sens-uk-decode.py"
      - "scripts/verify-source-pairs.py"
      - "tests/test_ukrainian_packed_source_codec.py"
      - "tests/test_verify_source_pairs.py"
  workflow_dispatch:

concurrency:
  group: release-preflight-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  release-preflight:
    # Той самий focused набір, що тег-гейт `test` у `release.yml`: тег-час
    # гарантує ці чеки серверно, тут вони ловлять проблему ще в PR. Повний
    # `cargo test --workspace` + `clippy --workspace` належить `full-nightly`,
    # не PR-гейту випуску: релізний скрипт тепер вимагає саме зелений CI на
    # злитому SHA, а не локальний повний прогон.
    name: focused release preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-preflight

      - name: P0 binary/Ukrainian exact two-way pair preflight (#4430)
        run: |
          python3 -m unittest discover -s tests -p 'test_verify_source_pairs.py' -v
          python3 scripts/verify-source-pairs.py --root . \
            --include '**/*.lisp' \
            --encoder scripts/sens-uk-encode.py \
            --decoder scripts/sens-uk-decode.py

      - name: Версійна паритетність релізних crates
        run: cargo test --locked -p sens-lsp --test release_parity

      - name: Ізольовані перевірки інсталятора
        run: python3 -m unittest discover -s packaging/tests -p test_install.py -v

      - name: translation boundary regression
        run: cargo test --locked -p sens --test translation_boundary

      - name: Ukrainian/Sanskrit surface regression
        run: cargo test --locked -p sens --test uk_sa_surface

      - name: island installer CLI
        run: cargo test --locked -p sens-cli --test islands_cli

      - name: release asset contract
        run: cargo test --locked -p sens-cli --test islands_release_asset

      - name: focused release clippy
        run: cargo clippy -p sens -p sens-cli --all-targets -- -D warnings