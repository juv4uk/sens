name: Release Preflight
# SENS_RELEASE_PREFLIGHT
# Ідентичність — унікальна послідовність тритів SENS. Квитанції не потрібні.

on:
  workflow_dispatch:
    inputs:
      full:
        description: "Run the complete standalone preflight"
        required: false
        type: boolean
        default: true
      ref:
        description: "Exact commit SHA to verify"
        required: false
        type: string
        default: ""
  workflow_call:
    inputs:
      full:
        description: "Run full preflight unless the caller already runs the release test gate"
        required: false
        type: boolean
        default: true
      ref:
        description: "Exact commit SHA to verify"
        required: false
        type: string
        default: ""
jobs:
  release-preflight:
    name: focused release preflight
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Підтвердити точний SHA передрелізної перевірки
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.ref || github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          if [[ "$actual" != "$EXPECTED_SHA" ]]; then
            echo "::error::RELEASE_PREFLIGHT_SHA_MISMATCH expected=$EXPECTED_SHA actual=$actual" >&2
            exit 1
          fi
          echo "RELEASE_PREFLIGHT_EXACT_SHA=$actual"
      - uses: ./.github/actions/install-zig

      - name: Перевірка — жодних чужомовних runners у коридорі
        shell: bash
        run: bash scripts/check-sens-only-semantic-tests.sh

      - name: Реєстр ARCHIVE мовних виключень
        shell: bash
        run: bash scripts/check-language-policy-archive.sh

      - name: Самоперевірка мовного гейту
        shell: bash
        run: bash scripts/test-language-policy-archive-gate.sh

      - name: Мовна межа — JSON/SHA не callable у SENS
        shell: bash
        run: |
          set -euo pipefail
          files=(lib/domains/d9.lisp lib/surface/uk-sa-coverage.lisp contracts/d9-ratification.lisp)
          if grep -nEi 'json-parse|sha256-hex|JSON-PARSE|SHA256-HEX' "${files[@]}" 2>/dev/null; then
            echo "::error title=SENS_LANGUAGE_BOUNDARY::forbidden callable"
            exit 1
          fi
          echo "SENS_LANGUAGE_BOUNDARY=PASS"

      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
        with:
          shared-key: release-preflight

      - name: Sterile Zig corridor
        if: ${{ always() }}
        run: zig test research/zig-codecs/tests.zig -O ReleaseSafe -lc
      - name: F3C corridor behavior — Zig roundtrip
        if: ${{ always() }}
        run: cargo test --locked -p sens-cli --bin sens-trit explicit_f3_codec_roundtrip_is_zig_owned -- --nocapture
      - name: F3C corridor behavior — fail closed without Zig
        if: ${{ always() }}
        run: cargo test --locked --no-default-features -p sens-cli --bin sens-trit f3c_physical_ingress_and_egress_require_zig_even_for_valid_bytes -- --nocapture

      - name: translation boundary (required for every release preflight)
        if: ${{ always() }}
        run: cargo test --locked -p sens --test translation_boundary

      - name: F6 physical WRITE→READ producer/consumer — exact SHA
        if: ${{ always() }}
        run: cargo test --locked -p sens-cli --test wsm_fs_f6_pipeline -- --nocapture

      - name: Release tag guard — shell-only publisher contract
        if: ${{ always() && inputs.full }}
        run: cargo test --locked -p sens-cli --test release_tag_guard -- --nocapture

      - name: Workspace tests
        if: ${{ always() && inputs.full }}
        id: workspace_tests
        run: cargo test --locked --workspace

      - name: Native SENS laws — вирок у тритах, без квитанцій
        id: native_sens_laws
        if: always()
        run: |
          set -euo pipefail
          cargo build --locked -p sens-cli --bin sens 2>/dev/null || cargo build --locked -p sens --bin sens
          bash scripts/prove-meta-eval-graph-d1.sh target/debug/sens
          bash scripts/prove-meta-eval-lexical-shadow-d1.sh target/debug/sens
          bash scripts/prove-meta-eval-predicates-d1.sh target/debug/sens
          bash scripts/prove-d4-selector-width.sh target/debug/sens
          bash scripts/prove-твердження-m1.sh target/debug/sens
          bash scripts/prove-бенчмарк-медіана.sh target/debug/sens
          bash scripts/prove-бенчмарк-структура.sh target/debug/sens
          bash scripts/prove-бенчмарк-умова.sh target/debug/sens
          bash scripts/prove-ідентичність-тритів.sh target/debug/sens
          bash scripts/prove-lisp-language-laws.sh target/debug/sens
          bash scripts/prove-d1-порожність.sh target/debug/sens
          bash scripts/prove-d1-empty-identity.sh target/debug/sens
          bash scripts/prove-d3-пара.sh target/debug/sens
          bash scripts/prove-d1-not.sh target/debug/sens
          bash scripts/prove-бенчмарк-глибина.sh target/debug/sens
          bash scripts/prove-d3-атом-межа.sh target/debug/sens
          bash scripts/prove-d3-як-є-щит.sh target/debug/sens

      - name: Compiler nucleus exact source → T5M → view parity
        id: compiler_nucleus_physical_parity
        if: ${{ always() && inputs.full }}
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked -p sens-cli --bin sens --bin sens-trit
          bash scripts/check-triple-projection.sh --fixture lib/compiler-nucleus.lisp

      - name: Clippy
        id: workspace_clippy
        if: ${{ always() && inputs.full }}
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: "Дозволені мови: SENS/Rust/Zig/Guile/C/Assembler"
        id: native_language_policy
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          workflow_source="$(
            awk '
              /^      - name: Мовна межа/ { skip = 1 }
              /^      - name: \"?\(Мовна політика|Дозволені мови\)/ { skip = 1 }
              /^      - name:/ {
                if ($0 !~ /Мовна межа|Мовна політика|Дозволені мови/) skip = 0
              }
              !skip { print }
            ' .github/workflows/release-preflight.yml
          )"
          if grep -nEi 'PYTHON_TOOL|python[[:space:]]+-c|python3[[:space:]]+-c|import[[:space:]]+json|[[:space:]]sha256sum|pytest[[:space:]]' <<< "$workflow_source"; then
            echo "::error title=RELEASE_BLOCKED::активний workflow містить заборонений сторонній виконавець"
            exit 1
          fi
          echo "RELEASE_NATIVE_LANGUAGE_POLICY=PASS semantic_authority=SENS mechanisms=Rust,Zig,Guile,C,Assembler"


  linux-release-abi:
    name: Linux release binary — baseline x86-64 / GLIBC 2.35
    # Standalone full preflight verifies this before a release tag exists.
    # A tagged release caller also runs it even when its other gates are parallel.
    if: ${{ inputs.full || github.ref_type == 'tag' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Підтвердити той самий SHA для Linux release binary
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.ref || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          echo "RELEASE_LINUX_EXACT_SHA=$EXPECTED_SHA"
      - uses: ./.github/actions/install-zig
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
        with:
          shared-key: linux-release-abi
      - name: Build public Linux release binary for baseline x86-64
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C target-cpu=x86-64"
          SENS_ZIG_PORTABLE_LINUX: "1"
        run: cargo build --locked --release -p sens-cli --bin sens --target x86_64-unknown-linux-gnu

      # Гейт перевіряє те, що збирає: портативність не можна лишати
      # припущенням. Релізний ассет мусить бути baseline x86-64 і glibc ≤ 2.35.
      - name: Verify public Linux binary portability — baseline x86-64, glibc 2.35
        shell: bash
        run: |
          set -euo pipefail
          bin="target/x86_64-unknown-linux-gnu/release/sens"
          test -f "$bin" || { echo "RELEASE_ASSET_ERROR: $bin not built" >&2; exit 1; }
          max_glibc="$(objdump -T "$bin" | grep -o 'GLIBC_2\.[0-9]*' | sort -uV | tail -1)"
          echo "PORTABILITY max_glibc=$max_glibc"
          if [ "$(printf '%s\n' "$max_glibc" GLIBC_2.35 | sort -V | tail -1)" != "GLIBC_2.35" ]; then
            echo "RELEASE_ASSET_ERROR: $bin requires $max_glibc, above GLIBC_2.35" >&2
            exit 1
          fi
          zmm="$(objdump -d "$bin" | grep -c zmm || true)"
          echo "PORTABILITY zmm=$zmm"
          if [ "$zmm" -ne 0 ]; then
            echo "RELEASE_ASSET_ERROR: $bin contains $zmm AVX-512 instructions" >&2
            exit 1
          fi
          echo "PORTABILITY_PASS baseline x86-64, glibc $max_glibc, no AVX-512"

      - name: Stage portable Linux binary for inspection
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: preflight-linux-portable
          path: target/x86_64-unknown-linux-gnu/release/sens
          if-no-files-found: error
      - name: Verify Linux ABI floor and reject AVX-512
        shell: bash
        run: |
          set -euo pipefail
          binary=target/x86_64-unknown-linux-gnu/release/sens
          if readelf --version-info "$binary" | grep -Eq 'GLIBC_2\.(3[6-9]|[4-9][0-9])'; then
            echo "::error title=RELEASE_GLIBC_TOO_NEW::Linux asset requires GLIBC 2.36 or newer" >&2
            exit 1
          fi
          if objdump -d "$binary" | grep -Eq '[[:space:]]%?zmm[0-9]+'; then
            echo "::error title=RELEASE_AVX512_FORBIDDEN::Linux asset contains a ZMM instruction" >&2
            exit 1
          fi
          echo "RELEASE_LINUX_ABI=PASS max_glibc<=2.35 cpu=baseline-x86-64"

      - name: Execute release Linux binary against SENS-native laws
        shell: bash
        run: |
          set -euo pipefail
          binary="$PWD/target/x86_64-unknown-linux-gnu/release/sens"
          test -x "$binary"
          # These three exact witnesses previously exposed SIGILL in the
          # published Linux asset's compute path. Run them against this
          # release-mode binary, not the separate debug test executable.
          bash scripts/prove-meta-eval-graph-d1.sh "$binary"
          bash scripts/prove-d4-selector-width.sh "$binary"
          bash scripts/prove-ідентичність-тритів.sh "$binary"
          echo "RELEASE_LINUX_RUNTIME_WITNESSES=PASS binary=release/sens authority=SENS"
