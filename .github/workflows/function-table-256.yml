name: Historical flat function-table projection

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  historical-flat-function-table:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Build SENS tooling runtime
        run: cargo build -p sens-cli --bin sens
      - name: Verify deterministic historical function-table projection
        run: ./target/debug/sens scripts/generate-function-table.lisp --check
