name: D9 ratified authority

on:
  workflow_dispatch:

jobs:
  authority:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: GPU runner identity
        run: nvidia-smi || true
      - name: Verify D9 current authority
        run: python3 scripts/check-d9-current-authority.py
      - name: Verify D1-D9 foundation
        run: python3 scripts/check-d1-d5-foundation.py
