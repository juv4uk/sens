name: D10 de Bruijn cyclic binary-word donor oracle
on:
  workflow_dispatch:
jobs:
  exact-cyclic-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Source, D1-D9/D10 dedup, HOLD and 11 adverse controls
        run: python3 scripts/check_d10_debruijn_binary_cycle.py --self-test
      - name: 65812 exhaustive binary-word differential cases
        run: python3 -m unittest discover -s tests -p test_d10_debruijn_binary_cycle.py -v
      - name: Install Chez Scheme R6RS reference runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y chezscheme
      - name: Actual independent Chez R6RS donor
        run: scheme --script tests/d10_debruijn_binary_cycle_chez.ss
