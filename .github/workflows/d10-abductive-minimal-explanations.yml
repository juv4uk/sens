name: D10 finite abductive explanations research
on:
  workflow_dispatch:
jobs:
  finite-abductive-research:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - name: Install independent Prolog donor runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y swi-prolog
      - name: Verify source, D1-D9 dedup boundary, and all finite reference cases
        run: python3 scripts/check_d10_abductive_minimal_explanations.py --self-test
      - name: Cross-check powerset abduction against ATMS label propagation
        run: python3 tests/test_d10_abductive_atms_reduction.py
      - name: Compare Python powerset oracle against independent Prolog implementation
        run: python3 scripts/check_d10_abductive_minimal_explanations.py --swipl swipl
