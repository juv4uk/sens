name: Одноразове відновлення точного Core4 FASL
on:
  push:
    branches:
      - fix/core4-fasl-exact-main-20261010
    paths:
      - .github/workflows/core4-fasl-exact-main-20261010.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fasl:
    if: github.ref == 'refs/heads/fix/core4-fasl-exact-main-20261010' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Отримати точну ремонтну гілку
        uses: actions/checkout@v4
        with:
          ref: fix/core4-fasl-exact-main-20261010
          persist-credentials: true
      - name: Встановити Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Перевірити незмінність джерела Core4
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object lib/core4.lisp)" = "411b7401e355a17e8052a74b5de6eae522fee6cf"
          test "$(git ls-files --error-unmatch lib/core4.lisp)" = "lib/core4.lisp"
          printf 'core4_source_git_blob=%s\n' "$(git hash-object lib/core4.lisp)"
      - name: Згенерувати фізичний FASL штатним генератором
        shell: bash
        run: |
          set -euo pipefail
          cargo run --locked -p sens-cli --bin gen-fasl -- lib/core4.lisp lib/core4.lisp.fasl
          file lib/core4.lisp.fasl
          sha256sum lib/core4.lisp lib/core4.lisp.fasl
      - name: Перевірити точний знімок
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p sens --test core_fasl_freshness -- --nocapture
          git diff --check
      - name: Зберегти тільки двійковий знімок у ремонтній гілці
        shell: bash
        run: |
          set -euo pipefail
          git add -- lib/core4.lisp.fasl
          if git diff --cached --quiet; then
            echo 'Знімок уже відповідає джерелу'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'виправлення: відновити двійковий знімок Core4 із точного джерела'
          git push origin HEAD:refs/heads/fix/core4-fasl-exact-main-20261010
