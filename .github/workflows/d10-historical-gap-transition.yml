name: D10 historical gap monotonic selection
on:
  workflow_dispatch:
jobs:
  historical-gap-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Historical 15 HOLD snapshot and negative tests
        run: |
          python3 scripts/check_d10_historical_gap_audit.py --self-test
          python3 -m unittest discover -s tests -p 'test_d10_historical_gap_transition.py' -v
