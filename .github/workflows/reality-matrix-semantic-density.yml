name: Reality Matrix semantic density

on:
  pull_request:
    paths:
      - "benchmarks/cross-language/reality-matrix/semantic-density/**"
      - "knowledge/d1-d7-foundation.json"
      - "knowledge/d4-cleanroom.json"
      - "knowledge/d5-ratified.json"
      - "knowledge/d6-ratified.json"
      - "scripts/research-2322-generative-domain-forecast.py"
      - ".github/workflows/reality-matrix-semantic-density.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  strict-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cross-check strict theorem-generated residents
        run: |
          python3 benchmarks/cross-language/reality-matrix/semantic-density/run.py             --out-dir "$RUNNER_TEMP/semantic-density"

      - name: Upload baseline
        uses: actions/upload-artifact@v4
        with:
          name: reality-matrix-semantic-density
          path: |
            ${{ runner.temp }}/semantic-density/strict-baseline.json
            ${{ runner.temp }}/semantic-density/report.md
