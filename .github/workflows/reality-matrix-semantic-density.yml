name: Reality Matrix semantic density

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  strict-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cross-check strict theorem-generated residents — EXCLUDED (NOT_VERIFIED)
        if: false
        shell: bash
        run: echo "FOREIGN_LANGUAGE_TEST_BENCH=EXCLUDED_BY_POLICY native_equivalent=NOT_VERIFIED"
      - name: Upload baseline
        uses: actions/upload-artifact@v4
        with:
          name: reality-matrix-semantic-density
          path: |
            ${{ runner.temp }}/semantic-density/strict-baseline.json
            ${{ runner.temp }}/semantic-density/report.md
