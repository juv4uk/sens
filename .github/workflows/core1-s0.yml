name: Core1 S0 bootstrap

on:
  pull_request:
    paths:
      - "lib/core1.lisp"
      - "lib/core1-compiler-prelude.lisp"
      - "contracts/core1-bootstrap-contract.lisp"
      - "contracts/core1-historical-sid-map.lisp"
      - "contracts/core1-s3-compiler-prelude.lisp"
      - "contracts/core1-generation-manifest.lisp"
      - "tests/fixtures/core1-s0-witness.lisp"
      - ".github/workflows/core1-s0.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mccarthy-seed:
    name: mccarthy-eval S0 executes Core1
    runs-on: [self-hosted, guix]
    steps:
      - name: Checkout sens Core1 source
        uses: actions/checkout@v5

      - name: Verify local Core1 inputs before private checkout
        shell: bash
        run: |
          set -euo pipefail
          test -f lib/core1.lisp
          test -f contracts/core1-bootstrap-contract.lisp
          test -f contracts/core1-s3-compiler-prelude.lisp
          git diff --check

      - name: Checkout pinned typed-SID8 S0 seed
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        uses: actions/checkout@v5
        with:
          repository: juv4uk/mccarthy-eval
          ssh-key: ${{ secrets.MCCARTHY_EVAL_SSH_KEY }}
          persist-credentials: false
          ref: 6031f92652066825a245c806c0773e9e524257bd
          path: .core1-s0/mccarthy-eval

      - name: Checkout pinned Lisp-authored compiler seed
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        uses: actions/checkout@v5
        with:
          repository: juv4uk/wsm-my-lisp
          ssh-key: ${{ secrets.WSM_MY_LISP_SSH_KEY }}
          persist-credentials: false
          ref: a6bd9747196f2d676ab6883cbb4b84c7fcfc6947
          path: .core1-s0/wsm-sens

      - name: Build pinned typed-SID8 seed
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        working-directory: .core1-s0/mccarthy-eval
        run: gcc -no-pie -O0 -s -o mccarthy-kernel mccarthy-kernel.s

      - name: Record S0/S1 provenance
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          seed_sha="$(git -C .core1-s0/mccarthy-eval rev-parse HEAD)"
          compiler_sha="$(git -C .core1-s0/wsm-sens rev-parse HEAD)"
          test "$seed_sha" = "6031f92652066825a245c806c0773e9e524257bd"
          test "$compiler_sha" = "a6bd9747196f2d676ab6883cbb4b84c7fcfc6947"
          printf 'S0 seed commit: %s\n' "$seed_sha"
          printf 'S2 compiler seed commit: %s\n' "$compiler_sha"
          printf 'S0 source SHA-256: '
          sha256sum .core1-s0/mccarthy-eval/mccarthy-kernel.s | cut -d' ' -f1
          printf 'S0 kernel SHA-256: '
          sha256sum .core1-s0/mccarthy-eval/mccarthy-kernel | cut -d' ' -f1
          printf 'S1 core1.lisp SHA-256: '
          sha256sum lib/core1.lisp | cut -d' ' -f1
          printf 'S2 compiler.lisp SHA-256: '
          sha256sum .core1-s0/wsm-sens/lib/compiler.lisp | cut -d' ' -f1

      - name: Verify generation manifest against measured bytes
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          manifest="contracts/core1-generation-manifest.lisp"
          s0_source="$(sha256sum .core1-s0/mccarthy-eval/mccarthy-kernel.s | cut -d' ' -f1)"
          s0_binary="$(sha256sum .core1-s0/mccarthy-eval/mccarthy-kernel | cut -d' ' -f1)"
          s1_source="$(sha256sum lib/core1.lisp | cut -d' ' -f1)"
          s2_source="$(sha256sum .core1-s0/wsm-sens/lib/compiler.lisp | cut -d' ' -f1)"

          grep -F "(commit . \"6031f92652066825a245c806c0773e9e524257bd\")" "$manifest"
          grep -F "(source-sha256 . \"$s0_source\")" "$manifest"
          grep -F "(binary-sha256 . \"$s0_binary\")" "$manifest"
          grep -F "(source-sha256 . \"$s1_source\")" "$manifest"
          grep -F "(commit . \"a6bd9747196f2d676ab6883cbb4b84c7fcfc6947\")" "$manifest"
          grep -F "(source-sha256 . \"$s2_source\")" "$manifest"

      - name: Execute exact Core1 S1 source on S0
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          cat lib/core1.lisp tests/fixtures/core1-s0-witness.lisp > .core1-s0/core1-full.lisp

          expected='HISTORICAL-FUNARG
          T
          (A . B)
          C
          (C1-ERROR UNBOUND VECTOR)'

          actual="$(
            cd .core1-s0/mccarthy-eval
            ./mccarthy-kernel ../core1-full.lisp
          )"

          printf '%s\n' "$actual"
          test "$actual" = "$expected"

      - name: Load pinned compiler source through Core1
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          {
            printf '%s\n' '(C1-EVAL-PROGRAM-THEN'
            printf '%s\n' '  (QUOTE ('
            sed '/^[[:space:]]*;/d' .core1-s0/wsm-sens/lib/compiler.lisp
            printf '%s\n' '  ))'
            printf '%s\n' '  (QUOTE (compiler-form (quote FOO))))'
          } > .core1-s0/compiler-smoke.lisp

          cat lib/core1.lisp .core1-s0/compiler-smoke.lisp > .core1-s0/core1-compiler-full.lisp

          actual="$(
            cd .core1-s0/mccarthy-eval
            ./mccarthy-kernel ../core1-compiler-full.lisp
          )"

          printf '%s\n' "$actual"
          test "$actual" = '(var FOO)'

      - name: Execute Core1 S3 compiler prelude through S0/Core1
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          contract="contracts/core1-s3-compiler-prelude.lisp"
          grep -F '(profile . core1)' "$contract"
          grep -F '(sid . 00100001)' "$contract"
          grep -F '(core1-result-domain . historical-t-nil)' "$contract"
          grep -F '(cml-hidden-not-primitive . forbidden)' "$contract"
          grep -F '(semantic-evaluator-fallback . forbidden)' "$contract"

          core1_blob="$(git hash-object lib/core1.lisp)"
          sid_map_blob="$(git hash-object contracts/core1-historical-sid-map.lisp)"
          prelude_blob="$(git hash-object lib/core1-compiler-prelude.lisp)"
          grep -F "(law-source-git-blob . \"$core1_blob\")" "$contract"
          grep -F "(identity-source-git-blob . \"$sid_map_blob\")" "$contract"
          grep -F "(prelude-git-blob . \"$prelude_blob\")" "$contract"
          printf 'Core1 source Git blob: %s\n' "$core1_blob"
          printf 'Core1 SID map Git blob: %s\n' "$sid_map_blob"
          printf 'Core1 S3 prelude Git blob: %s\n' "$prelude_blob"

          printf 'Core1 S3 prelude SHA-256: '
          sha256sum lib/core1-compiler-prelude.lisp | cut -d' ' -f1

          {
            printf '%s\n' '(C1-EVAL-PROGRAM-THEN'
            printf '%s\n' '  (QUOTE ('
            sed '/^[[:space:]]*;/d' lib/core1-compiler-prelude.lisp
            printf '%s\n' '  ))'
            printf '%s\n' '  (QUOTE (list (not (quote ())) (not (quote A)))))'
          } > .core1-s0/compiler-prelude-smoke.lisp

          cat lib/core1.lisp .core1-s0/compiler-prelude-smoke.lisp > .core1-s0/core1-prelude-full.lisp

          actual="$(
            cd .core1-s0/mccarthy-eval
            ./mccarthy-kernel ../core1-prelude-full.lisp
          )"

          printf '%s\n' "$actual"
          test "$actual" = '(T NIL)'

      - name: Fail closed when private Core1 evidence is unavailable
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          echo "::error::Private Core1 dependencies are intentionally unavailable to fork/untrusted pull requests."
          exit 1
