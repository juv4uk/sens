name: Incremental SENS T5 triple-view ratchet

on:
  workflow_dispatch:
    inputs:
      base_sha:
        description: Immutable Git baseline SHA (40 lowercase hex)
        required: true
        type: string

permissions:
  contents: read

jobs:
  physical-view-delta:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: ./.github/actions/install-zig
      - name: Build the existing native SENS/T5M mechanisms
        run: cargo build --locked -p sens-cli --bin sens --bin sens-trit --features benchmark-ast-visits
      - name: Verify changed physical-view triples through SENS, Zig, and cmp
        env:
          MANUAL_BASE: ${{ inputs.base_sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME:-}" == "pull_request" ]]; then
            # Use the current target tip, not the PR-creation snapshot in base.sha.
            # This is an immutable SHA for this run and excludes pre-existing T5 debt.
            git fetch --no-tags origin "$GITHUB_BASE_REF"
            BASE="$(git rev-parse FETCH_HEAD)"
          else
            BASE="$MANUAL_BASE"
          fi
          echo "T5 delta baseline: $BASE"
          if [[ ! "$BASE" =~ ^[0-9a-f]{40}$ ]]; then
            echo "BLOCK: missing immutable base SHA"; exit 2
          fi
          git cat-file -e "$BASE^{commit}"
          mapfile -t changed_paths < <(git diff --name-only "$BASE...$GITHUB_SHA")
          declare -A changed=()
          declare -A stems=()
          has_rev_file() { git cat-file -e "$1:$2" 2>/dev/null; }
          for path in "${changed_paths[@]}"; do
            changed["$path"]=1
          done
          for path in "${changed_paths[@]}"; do
            case "$path" in
              *.lisp) stem="${path%.lisp}" ;;
              *.sens) stem="${path%.sens}" ;;
              *)
                if has_rev_file "$BASE" "$path.lisp" || has_rev_file "$GITHUB_SHA" "$path.lisp" ||
                   has_rev_file "$BASE" "$path.sens" || has_rev_file "$GITHUB_SHA" "$path.sens"; then
                  stem="$path"
                else
                  continue
                fi
                ;;
            esac
            if has_rev_file "$BASE" "$stem.sens" || has_rev_file "$GITHUB_SHA" "$stem.sens" ||
               has_rev_file "$BASE" "$stem" || has_rev_file "$GITHUB_SHA" "$stem"; then
              stems["$stem"]=1
            fi
          done
          if (( ${#stems[@]} == 0 )); then
            echo "Зміни не зачіпають фізичних трійок SENS/T5M."
            exit 0
          fi
          for stem in "${!stems[@]}"; do
            source="$stem.lisp"
            physical="$stem.sens"
            view="$stem"
            present=0
            [[ -f "$source" && ! -L "$source" ]] && present=$((present+1))
            [[ -f "$physical" && ! -L "$physical" ]] && present=$((present+1))
            [[ -f "$view" && ! -L "$view" ]] && present=$((present+1))
            if (( present == 0 )); then
              for file in "$source" "$physical" "$view"; do
                has_rev_file "$BASE" "$file" || { echo "Видалення неповної трійки: $stem" >&2; exit 2; }
                [[ -n "${changed[$file]:-}" ]] || { echo "Змінено не всі файли видаленої трійки: $stem" >&2; exit 2; }
                if has_rev_file "$GITHUB_SHA" "$file"; then
                  echo "Файл трійки залишився після видалення: $file" >&2
                  exit 2
                fi
              done
              echo "Підтверджено: всі три файли видалено разом — $stem"
              continue
            fi
            if (( present != 3 )); then
              echo "Неповна фізична трійка: $stem" >&2
              exit 2
            fi
            bash scripts/check-triple-projection.sh --fixture "$source"
          done
