name: Core profile mechanism

on:
  pull_request:
    paths:
      - "crates/sens/src/environment.rs"
      - "crates/sens/src/lib.rs"
      - "crates/sens/tests/core_profile_runtime_1272.rs"
      - "lib/core2.lisp"
      - ".github/workflows/core2-runtime-profile.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-profile-mechanism:
    name: Selected-Core carrier mechanism
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Selected-Core carrier witness
        run: cargo test -p sens --test core_profile_runtime_1272

      - name: Mechanism evidence
        shell: bash
        run: |
          sha256sum crates/sens/src/environment.rs
          sha256sum crates/sens/src/lib.rs
          sha256sum crates/sens/tests/core_profile_runtime_1272.rs

      - name: Diff hygiene
        run: git diff --check
