name: Core2 runtime profile

on:
  pull_request:
    paths:
      - "crates/sens/src/environment.rs"
      - "crates/sens/src/eval/special_forms/core.rs"
      - "crates/sens/src/lib.rs"
      - "crates/sens/tests/core2_runtime_profile.rs"
      - "lib/core2.lisp"
      - "contracts/core2-profile-contract.lisp"
      - "contracts/core-profile-contract.lisp"
      - "tests/authority-inventory.lisp"
      - "tests/authority-inventory.tsv"
      - "tests/semantic-authority-reviews.lisp"
      - ".github/workflows/core2-runtime-profile.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core2-runtime:
    name: Native Contract-6 profile selection
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Core2 runtime witness
        run: cargo test -p sens --test core2_runtime_profile
      - name: Core2 authority digest evidence
        shell: bash
        run: |
          sha256sum crates/sens/src/environment.rs
          sha256sum crates/sens/src/eval/special_forms/core.rs
          sha256sum crates/sens/src/lib.rs
          sha256sum crates/sens/tests/core2_runtime_profile.rs
          grep 'core2-' tests/semantic-authority-reviews.lisp

      - name: Core2 Lisp-owned contract witness
        run: |
          cargo build -p sens-cli --bin sens
          got="$(./target/debug/sens scripts/check-core2-profile-contract.lisp)"
          printf '%s\n' "$got"
          test "$got" = "(core2-profile-contract-ok)"
      - name: Diff hygiene
        run: git diff --check
