name: D10 historical source manual review guard
on:
  workflow_dispatch:
jobs:
  history-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check 13 historical HOLDs, legacy reconciliation and negative cases
        run: python3 scripts/check_d10_historical_primary_reconcile.py --self-test
      - name: Verify no source edits from checker
        run: git diff --exit-code
