name: D10 historical source manual review guard
on:
  pull_request:
    paths:
      - 'knowledge/d10-historical-primary-manual-reconciliation-20261009.json'
      - 'knowledge/d1-d9-foundation.json'
      - 'knowledge/d10-v1-semantic-inventory.json'
      - 'knowledge/d9-overflow-review-v1.json'
      - 'scripts/check_d10_historical_primary_reconcile.py'
      - '.github/workflows/d10-historical-primary-reconcile.yml'
  workflow_dispatch:
jobs:
  history-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Check 13 historical HOLDs, legacy reconciliation and negative cases
        run: python3 scripts/check_d10_historical_primary_reconcile.py --self-test
      - name: Verify no source edits from checker
        run: git diff --exit-code
