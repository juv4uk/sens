name: Verify 425 full package

on:
  workflow_dispatch:
jobs:
  full-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: verify-425-full-package
      - name: Run complete SENS package
        run: cargo test -p sens
