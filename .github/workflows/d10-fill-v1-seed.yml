name: D10 fill v1 seed

on:
  pull_request:
    paths:
      - "knowledge/d10-selector-seed.json"
      - "knowledge/d10-v1-semantic-inventory.json"
      - "knowledge/d10-fill-v1-state.json"
      - "knowledge/d9-v1-semantic-inventory.json"
      - "knowledge/d1-d8-foundation.json"
      - "scripts/check-d10-fill-v1-seed.py"
      - ".github/workflows/d10-fill-v1-seed.yml"
  push:
    branches: [main]
    paths:
      - "knowledge/d10-selector-seed.json"
      - "knowledge/d10-v1-semantic-inventory.json"
      - "knowledge/d10-fill-v1-state.json"
      - "scripts/check-d10-fill-v1-seed.py"
      - ".github/workflows/d10-fill-v1-seed.yml"
  workflow_dispatch:

jobs:
  seed:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Verify D10 selector seed and authority boundary
        run: python3 scripts/check-d10-fill-v1-seed.py
