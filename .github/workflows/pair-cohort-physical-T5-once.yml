name: pair-cohort-physical-T5-once
on:
  push:
    branches: [migrate/4455-pair-core-20261008]
    paths:
      - 'tests/fixtures/migration-pair-cohort/*.lisp'
      - '.github/workflows/pair-cohort-physical-T5-once.yml'
permissions:
  contents: write
jobs:
  produce:
    if: github.repository == 'juv4uk/sens' && github.ref == 'refs/heads/migrate/4455-pair-core-20261008'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Create exact 14-byte T5 files using admitted three-pass migrator
        shell: bash
        run: |
          set -euo pipefail
          group=tests/fixtures/migration-pair-cohort
          test ! -e "$group/car-head.sens"
          test ! -e "$group/cdr-tail.sens"
          python3 scripts/migrate-three-pass.py "$group" \
            --out "$RUNNER_TEMP/sens-output" \
            --foundation knowledge/d1-d7-foundation.json \
            --domain-surfaces crates/sens/src/domain_surface_registry_generated.rs \
            --semantic-generated crates/sens/src/semantic_registry_generated.rs \
            --semantic-registry crates/sens/src/semantic_registry.rs \
            --necessary-forms crates/sens/src/eval/necessary_forms_generated.rs \
            --historical-map contracts/core1-historical-sid-map.lisp \
            --text7 crates/sens/src/text7_projection_generated.rs \
            --report "$RUNNER_TEMP/pair-migration-report.json"
          python3 - "$RUNNER_TEMP/sens-output" <<'PY'
          from pathlib import Path
          import sys
          root=Path(sys.argv[1])
          expected={
              "car-head.sens":"66386789638906896389633b2eb3",
              "cdr-tail.sens":"64896789638906896389633b2eb3",
          }
          assert sorted(p.name for p in root.iterdir()) == sorted(expected)
          for name,hex_value in expected.items():
              data=(root/name).read_bytes()
              assert len(data)==14 and data==bytes.fromhex(hex_value), (name,data.hex())
              print(f"PHYSICAL_T5=PASS {name} bytes={len(data)} hex={data.hex()}")
          PY
          cp --no-clobber "$RUNNER_TEMP/sens-output/car-head.sens" "$group/car-head.sens"
          cp --no-clobber "$RUNNER_TEMP/sens-output/cdr-tail.sens" "$group/cdr-tail.sens"
          git add -- "$group/car-head.sens" "$group/cdr-tail.sens"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'migrate(4455): publish both exact pair-selector T5 files'
          git push origin "HEAD:$GITHUB_REF"
