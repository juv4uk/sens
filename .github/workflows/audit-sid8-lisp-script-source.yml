name: Audited SID8 Lisp script source delta
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay-historic-blob:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Audit all source bytes against owner-ratified D1-D9 mapping
        run: python3 -m unittest discover -s tests -p test_sid8_two_script_source_delta.py -v
