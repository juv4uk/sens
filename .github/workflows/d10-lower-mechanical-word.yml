name: D10 lower mechanical binary word oracle
on:
  workflow_dispatch:
jobs:
  exact-mathematical-word:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Research provenance, immutable status and negative controls
        run: python3 scripts/check_d10_lower_mechanical_word.py --self-test
      - name: Exact rational bounded mechanical words
        run: python3 -m unittest discover -s tests -p test_d10_lower_mechanical_word.py -v
      - name: Install independent Chez Scheme R6RS
        run: |
          sudo apt-get update
          sudo apt-get install -y chezscheme
      - name: Execute actual independent R6RS oracle
        run: scheme --script tests/d10_lower_mechanical_word_chez.ss
