name: SID8 thirty-seven duplicate ATOM source proofs

on:
  push:
    branches: [main]
    paths:
      - scripts/build-inventory.lisp
      - scripts/build-dependency-classification.lisp
      - scripts/generate-function-table.lisp
      - scripts/generate-uk-surface-audit.lisp
      - scripts/symbol-table.lisp
      - tests/test_sid8_d3_atom_37_bulk_source.py
      - .github/workflows/sid8-d3-atom-37-bulk.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  immutable-source-and-d3:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify 37 structural rewrites and negative examples
        run: python3 -m unittest discover -s tests -p test_sid8_d3_atom_37_bulk_source.py -v
