name: Generative domain forecast research

on:
  workflow_dispatch:

jobs:
  selector-forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Run Contract 11.6 selector boundary witness
        run: |
          rm -rf /tmp/generative-domain-forecast
          python3 scripts/research-2322-generative-domain-forecast.py \
            --min-width 3 \
            --max-width 8 \
            --out /tmp/generative-domain-forecast

      - name: Publish report
        if: always()
        run: |
          if test -f /tmp/generative-domain-forecast/report.md; then
            cat /tmp/generative-domain-forecast/report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: generative-domain-forecast
          path: /tmp/generative-domain-forecast/
          retention-days: 14
