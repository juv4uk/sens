name: Reality Matrix WebAssembly smoke

on:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  wasm-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Run D3 WebAssembly reality smoke
        run: |
          echo "FOREIGN_LANGUAGE_TEST_OR_BENCH=EXCLUDED_BY_POLICY native_equivalent=NOT_VERIFIED"

      - name: Revalidate machine-readable output
        run: |
          echo "FOREIGN_LANGUAGE_TEST_OR_BENCH=EXCLUDED_BY_POLICY native_equivalent=NOT_VERIFIED"
          test -s "$RUNNER_TEMP/reality-wasm/raw/runs.tsv"
          test -s "$RUNNER_TEMP/reality-wasm/report.md"

      - name: Upload smoke evidence
        uses: actions/upload-artifact@v4
        with:
          name: reality-matrix-wasm-smoke
          path: |
            ${{ runner.temp }}/reality-wasm/comparison.json
            ${{ runner.temp }}/reality-wasm/environment.json
            ${{ runner.temp }}/reality-wasm/raw/runs.tsv
            ${{ runner.temp }}/reality-wasm/report.md
