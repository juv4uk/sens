name: C5 Swarm Removal Gate

on:
  workflow_dispatch:
jobs:
  c5-removal-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/install-zig
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Machine-readable migration and fail-closed audit
        run: cargo test -p sens --test swarm_deprecation
      - name: Executable retired caller inventory
        run: cargo test -p sens --test swarm_live_caller_inventory
      - name: Retired coordination ops are unknown on :9999
        run: cargo test -p sens-cli --test legacy_coordination_rejected
