name: C5 Swarm Removal Gate

on:
  push:
    paths:
      - "AGENTS.md"
      - "docs/swarm-*.md"
      - "knowledge/swarm-*.lisp"
      - "crates/sens-cli/src/swarm.rs"
      - "crates/sens-cli/tests/**"
      - "crates/sens/tests/swarm_*.rs"
      - ".github/workflows/c5-swarm-removal-gate.yml"
  pull_request:
    paths:
      - "AGENTS.md"
      - "docs/swarm-*.md"
      - "knowledge/swarm-*.lisp"
      - "crates/sens-cli/src/swarm.rs"
      - "crates/sens-cli/tests/**"
      - "crates/sens/tests/swarm_*.rs"
      - ".github/workflows/c5-swarm-removal-gate.yml"

jobs:
  c5-removal-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Machine-readable migration and fail-closed audit
        run: cargo test -p sens --test swarm_deprecation
      - name: Executable retired caller inventory
        run: cargo test -p sens --test swarm_live_caller_inventory
      - name: Retired coordination ops are unknown on :9999
        run: cargo test -p sens-cli --test legacy_coordination_rejected
      - name: Semantic oracle preservation shield
        run: cargo test -p sens-cli --test semantic_oracle_preservation
