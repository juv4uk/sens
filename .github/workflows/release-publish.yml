name: Release Publish

on:
  workflow_call:

permissions:
  contents: write

jobs:
  publish:
    name: Публікувати лише після всіх успішних перевірок
    runs-on: ubuntu-latest
    permissions:
      contents: write
      checks: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Перевірити тег, точне джерело та явне рішення власника
        shell: bash
        env:
          RELEASE_GO_SHA: ${{ vars.SENS_RELEASE_GO_SHA }}
          RELEASE_GO_TAG: ${{ vars.SENS_RELEASE_GO_TAG }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_TYPE" = "tag"
          VERSION="$(sed -n '/^\[package\]/,/^\[/s/^version = "\([^"]*\)".*/\1/p' crates/sens-cli/Cargo.toml | head -n 1)"
          test -n "$VERSION"
          test "$GITHUB_REF_NAME" = "s$VERSION"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch --no-tags --depth=1 origin main
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA" || {
            echo "RELEASE_BLOCKED: тег не вказує на поточний main" >&2
            exit 1
          }
          test -n "$RELEASE_GO_SHA"
          test -n "$RELEASE_GO_TAG"
          test "$RELEASE_GO_SHA" = "$GITHUB_SHA"
          test "$RELEASE_GO_TAG" = "$GITHUB_REF_NAME"

      - name: Обов'язкові exact-SHA перевірки — відхиляти відсутні, старі та червоні
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          required_checks=(
            "Охоронець · Rust · Zig · SENS"
            "focused release smoke before publish"
            "focused release preflight"
            "sens-cli · ubuntu-latest"
            "sens-cli · windows-latest"
            "sens-cli · macos-15-intel"
            "sens-cli · macos-14"
            "sens-cli · Windows MSI installer"
          )
          check_runs="$(gh api --paginate --slurp \
            -H 'Accept: application/vnd.github+json' \
            --jq '.[].check_runs[] | [.id, .name, .head_sha, .status, (.conclusion // ""), (.app.slug // ""), (.details_url // "")] | @tsv' \
            "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs?per_page=100")"
          for required in "${required_checks[@]}"; do
            selected_id=0
            selected_sha=""
            selected_status=""
            selected_conclusion=""
            selected_app=""
            selected_url=""
              while IFS=$'\t' read -r id check_name check_sha check_status check_conclusion check_app check_url; do
              if [[ "$check_name" == "$required" && "$id" =~ ^[1-9][0-9]*$ ]] && (( id > selected_id )); then
                selected_id="$id"
                selected_sha="$check_sha"
                selected_status="$check_status"
                selected_conclusion="$check_conclusion"
                selected_app="$check_app"
                selected_url="$check_url"
              fi
            done <<< "$check_runs"
            if [[ "$selected_id" == 0 ]]; then
              echo "RELEASE_BLOCKED: немає обов'язкової перевірки '$required' на точному SHA" >&2
              exit 1
            fi
            [[ "$selected_sha" == "$GITHUB_SHA" ]] || { echo "RELEASE_BLOCKED: SHA mismatch для '$required'" >&2; exit 1; }
            [[ "$selected_status" == "completed" && "$selected_conclusion" == "success" ]] || {
              echo "RELEASE_BLOCKED: '$required' не завершено успішно ($selected_status/$selected_conclusion)" >&2
              exit 1
            }
            [[ "$selected_app" == "github-actions" ]] || { echo "RELEASE_BLOCKED: недовірений постачальник '$required'" >&2; exit 1; }
            prefix="https://github.com/${GITHUB_REPOSITORY}/actions/runs/"
            case "$selected_url" in
              "$prefix"*) suffix="${selected_url#"$prefix"}" ;;
              *) echo "RELEASE_BLOCKED: недовірене посилання '$required'" >&2; exit 1 ;;
            esac
            [[ "$suffix" =~ ^[1-9][0-9]*(/job/[1-9][0-9]*)?/?$ ]] || {
              echo "RELEASE_BLOCKED: некоректне посилання '$required'" >&2
              exit 1
            }
          done
          echo "RELEASE_EXACT_SHA_CHECKS=PASS count=${#required_checks[@]} sha=$GITHUB_SHA"

      - name: Завантажити всі зібрані release-артефакти
        uses: actions/download-artifact@634f93cb2916e3fdff31fdaf6667de0da12316ab # v5
        with:
          path: dist
          merge-multiple: true

      - name: Перевірити точний комплект релізних артефактів
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#s}"
          expected="$RUNNER_TEMP/release-expected"
          actual="$RUNNER_TEMP/release-actual"
          printf '%s\n' \
            "sens-cli_${version}_linux_amd64" \
            "sens-cli_${version}_linux_amd64.sha256" \
            "sens-cli_${version}_windows_x64.exe" \
            "sens-cli_${version}_windows_x64.exe.sha256" \
            "sens-cli_${version}_windows_x64.msi" \
            "sens-cli_${version}_macos_x64" \
            "sens-cli_${version}_macos_x64.sha256" \
            "sens-cli_${version}_macos_arm64" \
            "sens-cli_${version}_macos_arm64.sha256" | LC_ALL=C sort > "$expected"
          find dist -mindepth 1 -maxdepth 1 -printf '%f\n' | LC_ALL=C sort > "$actual"
          cmp -- "$expected" "$actual"
          while IFS= read -r name; do
            test -f "dist/$name" && test ! -L "dist/$name" && test -s "dist/$name"
          done < "$expected"

      - name: Створити чернетку, завантажити її й порівняти байти через cmp
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_GO_SHA: ${{ vars.SENS_RELEASE_GO_SHA }}
          RELEASE_GO_TAG: ${{ vars.SENS_RELEASE_GO_TAG }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "RELEASE_BLOCKED: запис релізу вже існує; перезапис заборонено" >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" dist/* --draft --verify-tag \
            --title "SENS $GITHUB_REF_NAME · Contract 12.0" \
            --notes "SENS Contract 12.0. Джерело — точний commit $GITHUB_SHA; межі релізу описані в RELEASE.md."
          replay="$RUNNER_TEMP/release-replay"
          mkdir -p "$replay"
          gh release download "$GITHUB_REF_NAME" --dir "$replay"
          (cd dist && find . -type f -print | LC_ALL=C sort) > "$RUNNER_TEMP/staged-files"
          (cd "$replay" && find . -type f -print | LC_ALL=C sort) > "$RUNNER_TEMP/replayed-files"
          cmp -- "$RUNNER_TEMP/staged-files" "$RUNNER_TEMP/replayed-files"
          while IFS= read -r file; do
            cmp -- "dist/${file#./}" "$replay/${file#./}"
          done < "$RUNNER_TEMP/staged-files"
          git fetch --no-tags --depth=1 origin main
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA" || {
            echo "RELEASE_BLOCKED: main змінився під час перевірки артефактів" >&2
            exit 1
          }
          test "$RELEASE_GO_SHA" = "$GITHUB_SHA"
          test "$RELEASE_GO_TAG" = "$GITHUB_REF_NAME"
          gh release edit "$GITHUB_REF_NAME" --draft=false
