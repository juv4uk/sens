name: Triple-projection read-only safety gate

on:
  pull_request:
    paths:
      - "scripts/check-triple-projection.sh"
      - "scripts/sens_uk.py"
      - "tests/test_triple_projection_script_safety.py"
      - ".github/workflows/triple-projection-script-safety.yml"
      - "scripts/verify_uk_t5_triplet.py"
      - "tests/fixtures/migration-d1-cond-cohort/**"
  push:
    branches: [main]
    paths:
      - "scripts/check-triple-projection.sh"
      - "scripts/sens_uk.py"
      - "tests/test_triple_projection_script_safety.py"
      - ".github/workflows/triple-projection-script-safety.yml"
      - "scripts/verify_uk_t5_triplet.py"
      - "tests/fixtures/migration-d1-cond-cohort/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  read-only-uk-triplet-no-clobber:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prove real committed parity and negative clobber protections
        run: python3 -m unittest discover -s tests -p 'test_triple_projection_script_safety.py' -v
      - name: Positive bounded canonical Ukrainian triplet MUST pass
        run: |
          bash scripts/check-triple-projection.sh \
            --fixture tests/fixtures/migration-d1-cond-cohort/branch.lisp
      - name: Legacy/D4/multiform fixtures MUST remain explicit BLOCKS
        shell: bash
        run: |
          set -euo pipefail
          fixtures=(
            tests/fixtures/core1-third-domain-canary/third.lisp
            tests/fixtures/migration-d4-selector-cohort/caar.lisp
            tests/fixtures/migration-multiform-cohort/two-forms.lisp
          )
          for fixture in "${fixtures[@]}"; do
            set +e
            output="$(bash scripts/check-triple-projection.sh --fixture "$fixture" 2>&1)"
            status=$?
            set -e
            printf '%s\n' "$output"
            test "$status" -eq 2
            grep -q "BLOCKED" <<<"$output"
          done
          printf '%s\n' 'Scope: certified bounded D1/D3 triple is the shared default; legacy/D4/multiform cohorts remain explicit BLOCKs.' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' 'No physical/uk release admission or historical executable conversion from this check.' >> "$GITHUB_STEP_SUMMARY"
      - name: Prove no source or output was rewritten
        shell: bash
        run: |
          test -z "$(git status --porcelain --untracked-files=all)" || {
            git status --short
            exit 1
          }