name: Triple-projection read-only safety gate

on:
  pull_request:
    paths:
      - "scripts/check-triple-projection.sh"
      - "scripts/sens_uk.py"
      - "tests/test_triple_projection_script_safety.py"
      - ".github/workflows/triple-projection-script-safety.yml"
      - "scripts/verify_uk_t5_triplet.py"
      - "tests/fixtures/migration-d1-cond-cohort/**"
  push:
    branches: [main]
    paths:
      - "scripts/check-triple-projection.sh"
      - "scripts/sens_uk.py"
      - "tests/test_triple_projection_script_safety.py"
      - ".github/workflows/triple-projection-script-safety.yml"
      - "scripts/verify_uk_t5_triplet.py"
      - "tests/fixtures/migration-d1-cond-cohort/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  read-only-uk-triplet-no-clobber:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prove real committed parity and negative clobber protections
        run: python3 -m unittest discover -s tests -p 'test_triple_projection_script_safety.py' -v
      - name: Positive bounded canonical Ukrainian triplet MUST pass
        run: |
          bash scripts/check-triple-projection.sh \
            --fixture tests/fixtures/migration-d1-cond-cohort/branch.lisp
      - name: Explicit legacy fixture remains fail-closed
        shell: bash
        run: |
          set -euo pipefail
          set +e
          bash scripts/check-triple-projection.sh             --fixture tests/fixtures/migration-d4-selector-cohort/caar.lisp             > "$RUNNER_TEMP/legacy-triple.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/legacy-triple.log"
          test "$status" -eq 2
          grep -q "caar.lisp" "$RUNNER_TEMP/legacy-triple.log"
          grep -q "BLOCKED" "$RUNNER_TEMP/legacy-triple.log"
          printf '%s\n' 'Scope: admitted cohort blocks by default; explicit unadmitted fixtures remain fail-closed.' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' 'Full migration debt is reported separately by sens_inventory.py and is not release admission.' >> "$GITHUB_STEP_SUMMARY"
      - name: Prove no source or output was rewritten
        shell: bash
        run: |
          test -z "$(git status --porcelain --untracked-files=all)" || {
            git status --short
            exit 1
          }
