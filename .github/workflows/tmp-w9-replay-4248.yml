name: TEMP W9 current-main replay

on:
  push:
    branches:
      - replay/4038-w9-current-main
    paths:
      - ".github/workflows/tmp-w9-replay-4248.yml"

permissions:
  contents: write

jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: replay/4038-w9-current-main
          fetch-depth: 0

      - name: Merge existing W9 mechanism donor with bounded conflict resolution
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin w9-runtime-carrier-4038
          if git merge --no-ff --no-edit origin/w9-runtime-carrier-4038; then
            :
          else
            conflicts="$(git diff --name-only --diff-filter=U | sort)"
            expected="$(printf '%s\n' CURRENT.md crates/sens/src/domain_identity.rs | sort)"
            test "$conflicts" = "$expected"
            git checkout --ours CURRENT.md
            git checkout --theirs crates/sens/src/domain_identity.rs
            python3 -c 'from pathlib import Path; p=Path("crates/sens/src/domain_identity.rs"); s=p.read_text(); old="            Self::D5(value) => Some(CoreDomainIdentity::D5(value)),\n            Self::D9(_) => None,\n            Self::D1(_) | Self::D2(_) | Self::D6(_) | Self::D7(_) | Self::D8(_) => None,\n"; new="            Self::D5(value) => Some(CoreDomainIdentity::D5(value)),\n            Self::D6(value)\n                if matches!(value.word().packed_bits(), 0b001110 | 0b001111) =>\n            {\n                Some(CoreDomainIdentity::D6(value))\n            }\n            Self::D9(_) => None,\n            Self::D1(_) | Self::D2(_) | Self::D6(_) | Self::D7(_) | Self::D8(_) => None,\n"; assert old in s, "expected donor core_operation slice not found"; p.write_text(s.replace(old,new,1))'
            git add CURRENT.md crates/sens/src/domain_identity.rs
            test -z "$(git diff --name-only --diff-filter=U)"
            git commit --no-edit
          fi

      - name: Remove temporary replay workflow
        run: |
          set -euxo pipefail
          git rm .github/workflows/tmp-w9-replay-4248.yml
          git commit -m "chore: remove temporary W9 replay workflow"
          git push origin HEAD:replay/4038-w9-current-main
