name: Foundation compatibility benchmarks

on:
  pull_request:
    paths:
      - "benchmarks/foundation-compatibility/**"
      - ".github/workflows/foundation-compatibility-bench.yml"
  push:
    branches: [main]
    paths:
      - "benchmarks/foundation-compatibility/**"
      - ".github/workflows/foundation-compatibility-bench.yml"
  workflow_dispatch:

concurrency:
  group: sens-foundation-compatibility-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  foundation-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - name: Install benchmark tools
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind gcc
          gcc --version | head -1
          valgrind --version

      - name: Run compatibility reconstruction matrix
        run: |
          rm -rf /tmp/sens-foundation-compatibility
          python3 benchmarks/foundation-compatibility/run.py \
            --out-dir /tmp/sens-foundation-compatibility \
            --calls 10000 \
            --reps 1

      - name: Publish benchmark summary
        if: always()
        run: |
          {
            echo '## Foundation compatibility / incidence reconstruction'
            echo
            echo 'Research-only evidence. UNKNOWN is never coerced to DIFFERENT.'
            echo
            if test -f /tmp/sens-foundation-compatibility/logical.tsv; then
              echo '### Logical / information matrix'
              echo '~~~text'
              cat /tmp/sens-foundation-compatibility/logical.tsv
              echo '~~~'
            fi
            if test -f /tmp/sens-foundation-compatibility/irefs.tsv; then
              echo '### Cachegrind mechanism matrix'
              echo '~~~text'
              cat /tmp/sens-foundation-compatibility/irefs.tsv
              echo '~~~'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: sens-foundation-compatibility
          path: /tmp/sens-foundation-compatibility
          retention-days: 7