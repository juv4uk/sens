name: regenerate Core4 FASL after nucleus fix once
on:
  push:
    branches:
      - replay/4604-compiler-current-main-1008
    paths:
      - "lib/compiler-nucleus.lisp"
      - "lib/core4.lisp"
      - "crates/sens-cli/src/bin/gen-fasl.rs"
      - ".github/workflows/regen-core4-fasl-after-nucleus-once.yml"
permissions:
  contents: write
jobs:
  regen:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: replay/4604-compiler-current-main-1008
      - uses: dtolnay/rust-toolchain@stable
      - name: Generate current Core4 FASL through exact reader
        run: cargo run --release --locked -p sens-cli --bin gen-fasl -- lib/core4.lisp lib/core4.lisp.fasl
      - name: Verify and commit snapshot only
        run: |
          set -euo pipefail
          git diff --check
          cargo test -p sens --test core_fasl_freshness -- --nocapture
          if git diff --quiet -- lib/core4.lisp.fasl; then
            echo "Core4 FASL unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/core4.lisp.fasl
          git commit -m "chore(4604): regenerate Core4 FASL after compiler nucleus repair"
          git push origin HEAD:replay/4604-compiler-current-main-1008
