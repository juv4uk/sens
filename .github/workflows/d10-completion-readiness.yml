name: D10 evidence supply and 1024 readiness
on:
  push:
    branches: [main]
    paths:
      - 'knowledge/d10-v2-semantic-inventory.json'
      - 'knowledge/d10-v3-semantic-inventory.json'
      - 'knowledge/d10-v4-semantic-inventory.json'
      - 'knowledge/d10-v5-semantic-inventory.json'
      - 'knowledge/d10-v6-semantic-inventory.json'
      - 'knowledge/d10-v6-historical-clos-selection-20261011.json'
      - 'knowledge/d10-v7-semantic-inventory.json'
      - 'knowledge/d10-v8-semantic-inventory.json'
      - 'knowledge/d10-v9-semantic-inventory.json'
      - 'knowledge/d10-v10-semantic-inventory.json'
      - 'knowledge/d10-v11-semantic-inventory.json'
      - 'knowledge/d10-historical-law-intake-v11-20261011.json'
      - 'knowledge/d10-p0-research-intake-v10-20261011.json'
      - 'knowledge/d10-source-snapshots/d10-v9-unified-catalog-1809.tsv'
      - 'knowledge/d10-source-reviewed-v9-batch-20261011.json'
      - 'knowledge/d10-source-snapshots/d10-v9-f1-rejected-992fe91211b57965.tsv'
      - 'knowledge/d10-mop-database-v8-selection-20261011.json'
      - 'knowledge/d10-candidate-database-v1.json'
      - 'knowledge/d10-historical-lisp-streams-selected-v7-20261011.json'
      - 'knowledge/d10-provisional-candidate-coordinate-queue-v1.json'
      - 'knowledge/d10-historical-candidate-coordinate-queue-v1.json'
      - 'knowledge/d10-crossrepo-linguistic-v1.json'
      - 'knowledge/d10-clos-slot-state-historical-review-v1.json'
      - 'knowledge/d10-clos-instance-lifecycle-residual-v1.json'
      - 'knowledge/d10-flavors-restarts-research-v1.json'
      - 'knowledge/d10-time-law-review-v2.json'
      - 'knowledge/d10-current-inventory.json'
      - 'knowledge/d10-selected-coordinate-allocation-v1.json'
      - 'scripts/check_d10_v2_current_placement.py'
      - 'scripts/check_d10_v3_archived_candidates.py'
      - 'scripts/check_d10_v4_research_candidates.py'
      - 'scripts/check_d10_v5_research_candidates.py'
      - 'scripts/check_d10_v6_historical_clos.py'
      - 'scripts/check_d10_v7_historical_lisp_streams.py'
      - 'scripts/check_d10_v8_mop_database.py'
      - 'scripts/check_d10_v9_source_reviewed_batch.py'
      - 'scripts/check_d10_v10_p0_intake.py'
      - 'scripts/check_d10_v11_historical_law.py'
      - 'scripts/check_d10_candidate_database.py'
      - 'scripts/check_d10_candidate_coordinate_queue.py'
      - 'scripts/check_d10_historical_candidate_queue.py'
      - 'tests/test_d10_v2_current_placement.py'
      - 'tests/test_d10_v3_archived_candidates.py'
      - 'tests/test_d10_v4_research_candidates.py'
      - 'tests/test_d10_completion_readiness.py'
      - 'scripts/check_d10_completion_readiness.py'
      - '.github/workflows/d10-completion-readiness.yml'
  pull_request:
    paths:
      - 'scripts/check_d10_completion_readiness.py'
      - 'scripts/check_d10_v2_current_placement.py'
      - 'tests/test_d10_completion_readiness.py'
      - 'tests/test_d10_v2_current_placement.py'
      - 'knowledge/d10-*.json'
      - 'knowledge/d10-current-inventory.json'
      - 'knowledge/d10-proposal-ledger.tsv'
      - '.github/workflows/d10-completion-readiness.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence-supply:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Перевірити негативні контрприклади й дедуп
        run: python3 -m unittest discover -s tests -p test_d10_completion_readiness.py -v
      - name: Доказово перевірити всі 419 canonical v2 координат і 8 негативних мутацій
        run: |
          python3 scripts/check_d10_v2_current_placement.py --self-test
          python3 -m unittest discover -s tests -p test_d10_v2_current_placement.py -v
      - name: Перевірити 23 відібраних із архіву кандидатів v3, донорні SHA й негативні тести
        run: |
          python3 scripts/check_d10_v3_archived_candidates.py --self-test
          python3 -m unittest discover -s tests -p test_d10_v3_archived_candidates.py -v
      - name: Перевірити 9 нових доказових кандидатів v4 та 8 негативних мутацій
        run: |
          python3 scripts/check_d10_v4_research_candidates.py --self-test
          python3 -m unittest discover -s tests -p test_d10_v4_research_candidates.py -v
      - name: Перевірити 8 нових D10 v5 семантик і 96 резервів кандидатів
        run: |
          python3 scripts/check_d10_v5_research_candidates.py
          python3 scripts/check_d10_candidate_coordinate_queue.py
          python3 scripts/check_d10_historical_candidate_queue.py
      - name: Verify historical CLOS v6 archive including falsification tests
        run: python3 scripts/check_d10_v6_historical_clos.py --self-test
      - name: Reconcile unified candidate catalog and six negative tests
        run: python3 scripts/check_d10_candidate_database.py --self-test
      - name: Verify two historical Lisp stream laws in v7
        run: python3 scripts/check_d10_v7_historical_lisp_streams.py
      - name: Verify four MOP database selections in v8, including negative mutants
        run: |
          python3 scripts/check_d10_v8_mop_database.py --self-test
          python3 -O scripts/check_d10_v8_mop_database.py --self-test
      - name: Verify source-pinned 34-law D10 v9 F1-only research intake
        run: |
          python3 scripts/check_d10_v9_source_reviewed_batch.py --self-test
          python3 -O scripts/check_d10_v9_source_reviewed_batch.py --self-test
      - name: Verify D10 v10 +40 preliminary research laws without forged F2 F3 or coordinates
        run: |
          python3 scripts/check_d10_v10_p0_intake.py --self-test
          python3 -O scripts/check_d10_v10_p0_intake.py --self-test
      - name: Verify 24 v11 research laws and falsification without F2/F3 authority
        run: |
          python3 scripts/check_d10_v11_historical_law.py --self-test
          python3 -O scripts/check_d10_v11_historical_law.py --self-test
      - name: Порахувати реальний запас D10
        run: |
          python3 scripts/check_d10_completion_readiness.py >"$RUNNER_TEMP/d10-readiness.json"
          python3 - "$RUNNER_TEMP/d10-readiness.json" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1],encoding='utf-8'))
          print("D10 READINESS",x["selected"],"/",x["capacity"],"remaining",x["remaining"])
          print("D10 SOURCES",x["source_queue"]["distinct_source_names_unselected"])
          print("D11 GATE","READY" if x["ready_to_start_d11"] else "BLOCKED")
          print("D10 ERRORS",x["blocking_errors"])
          print("D10 QUEUE", ",".join(y["semantic_name"] for y in x["source_queue"]["queue"]))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: d10-unselected-source-evidence
          path: ${{ runner.temp }}/d10-readiness.json
