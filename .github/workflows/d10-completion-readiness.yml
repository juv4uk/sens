name: D10 evidence supply and 1024 readiness
on:
  push:
    branches: [main]
    paths:
      - 'knowledge/d10-v2-semantic-inventory.json'
      - 'knowledge/d10-current-inventory.json'
      - 'knowledge/d10-selected-coordinate-allocation-v1.json'
      - 'scripts/check_d10_v2_current_placement.py'
      - 'tests/test_d10_v2_current_placement.py'
      - 'scripts/check_d10_completion_readiness.py'
      - '.github/workflows/d10-completion-readiness.yml'
  pull_request:
    paths:
      - 'scripts/check_d10_completion_readiness.py'
      - 'scripts/check_d10_v2_current_placement.py'
      - 'tests/test_d10_completion_readiness.py'
      - 'tests/test_d10_v2_current_placement.py'
      - 'knowledge/d10-*.json'
      - 'knowledge/d10-current-inventory.json'
      - 'knowledge/d10-proposal-ledger.tsv'
      - '.github/workflows/d10-completion-readiness.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence-supply:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Перевірити негативні контрприклади й дедуп
        run: python3 -m unittest discover -s tests -p test_d10_completion_readiness.py -v
      - name: Доказово перевірити всі 419 canonical v2 координат і 8 негативних мутацій
        run: |
          python3 scripts/check_d10_v2_current_placement.py --self-test
          python3 -m unittest discover -s tests -p test_d10_v2_current_placement.py -v
      - name: Порахувати реальний запас D10
        run: |
          python3 scripts/check_d10_completion_readiness.py >"$RUNNER_TEMP/d10-readiness.json"
          python3 - "$RUNNER_TEMP/d10-readiness.json" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1],encoding='utf-8'))
          print("D10 READINESS",x["selected"],"/",x["capacity"],"remaining",x["remaining"])
          print("D10 SOURCES",x["source_queue"]["distinct_source_names_unselected"])
          print("D11 GATE","READY" if x["ready_to_start_d11"] else "BLOCKED")
          print("D10 ERRORS",x["blocking_errors"])
          print("D10 QUEUE", ",".join(y["semantic_name"] for y in x["source_queue"]["queue"]))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: d10-unselected-source-evidence
          path: ${{ runner.temp }}/d10-readiness.json
