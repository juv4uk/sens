name: D10 existing issue 4991 exact arc consistency

on:
  pull_request:
    paths:
      - knowledge/d10-ai-interest-proposal-v1.json
      - tests/test_d10_arc_consistency_4991.py
      - tests/oracles/d10_arc_consistency_4991.pl
      - .github/workflows/d10-4991-arc-consistency.yml
      - knowledge/d10-proposal-ledger.tsv
      - knowledge/d10-v1-semantic-inventory.json
      - knowledge/d10-selection-transition-history.json
  push:
    branches: [main]
    paths:
      - knowledge/d10-ai-interest-proposal-v1.json
      - tests/test_d10_arc_consistency_4991.py
      - tests/oracles/d10_arc_consistency_4991.pl
      - .github/workflows/d10-4991-arc-consistency.yml

permissions:
  contents: read

jobs:
  exact-finite-csp:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: 20,480 exhaustive Python queue-vs-round fixedpoint witnesses
        run: python3 tests/test_d10_arc_consistency_4991.py
      - name: Install native SWI-Prolog
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq swi-prolog-nox
      - name: Independent native SWI-Prolog 4,096 CSP families
        run: swipl -q -s tests/oracles/d10_arc_consistency_4991.pl
      - name: Current D10 proposal ledger gate
        run: python3 scripts/check-d10-proposal-ledger.py
      - name: Current D10 append-only SHA chain
        run: python3 scripts/check_d10_selection_transition_history.py --self-test
