name: Foundation ladder benchmark

on:
  pull_request:
    paths:
      - "benchmarks/foundation-ladder/**"
      - ".github/workflows/foundation-ladder-bench.yml"
      - "manifest.scm"
      - "channels.scm"
  workflow_dispatch:

jobs:
  hosted-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Cachegrind
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind
          rustc --version
          valgrind --version

      - name: Run semantic parity and secondary hosted benchmark
        env:
          FOUNDATION_BENCH_ENV: hosted-native-smoke
        run: |
          rm -rf /tmp/sens-foundation-ladder
          bash benchmarks/foundation-ladder/run.sh /tmp/sens-foundation-ladder

      - name: Verify pinned primary evidence is versioned
        run: |
          test -s benchmarks/foundation-ladder/evidence/pinned-guix-i5-6400-f954fb9.tsv
          test -s benchmarks/foundation-ladder/evidence/pinned-guix-i5-6400-f954fb9.md
          sha256sum benchmarks/foundation-ladder/foundation_ladder.rs

      - name: Publish hosted smoke summary
        if: always()
        run: |
          if test -f /tmp/sens-foundation-ladder/report.md; then
            {
              echo "> Secondary hosted-native smoke. Primary pinned-Guix evidence is versioned under benchmarks/foundation-ladder/evidence/."
              echo
              cat /tmp/sens-foundation-ladder/report.md
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload hosted smoke evidence
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: foundation-ladder-hosted-smoke
          path: /tmp/sens-foundation-ladder/
          retention-days: 7
