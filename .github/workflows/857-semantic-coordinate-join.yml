name: #857 semantic coordinate join witness

on:
  workflow_dispatch:
jobs:
  semantic-coordinate-join:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Prove bounded SIDs join three orthogonal evidence axes
        run: |
          cargo test -p sens --test semantic_coordinate_join -- --nocapture
          cargo test -p sens --test semantic_coordinate_join_2 -- --nocapture
