name: Core1 historical SID map

on:
  pull_request:
    paths:
      - "contracts/core1-historical-sid-map.lisp"
      - "lib/surface/semantic-registry.lisp"
      - ".github/workflows/core1-historical-sid-map.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sid-to-historical-mechanism:
    name: SID authority maps one-way to 1960s mechanisms
    runs-on: [self-hosted, guix]
    steps:
      - name: Checkout sens authority
        uses: actions/checkout@v5

      - name: Verify local Core1 historical inputs before private checkout
        shell: bash
        run: |
          set -euo pipefail
          test -f contracts/core1-historical-sid-map.lisp
          test -f lib/surface/semantic-registry.lisp
          git diff --check

      - name: Checkout pinned historical mechanism repository
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        uses: actions/checkout@v5
        with:
          repository: juv4uk/mccarthy-eval
          ssh-key: ${{ secrets.MCCARTHY_EVAL_SSH_KEY }}
          persist-credentials: false
          ref: 1ae9745b66a1439c1929b0d9038c680567118a58
          path: .core1-historical/mccarthy-eval

      - name: Verify one-way SID mapping
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          map=contracts/core1-historical-sid-map.lisp
          registry=lib/surface/semantic-registry.lisp
          hist=.core1-historical/mccarthy-eval

          test -f "$map"
          grep -F '(historical-mechanism-pin . "1ae9745b66a1439c1929b0d9038c680567118a58")' "$map"
          grep -F '(sid-selects-identity . yes)' "$map"
          grep -F '(profile-selects-law . core1)' "$map"
          grep -F '(core1-result-domain . historical-t-nil)' "$map"
          grep -F '(core4-result-records-in-core1 . forbidden)' "$map"

          if grep -E -q 'result-projection|control-projection|sid-selects-meaning' "$map"; then
            echo "Core1 SID map contains pre-correction Core4/general-law coupling" >&2
            exit 1
          fi
          test "$(git -C "$hist" rev-parse HEAD)" = "1ae9745b66a1439c1929b0d9038c680567118a58"

          rows="$(grep '^    (row ' "$map")"
          test -n "$rows"

          duplicates="$(
            printf '%s\n' "$rows" |
              sed -E 's/^[[:space:]]*\(row[[:space:]]+([^[:space:]]+).*/\1/' |
              sort | uniq -d
          )"
          test -z "$duplicates"

          while read -r raw; do
            row="$(printf '%s\n' "$raw" | tr -d '()')"
            read -r tag sid current historical source fit status <<<"$row"
            test "$tag" = "row"

            registry_row="$(grep -F "  ($sid " "$registry" || true)"
            test -n "$registry_row"

            if [[ "$current" != "empty-list" ]]; then
              printf '%s\n' "$registry_row" | grep -F -- "$current" >/dev/null
            fi

            if ! grep -R -F -q -- "$historical"               "$hist/docs/HISTORICAL-FUNCTION-LEDGER.md"               "$hist/docs/S0-SEED-CONTRACT.md"               "$hist/mccarthy-kernel.s"               "$hist/startup.lisp"               "$hist/tests/lisp15-library-primitives/PROVENANCE.md"               "$hist/tests/lisp15-library-functions/PROVENANCE.md"               "$hist/tests/appendix-b-funarg/PROVENANCE.md"
            then
              echo "historical mechanism missing from pinned evidence: $historical" >&2
              exit 1
            fi

            printf 'SID %s %-10s -> %-12s source=%s fit=%s status=%s\n'               "$sid" "$current" "$historical" "$source" "$fit" "$status"
          done <<<"$rows"

      - name: Verify mechanism-only names did not acquire SIDs
        shell: bash
        run: |
          set -euo pipefail
          registry=lib/surface/semantic-registry.lisp

          # label отримав SID 10101010 (рішення власника 2026-09-26) — у рядках контракту, не тут.
          for name in appq evcon evlis function funarg; do
            if grep -F -q "(en $name)" "$registry"; then
              echo "historical support mechanism unexpectedly has a sens EN identity: $name" >&2
              exit 1
            fi
          done

          echo "historical support remains mechanism-only; SID authority stays in sens"

      - name: Fail closed when private Core1 evidence is unavailable
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          echo "::error::Private Core1 historical evidence is intentionally unavailable to fork/untrusted pull requests."
          exit 1
