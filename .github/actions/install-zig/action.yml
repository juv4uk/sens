name: install-zig
description: >-
  Встановити пінований Zig 0.16.0 (дефолтний транспортний кодек SENS).
  Потрібен будь-якому кроку, що збирає sens-cli: build.rs вимагає пінований Zig.
inputs:
  version:
    description: Версія Zig (має збігатися з .zig-version)
    required: false
    default: "0.16.0"
runs:
  using: composite
  steps:
    - name: Встановити Zig 0.16.0 для хоста
      shell: bash
      run: |
        set -euo pipefail
        version="${{ inputs.version }}"
        case "${RUNNER_OS}-${RUNNER_ARCH}" in
          Linux-X64)
            os=linux; arch=x86_64; ext=tar.xz
            sha=70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00 ;;
          macOS-X64)
            os=macos; arch=x86_64; ext=tar.xz
            sha=0387557ed1877bc6a2e1802c8391953baddba76081876301c522f52977b52ba7 ;;
          macOS-ARM64)
            os=macos; arch=aarch64; ext=tar.xz
            sha=b23d70deaa879b5c2d486ed3316f7eaa53e84acf6fc9cc747de152450d401489 ;;
          Windows-X64)
            os=windows; arch=x86_64; ext=zip
            sha=68659eb5f1e4eb1437a722f1dd889c5a322c9954607f5edcf337bc3684a75a7e ;;
          *)
            echo "::error::unsupported runner ${RUNNER_OS}-${RUNNER_ARCH}" >&2
            exit 1 ;;
        esac
        archive="$RUNNER_TEMP/zig-${arch}-${os}-${version}.${ext}"
        curl --fail --location --retry 3 --silent --show-error \
          "https://ziglang.org/download/${version}/zig-${arch}-${os}-${version}.${ext}" \
          --output "$archive"
        if command -v sha256sum >/dev/null 2>&1; then
          actual="$(sha256sum "$archive" | awk '{print $1}')"
        elif command -v shasum >/dev/null 2>&1; then
          actual="$(shasum -a 256 "$archive" | awk '{print $1}')"
        else
          actual="$(openssl dgst -sha256 "$archive" | awk '{print $NF}')"
        fi
        test "$actual" = "$sha"
        if [ "$ext" = zip ]; then
          powershell -NoProfile -Command "Expand-Archive -LiteralPath '$archive' -DestinationPath '$RUNNER_TEMP' -Force"
        else
          tar -xJf "$archive" -C "$RUNNER_TEMP"
        fi
        zig_bin="$RUNNER_TEMP/zig-${arch}-${os}-${version}/zig"
        if [ -f "${zig_bin}.exe" ]; then zig_bin="${zig_bin}.exe"; fi
        echo "$RUNNER_TEMP/zig-${arch}-${os}-${version}" >> "$GITHUB_PATH"
        "$zig_bin" version
