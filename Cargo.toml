[workspace]
# Members of the Cargo workspace.
# Члени Cargo-воркспейсу.
# Mitglieder des Cargo-Workspace.
members = [
    "crates/my-lisp", "crates/my-lisp-cli",
    "crates/my-lisp-embed",
    "crates/my-lisp-literate",
    "crates/my-lisp-wasm",
    "crates/swarm-node",
    "crates/my-lisp-host",
    "crates/my-lisp-semantic",
    "crates/my-lisp-lsp",
    "crates/wsm-guard-core",
    "crates/wsm-guard-slice",
    "crates/wsm-guard-facts",
    "crates/wsm-datalog-kernel",
    "crates/xtask",
]

# Use a single shared lock-file at the workspace root.
# Використовуємо єдиний shared Cargo.lock у корені воркспейсу.
# Einzelne gemeinsame Cargo.lock-Datei im Workspace-Root.
resolver = "2"

# Release profile for wasm-pack: optimize for binary size.
# Профіль release для wasm-pack: оптимізація на розмір бінарника.
# Release-Profil für wasm-pack: Größenoptimierung.
[profile.release]
opt-level = "z"
lto = true

# Fast native profile for expensive semantic witnesses in CI. Keep the normal
# release profile size-oriented for WASM, while avoiding LTO and optimizing for
# execution speed when the meta-evaluator itself is the workload.
[profile.ci-meta]
inherits = "release"
opt-level = 3
lto = false
codegen-units = 16
