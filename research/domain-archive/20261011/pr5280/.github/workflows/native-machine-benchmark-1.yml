name: SENS Native Machine 1 performance and route evidence
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "crates/sens-host/examples/native_machine_bench.rs"
      - "benchmarks/native-machine-1/**"
      - ".github/workflows/native-machine-benchmark-1.yml"
permissions:
  contents: read
jobs:
  native-machine-one:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify benchmark evidence cannot invent speedups
        run: python3 -m unittest discover -s benchmarks/native-machine-1 -p 'test_*.py'
      - name: Compile release native benchmark
        run: cargo build --locked --release -p sens-host --example native_machine_bench
      - name: Execute real hardware and physical T5, record raw samples
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p native-bench-artifacts
          target/release/examples/native_machine_bench --reps 15 --warmups 4 > native-bench-artifacts/raw.tsv
          python3 benchmarks/native-machine-1/summarize.py native-bench-artifacts/raw.tsv --out native-bench-artifacts
          cat native-bench-artifacts/report.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sens-native-machine-1
          path: native-bench-artifacts/
          if-no-files-found: warn
