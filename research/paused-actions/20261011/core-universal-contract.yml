name: Canonical D1/D3 contract

# Перевірка поточного точного D1/D3 без історичного Function8.
on:
  pull_request:
    paths:
      - "contracts/core-universal-contract.lisp"
      - "scripts/check-core-universal-contract.py"
      - "tests/fixtures/semantic/*"
      - "crates/sens/tests/d3_empty_control.rs"
      - "crates/sens/tests/migration_eq_cond_cohort.rs"
      - "crates/sens/tests/semantic_authority.rs"
      - ".github/workflows/core-universal-contract.yml"
  push:
    branches: [main]
    paths:
      - "contracts/core-universal-contract.lisp"
      - "scripts/check-core-universal-contract.py"
      - "tests/fixtures/semantic/*"
      - "crates/sens/tests/d3_empty_control.rs"
      - "crates/sens/tests/migration_eq_cond_cohort.rs"
      - "crates/sens/tests/semantic_authority.rs"
      - ".github/workflows/core-universal-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-universal-contract:
    name: D1/D3 exact canonical control
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: core-universal-contract

      - name: Current D1/D3 exact control
        run: cargo test -p sens --test d3_empty_control -- --nocapture

      - name: Current D3 EQ and COND physical T5 witnesses
        run: cargo test -p sens --test migration_eq_cond_cohort -- --nocapture

      - name: Diff hygiene
        run: git diff --check
