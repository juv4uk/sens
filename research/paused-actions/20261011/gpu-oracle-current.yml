name: GPU admission blocked evidence (no CUDA proof)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "crates/sens/Cargo.toml"
      - "crates/sens/src/lib.rs"
      - "benchmarks/gpu-oracle-current/**"
      - ".github/workflows/gpu-oracle-current.yml"
  push:
    branches: [main]
    paths:
      - "crates/sens/Cargo.toml"
      - "crates/sens/src/lib.rs"
      - "benchmarks/gpu-oracle-current/**"
      - ".github/workflows/gpu-oracle-current.yml"

concurrency:
  group: gpu-oracle-current-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  oracle:
    # Semantic oracle verification is CPU control-plane work; never reserve CUDA.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CARGO_BUILD_JOBS: "1"
      RUST_TEST_THREADS: "1"
    steps:
      - uses: actions/checkout@v5
      - name: Validate machine-readable blocked artifact
        run: python3 -m json.tool benchmarks/gpu-oracle-current/blocked-gpu-admission.json >/dev/null
      - name: Fail closed on unratified GPU law; no Rust-owned oracle
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("benchmarks/gpu-oracle-current/blocked-gpu-admission.json").read_text())
          assert data["status"] == "BLOCKED-MECHANISM"
          assert data["positive_oracle_rows"] == []
          assert data["unblock_rule"]["forbidden"]
          print("GPU admission remains BLOCKED; no executable CUDA oracle claimed")
          PY
